# Site Settings
name: ShadowContext
title: ShadowContext | Security intelligence with signal
description: "Independent analysis of cyber threats, AI security, identity attacks, and resilient defense — written for people who protect real systems."
tags:
  - cyber security
  - threat intelligence
  - dark web
  - vulnerability
  - breach
  - hacker
show_hero: true
menu:
  - title: Home
    url: /
  - title: AI Security
    url: /category/ai-security/
  - title: Threat Intel Dashboard
    url: /category/threat-intelligence/
  - title: Knowledge Grid
    url: /resources/
  - title: Defense
    url: /category/defense/
email: shadowcontext@gmail.com
# See: https://disqus.com/
#disqus_username: disqus_username
# Contact Form Setting
# See: https://formspree.io/
formspree_form_id: mwplzzbr


# Social Media Settings
# Remove the item if you don't need it
github_username: shadowcontext
#facebook_username: shadowcontext
twitter_username: shadowcontext
instagram_username: shadowcontext
#linkedin_username: shadowcontext
#medium_username: shadowcontext


# Posts Settings
show_time_bar: true
show_modal_on_exit: false
show_modal_on_finish_post: true
two_columns_layout: true


# Advanced Settings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://shadowcontext.com"
google_analytics: ""
language: "en"
categories_folder: category
sent_message_url: "/contact/message-sent/"


# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
collections:
  authors:
    output: true
paginate_path: "/page/:num/"
show_get_theme_btn: false
use_logo: false

# Content paginator
paginate_content:
  enabled: true
  debug: false
  collections:
    - posts
  auto: false
  separator: "--page-break--"
  permalink: "/:num/"
  seo_canonical: true
  properties:
    part:
      is_generated: true
    last:
      is_generated: true
    single:
      is_generated: true

# SASS
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-paginate-content

# Exclude my node related stuff
exclude: [
  'docs/',
  'vendor/',
  'LICENSE',
  'CHANGELOG.md',
  'jekflix.gemspec',
  'package.json',
  'package-lock.json',
  'automation/',
  'src',
  'node_modules',
  'initpost.sh',
  'Gemfile',
  'Gemfile.lock',
  'gulpfile.js',
  'README.md'
]

# Theme
#version: v3.1.2
