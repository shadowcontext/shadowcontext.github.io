<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Command-free kubeconfig validation</title>
  <desc id="desc">Abstract kubeconfig tiles flow toward a luminous cyan validation prism while amber command paths are diverted away from an isolated worker chamber.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.52" stop-color="#0b2433"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#19d8d1" stop-opacity=".24"/>
      <stop offset=".56" stop-color="#1386a0" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07111d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8fff5" stop-opacity=".29"/>
      <stop offset="1" stop-color="#21aeb8" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55f1df"/>
      <stop offset="1" stop-color="#4aa8f0"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffca68"/>
      <stop offset="1" stop-color="#ef754f"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7adbd7" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 706C274 630 432 754 678 687S1112 544 1600 662V900H0Z" fill="#06101a" fill-opacity=".62"/>

  <g opacity=".88">
    <path d="M92 315C261 315 346 348 476 406" fill="none" stroke="#58b3c3" stroke-width="3" stroke-dasharray="8 16"/>
    <path d="M98 465C259 465 351 459 478 449" fill="none" stroke="#58b3c3" stroke-width="3" stroke-dasharray="8 16"/>
    <path d="M111 616C275 601 364 548 492 493" fill="none" stroke="#58b3c3" stroke-width="3" stroke-dasharray="8 16"/>
  </g>

  <g transform="translate(110 238)">
    <g transform="rotate(-8 142 74)">
      <rect width="284" height="148" rx="22" fill="#102c3c" stroke="#4b99ae" stroke-width="2"/>
      <circle cx="38" cy="38" r="10" fill="#54ddce"/>
      <path d="M65 38H222M35 74H245M35 104H178" stroke="#8ed8db" stroke-width="9" stroke-linecap="round" opacity=".72"/>
    </g>
    <g transform="translate(35 178) rotate(4 142 74)">
      <rect width="284" height="148" rx="22" fill="#102c3c" stroke="#4b99ae" stroke-width="2"/>
      <circle cx="38" cy="38" r="10" fill="#54ddce"/>
      <path d="M65 38H207M35 74H244M35 104H199" stroke="#8ed8db" stroke-width="9" stroke-linecap="round" opacity=".72"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <path d="M603 224L846 309V607L603 686 485 589V322Z" fill="url(#glass)" stroke="#65f3e3" stroke-width="4"/>
    <path d="M603 224V686M485 322L603 384 846 309M603 384V532M485 589L603 532 846 607" fill="none" stroke="#71efe4" stroke-width="3" opacity=".82"/>
    <circle cx="603" cy="458" r="68" fill="#092333" stroke="#72f7e7" stroke-width="5"/>
    <path d="M568 458l25 25 48-57" fill="none" stroke="url(#safe)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M844 411C957 411 1029 365 1114 357" fill="none" stroke="url(#warn)" stroke-width="9" stroke-linecap="round"/>
  <path d="M844 476C959 476 1015 527 1112 548" fill="none" stroke="url(#warn)" stroke-width="9" stroke-linecap="round"/>
  <g fill="#101d27" stroke="#ffae5d" stroke-width="3">
    <path d="M1069 314l88 35-35 88-88-35z"/>
    <path d="M1061 512l91 23-23 91-91-23z"/>
  </g>
  <path d="M1073 348l45 44M1118 348l-45 44M1075 549l39 39M1114 549l-39 39" stroke="#ffba61" stroke-width="8" stroke-linecap="round"/>
  <path d="M1160 375C1214 398 1214 480 1160 525" fill="none" stroke="#ef754f" stroke-width="3" stroke-dasharray="7 12" opacity=".7"/>

  <g transform="translate(1198 268)">
    <ellipse cx="172" cy="382" rx="208" ry="42" fill="#050b12" opacity=".72" filter="url(#soft)"/>
    <path d="M18 104L172 20l154 84v280l-154 84L18 384Z" fill="#0d2634" stroke="#3b8395" stroke-width="4"/>
    <path d="M18 104l154 86 154-86M172 190v278" fill="none" stroke="#3b8395" stroke-width="3"/>
    <path d="M84 224h176v126H84z" fill="#071522" stroke="#56d9d2" stroke-width="3"/>
    <path d="M112 257h120M112 286h78M112 315h99" stroke="#69d9d4" stroke-width="8" stroke-linecap="round" opacity=".68"/>
    <circle cx="287" cy="146" r="17" fill="#63eadb" filter="url(#glow)"/>
  </g>

  <g fill="#6de8df">
    <circle cx="931" cy="221" r="4"/><circle cx="1002" cy="683" r="5"/><circle cx="400" cy="188" r="4"/><circle cx="1343" cy="179" r="3"/>
  </g>
</svg>
