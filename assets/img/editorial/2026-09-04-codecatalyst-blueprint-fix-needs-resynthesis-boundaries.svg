<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ownership metadata crossing a protected blueprint resynthesis boundary</title>
  <desc id="desc">An abstract editorial scene of layered project blueprints sending amber metadata tiles toward a luminous guarded processing chamber, where teal rings constrain the flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102941"/>
      <stop offset="1" stop-color="#081b2b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f5f1" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#4da9b0" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e0d3"/>
      <stop offset="0.5" stop-color="#a7fff0"/>
      <stop offset="1" stop-color="#38aeba"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b8fff2" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#34c7bd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a2436" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020914" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#86c9d0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="810" cy="785" rx="650" ry="86" fill="#020b15" opacity="0.55"/>
  <circle cx="1120" cy="440" r="330" fill="url(#core)" opacity="0.5"/>

  <g filter="url(#shadow)" transform="translate(145 190) rotate(-7 355 250)">
    <path d="M28 82L595 18L704 120L138 184Z" fill="#18374d" stroke="#4b8191" stroke-width="4"/>
    <path d="M42 123L610 58L718 160L151 225Z" fill="#21465b" stroke="#5595a0" stroke-width="4"/>
    <path d="M57 166L624 101L733 203L166 268Z" fill="url(#paper)" stroke="#a8f3e7" stroke-width="5"/>
    <path d="M170 202L562 157" stroke="#0f6570" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
    <path d="M191 234L455 204" stroke="#0f6570" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <circle cx="127" cy="214" r="24" fill="#0d5664" stroke="#c2fff5" stroke-width="5"/>
    <path d="M117 214l8 8 17-20" fill="none" stroke="#c2fff5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity="0.95">
    <path d="M670 430C800 420 842 442 936 445" fill="none" stroke="#df9a42" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 25"/>
    <g transform="translate(700 380) rotate(9)">
      <rect width="82" height="82" rx="16" fill="#f0a94e" stroke="#ffd89b" stroke-width="4"/>
      <circle cx="27" cy="28" r="8" fill="#6b3c19"/><path d="M17 54h48" stroke="#6b3c19" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(814 468) rotate(-8)">
      <rect width="68" height="68" rx="14" fill="#d88937" stroke="#ffc87a" stroke-width="4"/>
      <circle cx="23" cy="23" r="7" fill="#603215"/><path d="M16 46h38" stroke="#603215" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(1020 205)" filter="url(#shadow)">
    <ellipse cx="185" cy="238" rx="204" ry="264" fill="#0c2638" stroke="#25566b" stroke-width="7"/>
    <ellipse cx="185" cy="238" rx="151" ry="207" fill="none" stroke="url(#gate)" stroke-width="22" filter="url(#glow)"/>
    <ellipse cx="185" cy="238" rx="104" ry="148" fill="#071926" stroke="#8af4e6" stroke-width="5"/>
    <path d="M185 130l72 42v82c0 59-32 101-72 121-40-20-72-62-72-121v-82z" fill="#123d50" stroke="#9affef" stroke-width="7"/>
    <path d="M151 242l25 25 49-61" fill="none" stroke="#aafff2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="185" cy="238" r="184" fill="none" stroke="#5bc8c2" stroke-width="3" stroke-dasharray="10 22" opacity="0.55"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M944 445h83" stroke="#ffa84b" stroke-width="12" opacity="0.85"/>
    <path d="M985 415l34 30-34 30" stroke="#ffd08b" stroke-width="8"/>
    <path d="M1388 443c64 0 87-37 114-82" stroke="#54d5cb" stroke-width="6" opacity="0.55"/>
    <path d="M1390 470c72 9 98 46 126 88" stroke="#54d5cb" stroke-width="6" opacity="0.35"/>
  </g>

  <g opacity="0.32" fill="#75ddd6">
    <circle cx="104" cy="120" r="5"/><circle cx="1360" cy="108" r="7"/><circle cx="1494" cy="680" r="5"/>
    <circle cx="911" cy="182" r="4"/><circle cx="765" cy="694" r="6"/><circle cx="319" cy="714" r="4"/>
  </g>
</svg>
