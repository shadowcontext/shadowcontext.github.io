<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected edge fleet disperses a malformed network wave</title>
  <desc id="desc">Abstract editorial artwork showing a constellation of edge-computing nodes behind layered teal shields while an angular amber network wave breaks into harmless particles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#10283a"/>
      <stop offset="1" stop-color="#081924"/>
    </linearGradient>
    <radialGradient id="halo" cx="73%" cy="47%" r="48%">
      <stop offset="0" stop-color="#4ce6ce" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#1d9fb5" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#07131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fff0"/>
      <stop offset="0.48" stop-color="#47dccd"/>
      <stop offset="1" stop-color="#147892"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff765c" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#ff8b5f"/>
      <stop offset="1" stop-color="#ffd17c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
