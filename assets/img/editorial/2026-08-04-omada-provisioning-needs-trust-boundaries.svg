<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected zero-touch network provisioning</title>
  <desc id="desc">Abstract network devices approach a luminous controller through layered blue and amber trust boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071427"/>
      <stop offset="0.55" stop-color="#0b2540"/>
      <stop offset="1" stop-color="#071a26"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#74e7ff" stop-opacity="0.55"/>
      <stop offset="0.52" stop-color="#2a8eb8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2a8eb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bf1ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#267ba8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbf58" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#ffd888" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff9f3f" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
