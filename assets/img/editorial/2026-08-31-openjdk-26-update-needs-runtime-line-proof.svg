      <circle cx="31" cy="25" r="0.8" fill="#B7ACFF" opacity="0.07"/>
      <circle cx="17" cy="42" r="0.65" fill="#8EEFFF" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#background)"/>
  <rect width="1600" height="900" rx="38" fill="url(#grain)"/>
  <ellipse cx="925" cy="448" rx="545" ry="390" fill="url(#aura)"/>

