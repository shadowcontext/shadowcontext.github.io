<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Runtime lines passing through a verification gate</title>
  <desc id="desc">Abstract violet and blue runtime lanes converge through a luminous shield-shaped gate, symbolizing version-specific update verification.</desc>
  <defs>
    <linearGradient id="background" x1="110" y1="70" x2="1460" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B22"/>
      <stop offset="0.5" stop-color="#13164A"/>
      <stop offset="1" stop-color="#071A2F"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(925 448) rotate(90) scale(390 545)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66E7FF" stop-opacity="0.32"/>
      <stop offset="0.48" stop-color="#6976FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6976FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laneA" x1="104" y1="252" x2="1401" y2="459" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E54E8" stop-opacity="0.1"/>
      <stop offset="0.48" stop-color="#8B70FF"/>
      <stop offset="1" stop-color="#5DE9FF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="laneB" x1="134" y1="672" x2="1415" y2="471" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1DB5D7" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#50D6F2"/>
      <stop offset="1" stop-color="#8C75FF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="shield" x1="774" y1="274" x2="1025" y2="645" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7F6FF" stop-opacity="0.96"/>
      <stop offset="0.42" stop-color="#5EDDF4" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#786BFF" stop-opacity="0.58"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="fineGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
