<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected endpoint-management modules receiving a coordinated update</title>
  <desc id="desc">An abstract endpoint management core is surrounded by four protected module arcs as amber access paths converge on a cyan update ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.48" stop-color="#102b3b"/>
      <stop offset="1" stop-color="#132638"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4ce5d7" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#279fb5" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#07131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9affea"/>
      <stop offset="0.5" stop-color="#46d7d5"/>
      <stop offset="1" stop-color="#278cab"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b4c32" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#f0a85a"/>
      <stop offset="1" stop-color="#ffd487"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="570" ry="390" fill="url(#halo)"/>
  <g fill="none" stroke="#54a9b7" stroke-width="2" opacity="0.18">
    <path d="M0 180C270 86 460 170 620 122S1040 54 1600 184"/>
    <path d="M0 734C310 822 440 708 650 770S1110 832 1600 716"/>
    <circle cx="800" cy="450" r="354" stroke-dasharray="6 20"/>
    <circle cx="800" cy="450" r="418" stroke-dasharray="2 28"/>
  </g>
  <g fill="#46d7d5" opacity="0.14" filter="url(#soft)">
    <circle cx="330" cy="260" r="80"/><circle cx="1270" cy="260" r="80"/>
    <circle cx="330" cy="640" r="80"/><circle cx="1270" cy="640" r="80"/>
  </g>
  <g fill="none" stroke="url(#amber)" stroke-width="8" stroke-linecap="round">
    <path d="M132 258C250 258 323 285 424 342"/>
