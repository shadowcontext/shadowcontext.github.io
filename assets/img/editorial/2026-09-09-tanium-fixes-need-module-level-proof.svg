  <circle cx="800" cy="450" r="248" fill="#091d2a" stroke="#287e95" stroke-width="5"/>
  <circle cx="800" cy="450" r="205" fill="none" stroke="url(#cyan)" stroke-width="18" stroke-dasharray="235 28" filter="url(#glow)"/>
  <circle cx="800" cy="450" r="146" fill="#113747" stroke="#82f4e5" stroke-width="7"/>
  <path d="M800 328L903 388V508L800 568L697 508V388Z" fill="#0b2635" stroke="#67e4dd" stroke-width="8"/>
  <path d="M800 370L866 408V486L800 526L734 486V408Z" fill="#175367"/>
