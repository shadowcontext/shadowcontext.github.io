<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nested isolation around a fractured WebAssembly module</title>
  <desc id="desc">Abstract nested cyan and amber containment layers hold a fractured WebAssembly-like module away from a field of host memory cells.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2b3b"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#25d7d0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#25d7d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff4e8"/>
      <stop offset="1" stop-color="#168ca6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf70"/>
      <stop offset="1" stop-color="#ef6e42"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000813" flood-opacity="0.6"/>
    </filter>
    <pattern id="cells" width="78" height="78" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="54" height="54" rx="11" fill="#173449" stroke="#2b5870" stroke-width="2"/>
      <circle cx="34" cy="34" r="5" fill="#52c9d2" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <path d="M0 675 C260 575 430 760 706 668 S1180 535 1600 665 V900 H0Z" fill="#091e2b" opacity="0.78"/>
  <g opacity="0.55">
    <rect x="70" y="112" width="360" height="610" rx="44" fill="url(#cells)" transform="rotate(-7 250 417)"/>
    <rect x="1170" y="105" width="360" height="620" rx="44" fill="url(#cells)" transform="rotate(7 1350 415)"/>
  </g>
  <ellipse cx="800" cy="470" rx="480" ry="335" fill="#1dd9d0" opacity="0.09" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <path d="M800 82 L1198 254 L1138 692 L800 820 L462 692 L402 254Z" fill="#0a2635" stroke="url(#shell)" stroke-width="18"/>
    <path d="M800 145 L1128 286 L1078 644 L800 752 L522 644 L472 286Z" fill="#0b1d2a" stroke="#47cfd0" stroke-width="6" stroke-dasharray="18 13" opacity="0.98"/>
    <path d="M800 220 L1034 320 L998 595 L800 674 L602 595 L566 320Z" fill="#112d3c" stroke="#d5faf4" stroke-width="5"/>
  </g>
  <g transform="translate(800 448)" filter="url(#shadow)">
    <path d="M-142 -142 H-18 L-42 -34 L12 -72 L-9 10 L62 -27 L39 66 L143 47 V140 H-142Z" fill="url(#core)"/>
    <path d="M-142 -142 H142 V47 L39 66 L62 -27 L-9 10 L12 -72 L-42 -34 L-18 -142Z" fill="#f4a748" opacity="0.92"/>
    <path d="M-18 -142 L-42 -34 L12 -72 L-9 10 L62 -27 L39 66" fill="none" stroke="#fff4cf" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-88" cy="-87" r="18" fill="#122c39"/>
    <circle cx="-35" cy="-87" r="18" fill="#122c39"/>
    <circle cx="18" cy="-87" r="18" fill="#122c39"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M310 260 C390 260 424 305 485 336" stroke="#4ee7dd" stroke-width="8" opacity="0.55"/>
    <path d="M1290 640 C1195 640 1160 606 1110 572" stroke="#4ee7dd" stroke-width="8" opacity="0.55"/>
    <path d="M304 634 C400 634 425 595 486 566" stroke="#f6b656" stroke-width="6" opacity="0.42"/>
    <path d="M1292 260 C1204 260 1173 300 1116 329" stroke="#f6b656" stroke-width="6" opacity="0.42"/>
  </g>
  <g fill="#8af5ea">
    <circle cx="306" cy="260" r="11"/><circle cx="1294" cy="640" r="11"/>
  </g>
  <g fill="#ffc563">
    <circle cx="302" cy="634" r="9"/><circle cx="1296" cy="260" r="9"/>
  </g>
</svg>
