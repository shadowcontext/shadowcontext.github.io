    <path d="M171 245L557 196L675 282L288 331Z" fill="#1B4962" opacity=".7"/>
    <path d="M288 331L675 282L656 642L267 692Z" fill="#0E2841" opacity=".72"/>
    <circle cx="235" cy="274" r="14" fill="#68D8CF"/>
    <circle cx="278" cy="269" r="14" fill="#438BAF"/>
    <circle cx="321" cy="263" r="14" fill="#315B82"/>
    <g fill="none" stroke-linecap="round">
