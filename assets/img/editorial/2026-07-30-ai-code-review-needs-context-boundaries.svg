<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Context boundaries around AI-assisted code review</title>
  <desc id="desc">Abstract repository panels and context fragments pass through a narrow illuminated gateway into a layered review lens, representing least-privilege access to review context.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1480" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0B2034"/>
      <stop offset="1" stop-color="#10192B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(929 447) rotate(180) scale(480 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5CE1E6" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#3E88FF" stop-opacity=".09"/>
      <stop offset="1" stop-color="#3E88FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="742" y1="217" x2="877" y2="694" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AF4E8"/>
      <stop offset=".48" stop-color="#53BEDD"/>
      <stop offset="1" stop-color="#4777DD"/>
    </linearGradient>
    <linearGradient id="lens" x1="970" y1="240" x2="1386" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78E7D7" stop-opacity=".48"/>
      <stop offset=".5" stop-color="#539FD7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8A6DE9" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="panel" x1="180" y1="235" x2="650" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173A54"/>
      <stop offset="1" stop-color="#10253D"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020712" flood-opacity=".5"/>
    </filter>
    <clipPath id="aperture">
      <rect x="784" y="258" width="66" height="384" rx="33"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <path d="M0 742C244 669 441 714 650 783C866 854 1116 846 1600 690V900H0Z" fill="#06101F" opacity=".72"/>
  <path d="M0 151C278 89 491 115 700 188C914 264 1191 238 1600 105V0H0Z" fill="#102A40" opacity=".3"/>

  <g filter="url(#shadow)">
