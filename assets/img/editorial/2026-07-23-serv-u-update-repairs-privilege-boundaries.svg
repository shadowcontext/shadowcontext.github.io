<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered access gates protecting a file transfer server</title>
  <desc id="desc">Abstract file-shaped panels travel through segmented teal and amber access gates toward a protected server core on a dark blue field.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="60" x2="1510" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071728"/>
      <stop offset="0.52" stop-color="#102A43"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientTransform="translate(1190 452) rotate(90) scale(310 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43E0CE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#43E0CE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="155" y1="469" x2="1240" y2="469" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82A0" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#5AD9D0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8EF3D9" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#56E1D2"/>
      <stop offset="1" stop-color="#187994"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD37A"/>
      <stop offset="1" stop-color="#E9874D"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020A12" flood-opacity="0.55"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="11" r="1" fill="#D8FAF3" opacity="0.08"/>
      <circle cx="31" cy="37" r="1.2" fill="#8FC8D4" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="1190" cy="452" rx="360" ry="310" fill="url(#coreGlow)"/>
