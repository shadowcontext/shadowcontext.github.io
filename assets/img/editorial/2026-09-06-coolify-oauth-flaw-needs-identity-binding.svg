<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity binding at a guarded account gateway</title>
  <desc id="desc">Abstract identity tokens approach a luminous security gateway; a bound path reaches the protected core while an unbound email path is diverted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081425"/>
      <stop offset="0.52" stop-color="#10233b"/>
      <stop offset="1" stop-color="#07101e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#2be0c2" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#2196f3" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#081425" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57efd3"/>
      <stop offset="1" stop-color="#168da4"/>
    </linearGradient>
    <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55a7ff"/>
      <stop offset="1" stop-color="#65f0ce"/>
    </linearGradient>
    <linearGradient id="unbound" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a78ff"/>
      <stop offset="1" stop-color="#ff8d83"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8cc9e8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="865" cy="430" rx="620" ry="410" fill="url(#halo)"/>
  <ellipse cx="1190" cy="470" rx="245" ry="245" fill="#2be0c2" opacity="0.07" filter="url(#soft)"/>

  <g opacity="0.26" fill="none" stroke="#85b7d5">
    <path d="M70 173C245 173 268 280 402 280"/>
    <path d="M62 694C264 694 286 596 430 596"/>
    <path d="M1260 155C1393 155 1440 222 1540 222"/>
    <circle cx="70" cy="173" r="5" fill="#85b7d5"/>
    <circle cx="62" cy="694" r="5" fill="#85b7d5"/>
    <circle cx="1540" cy="222" r="5" fill="#85b7d5"/>
  </g>

  <g>
    <path d="M145 315C330 315 402 380 575 413" fill="none" stroke="url(#trusted)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M145 315C330 315 402 380 575 413" fill="none" stroke="#77ffe0" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="145" cy="315" r="66" fill="#102d48" stroke="#62baff" stroke-width="4"/>
    <circle cx="145" cy="296" r="17" fill="#76c5ff"/>
    <path d="M111 347c8-25 25-37 34-37s27 12 35 37" fill="#76c5ff" opacity="0.9"/>
    <circle cx="213" cy="329" r="18" fill="#18364e" stroke="#63efd0" stroke-width="3"/>
    <path d="m204 329 6 6 12-14" fill="none" stroke="#63efd0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <path d="M145 595C340 595 408 542 564 508" fill="none" stroke="url(#unbound)" stroke-width="14" stroke-linecap="round" opacity="0.86"/>
    <path d="M145 595C340 595 408 542 564 508" fill="none" stroke="#d3a3ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="145" cy="595" r="66" fill="#252242" stroke="#ab83ff" stroke-width="4"/>
    <rect x="111" y="570" width="68" height="48" rx="8" fill="none" stroke="#d9bdff" stroke-width="4"/>
    <path d="m114 576 31 25 31-25" fill="none" stroke="#d9bdff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <g filter="url(#glow)">
    <path d="M690 198 842 250v191c0 116-70 203-152 251-82-48-152-135-152-251V250Z" fill="#0c2638" stroke="url(#gate)" stroke-width="8"/>
    <path d="M690 237 805 276v161c0 87-49 157-115 200-66-43-115-113-115-200V276Z" fill="#123b4a" stroke="#5ce4cb" stroke-opacity="0.44" stroke-width="2"/>
    <circle cx="690" cy="407" r="54" fill="#071b29" stroke="#5ce4cb" stroke-width="5"/>
    <circle cx="690" cy="391" r="17" fill="none" stroke="#6af2d5" stroke-width="7"/>
    <path d="M675 409h30l-5 59h-20Z" fill="#6af2d5"/>
  </g>

  <g>
    <path d="M843 426C948 426 1000 426 1075 426" fill="none" stroke="#64efd0" stroke-width="11" stroke-linecap="round"/>
    <path d="M843 426C948 426 1000 426 1075 426" fill="none" stroke="#d0fff5" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="1108" cy="426" r="116" fill="#0e3043" stroke="#62efd1" stroke-width="5"/>
    <circle cx="1108" cy="426" r="82" fill="#123b4b" stroke="#62efd1" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="1108" cy="404" r="24" fill="#6bf1d4"/>
    <path d="M1059 472c11-37 34-54 49-54s39 17 50 54" fill="#6bf1d4" opacity="0.9"/>
    <circle cx="1187" cy="498" r="31" fill="#103349" stroke="#79bfff" stroke-width="4"/>
    <path d="m1173 498 10 10 20-24" fill="none" stroke="#79bfff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <path d="M515 517c-34 52-37 105-11 157 24 49 68 77 131 84" fill="none" stroke="#ff8d83" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 20" opacity="0.75"/>
    <circle cx="649" cy="759" r="28" fill="#321f33" stroke="#ff9489" stroke-width="4"/>
    <path d="m638 748 22 22m0-22-22 22" stroke="#ffaaa2" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g opacity="0.45" fill="#84b7d1">
    <circle cx="1320" cy="666" r="4"/><circle cx="1384" cy="626" r="7"/><circle cx="1450" cy="690" r="3"/>
    <circle cx="1268" cy="734" r="3"/><circle cx="1343" cy="770" r="5"/><circle cx="1495" cy="582" r="5"/>
  </g>
</svg>
