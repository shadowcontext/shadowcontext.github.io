<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Router protected by layered firmware shields with an unresolved gap</title>
  <desc id="desc">Abstract editorial artwork showing a network router surrounded by translucent firmware layers, with a narrow amber gap awaiting verification.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.52" stop-color="#102b3b"/>
      <stop offset="1" stop-color="#21192e"/>
    </linearGradient>
    <radialGradient id="halo" cx="54%" cy="45%" r="58%">
      <stop offset="0" stop-color="#49d8c5" stop-opacity="0.24"/>
      <stop offset="0.56" stop-color="#3186a4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#071522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3fff3"/>
      <stop offset="0.58" stop-color="#45d2c1"/>
      <stop offset="1" stop-color="#2c7f9d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbd5d"/>
      <stop offset="1" stop-color="#ffe19a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="18" r="1" fill="#d7ffff" opacity="0.06"/>
      <circle cx="49" cy="43" r="0.8" fill="#ffe1a0" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <ellipse cx="820" cy="450" rx="560" ry="330" fill="#45d7c5" opacity="0.08" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M370 676 C248 552 254 334 402 226 C520 140 682 126 808 180" stroke="#214c62" stroke-width="48" opacity="0.52"/>
    <path d="M409 641 C318 537 333 366 447 283 C538 216 663 203 760 243" stroke="url(#shell)" stroke-width="12" opacity="0.72"/>
    <path d="M1194 226 C1319 332 1336 522 1230 648 C1143 751 1005 785 882 746" stroke="#25556a" stroke-width="48" opacity="0.48"/>
    <path d="M1148 281 C1238 368 1246 510 1165 601 C1097 677 994 704 902 677" stroke="url(#shell)" stroke-width="12" opacity="0.72"/>
    <path d="M808 180 C925 145 1075 163 1194 226" stroke="url(#amber)" stroke-width="18" stroke-dasharray="20 24" filter="url(#glow)"/>
  </g>

  <g transform="translate(484 354)">
    <path d="M72 112 L543 112 L602 310 L14 310 Z" fill="#0b1c29" stroke="#72e6d8" stroke-width="7"/>
    <path d="M110 112 L134 -58 M505 112 L481 -58" stroke="#7ceadc" stroke-width="13" stroke-linecap="round"/>
    <path d="M150 30 C230 -46 386 -46 466 30" fill="none" stroke="#4ebdac" stroke-width="8" opacity="0.45"/>
    <path d="M196 70 C258 17 358 17 420 70" fill="none" stroke="#69dfcf" stroke-width="8" opacity="0.72"/>
    <path d="M83 188 H531" stroke="#276078" stroke-width="5"/>
    <g fill="#69e5d4">
      <circle cx="118" cy="247" r="9"/>
      <circle cx="157" cy="247" r="9" opacity="0.68"/>
      <circle cx="196" cy="247" r="9" opacity="0.42"/>
    </g>
    <path d="M332 217 h126 a22 22 0 0 1 22 22 v17 a22 22 0 0 1-22 22 H332 a22 22 0 0 1-22-22 v-17 a22 22 0 0 1 22-22 Z" fill="#132e3d" stroke="#f5c56f" stroke-width="4"/>
    <path d="M353 248 H438" stroke="url(#amber)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(1133 187)" filter="url(#glow)">
    <circle r="76" fill="#101c28" stroke="#f4c36c" stroke-width="8"/>
    <path d="M-19 -18 C-19-43 19-43 19-18 V3" fill="none" stroke="#ffe09a" stroke-width="10" stroke-linecap="round"/>
    <path d="M-34 3 H34 V43 H-34 Z" fill="#d99743" stroke="#ffe09a" stroke-width="5"/>
    <circle cy="22" r="6" fill="#1a2630"/>
  </g>

  <g opacity="0.24" fill="none" stroke="#65d7ca" stroke-width="2">
    <circle cx="792" cy="456" r="328"/>
    <circle cx="792" cy="456" r="386" stroke-dasharray="5 18"/>
  </g>
  <path d="M0 788 C278 715 521 815 792 777 C1092 735 1316 690 1600 752 L1600 900 L0 900 Z" fill="#030a11" opacity="0.62"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
</svg>
