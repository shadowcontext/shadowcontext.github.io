<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified release boundary for network planning</title>
  <desc id="desc">Abstract network-planning layers pass through four guarded channels and converge on a luminous shield representing verified fixed software.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.52" stop-color="#112c45"/>
      <stop offset="1" stop-color="#090f1c"/>
    </linearGradient>
    <radialGradient id="aura" cx="68%" cy="49%" r="46%">
      <stop offset="0" stop-color="#50efc6" stop-opacity="0.34"/>
      <stop offset="0.46" stop-color="#2b9fd0" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2671aa" stop-opacity="0.32"/>
      <stop offset="0.54" stop-color="#56bfe4"/>
      <stop offset="1" stop-color="#79f2ce"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fff7"/>
      <stop offset="0.42" stop-color="#64ebcd"/>
      <stop offset="1" stop-color="#238fca"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="17" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>

