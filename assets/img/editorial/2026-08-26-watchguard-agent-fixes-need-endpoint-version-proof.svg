<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified security-agent update across an endpoint fleet</title>
  <desc id="desc">An abstract fleet of blue endpoint tiles surrounds a teal security ring while an amber update wave reaches and illuminates every device.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061725"/>
      <stop offset="0.55" stop-color="#0a2940"/>
      <stop offset="1" stop-color="#07131e"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#2bd6c5" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#168ca7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#061725" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#75f0dc"/>
      <stop offset="1" stop-color="#138ea3"/>
    </linearGradient>
    <linearGradient id="update" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43"/>
      <stop offset="0.5" stop-color="#ffd46d"/>
      <stop offset="1" stop-color="#fff0a8"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
