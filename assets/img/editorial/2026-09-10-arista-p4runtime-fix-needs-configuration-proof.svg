<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Programmable network control protected by layered authentication</title>
  <desc id="desc">Abstract network switch lanes feed a programmable control core through a layered teal authentication barrier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2635"/>
      <stop offset="1" stop-color="#102f3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#60a5fa" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4f64"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#93c5fd" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="840" cy="440" rx="650" ry="430" fill="url(#glow)"/>
  <g opacity=".65" filter="url(#soft)">
    <circle cx="250" cy="180" r="110" fill="#1d4ed8" opacity=".18"/>
    <circle cx="1350" cy="720" r="150" fill="#14b8a6" opacity=".13"/>
  </g>
  <g fill="none" stroke="url(#lane)" stroke-width="10" stroke-linecap="round">
    <path d="M90 240H510C585 240 615 310 690 310H770"/>
    <path d="M90 360H470C570 360 600 395 690 395H770"/>
    <path d="M90 540H470C570 540 600 505 690 505H770"/>
    <path d="M90 660H510C585 660 615 590 690 590H770"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="145" cy="240" r="12"/><circle cx="315" cy="240" r="8"/><circle cx="525" cy="246" r="10"/>
    <circle cx="170" cy="360" r="9"/><circle cx="390" cy="360" r="12"/><circle cx="595" cy="388" r="8"/>
    <circle cx="135" cy="540" r="10"/><circle cx="345" cy="540" r="8"/><circle cx="585" cy="512" r="12"/>
    <circle cx="195" cy="660" r="12"/><circle cx="430" cy="660" r="8"/><circle cx="615" cy="605" r="10"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M705 155L805 115L905 155V745L805 785L705 745Z" fill="#0a3340" stroke="#5eead4" stroke-opacity=".45" stroke-width="3"/>
    <path d="M735 185L805 157L875 185V715L805 743L735 715Z" fill="url(#barrier)" opacity=".9"/>
    <path d="M770 220H840V680H770Z" fill="#062b33" opacity=".85"/>
    <circle cx="805" cy="450" r="48" fill="#99f6e4" opacity=".92"/>
    <path d="M784 448l15 15 29-32" fill="none" stroke="#064e4b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M980 205L1320 315V590L980 700L910 650V255Z" fill="url(#core)" stroke="#38bdf8" stroke-opacity=".35" stroke-width="3"/>
    <path d="M980 205V700" stroke="#67e8f9" stroke-opacity=".55" stroke-width="4"/>
    <g fill="#22d3ee" opacity=".8">
      <rect x="1030" y="285" width="190" height="22" rx="11"/>
      <rect x="1030" y="345" width="235" height="22" rx="11" opacity=".72"/>
      <rect x="1030" y="405" width="155" height="22" rx="11" opacity=".58"/>
      <rect x="1030" y="465" width="215" height="22" rx="11" opacity=".66"/>
