      <circle cx="1210" cy="416" r="11"/>
      <circle cx="1275" cy="476" r="11"/>
      <circle cx="1230" cy="536" r="11"/>
    </g>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" opacity=".82">
    <path d="M910 310H945"/><path d="M910 405H945"/><path d="M910 500H945"/><path d="M910 595H945"/>
  </g>
  <g opacity=".42" fill="#a7f3d0">
    <circle cx="1460" cy="230" r="7"/><circle cx="1405" cy="335" r="5"/><circle cx="1485" cy="470" r="9"/>
    <circle cx="1380" cy="625" r="7"/><circle cx="1460" cy="715" r="5"/>
  </g>
</svg>
