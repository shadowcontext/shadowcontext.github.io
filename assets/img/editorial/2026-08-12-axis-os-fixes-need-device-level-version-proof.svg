<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered firmware protection for network edge devices</title>
  <desc id="desc">Abstract edge-device apertures sit behind layered blue firmware shields as five update rings converge on a verified central core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0b2740"/>
      <stop offset="1" stop-color="#10192f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#b9fbff"/>
      <stop offset="0.22" stop-color="#41d9e6"/>
      <stop offset="0.65" stop-color="#167ba5"/>
      <stop offset="1" stop-color="#0b2948"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58e0e9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2260a8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc96a"/>
      <stop offset="1" stop-color="#ef7654"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="mesh" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#75c8de" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#8ce8ef" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <path d="M0 678C260 566 399 741 650 624s442-89 950-294v570H0Z" fill="#0b3a57" fill-opacity="0.28"/>
  <path d="M0 738C305 606 461 798 718 672s473-87 882-235" fill="none" stroke="#4ccbd7" stroke-opacity="0.18" stroke-width="3"/>

  <g opacity="0.62">
    <g transform="translate(190 214)"><rect width="248" height="174" rx="34" fill="#102f4d" stroke="#52aeca" stroke-width="3"/><circle cx="124" cy="87" r="54" fill="#08182a" stroke="#4facc8" stroke-width="8"/><circle cx="124" cy="87" r="21" fill="#1b789b"/></g>
    <g transform="translate(1162 214)"><rect width="248" height="174" rx="34" fill="#102f4d" stroke="#52aeca" stroke-width="3"/><circle cx="124" cy="87" r="54" fill="#08182a" stroke="#4facc8" stroke-width="8"/><circle cx="124" cy="87" r="21" fill="#1b789b"/></g>
    <g transform="translate(214 580)"><rect width="220" height="142" rx="30" fill="#102f4d" stroke="#438cae" stroke-width="3"/><circle cx="110" cy="71" r="43" fill="#08182a" stroke="#438cae" stroke-width="7"/></g>
    <g transform="translate(1166 580)"><rect width="220" height="142" rx="30" fill="#102f4d" stroke="#438cae" stroke-width="3"/><circle cx="110" cy="71" r="43" fill="#08182a" stroke="#438cae" stroke-width="7"/></g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M420 302C544 302 579 369 655 402" stroke="#4fd1dc" stroke-opacity="0.38" stroke-width="5"/>
    <path d="M1180 302C1056 302 1021 369 945 402" stroke="#4fd1dc" stroke-opacity="0.38" stroke-width="5"/>
    <path d="M429 650C554 622 585 548 660 506" stroke="#4fd1dc" stroke-opacity="0.28" stroke-width="5"/>
    <path d="M1171 650C1046 622 1015 548 940 506" stroke="#4fd1dc" stroke-opacity="0.28" stroke-width="5"/>
  </g>

  <g transform="translate(800 450)">
    <circle r="252" fill="#0a1f37" fill-opacity="0.8" stroke="#275a81" stroke-width="2"/>
    <circle r="218" fill="none" stroke="#2f789a" stroke-width="16" stroke-dasharray="154 38" transform="rotate(-18)"/>
    <circle r="184" fill="none" stroke="#42a5bc" stroke-width="14" stroke-dasharray="116 29" transform="rotate(21)"/>
    <circle r="151" fill="none" stroke="#54c8d2" stroke-width="12" stroke-dasharray="85 22" transform="rotate(-36)"/>
    <circle r="121" fill="none" stroke="#72e4e7" stroke-width="10" stroke-dasharray="60 16" transform="rotate(9)"/>
    <path d="M0-175C81-153 137-121 137-48v75c0 96-68 150-137 179-69-29-137-83-137-179v-75c0-73 56-105 137-127Z" fill="url(#shield)" stroke="#8af0ef" stroke-width="4"/>
    <circle r="78" fill="url(#core)" filter="url(#glow)"/>
    <path d="M-32 1l22 23 47-55" fill="none" stroke="#e7ffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="800" cy="177" r="13" fill="url(#amber)"/>
    <circle cx="1059" cy="365" r="10" fill="#70e5e8"/>
    <circle cx="960" cy="671" r="10" fill="#70e5e8"/>
    <circle cx="640" cy="671" r="10" fill="#70e5e8"/>
    <circle cx="541" cy="365" r="10" fill="#70e5e8"/>
  </g>
  <path d="M800 190v54M1047 374l-50 17M952 660l-32-43M648 660l32-43M553 374l50 17" stroke="#9af5f2" stroke-opacity="0.62" stroke-width="4" stroke-linecap="round"/>
</svg>
