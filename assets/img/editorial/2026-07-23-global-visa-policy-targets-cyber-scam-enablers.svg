      <stop offset=".38" stop-color="#43dce0"/>
      <stop offset=".72" stop-color="#2987ba"/>
      <stop offset="1" stop-color="#173d68"/>
    </linearGradient>
    <linearGradient id="glass" x1="876" y1="236" x2="1299" y2="694" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61e9ec" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#1e7297" stop-opacity=".06"/>
      <stop offset="1" stop-color="#123254" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="ember" x1="171" y1="229" x2="712" y2="657" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb35f"/>
      <stop offset=".48" stop-color="#ef5d59"/>
      <stop offset="1" stop-color="#8a294c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
