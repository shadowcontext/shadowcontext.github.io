<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A global scam network meeting layered defensive borders</title>
  <desc id="desc">An abstract dark globe carries red network nodes toward a luminous circular border, while layered teal barriers protect a bright identity core.</desc>
  <defs>
    <linearGradient id="bg" x1="86" y1="42" x2="1510" y2="864" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061525"/>
      <stop offset=".48" stop-color="#102c42"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(1122 448) rotate(90) scale(330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79fff0" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#2cc9cf" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1eb9c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="threat" cx="0" cy="0" r="1" gradientTransform="translate(394 468) rotate(18) scale(430 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6d62" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff6d62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="796" y1="172" x2="1278" y2="728" gradientUnits="userSpaceOnUse">
