<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contained delayed signal at a separating USB4 connection</title>
  <desc id="desc">Abstract editorial artwork showing a teal USB4 connection separating while an amber delayed signal is contained behind a luminous kernel boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071824"/>
      <stop offset="0.52" stop-color="#0b2934"/>
      <stop offset="1" stop-color="#09131f"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="49%" r="53%">
      <stop offset="0" stop-color="#39e6d0" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#1aa8ab" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071824" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123b4a"/>
      <stop offset=".55" stop-color="#1b7080"/>
      <stop offset="1" stop-color="#43e3cc"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7fff3"/>
      <stop offset=".34" stop-color="#42d7c6"/>
      <stop offset="1" stop-color="#126478"/>
    </linearGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7fff0" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#24cfbf" stop-opacity=".58"/>
      <stop offset="1" stop-color="#0c6576" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#fff4bd"/>
      <stop offset=".28" stop-color="#ffc45c"/>
      <stop offset="1" stop-color="#f18b36" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="13" r="1" fill="#b9fff3" opacity=".08"/>
      <circle cx="47" cy="29" r="1.2" fill="#b9fff3" opacity=".05"/>
      <circle cx="25" cy="55" r=".8" fill="#ffc96b" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="745" rx="560" ry="78" fill="#020a11" opacity=".5" filter="url(#soft)"/>

  <g opacity=".22" fill="none" stroke="#62e8d4" stroke-width="3">
    <path d="M128 244 C390 143 518 210 660 320"/>
    <path d="M1472 652 C1210 753 1082 690 940 578"/>
    <path d="M252 692 C480 780 582 710 680 610"/>
  </g>

  <path d="M0 443 C190 432 285 497 434 503 L612 503 L612 618 L430 618 C270 609 171 552 0 561Z" fill="url(#cable)"/>
  <path d="M1600 337 C1405 341 1313 406 1170 414 L998 414 L998 529 L1176 529 C1324 518 1429 457 1600 459Z" fill="url(#cable)"/>

  <g transform="rotate(0 660 560)">
    <rect x="585" y="474" width="118" height="174" rx="28" fill="#0d3445" stroke="#58e8d4" stroke-width="5"/>
    <rect x="635" y="496" width="96" height="130" rx="24" fill="url(#plug)"/>
    <rect x="668" y="520" width="38" height="82" rx="14" fill="#092c3b"/>
    <circle cx="687" cy="548" r="6" fill="#94ffee"/>
    <circle cx="687" cy="576" r="6" fill="#94ffee"/>
  </g>
  <g transform="rotate(0 940 472)">
    <rect x="897" y="385" width="118" height="174" rx="28" fill="#0d3445" stroke="#58e8d4" stroke-width="5"/>
    <rect x="869" y="407" width="96" height="130" rx="24" fill="url(#plug)"/>
    <rect x="894" y="431" width="38" height="82" rx="14" fill="#092c3b"/>
    <circle cx="913" cy="459" r="6" fill="#94ffee"/>
    <circle cx="913" cy="487" r="6" fill="#94ffee"/>
  </g>

  <g filter="url(#glow)">
    <ellipse cx="800" cy="450" rx="112" ry="286" fill="none" stroke="url(#barrier)" stroke-width="18"/>
    <ellipse cx="800" cy="450" rx="78" ry="244" fill="#27d7c2" opacity=".045"/>
  </g>
  <path d="M800 185 C775 282 775 618 800 715" fill="none" stroke="#c0fff3" stroke-width="3" opacity=".8"/>

  <g filter="url(#glow)">
    <circle cx="880" cy="577" r="84" fill="url(#pulse)" opacity=".92"/>
    <circle cx="880" cy="577" r="16" fill="#fff0ad"/>
  </g>
  <path d="M1054 630 C986 620 944 601 902 583" fill="none" stroke="#f7a645" stroke-width="10" stroke-linecap="round" opacity=".72"/>
  <path d="M1054 630 C986 620 944 601 902 583" fill="none" stroke="#ffe2a1" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <g fill="#ffc05c">
    <circle cx="1090" cy="635" r="7" opacity=".55"/>
    <circle cx="1123" cy="626" r="4" opacity=".4"/>
    <circle cx="1148" cy="642" r="3" opacity=".28"/>
  </g>

  <g fill="none" stroke="#75f6df" opacity=".38">
    <ellipse cx="800" cy="450" rx="142" ry="324" stroke-width="2"/>
    <ellipse cx="800" cy="450" rx="178" ry="356" stroke-width="1"/>
  </g>
</svg>
