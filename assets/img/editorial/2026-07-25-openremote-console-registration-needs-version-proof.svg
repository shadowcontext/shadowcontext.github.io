    <circle cx="1002" cy="381" r="6"/>
    <circle cx="1016" cy="444" r="6"/>
    <circle cx="998" cy="517" r="6"/>
  </g>
  <g fill="#F4B95F">
    <circle cx="552" cy="405" r="5" opacity="0.85"/>
    <circle cx="1048" cy="405" r="5" opacity="0.85"/>
  </g>
  <g stroke="#F4B95F" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M517 405h23"/>
    <path d="M1060 405h23"/>
  </g>
