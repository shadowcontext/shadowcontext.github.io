      <path d="M0 35V104L60 139V70Z" fill="#1b4655" stroke="#78d7cf" stroke-width="3"/>
      <path d="M120 35V104L60 139V70Z" fill="#2a626c" stroke="#78d7cf" stroke-width="3"/>
    </g>
    <g transform="translate(130 544)">
      <path d="M0 31 54 0 108 31 54 62Z" fill="#326878" stroke="#65b8c5" stroke-width="3"/>
      <path d="M0 31V93L54 124V62Z" fill="#17384a" stroke="#65b8c5" stroke-width="3"/>
      <path d="M108 31V93L54 124V62Z" fill="#255264" stroke="#65b8c5" stroke-width="3"/>
    </g>
  </g>

  <path d="M285 300 C410 300 435 350 570 350" fill="none" stroke="url(#flow)" stroke-width="9" stroke-linecap="round"/>
  <path d="M458 460 C500 460 520 450 570 450" fill="none" stroke="url(#flow)" stroke-width="11" stroke-linecap="round"/>
  <path d="M238 606 C385 606 445 550 570 550" fill="none" stroke="url(#flow)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <g>
