<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded artifact repository boundary</title>
  <desc id="desc">Abstract package blocks move through a luminous repository gateway while an oversized block is diverted away from organized storage shelves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102c3e"/>
      <stop offset="1" stop-color="#181a32"/>
    </linearGradient>
    <radialGradient id="aura" cx="52%" cy="48%" r="55%">
      <stop offset="0" stop-color="#53e0ca" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#238aa3" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4fff3" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#49d9c4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#143348" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39718a" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#63e4cf"/>
      <stop offset="1" stop-color="#d1fff6"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd178"/>
      <stop offset="0.55" stop-color="#f0836f"/>
      <stop offset="1" stop-color="#7a3551"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <pattern id="grain" width="52" height="52" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="13" r="1" fill="#efffff" opacity="0.045"/>
      <circle cx="39" cy="34" r="0.8" fill="#efffff" opacity="0.04"/>
      <circle cx="19" cy="47" r="0.6" fill="#efffff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="820" cy="430" rx="650" ry="430" fill="url(#aura)"/>
  <circle cx="240" cy="175" r="175" fill="#276e8a" opacity="0.13" filter="url(#soft)"/>
  <circle cx="1390" cy="690" r="230" fill="#70395c" opacity="0.12" filter="url(#soft)"/>

  <g opacity="0.45" fill="none" stroke="#507d91" stroke-width="3">
    <path d="M30 286 H535"/><path d="M30 448 H535"/><path d="M30 610 H535"/>
    <circle cx="76" cy="286" r="7"/><circle cx="178" cy="448" r="7"/><circle cx="306" cy="610" r="7"/>
  </g>

  <g stroke-linejoin="round">
    <g transform="translate(158 218)">
      <path d="M0 42 72 0 144 42 72 84Z" fill="#315f76" stroke="#65b8c5" stroke-width="3"/>
