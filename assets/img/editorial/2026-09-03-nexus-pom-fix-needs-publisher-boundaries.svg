    <rect x="682" y="327" width="178" height="72" rx="16" fill="#1a4d59" stroke="#75e4d5" stroke-width="3"/>
    <rect x="682" y="443" width="178" height="72" rx="16" fill="#1a4d59" stroke="#75e4d5" stroke-width="3"/>
    <rect x="682" y="559" width="178" height="72" rx="16" fill="#1a4d59" stroke="#75e4d5" stroke-width="3"/>
    <circle cx="771" cy="479" r="18" fill="#9affee" opacity="0.75" filter="url(#glow)"/>
  </g>

  <g transform="translate(472 250)" stroke-linejoin="round">
    <path d="M0 62 106 0 212 62 106 124Z" fill="url(#warn)" stroke="#ffd18b" stroke-width="4"/>
    <path d="M0 62V188L106 250V124Z" fill="#7e3f50" stroke="#f4a078" stroke-width="4"/>
    <path d="M212 62V188L106 250V124Z" fill="#a95756" stroke="#f4a078" stroke-width="4"/>
    <path d="M52 79 159 16" stroke="#ffe0a6" stroke-width="5" opacity="0.7"/>
  </g>
  <path d="M545 505 C512 550 487 587 442 626" fill="none" stroke="#f39a73" stroke-width="10" stroke-linecap="round"/>
  <circle cx="421" cy="650" r="48" fill="#351c31" stroke="#f3a277" stroke-width="4"/>
  <path d="M399 628 443 672M443 628 399 672" stroke="#ffd299" stroke-width="8" stroke-linecap="round"/>

