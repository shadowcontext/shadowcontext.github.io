    <g fill="#185061" stroke="#68daca" stroke-width="3">
      <rect x="61" y="57" width="76" height="76" rx="10"/><rect x="157" y="72" width="76" height="61" rx="10"/><rect x="253" y="48" width="76" height="85" rx="10"/>
      <rect x="61" y="166" width="76" height="88" rx="10"/><rect x="157" y="182" width="76" height="72" rx="10"/><rect x="253" y="171" width="76" height="83" rx="10"/>
      <rect x="61" y="298" width="76" height="77" rx="10"/><rect x="157" y="286" width="76" height="89" rx="10"/><rect x="253" y="310" width="76" height="65" rx="10"/>
      <rect x="61" y="417" width="76" height="79" rx="10"/><rect x="157" y="430" width="76" height="66" rx="10"/><rect x="253" y="409" width="76" height="87" rx="10"/>
    </g>
  </g>

  <path d="M972 363 C1017 363 1030 351 1080 351" fill="none" stroke="#b9fff3" stroke-width="9" stroke-linecap="round"/>
  <path d="M972 479 C1018 479 1034 472 1080 472" fill="none" stroke="#70dfd0" stroke-width="11" stroke-linecap="round"/>
  <path d="M972 595 C1016 595 1031 593 1080 593" fill="none" stroke="#55b9bb" stroke-width="8" stroke-linecap="round"/>

  <g fill="#a2fff1" opacity="0.55">
    <circle cx="1022" cy="363" r="5"/><circle cx="1047" cy="472" r="6"/><circle cx="1007" cy="595" r="4"/>
  </g>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <path d="M0 842C290 790 520 875 812 832S1300 788 1600 850V900H0Z" fill="#030a12" opacity="0.58"/>
</svg>
