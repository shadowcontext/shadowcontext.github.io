<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered security filters protecting an email message</title>
  <desc id="desc">An abstract envelope moves through translucent cyan security layers while amber fragments are redirected into isolated side channels, representing verification across webmail message paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10283a"/>
      <stop offset="1" stop-color="#08121c"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dffbff"/>
      <stop offset="1" stop-color="#67dce7"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72f2ed" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#168fa8" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#54e5e2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#54e5e2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="820" cy="450" r="430" fill="url(#glow)"/>
  <g opacity="0.13" fill="none" stroke="#96dfe7" stroke-width="2">
    <path d="M0 170 C310 90 480 270 780 180 S1280 90 1600 190"/>
    <path d="M0 730 C300 650 520 820 850 710 S1300 630 1600 730"/>
    <path d="M155 0 C240 220 115 410 220 900"/>
    <path d="M1420 0 C1325 240 1460 520 1370 900"/>
  </g>
  <g transform="translate(285 273)" filter="url(#shine)">
    <rect x="0" y="0" width="430" height="282" rx="30" fill="url(#mail)" stroke="#eaffff" stroke-width="5"/>
    <path d="M18 28 L215 162 L412 28" fill="none" stroke="#0c7892" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 254 L164 128 M412 254 L266 128" fill="none" stroke="#1994a8" stroke-width="14" stroke-linecap="round" opacity="0.72"/>
  </g>
  <g>
    <path d="M770 180 L865 140 L865 760 L770 720 Z" fill="url(#gate)" stroke="#83fff7" stroke-width="4"/>
    <path d="M925 145 L1020 190 L1020 710 L925 755 Z" fill="url(#gate)" stroke="#83fff7" stroke-width="4"/>
    <path d="M1080 208 L1175 260 L1175 640 L1080 692 Z" fill="url(#gate)" stroke="#83fff7" stroke-width="4"/>
    <g fill="#c8ffff">
      <circle cx="817" cy="288" r="9"/><circle cx="817" cy="450" r="9"/><circle cx="817" cy="612" r="9"/>
      <circle cx="972" cy="300" r="9"/><circle cx="972" cy="450" r="9"/><circle cx="972" cy="600" r="9"/>
      <circle cx="1127" cy="340" r="9"/><circle cx="1127" cy="450" r="9"/><circle cx="1127" cy="560" r="9"/>
    </g>
  </g>
  <g fill="none" stroke="#f7ad55" stroke-width="13" stroke-linecap="round" filter="url(#shine)">
    <path d="M738 330 C810 330 790 245 748 220"/>
    <path d="M875 555 C930 555 905 680 848 700"/>
    <path d="M1030 355 C1085 355 1060 275 1030 250"/>
    <path d="M1185 520 C1245 520 1250 610 1305 630"/>
  </g>
  <g fill="#ffc066">
    <path d="M728 207 l34 8 -19 30 z"/>
    <path d="M829 696 l35 -10 -8 34 z"/>
    <path d="M1017 237 l31 12 -24 24 z"/>
    <path d="M1293 614 l31 25 -38 10 z"/>
  </g>
  <g transform="translate(1230 350)" opacity="0.9">
    <rect width="190" height="200" rx="42" fill="#123c4d" stroke="#67e6e6" stroke-width="4"/>
    <path d="M47 66 H143 M47 101 H123 M47 136 H137" stroke="#b9ffff" stroke-width="11" stroke-linecap="round"/>
    <circle cx="151" cy="101" r="13" fill="#60e1d7"/>
  </g>
  <g opacity="0.45" filter="url(#soft)" fill="#44d9df">
    <ellipse cx="830" cy="780" rx="330" ry="35"/>
  </g>
</svg>
