<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Silicon switch paths secured by layered controls</title>
  <desc id="desc">Abstract editorial artwork of a luminous switch silicon tile surrounded by layered access barriers while two exposed network paths are sealed.</desc>
  <defs>
    <linearGradient id="background" x1="110" y1="45" x2="1490" y2="855" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#122842"/>
      <stop offset="1" stop-color="#080D19"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(810 448) rotate(90) scale(410 610)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53E4D1" stop-opacity="0.25"/>
      <stop offset="0.62" stop-color="#176C8E" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="600" y1="285" x2="1010" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75F3DD"/>
      <stop offset="0.45" stop-color="#238EAD"/>
      <stop offset="1" stop-color="#194266"/>
    </linearGradient>
    <linearGradient id="glass" x1="495" y1="178" x2="1105" y2="742" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4FFF2" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#49CFCF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#2A78B5" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>
