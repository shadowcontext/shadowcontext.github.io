    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02070e" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#91b8cc" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="465" rx="620" ry="330" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 682C250 596 406 626 610 565C829 499 936 365 1155 355C1325 348 1455 405 1600 392V900H0Z" fill="#0d2035" opacity="0.8"/>
