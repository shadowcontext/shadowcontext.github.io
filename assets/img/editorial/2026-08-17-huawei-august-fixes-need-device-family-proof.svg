<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Security update wave crossing a mixed device fleet</title>
  <desc id="desc">Polished abstract editorial artwork showing layered device silhouettes receiving a teal security update wave, representing device-family patch verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102943"/>
      <stop offset="1" stop-color="#0a1728"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31e5c5" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#31e5c5" stop-opacity="0.72"/>
      <stop offset="0.7" stop-color="#64f0d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#86ffd9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#234d69"/>
      <stop offset="1" stop-color="#102a42"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35e7c2" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#35e7c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
