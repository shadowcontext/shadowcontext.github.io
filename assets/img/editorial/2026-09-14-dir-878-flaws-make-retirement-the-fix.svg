    <path d="M74 132 L95 -32 M402 132 L381 -32" stroke="#8290a0" stroke-width="12" stroke-linecap="round" opacity="0.56"/>
    <path d="M68 188 H410" stroke="#9cacba" stroke-width="4" opacity="0.28"/>
    <circle cx="96" cy="219" r="7" fill="#c18b62" opacity="0.5"/>
    <circle cx="126" cy="219" r="7" fill="#718293" opacity="0.35"/>
    <circle cx="156" cy="219" r="7" fill="#718293" opacity="0.28"/>
    <g stroke="#24384a" stroke-width="4" opacity="0.58">
      <path d="M190 150 L219 132 L246 153 L275 132 L304 154 L333 132"/>
      <path d="M190 171 L219 153 L246 174 L275 153 L304 175 L333 153"/>
    </g>
  </g>
  <path d="M585 585 C748 585 750 472 900 472" fill="none" stroke="url(#signal)" stroke-width="18" stroke-linecap="round" stroke-dasharray="2 28" filter="url(#glow)"/>
  <g transform="translate(1015 444)" filter="url(#glow)">
    <circle r="248" fill="#081522" fill-opacity="0.7" stroke="#244b62" stroke-width="42" opacity="0.82"/>
    <circle r="220" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <circle r="181" fill="none" stroke="#8cf4e5" stroke-width="2" stroke-dasharray="4 17" opacity="0.5"/>
  </g>
  <g transform="translate(883 330)">
    <path d="M74 218 L336 218 L368 330 L42 330 Z" fill="#11283a" stroke="#70e5d7" stroke-width="6"/>
    <path d="M104 218 L120 74 M306 218 L290 74" stroke="#73e4d7" stroke-width="11" stroke-linecap="round"/>
    <path d="M128 127 C171 87 239 87 282 127" fill="none" stroke="#f1be6d" stroke-width="7" stroke-linecap="round"/>
    <path d="M155 158 C183 134 227 134 255 158" fill="none" stroke="#f1be6d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="205" cy="184" r="9" fill="#ffe09b"/>
