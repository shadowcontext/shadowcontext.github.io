<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aging router crossing a replacement boundary</title>
  <desc id="desc">Abstract editorial artwork of an aging wireless router fading into shadow while a bright circular boundary opens toward a protected modern network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.52" stop-color="#14263a"/>
      <stop offset="1" stop-color="#24192f"/>
    </linearGradient>
    <radialGradient id="aura" cx="68%" cy="46%" r="58%">
      <stop offset="0" stop-color="#53dbc9" stop-opacity="0.30"/>
      <stop offset="0.48" stop-color="#287f9b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7fff0"/>
      <stop offset="0.55" stop-color="#48d5c4"/>
      <stop offset="1" stop-color="#f4bd68"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f91a5" stop-opacity="0.05"/>
      <stop offset="0.55" stop-color="#68d8cc" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#ffd17a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <pattern id="dust" width="58" height="58" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="16" r="1" fill="#d8fbff" opacity="0.07"/>
      <circle cx="43" cy="41" r="0.8" fill="#ffd797" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <ellipse cx="1110" cy="430" rx="420" ry="330" fill="#57dfcd" opacity="0.08" filter="url(#blur)"/>
  <g opacity="0.28" fill="none" stroke="#7890a3" stroke-width="3">
    <path d="M190 320 C310 218 482 218 602 320"/>
    <path d="M248 377 C338 301 454 301 544 377"/>
    <path d="M314 430 C362 390 430 390 478 430"/>
  </g>
