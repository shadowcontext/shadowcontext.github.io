<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected travel technology in an airport</title>
  <desc id="desc">An abstract airport scene shows a phone and suitcase behind a luminous shield while wireless and charging signals remain outside the protected boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172b"/>
      <stop offset="0.55" stop-color="#102b46"/>
      <stop offset="1" stop-color="#163a4d"/>
    </linearGradient>
    <radialGradient id="dawn" cx="73%" cy="28%" r="54%">
      <stop offset="0" stop-color="#ffce78" stop-opacity=".48"/>
      <stop offset=".45" stop-color="#f28c68" stop-opacity=".14"/>
      <stop offset="1" stop-color="#07172b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be9dc" stop-opacity=".42"/>
      <stop offset=".52" stop-color="#45bfc0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#effff7" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d9fff4" stop-opacity=".92"/>
      <stop offset=".45" stop-color="#54e0c1" stop-opacity=".72"/>
      <stop offset="1" stop-color="#1a9fa4" stop-opacity=".56"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4bd63"/>
      <stop offset="1" stop-color="#d96a52"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dawn)"/>

