<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pre-deployment hardening for agentic applications</title>
  <desc id="desc">Abstract layers of prompts and data pass through a faceted security shield before reaching a network of AI-agent tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102a43"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f2" stop-opacity="0.18"/>
      <stop offset="0.58" stop-color="#72e6c2" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#b6f36f" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af7db" stop-opacity="0.95"/>
      <stop offset="0.52" stop-color="#2fc5bd" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#167aa0" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="840" cy="450" r="360" fill="url(#halo)" filter="url(#soft)"/>
  <g opacity="0.22" fill="none" stroke="#7dd3fc" stroke-width="2">
    <path d="M70 174 C300 90 420 250 640 180"/>
    <path d="M30 714 C240 610 410 770 645 690"/>
    <path d="M1010 145 C1220 60 1390 195 1570 120"/>
    <path d="M1030 760 C1230 670 1410 815 1590 720"/>
  </g>
  <g transform="translate(75 0)">
    <path d="M0 302 C240 302 390 338 610 390 C690 410 730 420 790 420" fill="none" stroke="url(#flow)" stroke-width="46" stroke-linecap="round"/>
    <path d="M0 444 C260 444 410 444 790 444" fill="none" stroke="url(#flow)" stroke-width="34" stroke-linecap="round"/>
    <path d="M0 587 C245 587 410 548 615 494 C690 474 735 467 790 467" fill="none" stroke="url(#flow)" stroke-width="46" stroke-linecap="round"/>
    <g fill="#8be9f1" opacity="0.72">
      <circle cx="92" cy="302" r="8"/><circle cx="238" cy="323" r="6"/><circle cx="393" cy="350" r="9"/>
      <circle cx="130" cy="444" r="7"/><circle cx="312" cy="444" r="10"/><circle cx="512" cy="444" r="6"/>
      <circle cx="88" cy="587" r="9"/><circle cx="252" cy="574" r="6"/><circle cx="422" cy="538" r="8"/>
    </g>
  </g>
  <g transform="translate(705 155)" filter="url(#glow)">
    <path d="M95 0 L350 86 L350 315 C350 475 252 559 95 620 C-62 559 -160 475 -160 315 L-160 86 Z" fill="url(#shield)" stroke="#bcfff0" stroke-width="6"/>
    <path d="M95 24 L326 101 L326 306 C326 446 241 524 95 583 Z" fill="#0a4967" opacity="0.32"/>
    <path d="M95 24 L-136 101 L-136 306 C-136 446 -51 524 95 583 Z" fill="#a7f3d0" opacity="0.16"/>
    <path d="M-18 310 L58 386 L218 218" fill="none" stroke="#e2fff5" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#72e6c2" stroke-width="6" opacity="0.78">
    <path d="M1060 450 C1160 450 1182 255 1280 255"/>
    <path d="M1060 450 C1178 450 1210 450 1330 450"/>
    <path d="M1060 450 C1160 450 1182 645 1280 645"/>
  </g>
  <g filter="url(#glow)">
    <g transform="translate(1280 255)">
      <circle r="78" fill="#102d49" stroke="#8af7db" stroke-width="5"/>
      <path d="M-30 -18 H30 M-30 2 H18 M-30 22 H35" stroke="#b8fff0" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="translate(1330 450)">
      <circle r="86" fill="#102d49" stroke="#8af7db" stroke-width="5"/>
      <path d="M0 -44 L42 -20 V27 L0 50 L-42 27 V-20 Z" fill="none" stroke="#b8fff0" stroke-width="9"/>
      <circle r="13" fill="#b8fff0"/>
    </g>
    <g transform="translate(1280 645)">
      <circle r="78" fill="#102d49" stroke="#8af7db" stroke-width="5"/>
      <path d="M-34 22 H34 V-22 H-34 Z M-18 -22 V-38 H18 V-22" fill="none" stroke="#b8fff0" stroke-width="9" stroke-linejoin="round"/>
    </g>
  </g>
  <g fill="#b7f7e8" opacity="0.35">
    <circle cx="1168" cy="355" r="5"/><circle cx="1196" cy="545" r="7"/><circle cx="1442" cy="367" r="6"/>
    <circle cx="1480" cy="520" r="4"/><circle cx="1510" cy="245" r="7"/><circle cx="1120" cy="700" r="5"/>
  </g>
</svg>
