<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Archive paths contained by a verified extraction boundary</title>
  <desc id="desc">Abstract layered archive forms move toward a luminous boundary while unsafe link paths and terminal-like waves are redirected away from a protected workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081526"/>
      <stop offset="0.55" stop-color="#10243b"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="glow" cx="57%" cy="48%" r="52%">
      <stop offset="0" stop-color="#39e1c2" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#219ebc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07111e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3e8ee"/>
      <stop offset="1" stop-color="#4c7c96"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff7dd" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#2fd6bd" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#1698b7" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#020812" flood-opacity="0.65"/>
    </filter>
    <clipPath id="workspace">
      <rect x="885" y="220" width="460" height="470" rx="38"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="910" cy="440" r="240" fill="#2dd4bf" opacity="0.08" filter="url(#soft)"/>

  <g opacity="0.16" fill="none" stroke="#7ab9c9" stroke-width="2">
    <path d="M90 170 C280 90 430 145 600 90"/>
    <path d="M70 745 C250 650 420 770 610 690"/>
    <path d="M1090 115 C1260 45 1410 105 1535 55"/>
  </g>

  <g filter="url(#shadow)" transform="translate(155 210) rotate(-7 300 250)">
    <path d="M95 128 L385 88 L520 183 L228 225 Z" fill="#34566d" opacity="0.8"/>
    <path d="M82 179 L374 138 L510 233 L217 275 Z" fill="#5b8da0" opacity="0.86"/>
    <path d="M68 231 L362 188 L499 285 L205 328 Z" fill="url(#paper)"/>
    <path d="M205 328 L499 285 L490 405 L198 448 Z" fill="#27495f"/>
    <path d="M68 231 L205 328 L198 448 L63 350 Z" fill="#17354b"/>
    <path d="M362 188 L499 285 L490 405 L354 309 Z" fill="#38677e"/>
    <path d="M155 264 L348 236" stroke="#d5f4f2" stroke-width="13" stroke-linecap="round" opacity="0.74"/>
    <circle cx="383" cy="295" r="18" fill="#f5b84b"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M570 390 C675 360 730 375 805 422" stroke="#89e8d5" stroke-width="13" opacity="0.8"/>
    <path d="M563 498 C667 520 744 511 814 466" stroke="#73b9d0" stroke-width="10" opacity="0.7"/>
    <path d="M556 585 C686 635 748 622 817 540" stroke="#f3b653" stroke-width="9" opacity="0.86"/>
  </g>

  <rect x="814" y="145" width="56" height="610" rx="28" fill="#2dd4bf" opacity="0.18" filter="url(#soft)"/>
  <rect x="824" y="148" width="32" height="604" rx="16" fill="url(#gate)"/>
  <path d="M836 195 V705" stroke="#d8fff5" stroke-width="3" opacity="0.8"/>

  <g clip-path="url(#workspace)">
    <rect x="885" y="220" width="460" height="470" rx="38" fill="#0d2738" stroke="#55d9ca" stroke-width="4"/>
    <path d="M948 574 L1085 425 L1188 516 L1322 338" fill="none" stroke="#3ad7bf" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.74"/>
    <path d="M945 623 H1284" stroke="#82c9d4" stroke-width="5" opacity="0.28"/>
    <circle cx="1085" cy="425" r="27" fill="#102f43" stroke="#a7f3df" stroke-width="8"/>
    <circle cx="1188" cy="516" r="27" fill="#102f43" stroke="#a7f3df" stroke-width="8"/>
    <circle cx="1322" cy="338" r="27" fill="#102f43" stroke="#a7f3df" stroke-width="8"/>
  </g>
  <rect x="885" y="220" width="460" height="470" rx="38" fill="none" stroke="#77ead7" stroke-width="5" opacity="0.78"/>

  <g fill="none" stroke="#f3b653" stroke-linecap="round">
    <path d="M795 585 C750 655 690 691 617 678" stroke-width="10"/>
    <path d="M617 678 l32 -23 M617 678 l37 14" stroke-width="10"/>
  </g>
  <g opacity="0.42" fill="none" stroke="#8cc7d5" stroke-width="5" stroke-linecap="round">
    <path d="M1090 760 q35 -30 70 0 t70 0 t70 0"/>
    <path d="M1065 792 q35 -30 70 0 t70 0 t70 0"/>
  </g>
  <circle cx="1415" cy="220" r="7" fill="#77ead7"/>
  <circle cx="1460" cy="278" r="4" fill="#f3b653"/>
  <circle cx="1370" cy="735" r="6" fill="#62b6cb"/>
</svg>
