<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Media frames entering an isolated parser chamber</title>
  <desc id="desc">Abstract editorial artwork showing layered translucent media frames moving through a luminous protective boundary into a contained parsing chamber.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#10273a"/>
      <stop offset="1" stop-color="#26162f"/>
    </linearGradient>
    <radialGradient id="aura" cx="67%" cy="48%" r="52%">
      <stop offset="0" stop-color="#59e3d5" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#438bb1" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#66d6e5" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff7e7" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#4fd1c5" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#f5bd67" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="11" r="1" fill="#c8f8ff" opacity="0.1"/>
      <circle cx="35" cy="32" r="0.8" fill="#ffd28a" opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <ellipse cx="1080" cy="458" rx="440" ry="330" fill="#45c8c0" opacity="0.08" filter="url(#soft)"/>
  <path d="M874 104 C806 246 812 651 893 794" fill="none" stroke="#1a6072" stroke-width="108" opacity="0.2" filter="url(#soft)"/>
  <path d="M875 92 C805 244 811 659 895 808" fill="none" stroke="url(#shield)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M909 124 C852 270 858 628 924 778" fill="none" stroke="#b8fff6" stroke-width="2" opacity="0.42"/>
  <g transform="translate(1010 190)">
    <path d="M80 26 L390 104 L454 384 L236 596 L-30 464 L-74 164 Z" fill="#081724" fill-opacity="0.78" stroke="#63dfd4" stroke-width="6"/>
    <path d="M105 80 L340 138 L388 354 L220 518 L18 416 L-16 190 Z" fill="url(#frame)" stroke="#9af5ea" stroke-width="2"/>
    <path d="M148 158 L292 194 L321 326 L218 426 L94 363 L74 225 Z" fill="#132c3b" stroke="#f5bd67" stroke-width="5"/>
    <circle cx="199" cy="291" r="62" fill="#0a1826" stroke="#69e9dc" stroke-width="7" filter="url(#glow)"/>
    <path d="M173 291 L193 311 L232 270" fill="none" stroke="#f7c873" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(118 250) rotate(-5)" fill="url(#frame)" stroke="#8cece5" stroke-width="3">
    <path d="M0 42 L250 0 L278 170 L28 212 Z"/>
    <path d="M168 177 L418 135 L446 305 L196 347 Z"/>
    <path d="M342 312 L592 270 L620 440 L370 482 Z"/>
  </g>
  <g fill="none" stroke="#d7fbff" stroke-width="3" opacity="0.52">
    <path d="M180 332 L258 319 L322 379 L397 365"/>
    <circle cx="315" cy="308" r="20"/>
    <path d="M347 462 L425 449 L489 509 L564 495"/>
    <circle cx="482" cy="438" r="20"/>
    <path d="M520 591 L598 578 L662 638 L737 624"/>
    <circle cx="655" cy="567" r="20"/>
  </g>
  <path d="M730 476 C789 452 824 432 871 418" fill="none" stroke="#f5bd67" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 17" opacity="0.86"/>
  <g opacity="0.32" fill="none" stroke="#54d9d0">
    <circle cx="1220" cy="458" r="352" stroke-width="2"/>
    <circle cx="1220" cy="458" r="395" stroke-width="1"/>
  </g>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <path d="M0 788 C319 721 561 815 820 767 S1322 667 1600 729 L1600 900 L0 900 Z" fill="#040b14" opacity="0.58"/>
</svg>
