<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Decompression contained at a memory boundary</title>
  <desc id="desc">An abstract stream of compact data expands into luminous layers that stop at a strong protective boundary, representing bounded decompression.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102849"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50e3c2"/>
      <stop offset="0.68" stop-color="#79b8ff"/>
      <stop offset="1" stop-color="#bb8cff"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff7e4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2ea7d8" stop-opacity="0.68"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#63e6cf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#63e6cf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#a7caec" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="940" cy="450" rx="620" ry="390" fill="url(#glow)" filter="url(#soft)"/>

  <g opacity="0.9">
    <rect x="130" y="412" width="54" height="76" rx="12" fill="#50e3c2"/>
    <rect x="202" y="425" width="38" height="50" rx="10" fill="#60d9d5"/>
    <rect x="258" y="433" width="28" height="34" rx="8" fill="#71d0e4"/>
    <circle cx="316" cy="450" r="12" fill="#80c8ef"/>
  </g>

  <g fill="none" stroke="url(#stream)" stroke-linecap="round">
    <path d="M340 450 C510 450 500 244 712 244 C884 244 914 320 1080 320" stroke-width="18" opacity="0.9"/>
    <path d="M340 450 C526 450 548 338 728 338 C900 338 928 394 1080 394" stroke-width="14" opacity="0.78"/>
    <path d="M340 450 C526 450 548 450 750 450 C902 450 946 450 1080 450" stroke-width="12" opacity="0.68"/>
    <path d="M340 450 C526 450 548 562 728 562 C900 562 928 506 1080 506" stroke-width="14" opacity="0.78"/>
    <path d="M340 450 C510 450 500 656 712 656 C884 656 914 580 1080 580" stroke-width="18" opacity="0.9"/>
  </g>

  <g fill="#86dff0" opacity="0.66">
    <circle cx="602" cy="294" r="9"/><circle cx="672" cy="389" r="6"/><circle cx="770" cy="278" r="7"/>
    <circle cx="836" cy="450" r="8"/><circle cx="716" cy="612" r="10"/><circle cx="925" cy="548" r="7"/>
  </g>

  <path d="M1122 155 Q1265 202 1265 357 V512 Q1265 667 1122 745 Q979 667 979 512 V357 Q979 202 1122 155Z" fill="#0b2037" stroke="url(#shield)" stroke-width="16" filter="url(#edge)"/>
  <path d="M1122 213 Q1204 242 1204 345 V500 Q1204 599 1122 660 Q1040 599 1040 500 V345 Q1040 242 1122 213Z" fill="#123653" stroke="#75e9d4" stroke-opacity="0.42" stroke-width="3"/>
  <path d="M1090 362 V538 M1154 362 V538" stroke="#91f1df" stroke-width="18" stroke-linecap="round"/>
  <path d="M1061 410 H1183 M1061 490 H1183" stroke="#91f1df" stroke-width="18" stroke-linecap="round"/>

  <g opacity="0.34" fill="none" stroke="#8db9df" stroke-width="3">
    <path d="M1310 286 C1414 286 1465 334 1465 402"/>
    <path d="M1310 614 C1414 614 1465 566 1465 498"/>
    <circle cx="1465" cy="450" r="48"/>
  </g>
</svg>
