<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI tool separated from device sensors by a permission boundary</title>
  <desc id="desc">An abstract mobile device contains a luminous AI core behind a protective gate, with camera and microphone sensors held outside until permission is granted.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="55" x2="1480" y2="845" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071529"/>
      <stop offset="0.52" stop-color="#103B4B"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(790 450) rotate(90) scale(410 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5BE7C4" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#5BE7C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="device" x1="520" y1="105" x2="1030" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173D58"/>
      <stop offset="1" stop-color="#091B2E"/>
    </linearGradient>
    <linearGradient id="gate" x1="910" y1="170" x2="1130" y2="735" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91FFE1"/>
      <stop offset="1" stop-color="#38BBD2"/>
    </linearGradient>
    <linearGradient id="sensor" x1="1170" y1="275" x2="1450" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB06B"/>
      <stop offset="1" stop-color="#E85F8A"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#010710" flood-opacity="0.72"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="790" cy="450" rx="680" ry="410" fill="url(#aura)"/>
