<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Controller and plugin layers secured together</title>
  <desc id="desc">An abstract blue automation controller is surrounded by interlocking plugin tiles as amber gaps close across layered security rings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061525"/>
      <stop offset="0.52" stop-color="#0a2940"/>
      <stop offset="1" stop-color="#07101e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#29c6d4" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#197f9e" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#07101e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9f5ef"/>
      <stop offset="0.5" stop-color="#38bdcb"/>
      <stop offset="1" stop-color="#1b6686"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55d5dd"/>
      <stop offset="1" stop-color="#1d6d8e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd18a"/>
      <stop offset="1" stop-color="#f29b38"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020812" flood-opacity="0.62"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <g id="plugin">
      <path d="M-74 -58 H-18 C-18 -35 2 -21 22 -28 C37 -34 46 -48 45 -58 H74 V58 H27 C27 36 8 23 -12 29 C-27 34 -37 47 -37 58 H-74 Z" fill="url(#tile)" stroke="#9cf0ed" stroke-width="3"/>
      <circle cx="0" cy="0" r="11" fill="#09263a" opacity="0.72"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <g fill="none" stroke="#47b5c7" opacity="0.16">
    <circle cx="800" cy="450" r="352" stroke-width="2"/>
    <circle cx="800" cy="450" r="404" stroke-width="2"/>
    <path d="M92 202 C326 83 498 124 648 236" stroke-width="3"/>
    <path d="M952 669 C1128 788 1322 796 1514 673" stroke-width="3"/>
  </g>
  <g opacity="0.25" fill="#5ccbd4">
    <circle cx="173" cy="267" r="5"/><circle cx="268" cy="198" r="8"/><circle cx="1370" cy="235" r="6"/>
    <circle cx="1455" cy="598" r="8"/><circle cx="214" cy="679" r="6"/><circle cx="1301" cy="736" r="5"/>
  </g>
  <circle cx="800" cy="450" r="310" fill="none" stroke="#133f59" stroke-width="56" opacity="0.7"/>
  <circle cx="800" cy="450" r="310" fill="none" stroke="#41c6d2" stroke-width="8" stroke-dasharray="310 44 188 38 252 52 245" stroke-linecap="round" opacity="0.82"/>
  <g fill="none" stroke="url(#amber)" stroke-linecap="round">
    <path d="M1077 310 A310 310 0 0 1 1109 432" stroke-width="12"/>
    <path d="M497 515 A310 310 0 0 1 491 409" stroke-width="12"/>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(800 177) rotate(0)"><use href="#plugin"/></g>
    <g transform="translate(1028 266) rotate(48)"><use href="#plugin"/></g>
    <g transform="translate(1094 494) rotate(96)"><use href="#plugin"/></g>
    <g transform="translate(950 689) rotate(144)"><use href="#plugin"/></g>
    <g transform="translate(650 689) rotate(216)"><use href="#plugin"/></g>
    <g transform="translate(506 494) rotate(264)"><use href="#plugin"/></g>
    <g transform="translate(572 266) rotate(312)"><use href="#plugin"/></g>
  </g>
  <circle cx="800" cy="450" r="184" fill="#27c1d0" opacity="0.18" filter="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="645" y="295" width="310" height="310" rx="62" fill="#09283d" stroke="#69e1df" stroke-width="7"/>
    <rect x="688" y="338" width="224" height="224" rx="44" fill="url(#core)"/>
    <path d="M748 418 H852 M748 450 H852 M748 482 H824" fill="none" stroke="#07334a" stroke-width="16" stroke-linecap="round" opacity="0.82"/>
    <g fill="#d7fffa">
      <circle cx="688" cy="382" r="8"/><circle cx="688" cy="450" r="8"/><circle cx="688" cy="518" r="8"/>
      <circle cx="912" cy="382" r="8"/><circle cx="912" cy="450" r="8"/><circle cx="912" cy="518" r="8"/>
    </g>
  </g>
  <g stroke="#88e8e5" stroke-width="4" opacity="0.46">
    <path d="M800 264 V294"/><path d="M986 315 L948 346"/><path d="M1003 505 L951 490"/>
    <path d="M916 620 L893 580"/><path d="M684 620 L707 580"/><path d="M597 505 L649 490"/><path d="M614 315 L652 346"/>
  </g>
  <path d="M1190 132 C1302 203 1365 314 1376 443" fill="none" stroke="url(#amber)" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
  <circle cx="1377" cy="456" r="14" fill="#ffc46f"/>
  <rect x="46" y="46" width="1508" height="808" rx="34" fill="none" stroke="#7bd9e1" stroke-opacity="0.13" stroke-width="2"/>
</svg>
