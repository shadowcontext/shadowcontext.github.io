    <rect x="298" y="598" width="48" height="6" rx="3"/><rect x="298" y="615" width="34" height="6" rx="3"/>
    <rect x="1258" y="268" width="48" height="6" rx="3"/><rect x="1258" y="285" width="34" height="6" rx="3"/>
    <rect x="1302" y="430" width="48" height="6" rx="3"/><rect x="1302" y="447" width="34" height="6" rx="3"/>
    <rect x="1254" y="598" width="48" height="6" rx="3"/><rect x="1254" y="615" width="34" height="6" rx="3"/>
