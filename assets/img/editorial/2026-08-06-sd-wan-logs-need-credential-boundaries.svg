<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected log streams around an SD-WAN control hub</title>
  <desc id="desc">Abstract editorial artwork showing amber diagnostic streams moving from a central SD-WAN hub through layered blue credential-protection boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102b45"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#45d8e8" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#1685aa" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42e0e9"/>
      <stop offset="1" stop-color="#16638c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcc71" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#ffb64a"/>
      <stop offset="1" stop-color="#ffd893" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <g fill="none" stroke="#6ad7e3" stroke-opacity="0.08">
    <path d="M70 166C330 72 496 152 710 92S1160 46 1518 162"/>
    <path d="M54 744C318 648 534 798 760 726s468-84 790 18"/>
    <path d="M190 88C228 280 172 466 222 806"/>
    <path d="M1400 68C1344 274 1438 492 1376 830"/>
  </g>

  <g opacity="0.9">
    <ellipse cx="800" cy="450" rx="470" ry="292" fill="none" stroke="#2a718e" stroke-width="3"/>
    <ellipse cx="800" cy="450" rx="390" ry="238" fill="none" stroke="#42cddd" stroke-opacity="0.48" stroke-width="4"/>
    <ellipse cx="800" cy="450" rx="314" ry="188" fill="#0b2137" fill-opacity="0.72" stroke="#70e1e8" stroke-opacity="0.74" stroke-width="3"/>
  </g>

  <g fill="none" stroke="url(#amber)" stroke-width="13" stroke-linecap="round" filter="url(#glow)">
    <path d="M104 286C278 286 340 366 468 366c74 0 94-42 152-42"/>
    <path d="M90 448c192 0 268 2 390 2h134"/>
