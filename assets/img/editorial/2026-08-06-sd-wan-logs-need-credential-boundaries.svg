    <path d="M0-88 74-45v90L0 88-74 45v-90Z" fill="url(#core)" opacity="0.92"/>
    <path d="M-42-18h84M-42 5h84M-42 28h54" fill="none" stroke="#d7fbff" stroke-width="9" stroke-linecap="round" opacity="0.84"/>
    <circle cx="47" cy="28" r="8" fill="#ffca6b"/>
  </g>

  <g fill="#0b1d31" stroke="#63dce6" stroke-width="3">
    <rect x="274" y="248" width="88" height="76" rx="18"/><rect x="230" y="410" width="88" height="76" rx="18"/><rect x="278" y="578" width="88" height="76" rx="18"/>
