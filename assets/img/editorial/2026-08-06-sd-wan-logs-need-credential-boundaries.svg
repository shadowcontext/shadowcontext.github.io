  <path d="M800 142c176 0 318 142 318 318S976 778 800 778 482 636 482 460 624 142 800 142Z" fill="none" stroke="#71e8ee" stroke-opacity="0.22" stroke-width="18" filter="url(#soft)"/>
  <circle cx="800" cy="450" r="352" fill="none" stroke="#ffbf58" stroke-opacity="0.14" stroke-width="2" stroke-dasharray="4 22"/>
</svg>
