<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Independent verification around a protected endpoint core</title>
  <desc id="desc">Abstract teal endpoint shield with a guarded amber core and an independent arc of verification signals outside its boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071723"/>
      <stop offset="0.55" stop-color="#0a2530"/>
      <stop offset="1" stop-color="#102b36"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#1a8890" stop-opacity=".09"/>
      <stop offset="1" stop-color="#071723" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39dbc8"/>
      <stop offset=".52" stop-color="#168d97"/>
      <stop offset="1" stop-color="#0b586b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd37a"/>
      <stop offset="1" stop-color="#e88d31"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r="1" fill="#b9f4ed" opacity=".07"/>
      <circle cx="36" cy="41" r="1.3" fill="#b9f4ed" opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <path d="M180 675C338 781 537 824 754 802" fill="none" stroke="#3ed8c8" stroke-width="2" opacity=".18"/>
  <path d="M1446 222C1271 105 1057 75 848 107" fill="none" stroke="#8be7dc" stroke-width="2" opacity=".16"/>
  <ellipse cx="800" cy="760" rx="365" ry="50" fill="#031016" opacity=".52" filter="url(#soft)"/>

  <g opacity=".9">
    <path d="M800 121L1116 245V438C1116 623 986 739 800 800C614 739 484 623 484 438V245L800 121Z" fill="#071c27" stroke="#66e4d4" stroke-width="4"/>
    <path d="M800 165L1072 272V439C1072 587 972 686 800 746C628 686 528 587 528 439V272L800 165Z" fill="url(#shield)" opacity=".9"/>
    <path d="M800 205L1024 294V437C1024 558 946 637 800 694C654 637 576 558 576 437V294L800 205Z" fill="#092936" stroke="#92eee2" stroke-width="2" opacity=".96"/>
  </g>

  <g transform="translate(800 438)">
    <circle r="156" fill="none" stroke="#52d7c8" stroke-width="2" stroke-dasharray="6 17" opacity=".4"/>
    <circle r="113" fill="#061a24" stroke="#72e7d9" stroke-width="4"/>
    <circle r="70" fill="url(#amber)" opacity=".2" filter="url(#glow)"/>
    <path d="M0-72L62-37V33L0 72L-62 33V-37Z" fill="#0c3440" stroke="url(#amber)" stroke-width="7"/>
    <circle r="22" fill="url(#amber)"/>
    <path d="M0 22V55" stroke="#f2ac4a" stroke-width="11" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#81e9dd" stroke-width="4" stroke-linecap="round">
    <path d="M1165 247C1290 309 1363 421 1363 544C1363 637 1321 721 1253 784" opacity=".48"/>
    <path d="M435 247C310 309 237 421 237 544C237 637 279 721 347 784" opacity=".48"/>
  </g>

  <g filter="url(#glow)">
    <g transform="translate(1241 298)"><circle r="25" fill="#0c3440" stroke="#54d8ca" stroke-width="4"/><circle r="7" fill="#7cecdf"/></g>
    <g transform="translate(1363 493)"><circle r="25" fill="#0c3440" stroke="#54d8ca" stroke-width="4"/><circle r="7" fill="#7cecdf"/></g>
    <g transform="translate(1282 721)"><circle r="25" fill="#0c3440" stroke="#54d8ca" stroke-width="4"/><circle r="7" fill="#7cecdf"/></g>
    <g transform="translate(359 298)"><circle r="25" fill="#0c3440" stroke="#54d8ca" stroke-width="4"/><circle r="7" fill="#7cecdf"/></g>
    <g transform="translate(237 493)"><circle r="25" fill="#0c3440" stroke="#54d8ca" stroke-width="4"/><circle r="7" fill="#7cecdf"/></g>
    <g transform="translate(318 721)"><circle r="25" fill="#0c3440" stroke="#54d8ca" stroke-width="4"/><circle r="7" fill="#7cecdf"/></g>
  </g>

  <path d="M1241 298L1120 351M1363 493L1120 478M1282 721L1060 635M359 298L480 351M237 493L480 478M318 721L540 635" stroke="#54d8ca" stroke-width="2" stroke-dasharray="8 11" opacity=".32"/>
  <path d="M697 438H592" stroke="#eaa04a" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  <path d="M612 411L574 438L612 465" fill="none" stroke="#ffd37a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M592 382V494" stroke="#0b6571" stroke-width="15" stroke-linecap="round"/>
</svg>
