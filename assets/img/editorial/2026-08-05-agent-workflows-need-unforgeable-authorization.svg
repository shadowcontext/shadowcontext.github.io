<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Authorization boundary between agent workflows</title>
  <desc id="desc">Abstract pair of AI workflow nodes separated by a luminous authorization boundary that blocks untrusted input ribbons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071529"/>
      <stop offset="0.52" stop-color="#102b46"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58e2ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#58e2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46c4ef"/>
      <stop offset="1" stop-color="#2565b2"/>
    </linearGradient>
    <linearGradient id="rightNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#96f1c4"/>
      <stop offset="1" stop-color="#32a98d"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4fff3" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#9fffe0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d4fff3" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b5cff" stop-opacity="0.25"/>
      <stop offset="0.7" stop-color="#f584c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffbd80" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000b14" flood-opacity="0.7"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#9bdcf2" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="450" rx="530" ry="420" fill="url(#halo)"/>

  <g opacity="0.35" fill="none" stroke="#84d6eb" stroke-width="2">
    <path d="M80 180C260 95 390 120 518 234"/>
    <path d="M1520 720C1350 802 1212 772 1080 658"/>
    <circle cx="84" cy="178" r="7" fill="#84d6eb"/>
    <circle cx="1517" cy="721" r="7" fill="#84d6eb"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="455" cy="450" r="178" fill="#0b2340" stroke="#3f9dd4" stroke-width="3"/>
    <circle cx="455" cy="450" r="130" fill="url(#leftNode)" opacity="0.2"/>
    <g fill="none" stroke="#8ce7ff" stroke-width="8" stroke-linecap="round">
      <path d="M386 419L455 379L524 419V499L455 539L386 499Z"/>
      <path d="M386 419L455 459L524 419M455 459V539"/>
    </g>
    <circle cx="386" cy="419" r="13" fill="#bff6ff"/>
    <circle cx="524" cy="419" r="13" fill="#bff6ff"/>
    <circle cx="455" cy="539" r="13" fill="#bff6ff"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="1145" cy="450" r="178" fill="#0b2a32" stroke="#55c8a7" stroke-width="3"/>
    <circle cx="1145" cy="450" r="130" fill="url(#rightNode)" opacity="0.18"/>
    <g fill="none" stroke="#a8f6d6" stroke-width="8" stroke-linecap="round">
      <path d="M1076 419L1145 379L1214 419V499L1145 539L1076 499Z"/>
      <path d="M1076 419L1145 459L1214 419M1145 459V539"/>
    </g>
    <circle cx="1076" cy="419" r="13" fill="#d6ffed"/>
    <circle cx="1214" cy="419" r="13" fill="#d6ffed"/>
    <circle cx="1145" cy="539" r="13" fill="#d6ffed"/>
  </g>

  <path d="M625 450C686 450 720 450 765 450" fill="none" stroke="#79dff2" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
  <path d="M835 450C890 450 931 450 975 450" fill="none" stroke="#87e8bf" stroke-width="12" stroke-linecap="round" opacity="0.75"/>

  <g filter="url(#softGlow)">
    <rect x="782" y="118" width="36" height="664" rx="18" fill="url(#gate)"/>
    <path d="M800 342L864 369V439C864 493 837 537 800 557C763 537 736 493 736 439V369Z" fill="#102f3a" stroke="#b5ffe6" stroke-width="5"/>
    <path d="M774 434L793 453L831 411" fill="none" stroke="#b5ffe6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="url(#ribbon)" stroke-width="16" stroke-linecap="round">
    <path d="M74 624C238 540 332 635 455 618C574 602 632 528 713 527"/>
    <path d="M112 702C286 624 356 725 502 685C608 656 654 587 714 582" opacity="0.62"/>
    <path d="M118 278C250 348 377 282 492 318C598 351 646 383 714 383" opacity="0.74"/>
  </g>
  <g fill="#ffaddb">
    <circle cx="713" cy="527" r="11"/>
    <circle cx="714" cy="582" r="11"/>
    <circle cx="714" cy="383" r="11"/>
  </g>

  <g opacity="0.72">
    <circle cx="930" cy="212" r="9" fill="#86efc4"/>
    <circle cx="993" cy="248" r="5" fill="#86efc4"/>
    <circle cx="1267" cy="671" r="7" fill="#86efc4"/>
    <path d="M923 269C1020 193 1124 188 1212 237" fill="none" stroke="#86efc4" stroke-width="3" stroke-dasharray="5 15"/>
  </g>
</svg>
