    <circle cx="1138" cy="368" r="8"/><circle cx="1138" cy="532" r="8"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M800 276 1012 347v142c0 132-84 224-212 278-128-54-212-146-212-278V347Z" fill="#0b1930" stroke="#79ead9" stroke-width="6"/>
    <path d="M800 310 972 367v116c0 107-66 180-172 229-106-49-172-122-172-229V367Z" fill="url(#shield)" opacity="0.92"/>
    <path d="M800 344 938 390v91c0 82-49 140-138 185-89-45-138-103-138-185v-91Z" fill="#092038" fill-opacity="0.84"/>
