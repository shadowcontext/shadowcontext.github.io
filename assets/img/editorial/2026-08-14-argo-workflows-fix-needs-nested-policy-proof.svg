<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nested policy protection for an artifact workflow pod</title>
  <desc id="desc">Abstract nested workflow layers surround a shielded artifact pod, while a sealed configuration path and independent outer guardrails reinforce the boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.52" stop-color="#102848"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#35d0ba" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#2b7fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8af3df"/>
      <stop offset="0.48" stop-color="#32c9b4"/>
      <stop offset="1" stop-color="#167b91"/>
    </linearGradient>
    <linearGradient id="sealed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbe63"/>
      <stop offset="1" stop-color="#ff7a7a"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000915" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#91b8d8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="758" rx="485" ry="74" fill="#020a14" opacity="0.48" filter="url(#soft)"/>

  <g fill="none" stroke-linejoin="round">
    <path d="M250 205L800 72l550 133v490L800 830 250 695Z" stroke="#67a9dc" stroke-opacity="0.20" stroke-width="3"/>
    <path d="M335 255L800 142l465 113v392L800 760 335 647Z" fill="#102b4a" fill-opacity="0.35" stroke="#58aee7" stroke-opacity="0.34" stroke-width="3"/>
    <path d="M430 303L800 214l370 89v296L800 689 430 599Z" fill="#143856" fill-opacity="0.48" stroke="#54d0cd" stroke-opacity="0.45" stroke-width="3"/>
  </g>

  <g opacity="0.85">
    <path d="M293 255h92M293 255v92M1307 255h-92M1307 255v92M293 645h92M293 645v-92M1307 645h-92M1307 645v-92" fill="none" stroke="#81b7de" stroke-width="9" stroke-linecap="round"/>
    <circle cx="293" cy="255" r="15" fill="#0e2c48" stroke="#81b7de" stroke-width="4"/>
    <circle cx="1307" cy="255" r="15" fill="#0e2c48" stroke="#81b7de" stroke-width="4"/>
    <circle cx="293" cy="645" r="15" fill="#0e2c48" stroke="#81b7de" stroke-width="4"/>
    <circle cx="1307" cy="645" r="15" fill="#0e2c48" stroke="#81b7de" stroke-width="4"/>
