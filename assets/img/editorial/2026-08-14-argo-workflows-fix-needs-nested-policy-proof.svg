    <path d="M84 71v53" stroke="#d8fff7" stroke-width="4" opacity="0.72"/>
  </g>

  <path d="M490 450H607" stroke="url(#sealed)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="490" cy="450" r="18" fill="#0d2c48" stroke="#ffbd68" stroke-width="6"/>
  <path d="m550 428 22 22-22 22" fill="none" stroke="#ff9d6d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="588" y="419" width="41" height="62" rx="12" fill="#07172a" stroke="#ff7f7f" stroke-width="5"/>
  <path d="M598 435h21M598 450h21M598 465h13" stroke="#ffb07b" stroke-width="4" stroke-linecap="round"/>

  <g fill="none" stroke="#8df3e1" stroke-linecap="round">
