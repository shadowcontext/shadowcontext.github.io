<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Global context converging on an AI security test</title>
  <desc id="desc">An abstract editorial scene with a luminous AI core inside a translucent globe, surrounded by varied regional signal ribbons and independent testing paths.</desc>
  <defs>
    <linearGradient id="background" x1="140" y1="70" x2="1450" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A31"/>
      <stop offset="0.48" stop-color="#0B3150"/>
      <stop offset="1" stop-color="#12233F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(802 448) rotate(90) scale(380 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78F4E1" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#48B7DF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#48B7DF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="660" y1="300" x2="950" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8FFF6"/>
      <stop offset="0.45" stop-color="#55E3D0"/>
      <stop offset="1" stop-color="#2786C2"/>
    </linearGradient>
    <linearGradient id="warmRibbon" x1="110" y1="690" x2="810" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB35C" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#FFB35C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F26D8A" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="coolRibbon" x1="1490" y1="190" x2="790" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7D8CFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#7D8CFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#50E8D5" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="1360" y1="760" x2="820" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD166" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD166" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#54DFC9" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="coreGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="globeClip">
      <circle cx="800" cy="450" r="310"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="800" cy="455" rx="610" ry="425" fill="url(#halo)"/>

  <g opacity="0.18">
    <circle cx="204" cy="164" r="3" fill="#B9FFF2"/>
    <circle cx="322" cy="728" r="4" fill="#FFCB75"/>
    <circle cx="1391" cy="175" r="4" fill="#9BA6FF"/>
    <circle cx="1450" cy="650" r="3" fill="#6FEBD6"/>
    <circle cx="1180" cy="89" r="2.5" fill="#E6FFF9"/>
    <circle cx="93" cy="487" r="2.5" fill="#E6FFF9"/>
  </g>

  <circle cx="800" cy="450" r="319" fill="#4FCAD1" opacity="0.06" stroke="#A7FFF0" stroke-opacity="0.35" stroke-width="2"/>
  <g clip-path="url(#globeClip)" fill="none">
    <ellipse cx="800" cy="450" rx="250" ry="310" stroke="#8BE9E4" stroke-opacity="0.2" stroke-width="2"/>
    <ellipse cx="800" cy="450" rx="120" ry="310" stroke="#8BE9E4" stroke-opacity="0.18" stroke-width="2"/>
    <ellipse cx="800" cy="450" rx="310" ry="118" stroke="#8BE9E4" stroke-opacity="0.2" stroke-width="2"/>
    <ellipse cx="800" cy="450" rx="310" ry="230" stroke="#8BE9E4" stroke-opacity="0.16" stroke-width="2"/>

    <path d="M500 348C594 304 666 333 721 381C776 429 837 430 897 385C956 341 1025 315 1092 350" stroke="#69D7E3" stroke-opacity="0.22" stroke-width="16"/>
    <path d="M515 575C610 615 687 588 734 541C780 495 845 486 904 535C962 584 1024 607 1085 578" stroke="#58B6E5" stroke-opacity="0.18" stroke-width="18"/>
  </g>

  <path d="M92 706C270 709 385 625 494 546C598 470 663 449 733 451" fill="none" stroke="url(#warmRibbon)" stroke-width="28" stroke-linecap="round"/>
  <path d="M1510 165C1335 171 1227 257 1127 340C1025 424 946 449 869 449" fill="none" stroke="url(#coolRibbon)" stroke-width="24" stroke-linecap="round"/>
  <path d="M1452 777C1300 728 1206 645 1097 573C1003 511 933 486 868 473" fill="none" stroke="url(#goldRibbon)" stroke-width="20" stroke-linecap="round"/>
  <path d="M119 212C283 238 390 324 500 381C598 432 661 443 730 440" fill="none" stroke="#52DEC9" stroke-opacity="0.42" stroke-width="13" stroke-linecap="round"/>

  <g fill="#E8FFF9" opacity="0.65">
    <circle cx="326" cy="626" r="8"/>
    <circle cx="433" cy="558" r="5"/>
    <circle cx="1256" cy="279" r="7"/>
    <circle cx="1156" cy="354" r="5"/>
    <circle cx="1251" cy="666" r="8"/>
    <circle cx="388" cy="342" r="7"/>
  </g>

  <circle cx="800" cy="451" r="162" fill="#4EE2D0" opacity="0.16" filter="url(#softGlow)"/>
  <g filter="url(#coreGlow)">
    <path d="M800 288L913 354V486C913 554 867 613 800 638C733 613 687 554 687 486V354L800 288Z" fill="#071E36" stroke="url(#core)" stroke-width="8"/>
    <path d="M800 344L866 382V471C866 518 839 556 800 577C761 556 734 518 734 471V382L800 344Z" fill="url(#core)" opacity="0.92"/>
    <circle cx="800" cy="449" r="48" fill="#09263F" opacity="0.88"/>
    <path d="M776 449C776 430 787 419 800 419C813 419 824 430 824 449C824 468 813 479 800 479C787 479 776 468 776 449Z" fill="#CFFFF5"/>
    <circle cx="800" cy="449" r="8" fill="#0A6B86"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M592 240C636 210 679 194 724 187" stroke="#FFB35C" stroke-opacity="0.65" stroke-width="5"/>
    <path d="M1008 665C965 699 921 717 874 724" stroke="#7D8CFF" stroke-opacity="0.7" stroke-width="5"/>
    <path d="M1048 247C1012 217 973 198 931 188" stroke="#55DFC9" stroke-opacity="0.68" stroke-width="5"/>
    <path d="M551 646C589 684 631 708 677 719" stroke="#FFD166" stroke-opacity="0.62" stroke-width="5"/>
  </g>

  <rect x="0" y="820" width="1600" height="80" fill="#041426" opacity="0.38"/>
</svg>
