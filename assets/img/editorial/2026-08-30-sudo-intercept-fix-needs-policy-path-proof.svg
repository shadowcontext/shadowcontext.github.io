  <path d="M-45 450 C348 450 480 450 674 450" fill="none" stroke="#6fe8f1" stroke-width="20" stroke-linecap="round" opacity="0.85"/>

  <g opacity="0.48" fill="#aafcf0">
    <circle cx="1017" cy="450" r="6"/><circle cx="1130" cy="450" r="6"/>
    <circle cx="1260" cy="450" r="6"/><circle cx="1380" cy="450" r="6"/>
    <circle cx="583" cy="450" r="6"/><circle cx="470" cy="450" r="6"/>
    <circle cx="340" cy="450" r="6"/><circle cx="220" cy="450" r="6"/>
  </g>

  <path d="M800 388 L840 411 V458 C840 493 818 515 800 525 C782 515 760 493 760 458 V411 Z" fill="#0d2740" stroke="#c8fff5" stroke-width="5"/>
  <path d="M783 455 L796 468 L820 439" fill="none" stroke="#70f1d8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
