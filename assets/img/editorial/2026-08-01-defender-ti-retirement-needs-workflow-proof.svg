<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Threat intelligence workflow crossing into a unified protected field</title>
  <desc id="desc">Abstract cyan intelligence nodes and connecting paths pass through a luminous access boundary into a layered blue analysis field, symbolizing verified workflow continuity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0a2340"/>
      <stop offset="1" stop-color="#111c38"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#23d5e8" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#2c7df0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2c7df0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78f4f2" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#44bbef" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4383ee" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1b65b" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#67dfec" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#68a7ff" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="rightField">
      <path d="M850 145 C1120 110 1425 185 1495 424 C1558 639 1370 790 1076 786 C934 784 828 738 780 659 L780 240 C798 201 820 169 850 145Z"/>
    </clipPath>
  </defs>

