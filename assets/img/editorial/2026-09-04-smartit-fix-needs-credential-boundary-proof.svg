<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Credential boundary around an endpoint-management hub</title>
  <desc id="desc">Abstract endpoint-management hub protected by layered shields as exposed credential fragments are blocked outside segmented device groups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071726"/>
      <stop offset="0.52" stop-color="#0b2a42"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="55%">
      <stop offset="0" stop-color="#39d8d0" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#1a88b8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#071726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6ff1dc"/>
      <stop offset="1" stop-color="#1686bd"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#ef7d4f"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7bbbd0" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="430" rx="690" ry="430" fill="url(#halo)"/>
  <ellipse cx="800" cy="746" rx="510" ry="52" fill="#020b13" opacity=".42" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M278 241C455 209 530 302 624 354" stroke="#55bad0" stroke-opacity=".45" stroke-width="5"/>
    <path d="M272 661C442 704 534 602 624 548" stroke="#55bad0" stroke-opacity=".45" stroke-width="5"/>
    <path d="M1325 240C1147 207 1068 302 976 354" stroke="#55bad0" stroke-opacity=".45" stroke-width="5"/>
    <path d="M1328 665C1155 704 1067 603 976 548" stroke="#55bad0" stroke-opacity=".45" stroke-width="5"/>
    <path d="M335 449H559" stroke="#55bad0" stroke-opacity=".32" stroke-width="4" stroke-dasharray="10 18"/>
    <path d="M1042 449H1264" stroke="#55bad0" stroke-opacity=".32" stroke-width="4" stroke-dasharray="10 18"/>
  </g>

  <g fill="#102f48" stroke="#62c5d5" stroke-width="3">
    <rect x="174" y="179" width="176" height="112" rx="18"/>
    <rect x="169" y="603" width="188" height="118" rx="18"/>
    <rect x="1250" y="178" width="178" height="114" rx="18"/>
    <rect x="1244" y="603" width="190" height="119" rx="18"/>
  </g>
  <g fill="#76d7df" opacity=".82">
    <circle cx="215" cy="221" r="8"/><circle cx="242" cy="221" r="8"/><rect x="210" y="251" width="104" height="9" rx="4.5"/>
    <circle cx="213" cy="645" r="8"/><circle cx="240" cy="645" r="8"/><rect x="208" y="678" width="112" height="9" rx="4.5"/>
    <circle cx="1293" cy="220" r="8"/><circle cx="1320" cy="220" r="8"/><rect x="1288" y="252" width="102" height="9" rx="4.5"/>
    <circle cx="1288" cy="645" r="8"/><circle cx="1315" cy="645" r="8"/><rect x="1284" y="679" width="114" height="9" rx="4.5"/>
  </g>

  <g opacity=".8" fill="none" stroke="url(#shield)">
    <path d="M800 118L1050 213V421c0 176-103 291-250 360-147-69-250-184-250-360V213z" stroke-width="9"/>
    <path d="M800 161L1007 239V415c0 147-83 243-207 306-124-63-207-159-207-306V239z" stroke-width="3" opacity=".55"/>
  </g>

  <g filter="url(#glow)">
    <rect x="676" y="335" width="248" height="214" rx="34" fill="#0d3b57" stroke="#72eddf" stroke-width="5"/>
    <path d="M716 395h168M716 438h168M716 481h103" stroke="#72eddf" stroke-width="12" stroke-linecap="round" opacity=".7"/>
    <circle cx="865" cy="481" r="15" fill="#72eddf"/>
    <path d="M800 548v67" stroke="#72eddf" stroke-width="7"/>
    <path d="M732 632h136" stroke="#72eddf" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(1040 356) rotate(-9)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#amber)" stroke-width="15"/>
    <path d="M39 7l121 31 29 35-31 29-26-28-31 16-25-27-34 10z" fill="url(#amber)"/>
  </g>
  <g transform="translate(1143 521) rotate(17)" fill="url(#amber)" opacity=".75">
    <rect x="0" y="0" width="64" height="17" rx="8"/>
    <rect x="78" y="0" width="42" height="17" rx="8"/>
    <rect x="134" y="0" width="27" height="17" rx="8"/>
  </g>
  <path d="M1016 314c-37 35-55 76-57 123" fill="none" stroke="#ffbd70" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <circle cx="958" cy="454" r="14" fill="#ffbd70" filter="url(#glow)"/>

  <g fill="#0b2235" stroke="#4cbacb" stroke-width="3">
    <circle cx="454" cy="353" r="22"/><circle cx="430" cy="448" r="22"/><circle cx="466" cy="548" r="22"/>
    <circle cx="1145" cy="353" r="22"/><circle cx="1170" cy="448" r="22"/><circle cx="1135" cy="548" r="22"/>
  </g>
</svg>
