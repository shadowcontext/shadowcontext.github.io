<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Integrity validation inside an encrypted network tunnel</title>
  <desc id="desc">Abstract blue and violet packet forms travel through a curved encrypted tunnel and pass a luminous layered validation gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071327"/>
      <stop offset="0.52" stop-color="#10254a"/>
      <stop offset="1" stop-color="#160d35"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#63e6ff" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#7067ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7067ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#163b6e" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#2e7da9" stop-opacity=".52"/>
      <stop offset="1" stop-color="#5a4ed0" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9af7ff"/>
      <stop offset=".5" stop-color="#4ad3e8"/>
      <stop offset="1" stop-color="#786cff"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9fbff"/>
      <stop offset=".45" stop-color="#5de1f3"/>
      <stop offset="1" stop-color="#6d68ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="flowClip">
      <path d="M115 548 C410 319 612 320 794 430 C969 536 1146 571 1480 351 L1480 592 C1167 775 939 731 744 619 C557 512 366 512 115 706 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="847" cy="457" r="430" fill="url(#halo)"/>
  <circle cx="1380" cy="128" r="190" fill="#513ca7" opacity=".12" filter="url(#soft)"/>
  <circle cx="165" cy="760" r="230" fill="#16789b" opacity=".11" filter="url(#soft)"/>

  <g opacity=".26" fill="none" stroke="#88eaff" stroke-width="2">
    <path d="M74 165 C330 63 540 99 731 205"/>
    <path d="M876 752 C1098 841 1330 791 1541 645"/>
    <path d="M136 233 C352 149 504 166 650 236" opacity=".45"/>
  </g>

  <path d="M115 548 C410 319 612 320 794 430 C969 536 1146 571 1480 351 L1480 592 C1167 775 939 731 744 619 C557 512 366 512 115 706 Z"
        fill="url(#tunnel)" stroke="#6ce7f1" stroke-opacity=".28" stroke-width="3"/>
  <path d="M115 548 C410 319 612 320 794 430 C969 536 1146 571 1480 351"
        fill="none" stroke="#8cf6ff" stroke-opacity=".42" stroke-width="5"/>
  <path d="M115 706 C366 512 557 512 744 619 C939 731 1167 775 1480 592"
        fill="none" stroke="#8078ff" stroke-opacity=".4" stroke-width="5"/>

  <g clip-path="url(#flowClip)" opacity=".32">
    <path d="M10 620 C360 348 610 392 797 500 C1011 623 1216 618 1580 389" fill="none" stroke="#86f1ff" stroke-width="2" stroke-dasharray="18 28"/>
    <path d="M-20 676 C335 404 585 449 771 557 C984 680 1202 679 1610 430" fill="none" stroke="#817aff" stroke-width="2" stroke-dasharray="10 34"/>
  </g>

  <g filter="url(#glow)">
    <path d="M745 300 L875 256 L1005 300 L1005 600 L875 654 L745 600 Z"
          fill="#0d2246" fill-opacity=".72" stroke="url(#gate)" stroke-width="10"/>
    <path d="M779 326 L875 294 L971 326 L971 574 L875 614 L779 574 Z"
          fill="#112d56" fill-opacity=".76" stroke="#7eeaf8" stroke-opacity=".7" stroke-width="3"/>
    <path d="M820 356 L875 338 L930 356 L930 544 L875 570 L820 544 Z"
          fill="#071a35" stroke="#a4f8ff" stroke-opacity=".58" stroke-width="3"/>
    <circle cx="875" cy="454" r="54" fill="#0b2948" stroke="#a7fbff" stroke-width="5"/>
    <path d="M846 454 L868 476 L910 425" fill="none" stroke="#affff5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <g transform="translate(270 519) rotate(-18)">
      <rect x="-72" y="-50" width="144" height="100" rx="26" fill="url(#packet)" opacity=".92"/>
      <rect x="-46" y="-24" width="92" height="48" rx="14" fill="#102b54" opacity=".66"/>
      <circle cx="0" cy="0" r="9" fill="#d4ffff"/>
    </g>
    <g transform="translate(516 438) rotate(4)">
      <rect x="-62" y="-45" width="124" height="90" rx="23" fill="url(#packet)" opacity=".86"/>
      <rect x="-39" y="-21" width="78" height="42" rx="12" fill="#102b54" opacity=".66"/>
      <circle cx="0" cy="0" r="8" fill="#d4ffff"/>
    </g>
    <g transform="translate(1182 564) rotate(-9)">
      <rect x="-61" y="-44" width="122" height="88" rx="22" fill="url(#packet)" opacity=".9"/>
      <path d="M-28 0 L-6 21 L31 -22" fill="none" stroke="#e4ffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(1392 474) rotate(-24)">
      <rect x="-54" y="-40" width="108" height="80" rx="21" fill="url(#packet)" opacity=".78"/>
      <path d="M-24 0 L-5 18 L27 -20" fill="none" stroke="#e4ffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g fill="#c6fbff">
    <circle cx="203" cy="398" r="4" opacity=".55"/>
    <circle cx="373" cy="282" r="6" opacity=".35"/>
    <circle cx="617" cy="239" r="4" opacity=".48"/>
    <circle cx="1128" cy="254" r="5" opacity=".38"/>
    <circle cx="1320" cy="702" r="4" opacity=".5"/>
    <circle cx="1501" cy="257" r="6" opacity=".34"/>
  </g>
</svg>
