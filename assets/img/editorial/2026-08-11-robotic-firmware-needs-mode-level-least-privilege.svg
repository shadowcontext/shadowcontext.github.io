<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mode-level protection for robotic vehicle firmware</title>
  <desc id="desc">An abstract robotic vehicle core passes through three protected operating zones while unused firmware pathways recede into the dark background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071624"/>
      <stop offset="0.52" stop-color="#102a3b"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec4b6" stop-opacity="0.16"/>
      <stop offset="0.52" stop-color="#62d6ca" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#78a9ff" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#d7fff9"/>
      <stop offset="0.36" stop-color="#57d4c5"/>
      <stop offset="1" stop-color="#137b86"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
