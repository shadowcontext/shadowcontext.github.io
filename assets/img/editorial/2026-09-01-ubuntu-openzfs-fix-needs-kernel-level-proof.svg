<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenZFS namespace authorization contained at the kernel boundary</title>
  <desc id="desc">An abstract nested namespace sphere approaches a luminous kernel boundary above layered storage pools, while a verification ring seals the privileged side.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#102b3a"/>
      <stop offset="1" stop-color="#06101b"/>
    </linearGradient>
    <radialGradient id="ambient" cx="62%" cy="46%" r="52%">
      <stop offset="0" stop-color="#26d5c1" stop-opacity="0.24"/>
      <stop offset="0.52" stop-color="#298fb4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#06101b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diskTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bd6d5"/>
      <stop offset="1" stop-color="#315c78"/>
    </linearGradient>
    <linearGradient id="diskSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#234a64"/>
      <stop offset="1" stop-color="#10263b"/>
    </linearGradient>
    <linearGradient id="boundary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57c8db" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#9ff8df"/>
      <stop offset="1" stop-color="#2ccab5" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#01050b" flood-opacity="0.72"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#ambient)"/>
  <ellipse cx="1000" cy="430" rx="360" ry="280" fill="#21c7b7" opacity="0.08" filter="url(#blur)"/>

  <g opacity="0.15" fill="none" stroke="#78b7c6" stroke-width="2">
    <path d="M82 160 C278 79 446 146 611 83"/>
    <path d="M68 730 C260 642 402 758 590 690"/>
    <path d="M1125 112 C1281 61 1422 104 1538 51"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(150 425)">
      <path d="M0 150 C0 92 151 45 337 45 C523 45 674 92 674 150 L674 281 C674 340 523 387 337 387 C151 387 0 340 0 281 Z" fill="url(#diskSide)"/>
      <ellipse cx="337" cy="150" rx="337" ry="105" fill="url(#diskTop)"/>
      <ellipse cx="337" cy="150" rx="255" ry="72" fill="#102b40" stroke="#a2ece0" stroke-width="6" opacity="0.88"/>
      <path d="M0 213 C0 271 151 318 337 318 C523 318 674 271 674 213" fill="none" stroke="#4c8aa1" stroke-width="7" opacity="0.7"/>
      <path d="M0 277 C0 335 151 382 337 382 C523 382 674 335 674 277" fill="none" stroke="#2c617c" stroke-width="7"/>
      <circle cx="337" cy="150" r="25" fill="#f2bb55"/>
      <circle cx="337" cy="150" r="10" fill="#fff0bd"/>
    </g>
  </g>

  <g transform="translate(395 154)" filter="url(#shadow)">
    <circle cx="170" cy="170" r="155" fill="#102f45" stroke="#6fb9d0" stroke-width="5" opacity="0.95"/>
    <circle cx="170" cy="170" r="108" fill="#173e52" stroke="#8ad8d5" stroke-width="5"/>
    <circle cx="170" cy="170" r="59" fill="#24566a" stroke="#c2f5e8" stroke-width="5"/>
    <path d="M63 282 C111 319 226 331 288 270" fill="none" stroke="#f2bb55" stroke-width="9" stroke-linecap="round"/>
    <circle cx="170" cy="170" r="13" fill="#f2bb55"/>
  </g>

  <g>
    <rect x="778" y="95" width="78" height="710" rx="39" fill="#2fd1bd" opacity="0.16" filter="url(#blur)"/>
    <rect x="800" y="103" width="34" height="694" rx="17" fill="url(#boundary)" filter="url(#glow)"/>
    <path d="M817 140 V760" stroke="#d9fff4" stroke-width="3" opacity="0.8"/>
    <path d="M769 219 L817 171 L865 219" fill="none" stroke="#8be7d6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M769 681 L817 729 L865 681" fill="none" stroke="#8be7d6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M706 331 C748 330 772 344 795 374" stroke="#8ddbd8" stroke-width="12"/>
    <path d="M689 394 C743 412 760 429 795 449" stroke="#4a99b4" stroke-width="9"/>
    <path d="M676 459 C725 492 759 504 795 512" stroke="#f2bb55" stroke-width="8"/>
  </g>

  <g transform="translate(1008 436)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="212" fill="#0b2638" stroke="#3b8298" stroke-width="8"/>
    <circle cx="0" cy="0" r="166" fill="none" stroke="#75e0d0" stroke-width="19" stroke-dasharray="770 274" stroke-linecap="round" transform="rotate(-42)"/>
    <circle cx="0" cy="0" r="112" fill="#12384a" stroke="#9aeee0" stroke-width="6"/>
    <path d="M-54 3 L-13 45 L72 -55" fill="none" stroke="#d0fff1" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-166" r="12" fill="#f2bb55"/>
  </g>

  <g opacity="0.55" fill="none" stroke-linecap="round">
    <path d="M1228 318 C1329 261 1413 276 1494 335" stroke="#4fa6b9" stroke-width="7"/>
    <path d="M1234 562 C1330 622 1415 608 1499 545" stroke="#2bcbb8" stroke-width="7"/>
    <path d="M1280 696 C1362 734 1428 721 1491 678" stroke="#f2bb55" stroke-width="5"/>
  </g>
  <circle cx="1436" cy="225" r="7" fill="#7be2d4"/>
  <circle cx="1488" cy="392" r="5" fill="#f2bb55"/>
  <circle cx="1376" cy="742" r="6" fill="#5da9c0"/>
</svg>
