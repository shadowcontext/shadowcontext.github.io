<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Firmware verification boundary around a laptop core</title>
  <desc id="desc">Abstract laptop firmware layers surround a protected teal core while an oversized amber signal is diverted at a verification boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1460" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0B2940"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(850 421) rotate(90) scale(390 590)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29D3C2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#29D3C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="476" y1="216" x2="1122" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#153F58"/>
      <stop offset="1" stop-color="#0A2438"/>
    </linearGradient>
    <linearGradient id="layer" x1="585" y1="305" x2="1014" y2="576" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2BE0C8" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#38A7D6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="amber" x1="1315" y1="280" x2="1065" y2="485" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC05A"/>
      <stop offset="1" stop-color="#F07846"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <circle cx="260" cy="175" r="138" fill="#1E6D8F" opacity="0.08"/>
  <circle cx="1375" cy="720" r="225" fill="#24CBB7" opacity="0.05"/>
  <path d="M80 702C303 642 412 755 616 707C813 661 943 542 1135 596C1303 643 1400 704 1550 660" fill="none" stroke="#6FD7E5" stroke-opacity="0.08" stroke-width="2"/>

  <g opacity="0.55">
    <circle cx="205" cy="355" r="5" fill="#6EDDD8"/>
    <circle cx="244" cy="355" r="3" fill="#6EDDD8"/>
    <path d="M210 355H415" stroke="#6EDDD8" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="1380" cy="575" r="5" fill="#68BBD9"/>
    <path d="M1185 575H1375" stroke="#68BBD9" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <ellipse cx="800" cy="739" rx="526" ry="72" fill="#020A11" opacity="0.5" filter="url(#soft)"/>
  <path d="M438 198Q438 168 468 168H1132Q1162 168 1162 198V660H438V198Z" fill="#08141F" stroke="#4A879D" stroke-opacity="0.45" stroke-width="4"/>
  <rect x="468" y="202" width="664" height="420" rx="12" fill="url(#screen)"/>
  <path d="M468 202H1132V622H468Z" fill="url(#halo)" opacity="0.7"/>
  <circle cx="800" cy="185" r="5" fill="#65B3C9" opacity="0.6"/>

  <g transform="translate(0 4)">
    <path d="M597 311L800 248L1003 311L800 375L597 311Z" fill="#183E53" stroke="#49C7CF" stroke-opacity="0.42" stroke-width="3"/>
    <path d="M597 358L800 295L1003 358L800 422L597 358Z" fill="#12384D" stroke="#49C7CF" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M597 405L800 342L1003 405L800 469L597 405Z" fill="#0E3044" stroke="#49C7CF" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M597 452L800 389L1003 452L800 516L597 452Z" fill="url(#layer)" stroke="#6EF0DD" stroke-opacity="0.78" stroke-width="3"/>
  </g>

  <path d="M724 403L800 379L876 403V487C876 526 845 558 800 576C755 558 724 526 724 487V403Z" fill="#092A39" stroke="#79F6DF" stroke-width="5"/>
  <path d="M763 458V437C763 417 779 401 800 401C821 401 837 417 837 437V458" fill="none" stroke="#66E6D3" stroke-width="12" stroke-linecap="round"/>
  <rect x="750" y="451" width="100" height="74" rx="18" fill="#37CDB9"/>
  <circle cx="800" cy="483" r="10" fill="#082A38"/>
  <path d="M800 491V506" stroke="#082A38" stroke-width="8" stroke-linecap="round"/>
  <path d="M724 403L800 379L876 403" fill="none" stroke="#A1FFF0" stroke-opacity="0.75" stroke-width="16" filter="url(#glow)"/>

  <path d="M1053 248C1078 305 1088 355 1084 407C1080 472 1055 526 1010 575" fill="none" stroke="#76E8DA" stroke-opacity="0.28" stroke-width="18"/>
  <path d="M1041 250C1067 309 1075 356 1070 406C1065 467 1043 514 1002 560" fill="none" stroke="#7BF3E3" stroke-width="4"/>

  <g>
    <path d="M1348 291L1197 307L1231 351L1102 433L1135 481L1267 398L1294 447L1348 291Z" fill="url(#amber)"/>
    <path d="M1348 291L1197 307L1231 351L1102 433" fill="none" stroke="#FFD98F" stroke-opacity="0.72" stroke-width="4"/>
    <circle cx="1103" cy="435" r="30" fill="#FF9D49" opacity="0.22" filter="url(#glow)"/>
    <path d="M1097 422C1065 409 1042 408 1014 419" fill="none" stroke="#FFD077" stroke-width="5" stroke-linecap="round"/>
    <path d="M1091 452C1060 467 1033 476 997 475" fill="none" stroke="#F59652" stroke-width="5" stroke-linecap="round"/>
  </g>

  <path d="M355 660H1245L1348 727Q1363 739 1344 744H256Q237 739 252 727L355 660Z" fill="#102535" stroke="#4C879C" stroke-opacity="0.42" stroke-width="3"/>
  <path d="M466 679H1134L1185 713H415L466 679Z" fill="#17394B"/>
  <g stroke="#70B9CB" stroke-opacity="0.24" stroke-width="2">
    <path d="M492 689H1108"/><path d="M460 701H1140"/><path d="M550 679L526 713"/><path d="M650 679L638 713"/><path d="M750 679L746 713"/><path d="M850 679L854 713"/><path d="M950 679L962 713"/><path d="M1050 679L1074 713"/>
  </g>
  <path d="M734 718H866L849 735H751L734 718Z" fill="#24566C" stroke="#6CB5C8" stroke-opacity="0.38"/>

  <g fill="#77DAD7">
    <circle cx="510" cy="292" r="5"/><circle cx="510" cy="325" r="5"/><circle cx="510" cy="358" r="5"/>
  </g>
  <g stroke="#77DAD7" stroke-opacity="0.28" stroke-width="2">
    <path d="M520 292H568"/><path d="M520 325H558"/><path d="M520 358H576"/>
  </g>
</svg>
