<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mail-event trails crossing an update gate toward a protected server core</title>
  <desc id="desc">Abstract editorial image of luminous mail-event trails passing through a segmented teal and amber update gate before reaching a protected hosting server core.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.54" stop-color="#102d3c"/>
      <stop offset="1" stop-color="#09131f"/>
    </linearGradient>
    <radialGradient id="field" cx="70%" cy="48%" r="48%">
      <stop offset="0" stop-color="#39c9c4" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#247d88" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071521" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23909c" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#52dbd4" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#d8fff7"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a1"/>
      <stop offset="0.48" stop-color="#e69d43"/>
      <stop offset="1" stop-color="#744725"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7fff5"/>
      <stop offset="0.42" stop-color="#35bfc0"/>
      <stop offset="1" stop-color="#164764"/>
    </linearGradient>
    <pattern id="grain" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="10" r="1" fill="#c8f7f2" opacity="0.06"/>
      <circle cx="36" cy="28" r="1.3" fill="#f7c873" opacity="0.05"/>
      <circle cx="18" cy="43" r="0.8" fill="#81d8dc" opacity="0.06"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="1110" cy="430" rx="610" ry="440" fill="url(#field)" filter="url(#blur)"/>

  <g fill="none" stroke="#76bdc6" opacity="0.14">
