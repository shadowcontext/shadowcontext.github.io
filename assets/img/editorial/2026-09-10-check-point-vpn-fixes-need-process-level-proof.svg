<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected certificate path through a layered network gateway</title>
  <desc id="desc">Abstract editorial artwork showing translucent certificate facets passing through a teal gateway boundary, with amber signals contained outside and verified green paths continuing within.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="90" x2="1460" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071826"/>
      <stop offset="0.5" stop-color="#0B2C3B"/>
      <stop offset="1" stop-color="#06131F"/>
    </linearGradient>
    <linearGradient id="gate" x1="650" y1="180" x2="1010" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3CE0C5" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0C7180" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="facet" x1="380" y1="300" x2="1160" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD27A" stop-opacity="0.82"/>
      <stop offset="0.48" stop-color="#EAFDFC" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#70F0D2" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(806 448) rotate(90) scale(390 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D8C1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#35D8C1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="innerWindow">
      <path d="M710 253L810 196L910 253V489C910 593 871 665 810 708C749 665 710 593 710 489Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="806" cy="448" rx="500" ry="390" fill="url(#halo)"/>
  <path d="M0 705C280 610 441 728 671 674C932 613 1111 487 1600 594V900H0Z" fill="#07111B" fill-opacity="0.72"/>

  <g opacity="0.32" fill="none" stroke="#74CFC7" stroke-width="2">
    <path d="M78 224C310 224 385 312 550 312"/>
