<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified access around an industrial IoT gateway</title>
  <desc id="desc">A polished abstract industrial gateway sits within layered teal access rings. An amber opening is sealed by a luminous verification layer, expressing enforced authentication at a management interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071923"/>
      <stop offset="0.52" stop-color="#0b2b35"/>
      <stop offset="1" stop-color="#10212e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#44e0d0" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#159b9a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06141e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163d49"/>
      <stop offset="0.48" stop-color="#0b2935"/>
      <stop offset="1" stop-color="#061a26"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#4cf2d1"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000814" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="84" height="84" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M84 0H0V84" fill="none" stroke="#75e6d5" stroke-opacity="0.055" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="445" rx="650" ry="410" fill="url(#halo)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M374 240A492 492 0 0 1 1226 240" stroke="#2cc9bd" stroke-opacity="0.22" stroke-width="22"/>
    <path d="M1226 660A492 492 0 0 1 374 660" stroke="#2cc9bd" stroke-opacity="0.12" stroke-width="22"/>
    <path d="M458 293A396 396 0 0 1 1132 264" stroke="#55e6d5" stroke-opacity="0.55" stroke-width="14"/>
    <path d="M1158 620A396 396 0 0 1 450 614" stroke="#159b9a" stroke-opacity="0.48" stroke-width="14"/>
    <path d="M545 337A300 300 0 0 1 1024 282" stroke="#8df4e4" stroke-opacity="0.28" stroke-width="8"/>
    <path d="M1060 590A300 300 0 0 1 525 570" stroke="#8df4e4" stroke-opacity="0.2" stroke-width="8"/>
  </g>

  <g opacity="0.68">
    <circle cx="374" cy="240" r="9" fill="#48dfcf"/>
    <circle cx="1226" cy="240" r="9" fill="#48dfcf"/>
    <circle cx="458" cy="293" r="7" fill="#80f0df"/>
    <circle cx="450" cy="614" r="7" fill="#20afa8"/>
    <circle cx="1158" cy="620" r="7" fill="#20afa8"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M605 286L800 208L995 286L1065 492L936 666H664L535 492Z" fill="url(#core)" stroke="#4cd8cb" stroke-opacity="0.58" stroke-width="5"/>
