    <circle cx="800" cy="438" r="70" fill="#061923" stroke="#57e1d2" stroke-width="5"/>
    <circle cx="800" cy="438" r="42" fill="#1e8f91" fill-opacity="0.28" stroke="#a0fff0" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M782 438L796 452L824 419" fill="none" stroke="#bafff4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#57d9cf">
      <circle cx="699" cy="583" r="7"/><circle cx="727" cy="583" r="7"/><circle cx="755" cy="583" r="7"/>
    </g>
    <rect x="829" y="575" width="77" height="14" rx="7" fill="#1b6570"/>
  </g>

  <g filter="url(#glow)">
    <path d="M1080 345C1144 371 1180 410 1197 463" fill="none" stroke="#f3a93b" stroke-opacity="0.42" stroke-width="34" stroke-linecap="round"/>
    <path d="M1066 361C1121 384 1150 414 1167 459" fill="none" stroke="url(#seal)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="1168" cy="459" r="16" fill="#fff1a8"/>
  </g>

