    <path d="M1256 585l13-7 13 7v15l-13 7-13-7z"/>
    <path d="M326 585l13-7 13 7v15l-13 7-13-7z"/>
  </g>
  <path d="M0 790C285 705 474 823 758 761C1034 701 1246 716 1600 810V900H0Z" fill="#06131d" fill-opacity="0.72"/>
</svg>
