<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded connection from a security console to an internal scanner</title>
  <desc id="desc">Abstract editorial scene with a layered security console on the left, a cyan allowlisted channel crossing a luminous boundary, and a protected scanner node on the right. An amber diverted route is stopped before entering the internal zone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.52" stop-color="#0b2236"/>
      <stop offset="1" stop-color="#102f42"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="48%" r="46%">
      <stop offset="0" stop-color="#23d6d2" stop-opacity=".25"/>
      <stop offset="1" stop-color="#23d6d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dffcff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#69cbd4" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="channel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cdde0" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#55f0e3"/>
      <stop offset="1" stop-color="#8fffe9" stop-opacity=".42"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8bd8e2" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1190" cy="430" r="290" fill="#21c9c5" opacity=".08" filter="url(#soft)"/>

  <path d="M902 96C847 207 872 296 835 395c-41 109-29 233 62 409" fill="none" stroke="#a6fff0" stroke-opacity=".13" stroke-width="42"/>
  <path d="M902 96C847 207 872 296 835 395c-41 109-29 233 62 409" fill="none" stroke="#62e4dc" stroke-opacity=".55" stroke-width="3"/>
  <path d="M949 80C900 206 927 298 891 404c-37 108-18 248 65 420" fill="none" stroke="#2eb2bc" stroke-opacity=".2" stroke-width="2"/>

