    <rect x="28" y="30" width="464" height="460" rx="28" fill="url(#glass)" stroke="#b6f5f3" stroke-opacity=".13"/>
    <circle cx="70" cy="73" r="9" fill="#57e4de"/>
    <circle cx="101" cy="73" r="9" fill="#296276"/>
    <circle cx="132" cy="73" r="9" fill="#296276"/>
