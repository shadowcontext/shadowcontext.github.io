    <circle cx="1057" cy="505" r="6"/>
    <circle cx="520" cy="355" r="7"/>
  </g>
  <g opacity=".7" fill="none" stroke="#70dbdf" stroke-width="4">
    <path d="M1078 366l28 28 55-67"/>
    <circle cx="1110" cy="364" r="71"/>
    <path d="M368 646c82 68 170 97 265 88" stroke-dasharray="3 22" stroke-linecap="round"/>
    <path d="M981 738c92 1 170-28 236-88" stroke-dasharray="3 22" stroke-linecap="round"/>
  </g>
</svg>
