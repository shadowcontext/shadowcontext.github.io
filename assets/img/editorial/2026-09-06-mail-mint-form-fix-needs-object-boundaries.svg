    <path d="M1 54 V230 C1 260 74 284 165 284 C256 284 329 260 329 230 V54" fill="#17465d" stroke="#68d7d5" stroke-width="5"/>
    <ellipse cx="165" cy="54" rx="164" ry="54" fill="#236078" stroke="#8af2e4" stroke-width="5"/>
    <ellipse cx="165" cy="54" rx="106" ry="28" fill="#0a2d40"/>
    <path d="M1 139 C1 169 74 193 165 193 C256 193 329 169 329 139" fill="none" stroke="#69cdd2" stroke-width="4" opacity="0.6"/>
  </g>
  <g fill="#d8fff8">
    <circle cx="1070" cy="601" r="8"/><circle cx="1102" cy="612" r="5"/><circle cx="1130" cy="618" r="4"/>
  </g>
