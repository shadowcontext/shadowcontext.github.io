<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Form data crossing a protected type boundary</title>
  <desc id="desc">Abstract editorial artwork showing luminous form cards moving through layered teal validation gates, while angular object shapes are diverted away from a protected database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2a3b"/>
      <stop offset="1" stop-color="#101c36"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36e0c2"/>
      <stop offset="1" stop-color="#58a8ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dffbf7" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#8fded8" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#3ce6c5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3ce6c5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020b12" flood-opacity="0.5"/>
    </filter>
    <clipPath id="stream"><path d="M112 250 C440 170 522 226 790 415 C1040 592 1242 600 1500 480 L1500 690 C1215 782 940 682 715 520 C486 356 326 334 112 410 Z"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="820" cy="445" r="410" fill="url(#halo)"/>
  <g opacity="0.22" fill="none" stroke="#79b9d2" stroke-width="2">
    <path d="M0 150 C310 48 515 144 720 290 S1130 526 1600 300"/>
    <path d="M0 742 C340 638 568 698 770 793"/>
    <circle cx="1400" cy="122" r="72"/>
    <circle cx="1400" cy="122" r="104"/>
  </g>
  <g clip-path="url(#stream)" opacity="0.34">
    <path d="M80 322 C430 210 555 292 777 459 C1010 634 1260 667 1540 540" fill="none" stroke="#49d8c1" stroke-width="120" filter="url(#glow)"/>
    <path d="M80 322 C430 210 555 292 777 459 C1010 634 1260 667 1540 540" fill="none" stroke="#65acd4" stroke-width="3" stroke-dasharray="12 22"/>
  </g>
  <g filter="url(#soft)">
    <g transform="translate(145 248) rotate(-8)">
      <rect width="250" height="168" rx="24" fill="url(#card)"/>
      <circle cx="42" cy="42" r="12" fill="#0d6b72"/>
      <rect x="70" y="31" width="132" height="20" rx="10" fill="#166d78" opacity="0.55"/>
      <rect x="30" y="78" width="190" height="16" rx="8" fill="#217d85" opacity="0.44"/>
      <rect x="30" y="110" width="144" height="16" rx="8" fill="#217d85" opacity="0.34"/>
    </g>
    <g transform="translate(360 330) rotate(4) scale(.82)">
      <rect width="250" height="168" rx="24" fill="url(#card)"/>
      <circle cx="42" cy="42" r="12" fill="#0d6b72"/>
      <rect x="70" y="31" width="132" height="20" rx="10" fill="#166d78" opacity="0.55"/>
      <rect x="30" y="78" width="190" height="16" rx="8" fill="#217d85" opacity="0.44"/>
      <rect x="30" y="110" width="144" height="16" rx="8" fill="#217d85" opacity="0.34"/>
    </g>
  </g>
  <g transform="translate(690 150)" filter="url(#soft)">
    <path d="M145 0 L265 70 L265 346 L145 416 L25 346 L25 70 Z" fill="#082838" stroke="url(#gate)" stroke-width="14"/>
    <path d="M145 55 L213 94 L213 322 L145 361 L77 322 L77 94 Z" fill="#0f3d4e" stroke="#54d8cc" stroke-width="5" opacity="0.96"/>
    <path d="M111 208 L137 235 L184 177" fill="none" stroke="#d5fff8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="145" cy="208" r="103" fill="none" stroke="#49e2c7" stroke-width="3" stroke-dasharray="7 15"/>
  </g>
  <g transform="translate(920 220)" opacity="0.96">
    <path d="M35 26 L116 0 L183 48 L164 133 L81 155 L12 103 Z" fill="#ef8c73" opacity="0.8"/>
    <path d="M100 50 L149 33 L176 75 L150 117 L98 106 L78 72 Z" fill="#7b3b59"/>
    <path d="M0 196 L56 153 L120 180 L125 250 L63 283 L9 252 Z" fill="#f1ae77" opacity="0.75"/>
    <path d="M35 26 L220 300" stroke="#ffbd9e" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g transform="translate(1160 430)" filter="url(#soft)">
