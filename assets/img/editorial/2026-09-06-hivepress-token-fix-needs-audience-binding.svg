<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Federated token crossing an application verification boundary</title>
  <desc id="desc">An abstract luminous access token passes through a layered verification ring toward a protected identity vault, illustrating application audience binding.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="70" x2="1480" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152F"/>
      <stop offset="0.52" stop-color="#0D2850"/>
      <stop offset="1" stop-color="#081A30"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(931 438) rotate(90) scale(385 550)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2BE0D0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2BE0D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="270" y1="450" x2="1280" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65A8FF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#65A8FF" stop-opacity="0.72"/>
      <stop offset="0.66" stop-color="#38E8CE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#38E8CE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tokenFace" x1="315" y1="359" x2="543" y2="555" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5C8FF"/>
      <stop offset="0.5" stop-color="#5F91E8"/>
      <stop offset="1" stop-color="#365AAB"/>
    </linearGradient>
    <linearGradient id="vaultFace" x1="1122" y1="282" x2="1392" y2="632" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39E4D2"/>
      <stop offset="1" stop-color="#167D91"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#020915" flood-opacity="0.62"/>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="9" r="1" fill="#C7E8FF" opacity="0.12"/>
      <circle cx="42" cy="33" r="1.3" fill="#79DCD3" opacity="0.08"/>
      <circle cx="24" cy="57" r="0.8" fill="#C7E8FF" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="920" cy="447" rx="566" ry="395" fill="url(#aura)"/>

  <g opacity="0.55" fill="none" stroke="#426994" stroke-width="2">
    <path d="M111 217C278 145 431 160 574 243"/>
    <path d="M101 688C270 749 436 735 576 658"/>
    <path d="M1033 169C1196 108 1390 142 1508 251"/>
    <path d="M1047 727C1222 790 1395 755 1508 653"/>
  </g>
  <g fill="#78A8D8" opacity="0.5">
    <circle cx="150" cy="202" r="5"/><circle cx="279" cy="169" r="4"/><circle cx="450" cy="190" r="5"/>
    <circle cx="141" cy="699" r="5"/><circle cx="314" cy="731" r="4"/><circle cx="477" cy="697" r="5"/>
    <circle cx="1112" cy="146" r="4"/><circle cx="1305" cy="145" r="5"/><circle cx="1467" cy="223" r="4"/>
    <circle cx="1113" cy="748" r="4"/><circle cx="1306" cy="758" r="5"/><circle cx="1467" cy="677" r="4"/>
  </g>

  <path d="M405 450H1308" stroke="url(#beam)" stroke-width="18" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M436 450H1281" stroke="#BCEFFF" stroke-opacity="0.68" stroke-width="2" stroke-dasharray="3 24" stroke-linecap="round"/>

  <g transform="translate(453 450) rotate(-10)" filter="url(#shadow)">
    <path d="M-116-67C-116-83-103-96-87-96H70L121-45V45L70 96H-87C-103 96-116 83-116 67Z" fill="url(#tokenFace)"/>
    <path d="M70-96V-45H121" fill="none" stroke="#DAEAFF" stroke-width="5" opacity="0.72"/>
    <circle cx="-52" cy="0" r="27" fill="#0C2447" opacity="0.75"/>
    <circle cx="-52" cy="0" r="12" fill="#9CC7FF"/>
    <path d="M-5-28H57M-5 0H79M-5 28H45" stroke="#E7F1FF" stroke-width="9" stroke-linecap="round" opacity="0.78"/>
  </g>

  <g transform="translate(820 450)" filter="url(#softGlow)">
    <circle r="160" fill="#0A1F3F" stroke="#2FE4D0" stroke-width="8"/>
    <circle r="125" fill="none" stroke="#83BFFF" stroke-width="3" stroke-dasharray="12 18" opacity="0.85"/>
    <circle r="87" fill="#102F55" stroke="#D0FBF7" stroke-width="3"/>
    <path d="M-36 2L-9 30L45-34" fill="none" stroke="#55F1D8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#8FDDFF">
      <circle cx="0" cy="-160" r="8"/><circle cx="160" cy="0" r="8"/><circle cx="0" cy="160" r="8"/><circle cx="-160" cy="0" r="8"/>
    </g>
  </g>

  <g transform="translate(1264 450)" filter="url(#shadow)">
    <path d="M0-185L154-120V8C154 105 89 171 0 205C-89 171-154 105-154 8V-120Z" fill="url(#vaultFace)"/>
    <path d="M0-153L124-102V4C124 78 77 130 0 165C-77 130-124 78-124 4V-102Z" fill="#0C2C4C" stroke="#8BF6E8" stroke-width="4"/>
    <rect x="-62" y="-18" width="124" height="106" rx="23" fill="#174D6B" stroke="#91F4E8" stroke-width="5"/>
    <path d="M-35-18V-51C-35-98 35-98 35-51V-18" fill="none" stroke="#91F4E8" stroke-width="14" stroke-linecap="round"/>
    <circle cy="30" r="15" fill="#C5FFF7"/>
    <path d="M0 43V64" stroke="#C5FFF7" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g opacity="0.7">
    <circle cx="621" cy="450" r="9" fill="#8DBBFF"/>
    <circle cx="1008" cy="450" r="9" fill="#5AE9D6"/>
    <path d="M621 450C668 369 716 329 820 290" fill="none" stroke="#6CA1E9" stroke-width="2"/>
    <path d="M1008 450C1057 529 1111 568 1170 584" fill="none" stroke="#57DCCA" stroke-width="2"/>
  </g>
</svg>
