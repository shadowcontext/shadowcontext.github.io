    <path d="M1142 579 l14 8 v16 l-14 8 -14-8 v-16z"/>
  </g>
  <g fill="none" stroke="#f7b45f" stroke-width="3" stroke-opacity="0.62">
    <circle cx="415" cy="397" r="33"/><circle cx="1185" cy="397" r="33"/>
    <circle cx="458" cy="595" r="26"/><circle cx="1142" cy="595" r="26"/>
  </g>
  <path d="M0 810 C280 760 470 846 720 806 C980 764 1245 846 1600 778 V900 H0Z" fill="#06111f" fill-opacity="0.64"/>
</svg>
