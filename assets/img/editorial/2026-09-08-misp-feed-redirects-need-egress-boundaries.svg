<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded redirects protect an intelligence feed</title>
  <desc id="desc">Abstract blue intelligence streams pass through layered redirect gates while amber credential tokens remain inside a protected boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102b45"/>
      <stop offset="1" stop-color="#07121f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2bd9d1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2bd9d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2479ba"/>
      <stop offset="0.55" stop-color="#45e4dc"/>
      <stop offset="1" stop-color="#8ff7e7"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89f4e6" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#158ab2" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.58"/>
    </filter>
    <clipPath id="innerShield">
      <path d="M1195 220 L1365 282 V438 C1365 560 1295 652 1195 700 C1095 652 1025 560 1025 438 V282 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="820" cy="450" rx="640" ry="360" fill="url(#glow)"/>
  <g opacity="0.16" fill="none" stroke="#8fd8e8" stroke-width="2">
