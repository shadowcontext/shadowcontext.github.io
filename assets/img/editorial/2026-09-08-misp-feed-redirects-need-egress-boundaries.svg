    </g>
  </g>

  <g fill="#ffc766" stroke="#7c4e17" stroke-width="7" filter="url(#shadow)">
    <circle cx="1135" cy="525" r="28"/>
    <circle cx="1225" cy="548" r="28"/>
    <circle cx="1300" cy="500" r="28"/>
