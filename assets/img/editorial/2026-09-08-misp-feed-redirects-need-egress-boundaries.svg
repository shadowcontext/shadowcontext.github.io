    <path d="M105 455 C285 455 340 350 510 350 C650 350 690 450 825 450 C935 450 980 410 1068 410" fill="none" stroke="#d7fffa" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  </g>

