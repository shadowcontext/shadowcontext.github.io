<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Descriptor lifetime contained at a privilege boundary</title>
  <desc id="desc">An abstract amber descriptor travels through layered violet and blue namespace forms, then ends at a luminous sealed boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d24"/>
      <stop offset="0.52" stop-color="#161440"/>
      <stop offset="1" stop-color="#071c32"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ce1e6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5ce1e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7dff"/>
      <stop offset="1" stop-color="#4533a7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ffe29a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shine" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#84a7d7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1140" cy="450" rx="430" ry="400" fill="url(#glow)" filter="url(#soft)"/>
  <path d="M0 700C260 575 420 730 675 618S1080 510 1600 624V900H0Z" fill="#07101f" opacity="0.72"/>
  <g opacity="0.9">
    <path d="M250 228L525 146L755 276L724 656L466 744L230 596Z" fill="#151a47" stroke="#343c82" stroke-width="3"/>
    <path d="M370 274L548 222L684 307L664 584L493 645L350 548Z" fill="#10183d" stroke="#5262af" stroke-width="3"/>
    <circle cx="515" cy="435" r="116" fill="#10162e" stroke="#6b78c8" stroke-width="4"/>
    <circle cx="515" cy="435" r="74" fill="none" stroke="#8292e6" stroke-opacity="0.34" stroke-width="2" stroke-dasharray="9 14"/>
  </g>
  <g>
    <path d="M835 138C946 190 1002 274 1002 389V626C1002 692 1056 746 1122 746H1246" fill="none" stroke="#241e67" stroke-width="92" stroke-linecap="round"/>
    <path d="M835 138C946 190 1002 274 1002 389V626C1002 692 1056 746 1122 746H1246" fill="none" stroke="url(#gate)" stroke-width="22" stroke-linecap="round"/>
    <path d="M1095 120V780" stroke="#6f5ee2" stroke-opacity="0.24" stroke-width="4"/>
    <path d="M1180 120V780" stroke="#55c8df" stroke-opacity="0.32" stroke-width="4"/>
  </g>
  <g filter="url(#shine)">
    <path d="M480 435H913" stroke="url(#amber)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="481" cy="435" r="40" fill="#ffb547"/>
    <circle cx="481" cy="435" r="16" fill="#12142e"/>
    <path d="M913 404V466M913 435H961" stroke="#ffe7aa" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g transform="translate(1095 435)" filter="url(#shine)">
    <circle r="108" fill="#0d2241" stroke="#65dce2" stroke-width="7"/>
    <circle r="79" fill="none" stroke="#65dce2" stroke-opacity="0.38" stroke-width="4"/>
    <path d="M-35 4L-8 31L43-34" fill="none" stroke="#c2fbef" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M1240 313H1445" stroke="#54c9df" stroke-width="7" opacity="0.72"/>
    <path d="M1268 365H1500" stroke="#7b6ce8" stroke-width="5" opacity="0.48"/>
    <path d="M1248 557H1468" stroke="#54c9df" stroke-width="7" opacity="0.62"/>
    <path d="M1290 608H1518" stroke="#7b6ce8" stroke-width="5" opacity="0.42"/>
  </g>
  <g fill="#8be7e8">
    <circle cx="1445" cy="313" r="9"/><circle cx="1500" cy="365" r="7"/>
    <circle cx="1468" cy="557" r="9"/><circle cx="1518" cy="608" r="7"/>
  </g>
</svg>
