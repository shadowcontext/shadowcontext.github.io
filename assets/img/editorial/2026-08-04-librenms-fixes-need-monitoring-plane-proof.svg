<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered protection around a network monitoring plane</title>
  <desc id="desc">An abstract dark network landscape sends amber telemetry paths through translucent teal filters toward a protected monitoring console.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.55" stop-color="#0b2430"/>
      <stop offset="1" stop-color="#10182b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#47e3cf" stop-opacity=".28"/>
      <stop offset="1" stop-color="#47e3cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff7e8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1d8795" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d4d" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#ffc36a"/>
      <stop offset="1" stop-color="#7cf1dc"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8adfd5" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="450" rx="510" ry="390" fill="url(#halo)"/>
  <path d="M-60 710C250 590 355 770 610 596S1045 410 1660 540" fill="none" stroke="#0d4a58" stroke-width="150" stroke-opacity=".18" filter="url(#soft)"/>

  <g fill="none" stroke="url(#amber)" stroke-linecap="round">
    <path d="M70 170C285 170 295 337 520 337S640 420 760 420" stroke-width="7"/>
    <path d="M-30 450C240 450 320 522 525 522S654 472 760 472" stroke-width="5"/>
    <path d="M95 758C310 758 385 620 555 620S680 526 765 526" stroke-width="8"/>
    <path d="M1510 145C1325 145 1305 320 1120 320S1015 397 930 397" stroke-width="5"/>
    <path d="M1640 690C1395 690 1340 560 1115 560S1020 505 930 505" stroke-width="7"/>
  </g>

  <g fill="#ffc36a" filter="url(#glow)">
    <circle cx="118" cy="170" r="10"/><circle cx="214" cy="450" r="8"/><circle cx="150" cy="758" r="11"/>
    <circle cx="1460" cy="145" r="8"/><circle cx="1515" cy="690" r="10"/>
  </g>
  <g fill="#4fe3cf" opacity=".8">
    <circle cx="342" cy="266" r="6"/><circle cx="426" cy="522" r="6"/><circle cx="451" cy="660" r="6"/>
    <circle cx="1254" cy="256" r="6"/><circle cx="1295" cy="621" r="6"/>
  </g>

  <g transform="translate(625 155)">
    <path d="M70 35L350 0l70 575-280 35z" fill="url(#glass)" stroke="#5de8d6" stroke-opacity=".52" stroke-width="3"/>
    <path d="M20 90L300 55l70 575-280 35z" fill="url(#glass)" stroke="#5de8d6" stroke-opacity=".68" stroke-width="3"/>
    <path d="M-30 145L250 110l70 575-280 35z" fill="url(#glass)" stroke="#8cf8e9" stroke-opacity=".82" stroke-width="3"/>
    <g stroke="#a4fff0" stroke-opacity=".25" stroke-width="2">
      <path d="M44 232l242-30M54 320l242-30M65 408l242-30M76 496l242-30M87 584l242-30"/>
    </g>
  </g>

  <g transform="translate(690 270)">
    <rect x="0" y="0" width="280" height="330" rx="30" fill="#071b27" stroke="#87f5e5" stroke-width="5"/>
    <rect x="26" y="28" width="228" height="178" rx="18" fill="#0b3440" stroke="#3ab8b2" stroke-width="2"/>
    <path d="M48 160C77 128 97 145 122 102s50 39 78-8 31-31 39-40" fill="none" stroke="#7cf1dc" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#4ac9bd">
      <rect x="30" y="238" width="140" height="14" rx="7" opacity=".75"/>
      <rect x="30" y="270" width="205" height="12" rx="6" opacity=".38"/>
      <rect x="30" y="299" width="176" height="12" rx="6" opacity=".24"/>
    </g>
    <circle cx="227" cy="242" r="18" fill="#102f39" stroke="#ffc36a" stroke-width="4"/>
  </g>

  <g fill="none" stroke="#7cf1dc" stroke-width="3" opacity=".65">
    <circle cx="830" cy="435" r="235"/>
    <circle cx="830" cy="435" r="278" stroke-dasharray="8 18"/>
  </g>
  <g fill="#7cf1dc" filter="url(#glow)">
    <circle cx="600" cy="389" r="7"/><circle cx="1062" cy="482" r="7"/><circle cx="890" cy="165" r="7"/>
  </g>
</svg>
