<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified endpoint security database update</title>
  <desc id="desc">An abstract shield at the center of luminous update rings, with database tiles moving from stale amber to verified teal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.52" stop-color="#102840"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#29e0c1" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#1598b4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fffe4"/>
      <stop offset="0.48" stop-color="#20c9b2"/>
      <stop offset="1" stop-color="#087b92"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7fff7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1d9f9b" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#9edbd7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="435" rx="620" ry="420" fill="url(#halo)"/>

  <path d="M132 690C390 574 510 650 710 577S1058 478 1468 594" fill="none" stroke="#4ad8cb" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M98 741C373 621 536 706 747 625s435-126 775-50" fill="none" stroke="#8feee0" stroke-opacity="0.06" stroke-width="2"/>

  <g fill="none" transform="rotate(-8 800 430)">
    <ellipse cx="800" cy="430" rx="520" ry="292" stroke="#6cf1de" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 18"/>
    <ellipse cx="800" cy="430" rx="405" ry="226" stroke="#2bcbbd" stroke-opacity="0.24" stroke-width="3" stroke-dasharray="90 24 10 24"/>
    <ellipse cx="800" cy="430" rx="303" ry="168" stroke="#a2fff0" stroke-opacity="0.19" stroke-width="2"/>
  </g>

  <g opacity="0.95">
    <g transform="translate(285 260) rotate(-7)">
      <ellipse cx="0" cy="0" rx="92" ry="25" fill="#c58433" fill-opacity="0.2" stroke="#ffbd67" stroke-opacity="0.68" stroke-width="2"/>
      <path d="M-92 0v78c0 14 41 25 92 25s92-11 92-25V0M-92 38c0 14 41 25 92 25s92-11 92-25" fill="#bd7627" fill-opacity="0.12" stroke="#ffbd67" stroke-opacity="0.45" stroke-width="2"/>
      <circle cx="58" cy="72" r="7" fill="#ffbd67"/>
    </g>
    <g transform="translate(1268 278) rotate(7)">
      <ellipse cx="0" cy="0" rx="92" ry="25" fill="#1ac5b3" fill-opacity="0.2" stroke="#79fce7" stroke-opacity="0.78" stroke-width="2"/>
      <path d="M-92 0v78c0 14 41 25 92 25s92-11 92-25V0M-92 38c0 14 41 25 92 25s92-11 92-25" fill="#159e9a" fill-opacity="0.13" stroke="#79fce7" stroke-opacity="0.55" stroke-width="2"/>
      <path d="m48 70 13 13 25-29" fill="none" stroke="#b9fff2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g stroke-linecap="round">
    <path d="M415 344C520 337 560 357 636 390" fill="none" stroke="#e9aa5a" stroke-opacity="0.48" stroke-width="5" stroke-dasharray="2 18"/>
    <path d="M966 389c79-41 144-55 210-53" fill="none" stroke="#53e8d4" stroke-opacity="0.65" stroke-width="5" stroke-dasharray="2 18"/>
    <circle cx="629" cy="387" r="7" fill="#ffbd67" filter="url(#glow)"/>
    <circle cx="974" cy="384" r="7" fill="#78fbe8" filter="url(#glow)"/>
