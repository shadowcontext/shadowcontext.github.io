    <rect x="-106" y="-47" width="212" height="94" rx="20" fill="#0b2d3b" stroke="#5debd8" stroke-opacity="0.47" stroke-width="2"/>
    <rect x="-73" y="-14" width="100" height="11" rx="5.5" fill="#7cf9e7" opacity="0.28"/>
    <rect x="-73" y="9" width="138" height="11" rx="5.5" fill="#7cf9e7" opacity="0.17"/>
    <circle cx="70" cy="0" r="22" fill="#1cc8b5" fill-opacity="0.2" stroke="#7cf9e7" stroke-width="2"/>
    <path d="m59 0 8 8 15-18" fill="none" stroke="#8ffff0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
