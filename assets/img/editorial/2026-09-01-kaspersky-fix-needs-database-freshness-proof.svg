    <path d="M0-207c76 49 146 61 199 74V8c0 127-78 215-199 280C-121 223-199 135-199 8v-141c53-13 123-25 199-74Z" fill="url(#glass)" stroke="url(#shield)" stroke-width="3"/>
    <path d="M-91 15-22 84 107-69" fill="none" stroke="url(#shield)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-10" r="127" fill="none" stroke="#89fbe9" stroke-opacity="0.1" stroke-width="18"/>
  </g>

  <g fill="#79f9e7">
    <circle cx="497" cy="191" r="4" opacity="0.65"/>
    <circle cx="1120" cy="170" r="5" opacity="0.45"/>
    <circle cx="1372" cy="525" r="4" opacity="0.7"/>
    <circle cx="245" cy="536" r="5" opacity="0.38"/>
    <circle cx="1208" cy="703" r="3" opacity="0.65"/>
  </g>
  <g fill="#22d5c2" opacity="0.34" filter="url(#soft)">
