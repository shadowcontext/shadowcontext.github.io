<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Independent gates for AI-generated software remediation</title>
  <desc id="desc">Abstract violet code fragments move through separate teal review gates toward a protected software release, illustrating independent validation and approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08172a"/>
      <stop offset="0.55" stop-color="#102442"/>
      <stop offset="1" stop-color="#171332"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1160" cy="430" r="410" fill="url(#glow)"/>
  <circle cx="335" cy="465" r="245" fill="#7c3aed" opacity="0.12" filter="url(#soft)"/>
  <path d="M110 680 C390 535 530 635 790 490 S1190 330 1505 220" fill="none" stroke="#94a3b8" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M90 735 C410 590 610 700 855 540 S1235 390 1515 310" fill="none" stroke="#5eead4" stroke-opacity="0.13" stroke-width="3"/>

  <g filter="url(#shadow)">
    <g transform="translate(155 250) rotate(-8 210 195)">
      <rect x="0" y="0" width="420" height="390" rx="46" fill="#15294b" stroke="#a78bfa" stroke-opacity="0.42" stroke-width="3"/>
      <rect x="47" y="58" width="225" height="18" rx="9" fill="url(#violet)" opacity="0.92"/>
      <rect x="47" y="102" width="310" height="14" rx="7" fill="#c4b5fd" opacity="0.45"/>
      <rect x="47" y="140" width="168" height="14" rx="7" fill="#8b5cf6" opacity="0.7"/>
      <rect x="82" y="192" width="260" height="15" rx="7" fill="#ddd6fe" opacity="0.55"/>
      <rect x="82" y="232" width="196" height="15" rx="7" fill="#8b5cf6" opacity="0.72"/>
      <rect x="47" y="286" width="288" height="16" rx="8" fill="#c4b5fd" opacity="0.38"/>
      <circle cx="354" cy="329" r="22" fill="#f59e0b" opacity="0.88"/>
    </g>

    <g transform="translate(640 120)">
      <rect x="0" y="0" width="72" height="660" rx="36" fill="#0b1d34" stroke="url(#teal)" stroke-width="7"/>
      <circle cx="36" cy="168" r="17" fill="#5eead4"/>
      <circle cx="36" cy="330" r="17" fill="#2dd4bf"/>
      <circle cx="36" cy="492" r="17" fill="#14b8a6"/>
    </g>

    <g transform="translate(835 170)">
      <rect x="0" y="0" width="72" height="560" rx="36" fill="#0b1d34" stroke="url(#teal)" stroke-width="7"/>
      <path d="M19 164 L32 178 L55 145" fill="none" stroke="#99f6e4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 312 L32 326 L55 293" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 460 L32 474 L55 441" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(1040 245)">
      <path d="M230 0 L430 88 L402 318 C389 438 315 514 230 548 C145 514 71 438 58 318 L30 88 Z" fill="#102b43" stroke="url(#teal)" stroke-width="8"/>
      <path d="M230 72 L352 126 L334 300 C326 373 281 421 230 446 C179 421 134 373 126 300 L108 126 Z" fill="#13203d" stroke="#99f6e4" stroke-opacity="0.42" stroke-width="3"/>
      <rect x="167" y="194" width="126" height="150" rx="26" fill="#0f766e"/>
      <path d="M194 194 V163 C194 113 266 113 266 163 V194" fill="none" stroke="#99f6e4" stroke-width="18" stroke-linecap="round"/>
      <circle cx="230" cy="255" r="19" fill="#ccfbf1"/>
      <rect x="221" y="268" width="18" height="42" rx="9" fill="#ccfbf1"/>
    </g>
  </g>

  <g opacity="0.8">
    <path d="M535 355 C584 355 596 355 638 355" stroke="#c4b5fd" stroke-width="9" stroke-linecap="round"/>
    <path d="M714 355 C758 355 780 355 833 355" stroke="#5eead4" stroke-width="9" stroke-linecap="round"/>
    <path d="M908 355 C955 355 977 355 1037 355" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round"/>
    <circle cx="585" cy="355" r="13" fill="#a78bfa"/>
    <circle cx="780" cy="355" r="13" fill="#5eead4"/>
    <circle cx="977" cy="355" r="13" fill="#2dd4bf"/>
  </g>
  <g fill="#e2e8f0" opacity="0.32">
    <circle cx="123" cy="128" r="4"/><circle cx="260" cy="96" r="3"/><circle cx="455" cy="166" r="5"/>
    <circle cx="989" cy="95" r="4"/><circle cx="1440" cy="126" r="5"/><circle cx="1510" cy="686" r="4"/>
    <circle cx="775" cy="812" r="3"/><circle cx="309" cy="778" r="5"/>
  </g>
</svg>
