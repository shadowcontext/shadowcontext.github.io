    <circle cx="126" cy="630" r="20"/>
    <circle cx="1474" cy="630" r="20"/>
  </g>

  <ellipse cx="800" cy="700" rx="335" ry="72" fill="#020A12" opacity=".55" filter="url(#soft)"/>
