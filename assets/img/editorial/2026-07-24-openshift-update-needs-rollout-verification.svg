<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered cluster with guarded update pathways</title>
  <desc id="desc">A polished abstract editorial scene showing a layered cluster surrounded by four guarded pathways while a controlled blue update wave passes through it.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071626"/>
      <stop offset="0.52" stop-color="#102D42"/>
      <stop offset="1" stop-color="#08131F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(800 452) rotate(90) scale(390 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39C6E8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#39C6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="230" y1="0" x2="1370" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25A9D6" stop-opacity="0"/>
      <stop offset=".22" stop-color="#25A9D6" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#8AE9F5" stop-opacity=".92"/>
      <stop offset=".78" stop-color="#25A9D6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#25A9D6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate" x1="535" y1="280" x2="1075" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D5067"/>
      <stop offset="1" stop-color="#0B2538"/>
    </linearGradient>
    <linearGradient id="edge" x1="530" y1="290" x2="1080" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F2F7"/>
      <stop offset=".5" stop-color="#36BBD8"/>
      <stop offset="1" stop-color="#1B6D91"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#020A12" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="800" cy="450" r="306" fill="none" stroke="#76DDEB" stroke-opacity=".1" stroke-width="2"/>
  <circle cx="800" cy="450" r="370" fill="none" stroke="#76DDEB" stroke-opacity=".06" stroke-width="2"/>

  <g fill="none" stroke="#54C9E0" stroke-linecap="round">
    <path d="M128 218 C330 218 390 332 570 360" stroke-opacity=".28" stroke-width="8"/>
    <path d="M1472 218 C1270 218 1210 332 1030 360" stroke-opacity=".28" stroke-width="8"/>
