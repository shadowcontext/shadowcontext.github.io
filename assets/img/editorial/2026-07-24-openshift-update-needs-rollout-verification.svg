    <circle cx="641" cy="499" r="9"/>
    <circle cx="963" cy="408" r="9"/>
    <circle cx="1218" cy="500" r="9"/>
  </g>
  <g fill="none" stroke="#B7F4F6" stroke-opacity=".2" stroke-width="2">
    <path d="M282 118 H1318"/>
    <path d="M282 782 H1318"/>
  </g>
</svg>
