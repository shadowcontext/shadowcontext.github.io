    <path d="M522 470 L800 608 L1078 470 L800 332 Z" fill="url(#plate)" stroke="#309BB6" stroke-width="4"/>
    <path d="M522 395 L800 533 L1078 395 L800 257 Z" fill="#17445B" stroke="url(#edge)" stroke-width="5"/>
    <path d="M598 395 L800 495 L1002 395 L800 295 Z" fill="#0A2334" stroke="#6FDCE9" stroke-opacity=".62" stroke-width="3"/>
