  <path d="M254 491 C430 415 546 579 714 493 C868 414 973 394 1110 466 C1217 522 1298 531 1362 492" fill="none" stroke="#C2F8FA" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>

  <g fill="#9DECF2">
