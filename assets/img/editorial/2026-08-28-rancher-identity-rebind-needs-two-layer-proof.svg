<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity binding protected by two control-plane layers</title>
  <desc id="desc">Abstract identity nodes remain connected to a bright central anchor while two translucent blue layers block an amber rerouting path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="0.55" stop-color="#0b2740"/>
      <stop offset="1" stop-color="#081824"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="56%">
      <stop offset="0" stop-color="#3fe0d0" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#278bc2" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071321" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="layerA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f76b8" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1f76b8" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="layerB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdcff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1a5d96" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="anchor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fff9"/>
      <stop offset="0.4" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2089bd"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcc66" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff9b3d" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <circle cx="800" cy="442" r="305" fill="none" stroke="#4db7df" stroke-opacity="0.09" stroke-width="2"/>
  <circle cx="800" cy="442" r="225" fill="none" stroke="#5eead4" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="5 18"/>
  <path d="M250 650 C475 540 544 318 790 440" fill="none" stroke="#367fac" stroke-opacity="0.42" stroke-width="7"/>
  <path d="M1350 236 C1118 250 1015 380 810 439" fill="none" stroke="#367fac" stroke-opacity="0.42" stroke-width="7"/>
  <path d="M329 236 C510 280 635 366 789 439" fill="none" stroke="#367fac" stroke-opacity="0.42" stroke-width="7"/>
  <path d="M1289 686 C1080 598 979 500 810 446" fill="none" stroke="#367fac" stroke-opacity="0.42" stroke-width="7"/>
  <g fill="#76d6ee" stroke="#c7f7ff" stroke-opacity="0.65" stroke-width="3">
    <circle cx="250" cy="650" r="25"/><circle cx="1350" cy="236" r="25"/>
    <circle cx="329" cy="236" r="25"/><circle cx="1289" cy="686" r="25"/>
  </g>
  <g fill="none" stroke="#5eb9df" stroke-opacity="0.22" stroke-width="3">
    <circle cx="250" cy="650" r="46"/><circle cx="1350" cy="236" r="46"/>
    <circle cx="329" cy="236" r="46"/><circle cx="1289" cy="686" r="46"/>
  </g>
  <ellipse cx="800" cy="702" rx="320" ry="54" fill="#0ad1c2" fill-opacity="0.13" filter="url(#soft)"/>
  <rect x="548" y="188" width="504" height="508" rx="96" fill="url(#layerA)" stroke="#5eead4" stroke-opacity="0.48" stroke-width="3"/>
  <rect x="622" y="262" width="356" height="360" rx="76" fill="url(#layerB)" stroke="#a4e9ff" stroke-opacity="0.58" stroke-width="3"/>
  <path d="M1230 433 C1102 433 1051 515 975 515" fill="none" stroke="url(#amber)" stroke-width="14" stroke-linecap="round"/>
  <path d="M1005 485 L967 515 L1005 545" fill="none" stroke="#ffb34f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1050" cy="515" r="20" fill="#ffad45" fill-opacity="0.24" stroke="#ffbd62" stroke-width="3"/>
  <g filter="url(#glow)">
    <circle cx="800" cy="442" r="72" fill="#38c9c0" fill-opacity="0.22" stroke="#bffef4" stroke-width="4"/>
    <path d="M800 382 C828 382 851 404 851 432 C851 452 839 468 822 477 L822 528 L778 528 L778 477 C761 468 749 452 749 432 C749 404 772 382 800 382Z" fill="url(#anchor)"/>
    <circle cx="800" cy="431" r="17" fill="#08243a"/>
  </g>
  <g fill="#d9fff9" fill-opacity="0.72">
    <circle cx="570" cy="442" r="5"/><circle cx="1030" cy="442" r="5"/>
    <circle cx="800" cy="238" r="5"/><circle cx="800" cy="647" r="5"/>
  </g>
  <path d="M170 774 C512 706 1082 783 1430 712" fill="none" stroke="#5eead4" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M170 800 C532 732 1098 809 1430 738" fill="none" stroke="#5eb9df" stroke-opacity="0.08" stroke-width="2"/>
</svg>
