<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Public project mutation boundary</title>
  <desc id="desc">Abstract public code blocks are visible through a luminous authorization gate while a separate mutation path remains sealed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="0.52" stop-color="#102544"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#56e6d2" stop-opacity=".34"/>
      <stop offset="1" stop-color="#56e6d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9fff3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4d79b7" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77f4df"/>
      <stop offset="1" stop-color="#2d91ad"/>
    </linearGradient>
    <linearGradient id="sealed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb45d"/>
      <stop offset="1" stop-color="#e75a75"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8eb8dc" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="450" rx="560" ry="430" fill="url(#halo)" filter="url(#blur)"/>

  <g opacity=".55" fill="none" stroke="#65a8d5" stroke-width="2">
    <path d="M92 208C280 208 330 324 472 324"/>
    <path d="M88 688C272 688 342 578 478 578"/>
    <path d="M1122 222C1288 222 1356 310 1512 310"/>
    <path d="M1122 680C1284 680 1350 590 1510 590"/>
  </g>
  <g fill="#70c9dc">
    <circle cx="94" cy="208" r="7"/><circle cx="89" cy="688" r="7"/>
    <circle cx="1510" cy="310" r="7"/><circle cx="1508" cy="590" r="7"/>
  </g>

  <g transform="translate(254 222)">
    <rect x="0" y="0" width="300" height="180" rx="28" fill="url(#glass)" stroke="#8ce5e3" stroke-opacity=".55" stroke-width="2"/>
    <path d="M42 58h168M42 92h216M42 126h122" stroke="#c4fff5" stroke-opacity=".72" stroke-width="12" stroke-linecap="round"/>
    <rect x="34" y="206" width="300" height="180" rx="28" fill="url(#glass)" stroke="#8ce5e3" stroke-opacity=".42" stroke-width="2"/>
    <path d="M76 264h174M76 298h214M76 332h134" stroke="#c4fff5" stroke-opacity=".61" stroke-width="12" stroke-linecap="round"/>
    <rect x="-54" y="412" width="300" height="180" rx="28" fill="url(#glass)" stroke="#8ce5e3" stroke-opacity=".34" stroke-width="2"/>
    <path d="M-12 470h172M-12 504h216M-12 538h114" stroke="#c4fff5" stroke-opacity=".5" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g transform="translate(674 112)">
    <rect x="0" y="0" width="250" height="676" rx="88" fill="#071725" stroke="url(#gate)" stroke-width="5"/>
    <rect x="29" y="32" width="192" height="612" rx="66" fill="#0d2637" stroke="#81f6e2" stroke-opacity=".38" stroke-width="2"/>
    <path d="M125 70V606" stroke="#69efd9" stroke-opacity=".27" stroke-width="3"/>
    <circle cx="125" cy="337" r="67" fill="#0a1a29" stroke="#77f4df" stroke-width="5" filter="url(#glow)"/>
    <path d="M95 337l21 22 42-48" fill="none" stroke="#8affea" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-86 214h86M250 214h92M-86 460h86M250 460h92" stroke="#70e8d6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(1048 260)">
    <path d="M0 188h194c54 0 86 32 86 82v148" fill="none" stroke="#fb8a73" stroke-opacity=".65" stroke-width="8" stroke-linecap="round"/>
    <rect x="197" y="355" width="166" height="140" rx="32" fill="#201628" stroke="url(#sealed)" stroke-width="4"/>
    <path d="M238 355v-45c0-58 84-58 84 0v45" fill="none" stroke="#ffb05f" stroke-width="17" stroke-linecap="round"/>
    <circle cx="280" cy="419" r="17" fill="#ffb05f"/>
    <path d="M280 436v25" stroke="#ffb05f" stroke-width="12" stroke-linecap="round"/>
    <g opacity=".9">
      <rect x="0" y="0" width="222" height="126" rx="26" fill="url(#glass)" stroke="#91d8e2" stroke-opacity=".35" stroke-width="2"/>
      <path d="M36 40h112M36 67h150M36 94h82" stroke="#bceef0" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="none" stroke="#a3e9e8" stroke-opacity=".35" stroke-width="2">
    <circle cx="798" cy="449" r="388"/>
    <circle cx="798" cy="449" r="430" stroke-dasharray="5 22"/>
  </g>
</svg>
