<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity gate protecting an abstract IoT network</title>
  <desc id="desc">Abstract teal network paths pass through a luminous identity gate toward a protected core, while an amber path is stopped outside.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="70" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061824"/>
      <stop offset="0.52" stop-color="#0a3040"/>
      <stop offset="1" stop-color="#07131e"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(846 444) rotate(8) scale(610 410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42e0d0" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#16859a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#061824" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="580" y1="180" x2="1000" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9fff3"/>
      <stop offset="0.42" stop-color="#43d9cd"/>
      <stop offset="1" stop-color="#14799a"/>
    </linearGradient>
    <linearGradient id="core" x1="735" y1="348" x2="913" y2="566" gradientUnits="userSpaceOnUse">
      <stop stop-color="#effffb"/>
      <stop offset="0.35" stop-color="#77eddd"/>
      <stop offset="1" stop-color="#188e9d"/>
    </linearGradient>
    <linearGradient id="amber" x1="230" y1="310" x2="625" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd27c"/>
      <stop offset="1" stop-color="#ef7d3b"/>
    </linearGradient>
    <pattern id="mesh" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M86 0H0V86" fill="none" stroke="#91ebe1" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#020a10" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <ellipse cx="826" cy="775" rx="510" ry="56" fill="#020a10" opacity="0.55" filter="url(#soft)"/>

  <g fill="none" stroke="#56d9d1" stroke-linecap="round">
    <path d="M144 200C347 202 382 316 529 337" stroke-width="5" opacity="0.45"/>
    <path d="M122 698C330 694 394 582 532 560" stroke-width="5" opacity="0.42"/>
    <path d="M1455 176C1265 185 1222 310 1070 335" stroke-width="5" opacity="0.42"/>
    <path d="M1484 710C1264 701 1210 586 1067 561" stroke-width="5" opacity="0.4"/>
    <path d="M125 446H521" stroke-width="5" opacity="0.52"/>
  </g>

  <g fill="#80e9df">
    <circle cx="146" cy="200" r="13"/><circle cx="122" cy="698" r="13"/><circle cx="1455" cy="176" r="13"/><circle cx="1484" cy="710" r="13"/>
    <circle cx="288" cy="237" r="8" opacity="0.7"/><circle cx="304" cy="648" r="8" opacity="0.7"/><circle cx="1302" cy="248" r="8" opacity="0.7"/><circle cx="1303" cy="641" r="8" opacity="0.7"/>
  </g>

  <circle cx="800" cy="450" r="286" fill="#0a2432" stroke="#1e7188" stroke-width="2" opacity="0.88"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="url(#gate)" stroke-width="42" stroke-dasharray="240 34" transform="rotate(-18 800 450)" filter="url(#shadow)"/>
  <circle cx="800" cy="450" r="184" fill="#071b27" stroke="#55d8d0" stroke-width="4"/>
  <circle cx="800" cy="450" r="127" fill="url(#core)" opacity="0.14" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <path d="M800 324C743 324 697 370 697 427V474C697 531 743 577 800 577C857 577 903 531 903 474V427C903 370 857 324 800 324Z" fill="url(#core)"/>
    <circle cx="800" cy="422" r="43" fill="#0b5364"/>
    <path d="M758 511C758 477 777 455 800 455C823 455 842 477 842 511" fill="#0b5364"/>
  </g>

  <g fill="#b9fff3">
    <circle cx="523" cy="337" r="10"/><circle cx="532" cy="560" r="10"/><circle cx="1070" cy="335" r="10"/><circle cx="1067" cy="561" r="10"/>
  </g>
  <g fill="none" stroke="#9af4ea" stroke-linecap="round" stroke-dasharray="2 18" stroke-width="5" opacity="0.8">
    <path d="M530 337L650 386"/><path d="M532 560L651 516"/><path d="M1070 335L951 386"/><path d="M1067 561L951 516"/>
  </g>

  <path d="M116 447H574" fill="none" stroke="url(#amber)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="579" cy="447" r="45" fill="#f49a4d" opacity="0.23" filter="url(#soft)"/>
  <g transform="translate(543 411)" filter="url(#shadow)">
    <path d="M36 0L72 20V57L36 77L0 57V20Z" fill="url(#amber)"/>
    <path d="M23 25L49 51M49 25L23 51" stroke="#71391f" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path d="M632 391V503" stroke="#d9fff8" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="632" cy="390" r="9" fill="#d9fff8"/><circle cx="632" cy="504" r="9" fill="#d9fff8"/>

  <g fill="none" stroke="#7ce9e0" opacity="0.33">
    <circle cx="800" cy="450" r="335" stroke-width="2"/>
    <circle cx="800" cy="450" r="363" stroke-width="1" stroke-dasharray="5 20"/>
  </g>
</svg>
