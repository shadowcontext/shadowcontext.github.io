  <circle cx="286" cy="174" r="118" fill="#2DCDF4" opacity=".07" filter="url(#blur40)"/>
  <circle cx="1335" cy="706" r="150" fill="#A05EFF" opacity=".1" filter="url(#blur40)"/>

  <g opacity=".3" fill="none" stroke="#8EDFFF">
