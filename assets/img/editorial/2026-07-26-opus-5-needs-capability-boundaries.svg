    <rect x="744" y="773" width="112" height="72" rx="28" fill="#291C50" stroke="#AD7AFF" stroke-width="3"/>
    <circle cx="800" cy="809" r="15" fill="none" stroke="#D7C7FF" stroke-width="6"/>
