<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered capability boundaries around an AI core</title>
  <desc id="desc">A luminous abstract AI core sits inside nested translucent security boundaries while guarded pathways lead toward isolated tool nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="40" x2="1510" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152D"/>
      <stop offset=".48" stop-color="#111B43"/>
      <stop offset="1" stop-color="#241342"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(800 450) rotate(90) scale(355 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75E6FF" stop-opacity=".25"/>
      <stop offset=".48" stop-color="#765BFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#765BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="660" y1="310" x2="944" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9F5FF"/>
      <stop offset=".44" stop-color="#45C7FF"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="490" y1="215" x2="1115" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E5FF" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#8A79FF" stop-opacity=".58"/>
      <stop offset="1" stop-color="#FFB45F" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="path" x1="184" y1="450" x2="1414" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AD9FF" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#B4EEFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFB35E" stop-opacity=".3"/>
    </linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="innerClip">
      <path d="M800 224C937 224 1049 299 1081 410C1121 548 1043 669 900 706C764 741 612 690 548 580C480 464 524 326 640 260C686 234 739 224 800 224Z"/>
    </clipPath>
  </defs>

