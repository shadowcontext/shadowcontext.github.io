<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded QUIC connection intake protects service memory</title>
  <desc id="desc">Abstract blue connection channels converge on an amber capacity gate above an orderly grid of memory cells.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071528"/>
      <stop offset="0.55" stop-color="#102b45"/>
      <stop offset="1" stop-color="#091a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="gateGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="92" height="72" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="75" height="55" rx="12" fill="#153b56" stroke="#2a6480" stroke-width="2"/>
      <path d="M18 33h48" stroke="#6ee7f9" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="430" rx="650" ry="390" fill="url(#glow)"/>
  <circle cx="800" cy="408" r="270" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="90"/>
  <circle cx="800" cy="408" r="188" fill="none" stroke="#7dd3fc" stroke-opacity="0.11" stroke-width="3" stroke-dasharray="10 22"/>

  <g fill="none" stroke="url(#flow)" stroke-width="18" stroke-linecap="round">
    <path d="M70 120 C330 120 410 300 690 350"/>
    <path d="M5 245 C300 245 430 355 690 382"/>
    <path d="M20 385 C310 385 440 405 690 410"/>
    <path d="M0 530 C300 530 430 462 690 438"/>
    <path d="M85 675 C340 675 430 525 690 470"/>
  </g>
  <g fill="#a5f3fc">
    <circle cx="330" cy="162" r="10"/><circle cx="460" cy="281" r="8"/>
    <circle cx="275" cy="270" r="9"/><circle cx="520" cy="365" r="11"/>
    <circle cx="346" cy="401" r="8"/><circle cx="580" cy="414" r="10"/>
    <circle cx="310" cy="503" r="9"/><circle cx="500" cy="477" r="8"/>
    <circle cx="360" cy="614" r="10"/><circle cx="545" cy="509" r="9"/>
  </g>

  <g filter="url(#gateGlow)">
    <rect x="690" y="285" width="220" height="250" rx="58" fill="#0b2034" stroke="url(#gate)" stroke-width="12"/>
    <rect x="747" y="332" width="106" height="156" rx="40" fill="url(#gate)"/>
    <circle cx="800" cy="390" r="24" fill="#102b45"/>
    <path d="M800 414v38" stroke="#102b45" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="13" stroke-linecap="round" opacity="0.9">
    <path d="M910 350 C1080 335 1180 260 1510 260"/>
    <path d="M910 410 C1110 410 1240 410 1580 410"/>
    <path d="M910 470 C1080 490 1210 555 1530 555"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="1110" cy="319" r="9"/><circle cx="1320" cy="260" r="10"/>
    <circle cx="1080" cy="410" r="10"/><circle cx="1370" cy="410" r="9"/>
    <circle cx="1120" cy="509" r="9"/><circle cx="1340" cy="553" r="10"/>
  </g>

  <path d="M170 710 C430 650 650 670 800 735 C970 665 1190 650 1430 710 L1430 870 L170 870 Z" fill="#081a2b" stroke="#2b6780" stroke-width="3"/>
  <rect x="210" y="730" width="1180" height="130" rx="28" fill="url(#grid)" opacity="0.88"/>
  <path d="M800 535v145" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 20"/>
  <ellipse cx="800" cy="700" rx="260" ry="30" fill="#f59e0b" opacity="0.16" filter="url(#soft)"/>
</svg>
