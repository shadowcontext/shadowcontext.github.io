      <path d="M913 350 C1014 386 1098 438 1192 517" stroke-width="7"/>
      <path d="M698 527 C609 469 541 405 491 315" stroke-width="7"/>
    </g>
    <g fill="#d8fff7" stroke="#45d7d1" stroke-width="5">
      <circle cx="382" cy="650" r="14"/>
      <circle cx="594" cy="593" r="12"/>
      <circle cx="698" cy="527" r="11"/>
      <circle cx="789" cy="456" r="18"/>
      <circle cx="735" cy="319" r="12"/>
      <circle cx="913" cy="350" r="13"/>
      <circle cx="1028" cy="634" r="12"/>
      <circle cx="1192" cy="517" r="11"/>
