<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected research paths with observable network traces</title>
  <desc id="desc">An abstract editorial scene of luminous research paths branching inside a dark protective tunnel while subtle rings outside suggest passive network observation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102b43"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#47e6d1" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#28a9c7" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2=".85">
      <stop offset="0" stop-color="#5cf2d6" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#4a9fce" stop-opacity=".14"/>
      <stop offset="1" stop-color="#796de2" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1=".5" x2="1" y2=".5">
      <stop offset="0" stop-color="#7fffe2"/>
      <stop offset=".52" stop-color="#41cfe0"/>
      <stop offset="1" stop-color="#a79cff"/>
    </linearGradient>
    <filter id="blur24" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="tunnelClip">
      <path d="M335 700 C250 545 278 300 473 190 C634 100 981 96 1156 202 C1330 307 1368 552 1261 700 C1068 780 531 780 335 700Z"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g fill="none" stroke="#8bc9e8" opacity=".16">
    <ellipse cx="800" cy="450" rx="690" ry="342" stroke-width="2"/>
    <ellipse cx="800" cy="450" rx="625" ry="300" stroke-width="2" stroke-dasharray="3 18"/>
    <ellipse cx="800" cy="450" rx="560" ry="258" stroke-width="1.5" stroke-dasharray="2 24"/>
  </g>
  <g fill="none" stroke="#b5a9ff" opacity=".18" stroke-width="3">
    <path d="M118 292 C210 236 276 231 353 265"/>
    <path d="M1264 252 C1360 222 1444 249 1514 325"/>
    <path d="M1235 680 C1355 699 1436 666 1500 590"/>
  </g>
  <g fill="#9eece2" opacity=".44">
