    <circle cx="1404" cy="271" r="5"/>
    <circle cx="1447" cy="625" r="7"/>
    <circle cx="257" cy="672" r="4"/>
  </g>

  <path d="M335 700 C250 545 278 300 473 190 C634 100 981 96 1156 202 C1330 307 1368 552 1261 700 C1068 780 531 780 335 700Z" fill="#0d2036" stroke="url(#shell)" stroke-width="18"/>
  <path d="M370 674 C300 531 332 332 495 237 C653 145 949 145 1126 238 C1287 323 1322 524 1225 674" fill="none" stroke="#a2f8ea" stroke-opacity=".14" stroke-width="3"/>

  <g clip-path="url(#tunnelClip)">
    <ellipse cx="790" cy="596" rx="474" ry="134" fill="#35d6ce" opacity=".11" filter="url(#blur24)"/>
    <path d="M392 642 C570 604 676 565 788 456 C895 351 1016 306 1222 271" fill="none" stroke="#42dfd0" stroke-opacity=".18" stroke-width="44" filter="url(#soft)"/>
    <g fill="none" stroke="url(#path)" stroke-linecap="round">
