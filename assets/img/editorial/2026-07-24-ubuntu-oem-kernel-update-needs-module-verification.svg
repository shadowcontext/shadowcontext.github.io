  <circle cx="800" cy="456" r="226" fill="#2cc8ff" opacity="0.17" filter="url(#glow)"/>
  <circle cx="800" cy="456" r="189" fill="url(#core)" stroke="#82e9ff" stroke-width="5"/>
  <circle cx="800" cy="456" r="145" fill="#0b2844" opacity="0.54" stroke="#9cecff" stroke-opacity="0.65" stroke-width="3"/>

