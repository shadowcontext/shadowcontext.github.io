    <path d="M1045 743l111-45 12 52-113 46z"/>
    <path d="M617 759l117 23 5 54-120-22z"/>
    <path d="M865 783l117-22-2 54-120 22z"/>
  </g>

  <g stroke="#50d4ff" stroke-width="4" stroke-linecap="round" opacity="0.58">
