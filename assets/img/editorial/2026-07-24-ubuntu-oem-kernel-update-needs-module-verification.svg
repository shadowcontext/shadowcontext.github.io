<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kernel core with modules aligning after an update</title>
  <desc id="desc">A luminous blue abstract kernel core sits within layered rings of module-like tiles, with one amber seam emphasizing verification after components are rebuilt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#06101f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#8fe8ff"/>
      <stop offset="0.45" stop-color="#258ac0"/>
      <stop offset="1" stop-color="#103f69"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b7399"/>
      <stop offset="1" stop-color="#12334f"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#e47832"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="466" rx="565" ry="330" fill="#0d3858" opacity="0.24"/>
  <ellipse cx="800" cy="760" rx="510" ry="42" fill="#020914" opacity="0.62" filter="url(#soft)"/>

  <g opacity="0.23" fill="none" stroke="#5fd7ff">
    <ellipse cx="800" cy="450" rx="526" ry="292" stroke-width="2"/>
    <ellipse cx="800" cy="450" rx="432" ry="242" stroke-width="3"/>
    <ellipse cx="800" cy="450" rx="338" ry="190" stroke-width="2"/>
  </g>

  <g fill="url(#tile)" stroke="#55c7eb" stroke-opacity="0.46" stroke-width="2">
