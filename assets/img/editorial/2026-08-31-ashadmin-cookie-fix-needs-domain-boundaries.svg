<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Exact-match protection for an administrative session cookie</title>
  <desc id="desc">An abstract admin interface is shielded by a precise luminous gateway while a shadow cookie arriving from a sibling domain is diverted away from the trusted session path.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1480" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07172B"/>
      <stop offset="0.52" stop-color="#102847"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(850 445) rotate(90) scale(370 570)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2FE5D0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2FE5D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="615" y1="190" x2="1245" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173B62"/>
      <stop offset="1" stop-color="#0A1B31"/>
    </linearGradient>
    <linearGradient id="gate" x1="536" y1="225" x2="696" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83FFF0"/>
      <stop offset="0.5" stop-color="#25D8C4"/>
      <stop offset="1" stop-color="#0A8F92"/>
    </linearGradient>
    <linearGradient id="trusted" x1="710" y1="360" x2="1120" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78F9E8"/>
      <stop offset="1" stop-color="#35AEEA"/>
    </linearGradient>
    <linearGradient id="shadow" x1="190" y1="270" x2="500" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB16F"/>
      <stop offset="1" stop-color="#E45A77"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="screenClip"><rect x="660" y="205" width="620" height="490" rx="42"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <g opacity="0.28" fill="none" stroke="#6FA8CA" stroke-width="2">
    <path d="M85 160C260 105 390 120 520 210"/>
    <path d="M80 725C255 785 410 755 530 675"/>
    <path d="M1310 145C1410 190 1470 270 1515 390"/>
    <path d="M1325 750C1435 690 1495 605 1525 500"/>
  </g>
  <g opacity="0.5">
    <circle cx="236" cy="212" r="68" fill="#143759" stroke="#3A7397" stroke-width="3"/>
    <circle cx="164" cy="392" r="46" fill="#122F4C" stroke="#366A8D" stroke-width="3"/>
    <circle cx="274" cy="675" r="58" fill="#153A5C" stroke="#3A7397" stroke-width="3"/>
    <path d="M246 278L177 348M184 437L249 621" stroke="#477D9D" stroke-width="4"/>
  </g>
  <g>
    <path d="M275 377C370 350 427 357 505 399" fill="none" stroke="#F37B77" stroke-opacity="0.28" stroke-width="34" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M275 377C370 350 427 357 505 399" fill="none" stroke="url(#shadow)" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(325 327) rotate(9)">
      <rect width="164" height="96" rx="48" fill="#351C35" stroke="#FF8B7B" stroke-width="4"/>
      <circle cx="50" cy="48" r="18" fill="#FF9C73"/>
      <path d="M82 32H128M82 48H117M82 64H135" stroke="#FFB08D" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    </g>
    <path d="M500 399C548 414 555 450 525 491C502 522 470 542 438 561" fill="none" stroke="#F37B77" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 18"/>
    <circle cx="424" cy="570" r="13" fill="#F57578"/>
  </g>
  <g filter="url(#glow)">
    <path d="M570 235C570 209 591 188 617 188H650V712H617C591 712 570 691 570 665Z" fill="url(#gate)" fill-opacity="0.18" stroke="url(#gate)" stroke-width="6"/>
    <path d="M604 268V632" stroke="#8BFFF1" stroke-width="8" stroke-linecap="round"/>
    <circle cx="604" cy="450" r="28" fill="#092C3B" stroke="#9AFFF4" stroke-width="7"/>
    <path d="M595 450L602 457L616 440" fill="none" stroke="#9AFFF4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
