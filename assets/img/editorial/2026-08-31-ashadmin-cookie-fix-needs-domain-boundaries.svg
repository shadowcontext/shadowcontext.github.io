      <circle cx="714" cy="246" r="10" fill="#FF887B"/>
      <circle cx="750" cy="246" r="10" fill="#F9C96A"/>
      <circle cx="786" cy="246" r="10" fill="#6DE7C4"/>
      <rect x="704" y="330" width="168" height="310" rx="28" fill="#102D4A" stroke="#2B5A7C" stroke-width="2"/>
      <circle cx="788" cy="408" r="43" fill="#173C5C" stroke="#49CFC5" stroke-width="4"/>
      <path d="M744 496H832M744 534H812M744 572H826" stroke="#5A8AA8" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
      <rect x="916" y="330" width="310" height="130" rx="28" fill="#102D4A" stroke="#2B5A7C" stroke-width="2"/>
      <rect x="916" y="490" width="310" height="150" rx="28" fill="#102D4A" stroke="#2B5A7C" stroke-width="2"/>
      <path d="M960 370H1176M960 410H1100" stroke="#5D8BA8" stroke-width="13" stroke-linecap="round" opacity="0.65"/>
      <path d="M960 534H1176M960 578H1138" stroke="#5D8BA8" stroke-width="13" stroke-linecap="round" opacity="0.65"/>
      <circle cx="1182" cy="595" r="18" fill="#41D8C9"/>
    </g>
    <path d="M800 735H1140L1198 788H742Z" fill="#0A1A2B" stroke="#376487" stroke-width="3"/>
    <path d="M765 788H1175" stroke="#64A9C7" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g>
