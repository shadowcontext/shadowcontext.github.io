    <g transform="translate(706 404)">
      <rect width="150" height="92" rx="46" fill="#0C3C4C" stroke="#75F7E8" stroke-width="4"/>
      <circle cx="45" cy="46" r="17" fill="#72F5E5"/>
      <path d="M76 31H118M76 46H108M76 61H124" stroke="#A7FFF4" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    </g>
    <path d="M874 450H995" stroke="#45D9D2" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>
    <path d="M1032 403L1080 426V472C1080 510 1055 538 1032 548C1009 538 984 510 984 472V426Z" fill="#0A3946" stroke="#75F7E8" stroke-width="5" filter="url(#glow)"/>
    <path d="M1013 471L1027 485L1053 454" fill="none" stroke="#9AFFF3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g opacity="0.7">
    <circle cx="1375" cy="263" r="8" fill="#5FCECF"/>
    <circle cx="1434" cy="318" r="5" fill="#5FCECF"/>
    <circle cx="1388" cy="651" r="7" fill="#5FCECF"/>
    <circle cx="1329" cy="700" r="4" fill="#5FCECF"/>
  </g>
</svg>
