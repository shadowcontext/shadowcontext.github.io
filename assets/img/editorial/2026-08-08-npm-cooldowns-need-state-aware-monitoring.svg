<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">State-aware monitoring for npm release cooldowns</title>
  <desc id="desc">Abstract package blocks move through a luminous time gate while concentric scanning arcs expose a missing configuration tile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#102943"/>
      <stop offset="1" stop-color="#06111d"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="48%" r="52%">
      <stop offset="0" stop-color="#3ae0c5" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#2a73bc" stop-opacity=".1"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf7dd"/>
      <stop offset=".5" stop-color="#33bcd5"/>
      <stop offset="1" stop-color="#2772b4"/>
    </linearGradient>
    <linearGradient id="parcel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c76c"/>
      <stop offset="1" stop-color="#db6f5d"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83f4d9"/>
      <stop offset="1" stop-color="#309bc9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#02070d" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#83b8d0" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="810" cy="735" rx="600" ry="90" fill="#02080e" opacity=".5" filter="url(#blur)"/>

  <g opacity=".36" fill="none" stroke="#5ad7dc">
    <path d="M115 650C335 506 496 510 650 555" stroke-width="3"/>
    <path d="M950 555c174-55 345-44 535 96" stroke-width="3"/>
    <path d="M170 705c202-104 365-113 492-76" stroke-width="1.5" stroke-dasharray="8 14"/>
    <path d="M938 629c144-39 305-26 492 76" stroke-width="1.5" stroke-dasharray="8 14"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M676 704V273c0-75 60-135 135-135s135 60 135 135v431" fill="none" stroke="#0a1b2b" stroke-width="94"/>
    <path d="M676 704V273c0-75 60-135 135-135s135 60 135 135v431" fill="none" stroke="url(#gate)" stroke-width="28"/>
    <path d="M708 704V278c0-57 46-103 103-103s103 46 103 103v426" fill="none" stroke="#b9fff0" stroke-opacity=".35" stroke-width="4"/>
  </g>

  <g fill="none" stroke="#77f2dc" transform="translate(810 475)">
    <circle r="120" stroke-width="3" stroke-opacity=".5" stroke-dasharray="16 14"/>
    <circle r="175" stroke-width="2" stroke-opacity=".3" stroke-dasharray="5 18"/>
    <path d="M-206 0A206 206 0 0 1 0-206" stroke-width="7" stroke-linecap="round" opacity=".72"/>
    <path d="M206 0A206 206 0 0 1 0 206" stroke-width="7" stroke-linecap="round" opacity=".32"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(240 532) rotate(-8)">
      <path d="M0 40 82 0l82 40-82 41z" fill="#ffd884"/>
      <path d="M0 40v92l82 45V81z" fill="#c95c54"/>
      <path d="M164 40v92l-82 45V81z" fill="url(#parcel)"/>
      <path d="m55 13 82 40" stroke="#fff1bf" stroke-width="8" opacity=".7"/>
    </g>
    <g transform="translate(432 442) rotate(5) scale(.8)">
      <path d="M0 40 82 0l82 40-82 41z" fill="#ffd884"/>
      <path d="M0 40v92l82 45V81z" fill="#c95c54"/>
      <path d="M164 40v92l-82 45V81z" fill="url(#parcel)"/>
    </g>
    <g transform="translate(1114 493) rotate(7)">
      <path d="M0 40 82 0l82 40-82 41z" fill="#baffed"/>
      <path d="M0 40v92l82 45V81z" fill="#257faf"/>
      <path d="M164 40v92l-82 45V81z" fill="url(#safe)"/>
      <path d="m56 13 81 40" stroke="#e5fff8" stroke-width="8" opacity=".65"/>
    </g>
    <g transform="translate(1311 585) rotate(-5) scale(.72)">
      <path d="M0 40 82 0l82 40-82 41z" fill="#baffed"/>
      <path d="M0 40v92l82 45V81z" fill="#257faf"/>
      <path d="M164 40v92l-82 45V81z" fill="url(#safe)"/>
    </g>
  </g>

  <g transform="translate(748 411)" filter="url(#shadow)">
    <rect width="124" height="124" rx="22" fill="#102b43" stroke="#92f8e5" stroke-width="5"/>
    <path d="M28 37h68M28 62h43M28 87h68" fill="none" stroke="#9eeadb" stroke-width="9" stroke-linecap="round" opacity=".82"/>
    <rect x="70" y="51" width="31" height="23" rx="7" fill="#071525" stroke="#ff886f" stroke-width="4"/>
  </g>
  <g fill="#c9fff3">
    <circle cx="810" cy="244" r="7"/>
    <circle cx="810" cy="706" r="7"/>
    <circle cx="579" cy="475" r="7"/>
    <circle cx="1041" cy="475" r="7"/>
  </g>
</svg>
