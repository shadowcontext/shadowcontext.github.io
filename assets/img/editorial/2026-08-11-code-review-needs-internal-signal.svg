<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hidden security signal inside an AI code review</title>
  <desc id="desc">Abstract layered code panels pass through a luminous inspection lens that reveals a hidden amber security signal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="0.55" stop-color="#0b2231"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#43d9cf" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#2a8ea1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071421" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fff6" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#52c7cf" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1b5269" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4aa52" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#ffd27b"/>
      <stop offset="0.72" stop-color="#ff9d4b"/>
      <stop offset="1" stop-color="#f4aa52" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
