<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Static files held inside a layered route boundary</title>
  <desc id="desc">Abstract editorial artwork showing luminous file tiles moving toward a narrow route, with layered cyan and amber boundaries containing a diverted tile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.52" stop-color="#102a3a"/>
      <stop offset="1" stop-color="#17142f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#38d9d0" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#3a7ca5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="0.62" stop-color="#67e8f9" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#f6c76e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fbff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#71d8ea" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="blur24" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1" fill="#b8f4ff" opacity="0.12"/>
      <circle cx="29" cy="27" r="0.8" fill="#f6c76e" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <path d="M-80 662 C260 542 474 558 702 470 S1122 284 1690 382" fill="none" stroke="#20485c" stroke-width="170" opacity="0.28" filter="url(#blur24)"/>
  <path d="M-80 662 C260 542 474 558 702 470 S1122 284 1690 382" fill="none" stroke="url(#route)" stroke-width="18" stroke-linecap="round"/>
  <path d="M-80 708 C266 588 502 604 730 516 S1140 332 1690 428" fill="none" stroke="#72e6e0" stroke-width="2" opacity="0.24"/>
  <g transform="translate(975 155) rotate(8)">
    <path d="M0 110 L250 0 L500 110 L500 430 L250 540 L0 430 Z" fill="#071525" fill-opacity="0.7" stroke="#57ded8" stroke-width="7"/>
    <path d="M42 139 L250 48 L458 139 L458 400 L250 492 L42 400 Z" fill="url(#glass)" stroke="#8ef5eb" stroke-width="2" opacity="0.92"/>
    <path d="M90 167 L250 96 L410 167 L410 372 L250 443 L90 372 Z" fill="#0b2030" stroke="#f6c76e" stroke-width="5"/>
    <path d="M250 96 L250 443 M90 167 L250 239 L410 167" fill="none" stroke="#9deee8" stroke-width="3" opacity="0.45"/>
    <circle cx="250" cy="260" r="72" fill="#122e3d" stroke="#5eead4" stroke-width="6" filter="url(#glow)"/>
    <path d="M220 260 L242 282 L286 231" fill="none" stroke="#f6c76e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="url(#glass)" stroke="#8ceee8" stroke-width="3">
    <path d="M172 557 L302 510 L396 558 L266 605 Z"/>
    <path d="M366 503 L496 456 L590 504 L460 551 Z"/>
    <path d="M565 449 L695 402 L789 450 L659 497 Z"/>
    <path d="M763 390 L893 343 L987 391 L857 438 Z"/>
  </g>
  <g fill="none" stroke="#d5fbff" stroke-width="2" opacity="0.58">
    <path d="M207 559 L269 537 L332 566"/>
    <path d="M401 505 L463 483 L526 512"/>
    <path d="M600 451 L662 429 L725 458"/>
  </g>
  <g transform="translate(752 590) rotate(-18)">
    <path d="M0 0 L128 -46 L220 2 L92 49 Z" fill="#3e2330" stroke="#f6c76e" stroke-width="5" filter="url(#glow)"/>
    <path d="M46 3 L104 -18 L160 10" fill="none" stroke="#ffe0a3" stroke-width="3"/>
  </g>
  <path d="M853 559 C924 526 949 482 961 430" fill="none" stroke="#f6c76e" stroke-width="5" stroke-dasharray="8 15" opacity="0.8"/>
  <g opacity="0.35" fill="none" stroke="#5eead4">
    <circle cx="1240" cy="441" r="330" stroke-width="2"/>
    <circle cx="1240" cy="441" r="375" stroke-width="1"/>
  </g>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <path d="M0 790 C370 710 668 826 965 756 S1318 680 1600 724 L1600 900 L0 900 Z" fill="#050d18" opacity="0.56"/>
</svg>
