<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Destination authorization boundary for router-attached storage</title>
  <desc id="desc">Abstract editorial artwork showing a router gateway between a public teal folder and protected amber storage, with a transfer arc stopped at the destination boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#10283a"/>
      <stop offset="1" stop-color="#161c32"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.23" cy="0.48" r="0.48">
      <stop offset="0" stop-color="#27d3c2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#27d3c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.8" cy="0.52" r="0.44">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="publicFolder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36ddcc"/>
      <stop offset="1" stop-color="#158e9e"/>
    </linearGradient>
    <linearGradient id="privateFolder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd07a"/>
      <stop offset="1" stop-color="#c7792c"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e8f1"/>
      <stop offset="1" stop-color="#7893a6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1.2" fill="#b9d4df" opacity="0.08"/>
      <circle cx="28" cy="31" r="0.9" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#tealGlow)"/>
  <rect width="1600" height="900" fill="url(#amberGlow)"/>
  <path d="M0 760 C290 650 510 820 800 704 S1320 604 1600 716 V900 H0Z" fill="#06101d" opacity="0.66"/>
  <path d="M0 170 C330 74 546 204 812 124 S1320 90 1600 174" fill="none" stroke="#7fb3c8" stroke-width="2" opacity="0.12"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g opacity="0.32">
    <circle cx="255" cy="257" r="5" fill="#39d9ca"/>
    <circle cx="337" cy="191" r="3" fill="#39d9ca"/>
    <circle cx="1328" cy="242" r="5" fill="#ffbe59"/>
    <circle cx="1234" cy="174" r="3" fill="#ffbe59"/>
    <path d="M255 257 L337 191" stroke="#39d9ca" stroke-width="2"/>
    <path d="M1234 174 L1328 242" stroke="#ffbe59" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M190 373 Q190 338 225 338 H384 L432 385 H585 Q620 385 620 420 V650 Q620 685 585 685 H225 Q190 685 190 650Z" fill="#0b2431" stroke="#48e5d4" stroke-width="6"/>
