<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Filtered artifact stream entering a protected processing core</title>
  <desc id="desc">Abstract layers of blue and amber data tokens cross a luminous filtering boundary before reaching a protected violet processing core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#101c38"/>
      <stop offset="1" stop-color="#211b42"/>
    </linearGradient>
    <radialGradient id="halo" cx="68%" cy="50%" r="48%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#5c4bd6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86f7e3"/>
      <stop offset=".5" stop-color="#50cdd2"/>
      <stop offset="1" stop-color="#6c77ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9785ff"/>
      <stop offset="1" stop-color="#4b35a9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#9eb5e8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="coreClip"><rect x="1045" y="235" width="360" height="430" rx="90"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect x="70" y="70" width="1460" height="760" rx="54" fill="url(#grid)" stroke="#b5c8f5" stroke-opacity=".1"/>
  <ellipse cx="1100" cy="450" rx="405" ry="320" fill="#6e55e7" opacity=".15" filter="url(#blur)"/>

  <g opacity=".92">
    <path d="M155 268 C310 268 365 330 510 330 S670 285 785 320" fill="none" stroke="#4daee8" stroke-width="10" stroke-linecap="round"/>
    <path d="M140 435 C320 435 390 402 525 438 S690 503 785 466" fill="none" stroke="#71d8d0" stroke-width="12" stroke-linecap="round"/>
    <path d="M175 618 C320 618 405 550 535 565 S680 625 785 590" fill="none" stroke="#e8a968" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g fill="#9ddcff">
    <circle cx="235" cy="268" r="17"/><rect x="330" y="306" width="58" height="48" rx="16"/><circle cx="500" cy="330" r="15"/>
    <rect x="595" y="283" width="70" height="46" rx="18"/><circle cx="725" cy="313" r="12"/>
  </g>
  <g fill="#a1f2df">
    <rect x="205" y="410" width="78" height="50" rx="19"/><circle cx="390" cy="411" r="16"/><rect x="480" y="414" width="66" height="50" rx="18"/>
    <circle cx="640" cy="477" r="17"/><rect x="705" y="447" width="66" height="45" rx="16"/>
  </g>
  <g fill="#ffc27d">
    <circle cx="255" cy="600" r="16"/><rect x="350" y="562" width="72" height="46" rx="16"/><circle cx="515" cy="565" r="14"/>
    <rect x="610" y="576" width="72" height="48" rx="18"/><circle cx="745" cy="596" r="12"/>
  </g>

  <g filter="url(#glow)">
    <rect x="785" y="185" width="26" height="530" rx="13" fill="url(#gate)"/>
    <path d="M842 235h62M842 450h62M842 665h62" stroke="#8ef4e2" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#8ef4e2" stroke-width="4" opacity=".55">
    <path d="M795 215c80 35 80 435 0 470"/>
    <path d="M795 265c48 30 48 340 0 370"/>
  </g>

  <path d="M905 330 C970 330 995 355 1045 380M905 450H1045M905 570 C970 570 995 545 1045 520" fill="none" stroke="#8d85ff" stroke-width="11" stroke-linecap="round" opacity=".9"/>
  <circle cx="936" cy="330" r="11" fill="#b4adff"/><circle cx="973" cy="450" r="13" fill="#b4adff"/><circle cx="934" cy="570" r="11" fill="#b4adff"/>

  <rect x="1045" y="235" width="360" height="430" rx="90" fill="#171638" stroke="#9f91ff" stroke-width="5"/>
  <g clip-path="url(#coreClip)">
    <circle cx="1225" cy="450" r="168" fill="url(#core)" opacity=".84"/>
    <circle cx="1225" cy="450" r="116" fill="#151433" stroke="#c4bcff" stroke-width="4"/>
    <path d="M1150 450l50 50 104-112" fill="none" stroke="#8ef4e2" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <g fill="#d5d0ff" opacity=".45">
      <circle cx="1095" cy="302" r="8"/><circle cx="1362" cy="338" r="11"/><circle cx="1335" cy="598" r="8"/><circle cx="1108" cy="575" r="10"/>
    </g>
  </g>
  <path d="M1085 235v-38h280v38M1085 665v38h280v-38" fill="none" stroke="#8f85e9" stroke-width="6" stroke-linecap="round" opacity=".7"/>

  <g fill="#ff9f68" opacity=".9">
    <path d="M705 235l18-32 18 32z"/><path d="M674 657l18-32 18 32z"/>
  </g>
  <g fill="none" stroke="#ffb37d" stroke-width="3" opacity=".5">
    <circle cx="723" cy="219" r="31"/><circle cx="692" cy="641" r="31"/>
  </g>
</svg>
