<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity carried through asynchronous database execution paths</title>
  <desc id="desc">An abstract golden identity token travels along luminous branching paths through layered blue database forms and guarded checkpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="0.52" stop-color="#102a42"/>
      <stop offset="1" stop-color="#071824"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#72e1ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#72e1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4bc8ec" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#8ce9ff"/>
      <stop offset="1" stop-color="#ffd36b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a5"/>
      <stop offset="0.48" stop-color="#f6bd4b"/>
      <stop offset="1" stop-color="#cf7f20"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2e7199" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#72cce7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="810" cy="446" rx="620" ry="360" fill="url(#aura)"/>
  <circle cx="1320" cy="155" r="170" fill="#1b6e91" opacity="0.12" filter="url(#soft)"/>
  <circle cx="260" cy="730" r="210" fill="#0b91a8" opacity="0.09" filter="url(#soft)"/>

  <!-- layered database surfaces -->
  <g opacity="0.9">
    <path d="M1120 224c0-48 116-87 259-87s159 39 159 87v436c0 48-16 87-159 87s-259-39-259-87z" fill="url(#glass)" stroke="#79d9f4" stroke-opacity="0.35" stroke-width="3"/>
    <ellipse cx="1379" cy="224" rx="259" ry="87" fill="#163c58" stroke="#8ce9ff" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M1120 365c0 48 116 87 259 87s159-39 159-87M1120 506c0 48 116 87 259 87s159-39 159-87M1120 647c0 48 116 87 259 87s159-39 159-87" fill="none" stroke="#78d9f4" stroke-opacity="0.26" stroke-width="3"/>
    <ellipse cx="1379" cy="224" rx="177" ry="49" fill="none" stroke="#86e9ff" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <!-- entry identity -->
  <g transform="translate(174 450)">
    <circle r="116" fill="#0a1a29" stroke="#6ee2ff" stroke-opacity="0.42" stroke-width="3"/>
    <circle r="84" fill="#102c3e" stroke="#7ae7ff" stroke-opacity="0.32" stroke-width="2"/>
    <circle cy="-24" r="28" fill="url(#gold)"/>
    <path d="M-49 56c5-48 24-67 49-67s44 19 49 67" fill="url(#gold)"/>
    <circle r="116" fill="none" stroke="#54cce9" stroke-opacity="0.2" stroke-width="18" filter="url(#glow)"/>
  </g>

  <!-- execution lanes -->
  <path d="M290 450C430 450 465 289 610 289h205c137 0 170-105 305-105" fill="none" stroke="#193f58" stroke-width="34" stroke-linecap="round"/>
  <path d="M290 450C430 450 465 611 610 611h205c137 0 170 105 305 105" fill="none" stroke="#193f58" stroke-width="34" stroke-linecap="round"/>
  <path d="M290 450h830" fill="none" stroke="#193f58" stroke-width="40" stroke-linecap="round"/>
  <path d="M290 450C430 450 465 289 610 289h205c137 0 170-105 305-105" fill="none" stroke="url(#path)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M290 450C430 450 465 611 610 611h205c137 0 170 105 305 105" fill="none" stroke="url(#path)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M290 450h830" fill="none" stroke="url(#path)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- guarded handoff rings -->
  <g fill="#0d2638" stroke="#75dcf5" stroke-width="4">
    <circle cx="520" cy="336" r="31"/><circle cx="520" cy="564" r="31"/>
    <circle cx="805" cy="289" r="31"/><circle cx="805" cy="611" r="31"/>
    <circle cx="705" cy="450" r="36"/><circle cx="980" cy="450" r="36"/>
  </g>
  <g fill="url(#gold)" filter="url(#glow)">
    <circle cx="520" cy="336" r="13"/><circle cx="520" cy="564" r="13"/>
    <circle cx="805" cy="289" r="13"/><circle cx="805" cy="611" r="13"/>
    <circle cx="705" cy="450" r="15"/><circle cx="980" cy="450" r="15"/>
  </g>

  <!-- central authorization shield -->
  <g transform="translate(842 450)">
    <path d="M0-112 89-78v72c0 71-36 119-89 151-53-32-89-80-89-151v-72z" fill="#0b2233" stroke="#9aeaff" stroke-width="5"/>
    <path d="M0-78 55-57v48c0 45-21 76-55 99-34-23-55-54-55-99v-48z" fill="url(#glass)" stroke="#62d5ef" stroke-opacity="0.66" stroke-width="3"/>
    <circle cy="-9" r="23" fill="url(#gold)" filter="url(#glow)"/>
    <path d="M-38 61c4-35 18-49 38-49s34 14 38 49" fill="url(#gold)"/>
  </g>

  <!-- database-bound identity at destination -->
  <g transform="translate(1314 450)" filter="url(#glow)">
    <circle r="61" fill="#10283a" stroke="#ffe28a" stroke-width="4"/>
    <circle cy="-14" r="17" fill="url(#gold)"/>
    <path d="M-29 35c3-27 14-38 29-38s26 11 29 38" fill="url(#gold)"/>
  </g>

  <g fill="#9aeaff">
    <circle cx="410" cy="450" r="5" opacity="0.7"/><circle cx="630" cy="450" r="4" opacity="0.48"/>
    <circle cx="665" cy="289" r="4" opacity="0.65"/><circle cx="692" cy="611" r="5" opacity="0.55"/>
    <circle cx="1056" cy="218" r="4" opacity="0.5"/><circle cx="1065" cy="684" r="5" opacity="0.6"/>
  </g>
</svg>
