<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered access proof around an analytics database</title>
  <desc id="desc">Abstract editorial artwork showing luminous database columns behind layered permission gates, with one verified query path passing through while unauthorized paths stop at the boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="0.48" stop-color="#102b3b"/>
      <stop offset="1" stop-color="#081823"/>
    </linearGradient>
    <radialGradient id="aura" cx="68%" cy="46%" r="53%">
      <stop offset="0" stop-color="#40d8c5" stop-opacity=".27"/>
      <stop offset=".55" stop-color="#2388ac" stop-opacity=".10"/>
      <stop offset="1" stop-color="#07121f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5fff1"/>
      <stop offset=".42" stop-color="#58dfcc"/>
      <stop offset="1" stop-color="#167ca0"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a86aa"/>
      <stop offset=".5" stop-color="#80eedc"/>
      <stop offset="1" stop-color="#2d91bd"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#75cbd5" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <ellipse cx="1000" cy="786" rx="490" ry="50" fill="#020912" opacity=".7" filter="url(#shadow)"/>

  <g opacity=".45" fill="none" stroke="#3e9bb8" stroke-width="3">
    <path d="M90 194C260 194 278 286 452 286"/>
    <path d="M80 450H452"/>
    <path d="M90 706C260 706 278 614 452 614"/>
  </g>

  <g fill="#0b2a3b" stroke="#56c7cc" stroke-width="5">
    <circle cx="92" cy="194" r="25"/><circle cx="80" cy="450" r="34"/><circle cx="92" cy="706" r="25"/>
    <circle cx="252" cy="247" r="15"/><circle cx="252" cy="653" r="15"/>
  </g>
  <g fill="#a7f6e6">
    <circle cx="92" cy="194" r="7"/><circle cx="80" cy="450" r="9"/><circle cx="92" cy="706" r="7"/>
  </g>

  <g>
    <path d="M468 118V782" stroke="#143c50" stroke-width="96" stroke-linecap="round"/>
    <path d="M468 118V782" stroke="url(#gate)" stroke-width="10" stroke-linecap="round"/>
    <path d="M588 166V734" stroke="#102f42" stroke-width="78" stroke-linecap="round"/>
    <path d="M588 166V734" stroke="#56d2c8" stroke-opacity=".82" stroke-width="8" stroke-linecap="round"/>
    <path d="M696 213V687" stroke="#0c2738" stroke-width="62" stroke-linecap="round"/>
    <path d="M696 213V687" stroke="#7ae7d6" stroke-opacity=".8" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g opacity=".95">
    <path d="M114 450H430" stroke="#74e7d7" stroke-width="12" stroke-linecap="round"/>
    <path d="M506 450H550" stroke="#74e7d7" stroke-width="12" stroke-linecap="round"/>
    <path d="M626 450H658" stroke="#74e7d7" stroke-width="12" stroke-linecap="round"/>
    <path d="M734 450H876" stroke="#c7fff1" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M844 420l34 30-34 30" fill="none" stroke="#c7fff1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g stroke="#f1a65a" stroke-width="8" stroke-linecap="round" opacity=".9">
    <path d="M292 286H428"/><path d="M292 614H428"/>
    <path d="M399 261l26 25-26 25" fill="none"/>
    <path d="M399 589l26 25-26 25" fill="none"/>
  </g>
  <g fill="#ffbf73">
    <circle cx="286" cy="286" r="12"/><circle cx="286" cy="614" r="12"/>
  </g>
  <g stroke="#ffcb87" stroke-width="10" stroke-linecap="round">
    <path d="M444 257l48 58"/><path d="M492 257l-48 58"/>
    <path d="M444 585l48 58"/><path d="M492 585l-48 58"/>
  </g>

  <g transform="translate(875 168)">
    <ellipse cx="270" cy="70" rx="270" ry="70" fill="#bffbed" stroke="#e3fff8" stroke-width="6"/>
    <path d="M0 70v454c0 39 121 71 270 71s270-32 270-71V70" fill="url(#data)" stroke="#8ee9db" stroke-width="6"/>
    <ellipse cx="270" cy="215" rx="270" ry="70" fill="#36baa8" fill-opacity=".38" stroke="#b7f7ea" stroke-opacity=".75" stroke-width="5"/>
    <ellipse cx="270" cy="370" rx="270" ry="70" fill="#238ca3" fill-opacity=".34" stroke="#8ee9db" stroke-opacity=".7" stroke-width="5"/>
    <ellipse cx="270" cy="524" rx="270" ry="71" fill="#176d91" stroke="#7bd8d2" stroke-width="5"/>
    <g fill="#0a3a4d" opacity=".8">
      <circle cx="173" cy="69" r="14"/><circle cx="225" cy="69" r="14"/><circle cx="277" cy="69" r="14"/><circle cx="329" cy="69" r="14"/><circle cx="381" cy="69" r="14"/>
    </g>
  </g>

  <g transform="translate(1300 92)" filter="url(#glow)">
    <path d="M92 0l92 38v82c0 86-55 142-92 159C55 262 0 206 0 120V38z" fill="#10394b" stroke="#73e3d5" stroke-width="7"/>
    <path d="M48 128l28 29 61-73" fill="none" stroke="#d3fff3" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#d1fff4" opacity=".7">
    <circle cx="770" cy="176" r="5"/><circle cx="813" cy="231" r="4"/><circle cx="790" cy="681" r="5"/>
    <circle cx="1491" cy="352" r="5"/><circle cx="1518" cy="401" r="3"/><circle cx="1463" cy="691" r="4"/>
  </g>
</svg>
