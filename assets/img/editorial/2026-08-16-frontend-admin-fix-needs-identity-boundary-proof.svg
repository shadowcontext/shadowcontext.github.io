    <path d="M969 298C1027 298 1067 338 1067 391V509C1067 562 1027 602 969 602" fill="none" stroke="#7BE8D0" stroke-width="8" stroke-linecap="round"/>
    <circle cx="969" cy="450" r="26" fill="#C6FFF0"/>
