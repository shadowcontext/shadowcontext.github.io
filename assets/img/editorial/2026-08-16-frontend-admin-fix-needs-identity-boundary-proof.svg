    <rect x="169" y="101" width="83" height="12" rx="6" fill="#19596A" fill-opacity="0.39"/>
    <rect x="169" y="148" width="98" height="12" rx="6" fill="#19596A" fill-opacity="0.25"/>
  </g>

  <g filter="url(#shadow)" transform="translate(698 633) rotate(10 120 76)">
    <rect width="240" height="152" rx="28" fill="#4C2439" stroke="#F17D86" stroke-width="3"/>
    <circle cx="59" cy="60" r="28" fill="#F1A0A2" fill-opacity="0.72"/>
    <path d="M24 121C29 92 45 82 59 82C75 82 90 94 95 121" fill="#F1A0A2" fill-opacity="0.72"/>
    <path d="M135 46L192 103M192 46L135 103" stroke="#FF9B9B" stroke-width="12" stroke-linecap="round"/>
