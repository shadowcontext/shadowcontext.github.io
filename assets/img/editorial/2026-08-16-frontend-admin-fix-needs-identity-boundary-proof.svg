    <rect x="25" y="25" width="390" height="260" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="111" cy="119" r="52" fill="#397F91" fill-opacity="0.72"/>
