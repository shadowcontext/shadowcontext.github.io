<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity cards protected by a validation boundary</title>
  <desc id="desc">Abstract editorial artwork showing layered identity cards moving toward a luminous guarded boundary, with a malformed card deflected outside.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1470" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B2C"/>
      <stop offset="0.55" stop-color="#102D43"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(967 451) rotate(90) scale(395 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5CE1C3" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#5CE1C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8CF4D8"/>
      <stop offset="1" stop-color="#25A9A1"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAF8F4" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#A8CFD3" stop-opacity="0.84"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000A12" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-100%" y="-20%" width="300%" height="140%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="967" cy="451" rx="520" ry="395" fill="url(#halo)"/>
  <path d="M0 720C306 631 545 719 764 678C1009 632 1246 505 1600 568V900H0Z" fill="#06111C" fill-opacity="0.72"/>
  <path d="M0 188C320 90 501 176 716 146C966 112 1231 16 1600 98" fill="none" stroke="#5FA9B8" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M0 240C292 149 521 231 730 200C1033 155 1278 82 1600 141" fill="none" stroke="#5FA9B8" stroke-opacity="0.08" stroke-width="2"/>

  <g filter="url(#shadow)" transform="translate(192 273) rotate(-7 215 150)">
    <rect x="0" y="0" width="430" height="300" rx="38" fill="#123D52" stroke="#4C8190" stroke-width="3"/>
    <circle cx="105" cy="118" r="49" fill="#5FA8B2" fill-opacity="0.48"/>
    <path d="M42 234C52 179 82 158 106 158C134 158 162 180 171 234" fill="#5FA8B2" fill-opacity="0.48"/>
