<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded boundary for modular content blocks</title>
  <desc id="desc">Abstract blue content blocks move through an amber guarded aperture while a red anomalous block is diverted, representing plugin identity checks and patch verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.52" stop-color="#102842"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <radialGradient id="halo" cx="52%" cy="48%" r="58%">
      <stop offset="0" stop-color="#29b6d8" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#1f6f9b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071526" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#f0a93b"/>
      <stop offset="1" stop-color="#b96721"/>
    </linearGradient>
    <linearGradient id="blueTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52d6e8"/>
      <stop offset="1" stop-color="#2078b8"/>
    </linearGradient>
    <linearGradient id="safeTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77e0c2"/>
      <stop offset="1" stop-color="#2c9c87"/>
    </linearGradient>
    <linearGradient id="redTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a72"/>
      <stop offset="1" stop-color="#c83f55"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="1" fill="#ffffff" opacity="0.025"/>
      <circle cx="24" cy="19" r="1.4" fill="#ffffff" opacity="0.018"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <path d="M90 700 C360 600 468 650 650 520 S992 314 1510 226" fill="none" stroke="#66d9ec" stroke-opacity="0.12" stroke-width="3"/>
  <path d="M86 744 C374 640 520 704 704 568 S1042 338 1512 286" fill="none" stroke="#f5bf52" stroke-opacity="0.11" stroke-width="2"/>
  <circle cx="800" cy="450" r="300" fill="none" stroke="#7cddec" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="800" cy="450" r="235" fill="none" stroke="#7cddec" stroke-opacity="0.09" stroke-width="2" stroke-dasharray="9 18"/>

  <g filter="url(#shadow)">
    <path d="M675 140 H925 L1015 250 V650 L925 760 H675 L585 650 V250 Z" fill="#0b1c2e" stroke="url(#gate)" stroke-width="22"/>
    <path d="M704 236 H896 L929 277 V623 L896 664 H704 L671 623 V277 Z" fill="#0d3043" stroke="#ffd879" stroke-opacity="0.36" stroke-width="3"/>
    <path d="M735 286 H865 L888 315 V585 L865 614 H735 L712 585 V315 Z" fill="#071725" stroke="#6ce0e6" stroke-opacity="0.32" stroke-width="2"/>
  </g>

  <g opacity="0.92" filter="url(#shadow)">
    <g transform="translate(164 242) rotate(-8 88 70)">
      <rect width="176" height="140" rx="24" fill="url(#blueTile)"/>
      <path d="M28 41 H145 M28 70 H116 M28 99 H136" stroke="#d8f8ff" stroke-opacity="0.46" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(356 430) rotate(6 72 60)">
      <rect width="144" height="120" rx="22" fill="url(#blueTile)"/>
      <circle cx="42" cy="42" r="13" fill="#d9fbff" fill-opacity="0.52"/>
      <path d="M68 41 H115 M28 78 H115" stroke="#d8f8ff" stroke-opacity="0.48" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(446 204) rotate(4 64 53)">
      <rect width="128" height="106" rx="20" fill="url(#blueTile)"/>
      <path d="M25 34 H103 M25 61 H89" stroke="#e1fbff" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(520 590) rotate(-5 61 51)">
      <rect width="122" height="102" rx="19" fill="url(#blueTile)"/>
      <path d="M24 32 H96 M24 59 H83" stroke="#e1fbff" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(1038 205) rotate(7 85 68)">
      <rect width="170" height="136" rx="24" fill="url(#safeTile)"/>
      <path d="M32 42 H137 M32 70 H114 M32 98 H132" stroke="#e4fff6" stroke-opacity="0.53" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(1216 390) rotate(-6 70 58)">
      <rect width="140" height="116" rx="22" fill="url(#safeTile)"/>
      <circle cx="42" cy="40" r="12" fill="#eafff8" fill-opacity="0.57"/>
      <path d="M68 40 H112 M28 76 H110" stroke="#eafff8" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(1038 558) rotate(5 66 54)">
      <rect width="132" height="108" rx="20" fill="url(#safeTile)"/>
      <path d="M26 34 H106 M26 63 H92" stroke="#eafff8" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <path d="M622 450 H526" stroke="#f5b84d" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 16" opacity="0.58"/>
  <path d="M978 450 H1072" stroke="#75dfc4" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 16" opacity="0.58"/>

  <g transform="translate(496 700) rotate(15 66 54)" filter="url(#shadow)">
    <rect width="132" height="108" rx="20" fill="url(#redTile)"/>
    <path d="M31 31 L101 77 M101 31 L31 77" stroke="#ffe5e5" stroke-opacity="0.72" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M647 655 C603 679 588 697 566 722" fill="none" stroke="#ff766f" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 16" opacity="0.62"/>

  <g filter="url(#glow)">
    <circle cx="800" cy="450" r="18" fill="#ffd166"/>
    <circle cx="800" cy="450" r="7" fill="#fff4c7"/>
  </g>
  <path d="M800 408 V340 M800 492 V560 M758 450 H712 M842 450 H888" stroke="#ffd166" stroke-width="5" stroke-linecap="round" opacity="0.66"/>

  <path d="M0 810 C300 760 470 848 738 807 C1017 764 1270 724 1600 780 V900 H0 Z" fill="#06101c" opacity="0.68"/>
</svg>
