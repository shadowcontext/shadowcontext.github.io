<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Breaking a recursive Linux memory allocation cycle</title>
  <desc id="desc">Abstract layered memory blocks curl into an interrupted loop while a separate teal channel carries allocation safely across a dark technical landscape.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09131f"/>
      <stop offset="0.55" stop-color="#10263a"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7891ad"/>
      <stop offset="1" stop-color="#263e58"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26d8c1"/>
      <stop offset="0.5" stop-color="#7af3db"/>
      <stop offset="1" stop-color="#27aebd"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#41e6cf" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#41e6cf" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02070c" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8eb4ce" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1090" cy="466" rx="430" ry="345" fill="url(#glow)" filter="url(#soft)"/>
