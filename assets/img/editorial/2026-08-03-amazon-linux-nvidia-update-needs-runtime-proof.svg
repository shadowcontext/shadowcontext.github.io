      <rect x="205" y="133" width="92" height="92" rx="17"/>
      <rect x="321" y="133" width="92" height="92" rx="17"/>
      <rect x="89" y="251" width="92" height="92" rx="17"/>
      <rect x="205" y="251" width="92" height="92" rx="17"/>
      <rect x="321" y="251" width="92" height="92" rx="17"/>
    </g>
    <g fill="#8cf9e7" filter="url(#nodeGlow)">
      <circle cx="135" cy="179" r="11"/><circle cx="251" cy="179" r="11"/><circle cx="367" cy="179" r="11"/>
      <circle cx="135" cy="297" r="11"/><circle cx="251" cy="297" r="11"/><circle cx="367" cy="297" r="11"/>
