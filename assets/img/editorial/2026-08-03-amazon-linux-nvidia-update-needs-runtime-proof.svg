<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GPU driver package passing into verified runtime</title>
  <desc id="desc">Abstract editorial artwork showing layered compute packages crossing a luminous verification ring into a protected field of active GPU nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.55" stop-color="#0b2234"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="58%" cy="50%" r="53%">
      <stop offset="0" stop-color="#35e0d0" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#1687a3" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071526" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="package" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a641"/>
      <stop offset="1" stop-color="#c9642d"/>
    </linearGradient>
    <linearGradient id="verified" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69f2db"/>
      <stop offset="1" stop-color="#159bb6"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="microgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7ddfd6" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect x="70" y="70" width="1460" height="760" rx="46" fill="url(#microgrid)" stroke="#72cfc8" stroke-opacity="0.12"/>

  <g opacity="0.62">
    <path d="M100 245C310 150 445 172 602 265" fill="none" stroke="#2e6c80" stroke-width="2"/>
    <path d="M101 660C312 744 458 725 624 630" fill="none" stroke="#2e6c80" stroke-width="2"/>
    <path d="M1010 170C1210 110 1401 179 1510 310" fill="none" stroke="#2e6c80" stroke-width="2"/>
    <path d="M1000 730C1215 790 1410 705 1510 590" fill="none" stroke="#2e6c80" stroke-width="2"/>
  </g>

  <g transform="translate(250 294) skewY(-8)">
    <rect x="0" y="100" width="385" height="250" rx="28" fill="#081b2b" stroke="#f4ad55" stroke-opacity="0.42" stroke-width="3"/>
    <rect x="34" y="64" width="385" height="250" rx="28" fill="#0c2434" stroke="#f4ad55" stroke-opacity="0.58" stroke-width="3"/>
    <rect x="68" y="28" width="385" height="250" rx="28" fill="#102b3a" stroke="url(#package)" stroke-width="4"/>
    <g fill="url(#package)">
      <rect x="118" y="78" width="62" height="62" rx="12" opacity="0.88"/>
      <rect x="196" y="78" width="62" height="62" rx="12" opacity="0.72"/>
      <rect x="274" y="78" width="62" height="62" rx="12" opacity="0.56"/>
      <rect x="118" y="156" width="62" height="62" rx="12" opacity="0.56"/>
      <rect x="196" y="156" width="62" height="62" rx="12" opacity="0.88"/>
      <rect x="274" y="156" width="62" height="62" rx="12" opacity="0.72"/>
    </g>
    <path d="M360 108H488" stroke="#f1a148" stroke-width="8" stroke-linecap="round" opacity="0.86"/>
    <path d="M360 184H510" stroke="#f1a148" stroke-width="8" stroke-linecap="round" opacity="0.66"/>
  </g>

  <g filter="url(#softGlow)">
    <ellipse cx="812" cy="450" rx="130" ry="294" fill="none" stroke="#50e7d4" stroke-opacity="0.16" stroke-width="42"/>
    <ellipse cx="812" cy="450" rx="130" ry="294" fill="none" stroke="#62f1df" stroke-width="8"/>
    <path d="M765 454l32 34 67-82" fill="none" stroke="#8bfae9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
