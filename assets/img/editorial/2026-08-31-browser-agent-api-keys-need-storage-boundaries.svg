<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Browser agent credential protected by layered storage boundaries</title>
  <desc id="desc">An abstract browser window encloses a luminous key-shaped secret, surrounded by layered storage panels and access-control shields in deep blue and teal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102541"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="55%">
      <stop offset="0" stop-color="#5df2d6" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#3a8cff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18395c" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0b1d32" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9fff0"/>
      <stop offset="0.55" stop-color="#54e7cb"/>
      <stop offset="1" stop-color="#47a7ff"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6eead4" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#2686d9" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000814" flood-opacity="0.62"/>
    </filter>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#9bc7e8" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <path d="M0 705 C260 625 420 786 692 712 S1118 595 1600 705 V900 H0Z" fill="#07101d" opacity="0.72"/>

  <g opacity="0.58">
    <path d="M210 191h205M1185 191h205M145 690h250M1205 690h250" stroke="#4c86ad" stroke-width="2" stroke-linecap="round"/>
    <circle cx="179" cy="191" r="8" fill="#54e7cb"/>
    <circle cx="1421" cy="191" r="8" fill="#54e7cb"/>
    <circle cx="114" cy="690" r="8" fill="#47a7ff"/>
    <circle cx="1486" cy="690" r="8" fill="#47a7ff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="284" y="126" width="1032" height="648" rx="46" fill="#081829" stroke="#4e789b" stroke-width="3"/>
    <path d="M284 211h1032" stroke="#406889" stroke-width="3"/>
    <circle cx="342" cy="170" r="11" fill="#fa7181"/>
    <circle cx="381" cy="170" r="11" fill="#f3c868"/>
    <circle cx="420" cy="170" r="11" fill="#61dfb5"/>
    <rect x="500" y="151" width="694" height="39" rx="19.5" fill="#102942" stroke="#315776" stroke-width="2"/>
