    <circle cx="1159" cy="170" r="7" fill="#61dfb5" opacity="0.75"/>
  </g>

  <g opacity="0.78">
    <rect x="355" y="279" width="312" height="383" rx="28" fill="url(#panel)" stroke="#315e81" stroke-width="2"/>
    <rect x="933" y="279" width="312" height="383" rx="28" fill="url(#panel)" stroke="#315e81" stroke-width="2"/>
    <rect x="390" y="326" width="241" height="22" rx="11" fill="#4a7899" opacity="0.42"/>
    <rect x="390" y="374" width="181" height="15" rx="7.5" fill="#68a1c3" opacity="0.28"/>
    <rect x="390" y="413" width="220" height="15" rx="7.5" fill="#68a1c3" opacity="0.2"/>
    <rect x="390" y="477" width="241" height="119" rx="18" fill="#0b1a2a" stroke="#2b5878" stroke-width="2"/>
    <path d="M425 517h160M425 552h111" stroke="#50cbb8" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
    <rect x="968" y="326" width="241" height="22" rx="11" fill="#4a7899" opacity="0.42"/>
    <g fill="#1b3d59" stroke="#4f84a7" stroke-width="2">
      <rect x="968" y="391" width="241" height="58" rx="14"/>
      <rect x="968" y="470" width="241" height="58" rx="14"/>
      <rect x="968" y="549" width="241" height="58" rx="14"/>
    </g>
    <circle cx="1005" cy="420" r="9" fill="#5df2d6"/>
    <circle cx="1005" cy="499" r="9" fill="#47a7ff"/>
    <circle cx="1005" cy="578" r="9" fill="#5df2d6"/>
    <path d="M1033 420h129M1033 499h98M1033 578h143" stroke="#8db7d1" stroke-width="8" stroke-linecap="round" opacity="0.34"/>
  </g>

  <g filter="url(#glow)">
    <path d="M800 267c115 53 184 70 184 70v139c0 116-73 194-184 244-111-50-184-128-184-244V337s69-17 184-70Z" fill="url(#shield)" stroke="#68edd5" stroke-width="5"/>
    <path d="M800 309c84 39 139 54 139 54v108c0 87-50 148-139 193-89-45-139-106-139-193V363s55-15 139-54Z" fill="#0a2133" stroke="#47a7ff" stroke-width="3" opacity="0.94"/>
  </g>

  <g filter="url(#glow)" fill="none" stroke="url(#key)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="759" cy="470" r="58" stroke-width="24"/>
    <path d="M800 510l111 111m-28-28 34-34m-68 0 32-32" stroke-width="27"/>
  </g>
  <circle cx="759" cy="470" r="13" fill="#c9fff6"/>

  <g opacity="0.6" fill="none" stroke="#60d9c5" stroke-width="3">
    <path d="M530 718c58 33 112 51 166 54"/>
    <path d="M1070 718c-58 33-112 51-166 54"/>
