<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered protection around an XML parser core</title>
  <desc id="desc">Abstract streams of XML-like data pass through layered parser rings into a protected core, while isolated fragments remain outside the boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071427"/>
      <stop offset="0.52" stop-color="#102b44"/>
      <stop offset="1" stop-color="#081c31"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#55e0c3" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#28a9d8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071427" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34769a" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#6bd6da"/>
      <stop offset="1" stop-color="#8af0c6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4ffe3"/>
      <stop offset="1" stop-color="#36bfc0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="850" cy="450" r="390" fill="url(#glow)"/>
  <g opacity="0.25" fill="none" stroke="#79a7bd" stroke-width="2">
    <path d="M70 150 C290 150 330 250 505 250"/>
    <path d="M80 730 C310 730 360 645 520 645"/>
    <path d="M1110 180 C1280 180 1365 250 1530 250"/>
    <path d="M1110 700 C1290 700 1360 640 1530 640"/>
  </g>
  <g fill="none" stroke="url(#stream)" stroke-linecap="round">
    <path d="M50 300 C275 300 345 390 510 390 C610 390 640 360 690 350" stroke-width="14" opacity="0.82"/>
    <path d="M35 450 C260 450 345 450 515 450 C620 450 650 450 698 450" stroke-width="10" opacity="0.95"/>
    <path d="M60 610 C280 610 350 520 515 520 C610 520 650 540 690 550" stroke-width="14" opacity="0.75"/>
  </g>
  <g fill="#73d5d1" opacity="0.65">
    <circle cx="185" cy="300" r="9"/><circle cx="330" cy="346" r="7"/><circle cx="430" cy="386" r="11"/>
    <circle cx="160" cy="450" r="7"/><circle cx="315" cy="450" r="10"/><circle cx="475" cy="450" r="7"/>
    <circle cx="195" cy="610" r="10"/><circle cx="350" cy="568" r="7"/><circle cx="455" cy="526" r="11"/>
  </g>
  <g transform="translate(850 450)">
    <circle r="300" fill="none" stroke="#234f68" stroke-width="42" opacity="0.7"/>
    <circle r="245" fill="#0b2136" stroke="#3c8e9c" stroke-width="5"/>
    <circle r="190" fill="none" stroke="#62d4c7" stroke-width="20" stroke-dasharray="250 52 120 40" opacity="0.8" transform="rotate(-18)"/>
    <circle r="130" fill="#102d40" stroke="#8ae8d2" stroke-width="3"/>
    <path d="M0-88 L82-44 L70 54 L0 98 L-70 54 L-82-44 Z" fill="url(#core)" opacity="0.95"/>
    <path d="M0-58 L50-30 L43 34 L0 62 L-43 34 L-50-30 Z" fill="#0d3442"/>
    <circle r="22" fill="#d4fff0"/>
  </g>
  <g fill="#163d53" stroke="#62bdc0" stroke-width="3">
    <path d="M1210 300 l34-20 34 20v40l-34 20-34-20z"/>
    <path d="M1310 410 l25-15 25 15v30l-25 15-25-15z"/>
    <path d="M1195 575 l30-18 30 18v36l-30 18-30-18z"/>
  </g>
  <g stroke="#f0b866" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M1168 268 l28 28 M1196 268 l-28 28"/>
    <path d="M1328 532 l24 24 M1352 532 l-24 24"/>
  </g>
  <ellipse cx="850" cy="770" rx="270" ry="30" fill="#2de1c1" opacity="0.1" filter="url(#blur)"/>
  <circle cx="850" cy="450" r="105" fill="#64e3c7" opacity="0.12" filter="url(#soft)"/>
</svg>
