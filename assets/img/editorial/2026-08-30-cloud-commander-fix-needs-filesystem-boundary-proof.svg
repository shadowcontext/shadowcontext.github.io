<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Filesystem boundary restored around abstract file tiles</title>
  <desc id="desc">A polished abstract editorial scene of blue file-like tiles inside layered containment arcs, with one amber tile beside a repaired luminous gap.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2d45"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(935 436) rotate(152) scale(690 410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29c5d8" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#15779b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="446" y1="204" x2="1139" y2="721" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65dce7"/>
      <stop offset="0.46" stop-color="#218aaf"/>
      <stop offset="1" stop-color="#174f78"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d7f7f5"/>
      <stop offset="1" stop-color="#4eb7cc"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd382"/>
      <stop offset="1" stop-color="#e8853b"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#020a10" flood-opacity="0.62"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8fdce4" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="806" cy="778" rx="546" ry="52" fill="#020a11" opacity="0.54" filter="url(#blur)"/>

