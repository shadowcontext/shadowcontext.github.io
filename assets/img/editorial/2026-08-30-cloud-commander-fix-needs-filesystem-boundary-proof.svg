    <path d="M532 214H1032L1164 346V684C1164 724 1132 756 1092 756H508C468 756 436 724 436 684V286C436 246 468 214 508 214Z" fill="#0c2638" stroke="url(#frame)" stroke-width="8"/>
    <path d="M1019 218V315C1019 338 1038 357 1061 357H1157" fill="#123951" stroke="#4fc0d2" stroke-width="5" opacity="0.95"/>
