    <path d="M27 68H88" stroke="#8c4f27" stroke-width="7" stroke-linecap="round" opacity="0.42"/>
  </g>
  <path d="M1000 616C1031 616 1050 612 1075 600" fill="none" stroke="#ffd384" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 16" opacity="0.9"/>

