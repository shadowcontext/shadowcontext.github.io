    <path d="M714 477H798" stroke="#0c4f69" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <rect x="852" y="438" width="132" height="90" rx="18" fill="url(#tile)" opacity="0.7"/>
    <path d="M876 477H960" stroke="#0c4f69" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <rect x="528" y="560" width="132" height="90" rx="18" fill="url(#tile)" opacity="0.74"/>
    <path d="M552 599H636" stroke="#0c4f69" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
