<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Streaming packet filtered at a protective boundary</title>
  <desc id="desc">Abstract editorial artwork showing a luminous streaming path and an oversized segmented packet meeting a translucent protective boundary before reaching a host.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182c"/>
      <stop offset="0.52" stop-color="#102c48"/>
      <stop offset="1" stop-color="#07121f"/>
    </linearGradient>
    <radialGradient id="halo" cx="58%" cy="48%" r="48%">
      <stop offset="0" stop-color="#56e6d2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#56e6d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61a7ff" stop-opacity=".08"/>
      <stop offset=".45" stop-color="#65c7ff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#72f1d5" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8fff4" stop-opacity=".82"/>
      <stop offset=".5" stop-color="#48d9c4" stop-opacity=".44"/>
      <stop offset="1" stop-color="#1b7ea0" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#ff5d78"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="shieldClip">
      <path d="M905 165 C1018 208 1100 215 1175 218 V465 C1175 610 1079 714 905 779 C731 714 635 610 635 465 V218 C710 215 792 208 905 165Z"/>
    </clipPath>
