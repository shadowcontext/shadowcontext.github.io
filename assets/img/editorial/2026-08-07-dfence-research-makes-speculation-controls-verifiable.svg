<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Selective containment of speculative processor paths</title>
  <desc id="desc">An abstract dark processor landscape where branching magenta and cyan paths curve around a luminous shield protecting a central data register.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="0.52" stop-color="#101b38"/>
      <stop offset="1" stop-color="#170f2d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#62f5dc" stop-opacity="0.30"/>
      <stop offset="0.48" stop-color="#775dff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24365e"/>
      <stop offset="1" stop-color="#111a36"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3fff1" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#48d9d3" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#725bff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ffff"/>
      <stop offset="0.45" stop-color="#7bf5df"/>
      <stop offset="1" stop-color="#8370ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#87a8d8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="438" rx="650" ry="390" fill="url(#halo)"/>

  <g opacity="0.9" fill="none" stroke-linecap="round">
    <path d="M70 225 C330 225 360 356 608 356 C704 356 726 392 748 432" stroke="#32d8dd" stroke-width="9"/>
    <path d="M70 225 C330 225 360 356 608 356 C704 356 726 392 748 432" stroke="#a9fff0" stroke-opacity="0.42" stroke-width="24" filter="url(#soft)"/>
    <path d="M30 638 C270 638 383 545 588 545 C684 545 715 505 751 463" stroke="#8071ff" stroke-width="8"/>
    <path d="M30 638 C270 638 383 545 588 545 C684 545 715 505 751 463" stroke="#8b6fff" stroke-opacity="0.35" stroke-width="25" filter="url(#soft)"/>
    <path d="M1530 198 C1302 198 1248 332 1014 332 C917 332 878 384 849 423" stroke="#fa5eb5" stroke-width="9"/>
    <path d="M1570 678 C1302 678 1235 553 1012 553 C926 553 887 508 852 468" stroke="#ff846c" stroke-width="8"/>
  </g>

  <g opacity="0.55">
    <circle cx="219" cy="225" r="11" fill="#b7fff4"/>
    <circle cx="390" cy="323" r="8" fill="#63e9df"/>
    <circle cx="264" cy="625" r="10" fill="#9f91ff"/>
    <circle cx="1320" cy="212" r="10" fill="#ff86c8"/>
    <circle cx="1235" cy="574" r="9" fill="#ff9a82"/>
  </g>

  <g transform="translate(800 450)">
    <rect x="-274" y="-194" width="548" height="388" rx="72" fill="#050b1b" stroke="#6c86bb" stroke-opacity="0.34" stroke-width="3"/>
    <rect x="-238" y="-158" width="476" height="316" rx="49" fill="url(#chip)" stroke="#9ab8e5" stroke-opacity="0.28" stroke-width="2"/>
    <g stroke="#7e9dcc" stroke-opacity="0.42" stroke-width="8">
      <path d="M-274-120h-74M-274-44h-98M-274 44h-98M-274 120h-74"/>
      <path d="M274-120h74M274-44h98M274 44h98M274 120h74"/>
      <path d="M-166-194v-64M-56-194v-88M56-194v-88M166-194v-64"/>
      <path d="M-166 194v64M-56 194v88M56 194v88M166 194v64"/>
    </g>

    <path d="M0-127 C77-92 131-89 145-81 V3 C145 98 78 147 0 174 C-78 147-145 98-145 3 V-81 C-130-89-77-92 0-127Z" fill="url(#shield)" stroke="#aaffee" stroke-width="5" filter="url(#glow)"/>
    <path d="M0-91 C55-68 89-65 106-56 V3 C106 68 62 104 0 130 C-62 104-106 68-106 3 V-56 C-89-65-55-68 0-91Z" fill="#0d2342" fill-opacity="0.82" stroke="#55e6d6" stroke-opacity="0.72" stroke-width="2"/>
    <rect x="-57" y="-25" width="114" height="78" rx="20" fill="url(#core)" filter="url(#glow)"/>
    <rect x="-38" y="-7" width="76" height="42" rx="12" fill="#112144" fill-opacity="0.72"/>
    <circle cx="0" cy="14" r="10" fill="#d8fff7"/>
  </g>

  <g fill="#d5e5ff" opacity="0.16">
    <circle cx="117" cy="105" r="3"/><circle cx="1458" cy="115" r="4"/><circle cx="1426" cy="783" r="3"/>
    <circle cx="210" cy="782" r="4"/><circle cx="1258" cy="92" r="2"/><circle cx="350" cy="98" r="2"/>
  </g>
</svg>
