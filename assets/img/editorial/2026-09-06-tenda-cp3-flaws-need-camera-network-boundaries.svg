<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Indoor camera protected by segmented network boundaries</title>
  <desc id="desc">An abstract indoor camera lens is enclosed by layered cyan network rings while amber signals stop at a segmented perimeter.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102348"/>
      <stop offset="1" stop-color="#071a25"/>
    </linearGradient>
    <radialGradient id="lens" cx="44%" cy="38%" r="64%">
      <stop stop-color="#9bf8ff"/>
      <stop offset="0.24" stop-color="#3ba9df"/>
      <stop offset="0.58" stop-color="#314081"/>
      <stop offset="1" stop-color="#080d20"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ffdb87"/>
      <stop offset="0.16" stop-color="#ff9f4a"/>
      <stop offset="0.42" stop-color="#734b9d"/>
      <stop offset="1" stop-color="#10152f"/>
    </radialGradient>
    <linearGradient id="shell" x1="560" y1="180" x2="1030" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7edf3"/>
      <stop offset="0.45" stop-color="#7aa4ba"/>
      <stop offset="1" stop-color="#263e59"/>
    </linearGradient>
    <linearGradient id="boundary" x1="330" y1="160" x2="1270" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6effef"/>
      <stop offset="0.48" stop-color="#31bcd8"/>
      <stop offset="1" stop-color="#6679ff"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff9a3d" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#ffac55"/>
      <stop offset="1" stop-color="#ffe0a0"/>
    </linearGradient>
    <pattern id="mesh" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#91b6d2" stroke-opacity="0.07"/>
      <circle cx="0" cy="0" r="2" fill="#6bcdd7" fill-opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#020713" flood-opacity="0.75"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <ellipse cx="800" cy="462" rx="570" ry="370" fill="#24d8d0" fill-opacity="0.045"/>

  <g fill="none" stroke-linecap="round">
    <path d="M0 256h230c86 0 98 92 170 92h45" stroke="url(#signal)" stroke-width="9"/>
    <path d="M0 655h252c70 0 82-88 152-88h42" stroke="url(#signal)" stroke-width="7"/>
    <path d="M1600 303h-230c-75 0-91 76-157 76h-48" stroke="url(#signal)" stroke-width="9" transform="rotate(180 800 450)"/>
    <path d="M1600 687h-252c-62 0-79-81-145-81h-40" stroke="url(#signal)" stroke-width="7" transform="rotate(180 800 450)"/>
  </g>

  <g filter="url(#glow)" fill="#ffc16b">
    <circle cx="444" cy="348" r="9"/>
    <circle cx="446" cy="567" r="8"/>
    <circle cx="1164" cy="521" r="9"/>
    <circle cx="1164" cy="294" r="8"/>
  </g>

  <rect x="414" y="112" width="772" height="676" rx="278" fill="#061427" fill-opacity="0.48" stroke="url(#boundary)" stroke-width="8"/>
  <rect x="442" y="140" width="716" height="620" rx="250" fill="none" stroke="#91fff6" stroke-opacity="0.2" stroke-width="2"/>
  <path d="M800 112V69M800 831v-43M414 450h-43M1229 450h-43" fill="none" stroke="url(#boundary)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#72f5eb">
    <circle cx="800" cy="69" r="8"/><circle cx="800" cy="831" r="8"/>
    <circle cx="371" cy="450" r="8"/><circle cx="1229" cy="450" r="8"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M619 251c0-92 73-160 181-160s181 68 181 160v204c0 55-25 101-65 130v45c0 44-35 79-79 79h-74c-44 0-79-35-79-79v-45c-40-29-65-75-65-130Z" fill="url(#shell)"/>
    <path d="M642 258c0-77 61-135 158-135s158 58 158 135v190c0 89-66 151-158 151s-158-62-158-151Z" fill="#142b49" stroke="#b9eaf0" stroke-opacity="0.38" stroke-width="3"/>
    <circle cx="800" cy="339" r="130" fill="#071226" stroke="#5fe3e4" stroke-opacity="0.6" stroke-width="5"/>
    <circle cx="800" cy="339" r="105" fill="url(#lens)"/>
    <circle cx="800" cy="339" r="61" fill="url(#iris)"/>
    <circle cx="800" cy="339" r="25" fill="#050915"/>
    <ellipse cx="764" cy="297" rx="26" ry="16" fill="#d5ffff" fill-opacity="0.68" transform="rotate(-28 764 297)"/>
    <circle cx="708" cy="492" r="9" fill="#52e7d7"/>
    <circle cx="800" cy="492" r="9" fill="#617cff"/>
    <circle cx="892" cy="492" r="9" fill="#ffb158"/>
    <path d="M719 631h162" stroke="#16314d" stroke-width="22" stroke-linecap="round"/>
    <path d="M741 631h118" stroke="#65dddc" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <path d="M497 229c-46 52-74 116-83 184M1103 673c48-48 78-110 86-178" fill="none" stroke="#75f4ea" stroke-opacity="0.22" stroke-width="4"/>
  <path d="M520 695c-48-39-84-91-103-151M1081 204c51 40 88 94 107 156" fill="none" stroke="#6b78ff" stroke-opacity="0.25" stroke-width="3"/>
</svg>
