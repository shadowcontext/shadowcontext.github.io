    <circle cx="335" cy="620" r="12" fill="#50d7c7"/>
    <rect x="1135" y="250" width="260" height="400" rx="42" fill="url(#device)" stroke="#347c98" stroke-width="5"/>
    <rect x="1167" y="292" width="196" height="300" rx="22" fill="#0c2c3e" stroke="#27677f" stroke-width="3"/>
    <circle cx="1265" cy="620" r="12" fill="#50d7c7"/>
