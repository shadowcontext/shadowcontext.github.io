    <path d="M330 450 C510 330 650 330 760 421" stroke="#4bcabf" stroke-width="7" opacity="0.48"/>
    <path d="M1270 450 C1100 235 950 235 840 396" stroke="#2b8aaa" stroke-width="10" opacity="0.28"/>
    <path d="M1270 450 C1090 330 950 330 840 421" stroke="#4bcabf" stroke-width="7" opacity="0.48"/>
  </g>
  <ellipse cx="800" cy="450" rx="125" ry="285" fill="#4de3cb" opacity="0.12" filter="url(#soft)"/>
  <g opacity="0.92">
