<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded proximity-sharing boundary</title>
  <desc id="desc">Abstract nearby devices exchange layered wireless signals through a luminous authentication boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b3144"/>
      <stop offset="1" stop-color="#10283c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4de3cb" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#29a8c7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#071827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79f2dd"/>
      <stop offset="0.5" stop-color="#36c9c8"/>
      <stop offset="1" stop-color="#237da6"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f59"/>
      <stop offset="1" stop-color="#0a2133"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="440" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
