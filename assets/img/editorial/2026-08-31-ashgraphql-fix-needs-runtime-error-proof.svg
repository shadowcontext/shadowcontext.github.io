    <path d="M105 585L300 525L470 575L650 485"/>
    <path d="M300 335L300 525"/>
  </g>
  <g fill="#d8ccff" stroke="#332968" stroke-width="8">
    <circle cx="110" cy="270" r="20"/>
    <circle cx="310" cy="335" r="28"/>
