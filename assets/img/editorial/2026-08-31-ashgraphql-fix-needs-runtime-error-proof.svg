<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contained malformed branch at an abstract API gateway</title>
  <desc id="desc">A violet field of connected nodes converges on a layered gateway, while one irregular branch is redirected into a protective teal ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120f2d"/>
      <stop offset="0.52" stop-color="#292056"/>
      <stop offset="1" stop-color="#0d3140"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9f7aea" stop-opacity=".54"/>
      <stop offset="1" stop-color="#9f7aea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b79cff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#070615" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="795" cy="455" rx="560" ry="390" fill="url(#glow)"/>
  <g opacity=".16" fill="none" stroke="#c4b5fd" stroke-width="2">
