    <circle cx="800" cy="450" r="92" fill="#111933" stroke="#b79cff" stroke-width="10"/>
    <circle cx="800" cy="450" r="48" fill="#5eead4" opacity=".92"/>
    <circle cx="800" cy="450" r="17" fill="#e7fffb"/>
  </g>
  <g stroke="#70e6d3" stroke-width="8" stroke-linecap="round" fill="none">
