<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Industrial switch fabric protected by a layered management boundary</title>
  <desc id="desc">Abstract editorial artwork showing an amber disruption meeting layered protective arcs before a stable field of interconnected industrial switch nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.52" stop-color="#102a38"/>
      <stop offset="1" stop-color="#071821"/>
    </linearGradient>
    <radialGradient id="aura" cx="67%" cy="50%" r="50%">
      <stop offset="0" stop-color="#49e2c2" stop-opacity=".2"/>
      <stop offset="1" stop-color="#49e2c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
