      <stop offset=".52" stop-color="#ffb54b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe09a" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8fff1"/>
      <stop offset=".48" stop-color="#50ddc3"/>
      <stop offset="1" stop-color="#248cad"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f586a"/>
      <stop offset="1" stop-color="#0b2938"/>
    </linearGradient>
