<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Persona fragments protected by privacy and provenance controls</title>
  <desc id="desc">An abstract editorial scene of luminous personal signal fragments approaching a faceted AI core, constrained by translucent privacy shields and a provenance ring.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1470" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152B"/>
      <stop offset="0.52" stop-color="#10294A"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(1040 445) rotate(90) scale(380 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31E6C2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#31E6C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="860" y1="280" x2="1220" y2="650" gradientUnits="userSpaceOnUse">
