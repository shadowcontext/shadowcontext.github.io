    <path d="M735 542c23-25 44-36 65-36s42 11 65 36" fill="none" stroke="#5acdbf" stroke-width="9" stroke-linecap="round" opacity=".85"/>
    <circle cx="800" cy="492" r="9" fill="#ffd392"/>
    <circle cx="771" cy="504" r="7" fill="#93b7ff"/>
    <circle cx="829" cy="504" r="7" fill="#93b7ff"/>
  </g>

  <path d="M962 450C1080 450 1114 271 1241 271" fill="none" stroke="#4ae5d1" stroke-opacity=".18" stroke-width="32"/>
  <path d="M962 450C1080 450 1114 271 1241 271" fill="none" stroke="#5de4d1" stroke-width="7" filter="url(#glow)"/>
  <path d="M962 450C1080 450 1114 450 1241 450" fill="none" stroke="#4ae5d1" stroke-opacity=".18" stroke-width="32"/>
  <path d="M962 450C1080 450 1114 450 1241 450" fill="none" stroke="#5de4d1" stroke-width="7" filter="url(#glow)"/>
  <path d="M962 450C1080 450 1114 629 1241 629" fill="none" stroke="#4ae5d1" stroke-opacity=".18" stroke-width="32"/>
  <path d="M962 450C1080 450 1114 629 1241 629" fill="none" stroke="#5de4d1" stroke-width="7" filter="url(#glow)"/>

  <g filter="url(#softShadow)">
    <g transform="translate(1241 193)">
      <rect width="190" height="156" rx="32" fill="#112942" stroke="#4fd9c9" stroke-width="3"/>
      <path d="M52 48h86v60H52z" fill="#1c5165" stroke="#8cf4e1" stroke-width="3"/>
      <path d="M70 71h50M70 88h34" stroke="#8cf4e1" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    </g>
