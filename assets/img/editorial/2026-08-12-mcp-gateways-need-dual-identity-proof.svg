<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Human and machine identity paths meeting at a protected MCP gateway</title>
  <desc id="desc">An abstract editorial illustration of a warm human identity path and a cool machine identity path converging through a central shielded gateway before branching to protected tool nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.52" stop-color="#102340"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4ae5d1" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#247aa6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07101f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79f2dc"/>
      <stop offset="1" stop-color="#20a9bd"/>
    </linearGradient>
    <linearGradient id="humanPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb76b" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffd392"/>
    </linearGradient>
    <linearGradient id="machinePath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a86ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#93b7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020711" flood-opacity=".65"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#7bb7d8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="450" rx="590" ry="440" fill="url(#halo)"/>

  <g opacity=".42" fill="none" stroke="#4c7b9e" stroke-width="2">
    <path d="M80 160C380 40 520 150 690 250"/>
    <path d="M70 746C340 842 560 768 704 650"/>
    <path d="M1510 132C1290 58 1134 156 984 252"/>
    <path d="M1530 760C1270 852 1102 760 984 652"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="265" cy="306" r="88" fill="#132a48" stroke="#ffca87" stroke-width="3"/>
    <circle cx="265" cy="278" r="24" fill="#ffd49c"/>
    <path d="M217 350c10-38 32-55 48-55s38 17 48 55" fill="#ffb86e" opacity=".9"/>
    <circle cx="265" cy="306" r="69" fill="none" stroke="#ffe1b4" stroke-opacity=".25" stroke-width="8"/>

    <rect x="179" y="516" width="172" height="172" rx="38" fill="#132a48" stroke="#8aaaff" stroke-width="3"/>
    <path d="M226 565h78v74h-78z" fill="#779aff" opacity=".82"/>
    <circle cx="245" cy="584" r="6" fill="#d2deff"/>
