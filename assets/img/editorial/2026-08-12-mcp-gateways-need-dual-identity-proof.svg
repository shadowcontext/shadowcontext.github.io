      <path d="M103 69h21M103 88h21" stroke="#8cf4e1" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(1241 551)">
      <rect width="190" height="156" rx="32" fill="#112942" stroke="#4fd9c9" stroke-width="3"/>
      <circle cx="95" cy="78" r="42" fill="#1c5165" stroke="#8cf4e1" stroke-width="3"/>
      <path d="M74 78h42M95 57v42" stroke="#8cf4e1" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="#8cf4e1" filter="url(#glow)">
    <circle cx="1094" cy="366" r="7"/>
    <circle cx="1128" cy="450" r="7"/>
    <circle cx="1094" cy="534" r="7"/>
  </g>
</svg>
