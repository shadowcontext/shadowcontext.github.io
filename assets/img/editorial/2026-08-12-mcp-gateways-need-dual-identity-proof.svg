    <path d="M243 613h44M265 545v20M210 601h16M304 601h16" stroke="#d2deff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M353 306C520 306 565 365 693 405" fill="none" stroke="#ffbe73" stroke-opacity=".16" stroke-width="34"/>
  <path d="M353 306C520 306 565 365 693 405" fill="none" stroke="url(#humanPath)" stroke-width="8" filter="url(#glow)"/>
  <path d="M351 602C520 602 570 530 693 489" fill="none" stroke="#779aff" stroke-opacity=".16" stroke-width="34"/>
  <path d="M351 602C520 602 570 530 693 489" fill="none" stroke="url(#machinePath)" stroke-width="8" filter="url(#glow)"/>

  <g fill="#0d1c32" stroke-width="3" filter="url(#softShadow)">
    <circle cx="505" cy="326" r="23" stroke="#ffd392"/>
    <circle cx="575" cy="361" r="15" stroke="#ffd392"/>
    <rect x="487" y="569" width="46" height="46" rx="10" stroke="#93b7ff"/>
    <rect x="565" y="530" width="30" height="30" rx="7" stroke="#93b7ff"/>
