  <path d="M354 640C520 818 959 835 1240 600C1434 437 1304 211 1122 174" fill="none" stroke="url(#orbit)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="354" cy="640" r="18" fill="#FFC66D"/>
  <circle cx="1122" cy="174" r="18" fill="#FFC66D"/>
