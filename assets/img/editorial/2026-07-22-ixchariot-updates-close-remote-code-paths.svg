<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected network test signals and isolated legacy nodes</title>
  <desc id="desc">An abstract editorial composition of cyan network-test signals passing through a faceted shield, with amber nodes left outside the protected path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142d"/>
      <stop offset="0.55" stop-color="#0b2140"/>
      <stop offset="1" stop-color="#06101f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0.15" y1="0.05" x2="0.88" y2="0.95">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#22d3ee" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1" fill="#bae6fd" opacity="0.08"/>
      <circle cx="31" cy="17" r="0.7" fill="#ffffff" opacity="0.06"/>
      <circle cx="19" cy="39" r="0.8" fill="#5eead4" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <ellipse cx="790" cy="468" rx="415" ry="315" fill="#0ea5e9" opacity="0.07" filter="url(#soft)"/>
  <path d="M40 240 C290 134 420 180 610 304 S992 506 1560 250" fill="none" stroke="#7dd3fc" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M40 662 C312 514 470 592 654 680 S1110 736 1560 544" fill="none" stroke="#5eead4" stroke-opacity="0.08" stroke-width="2"/>

  <g opacity="0.9">
    <path d="M90 450 H330 L374 382 L422 525 L475 420 H617" fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M983 450 H1122 L1170 397 L1216 510 L1266 431 H1510" fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="116" cy="450" r="13" fill="#7dd3fc" filter="url(#glow)"/>
    <circle cx="1481" cy="450" r="13" fill="#99f6e4" filter="url(#glow)"/>
  </g>

  <g opacity="0.42" fill="none" stroke="#67e8f9">
    <path d="M178 300 C302 300 346 332 430 382" stroke-width="3"/>
    <path d="M1422 606 C1308 606 1238 574 1168 516" stroke-width="3"/>
    <circle cx="167" cy="300" r="9" fill="#38bdf8"/>
    <circle cx="1432" cy="606" r="9" fill="#2dd4bf"/>
  </g>

  <g filter="url(#glow)">
    <path d="M800 164 L1010 250 V430 C1010 584 928 696 800 754 C672 696 590 584 590 430 V250 Z" fill="url(#shield)" fill-opacity="0.28" stroke="url(#shieldEdge)" stroke-width="7"/>
    <path d="M800 164 V754 C928 696 1010 584 1010 430 V250 Z" fill="#2563eb" opacity="0.16"/>
    <path d="M800 205 L966 274 V425 C966 548 904 641 800 698 C696 641 634 548 634 425 V274 Z" fill="none" stroke="#cffafe" stroke-opacity="0.36" stroke-width="2"/>
  </g>

  <path d="M648 450 H704 L738 390 L782 528 L831 337 L875 500 L910 450 H954" fill="none" stroke="#ecfeff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="800" cy="450" r="118" fill="none" stroke="#99f6e4" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="800" cy="450" r="154" fill="none" stroke="#7dd3fc" stroke-opacity="0.08" stroke-width="2"/>

  <g>
    <circle cx="326" cy="687" r="58" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="326" cy="687" r="18" fill="#f59e0b" opacity="0.88" filter="url(#glow)"/>
    <path d="M326 629 V582 M268 687 H218" stroke="#fbbf24" stroke-opacity="0.36" stroke-width="3" stroke-linecap="round"/>
    <circle cx="326" cy="568" r="8" fill="#fbbf24" opacity="0.58"/>
    <circle cx="204" cy="687" r="8" fill="#fbbf24" opacity="0.58"/>
  </g>
  <g>
    <circle cx="1302" cy="215" r="48" fill="#1e293b" stroke="#fb923c" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="1302" cy="215" r="15" fill="#fb923c" opacity="0.86" filter="url(#glow)"/>
    <path d="M1302 167 V128 M1350 215 H1393" stroke="#fb923c" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1302" cy="116" r="7" fill="#fb923c" opacity="0.54"/>
    <circle cx="1405" cy="215" r="7" fill="#fb923c" opacity="0.54"/>
  </g>

  <path d="M409 689 C508 675 560 625 620 565" fill="none" stroke="#fbbf24" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="8 18"/>
  <path d="M1250 247 C1135 277 1083 316 1002 360" fill="none" stroke="#fb923c" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="8 18"/>
</svg>
