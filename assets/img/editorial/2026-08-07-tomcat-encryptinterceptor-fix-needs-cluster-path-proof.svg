<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified encrypted path between clustered server nodes</title>
  <desc id="desc">Abstract editorial artwork showing a luminous protected data path crossing a verification frame between groups of server-like nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152B"/>
      <stop offset="0.48" stop-color="#0A2942"/>
      <stop offset="1" stop-color="#081422"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(800 448) rotate(90) scale(350 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27D7CC" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#27D7CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="280" y1="450" x2="1320" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54A8FF"/>
      <stop offset="0.45" stop-color="#54F0D0"/>
      <stop offset="0.55" stop-color="#D4FFF3"/>
      <stop offset="1" stop-color="#54A8FF"/>
    </linearGradient>
    <linearGradient id="frame" x1="665" y1="250" x2="940" y2="662" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDFCF0"/>
      <stop offset="0.48" stop-color="#3AE1C5"/>
      <stop offset="1" stop-color="#278BFF"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#163B5B"/>
      <stop offset="1" stop-color="#0A2037"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8ACFFF" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="448" rx="560" ry="350" fill="url(#halo)"/>
  <ellipse cx="800" cy="700" rx="530" ry="58" fill="#02101F" opacity="0.7" filter="url(#soft)"/>

  <g opacity="0.72" fill="none" stroke="#70C8ED">
    <path d="M186 285C365 180 486 203 636 310" stroke-opacity="0.16"/>
    <path d="M964 310C1117 201 1242 186 1417 286" stroke-opacity="0.16"/>
    <path d="M170 625C370 727 512 696 662 596" stroke-opacity="0.11"/>
    <path d="M938 596C1088 698 1230 728 1430 625" stroke-opacity="0.11"/>
  </g>

  <g transform="translate(188 286)">
    <rect x="0" y="0" width="250" height="328" rx="34" fill="url(#node)" stroke="#5CB7E8" stroke-opacity="0.46" stroke-width="2"/>
    <rect x="26" y="32" width="198" height="68" rx="18" fill="#0A2038" stroke="#66D0ED" stroke-opacity="0.32"/>
    <rect x="26" y="130" width="198" height="68" rx="18" fill="#0A2038" stroke="#66D0ED" stroke-opacity="0.32"/>
    <rect x="26" y="228" width="198" height="68" rx="18" fill="#0A2038" stroke="#66D0ED" stroke-opacity="0.32"/>
    <g fill="#61E3D0">
      <circle cx="56" cy="66" r="7"/><circle cx="56" cy="164" r="7"/><circle cx="56" cy="262" r="7"/>
    </g>
