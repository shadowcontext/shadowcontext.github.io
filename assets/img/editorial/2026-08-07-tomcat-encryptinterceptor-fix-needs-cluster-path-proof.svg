      <rect x="83" y="60" width="108" height="12" rx="6"/>
      <rect x="83" y="158" width="108" height="12" rx="6"/>
      <rect x="83" y="256" width="108" height="12" rx="6"/>
    </g>
  </g>

  <g transform="translate(1162 286)">
    <rect x="0" y="0" width="250" height="328" rx="34" fill="url(#node)" stroke="#5CB7E8" stroke-opacity="0.46" stroke-width="2"/>
    <rect x="26" y="32" width="198" height="68" rx="18" fill="#0A2038" stroke="#66D0ED" stroke-opacity="0.32"/>
    <rect x="26" y="130" width="198" height="68" rx="18" fill="#0A2038" stroke="#66D0ED" stroke-opacity="0.32"/>
    <rect x="26" y="228" width="198" height="68" rx="18" fill="#0A2038" stroke="#66D0ED" stroke-opacity="0.32"/>
    <g fill="#61E3D0">
      <circle cx="194" cy="66" r="7"/><circle cx="194" cy="164" r="7"/><circle cx="194" cy="262" r="7"/>
    </g>
    <g fill="#7AB9DC" opacity="0.55">
      <rect x="58" y="60" width="108" height="12" rx="6"/>
      <rect x="58" y="158" width="108" height="12" rx="6"/>
      <rect x="58" y="256" width="108" height="12" rx="6"/>
    </g>
  </g>

  <path d="M438 450C548 450 568 414 650 414H950C1032 414 1052 450 1162 450" fill="none" stroke="#0B1222" stroke-width="68" stroke-linecap="round"/>
  <path d="M438 450C548 450 568 414 650 414H950C1032 414 1052 450 1162 450" fill="none" stroke="url(#path)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M438 450C548 450 568 414 650 414H950C1032 414 1052 450 1162 450" fill="none" stroke="#E8FFF9" stroke-opacity="0.78" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <path d="M800 210L962 302V500C962 605 895 675 800 715C705 675 638 605 638 500V302L800 210Z" fill="#092C42" fill-opacity="0.82" stroke="url(#frame)" stroke-width="12"/>
    <path d="M800 254L920 323V493C920 567 875 621 800 658C725 621 680 567 680 493V323L800 254Z" fill="#0A1B30" fill-opacity="0.55" stroke="#8EF3DE" stroke-opacity="0.42" stroke-width="3"/>
  </g>

  <g transform="translate(800 454)" filter="url(#glow)">
    <circle r="78" fill="#0B2C42" stroke="#61E9CF" stroke-width="7"/>
    <path d="M-33 1L-9 27L39-31" fill="none" stroke="#D7FFF6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#B6FFF0" filter="url(#glow)">
    <circle cx="536" cy="439" r="8"/><circle cx="604" cy="420" r="8"/>
    <circle cx="996" cy="420" r="8"/><circle cx="1064" cy="439" r="8"/>
  </g>

  <g opacity="0.36" fill="#65B7DF">
    <circle cx="265" cy="215" r="5"/><circle cx="342" cy="670" r="4"/><circle cx="1328" cy="224" r="5"/><circle cx="1262" cy="684" r="4"/>
