<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified cloud-to-edge status</title>
  <desc id="desc">Abstract cloud and edge nodes connect through a guarded amber verification ring while an untrusted magenta status signal is diverted away.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102a46"/>
      <stop offset="1" stop-color="#081b2a"/>
    </linearGradient>
    <radialGradient id="cloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.48" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#9bdcf0" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="390" cy="420" rx="360" ry="310" fill="url(#cloudGlow)" filter="url(#soft)"/>
  <ellipse cx="1275" cy="465" rx="320" ry="325" fill="url(#edgeGlow)" filter="url(#soft)"/>

  <g opacity="0.55" fill="#9bdcf0">
    <circle cx="145" cy="170" r="3"/><circle cx="260" cy="735" r="4"/><circle cx="525" cy="155" r="3"/>
    <circle cx="1030" cy="160" r="3"/><circle cx="1450" cy="250" r="4"/><circle cx="1395" cy="735" r="3"/>
  </g>

  <g transform="translate(190 285)">
    <path d="M76 195c-42 0-76-31-76-70 0-35 28-65 65-70C82 21 119 0 162 0c59 0 108 38 119 91 8-3 17-4 26-4 47 0 85 35 85 78s-38 78-85 78H76c-42 0-76-21-76-48z" fill="#102f4a" stroke="#67e8f9" stroke-width="5"/>
    <path d="M85 158h218M117 117h154M151 76h85" stroke="#67e8f9" stroke-opacity="0.6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="85" cy="158" r="9" fill="#67e8f9"/><circle cx="303" cy="158" r="9" fill="#67e8f9"/>
    <circle cx="117" cy="117" r="8" fill="#67e8f9"/><circle cx="271" cy="117" r="8" fill="#67e8f9"/>
  </g>

  <path d="M575 444C665 405 694 417 756 438" fill="none" stroke="url(#trusted)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M844 462C944 510 1020 500 1110 468" fill="none" stroke="url(#trusted)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>

  <g transform="translate(800 450)" filter="url(#glow)">
    <circle r="106" fill="#0b2033" stroke="url(#ring)" stroke-width="15"/>
    <circle r="72" fill="none" stroke="#fde68a" stroke-opacity="0.38" stroke-width="3" stroke-dasharray="8 14"/>
    <path d="M-39 2l25 27 55-63" fill="none" stroke="#fef3c7" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M690 715C736 642 757 599 767 545" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round" stroke-dasharray="16 20" opacity="0.9"/>
  <path d="M690 715l-7-53 48 23z" fill="#fb7185" opacity="0.95"/>
  <circle cx="677" cy="748" r="25" fill="#3c1830" stroke="#fb7185" stroke-width="5"/>
  <path d="M666 737l22 22m0-22l-22 22" stroke="#fecdd3" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(1120 248)">
    <path d="M125 0l108 62v125l-108 63L17 187V62z" fill="#0d332f" stroke="#34d399" stroke-width="6"/>
    <circle cx="125" cy="125" r="46" fill="#123e39" stroke="#6ee7b7" stroke-width="5"/>
    <path d="M125 79v92M79 125h92" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <circle cx="125" cy="125" r="13" fill="#d1fae5"/>
  </g>
  <g fill="#123e39" stroke="#34d399" stroke-width="5">
    <path d="M1100 620l70-41 70 41v81l-70 41-70-41z"/>
    <path d="M1283 620l70-41 70 41v81l-70 41-70-41z"/>
  </g>
  <g fill="#d1fae5">
    <circle cx="1170" cy="660" r="12"/><circle cx="1353" cy="660" r="12"/>
  </g>
  <g stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.65">
    <path d="M1245 498l-60 91M1290 498l50 91M1240 660h43"/>
  </g>

  <path d="M80 790C410 725 490 825 806 788s470-23 714 34" fill="none" stroke="#9bdcf0" stroke-opacity="0.12" stroke-width="2"/>
</svg>
