  <path d="M802 177C858 219 921 232 985 238V413C985 535 915 629 802 689C689 629 619 535 619 413V238C683 232 746 219 802 177Z" fill="url(#shield)"/>
  <path d="M802 226C845 258 893 270 942 276V410C942 505 889 578 802 628C715 578 662 505 662 410V276C711 270 759 258 802 226Z" fill="url(#shieldInner)"/>

