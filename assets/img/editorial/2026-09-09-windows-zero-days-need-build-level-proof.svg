<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Build-level protection across an endpoint fleet</title>
  <desc id="desc">Abstract endpoint tiles sit beneath a luminous update shield that blocks an amber route rising toward a protected privilege layer.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1480" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081426"/>
      <stop offset="0.52" stop-color="#10274A"/>
      <stop offset="1" stop-color="#080F20"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(800 398) rotate(90) scale(420 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EE7F2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5EE7F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="680" y1="185" x2="945" y2="632" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9FBFF"/>
      <stop offset="0.42" stop-color="#38D9E6"/>
      <stop offset="1" stop-color="#5175F6"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="717" y1="241" x2="884" y2="574" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18385C"/>
      <stop offset="1" stop-color="#101B3E"/>
    </linearGradient>
    <linearGradient id="amber" x1="326" y1="699" x2="813" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB852"/>
      <stop offset="1" stop-color="#FF6F61"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <circle cx="1390" cy="118" r="184" fill="#6A54E8" opacity="0.08"/>
  <circle cx="176" cy="745" r="245" fill="#1ED6C4" opacity="0.06"/>

  <g opacity="0.42" stroke="#91ACD3" stroke-width="2">
