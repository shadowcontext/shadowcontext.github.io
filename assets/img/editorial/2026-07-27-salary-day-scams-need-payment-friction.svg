  <path d="M151 451H1122" stroke="#FFD987" stroke-width="4" stroke-linecap="round" opacity="0.78" filter="url(#smallGlow)"/>

  <g>
    <circle cx="378" cy="451" r="82" fill="#F7B548" opacity="0.16" filter="url(#softGlow)"/>
    <circle cx="378" cy="451" r="46" fill="#FFD87E"/>
    <circle cx="378" cy="451" r="34" fill="#EFA339"/>
    <path d="M362 432h32m-32 19h32m-32 19h32" stroke="#FFF1C1" stroke-width="7" stroke-linecap="round"/>
