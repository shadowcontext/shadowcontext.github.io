<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Payment pulse passing through verification layers</title>
  <desc id="desc">An abstract editorial scene in deep blue and warm gold, with a bright payment pulse approaching translucent verification gates while deceptive side paths dissolve in the background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.52" stop-color="#0B2940"/>
      <stop offset="1" stop-color="#123B4A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE59A" stop-opacity="0.92"/>
      <stop offset="0.32" stop-color="#F8B84E" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#F8B84E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A63A" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#F6B748"/>
      <stop offset="1" stop-color="#FFF0B5"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9EEBE2" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#3CB7B0" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="safePath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8BE4D8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B9FFF5" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="microgrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8AD7D0" stroke-width="1" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#microgrid)"/>

  <circle cx="1195" cy="432" r="370" fill="url(#halo)" opacity="0.18"/>
  <circle cx="250" cy="166" r="210" fill="#38B6B0" opacity="0.06"/>
  <circle cx="1395" cy="760" r="250" fill="#F5A63A" opacity="0.055"/>

  <g opacity="0.18" fill="none" stroke="#79CFC8" stroke-width="3">
    <path d="M80 202C280 202 313 333 493 333"/>
    <path d="M116 708C282 708 327 587 493 587"/>
    <path d="M87 452H397"/>
  </g>

  <g opacity="0.24">
    <path d="M415 448C563 322 623 213 756 166" fill="none" stroke="#E17954" stroke-width="10" stroke-linecap="round"/>
    <path d="M415 452C584 572 634 694 770 739" fill="none" stroke="#E17954" stroke-width="10" stroke-linecap="round"/>
    <path d="M612 284l34-32m-3 76 49-46m-27 105 43-40" stroke="#FFAD72" stroke-width="5" stroke-linecap="round"/>
    <path d="M621 611l38 31m-6-74 51 42m-28-101 45 38" stroke="#FFAD72" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g opacity="0.14" fill="#F6A13B">
