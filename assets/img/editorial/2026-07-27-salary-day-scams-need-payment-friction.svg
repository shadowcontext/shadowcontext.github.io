    <path d="M953 182Q995 158 1037 182V718Q995 742 953 718Z" fill="none" stroke="#B7F9F0" stroke-width="4" stroke-opacity="0.9"/>
    <rect x="962" y="418" width="66" height="66" rx="18" fill="#0A2D3E" stroke="#C1FFF7" stroke-width="5"/>
