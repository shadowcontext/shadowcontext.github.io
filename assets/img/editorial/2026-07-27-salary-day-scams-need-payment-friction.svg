    <path d="M1197 242Q1231 222 1265 242V658Q1231 678 1197 658Z" fill="none" stroke="#C9FFF8" stroke-width="4"/>
    <path d="M1231 401l37 17v31c0 34-17 58-37 71-20-13-37-37-37-71v-31Z" fill="#0A2D3E" stroke="#C9FFF8" stroke-width="5"/>
