<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MCP request paths constrained by a destination gateway</title>
  <desc id="desc">Abstract luminous request paths narrow through a guarded central gateway toward one trusted endpoint while disallowed routes dissolve into the dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.48" stop-color="#102641"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="56%">
      <stop offset="0" stop-color="#38d6c8" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#3188d8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="0.52" stop-color="#55e6d0"/>
      <stop offset="1" stop-color="#b4ffe7"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df9de" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#338dd7" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#162d4b" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="faded" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ba6c9" stop-opacity="0.38"/>
      <stop offset="0.65" stop-color="#59708d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#59708d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#b9e6ff" opacity="0.08"/>
      <circle cx="61" cy="33" r="1.3" fill="#7df9de" opacity="0.06"/>
      <circle cx="38" cy="76" r="0.9" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g opacity="0.25" fill="none" stroke="#6fa5c9" stroke-width="2">
    <path d="M80 176 C330 176 410 286 642 318"/>
    <path d="M44 686 C294 686 420 570 642 542"/>
    <path d="M151 432 C339 432 455 424 642 430"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M70 150 C322 150 434 286 670 337" stroke="url(#faded)" stroke-width="16"/>
    <path d="M62 714 C330 714 433 591 670 546" stroke="url(#faded)" stroke-width="16"/>
    <path d="M92 438 C350 438 480 438 677 441" stroke="url(#trusted)" stroke-width="20" filter="url(#glow)"/>
    <path d="M908 441 C1102 441 1240 441 1488 441" stroke="url(#trusted)" stroke-width="20" filter="url(#glow)"/>
  </g>

  <g opacity="0.54" filter="url(#soft)">
    <circle cx="185" cy="150" r="8" fill="#769bc0"/>
    <circle cx="300" cy="714" r="7" fill="#769bc0"/>
    <circle cx="315" cy="438" r="10" fill="#55e6d0"/>
  </g>

  <g transform="translate(790 442)">
    <path d="M0 -174 C87 -147 136 -120 136 -120 L119 31 C111 111 62 161 0 190 C-62 161 -111 111 -119 31 L-136 -120 C-136 -120 -87 -147 0 -174Z" fill="#0b1d31" stroke="url(#gate)" stroke-width="8"/>
    <path d="M0 -142 C66 -122 101 -102 101 -102 L88 22 C82 81 48 118 0 144 C-48 118 -82 81 -88 22 L-101 -102 C-101 -102 -66 -122 0 -142Z" fill="url(#gate)" opacity="0.24"/>
    <circle cx="0" cy="-4" r="54" fill="#071426" stroke="#7df9de" stroke-width="5" filter="url(#glow)"/>
    <path d="M-25 -4 L-7 15 L30 -27" fill="none" stroke="#b4ffe7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1438 441)" filter="url(#glow)">
    <circle r="79" fill="#0d2a3b" stroke="#69efd7" stroke-width="5"/>
    <circle r="49" fill="#123c4d" stroke="#b4ffe7" stroke-width="3"/>
    <circle r="15" fill="#d7fff3"/>
  </g>

  <g fill="#7b91aa" opacity="0.26">
    <circle cx="1270" cy="232" r="30"/>
    <circle cx="1390" cy="696" r="24"/>
    <circle cx="1135" cy="750" r="18"/>
  </g>
  <g stroke="#607894" stroke-width="3" opacity="0.16">
    <path d="M925 350 C1075 280 1150 244 1240 234"/>
    <path d="M924 532 C1100 620 1238 682 1364 694"/>
    <path d="M900 566 C994 678 1065 731 1117 747"/>
  </g>
</svg>
