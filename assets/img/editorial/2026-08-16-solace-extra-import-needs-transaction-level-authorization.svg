    <circle cx="748" cy="452" r="48" fill="#0B2434" stroke="#87F1DE" stroke-width="10"/>
    <path d="M728 453L742 468L771 432" fill="none" stroke="#B8FFE9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
