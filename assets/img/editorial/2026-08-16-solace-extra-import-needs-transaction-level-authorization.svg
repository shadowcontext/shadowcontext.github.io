<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded content import transaction</title>
  <desc id="desc">Abstract editorial artwork showing an archive capsule held outside a luminous guarded chamber while layered site-content panels remain protected inside.</desc>
  <defs>
    <linearGradient id="bg" x1="110" y1="70" x2="1490" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071425"/>
      <stop offset="0.5" stop-color="#102C43"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(1010 447) rotate(90) scale(420 530)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38D8C3" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#287E96" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#07131F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capsule" x1="250" y1="310" x2="680" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3B96B"/>
      <stop offset="0.48" stop-color="#D77B45"/>
      <stop offset="1" stop-color="#7F3E45"/>
    </linearGradient>
    <linearGradient id="capsuleTop" x1="310" y1="315" x2="640" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE1A1"/>
      <stop offset="1" stop-color="#E58A51"/>
    </linearGradient>
    <linearGradient id="glass" x1="790" y1="145" x2="1300" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CF4E0" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#2CB7B1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#167493" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4A9FBA"/>
      <stop offset="1" stop-color="#193E61"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="chamberClip"><rect x="795" y="122" width="596" height="656" rx="86"/></clipPath>
