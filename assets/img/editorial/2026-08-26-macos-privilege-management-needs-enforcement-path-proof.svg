<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected endpoint privilege boundary</title>
  <desc id="desc">Abstract editorial artwork showing a luminous system core inside layered endpoint boundaries while two escalation paths are stopped at reinforced gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102542"/>
      <stop offset="1" stop-color="#071b28"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#f8fff5"/>
      <stop offset="0.28" stop-color="#91f2cc"/>
      <stop offset="0.68" stop-color="#27b8ad"/>
      <stop offset="1" stop-color="#0d6477"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ce0d2" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#27709b" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef6e85" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ef6e85" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#ffb07c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#7fa4c4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="755" rx="500" ry="78" fill="#02101d" opacity="0.72" filter="url(#soft)"/>

  <g opacity="0.34" fill="none" stroke="#7aa8c8">
    <path d="M110 184C280 86 455 92 586 171" stroke-width="2"/>
    <path d="M1490 184C1320 86 1145 92 1014 171" stroke-width="2"/>
    <circle cx="110" cy="184" r="7" fill="#7aa8c8" stroke="none"/>
    <circle cx="1490" cy="184" r="7" fill="#7aa8c8" stroke="none"/>
  </g>

  <path d="M800 106 1190 267 1148 637 800 792 452 637 410 267Z" fill="#0b2036" stroke="#4b829e" stroke-width="3"/>
  <path d="M800 154 1131 291 1095 600 800 733 505 600 469 291Z" fill="url(#shell)" fill-opacity="0.23" stroke="#55b3bd" stroke-width="4"/>
  <path d="M800 216 1054 321 1026 556 800 658 574 556 546 321Z" fill="#0a2438" stroke="#70e0cf" stroke-width="6" stroke-opacity="0.82"/>

  <g filter="url(#glow)">
    <circle cx="800" cy="438" r="128" fill="#2ad1b9" opacity="0.18"/>
    <path d="M800 307c72 0 130 58 130 130s-58 130-130 130-130-58-130-130 58-130 130-130Z" fill="url(#core)"/>
  </g>
  <path d="M800 350c-43 0-78 35-78 78v31c0 43 35 78 78 78s78-35 78-78v-31c0-43-35-78-78-78Zm0 36c23 0 42 19 42 42v31c0 23-19 42-42 42s-42-19-42-42v-31c0-23 19-42 42-42Z" fill="#07314a" opacity="0.76"/>
  <circle cx="800" cy="444" r="16" fill="#dffff2"/>
  <path d="M800 457v42" stroke="#dffff2" stroke-width="13" stroke-linecap="round"/>

  <path d="M90 367C256 367 339 371 492 405" fill="none" stroke="url(#path)" stroke-width="18" stroke-linecap="round"/>
  <path d="M1510 537C1334 537 1252 532 1107 500" fill="none" stroke="url(#path)" stroke-width="18" stroke-linecap="round" transform="rotate(180 1308 518)"/>
  <g fill="#102c42" stroke="#ffb07c" stroke-width="6">
    <path d="M488 353h80v120h-80c-25 0-45-20-45-45v-30c0-25 20-45 45-45Z"/>
    <path d="M1112 438h-80v120h80c25 0 45-20 45-45v-30c0-25-20-45-45-45Z"/>
  </g>
  <g fill="none" stroke="#ffe0b7" stroke-width="9" stroke-linecap="round">
    <path d="m477 385 55 55m0-55-55 55"/>
    <path d="m1068 470 55 55m0-55-55 55"/>
  </g>

  <g fill="#8be7d4">
    <circle cx="620" cy="300" r="7"/><circle cx="980" cy="300" r="7"/>
    <circle cx="620" cy="577" r="7"/><circle cx="980" cy="577" r="7"/>
  </g>
  <g fill="none" stroke="#77a9c5" stroke-width="2" opacity="0.45">
    <path d="M620 300 800 216 980 300"/>
    <path d="M620 577 800 658 980 577"/>
  </g>
</svg>
