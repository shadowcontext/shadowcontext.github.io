<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Federated identity passing through layered verification gates</title>
  <desc id="desc">An abstract editorial illustration of a luminous identity token moving through concentric security rings, with fractured outer paths stopped before the protected center.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#10284a"/>
      <stop offset="1" stop-color="#090f20"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#35e5c3" stop-opacity=".24"/>
      <stop offset=".48" stop-color="#4b82ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#06101f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56f2ce"/>
      <stop offset=".52" stop-color="#63a8ff"/>
      <stop offset="1" stop-color="#ad74ff"/>
    </linearGradient>
    <linearGradient id="token" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fffd"/>
      <stop offset=".4" stop-color="#72f4d5"/>
      <stop offset="1" stop-color="#368ce8"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="lineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#7fa8dc" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g opacity=".7">
    <circle cx="800" cy="440" r="305" fill="none" stroke="#6d8ec3" stroke-opacity=".13" stroke-width="42"/>
    <circle cx="800" cy="440" r="238" fill="none" stroke="#77a2dd" stroke-opacity=".14" stroke-width="28"/>
    <circle cx="800" cy="440" r="173" fill="#081a31" fill-opacity=".82" stroke="#8eeed9" stroke-opacity=".18" stroke-width="2"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M520 319A318 318 0 0 1 1014 210" stroke="url(#ringA)" stroke-width="15" opacity=".82" filter="url(#lineGlow)"/>
    <path d="M1081 291A318 318 0 0 1 1088 573" stroke="url(#ringA)" stroke-width="15" opacity=".78"/>
    <path d="M1031 680A318 318 0 0 1 589 687" stroke="url(#ringA)" stroke-width="15" opacity=".7"/>
    <path d="M488 589A318 318 0 0 1 449 421" stroke="url(#ringA)" stroke-width="15" opacity=".74"/>

    <path d="M659 246A235 235 0 0 1 926 243" stroke="#62e5d2" stroke-width="10" opacity=".72"/>
    <path d="M1008 310A235 235 0 0 1 1016 558" stroke="#6aa8ff" stroke-width="10" opacity=".66"/>
    <path d="M933 632A235 235 0 0 1 667 635" stroke="#9c7bff" stroke-width="10" opacity=".62"/>
    <path d="M592 568A235 235 0 0 1 586 332" stroke="#4fd8bd" stroke-width="10" opacity=".66"/>
  </g>

  <g opacity=".42" fill="none" stroke="#8eb7eb" stroke-width="3">
    <path d="M126 201C322 201 361 310 522 310"/>
    <path d="M1474 242C1286 242 1237 334 1082 334"/>
    <path d="M105 683C302 683 350 566 490 566"/>
    <path d="M1495 655C1307 655 1240 573 1098 573"/>
  </g>

  <g fill="#8fc5ff" opacity=".62">
    <circle cx="126" cy="201" r="8"/>
    <circle cx="1474" cy="242" r="8"/>
    <circle cx="105" cy="683" r="8"/>
    <circle cx="1495" cy="655" r="8"/>
  </g>

  <g opacity=".66">
    <path d="M414 273l29 24-23 32-31-25z" fill="#172f53" stroke="#73bfff" stroke-width="3"/>
    <path d="M1187 258l31 20-18 34-34-18z" fill="#172f53" stroke="#a58cff" stroke-width="3"/>
    <path d="M1189 610l29 25-25 31-31-25z" fill="#172f53" stroke="#6fe9cc" stroke-width="3"/>
    <path d="M401 591l32 18-17 35-35-20z" fill="#172f53" stroke="#788cff" stroke-width="3"/>
  </g>

  <circle cx="800" cy="440" r="136" fill="#36d8bd" opacity=".13" filter="url(#softGlow)"/>
  <g filter="url(#lineGlow)">
    <path d="M800 325c-48 0-87 39-87 87 0 31 16 58 41 74-51 17-88 56-98 107h288c-10-51-47-90-98-107 25-16 41-43 41-74 0-48-39-87-87-87z" fill="url(#token)" opacity=".95"/>
    <path d="M800 343c-38 0-69 31-69 69s31 69 69 69 69-31 69-69-31-69-69-69z" fill="#0b2440" opacity=".92"/>
    <path d="M800 367c25 0 45 20 45 45s-20 45-45 45-45-20-45-45 20-45 45-45z" fill="url(#token)"/>
  </g>

  <g fill="#d9fffa" filter="url(#lineGlow)">
    <circle cx="566" cy="440" r="7"/>
    <circle cx="1034" cy="440" r="7"/>
    <circle cx="800" cy="205" r="7"/>
    <circle cx="800" cy="675" r="7"/>
  </g>

  <g stroke="#ff789f" stroke-width="5" stroke-linecap="round" opacity=".78">
    <path d="M331 122l34 34m0-34l-34 34"/>
    <path d="M1290 712l34 34m0-34l-34 34"/>
    <path d="M1284 132l26 26m0-26l-26 26"/>
  </g>

  <path d="M104 794C330 741 474 823 683 786c248-44 393 57 813-24" fill="none" stroke="#6b91c6" stroke-opacity=".12" stroke-width="2"/>
</svg>
