<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cyber resilience reporting workflow</title>
  <desc id="desc">Abstract digital product forms pass through layered security gates into a luminous reporting channel surrounded by three timing arcs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162a"/>
      <stop offset="0.5" stop-color="#102c46"/>
      <stop offset="1" stop-color="#091b30"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fffe9" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#2ec4b6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2ec4b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29577a" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#81f4e1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#29577a" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b8fa7" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#5eead4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#b7f7ec" stop-opacity=".95"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#9fd8e3" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1070" cy="450" rx="520" ry="390" fill="url(#glow)" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M1370 221A392 392 0 0 1 1370 679" stroke="#4dd5c5" stroke-opacity=".24" stroke-width="18"/>
    <path d="M1321 264A330 330 0 0 1 1321 636" stroke="#70ead9" stroke-opacity=".42" stroke-width="12"/>
    <path d="M1270 310A263 263 0 0 1 1270 590" stroke="#b7fff3" stroke-opacity=".7" stroke-width="7"/>
    <circle cx="1360" cy="239" r="8" fill="#4dd5c5" stroke="none"/>
    <circle cx="1317" cy="625" r="7" fill="#70ead9" stroke="none"/>
    <circle cx="1266" cy="322" r="6" fill="#b7fff3" stroke="none"/>
  </g>

  <g opacity=".88">
    <path d="M83 323C302 323 378 390 553 390S735 365 875 403 1016 450 1155 450" fill="none" stroke="url(#flow)" stroke-width="7"/>
    <path d="M83 449C268 449 367 449 527 449S739 449 885 449 1021 450 1155 450" fill="none" stroke="url(#flow)" stroke-width="9"/>
    <path d="M83 576C295 576 382 510 552 510S740 535 878 495 1019 450 1155 450" fill="none" stroke="url(#flow)" stroke-width="7"/>
  </g>

  <g>
    <g transform="translate(115 258)">
      <rect width="150" height="128" rx="27" fill="#173b59" stroke="#6c9ab4" stroke-width="3"/>
      <circle cx="45" cy="43" r="18" fill="#8ec9d7" fill-opacity=".58"/>
      <path d="M27 91h96M69 43h54M27 68h96" stroke="#b8dce4" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(151 393)">
      <path d="M0 28Q0 0 28 0h98q28 0 28 28v78q0 28-28 28H28Q0 134 0 106Z" fill="#163751" stroke="#72a4bc" stroke-width="3"/>
      <rect x="30" y="32" width="94" height="70" rx="12" fill="#8ec9d7" fill-opacity=".23"/>
      <circle cx="77" cy="67" r="17" fill="#9edbe5" fill-opacity=".55"/>
    </g>
    <g transform="translate(110 548)">
      <path d="M28 0h107l28 28v98a22 22 0 0 1-22 22H28A28 28 0 0 1 0 120V28A28 28 0 0 1 28 0Z" fill="#173b59" stroke="#6c9ab4" stroke-width="3"/>
      <path d="M135 0v28h28M34 63h94M34 92h72" fill="none" stroke="#b8dce4" stroke-opacity=".58" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#softGlow)">
    <path d="M492 196v508" stroke="url(#gate)" stroke-width="18" stroke-linecap="round"/>
    <path d="M700 245v410" stroke="url(#gate)" stroke-width="14" stroke-linecap="round"/>
    <path d="M885 293v314" stroke="url(#gate)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g fill="#0c263d" stroke="#7de9da">
    <path d="M456 369l36-25 36 25v71c0 32-22 57-36 65-14-8-36-33-36-65Z" stroke-width="4"/>
    <path d="M669 383l31-21 31 21v61c0 27-19 49-31 56-12-7-31-29-31-56Z" stroke-width="3.5"/>
    <path d="M859 397l26-18 26 18v51c0 23-16 41-26 47-10-6-26-24-26-47Z" stroke-width="3"/>
  </g>

  <g transform="translate(1040 329)" filter="url(#softGlow)">
    <path d="M0 75 115 0l115 75v168L115 318 0 243Z" fill="#103b50" stroke="#a7fff1" stroke-width="6"/>
    <path d="M52 96h126M52 142h126M52 188h88" stroke="#8bf5e5" stroke-width="12" stroke-linecap="round" opacity=".78"/>
    <circle cx="174" cy="219" r="31" fill="#63e6d4" fill-opacity=".2" stroke="#c4fff7" stroke-width="5"/>
    <path d="m160 219 10 10 20-23" fill="none" stroke="#d7fff9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#aef9ed">
    <circle cx="1010" cy="450" r="6"/>
    <circle cx="960" cy="450" r="4" opacity=".7"/>
    <circle cx="930" cy="403" r="4" opacity=".55"/>
    <circle cx="930" cy="497" r="4" opacity=".55"/>
  </g>

  <path d="M80 755C387 718 588 783 825 745s465-26 695 0" fill="none" stroke="#63cdbf" stroke-opacity=".12" stroke-width="3"/>
</svg>
