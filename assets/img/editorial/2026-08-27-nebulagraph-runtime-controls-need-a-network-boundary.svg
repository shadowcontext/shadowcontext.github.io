<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Graph database runtime protected by layered network boundaries</title>
  <desc id="desc">An abstract editorial scene of a faceted graph database core enclosed by luminous boundary arcs, with loose configuration fragments held outside.</desc>
  <defs>
    <linearGradient id="background" x1="110" y1="70" x2="1490" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071323"/>
      <stop offset="0.5" stop-color="#102C45"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(800 455) rotate(90) scale(420 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C9BB5" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#2C9BB5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="610" y1="288" x2="970" y2="658" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61F2D4"/>
      <stop offset="0.48" stop-color="#24AFC4"/>
      <stop offset="1" stop-color="#3457A8"/>
    </linearGradient>
    <linearGradient id="boundary" x1="366" y1="160" x2="1236" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AFFF0"/>
      <stop offset="0.55" stop-color="#47C9DF"/>
      <stop offset="1" stop-color="#6586EE"/>
    </linearGradient>
    <linearGradient id="warning" x1="220" y1="275" x2="1370" y2="670" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCF78"/>
      <stop offset="1" stop-color="#EF765D"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#02060D" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="800" cy="455" rx="650" ry="420" fill="url(#aura)"/>
