<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified trust path around an OT engineering console</title>
  <desc id="desc">An abstract industrial engineering console sits inside layered blue protection arcs while amber network signals converge through a bright verified link.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121d"/>
      <stop offset="0.52" stop-color="#0b2330"/>
      <stop offset="1" stop-color="#102b35"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="49%" r="55%">
      <stop offset="0" stop-color="#34d5d1" stop-opacity="0.24"/>
      <stop offset="0.62" stop-color="#188da1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06101a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="console" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b5262"/>
      <stop offset="0.55" stop-color="#113542"/>
      <stop offset="1" stop-color="#071923"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78edf0" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#168ba4" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a842" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#f2a842"/>
      <stop offset="1" stop-color="#ffe0a0"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9af5ef"/>
      <stop offset="1" stop-color="#2eb7d4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <ellipse cx="800" cy="770" rx="500" ry="82" fill="#02080d" opacity="0.7" filter="url(#soft)"/>

  <g fill="none" stroke="#276d7b" stroke-width="2" opacity="0.32">
