      <stop offset="1" stop-color="#07121E"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(806 442) rotate(90) scale(380 530)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42D7C2" stop-opacity=".2"/>
      <stop offset="1" stop-color="#42D7C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="data" x1="150" y1="296" x2="846" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7486F4"/>
      <stop offset=".52" stop-color="#46BFD3"/>
      <stop offset="1" stop-color="#50E0BF"/>
    </linearGradient>
    <linearGradient id="channel" x1="700" y1="184" x2="968" y2="724" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B7892"/>
      <stop offset=".5" stop-color="#1B4055"/>
      <stop offset="1" stop-color="#0D2638"/>
    </linearGradient>
    <linearGradient id="boundary" x1="991" y1="191" x2="1021" y2="711" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4FFF4"/>
      <stop offset=".45" stop-color="#49E1C8"/>
      <stop offset="1" stop-color="#1595AF"/>
    </linearGradient>
    <linearGradient id="overflow" x1="1014" y1="310" x2="1455" y2="636" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F39A87"/>
      <stop offset=".48" stop-color="#D9698C"/>
      <stop offset="1" stop-color="#694C82"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
