<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Data constrained at a 32-bit software boundary</title>
  <desc id="desc">Abstract JSON-like data ribbons narrow through a constrained channel while a luminous boundary contains an overflowing wave.</desc>
  <defs>
