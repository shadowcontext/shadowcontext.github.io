<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hardware boundaries for AI-agent signing</title>
  <desc id="desc">An abstract metallic signing core holds a key-shaped light, surrounded by layered policy gates and a committed document token.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.5" stop-color="#102a43"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#4ee8d5" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#3b82f6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92fff1" stop-opacity=".64"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fff9"/>
      <stop offset=".25" stop-color="#75a7bd"/>
      <stop offset=".55" stop-color="#1a425d"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fffd"/>
      <stop offset="1" stop-color="#a9d8dd"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity=".7"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8bd8e8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="810" cy="440" rx="700" ry="430" fill="url(#aura)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M245 245C420 70 1160 70 1355 248" stroke="#61e6d6" stroke-opacity=".2" stroke-width="3"/>
    <path d="M184 344C360 145 1240 145 1416 344" stroke="url(#gate)" stroke-width="6"/>
    <path d="M158 460C310 270 1290 270 1442 460" stroke="url(#gate)" stroke-opacity=".72" stroke-width="8"/>
    <path d="M190 578C365 765 1235 765 1410 578" stroke="url(#gate)" stroke-opacity=".58" stroke-width="7"/>
    <path d="M260 675C450 835 1150 835 1340 675" stroke="#65a8ff" stroke-opacity=".18" stroke-width="3"/>
  </g>

  <g opacity=".9">
    <circle cx="247" cy="245" r="8" fill="#74f7e7"/>
    <circle cx="184" cy="344" r="10" fill="#74f7e7"/>
    <circle cx="158" cy="460" r="12" fill="#8feee7"/>
    <circle cx="1410" cy="578" r="10" fill="#6ca9ff"/>
    <circle cx="1340" cy="675" r="8" fill="#6ca9ff"/>
  </g>

  <g transform="translate(550 190)" filter="url(#shadow)">
    <path d="M122 38H378L468 128V430L378 520H122L32 430V128Z" fill="#0c2133" stroke="#91e9e1" stroke-opacity=".42" stroke-width="4"/>
    <path d="M154 91H346L411 156V402L346 467H154L89 402V156Z" fill="url(#metal)" stroke="#d1fffa" stroke-opacity=".65" stroke-width="3"/>
    <path d="M177 126H323L376 179V379L323 432H177L124 379V179Z" fill="#071523" stroke="#6ae4d8" stroke-opacity=".72" stroke-width="4"/>
    <g fill="#b8d8df" opacity=".8">
      <circle cx="138" cy="105" r="9"/><circle cx="362" cy="105" r="9"/>
      <circle cx="138" cy="453" r="9"/><circle cx="362" cy="453" r="9"/>
    </g>
    <circle cx="250" cy="276" r="94" fill="#0b2d3f" stroke="#73f4e3" stroke-width="4"/>
    <circle cx="250" cy="276" r="70" fill="#061521" stroke="#4e91c9" stroke-opacity=".8" stroke-width="3"/>
    <g filter="url(#glow)" fill="#8fffee">
      <circle cx="225" cy="250" r="25"/>
      <path d="M243 265l78 78 28-2 2-28-19-19-19 5-5-20-45-45Z"/>
    </g>
  </g>

  <g transform="translate(245 382) rotate(-7 145 105)" filter="url(#shadow)">
    <path d="M22 0H225L290 65V205H22Z" fill="url(#paper)" stroke="#d9fffb" stroke-width="3"/>
    <path d="M225 0v65h65" fill="#78a8bb"/>
    <path d="M66 64h112M66 96h150M66 128h126" stroke="#2f6175" stroke-width="10" stroke-linecap="round" opacity=".56"/>
    <circle cx="224" cy="157" r="38" fill="#0f5f72" stroke="#68f1df" stroke-width="4"/>
    <path d="M204 157l14 14 27-31" fill="none" stroke="#bafff4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1180 410)" opacity=".95">
    <path d="M0 0h116l58 58-58 58H0l-58-58Z" fill="#10344c" stroke="#70e9dc" stroke-width="3"/>
    <circle cx="58" cy="58" r="25" fill="none" stroke="#8affed" stroke-width="6"/>
    <circle cx="58" cy="58" r="7" fill="#8affed"/>
  </g>

  <g fill="#7df3e3">
    <circle cx="1030" cy="168" r="5"/><circle cx="1126" cy="244" r="4"/><circle cx="426" cy="715" r="5"/>
  </g>
</svg>
