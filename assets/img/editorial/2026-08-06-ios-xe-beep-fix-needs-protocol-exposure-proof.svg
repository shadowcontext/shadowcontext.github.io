<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protocol boundary preserving a network appliance pulse</title>
  <desc id="desc">An abstract blue network appliance carries an uninterrupted cyan pulse while a luminous boundary stops one malformed amber block from a stream of protocol shapes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="0.52" stop-color="#102c3d"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <radialGradient id="aura" cx="54%" cy="48%" r="56%">
      <stop offset="0" stop-color="#39d8d0" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#237fa7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#06131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="appliance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163f59"/>
      <stop offset="0.5" stop-color="#0b2638"/>
      <stop offset="1" stop-color="#071923"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2aa4cf" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#70f4e3"/>
      <stop offset="0.7" stop-color="#b5fff5"/>
      <stop offset="1" stop-color="#2aa4cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4fff9"/>
      <stop offset="0.5" stop-color="#4ce2d4"/>
      <stop offset="1" stop-color="#227ea5" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd26d"/>
      <stop offset="0.55" stop-color="#f99a48"/>
      <stop offset="1" stop-color="#dd533e"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#000913" flood-opacity="0.72"/>
    </filter>
    <pattern id="texture" width="96" height="96" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="18" r="1.2" fill="#d9ffff" opacity="0.07"/>
      <circle cx="74" cy="53" r="1" fill="#86cae5" opacity="0.06"/>
      <path d="M8 82 L22 82" stroke="#74bed3" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#texture)"/>
  <ellipse cx="835" cy="445" rx="700" ry="410" fill="url(#aura)"/>

  <g opacity="0.2" fill="none" stroke="#63b7cf" stroke-width="2">
    <path d="M65 172 C300 120 476 165 625 286"/>
    <path d="M32 732 C280 790 454 742 615 624"/>
    <path d="M965 152 C1165 88 1378 126 1542 246"/>
    <path d="M982 736 C1192 804 1390 760 1556 642"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M468 254 Q468 208 514 208 H1020 Q1066 208 1066 254 V646 Q1066 692 1020 692 H514 Q468 692 468 646 Z" fill="url(#appliance)" stroke="#2b7592" stroke-width="4"/>
    <path d="M504 278 Q504 246 536 246 H998 Q1030 246 1030 278 V622 Q1030 654 998 654 H536 Q504 654 504 622 Z" fill="none" stroke="#4bb6c8" stroke-opacity="0.32" stroke-width="3"/>
  </g>

  <g fill="#102f42" stroke="#60d7d5" stroke-width="3">
    <rect x="548" y="310" width="118" height="80" rx="18"/>
    <rect x="694" y="310" width="118" height="80" rx="18"/>
    <rect x="840" y="310" width="118" height="80" rx="18"/>
    <rect x="548" y="510" width="118" height="80" rx="18"/>
    <rect x="694" y="510" width="118" height="80" rx="18"/>
    <rect x="840" y="510" width="118" height="80" rx="18"/>
  </g>
  <g fill="#b9fff5">
    <circle cx="585" cy="350" r="9"/><circle cx="731" cy="350" r="9"/><circle cx="877" cy="350" r="9"/>
    <circle cx="585" cy="550" r="9"/><circle cx="731" cy="550" r="9"/><circle cx="877" cy="550" r="9"/>
  </g>

  <path d="M380 451 H555 L606 451 L644 397 L703 512 L755 451 H1110" fill="none" stroke="#123849" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M380 451 H555 L606 451 L644 397 L703 512 L755 451 H1110" fill="none" stroke="url(#pulse)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <path d="M1134 174 C1083 285 1094 361 1115 445 C1138 536 1114 623 1165 726" fill="none" stroke="#0a2130" stroke-width="74" stroke-linecap="round" opacity="0.88"/>
  <path d="M1134 174 C1083 285 1094 361 1115 445 C1138 536 1114 623 1165 726" fill="none" stroke="url(#barrier)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>

  <g transform="translate(1275 238) rotate(7)" fill="#17455a" stroke="#62dcd7" stroke-width="4" opacity="0.82">
    <rect x="0" y="0" width="106" height="106" rx="22"/>
    <rect x="142" y="0" width="106" height="106" rx="22"/>
  </g>
  <g transform="translate(1308 564) rotate(-5)" fill="#17455a" stroke="#62dcd7" stroke-width="4" opacity="0.72">
    <rect x="0" y="0" width="106" height="106" rx="22"/>
    <rect x="142" y="0" width="106" height="106" rx="22"/>
  </g>

  <g transform="translate(1226 390) rotate(12)" filter="url(#glow)">
    <path d="M0 14 Q0 0 16 0 H72 L98 26 H152 Q168 26 168 42 V130 Q168 146 152 146 H96 L66 118 H16 Q0 118 0 102 Z" fill="url(#amber)" stroke="#ffe1a0" stroke-width="5"/>
    <path d="M52 30 L112 112 M112 30 L52 112" stroke="#6d2830" stroke-width="13" stroke-linecap="round" opacity="0.62"/>
  </g>
  <path d="M1211 450 H1172" stroke="#ffd06d" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="1154" cy="450" r="20" fill="#d2fff8" stroke="#4be3d4" stroke-width="6" filter="url(#glow)"/>

  <g opacity="0.32" fill="#6ad8df">
    <circle cx="342" cy="451" r="8"/><circle cx="302" cy="451" r="5"/><circle cx="266" cy="451" r="3"/>
  </g>
</svg>
