<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded query boundary protecting membership records</title>
  <desc id="desc">An abstract editorial scene where flowing membership records pass through a luminous shield-like gateway before reaching a segmented database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172d"/>
      <stop offset="0.52" stop-color="#102f4b"/>
      <stop offset="1" stop-color="#07121f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="54%">
      <stop offset="0" stop-color="#44e0c1" stop-opacity=".27"/>
      <stop offset=".58" stop-color="#237ba4" stop-opacity=".1"/>
      <stop offset="1" stop-color="#07172d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
