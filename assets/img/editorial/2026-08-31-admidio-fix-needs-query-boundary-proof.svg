    <linearGradient id="record" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8da8d4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c5daf4" stop-opacity=".8"/>
