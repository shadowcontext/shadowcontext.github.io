<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contained TrueType glyph boundary</title>
  <desc id="desc">Abstract cyan glyph curves sit inside a layered security frame while a fractured amber contour is stopped at its outer boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="130" y1="80" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07172B"/>
      <stop offset="0.5" stop-color="#0A2340"/>
      <stop offset="1" stop-color="#10192D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(804 456) rotate(90) scale(410 590)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20D9E8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#20D9E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="460" y1="214" x2="1137" y2="698" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69F2EE"/>
      <stop offset="0.5" stop-color="#28BCD3"/>
      <stop offset="1" stop-color="#357AAE"/>
    </linearGradient>
    <linearGradient id="glyph" x1="600" y1="320" x2="995" y2="645" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9FFF7"/>
      <stop offset="0.52" stop-color="#43E5E2"/>
      <stop offset="1" stop-color="#2394C0"/>
    </linearGradient>
    <linearGradient id="amber" x1="1120" y1="330" x2="1335" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD479"/>
      <stop offset="1" stop-color="#F28B3D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1.2" fill="#B8E8F0" opacity="0.11"/>
      <circle cx="30" cy="25" r="0.8" fill="#B8E8F0" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <ellipse cx="802" cy="745" rx="500" ry="78" fill="#020B17" opacity="0.48" filter="url(#soft)"/>
  <path d="M86 642C278 556 313 277 501 183" fill="none" stroke="#183A59" stroke-width="2"/>
  <path d="M1514 264C1348 336 1303 642 1118 730" fill="none" stroke="#183A59" stroke-width="2"/>
  <g opacity="0.52">
    <circle cx="247" cy="209" r="5" fill="#39C8DB"/>
    <circle cx="1375" cy="678" r="5" fill="#39C8DB"/>
    <circle cx="1284" cy="164" r="3" fill="#69F2EE"/>
    <circle cx="323" cy="746" r="3" fill="#69F2EE"/>
  </g>
  <rect x="397" y="154" width="806" height="592" rx="104" fill="#081B31" stroke="#1A4D6D" stroke-width="2"/>
  <rect x="426" y="181" width="748" height="538" rx="83" fill="#0B2941" stroke="#24647E" stroke-width="3" opacity="0.92"/>
  <rect x="459" y="213" width="682" height="474" rx="62" fill="#071D33" stroke="url(#frame)" stroke-width="7"/>
  <rect x="481" y="235" width="638" height="430" rx="48" fill="url(#grain)" stroke="#1D718D" stroke-width="2" stroke-dasharray="4 14"/>
  <path d="M561 612C616 492 630 357 736 296C808 255 907 281 950 353C983 408 964 466 915 502C875 532 820 532 777 507C749 491 724 463 706 433" fill="none" stroke="url(#glyph)" stroke-width="34" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M609 601C665 532 721 491 782 474C860 453 939 476 1001 548" fill="none" stroke="#79F5EE" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <path d="M697 579C738 554 784 542 827 543C874 544 914 560 949 592" fill="none" stroke="#173F59" stroke-width="14" stroke-linecap="round"/>
  <circle cx="706" cy="433" r="12" fill="#D4FFFA"/>
  <circle cx="950" cy="353" r="12" fill="#D4FFFA"/>
  <circle cx="609" cy="601" r="10" fill="#52E7E5"/>
  <path d="M1139 358C1184 325 1231 316 1280 333C1323 348 1350 379 1360 422" fill="none" stroke="url(#amber)" stroke-width="22" stroke-linecap="round"/>
  <path d="M1361 478C1353 528 1327 567 1283 591C1242 614 1194 611 1153 590" fill="none" stroke="url(#amber)" stroke-width="22" stroke-linecap="round" opacity="0.8"/>
  <path d="M1137 422L1188 447L1140 473" fill="none" stroke="#FFD479" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#F7B45A">
    <path d="M1210 435l17 9-15 13-15-10z"/>
    <path d="M1260 456l14 15-19 8-11-17z" opacity="0.8"/>
    <path d="M1307 436l12 10-10 15-14-8z" opacity="0.55"/>
  </g>
  <rect x="1128" y="298" width="25" height="305" rx="12" fill="#63EFE9" opacity="0.18"/>
  <rect x="1135" y="320" width="10" height="261" rx="5" fill="#A6FFF7" filter="url(#glow)"/>
  <path d="M510 696H1090" stroke="#39BFD0" stroke-width="2" opacity="0.36"/>
</svg>
