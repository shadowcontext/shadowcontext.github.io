<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected cellular control plane safely diverts a malformed signal</title>
  <desc id="desc">Abstract editorial artwork with cellular nodes surrounding a luminous protected core while an irregular incoming signal is diverted into a calm error path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141f"/>
      <stop offset="0.55" stop-color="#10283a"/>
      <stop offset="1" stop-color="#0d1d2d"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ecfff5"/>
      <stop offset="0.28" stop-color="#7ef0cb"/>
      <stop offset="0.7" stop-color="#24afac"/>
      <stop offset="1" stop-color="#17627f"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#ffdf9d"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dffe5"/>
      <stop offset="1" stop-color="#3bd4cf" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
