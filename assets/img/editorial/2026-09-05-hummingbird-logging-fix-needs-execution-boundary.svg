    <circle cx="74" cy="39" r="9" fill="#594c91"/>
    <g fill="none" stroke="#a58de8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M102 153 62 190l40 37"/>
      <path d="m178 153 40 37-40 37"/>
      <path d="m158 129-36 122"/>
    </g>
    <g fill="#6958a0" opacity="0.75">
      <rect x="52" y="292" width="176" height="14" rx="7"/>
      <rect x="52" y="329" width="132" height="14" rx="7"/>
      <rect x="52" y="366" width="154" height="14" rx="7"/>
    </g>
  </g>
  <path d="M1123 450h44" stroke="#ff6a73" stroke-width="12" stroke-linecap="round"/>
  <path d="m1137 429 28 21-28 21" fill="none" stroke="#ff6a73" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1141" cy="450" r="45" fill="none" stroke="#ff6a73" stroke-width="5" opacity="0.35"/>
