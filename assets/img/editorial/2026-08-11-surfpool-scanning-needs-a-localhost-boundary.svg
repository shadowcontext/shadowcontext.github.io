<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local RPC core protected from incoming scan waves</title>
  <desc id="desc">Abstract ocean-like network waves approach a luminous RPC core enclosed by layered localhost and proxy boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="0.52" stop-color="#0b2942"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#d8fff6"/>
      <stop offset="0.32" stop-color="#5ee6cf"/>
      <stop offset="0.74" stop-color="#1686a5"/>
      <stop offset="1" stop-color="#0c3b65"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#276595" stop-opacity="0.08"/>
      <stop offset="0.58" stop-color="#42b9d0" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#76f0dc" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#78b7ce" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1080" cy="450" rx="360" ry="310" fill="#26a9bd" opacity="0.08" filter="url(#soft)"/>

  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M-80 236C180 118 334 345 570 229S844 102 998 224" stroke-width="24"/>
    <path d="M-110 354C130 238 342 462 586 346S854 238 1018 348" stroke-width="17"/>
    <path d="M-90 476C172 340 352 596 602 466S856 361 1018 468" stroke-width="28"/>
    <path d="M-70 606C180 476 352 714 594 594S850 488 1010 590" stroke-width="14"/>
    <path d="M-120 724C136 600 340 826 574 714S838 602 992 708" stroke-width="22"/>
  </g>

  <g opacity="0.65" fill="#66d9dd">
    <circle cx="178" cy="180" r="6"/><circle cx="298" cy="304" r="4"/><circle cx="432" cy="210" r="7"/>
    <circle cx="142" cy="520" r="5"/><circle cx="360" cy="650" r="6"/><circle cx="532" cy="404" r="4"/>
  </g>
  <g fill="none" stroke="#69d6dc" stroke-opacity="0.28" stroke-width="2">
    <path d="M178 180L298 304 432 210 532 404 360 650 142 520Z"/>
  </g>

  <g transform="translate(1090 450)">
    <path d="M0-320C190-292 298-203 320 0 297 205 190 294 0 330-190 294-297 205-320 0-297-203-190-292 0-320Z" fill="#071c30" stroke="#2d91ae" stroke-width="6"/>
    <path d="M0-258C146-238 238-154 256 0 238 154 146 238 0 266-146 238-238 154-256 0-238-154-146-238 0-258Z" fill="#0a2940" stroke="#54c9cf" stroke-opacity="0.72" stroke-width="4"/>
    <path d="M0-194C106-178 169-113 184 0 169 113 106 178 0 198-106 178-169 113-184 0-169-113-106-178 0-194Z" fill="#0c3550" stroke="#83eadb" stroke-opacity="0.82" stroke-width="3"/>
    <circle r="98" fill="url(#core)" filter="url(#glow)"/>
    <circle r="43" fill="#06263b" stroke="#d7fff5" stroke-width="5"/>
    <circle r="12" fill="#e6fff8"/>
    <g fill="#8ce9dc">
      <circle cx="0" cy="-144" r="8"/><circle cx="125" cy="-72" r="8"/><circle cx="125" cy="72" r="8"/>
      <circle cx="0" cy="144" r="8"/><circle cx="-125" cy="72" r="8"/><circle cx="-125" cy="-72" r="8"/>
    </g>
    <g stroke="#7be1d7" stroke-opacity="0.68" stroke-width="3">
      <path d="M0-98V-136M85-49l33-19M85 49l33 19M0 98v38M-85 49l-33 19M-85-49l-33-19"/>
    </g>
  </g>

  <g fill="#ffbf69" filter="url(#glow)">
    <circle cx="754" cy="250" r="6"/><circle cx="792" cy="448" r="7"/><circle cx="742" cy="660" r="5"/>
  </g>
  <g fill="none" stroke="#ffbf69" stroke-opacity="0.38" stroke-width="3">
    <path d="M640 250H754l54 52"/><path d="M650 448h142"/><path d="M630 660h112l66-62"/>
  </g>
</svg>
