<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two security operations beacons under contrasting signal conditions</title>
  <desc id="desc">An abstract editorial scene shows one beacon obscured by noisy amber signals while a second focuses clear cyan signals through layered protective forms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="0.52" stop-color="#0b2230"/>
      <stop offset="1" stop-color="#081019"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#62f3e8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#26c9db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffbd66" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff784f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be7ef" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1f8193" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="blur32" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00050a" flood-opacity="0.7"/>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="11" r="1" fill="#d7fbff" opacity="0.07"/>
      <circle cx="39" cy="21" r="1.2" fill="#d7fbff" opacity="0.05"/>
      <circle cx="22" cy="50" r="0.8" fill="#d7fbff" opacity="0.06"/>
      <circle cx="57" cy="44" r="0.9" fill="#d7fbff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="1185" cy="396" rx="350" ry="330" fill="url(#cyanGlow)" filter="url(#blur32)" opacity="0.7"/>
  <ellipse cx="410" cy="425" rx="360" ry="320" fill="url(#amberGlow)" filter="url(#blur32)" opacity="0.65"/>

