  <g fill="#86f1d9" opacity="0.85">
    <circle cx="262" cy="450" r="7"/><circle cx="1338" cy="450" r="7"/>
    <circle cx="371" cy="240" r="6"/><circle cx="1229" cy="660" r="6"/>
  </g>
</svg>
