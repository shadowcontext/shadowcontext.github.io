    <path d="M18 69 42 29h105l31 40 17 7v32H0V78Z" fill="#0d4251"/>
    <circle cx="43" cy="111" r="20" fill="#10283c"/><circle cx="151" cy="111" r="20" fill="#10283c"/>
    <path d="M55 43h77l18 26H39Z" fill="#173e50"/>
  </g>
  <g transform="translate(1055 554)" stroke="url(#teal)" stroke-width="7">
