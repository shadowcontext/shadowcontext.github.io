    <circle cx="64" cy="50" r="23" fill="#10283c"/>
    <path d="M31 100v18M97 100v18"/>
  </g>

  <g fill="none" stroke="url(#amber)" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
    <path d="M86 254h124l58 54"/>
    <path d="M1510 235h-123l-59 62"/>
    <path d="M78 680h130l70-50"/>
    <path d="M1517 690h-135l-72-51"/>
  </g>
  <g fill="#ffc15c">
