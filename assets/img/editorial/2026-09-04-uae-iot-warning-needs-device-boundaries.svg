    <path d="m63 118 27 28 58-66" fill="none" stroke="#89f6d9" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(445 284)" stroke="url(#teal)" stroke-width="7">
