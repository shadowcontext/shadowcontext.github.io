<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Connected devices protected by layered network boundaries</title>
  <desc id="desc">Abstract cameras, sensors and a connected vehicle sit inside luminous teal security rings while amber threat signals stop at the outer boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d2b"/>
      <stop offset="0.52" stop-color="#0b3140"/>
      <stop offset="1" stop-color="#10263c"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#40e0c0" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#159d9c" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071d2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7bf1d4"/>
      <stop offset="1" stop-color="#1aa6b5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ffc15c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#6fe4d1" opacity="0.13"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="800" cy="445" rx="620" ry="390" fill="url(#core)"/>

  <g fill="none" stroke-linecap="round">
    <ellipse cx="800" cy="450" rx="540" ry="310" stroke="#40d9c4" stroke-width="3" opacity="0.18"/>
    <ellipse cx="800" cy="450" rx="430" ry="245" stroke="#64ead2" stroke-width="5" opacity="0.34" stroke-dasharray="8 18"/>
    <ellipse cx="800" cy="450" rx="310" ry="175" stroke="url(#teal)" stroke-width="10" opacity="0.82"/>
  </g>

  <g stroke="#57ddca" stroke-width="4" opacity="0.55">
    <path d="M554 343 688 413M1045 339 914 411M520 570 682 493M1082 575 920 496"/>
    <path d="M800 277V360M800 540V628"/>
  </g>
  <g fill="#83f3dc" filter="url(#glow)">
    <circle cx="688" cy="413" r="9"/><circle cx="914" cy="411" r="9"/>
    <circle cx="682" cy="493" r="9"/><circle cx="920" cy="496" r="9"/>
    <circle cx="800" cy="360" r="9"/><circle cx="800" cy="540" r="9"/>
  </g>

  <g transform="translate(696 366)">
