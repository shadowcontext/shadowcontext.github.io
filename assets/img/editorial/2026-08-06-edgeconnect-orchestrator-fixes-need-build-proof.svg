<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified SD-WAN management plane above protected network routes</title>
  <desc id="desc">An abstract luminous control hub enclosed by a verification ring, distributing orderly paths to layered branch nodes across a dark blue network landscape.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102b45"/>
      <stop offset="1" stop-color="#071b2c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="58%">
      <stop offset="0" stop-color="#4de5c1" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#31a8d5" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#081525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43aee0" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#63e6c5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#43aee0" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5fff0"/>
      <stop offset="0.3" stop-color="#4ce1bf"/>
      <stop offset="1" stop-color="#178bad"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4dcff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#35b9cf" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="microgrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#79cde5" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#microgrid)"/>
  <ellipse cx="800" cy="384" rx="650" ry="430" fill="url(#halo)"/>

  <path d="M0 745C245 660 395 710 605 650S1015 575 1600 695V900H0Z" fill="#071421" opacity="0.72"/>
  <path d="M0 798C260 720 470 770 702 706S1120 648 1600 760" fill="none" stroke="#45a9ca" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M0 834C330 758 515 820 796 760S1195 704 1600 810" fill="none" stroke="#50ddbf" stroke-opacity="0.08" stroke-width="2"/>

  <g fill="none" stroke="url(#route)" stroke-linecap="round">
    <path d="M800 410C800 520 386 500 256 692" stroke-width="7"/>
    <path d="M800 410C800 542 570 548 532 738" stroke-width="5"/>
    <path d="M800 410C800 540 800 616 800 765" stroke-width="8"/>
    <path d="M800 410C800 542 1030 548 1068 738" stroke-width="5"/>
    <path d="M800 410C800 520 1214 500 1344 692" stroke-width="7"/>
  </g>

  <g opacity="0.9">
    <path d="M212 682l44-25 44 25v50l-44 25-44-25z" fill="url(#glass)" stroke="#65d6e5" stroke-opacity="0.62" stroke-width="2"/>
    <path d="M488 728l44-25 44 25v50l-44 25-44-25z" fill="url(#glass)" stroke="#65d6e5" stroke-opacity="0.62" stroke-width="2"/>
    <path d="M756 755l44-25 44 25v50l-44 25-44-25z" fill="url(#glass)" stroke="#65e6c7" stroke-opacity="0.72" stroke-width="2"/>
    <path d="M1024 728l44-25 44 25v50l-44 25-44-25z" fill="url(#glass)" stroke="#65d6e5" stroke-opacity="0.62" stroke-width="2"/>
    <path d="M1300 682l44-25 44 25v50l-44 25-44-25z" fill="url(#glass)" stroke="#65d6e5" stroke-opacity="0.62" stroke-width="2"/>
  </g>

  <g fill="#7ff0d2" filter="url(#smallGlow)">
    <circle cx="256" cy="707" r="8"/>
    <circle cx="532" cy="753" r="8"/>
    <circle cx="800" cy="780" r="9"/>
    <circle cx="1068" cy="753" r="8"/>
    <circle cx="1344" cy="707" r="8"/>
  </g>

  <g transform="translate(800 324)">
    <circle r="182" fill="#0a2034" fill-opacity="0.56" stroke="#5ddfc6" stroke-opacity="0.12" stroke-width="2"/>
    <circle r="148" fill="none" stroke="#66e8ca" stroke-opacity="0.26" stroke-width="18"/>
    <path d="M-74 119A140 140 0 1 1 111 85" fill="none" stroke="#72f0d2" stroke-width="18" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M111 85l-4-42 42 19z" fill="#72f0d2" filter="url(#smallGlow)"/>
    <path d="M-106-70L0-130 106-70V54L0 114-106 54Z" fill="url(#glass)" stroke="#9ef5e1" stroke-opacity="0.8" stroke-width="3"/>
    <path d="M-55-34L0-66 55-34V31L0 63-55 31Z" fill="url(#hub)" opacity="0.96" filter="url(#smallGlow)"/>
    <path d="M-22 0l15 16 34-39" fill="none" stroke="#06283a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#70e4ca" opacity="0.7">
    <circle cx="800" cy="512" r="5"/>
    <circle cx="608" cy="546" r="4"/>
    <circle cx="992" cy="546" r="4"/>
    <circle cx="433" cy="585" r="3"/>
    <circle cx="1167" cy="585" r="3"/>
  </g>
</svg>
