<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity namespaces held behind a privilege boundary</title>
  <desc id="desc">Abstract cyan identity rings cross a guarded boundary while an amber token is diverted away from a raised privilege core.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081428"/>
      <stop offset="0.5" stop-color="#102d46"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <radialGradient id="aura" cx="59%" cy="49%" r="55%">
      <stop offset="0" stop-color="#40e4d1" stop-opacity=".3"/>
      <stop offset="0.55" stop-color="#2788c2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#071321" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2fff7"/>
      <stop offset="0.42" stop-color="#55e1d1"/>
      <stop offset="1" stop-color="#287ec2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8067"/>
      <stop offset="1" stop-color="#ffc76e"/>
    </linearGradient>
    <pattern id="mesh" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8cdfe3" stroke-width="1" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <ellipse cx="925" cy="445" rx="610" ry="385" fill="url(#aura)"/>

  <g fill="none" stroke="url(#cyan)" filter="url(#glow)">
    <circle cx="355" cy="330" r="118" stroke-width="17" opacity=".78"/>
    <circle cx="355" cy="330" r="62" stroke-width="11" opacity=".92"/>
    <circle cx="355" cy="594" r="94" stroke-width="15" opacity=".62"/>
    <circle cx="355" cy="594" r="45" stroke-width="10" opacity=".88"/>
  </g>
  <g fill="#b9fff1">
    <circle cx="355" cy="330" r="13"/>
    <circle cx="355" cy="594" r="11"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M473 330C600 330 637 393 760 393" stroke="#55ded2" stroke-width="14" opacity=".78"/>
    <path d="M449 594C588 594 641 507 760 507" stroke="#338fc4" stroke-width="12" opacity=".7"/>
    <path d="M474 330C594 330 628 454 760 454" stroke="url(#amber)" stroke-width="12" opacity=".92"/>
  </g>
  <g fill="#94f5e6" filter="url(#glow)">
    <circle cx="570" cy="351" r="8"/>
    <circle cx="616" cy="557" r="8"/>
  </g>
  <circle cx="622" cy="400" r="13" fill="#ffb86b" filter="url(#glow)"/>

  <rect x="755" y="128" width="34" height="645" rx="17" fill="url(#cyan)" filter="url(#glow)"/>
  <rect x="720" y="365" width="104" height="176" rx="52" fill="#49d8ca" opacity=".16" filter="url(#soft)"/>
  <path d="M731 420L694 454L731 488Z" fill="#ffc36f" filter="url(#glow)"/>
  <path d="M694 454C629 454 591 485 551 527" fill="none" stroke="url(#amber)" stroke-width="11" stroke-linecap="round"/>

  <g transform="translate(1064 451)">
    <circle r="202" fill="#35d9c3" opacity=".13" filter="url(#soft)"/>
    <circle r="171" fill="none" stroke="url(#cyan)" stroke-width="18" opacity=".52" filter="url(#glow)"/>
    <circle r="118" fill="#0a253b" stroke="#5be5d4" stroke-width="16"/>
    <circle r="61" fill="url(#cyan)" filter="url(#glow)"/>
    <path d="M-20 0L-2 18L31-24" fill="none" stroke="#09243a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="#58d9d0" stroke-width="6" stroke-linecap="round" opacity=".6">
    <path d="M1235 371C1370 371 1416 307 1556 307"/>
    <path d="M1247 451H1565"/>
    <path d="M1235 531C1370 531 1416 595 1556 595"/>
  </g>
  <g fill="#a8f7eb">
    <circle cx="1350" cy="371" r="8"/>
    <circle cx="1428" cy="451" r="10"/>
    <circle cx="1350" cy="531" r="8"/>
  </g>

  <path d="M805 177C929 96 1120 78 1285 141" fill="none" stroke="#68dcd5" stroke-width="3" stroke-opacity=".28"/>
  <path d="M805 724C953 813 1151 820 1321 741" fill="none" stroke="#3b8fbe" stroke-width="3" stroke-opacity=".3"/>
</svg>
