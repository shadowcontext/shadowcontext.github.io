<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded transition from email to a phone call</title>
  <desc id="desc">An abstract email envelope opens toward a luminous phone receiver as a protective ring interrupts deceptive paths crossing between communication channels.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="0.52" stop-color="#142a46"/>
      <stop offset="1" stop-color="#080f1d"/>
    </linearGradient>
    <radialGradient id="focus" cx="56%" cy="49%" r="48%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".22"/>
      <stop offset=".48" stop-color="#818cf8" stop-opacity=".1"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7ff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="receiver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset=".46" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="9" r="1.2" fill="#e0f2fe" opacity=".08"/>
      <circle cx="42" cy="30" r="1" fill="#fde68a" opacity=".06"/>
      <circle cx="20" cy="53" r=".8" fill="#c4b5fd" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#focus)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="805" cy="766" rx="620" ry="76" fill="#020617" opacity=".55" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M88 255C323 163 468 252 625 378S905 615 1198 486s279-51 354 12" stroke="#38bdf8" stroke-width="8" opacity=".14"/>
    <path d="M72 620c224 82 382-7 515-124s316-193 501-64 317 155 469 72" stroke="#fb7185" stroke-width="7" opacity=".13"/>
    <path d="M107 447c170-31 287-4 409 66" stroke="#94a3b8" stroke-width="5" stroke-dasharray="12 22" opacity=".3"/>
    <path d="M1090 526c150 82 269 87 421 39" stroke="#94a3b8" stroke-width="5" stroke-dasharray="12 22" opacity=".3"/>
  </g>

  <g transform="translate(192 286) rotate(-5 260 180)">
    <rect x="0" y="0" width="520" height="360" rx="42" fill="#0c2540" stroke="#7dd3fc" stroke-width="7"/>
    <path d="M18 45l242 181L502 45" fill="#112f4d" stroke="url(#mail)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M18 325l185-152M502 325L317 173" fill="none" stroke="#bae6fd" stroke-width="7" opacity=".75"/>
    <path d="M20 327l181-151c35-30 82-30 118 0l181 151" fill="#173b59" stroke="#7dd3fc" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="434" cy="82" r="20" fill="#fbbf24" opacity=".9" filter="url(#glow)"/>
  </g>

  <path d="M696 461c91-49 165-51 246-10" fill="none" stroke="#fbbf24" stroke-width="24" stroke-linecap="round" opacity=".7" filter="url(#glow)"/>
  <path d="M702 461c89-43 155-44 232-8" fill="none" stroke="#fff7d6" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(755 223)">
    <circle cx="246" cy="228" r="177" fill="#081827" stroke="url(#shield)" stroke-width="15" opacity=".98"/>
    <circle cx="246" cy="228" r="137" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="6 17" opacity=".65"/>
    <path d="M246 83c60 27 104 32 104 32v91c0 89-42 143-104 176-62-33-104-87-104-176v-91s44-5 104-32z" fill="#122d48" stroke="url(#shield)" stroke-width="8"/>
    <path d="M216 208l24 25 50-58" fill="none" stroke="#a5f3fc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1090 270) rotate(9 155 190)">
    <path d="M94 24c-34 8-65 55-69 105-7 83 39 174 113 245 75 72 166 113 247 101 49-7 94-41 99-76 3-18-7-35-24-43l-88-43c-20-10-44-4-57 14l-35 50c-55-20-120-78-149-131l44-42c16-15 19-40 7-59l-51-83C123 48 110 20 94 24z" fill="#111f35" stroke="url(#receiver)" stroke-width="13" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M78 74c24 83 77 165 145 231 67 64 143 105 220 121" fill="none" stroke="#fde68a" stroke-width="7" opacity=".55"/>
  </g>

  <g fill="#fb7185" opacity=".9">
    <circle cx="118" cy="448" r="8"/><circle cx="151" cy="441" r="5"/><circle cx="182" cy="438" r="4"/>
    <circle cx="1467" cy="563" r="8"/><circle cx="1434" cy="570" r="5"/><circle cx="1403" cy="573" r="4"/>
  </g>
  <g fill="none" stroke="#fb7185" stroke-width="9" stroke-linecap="round" opacity=".76">
    <path d="M707 305l43 43M750 305l-43 43"/>
    <path d="M1049 607l43 43M1092 607l-43 43"/>
  </g>
  <g fill="#fef3c7" filter="url(#glow)">
    <circle cx="748" cy="463" r="5"/><circle cx="802" cy="442" r="7"/><circle cx="861" cy="437" r="5"/>
  </g>
</svg>
