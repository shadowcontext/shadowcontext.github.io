<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Equalized password-recovery responses</title>
  <desc id="desc">An abstract password-recovery portal sends identical blue response ribbons for two different identity tokens within a layered protective boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="0.52" stop-color="#102b4d"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(800 430) rotate(90) scale(390 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2cc7d9" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#2cc7d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="544" y1="234" x2="1053" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9fbff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#74c7df" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="384" y1="0" x2="1212" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42d8cf"/>
      <stop offset="0.52" stop-color="#62b9ff"/>
      <stop offset="1" stop-color="#6b8cff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffce6a"/>
      <stop offset="1" stop-color="#e98453"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#020914" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="11" r="1" fill="#b8eff7" opacity="0.14"/>
      <circle cx="39" cy="27" r="1.2" fill="#8ab7ff" opacity="0.10"/>
      <circle cx="22" cy="54" r="0.8" fill="#ffffff" opacity="0.11"/>
      <circle cx="58" cy="49" r="0.7" fill="#59d8d0" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <path d="M132 208C344 88 544 118 697 196" fill="none" stroke="#4f86b5" stroke-opacity="0.24" stroke-width="2"/>
  <path d="M1468 690C1258 812 1068 790 920 718" fill="none" stroke="#49d2cd" stroke-opacity="0.20" stroke-width="2"/>
  <circle cx="1278" cy="188" r="104" fill="none" stroke="#7aa8ff" stroke-opacity="0.12" stroke-width="22"/>
  <circle cx="280" cy="712" r="136" fill="none" stroke="#2ed5c7" stroke-opacity="0.10" stroke-width="28"/>

  <g filter="url(#shadow)">
    <path d="M800 145L1100 264V466C1100 647 981 753 800 808C619 753 500 647 500 466V264L800 145Z" fill="#0b223c" stroke="#54d3d0" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M800 187L1058 289V463C1058 611 965 703 800 760C635 703 542 611 542 463V289L800 187Z" fill="url(#glass)" stroke="#8aeaf0" stroke-opacity="0.28" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="282" width="360" height="324" rx="48" fill="#0a1a31" stroke="#83dfe8" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="649" y="311" width="302" height="266" rx="34" fill="#102b48" stroke="#a7f2f3" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="800" cy="402" r="54" fill="#09192c" stroke="#5ed9df" stroke-width="12"/>
    <path d="M800 390A24 24 0 0 1 824 414V437H776V414A24 24 0 0 1 800 390Z" fill="#65ccef"/>
    <rect x="766" y="428" width="68" height="62" rx="16" fill="#65ccef"/>
    <circle cx="800" cy="455" r="8" fill="#0d2845"/>
    <path d="M800 462V476" stroke="#0d2845" stroke-width="7" stroke-linecap="round"/>
    <circle cx="702" cy="542" r="7" fill="#52d5cd"/>
    <rect x="723" y="535" width="154" height="14" rx="7" fill="#75b6ce" opacity="0.48"/>
  </g>

  <g filter="url(#glow)">
    <path d="M344 355C451 355 520 355 620 355" fill="none" stroke="url(#ribbon)" stroke-width="20" stroke-linecap="round"/>
    <path d="M344 535C451 535 520 535 620 535" fill="none" stroke="url(#ribbon)" stroke-width="20" stroke-linecap="round"/>
    <path d="M980 355C1080 355 1149 355 1256 355" fill="none" stroke="url(#ribbon)" stroke-width="20" stroke-linecap="round"/>
    <path d="M980 535C1080 535 1149 535 1256 535" fill="none" stroke="url(#ribbon)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="286" cy="355" r="62" fill="#112e4d" stroke="#5fe0d9" stroke-width="4"/>
    <circle cx="286" cy="337" r="18" fill="#80e8de"/>
    <path d="M250 390C255 359 317 359 322 390" fill="#80e8de"/>
    <circle cx="286" cy="535" r="62" fill="#2c2944" stroke="url(#amber)" stroke-width="4"/>
    <path d="M268 517L304 553M304 517L268 553" stroke="#ffbc68" stroke-width="15" stroke-linecap="round"/>
  </g>

  <g opacity="0.86">
    <circle cx="1314" cy="355" r="18" fill="#6bafff"/>
    <circle cx="1314" cy="535" r="18" fill="#6bafff"/>
    <circle cx="1360" cy="355" r="7" fill="#60d8d3"/>
    <circle cx="1360" cy="535" r="7" fill="#60d8d3"/>
  </g>

  <path d="M1212 243L1244 258L1212 273L1180 258L1212 243Z" fill="#ffbd64" opacity="0.85"/>
  <path d="M386 672L416 686L386 700L356 686L386 672Z" fill="#5bd7d4" opacity="0.72"/>
</svg>
