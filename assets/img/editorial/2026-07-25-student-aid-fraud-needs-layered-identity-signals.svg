<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered identity signals guarding a financial stream</title>
  <desc id="desc">An abstract editorial illustration of a human profile assembled from translucent verification frames above a protected stream of financial tokens.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.5" stop-color="#102a42"/>
      <stop offset="1" stop-color="#091420"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#37e5c2" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#2c87c9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07192b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70f2d0"/>
      <stop offset="1" stop-color="#3ba4e8"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#305a82" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#39d7bf" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#4ba9e5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#305a82" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="800" cy="390" rx="610" ry="420" fill="url(#halo)"/>
  <path d="M0 690 C260 620 390 770 650 698 S1070 622 1600 724 V900 H0Z" fill="#08111d" opacity="0.82"/>

  <g opacity="0.3" fill="none" stroke="#5db5d8">
    <path d="M90 210 C300 90 445 140 570 240" stroke-width="2"/>
    <path d="M1040 150 C1230 100 1400 200 1510 350" stroke-width="2"/>
    <circle cx="178" cy="176" r="5" fill="#6ce6d1" stroke="none"/>
    <circle cx="1450" cy="297" r="5" fill="#6ce6d1" stroke="none"/>
  </g>

  <g transform="translate(800 382)">
    <rect x="-306" y="-244" width="430" height="488" rx="42" fill="#0d2e43" fill-opacity="0.48" stroke="#3a7597" stroke-width="3" transform="rotate(-8)"/>
    <rect x="-192" y="-244" width="430" height="488" rx="42" fill="#12364c" fill-opacity="0.42" stroke="#4299bd" stroke-width="3" transform="rotate(7)"/>
    <rect x="-215" y="-248" width="430" height="496" rx="46" fill="#0b2336" fill-opacity="0.72" stroke="url(#frame)" stroke-width="6"/>

    <g fill="none" stroke-linecap="round">
      <circle cx="0" cy="-62" r="74" stroke="#8ff7dd" stroke-width="18" opacity="0.88"/>
      <path d="M-126 142 C-112 54 -62 10 0 10 C62 10 112 54 126 142" stroke="#63cfe1" stroke-width="22" opacity="0.9"/>
      <path d="M-126 142 H126" stroke="#63cfe1" stroke-width="22" opacity="0.9"/>
    </g>

    <g fill="#75eed3" filter="url(#glow)">
      <circle cx="-174" cy="-194" r="8"/>
      <circle cx="174" cy="-194" r="8"/>
      <circle cx="-174" cy="194" r="8"/>
      <circle cx="174" cy="194" r="8"/>
    </g>

    <g stroke="#8fe9d8" stroke-width="5" fill="none" opacity="0.8">
      <path d="M-180 -152 h38 v-38"/>
      <path d="M180 -152 h-38 v-38"/>
      <path d="M-180 152 h38 v38"/>
      <path d="M180 152 h-38 v38"/>
    </g>
  </g>

  <path d="M205 700 C400 630 548 745 724 696 C900 648 1050 635 1395 710" fill="none" stroke="url(#stream)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>

  <g fill="#183d55" stroke="#55d8c7" stroke-width="4">
    <circle cx="333" cy="666" r="32"/>
    <circle cx="520" cy="707" r="25"/>
    <circle cx="689" cy="702" r="34"/>
    <circle cx="914" cy="670" r="29"/>
    <circle cx="1118" cy="681" r="35"/>
    <circle cx="1300" cy="709" r="26"/>
  </g>
  <g fill="none" stroke="#81edd7" stroke-width="4" opacity="0.9">
    <path d="M321 666 h24 M333 654 v24"/>
    <path d="M510 707 h20"/>
    <path d="M677 702 h24 M689 690 v24"/>
    <path d="M903 670 h22"/>
    <path d="M1106 681 h24 M1118 669 v24"/>
    <path d="M1290 709 h20"/>
  </g>

  <g opacity="0.6">
    <ellipse cx="612" cy="755" rx="110" ry="24" fill="#35d6bd" filter="url(#soft)"/>
    <ellipse cx="1020" cy="740" rx="125" ry="22" fill="#348fc8" filter="url(#soft)"/>
  </g>

  <g transform="translate(1240 320)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -72 L70 -44 V18 C70 74 30 111 0 126 C-30 111 -70 74 -70 18 V-44Z" fill="#0c2c40" stroke="#5ee3cb" stroke-width="6"/>
    <path d="M-28 20 L-7 42 L34 -7" stroke="#8ff7dd" stroke-width="12"/>
  </g>

  <g opacity="0.42" fill="#6ce6d1">
    <circle cx="267" cy="355" r="7"/>
    <circle cx="345" cy="428" r="4"/>
    <circle cx="1337" cy="540" r="6"/>
    <circle cx="1445" cy="480" r="4"/>
    <circle cx="1158" cy="196" r="5"/>
  </g>
</svg>
