<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified software layers moving from build to protected runtime</title>
  <desc id="desc">Abstract editorial artwork showing layered software blocks passing through a teal verification shield into a protected runtime field.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#10293b"/>
      <stop offset="1" stop-color="#0a1828"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#627d9e" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#55e0c2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#63bff2" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79f1d1"/>
      <stop offset="1" stop-color="#159bb1"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#284c68"/>
      <stop offset="1" stop-color="#132a40"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020711" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8ccadd" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="821" cy="461" rx="430" ry="180" fill="#3de0bf" opacity="0.09" filter="url(#glow)"/>
  <path d="M135 488C390 380 562 384 800 450c236 65 415 79 671-28" fill="none" stroke="url(#flow)" stroke-width="130" stroke-linecap="round"/>
  <path d="M111 540C358 450 558 448 796 500c254 56 433 49 704-50" fill="none" stroke="#80d8ea" stroke-opacity="0.14" stroke-width="3"/>

