<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Precise blocking boundary across shared web routes</title>
  <desc id="desc">Abstract layered web paths pass through a luminous shield aperture that isolates one hazardous endpoint while neighboring routes remain open.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102847"/>
      <stop offset="1" stop-color="#071c2d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4de4d0" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#37a7d8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c6f9d" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#62e4d2"/>
      <stop offset="1" stop-color="#70b9ec" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff5e3"/>
      <stop offset="0.5" stop-color="#39cbbd"/>
      <stop offset="1" stop-color="#14719c"/>
    </linearGradient>
    <linearGradient id="hazard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad66"/>
      <stop offset="1" stop-color="#e34a68"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="aperture">
      <path d="M800 226 C884 276 954 290 1014 302 V468 C1014 612 920 702 800 750 C680 702 586 612 586 468 V302 C646 290 716 276 800 226Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="476" rx="560" ry="360" fill="url(#halo)"/>
  <path d="M104 164 C430 48 1120 54 1494 230" fill="none" stroke="#5f94bb" stroke-opacity="0.07" stroke-width="2"/>
  <path d="M80 742 C466 854 1172 828 1522 650" fill="none" stroke="#5f94bb" stroke-opacity="0.08" stroke-width="2"/>

  <g fill="none" stroke-linecap="round">
    <path d="M84 274 C292 274 390 352 566 352 C748 352 862 310 1040 310 C1210 310 1328 266 1516 266" stroke="#22557b" stroke-width="18" opacity="0.38"/>
    <path d="M84 274 C292 274 390 352 566 352 C748 352 862 310 1040 310 C1210 310 1328 266 1516 266" stroke="url(#route)" stroke-width="4"/>
    <path d="M66 430 C278 430 392 414 566 432 C720 448 896 448 1040 430 C1212 408 1344 428 1534 428" stroke="#22557b" stroke-width="18" opacity="0.38"/>
    <path d="M66 430 C278 430 392 414 566 432 C720 448 896 448 1040 430 C1212 408 1344 428 1534 428" stroke="url(#route)" stroke-width="4"/>
    <path d="M92 594 C278 594 400 524 566 534 C748 546 850 618 1040 590 C1210 566 1348 606 1508 606" stroke="#22557b" stroke-width="18" opacity="0.38"/>
    <path d="M92 594 C278 594 400 524 566 534 C748 546 850 618 1040 590 C1210 566 1348 606 1508 606" stroke="url(#route)" stroke-width="4"/>
  </g>

  <g opacity="0.9">
    <circle cx="202" cy="274" r="12" fill="#4fb8da"/>
    <circle cx="332" cy="325" r="8" fill="#68e5d5"/>
    <circle cx="222" cy="430" r="10" fill="#68e5d5"/>
    <circle cx="420" cy="422" r="7" fill="#4fb8da"/>
    <circle cx="240" cy="594" r="11" fill="#4fb8da"/>
    <circle cx="406" cy="548" r="8" fill="#68e5d5"/>
    <circle cx="1190" cy="294" r="9" fill="#68e5d5"/>
    <circle cx="1382" cy="270" r="12" fill="#4fb8da"/>
    <circle cx="1218" cy="415" r="10" fill="#4fb8da"/>
    <circle cx="1394" cy="429" r="8" fill="#68e5d5"/>
    <circle cx="1198" cy="577" r="9" fill="#68e5d5"/>
    <circle cx="1380" cy="600" r="12" fill="#4fb8da"/>
  </g>

  <path d="M800 226 C884 276 954 290 1014 302 V468 C1014 612 920 702 800 750 C680 702 586 612 586 468 V302 C646 290 716 276 800 226Z" fill="#081a2b" fill-opacity="0.7" stroke="url(#shield)" stroke-width="8" filter="url(#glow)"/>
  <path d="M800 254 C872 296 928 309 982 320 V466 C982 586 906 664 800 710 C694 664 618 586 618 466 V320 C672 309 728 296 800 254Z" fill="none" stroke="#9cf8e8" stroke-opacity="0.22" stroke-width="2"/>

  <g clip-path="url(#aperture)">
    <ellipse cx="800" cy="450" rx="260" ry="230" fill="#35d7c4" opacity="0.06" filter="url(#soft)"/>
    <path d="M536 430 C662 444 730 448 786 448" fill="none" stroke="#72ead8" stroke-width="5" stroke-linecap="round"/>
    <path d="M814 448 C870 448 928 440 1064 428" fill="none" stroke="#72ead8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="800" cy="448" r="46" fill="#0b2235" stroke="url(#hazard)" stroke-width="7"/>
    <path d="M782 430 L818 466 M818 430 L782 466" stroke="#ff9770" stroke-width="8" stroke-linecap="round"/>
    <circle cx="800" cy="448" r="66" fill="none" stroke="#ef6680" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="9 14"/>
  </g>

  <g fill="#78ead9" opacity="0.85">
    <circle cx="684" cy="352" r="7"/><circle cx="746" cy="338" r="6"/><circle cx="858" cy="328" r="6"/><circle cx="930" cy="316" r="7"/>
    <circle cx="678" cy="530" r="7"/><circle cx="742" cy="558" r="6"/><circle cx="862" cy="588" r="6"/><circle cx="930" cy="598" r="7"/>
  </g>
  <path d="M800 748 C848 722 900 685 932 640" fill="none" stroke="#62e4d2" stroke-opacity="0.18" stroke-width="24" filter="url(#soft)"/>
</svg>
