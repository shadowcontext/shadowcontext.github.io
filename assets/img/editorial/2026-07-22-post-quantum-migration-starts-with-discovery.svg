<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cryptographic discovery becoming post-quantum resilience</title>
  <desc id="desc">An abstract field of fragmented amber rings and network paths transitions into a coherent blue-green shield-shaped lattice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071529"/>
      <stop offset="0.52" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#071c2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="48%" r="48%">
      <stop offset="0" stop-color="#35d4c1" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#2189b5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071529" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="transition" x1="310" y1="450" x2="1260" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3a83b"/>
      <stop offset="0.42" stop-color="#94b987"/>
      <stop offset="0.7" stop-color="#39d2bd"/>
      <stop offset="1" stop-color="#54aee8"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d2bd" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#267eb4" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="15" r="1" fill="#b9d9ea" opacity="0.1"/>
      <circle cx="49" cy="38" r="1.2" fill="#b9d9ea" opacity="0.07"/>
      <circle cx="26" cy="63" r="0.8" fill="#b9d9ea" opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
