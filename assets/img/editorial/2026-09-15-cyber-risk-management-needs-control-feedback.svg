<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cyber risk control feedback</title>
  <desc id="desc">Abstract layered security field with connected control nodes and luminous feedback arcs flowing between organizational and system levels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.52" stop-color="#102c42"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="56%">
      <stop offset="0" stop-color="#39e6c1" stop-opacity=".24"/>
      <stop offset=".48" stop-color="#4ba6ff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#06131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b5fff0" stop-opacity=".20"/>
      <stop offset="1" stop-color="#5b8fff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4f94ff"/>
      <stop offset=".5" stop-color="#66f1cf"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#9ad9ff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="790" rx="610" ry="78" fill="#42d9c0" opacity=".10" filter="url(#soft)"/>

  <g fill="url(#glass)" stroke="#8ee9dc" stroke-opacity=".24" stroke-width="2">
    <path d="M280 260 800 80l520 180-520 180z"/>
    <path d="M280 410 800 230l520 180-520 180z"/>
    <path d="M280 560 800 380l520 180-520 180z"/>
    <path d="M280 710 800 530l520 180-520 180z"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M355 600C142 472 190 206 490 149" stroke="#4f94ff" stroke-width="8" opacity=".56"/>
    <path d="M478 145l-28-9 15 27" stroke="#4f94ff" stroke-width="8"/>
    <path d="M1245 296c213 128 165 394-135 451" stroke="#66f1cf" stroke-width="8" opacity=".64"/>
    <path d="M1122 751l28 9-15-27" stroke="#66f1cf" stroke-width="8"/>
    <path d="M430 683c176 112 564 129 747-4" stroke="url(#flow)" stroke-width="5" opacity=".58"/>
  </g>

  <g stroke="#b7fff1" stroke-opacity=".36" stroke-width="3">
    <path d="M505 303 800 201l295 102-295 102z" fill="#0d2a3d" fill-opacity=".85"/>
    <path d="M565 455 800 374l235 81-235 82z" fill="#0b2335" fill-opacity=".9"/>
    <path d="M635 595 800 538l165 57-165 58z" fill="#081c2a" fill-opacity=".95"/>
  </g>

  <g fill="none" stroke="url(#flow)" stroke-width="6" filter="url(#glow)">
    <path d="M800 201v173"/>
    <path d="M800 537v116"/>
    <path d="M505 303 565 455"/>
    <path d="M1095 303 1035 455"/>
  </g>

  <g fill="#d8fff7" stroke="#65e7cc" stroke-width="4" filter="url(#glow)">
    <circle cx="800" cy="201" r="18"/>
    <circle cx="505" cy="303" r="14"/>
    <circle cx="1095" cy="303" r="14"/>
    <circle cx="565" cy="455" r="14"/>
    <circle cx="1035" cy="455" r="14"/>
    <circle cx="800" cy="537" r="19"/>
    <circle cx="800" cy="653" r="15"/>
  </g>

  <g transform="translate(800 443)">
    <path d="M0-92 75-64v61c0 58-31 103-75 125-44-22-75-67-75-125v-61z" fill="#0b2131" stroke="#c8fff4" stroke-width="6"/>
    <path d="M-35 2-8 29 42-28" fill="none" stroke="url(#flow)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <g fill="#ffd27a" opacity=".85">
    <circle cx="355" cy="600" r="6"/>
    <circle cx="1245" cy="296" r="6"/>
    <circle cx="430" cy="683" r="5"/>
    <circle cx="1177" cy="679" r="5"/>
  </g>
</svg>
