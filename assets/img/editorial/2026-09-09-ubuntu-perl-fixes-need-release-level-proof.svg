<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered validation gates around interwoven data streams</title>
  <desc id="desc">An abstract editorial illustration of blue and amber data ribbons passing through layered validation gates, with one unresolved path held apart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182d"/>
      <stop offset="0.55" stop-color="#0c2940"/>
      <stop offset="1" stop-color="#101a32"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="55%">
      <stop offset="0" stop-color="#35d2cf" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#187b9b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#07182d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c88b5" stop-opacity="0.2"/>
      <stop offset="0.48" stop-color="#63e3dd"/>
      <stop offset="1" stop-color="#2b7eb1" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="amberRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b55f35" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#c8793e" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff8ee" stop-opacity="0.76"/>
      <stop offset="0.5" stop-color="#3995aa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#153c5b" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <ellipse cx="800" cy="755" rx="590" ry="70" fill="#020b18" opacity="0.5" filter="url(#soft)"/>

  <g opacity="0.34" fill="none" stroke="#7fcad0" stroke-width="2">
    <path d="M80 190 C360 85 560 118 765 218 S1190 340 1535 178"/>
    <path d="M44 686 C345 786 555 730 760 646 S1200 552 1568 710"/>
    <path d="M180 92 C320 255 330 540 145 792" opacity="0.34"/>
    <path d="M1420 96 C1270 260 1275 545 1452 786" opacity="0.34"/>
  </g>

  <g opacity="0.22" fill="#8de9e2">
    <circle cx="178" cy="245" r="5"/><circle cx="260" cy="651" r="4"/><circle cx="351" cy="181" r="6"/>
    <circle cx="1260" cy="211" r="5"/><circle cx="1390" cy="604" r="6"/><circle cx="1180" cy="705" r="4"/>
  </g>

  <path d="M-70 330 C205 214 385 260 544 386 C679 493 825 570 1008 482 C1162 408 1322 264 1675 346"
        fill="none" stroke="#2ccbc5" stroke-opacity="0.18" stroke-width="92" filter="url(#soft)"/>
  <path d="M-72 582 C190 690 375 626 546 510 C701 405 832 334 1017 414 C1198 493 1342 650 1670 574"
        fill="none" stroke="#f0a14d" stroke-opacity="0.15" stroke-width="88" filter="url(#soft)"/>

  <path d="M-70 330 C205 214 385 260 544 386 C679 493 825 570 1008 482 C1162 408 1322 264 1675 346"
        fill="none" stroke="url(#blueRibbon)" stroke-width="34" stroke-linecap="round"/>
  <path d="M-72 582 C190 690 375 626 546 510 C701 405 832 334 1017 414 C1198 493 1342 650 1670 574"
        fill="none" stroke="url(#amberRibbon)" stroke-width="30" stroke-linecap="round"/>
  <path d="M-60 456 C238 450 392 464 560 448 C756 430 875 459 1028 451 C1215 441 1368 438 1660 452"
        fill="none" stroke="#d7fbf5" stroke-opacity="0.38" stroke-width="7" stroke-linecap="round"/>

  <g transform="translate(800 450)">
    <g opacity="0.85">
      <path d="M-250-300 L-148-342 L-148 342 L-250 300 Z" fill="url(#gate)" opacity="0.28" stroke="#68dcd7" stroke-width="3"/>
      <path d="M148-342 L250-300 L250 300 L148 342 Z" fill="url(#gate)" opacity="0.28" stroke="#68dcd7" stroke-width="3"/>
    </g>
    <path d="M-147-342 Q0-405 147-342 L147 342 Q0 405-147 342 Z" fill="#0c2238" fill-opacity="0.78" stroke="#83eee5" stroke-width="5"/>
    <path d="M-95-275 Q0-315 95-275 L95 275 Q0 315-95 275 Z" fill="url(#gate)" fill-opacity="0.34" stroke="#53bebf" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="65" ry="246" fill="#061725" stroke="#b0fff5" stroke-opacity="0.72" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="30" ry="204" fill="#65ded5" opacity="0.12" filter="url(#glow)"/>
    <g fill="#d3fffa" filter="url(#glow)">
      <circle cx="0" cy="-170" r="7"/><circle cx="0" cy="-85" r="7"/><circle cx="0" cy="0" r="7"/>
      <circle cx="0" cy="85" r="7"/><circle cx="0" cy="170" r="7"/>
    </g>
  </g>

  <g transform="translate(1265 693)">
    <circle r="94" fill="#0a1b31" stroke="#efad5a" stroke-width="4"/>
    <circle r="69" fill="none" stroke="#efad5a" stroke-opacity="0.42" stroke-width="3" stroke-dasharray="10 14"/>
    <path d="M-26-7 C-10-34 18-39 37-19 C55 0 52 30 29 46 C5 62-28 50-40 23" fill="none" stroke="#ffd080" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-30" cy="-17" r="9" fill="#ffd080"/>
  </g>

  <g opacity="0.72">
    <path d="M1100 680 C1150 692 1172 702 1190 711" fill="none" stroke="#efad5a" stroke-width="5" stroke-dasharray="5 13"/>
    <circle cx="1090" cy="678" r="8" fill="#efad5a"/>
  </g>
</svg>
