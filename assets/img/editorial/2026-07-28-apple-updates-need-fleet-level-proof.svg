<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified security coverage across a mixed device fleet</title>
  <desc id="desc">Abstract glass-like device surfaces converge under a luminous protective arc while small verification lights mark completed updates.</desc>
  <defs>
    <linearGradient id="background" x1="140" y1="70" x2="1430" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A2B"/>
      <stop offset="0.5" stop-color="#102B40"/>
      <stop offset="1" stop-color="#06131F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(805 445) rotate(90) scale(390 640)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6BE7D2" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#3A8DA6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#071A2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C8FFF3" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#72C6D9" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#071A2B" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="arc" x1="300" y1="710" x2="1300" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#49B8CF" stop-opacity="0.2"/>
      <stop offset="0.48" stop-color="#8CF4D2"/>
      <stop offset="1" stop-color="#4DA8D6" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <ellipse cx="800" cy="785" rx="570" ry="64" fill="#44C4CF" fill-opacity="0.12" filter="url(#blur)"/>

  <g opacity="0.28" fill="none" stroke="#7FCFE0" stroke-width="2">
    <path d="M160 684C358 562 475 541 636 523"/>
    <path d="M1440 684C1242 562 1125 541 964 523"/>
    <path d="M271 768C458 658 581 627 701 608"/>
    <path d="M1329 768C1142 658 1019 627 899 608"/>
  </g>

  <g stroke="#A8F8EA" stroke-opacity="0.5" stroke-width="3">
    <g transform="translate(210 356) rotate(-8 150 210)">
      <rect x="0" y="0" width="300" height="420" rx="34" fill="url(#glass)"/>
      <rect x="24" y="28" width="252" height="328" rx="20" fill="#0A2133" fill-opacity="0.65" stroke-opacity="0.22"/>
      <circle cx="150" cy="386" r="10" fill="#79E7D0" stroke="none"/>
    </g>
    <g transform="translate(494 286) rotate(-3 190 245)">
      <rect x="0" y="0" width="380" height="490" rx="28" fill="url(#glass)"/>
      <rect x="25" y="26" width="330" height="388" rx="13" fill="#0A2133" fill-opacity="0.64" stroke-opacity="0.22"/>
      <path d="M113 452H267" stroke="#79E7D0" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(862 315) rotate(4 180 225)">
      <rect x="0" y="0" width="360" height="450" rx="35" fill="url(#glass)"/>
      <rect x="27" y="30" width="306" height="344" rx="20" fill="#0A2133" fill-opacity="0.64" stroke-opacity="0.22"/>
      <circle cx="180" cy="412" r="10" fill="#79E7D0" stroke="none"/>
    </g>
    <g transform="translate(1194 420) rotate(9 102 150)">
      <rect x="0" y="0" width="204" height="300" rx="58" fill="url(#glass)"/>
      <rect x="23" y="27" width="158" height="216" rx="39" fill="#0A2133" fill-opacity="0.65" stroke-opacity="0.22"/>
      <circle cx="102" cy="270" r="9" fill="#79E7D0" stroke="none"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M270 593C367 255 617 118 798 118C986 118 1233 255 1331 593" stroke="#70D8DA" stroke-opacity="0.16" stroke-width="44" filter="url(#softGlow)"/>
    <path d="M270 593C367 255 617 118 798 118C986 118 1233 255 1331 593" stroke="url(#arc)" stroke-width="10"/>
    <path d="M397 574C487 343 648 254 800 254C953 254 1114 343 1204 574" stroke="#9AF5DB" stroke-opacity="0.34" stroke-width="3"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="302" cy="501" r="13" fill="#9CF5DB"/>
    <circle cx="532" cy="214" r="13" fill="#9CF5DB"/>
    <circle cx="800" cy="118" r="15" fill="#E4FFF8"/>
    <circle cx="1070" cy="216" r="13" fill="#9CF5DB"/>
    <circle cx="1298" cy="500" r="13" fill="#9CF5DB"/>
  </g>

  <g transform="translate(800 500)" filter="url(#softGlow)">
    <path d="M0-142C62-113 119-103 161-99V-9C161 96 93 165 0 204C-93 165-161 96-161-9V-99C-119-103-62-113 0-142Z" fill="#0B3143" fill-opacity="0.9" stroke="#A4F7E3" stroke-width="6"/>
    <path d="M-65 18L-17 66L78-42" fill="none" stroke="#A4F7E3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#C6FFF2">
    <circle cx="360" cy="755" r="6"/>
    <circle cx="654" cy="772" r="6"/>
    <circle cx="946" cy="772" r="6"/>
    <circle cx="1240" cy="755" r="6"/>
  </g>
</svg>
