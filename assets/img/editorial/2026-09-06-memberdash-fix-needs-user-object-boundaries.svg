<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">User-object boundaries protected by a layered security gate</title>
  <desc id="desc">Abstract editorial artwork showing an amber untrusted input stream stopped by a luminous cyan gate before reaching a field of distinct user-profile tiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102844"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <radialGradient id="glow" cx="67%" cy="48%" r="48%">
      <stop offset="0" stop-color="#1ee5dd" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#1ee5dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ffff8"/>
      <stop offset="0.5" stop-color="#29d9d2"/>
      <stop offset="1" stop-color="#087f92"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ffd37a"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000815" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#82a7c4" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g opacity="0.55" fill="none" stroke="#8fb7d1" stroke-width="2">
    <path d="M160 180C330 180 330 300 465 300"/>
    <path d="M120 450H465"/>
    <path d="M170 710C330 710 340 600 465 600"/>
  </g>
  <g fill="#ffb24d">
    <circle cx="160" cy="180" r="8"/>
    <circle cx="120" cy="450" r="8"/>
    <circle cx="170" cy="710" r="8"/>
  </g>

  <g filter="url(#softGlow)" opacity="0.6">
    <path d="M170 450H535" stroke="url(#amber)" stroke-width="28" stroke-linecap="round"/>
    <rect x="535" y="115" width="34" height="670" rx="17" fill="#23e7dd"/>
  </g>
  <path d="M170 450H515" stroke="url(#amber)" stroke-width="10" stroke-linecap="round"/>
  <path d="M490 426L530 450 490 474" fill="none" stroke="#ffd37a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <path d="M565 120L705 175V420C705 570 645 690 565 748C485 690 425 570 425 420V175Z" fill="#0a1e35" stroke="#173e58" stroke-width="8"/>
    <path d="M565 150L675 194V418C675 545 627 644 565 697C503 644 455 545 455 418V194Z" fill="none" stroke="url(#gate)" stroke-width="18"/>
    <circle cx="565" cy="414" r="66" fill="#0d3045" stroke="#66f7ef" stroke-width="12"/>
    <path d="M535 414L556 435 598 388" fill="none" stroke="#b8fffa" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(820 170)" filter="url(#shadow)">
    <g transform="translate(0 0)">
      <rect width="250" height="220" rx="34" fill="#102d49" stroke="#24627d" stroke-width="3"/>
      <circle cx="125" cy="76" r="35" fill="#54d9d3" opacity="0.9"/>
      <path d="M65 178C72 130 178 130 185 178" fill="#23869a"/>
      <circle cx="206" cy="34" r="10" fill="#80fff6"/>
    </g>
    <g transform="translate(290 0)">
      <rect width="250" height="220" rx="34" fill="#102d49" stroke="#24627d" stroke-width="3"/>
      <circle cx="125" cy="76" r="35" fill="#8aaee7"/>
      <path d="M65 178C72 130 178 130 185 178" fill="#536fae"/>
      <circle cx="206" cy="34" r="10" fill="#80fff6"/>
    </g>
    <g transform="translate(0 270)">
      <rect width="250" height="220" rx="34" fill="#102d49" stroke="#24627d" stroke-width="3"/>
      <circle cx="125" cy="76" r="35" fill="#c3a3ee"/>
      <path d="M65 178C72 130 178 130 185 178" fill="#775aa8"/>
      <circle cx="206" cy="34" r="10" fill="#80fff6"/>
    </g>
    <g transform="translate(290 270)">
      <rect width="250" height="220" rx="34" fill="#102d49" stroke="#24627d" stroke-width="3"/>
      <circle cx="125" cy="76" r="35" fill="#f4c978"/>
      <path d="M65 178C72 130 178 130 185 178" fill="#b37c3f"/>
      <circle cx="206" cy="34" r="10" fill="#80fff6"/>
    </g>
  </g>

  <g opacity="0.8">
    <circle cx="770" cy="280" r="5" fill="#58eee6"/>
    <circle cx="745" cy="450" r="8" fill="#58eee6"/>
    <circle cx="780" cy="625" r="5" fill="#58eee6"/>
    <path d="M720 280H795M720 450H795M720 625H795" stroke="#58eee6" stroke-opacity="0.45" stroke-width="2"/>
  </g>
</svg>
