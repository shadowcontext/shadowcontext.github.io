<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected server management firmware</title>
  <desc id="desc">Abstract server columns beneath a luminous amber management ring, with a sealed firmware core and layered verification paths.</desc>
  <defs>
    <linearGradient id="bg" x1="130" y1="40" x2="1460" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071524"/>
      <stop offset="0.52" stop-color="#102A3A"/>
      <stop offset="1" stop-color="#08131D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(800 404) rotate(90) scale(390 690)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7A747" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#38B8B0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#244A5E"/>
      <stop offset="1" stop-color="#102736"/>
    </linearGradient>
    <linearGradient id="amber" x1="480" y1="260" x2="1130" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD78A"/>
      <stop offset="0.48" stop-color="#F3A83B"/>
      <stop offset="1" stop-color="#B85E27"/>
    </linearGradient>
    <linearGradient id="glass" x1="615" y1="300" x2="990" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CE6DB" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#287D83" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="floorClip"><path d="M155 715 800 510l645 205-645 135z"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
