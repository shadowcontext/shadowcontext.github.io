<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Source-level telemetry for retrieval-augmented AI</title>
  <desc id="desc">Abstract document streams enter a luminous AI core while a concentrated amber source beam is isolated by a blue monitoring ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182b"/>
      <stop offset="0.55" stop-color="#0b2741"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#9cecff" stop-opacity="0.95"/>
      <stop offset="0.38" stop-color="#2ca8ce" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#166084" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#75d6ed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a7efff" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb44a" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#ffc66d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff0bd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="810" cy="450" r="330" fill="none" stroke="#65cae6" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="810" cy="450" r="255" fill="none" stroke="#65cae6" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="7 18"/>
  <path d="M0 168 C320 112 475 212 685 344" fill="none" stroke="#56c6e4" stroke-opacity="0.09" stroke-width="70"/>
  <path d="M0 731 C325 780 505 651 690 548" fill="none" stroke="#56c6e4" stroke-opacity="0.08" stroke-width="84"/>

  <g opacity="0.88">
    <path d="M88 205 C294 199 442 274 668 398" fill="none" stroke="url(#paperBlue)" stroke-width="78" stroke-linecap="round"/>
    <path d="M64 393 C298 367 444 397 658 438" fill="none" stroke="url(#paperBlue)" stroke-width="66" stroke-linecap="round"/>
    <path d="M89 657 C316 656 472 579 674 498" fill="none" stroke="url(#paperBlue)" stroke-width="82" stroke-linecap="round"/>
    <g fill="none" stroke="#b9f3ff" stroke-opacity="0.38" stroke-width="7" stroke-linecap="round">
      <path d="M114 190 C280 194 424 265 589 351"/>
      <path d="M121 217 C288 225 405 282 555 359"/>
      <path d="M104 382 C270 370 416 397 568 424"/>
      <path d="M113 407 C291 397 407 413 552 443"/>
      <path d="M117 641 C286 645 436 584 577 527"/>
      <path d="M116 670 C310 670 437 608 568 554"/>
    </g>
  </g>

  <path d="M68 518 C332 494 475 465 676 456" fill="none" stroke="#ffb64f" stroke-opacity="0.16" stroke-width="122" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M72 518 C330 497 486 470 687 456" fill="none" stroke="url(#amber)" stroke-width="42" stroke-linecap="round"/>
  <g fill="none" stroke="#fff1c4" stroke-opacity="0.72" stroke-width="6" stroke-linecap="round">
    <path d="M111 506 C301 492 468 470 602 462"/>
    <path d="M116 527 C310 514 455 490 585 475"/>
  </g>

  <circle cx="805" cy="454" r="189" fill="url(#core)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="805" cy="454" r="154" fill="#0b314d" stroke="#8fe8f8" stroke-opacity="0.68" stroke-width="4"/>
  <circle cx="805" cy="454" r="120" fill="#0d2337" stroke="#65cfe9" stroke-opacity="0.42" stroke-width="3" stroke-dasharray="3 13"/>
  <g fill="none" stroke="#8ee5f6" stroke-linecap="round">
    <path d="M744 402 C774 367 838 365 870 402 C899 436 892 493 858 520" stroke-width="12" stroke-opacity="0.82"/>
    <path d="M738 494 C715 461 719 420 746 397" stroke-width="12" stroke-opacity="0.58"/>
    <circle cx="805" cy="454" r="36" stroke-width="10" stroke-opacity="0.9"/>
  </g>
  <circle cx="805" cy="454" r="9" fill="#fff0bd"/>

  <ellipse cx="805" cy="454" rx="238" ry="276" fill="none" stroke="#72dbef" stroke-width="12" stroke-opacity="0.2" filter="url(#soft)"/>
  <ellipse cx="805" cy="454" rx="230" ry="268" fill="none" stroke="#78dcf0" stroke-width="5" stroke-opacity="0.82"/>
  <path d="M787 187 A230 268 0 0 1 987 326" fill="none" stroke="#d3f8ff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M604 586 A230 268 0 0 1 601 323" fill="none" stroke="#39a9ca" stroke-width="7" stroke-linecap="round" opacity="0.65"/>

  <g opacity="0.78">
    <path d="M1003 358 C1171 246 1347 213 1565 242" fill="none" stroke="#65cee7" stroke-opacity="0.3" stroke-width="38" stroke-linecap="round"/>
    <path d="M1004 449 C1195 423 1345 414 1563 424" fill="none" stroke="#72d7ec" stroke-opacity="0.35" stroke-width="48" stroke-linecap="round"/>
    <path d="M1001 539 C1180 638 1353 674 1560 642" fill="none" stroke="#62c9e4" stroke-opacity="0.27" stroke-width="42" stroke-linecap="round"/>
    <path d="M994 476 C1176 501 1341 541 1565 571" fill="none" stroke="#ffc46b" stroke-opacity="0.48" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g fill="#a8effb">
    <circle cx="1112" cy="300" r="8" opacity="0.55"/>
    <circle cx="1208" cy="443" r="6" opacity="0.7"/>
    <circle cx="1314" cy="653" r="9" opacity="0.45"/>
    <circle cx="1435" cy="417" r="7" opacity="0.62"/>
  </g>
  <circle cx="1268" cy="524" r="10" fill="#ffd78e" opacity="0.92"/>
  <rect x="42" y="42" width="1516" height="816" rx="38" fill="none" stroke="#b7f1fb" stroke-opacity="0.08" stroke-width="2"/>
</svg>
