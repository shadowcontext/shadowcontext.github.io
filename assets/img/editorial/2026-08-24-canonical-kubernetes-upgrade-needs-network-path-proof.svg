<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified network paths in a protected container cluster</title>
  <desc id="desc">Abstract teal cluster nodes flow through a luminous eBPF routing ring toward a shielded amber datastore core, emphasizing verification of the active network path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c2a"/>
      <stop offset="0.52" stop-color="#0a3040"/>
      <stop offset="1" stop-color="#071922"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4fe1d3" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#1ba9ad" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1ba9ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ec8d5" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#8af5dc"/>
      <stop offset="1" stop-color="#efb85d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5ffea"/>
      <stop offset="0.45" stop-color="#28c8c4"/>
      <stop offset="1" stop-color="#167f9c"/>
    </linearGradient>
    <radialGradient id="core" cx="42%" cy="35%" r="68%">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset="0.42" stop-color="#eeaf55"/>
      <stop offset="1" stop-color="#b86d32"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#80d7d7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
