<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Authentication protection restored after a configuration migration</title>
  <desc id="desc">Abstract device nodes sit behind a luminous shield while an amber configuration stream bends into a protected blue channel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071524"/>
      <stop offset="0.52" stop-color="#0b2840"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#32d9ff" stop-opacity="0.27"/>
      <stop offset="0.62" stop-color="#197ea5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#07111d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7de8ff"/>
      <stop offset="0.48" stop-color="#20b9e7"/>
      <stop offset="1" stop-color="#126087"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffac4d" stop-opacity="0.15"/>
      <stop offset="0.56" stop-color="#ffbd62"/>
      <stop offset="1" stop-color="#50d8ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#02070d" flood-opacity="0.7"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#7edff8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="865" cy="444" rx="575" ry="410" fill="url(#glow)"/>
