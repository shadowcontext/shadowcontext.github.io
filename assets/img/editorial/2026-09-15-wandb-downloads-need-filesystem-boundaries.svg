    </g>
    <rect x="972" y="107" width="158" height="93" rx="46" fill="#0B1931" stroke="#54EFD1" stroke-width="4"/>
    <circle cx="1051" cy="153" r="19" fill="#54EFD1" filter="url(#glow)"/>
    <path d="M1051 132V174M1030 153H1072" stroke="#E3FFF9" stroke-width="5" stroke-linecap="round"/>
