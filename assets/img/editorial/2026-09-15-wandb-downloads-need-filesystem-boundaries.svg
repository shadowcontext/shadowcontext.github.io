      <path d="M23 0H215L266 50V196H23C10 196 0 186 0 173V23C0 10 10 0 23 0Z" fill="#5D4BB8"/>
      <path d="M215 0V50H266" fill="#BDB3FF" fill-opacity="0.55"/>
      <path d="M48 72H179M48 109H216M48 146H160" stroke="#EAE6FF" stroke-opacity="0.4" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="852" y="154" width="398" height="594" rx="126" fill="#0A1730" stroke="#5AF2D3" stroke-opacity="0.3" stroke-width="4"/>
