<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected machine-learning artifact download boundary</title>
  <desc id="desc">Abstract violet artifact tiles flow toward a teal download chamber, while layered filesystem paths bend around a luminous containment boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="130" y1="60" x2="1480" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091426"/>
      <stop offset="0.48" stop-color="#102246"/>
      <stop offset="1" stop-color="#09162D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1048 445) rotate(180) scale(555 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2EE6C5" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2EE6C5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="265" y1="210" x2="735" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B82FF"/>
      <stop offset="1" stop-color="#6246C8"/>
    </linearGradient>
    <linearGradient id="gate" x1="890" y1="220" x2="1240" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54F0D0"/>
      <stop offset="1" stop-color="#139E9E"/>
    </linearGradient>
    <linearGradient id="path" x1="570" y1="165" x2="1440" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7285FF" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#61EAD0" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#A9FFF0" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#020817" flood-opacity="0.62"/>
    </filter>
    <clipPath id="gateClip"><rect x="892" y="196" width="318" height="510" rx="96"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
