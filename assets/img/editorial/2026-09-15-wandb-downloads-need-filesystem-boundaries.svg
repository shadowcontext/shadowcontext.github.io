  <g opacity="0.9">
    <path d="M1264 309C1375 309 1418 348 1473 415" fill="none" stroke="#57DCC9" stroke-opacity="0.4" stroke-width="14" stroke-linecap="round"/>
    <path d="M1264 596C1378 596 1424 550 1472 495" fill="none" stroke="#57DCC9" stroke-opacity="0.34" stroke-width="14" stroke-linecap="round"/>
    <circle cx="1480" cy="454" r="55" fill="#0C213B" stroke="#58E8CF" stroke-opacity="0.54" stroke-width="4"/>
