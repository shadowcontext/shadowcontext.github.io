    <path d="M108 708H547C680 708 675 595 805 595H923" stroke-width="22"/>
    <path d="M182 789H624C787 789 804 690 931 690H1378" stroke-width="10" opacity="0.55"/>
    <path d="M126 111H680C803 111 820 210 940 210H1434" stroke-width="9" opacity="0.45"/>
  </g>

