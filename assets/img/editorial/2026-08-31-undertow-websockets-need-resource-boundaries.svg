<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Resource boundary for WebSocket streams</title>
  <desc id="desc">Abstract blue and amber WebSocket streams converge on a luminous control gate before entering a protected teal application chamber.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061729"/>
      <stop offset=".55" stop-color="#0b293c"/>
      <stop offset="1" stop-color="#111f34"/>
    </linearGradient>
    <radialGradient id="aura" cx="65%" cy="48%" r="48%">
      <stop offset="0" stop-color="#47e0c4" stop-opacity=".24"/>
      <stop offset=".56" stop-color="#1aa6aa" stop-opacity=".08"/>
      <stop offset="1" stop-color="#061729" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b7fc5" stop-opacity=".15"/>
      <stop offset=".54" stop-color="#64bcd4"/>
      <stop offset="1" stop-color="#7cf1d8"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5ffeb"/>
      <stop offset="1" stop-color="#1ba3a8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd080"/>
      <stop offset="1" stop-color="#e86d51"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1000" cy="432" rx="650" ry="420" fill="url(#aura)"/>
  <path d="M0 741c270-86 507-57 716 0 283 77 547 44 884-76v235H0Z" fill="#05131f" opacity=".82"/>
  <path d="M0 793c279-70 500-19 727 27 271 54 552 10 873-103" fill="none" stroke="#285064" stroke-width="2" opacity=".48"/>

  <g fill="none" stroke="url(#stream)" stroke-linecap="round">
    <path d="M65 232c210 0 270 165 466 165 99 0 150-13 225 2" stroke-width="18"/>
    <path d="M58 380c175 0 266 75 455 75h247" stroke-width="12" opacity=".9"/>
    <path d="M70 551c201 0 255-56 438-56 122 0 174 25 252 18" stroke-width="20" opacity=".8"/>
    <path d="M95 671c180-26 274-111 438-111 94 0 156 16 224 4" stroke-width="9" opacity=".72"/>
  </g>

  <g fill="#75ddcf">
    <circle cx="189" cy="257" r="9"/><circle cx="278" cy="333" r="6"/><circle cx="365" cy="426" r="8"/>
    <circle cx="202" cy="550" r="7"/><circle cx="319" cy="587" r="10"/><circle cx="458" cy="529" r="6"/>
  </g>
  <g fill="#f0a260" opacity=".9">
    <circle cx="116" cy="379" r="11"/><circle cx="255" cy="414" r="7"/><circle cx="127" cy="656" r="8"/>
  </g>

  <ellipse cx="806" cy="457" rx="120" ry="308" fill="#3be0c0" opacity=".1" filter="url(#soft)"/>
  <g filter="url(#glow)">
    <path d="M760 174h94v566h-94z" fill="#092d3d" stroke="url(#gate)" stroke-width="8"/>
    <path d="M781 209h52M781 275h52M781 341h52M781 407h52M781 473h52M781 539h52M781 605h52M781 671h52" stroke="#a9ffed" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g fill="#071a2a" stroke="#72ead5" stroke-width="3">
    <circle cx="807" cy="209" r="14"/><circle cx="807" cy="341" r="14"/><circle cx="807" cy="473" r="14"/><circle cx="807" cy="605" r="14"/>
  </g>

  <path d="M855 456c82 0 124 0 184 0" stroke="#81f3db" stroke-width="35" stroke-linecap="round" opacity=".22"/>
  <path d="M855 456h184" stroke="#a7ffed" stroke-width="5" stroke-linecap="round" opacity=".85"/>

  <g transform="translate(1073 217)">
    <path d="M0 79c0-44 36-79 79-79h217c44 0 79 35 79 79v325c0 44-35 79-79 79H79c-43 0-79-35-79-79Z" fill="#0a3040" fill-opacity=".78" stroke="#48cdb8" stroke-width="5"/>
    <path d="M42 353c47-110 103-67 137-161 25-70 69-94 154-98v267H42Z" fill="#1ea9a8" opacity=".16"/>
    <path d="M42 353c47-110 103-67 137-161 25-70 69-94 154-98" fill="none" stroke="#6ce6d0" stroke-width="8" stroke-linecap="round"/>
    <circle cx="179" cy="192" r="17" fill="#0a3040" stroke="#a9ffed" stroke-width="6"/>
    <path d="M51 63h87M51 93h54" stroke="#75dacb" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  </g>

  <g opacity=".36" fill="none" stroke="#5ccfbe" stroke-width="2">
    <circle cx="1460" cy="137" r="5"/><circle cx="1357" cy="91" r="3"/><path d="m1460 137-103-46-84 42"/>
    <circle cx="168" cy="125" r="4"/><path d="m168 125 82-40 77 43"/>
  </g>
  <path d="M702 145c22-40 58-63 105-63 48 0 84 23 107 63" fill="none" stroke="url(#warm)" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <circle cx="807" cy="82" r="10" fill="#ffbc70" filter="url(#glow)"/>
  <rect x="82" y="72" width="1436" height="756" rx="42" fill="none" stroke="#b4ffef" stroke-opacity=".08" stroke-width="2"/>
</svg>
