<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tenant isolation around an image-generation cache</title>
  <desc id="desc">Abstract image-generation tiles are divided into separate fields by a luminous central barrier, while curved cache rings remain contained on each side.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102849"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="35%" cy="45%" r="55%">
      <stop offset="0" stop-color="#24d6c7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#24d6c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="65%" cy="50%" r="55%">
      <stop offset="0" stop-color="#aa7cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#aa7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7df7e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e9ffff"/>
      <stop offset="1" stop-color="#b290ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49e1cf"/>
      <stop offset="1" stop-color="#176e8e"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c090ff"/>
      <stop offset="1" stop-color="#4c55a6"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020914" flood-opacity="0.65"/>
    </filter>
    <clipPath id="leftField"><rect x="95" y="110" width="650" height="680" rx="70"/></clipPath>
    <clipPath id="rightField"><rect x="855" y="110" width="650" height="680" rx="70"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="800" height="900" fill="url(#glowLeft)"/>
  <rect x="800" width="800" height="900" fill="url(#glowRight)"/>

  <g opacity="0.34" fill="none" stroke="#8ee9df" stroke-width="2">
    <path d="M0 180 C250 80 480 110 750 260"/>
    <path d="M10 720 C280 820 510 770 748 630"/>
  </g>
  <g opacity="0.3" fill="none" stroke="#bda2ff" stroke-width="2">
    <path d="M850 250 C1110 90 1370 100 1600 205"/>
    <path d="M852 650 C1090 790 1360 820 1600 705"/>
  </g>

  <g clip-path="url(#leftField)">
    <ellipse cx="440" cy="450" rx="280" ry="230" fill="none" stroke="#35e1d0" stroke-width="34" opacity="0.12"/>
    <ellipse cx="440" cy="450" rx="215" ry="170" fill="none" stroke="#62f5e6" stroke-width="7" stroke-dasharray="16 20" opacity="0.8"/>
    <ellipse cx="440" cy="450" rx="145" ry="112" fill="#2de0cd" opacity="0.08"/>
    <g filter="url(#shadow)">
      <rect x="178" y="210" width="230" height="154" rx="28" fill="url(#tileA)" transform="rotate(-8 293 287)"/>
      <path d="M210 320 L265 265 L315 302 L360 250 L396 330 Z" fill="#d9fff9" opacity="0.68" transform="rotate(-8 293 287)"/>
      <circle cx="355" cy="247" r="18" fill="#f4fff8" opacity="0.8" transform="rotate(-8 293 287)"/>
      <rect x="430" y="520" width="238" height="160" rx="28" fill="url(#tileA)" transform="rotate(7 549 600)"/>
      <path d="M454 643 C490 570 522 612 552 558 C582 525 622 592 656 645 Z" fill="#d8fff8" opacity="0.68" transform="rotate(7 549 600)"/>
      <circle cx="610" cy="558" r="20" fill="#f6fffb" opacity="0.78" transform="rotate(7 549 600)"/>
    </g>
    <g fill="#a5fff3">
      <circle cx="244" cy="520" r="8"/><circle cx="290" cy="555" r="5"/><circle cx="620" cy="355" r="7"/><circle cx="575" cy="310" r="4"/>
    </g>
  </g>

  <g clip-path="url(#rightField)">
    <ellipse cx="1160" cy="450" rx="280" ry="230" fill="none" stroke="#a77cff" stroke-width="34" opacity="0.12"/>
    <ellipse cx="1160" cy="450" rx="215" ry="170" fill="none" stroke="#c6a8ff" stroke-width="7" stroke-dasharray="16 20" opacity="0.8"/>
    <ellipse cx="1160" cy="450" rx="145" ry="112" fill="#a77cff" opacity="0.08"/>
    <g filter="url(#shadow)">
      <rect x="930" y="500" width="238" height="160" rx="28" fill="url(#tileB)" transform="rotate(-7 1049 580)"/>
      <path d="M951 623 C990 550 1026 595 1055 542 C1086 520 1128 574 1155 624 Z" fill="#f0e7ff" opacity="0.68" transform="rotate(-7 1049 580)"/>
      <circle cx="1112" cy="540" r="20" fill="#fff9ff" opacity="0.8" transform="rotate(-7 1049 580)"/>
      <rect x="1188" y="222" width="230" height="154" rx="28" fill="url(#tileB)" transform="rotate(8 1303 299)"/>
      <path d="M1210 343 L1262 284 L1312 326 L1350 270 L1405 345 Z" fill="#efe5ff" opacity="0.68" transform="rotate(8 1303 299)"/>
      <circle cx="1360" cy="274" r="18" fill="#fff8ff" opacity="0.82" transform="rotate(8 1303 299)"/>
    </g>
    <g fill="#d2bcff">
      <circle cx="970" cy="330" r="7"/><circle cx="1020" cy="300" r="4"/><circle cx="1328" cy="540" r="8"/><circle cx="1370" cy="585" r="5"/>
    </g>
  </g>

  <rect x="780" y="92" width="40" height="716" rx="20" fill="#bffff6" opacity="0.12" filter="url(#soft)"/>
  <rect x="793" y="110" width="14" height="680" rx="7" fill="#dffffb" opacity="0.88"/>
  <path d="M690 450 H910" stroke="url(#barrier)" stroke-width="8" stroke-linecap="round"/>
  <path d="M762 420 L800 382 L838 420 M762 480 L800 518 L838 480" fill="none" stroke="#efffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <g opacity="0.72">
    <circle cx="800" cy="450" r="106" fill="none" stroke="#d9ffff" stroke-width="2"/>
    <circle cx="800" cy="450" r="132" fill="none" stroke="#b6f8f0" stroke-width="2" stroke-dasharray="5 16"/>
  </g>
  <rect x="96" y="110" width="648" height="680" rx="70" fill="none" stroke="#54dfd0" stroke-opacity="0.28" stroke-width="3"/>
  <rect x="856" y="110" width="648" height="680" rx="70" fill="none" stroke="#b995ff" stroke-opacity="0.28" stroke-width="3"/>
</svg>
