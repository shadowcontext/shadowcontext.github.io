<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected telephone system blocking hostile network signals</title>
  <desc id="desc">An abstract blue telephone system sits behind layered security gates while amber signal paths are stopped and diverted outside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162d"/>
      <stop offset="0.55" stop-color="#0b3150"/>
      <stop offset="1" stop-color="#082239"/>
    </linearGradient>
    <radialGradient id="halo" cx="52%" cy="48%" r="52%">
      <stop offset="0" stop-color="#34d6e8" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#176a91" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07162d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ce8f2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1783aa" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset="0.45" stop-color="#55cfe0"/>
      <stop offset="1" stop-color="#14789e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffba4b" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#ffb33c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff7b35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="830" cy="450" rx="650" ry="410" fill="url(#halo)"/>
  <g opacity="0.18" fill="none" stroke="#8beaf2" stroke-width="2">
    <path d="M105 205 C310 80 490 125 620 260"/>
    <path d="M95 695 C315 825 500 760 650 625"/>
    <circle cx="1250" cy="450" r="272"/>
    <circle cx="1250" cy="450" r="202"/>
  </g>
  <g fill="#89e8f2" opacity="0.28">
    <circle cx="175" cy="168" r="7"/><circle cx="292" cy="128" r="5"/><circle cx="420" cy="145" r="6"/>
    <circle cx="185" cy="735" r="6"/><circle cx="322" cy="780" r="5"/><circle cx="474" cy="742" r="7"/>
  </g>
  <path d="M120 450 C300 450 365 390 535 390" fill="none" stroke="url(#amber)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M150 330 C315 330 370 350 530 350" fill="none" stroke="#f7a63b" stroke-opacity="0.65" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 570 C315 570 370 550 530 550" fill="none" stroke="#f7a63b" stroke-opacity="0.65" stroke-width="8" stroke-linecap="round"/>
  <g fill="#ffb13d" filter="url(#glow)">
    <circle cx="212" cy="450" r="13"/><circle cx="340" cy="426" r="10"/><circle cx="434" cy="396" r="9"/>
    <circle cx="268" cy="330" r="7"/><circle cx="355" cy="570" r="7"/>
  </g>
  <g>
    <rect x="515" y="185" width="42" height="530" rx="21" fill="url(#gate)"/>
    <rect x="590" y="145" width="30" height="610" rx="15" fill="#44bfd2" opacity="0.45"/>
    <rect x="655" y="110" width="20" height="680" rx="10" fill="#73dce7" opacity="0.3"/>
    <ellipse cx="535" cy="450" rx="74" ry="300" fill="#5ee1eb" opacity="0.08" filter="url(#soft)"/>
  </g>
  <g fill="none" stroke="#ffb13d" stroke-linecap="round">
    <path d="M500 390 Q555 450 500 510" stroke-width="15" opacity="0.85"/>
    <path d="M468 365 Q558 450 468 535" stroke-width="7" opacity="0.55"/>
  </g>
  <g transform="translate(730 218)">
    <path d="M72 29 C125 -10 212 -13 268 22 L326 58 C345 70 349 96 336 113 L289 173 C279 186 260 190 246 181 L193 147 C169 132 143 132 120 147 L67 181 C52 190 33 186 23 173 L-24 113 C-37 96 -33 70 -14 58 Z" fill="url(#phone)" filter="url(#glow)"/>
    <path d="M81 49 C127 17 202 15 251 44" fill="none" stroke="#ecffff" stroke-opacity="0.72" stroke-width="10" stroke-linecap="round"/>
    <rect x="13" y="204" width="318" height="307" rx="58" fill="#0d5578" stroke="#6be0e9" stroke-width="7"/>
    <rect x="60" y="245" width="224" height="96" rx="20" fill="#08263f" stroke="#47bfce" stroke-width="4"/>
    <path d="M88 290 H256" stroke="#6ee6ed" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <g fill="#83e6ec">
      <circle cx="84" cy="389" r="16"/><circle cx="172" cy="389" r="16"/><circle cx="260" cy="389" r="16"/>
      <circle cx="84" cy="451" r="16"/><circle cx="172" cy="451" r="16"/><circle cx="260" cy="451" r="16"/>
    </g>
  </g>
  <g transform="translate(1130 275)">
    <path d="M170 0 L318 58 V195 C318 304 253 378 170 420 C87 378 22 304 22 195 V58 Z" fill="#0a3554" stroke="#72e2eb" stroke-width="8"/>
    <path d="M170 42 L276 84 V192 C276 267 234 321 170 357 C106 321 64 267 64 192 V84 Z" fill="#0c6280" opacity="0.82"/>
    <path d="M112 196 L153 237 L234 145" fill="none" stroke="#d3fbf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
  <g fill="none" stroke="#5dd9e5" opacity="0.42" stroke-width="4">
    <path d="M1070 270 C1135 218 1210 190 1300 185"/>
    <path d="M1080 650 C1170 700 1270 710 1375 675"/>
  </g>
  <g fill="#8ceaf0" opacity="0.58">
    <circle cx="1090" cy="255" r="8"/><circle cx="1200" cy="205" r="6"/><circle cx="1350" cy="188" r="8"/>
    <circle cx="1110" cy="664" r="7"/><circle cx="1240" cy="700" r="6"/><circle cx="1380" cy="673" r="8"/>
  </g>
