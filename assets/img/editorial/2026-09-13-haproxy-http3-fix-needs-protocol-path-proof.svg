<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Incomplete protocol frame stopped at a proxy boundary</title>
  <desc id="desc">Abstract teal and amber protocol streams cross a layered proxy boundary while an incomplete frame is isolated before it can enter a shared backend channel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071523"/>
      <stop offset="0.52" stop-color="#10263a"/>
      <stop offset="1" stop-color="#08121d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#1e7f91" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071523" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddbd0"/>
      <stop offset="1" stop-color="#9af5df"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e87932"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1" fill="#bfe9ee" fill-opacity=".055"/>
      <circle cx="39" cy="27" r="1.5" fill="#bfe9ee" fill-opacity=".035"/>
      <circle cx="21" cy="53" r="1" fill="#bfe9ee" fill-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="445" rx="650" ry="390" fill="url(#halo)"/>
  <path d="M70 720C370 610 560 735 820 677s474-181 740-88" fill="none" stroke="#2dd4bf" stroke-opacity=".08" stroke-width="100" filter="url(#soft)"/>

  <g opacity=".28" fill="none" stroke="#78b8c8" stroke-width="3">
    <path d="M80 250H390M1210 650h310"/>
    <circle cx="80" cy="250" r="7" fill="#78b8c8"/><circle cx="1520" cy="650" r="7" fill="#78b8c8"/>
    <path d="M120 775h330M1150 165h330" stroke-dasharray="9 17"/>
  </g>

  <g transform="translate(615 110)">
    <path d="M185 0 356 92v207c0 145-66 259-171 329C80 558 14 444 14 299V92Z" fill="#0a2231" stroke="#55ddcf" stroke-width="8"/>
    <path d="M185 39 320 112v178c0 118-51 212-135 273C101 502 50 408 50 290V112Z" fill="#0d3140" stroke="#87efe0" stroke-opacity=".38" stroke-width="3"/>
    <path d="M185 119v362" stroke="#68dfd4" stroke-opacity=".24" stroke-width="8"/>
    <circle cx="185" cy="301" r="95" fill="#09202c" stroke="#7cebdd" stroke-width="7" filter="url(#glow)"/>
    <path d="M136 301h98M185 252v98" stroke="#b2fff1" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="url(#stream)" stroke-width="18" stroke-linecap="round" filter="url(#glow)">
    <path d="M70 338h345c70 0 106 42 164 76"/>
    <path d="M70 456h352c66 0 104 10 157 25"/>
    <path d="M1022 414c73-35 122-76 207-76h301"/>
    <path d="M1022 482c72 18 122 29 207 29h301"/>
  </g>

  <g fill="#b9fff1" opacity=".9">
    <circle cx="133" cy="338" r="12"/><circle cx="228" cy="338" r="12"/><circle cx="323" cy="338" r="12"/>
    <circle cx="133" cy="456" r="12"/><circle cx="228" cy="456" r="12"/><circle cx="323" cy="456" r="12"/>
    <circle cx="1283" cy="338" r="12"/><circle cx="1378" cy="338" r="12"/><circle cx="1473" cy="338" r="12"/>
    <circle cx="1283" cy="511" r="12"/><circle cx="1378" cy="511" r="12"/><circle cx="1473" cy="511" r="12"/>
  </g>

  <g transform="translate(402 570) rotate(-8 120 70)" filter="url(#glow)">
    <path d="M14 28h206a24 24 0 0 1 24 24v72a24 24 0 0 1-24 24H14a24 24 0 0 1-24-24V52a24 24 0 0 1 24-24Z" fill="#182b38" stroke="url(#warn)" stroke-width="7"/>
    <path d="M35 62h105" stroke="#ffd791" stroke-width="14" stroke-linecap="round"/>
    <path d="M35 104h58" stroke="#f09a48" stroke-width="14" stroke-linecap="round"/>
    <path d="M170 72v39" stroke="#ffbd61" stroke-width="10" stroke-linecap="round"/>
    <circle cx="170" cy="130" r="7" fill="#ffbd61"/>
  </g>

  <g transform="translate(1110 604)" opacity=".72">
    <rect x="0" y="0" width="340" height="105" rx="52" fill="#0b2a39" stroke="#59d7cc" stroke-width="5"/>
    <path d="M60 52h220" stroke="#9cf5e5" stroke-width="10" stroke-linecap="round" stroke-dasharray="35 22"/>
  </g>

  <g opacity=".55" fill="#8deadd">
    <circle cx="348" cy="220" r="5"/><circle cx="431" cy="178" r="9"/><circle cx="1190" cy="230" r="6"/>
    <circle cx="1280" cy="753" r="9"/><circle cx="988" cy="735" r="5"/><circle cx="535" cy="770" r="6"/>
  </g>
</svg>
