<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected transfer boundary around a virtual guest</title>
  <desc id="desc">An abstract virtual guest window is protected by a luminous boundary that filters a descending file-transfer stream.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071627"/>
      <stop offset="0.55" stop-color="#123754"/>
      <stop offset="1" stop-color="#081b2f"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#63e4ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#63e4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d8ff"/>
      <stop offset="0.5" stop-color="#d1fbff"/>
      <stop offset="1" stop-color="#62e2b6"/>
    </linearGradient>
    <linearGradient id="guest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2879a8"/>
      <stop offset="1" stop-color="#183d72"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#020812" flood-opacity="0.55"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#a3d9ee" stroke-width="2" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="455" rx="610" ry="390" fill="url(#aura)"/>

  <g opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M325 180H1275" stroke="#36799e" stroke-width="28"/>
    <path d="M390 130H1210" stroke="#5fa6c3" stroke-width="6"/>
    <circle cx="455" cy="180" r="8" fill="#70dff5" stroke="none"/>
    <circle cx="495" cy="180" r="8" fill="#70dff5" stroke="none" opacity="0.65"/>
    <circle cx="535" cy="180" r="8" fill="#70dff5" stroke="none" opacity="0.4"/>
  </g>

  <g stroke-linecap="round">
    <path d="M620 210V328" stroke="#ffad78" stroke-width="22" opacity="0.22" filter="url(#blur)"/>
    <path d="M760 210V328" stroke="#75ccf0" stroke-width="18" opacity="0.38"/>
    <path d="M900 210V328" stroke="#75ccf0" stroke-width="18" opacity="0.38"/>
    <path d="M1040 210V328" stroke="#75ccf0" stroke-width="18" opacity="0.38"/>
    <path d="M620 210V328" stroke="#ff9b70" stroke-width="10" opacity="0.75"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="330" width="700" height="58" rx="29" fill="url(#barrier)"/>
    <circle cx="620" cy="359" r="50" fill="#b9f7ff" opacity="0.15"/>
    <circle cx="620" cy="359" r="70" fill="none" stroke="#89eeff" stroke-width="4" opacity="0.25"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="425" width="580" height="330" rx="48" fill="#081c34" stroke="#63cfe9" stroke-width="4"/>
    <rect x="555" y="470" width="490" height="220" rx="24" fill="url(#guest)"/>
    <path d="M555 530H1045" stroke="#8ce6f7" stroke-width="3" opacity="0.34"/>
    <circle cx="595" cy="500" r="8" fill="#7feaff"/>
    <circle cx="625" cy="500" r="8" fill="#7feaff" opacity="0.65"/>
    <circle cx="655" cy="500" r="8" fill="#7feaff" opacity="0.4"/>
    <path d="M650 610H950" stroke="#c0f4ff" stroke-width="10" stroke-linecap="round" opacity="0.42"/>
    <path d="M700 646H900" stroke="#77e4bd" stroke-width="8" stroke-linecap="round" opacity="0.62"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 535H420Q450 535 450 565V700Q450 730 480 730" stroke="#3c87aa" stroke-width="12" opacity="0.4"/>
    <path d="M1270 535H1180Q1150 535 1150 565V700Q1150 730 1120 730" stroke="#3c87aa" stroke-width="12" opacity="0.4"/>
  </g>
  <circle cx="450" cy="565" r="8" fill="#64dfbb"/>
  <circle cx="1150" cy="565" r="8" fill="#64dfbb"/>
</svg>
