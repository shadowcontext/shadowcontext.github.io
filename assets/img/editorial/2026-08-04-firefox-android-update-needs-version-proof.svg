    <rect x="104" y="82" width="472" height="548" rx="38" fill="url(#screen)"/>
    <rect x="255" y="48" width="170" height="17" rx="9" fill="#123d69"/>
    <circle cx="340" cy="670" r="22" fill="#173f69" stroke="#8ed8ff" stroke-width="3"/>
    <rect x="137" y="118" width="406" height="56" rx="28" fill="#1d5c91" opacity="0.92"/>
    <circle cx="174" cy="146" r="12" fill="#75e0c8"/>
