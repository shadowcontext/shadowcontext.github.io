    <path d="M151 248 C230 181 335 190 403 246 C467 299 478 390 429 456 C372 532 251 527 187 462 C127 401 109 300 151 248Z" fill="#2d78b7" opacity="0.9"/>
    <path d="M202 278 C255 233 327 237 375 278 C421 319 428 382 393 426 C351 478 269 476 224 431 C181 390 169 314 202 278Z" fill="#d8f5ff"/>
    <path d="M241 316 C278 283 329 288 359 320 C386 350 383 397 353 426 C322 456 271 449 246 414 C226 385 216 339 241 316Z" fill="#52b7d4"/>
  </g>
  <g opacity="0.86">
    <path d="M787 255 C922 201 1035 201 1166 247" fill="none" stroke="#78cce8" stroke-width="22" stroke-linecap="round"/>
    <path d="M815 340 C949 294 1051 297 1190 350" fill="none" stroke="#5aa9d0" stroke-width="30" stroke-linecap="round"/>
    <path d="M835 442 C965 405 1072 411 1213 470" fill="none" stroke="#4583b6" stroke-width="40" stroke-linecap="round"/>
    <circle cx="829" cy="251" r="14" fill="#bceeff"/><circle cx="867" cy="326" r="18" fill="#97ddf3"/><circle cx="894" cy="425" r="22" fill="#75c7e2"/>
  </g>
  <g filter="url(#shadow)" transform="translate(1050 260)">
    <path d="M190 10 C246 54 311 67 362 70 V235 C362 344 294 428 190 476 C86 428 18 344 18 235 V70 C69 67 134 54 190 10Z" fill="url(#shield)" stroke="#c5ffe8" stroke-width="6"/>
    <path d="M103 245 L165 307 L286 172" fill="none" stroke="#073f42" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M190 43 C239 77 291 89 329 91" fill="none" stroke="#d4fff0" stroke-opacity="0.5" stroke-width="9" stroke-linecap="round"/>
  </g>
  <path d="M1002 753 C1122 720 1285 718 1418 755" fill="none" stroke="#5ee0be" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>
  <circle cx="1030" cy="747" r="10" fill="#80f2ce"/><circle cx="1404" cy="752" r="10" fill="#80f2ce"/>
</svg>
