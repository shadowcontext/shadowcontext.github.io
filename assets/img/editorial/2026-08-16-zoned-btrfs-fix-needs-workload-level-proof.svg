<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A broken deadlock across zoned storage</title>
  <desc id="desc">Abstract vertical storage zones rise through a dark field as two converging currents meet an amber ring, opened by a bright teal separation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131c"/>
      <stop offset="0.5" stop-color="#102b38"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="zoneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31566a"/>
      <stop offset="1" stop-color="#132b3a"/>
    </linearGradient>
    <linearGradient id="zoneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6876"/>
      <stop offset="1" stop-color="#172f3d"/>
    </linearGradient>
    <linearGradient id="current" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58d6c3" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#9dfff0"/>
      <stop offset="1" stop-color="#2bc4bc" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffca72"/>
      <stop offset="0.55" stop-color="#e77c55"/>
      <stop offset="1" stop-color="#8f3e46"/>
    </linearGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#62f2dc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#62f2dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow">
      <stop offset="0" stop-color="#f79b5f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f79b5f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#c9edf2" opacity="0.09"/>
      <circle cx="22" cy="17" r="0.9" fill="#c9edf2" opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#02070a" flood-opacity="0.62"/>
    </filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="1025" cy="445" rx="470" ry="370" fill="url(#amberGlow)" filter="url(#blur)"/>
  <ellipse cx="806" cy="451" rx="260" ry="250" fill="url(#tealGlow)" filter="url(#blur)"/>
  <g opacity="0.92" filter="url(#shadow)">
