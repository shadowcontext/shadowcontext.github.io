  <ellipse cx="805" cy="475" rx="325" ry="265" fill="none" stroke="#66d8df" stroke-width="4" stroke-dasharray="22 24" opacity="0.44"/>
  <ellipse cx="805" cy="475" rx="265" ry="214" fill="none" stroke="#9debf0" stroke-width="2" opacity="0.3"/>
  <path d="M79 611C258 611 333 567 429 520C518 477 578 475 659 475" fill="none" stroke="#f6a92e" stroke-width="54" stroke-linecap="round" opacity="0.12" filter="url(#glow)"/>
  <path d="M79 611C258 611 333 567 429 520C518 477 578 475 659 475" fill="none" stroke="url(#amber)" stroke-width="15" stroke-linecap="round"/>
  <circle cx="101" cy="611" r="20" fill="#ffc252"/>
  <circle cx="101" cy="611" r="42" fill="none" stroke="#ffc252" stroke-width="3" opacity="0.35"/>
  <g transform="translate(545 219)" filter="url(#shadow)">
    <path d="M260 0L455 78V254C455 395 376 497 260 548C144 497 65 395 65 254V78L260 0Z" fill="#0b2134" stroke="#8ce5eb" stroke-width="5"/>
    <path d="M260 42L413 103V252C413 360 356 438 260 486C164 438 107 360 107 252V103L260 42Z" fill="url(#vault)" opacity="0.92"/>
