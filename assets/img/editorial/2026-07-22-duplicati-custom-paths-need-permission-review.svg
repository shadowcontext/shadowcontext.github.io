<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected backup path and permission boundary</title>
  <desc id="desc">An abstract blue backup vault sits inside layered access-control rings while an amber path is redirected toward a guarded boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#0b2740"/>
      <stop offset="1" stop-color="#12324b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#41c7d8" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#217a99" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e1e8"/>
      <stop offset="0.46" stop-color="#2aa3bd"/>
      <stop offset="1" stop-color="#17617d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb33b" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#ffc75a"/>
      <stop offset="1" stop-color="#ffe1a1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020a12" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <g opacity="0.12" fill="none" stroke="#8de8ee" stroke-width="2">
