  </g>
  <g fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.84">
    <path d="M998 450h104l62-142h126"/>
    <path d="M998 450h150l78-68h160"/>
    <path d="M998 450h194l102 28h150"/>
    <path d="M998 450h126l72 128h176"/>
    <path d="M998 450h74l88 214h144"/>
  </g>
  <g fill="#0b1d2b" stroke-width="4" filter="url(#glow)">
