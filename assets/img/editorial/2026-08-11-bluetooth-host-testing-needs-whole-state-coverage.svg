    <circle cx="1294" cy="478" r="10" stroke="#83e9c5"/>
    <circle cx="1196" cy="578" r="10" stroke="#98efae"/>
    <circle cx="1160" cy="664" r="10" stroke="#a9f799"/>
  </g>
  <g fill="#bfffee" opacity="0.42">
    <circle cx="1090" cy="246" r="4"/><circle cx="1240" cy="236" r="4"/><circle cx="1478" cy="346" r="4"/>
    <circle cx="1502" cy="548" r="4"/><circle cx="1422" cy="696" r="4"/><circle cx="1052" cy="726" r="4"/>
