<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Browser-built page crossing layered inspection points</title>
  <desc id="desc">Abstract editorial artwork showing an amber redirect path entering a browser window where luminous fragments assemble into a page, surrounded by layered teal security checkpoints.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="70" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071623"/>
      <stop offset="0.52" stop-color="#0B2934"/>
      <stop offset="1" stop-color="#051019"/>
    </linearGradient>
    <linearGradient id="window" x1="480" y1="190" x2="1120" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123C49" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#071A25" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="path" x1="100" y1="452" x2="1465" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD078"/>
      <stop offset="0.42" stop-color="#F29C59"/>
      <stop offset="0.68" stop-color="#75ECD4"/>
      <stop offset="1" stop-color="#B3FFF0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(804 454) rotate(90) scale(390 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45D7C2" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#45D7C2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="viewport">
      <rect x="502" y="276" width="596" height="367" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="804" cy="454" rx="540" ry="408" fill="url(#aura)"/>
  <circle cx="275" cy="228" r="104" fill="#F0A55F" fill-opacity="0.08" filter="url(#soft)"/>
  <circle cx="1335" cy="684" r="132" fill="#40DBC3" fill-opacity="0.1" filter="url(#soft)"/>

