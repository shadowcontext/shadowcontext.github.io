<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected session boundary around an endpoint-management hub</title>
  <desc id="desc">Abstract editorial artwork showing a luminous central management hub behind layered security arcs, with session tokens held outside and orderly device paths inside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081728"/>
      <stop offset="0.55" stop-color="#102841"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#58e0d1" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#2c8ea3" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#10243c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8df3dc"/>
      <stop offset="1" stop-color="#2e91a8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b75e"/>
      <stop offset="1" stop-color="#f47f62"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8eb6c9" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="456" rx="585" ry="390" fill="url(#glow)"/>

