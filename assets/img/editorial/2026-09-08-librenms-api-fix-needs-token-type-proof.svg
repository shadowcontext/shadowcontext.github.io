<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded API token boundary around a network observability hub</title>
  <desc id="desc">An abstract blue network observability hub and device nodes sit behind a luminous API boundary while a malformed amber token is stopped outside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.55" stop-color="#0a2638"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#37d5ff" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#138db8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#071522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75e7ff"/>
      <stop offset="0.48" stop-color="#249bc4"/>
      <stop offset="1" stop-color="#173f67"/>
    </linearGradient>
    <linearGradient id="token" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd06a"/>
      <stop offset="1" stop-color="#e66b35"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="925" cy="450" r="430" fill="url(#halo)"/>
  <path d="M0 710 C250 600 410 750 650 662 S1060 535 1600 650 L1600 900 L0 900Z" fill="#06101a" opacity="0.72"/>

  <g opacity="0.28" fill="none" stroke="#40b7d8" stroke-width="2">
    <path d="M735 226 L930 143 L1132 244 L1247 433 L1188 651 L974 760 L755 680 L628 489Z"/>
    <path d="M814 288 L946 231 L1083 301 L1158 440 L1114 586 L964 663 L820 610 L733 474Z"/>
  </g>

  <g stroke="#2f9fc5" stroke-width="5" opacity="0.78">
    <path d="M932 446 L768 337 M932 446 L1111 326 M932 446 L1130 570 M932 446 L777 611 M932 446 L973 704"/>
  </g>
  <g fill="#0f3249" stroke="#68dcf6" stroke-width="5">
    <circle cx="768" cy="337" r="31"/>
    <circle cx="1111" cy="326" r="31"/>
    <circle cx="1130" cy="570" r="31"/>
    <circle cx="777" cy="611" r="31"/>
    <circle cx="973" cy="704" r="31"/>
  </g>

  <circle cx="932" cy="446" r="223" fill="none" stroke="#123d58" stroke-width="54" opacity="0.6"/>
  <circle cx="932" cy="446" r="223" fill="none" stroke="url(#ring)" stroke-width="13" stroke-dasharray="86 20" filter="url(#glow)"/>
  <circle cx="932" cy="446" r="119" fill="#0b2638" stroke="#6de4fb" stroke-width="8"/>
  <circle cx="932" cy="446" r="74" fill="#123e59"/>
  <path d="M885 462 C905 417 930 397 951 416 C973 436 994 419 1010 386" fill="none" stroke="#8cecff" stroke-width="13" stroke-linecap="round"/>
  <circle cx="885" cy="462" r="12" fill="#8cecff"/>
  <circle cx="951" cy="416" r="12" fill="#8cecff"/>
  <circle cx="1010" cy="386" r="12" fill="#8cecff"/>

  <path d="M382 450 C487 450 566 450 682 450" fill="none" stroke="#df7c3a" stroke-width="8" stroke-dasharray="18 22" opacity="0.9"/>
  <path d="M681 409 L732 450 L681 491Z" fill="#ffb657" filter="url(#glow)"/>
  <path d="M309 382 L435 382 L490 450 L435 518 L309 518 L254 450Z" fill="url(#token)" opacity="0.96"/>
  <path d="M312 423 L353 423 L353 401 L391 450 L353 499 L353 477 L312 477Z" fill="#522719" opacity="0.78"/>
  <circle cx="708" cy="450" r="47" fill="#0b2232" stroke="#ffc368" stroke-width="9"/>
  <path d="M686 428 L730 472 M730 428 L686 472" stroke="#ffc368" stroke-width="10" stroke-linecap="round"/>

  <g opacity="0.18" filter="url(#soft)">
    <ellipse cx="338" cy="450" rx="150" ry="102" fill="#ff8a3d"/>
    <ellipse cx="934" cy="446" rx="245" ry="245" fill="#28c9ef"/>
  </g>
  <g fill="#8eeaff" opacity="0.5">
    <circle cx="1305" cy="190" r="5"/><circle cx="1372" cy="254" r="8"/><circle cx="1281" cy="722" r="7"/>
    <circle cx="546" cy="194" r="6"/><circle cx="491" cy="691" r="5"/><circle cx="1440" cy="510" r="5"/>
  </g>
</svg>
