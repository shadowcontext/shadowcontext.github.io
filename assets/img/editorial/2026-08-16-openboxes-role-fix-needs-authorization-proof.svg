<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Inventory objects meet a protected authorization boundary</title>
  <desc id="desc">Polished abstract editorial artwork showing layered inventory boxes approaching a luminous central boundary, with elevated access paths sealed behind it.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1480" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102849"/>
      <stop offset="1" stop-color="#06111F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(865 446) rotate(90) scale(390 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D9D0" stop-opacity="0.27"/>
      <stop offset="0.55" stop-color="#1A8A9A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="770" y1="165" x2="935" y2="742" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BF1DE" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#5FE2CF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#2BA7B3" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="boxA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2D648C"/>
      <stop offset="1" stop-color="#163855"/>
    </linearGradient>
    <linearGradient id="boxB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3C7EA1"/>
      <stop offset="1" stop-color="#1B4964"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD58A"/>
      <stop offset="1" stop-color="#D98738"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-80%" y="-20%" width="260%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leftField"><rect x="90" y="105" width="665" height="690" rx="54"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="865" cy="446" rx="520" ry="390" fill="url(#halo)"/>
