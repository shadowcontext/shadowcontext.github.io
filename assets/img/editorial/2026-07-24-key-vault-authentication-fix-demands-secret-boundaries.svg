<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered boundaries around a cloud secret vault</title>
  <desc id="desc">Abstract editorial artwork showing a radiant vault aperture, separate protected secret capsules, and layered identity and network boundaries.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset=".48" stop-color="#14283d"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#5be6d1" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#4576ba" stop-opacity=".14"/>
      <stop offset="1" stop-color="#07101d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#98fff0"/>
      <stop offset=".48" stop-color="#4bc8d3"/>
      <stop offset="1" stop-color="#4965ba"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#213f58"/>
      <stop offset="1" stop-color="#0b1726"/>
    </linearGradient>
    <linearGradient id="secretA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1ad"/>
      <stop offset="1" stop-color="#f09762"/>
    </linearGradient>
    <linearGradient id="secretB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fff8"/>
      <stop offset="1" stop-color="#5ad8c5"/>
    </linearGradient>
    <linearGradient id="secretC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbdcff"/>
      <stop offset="1" stop-color="#7588e8"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#d9fff8" opacity=".07"/>
      <circle cx="57" cy="39" r=".8" fill="#d9fff8" opacity=".06"/>
      <circle cx="31" cy="64" r="1.1" fill="#d9fff8" opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="438" rx="680" ry="438" fill="url(#aura)"/>
  <ellipse cx="800" cy="806" rx="500" ry="54" fill="#02060c" opacity=".72" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M84 245 C300 116 436 126 567 258" stroke="#294763" stroke-width="4" opacity=".65"/>
    <path d="M1516 245 C1300 116 1164 126 1033 258" stroke="#294763" stroke-width="4" opacity=".65"/>
    <path d="M84 654 C300 783 436 773 567 641" stroke="#294763" stroke-width="4" opacity=".65"/>
    <path d="M1516 654 C1300 783 1164 773 1033 641" stroke="#294763" stroke-width="4" opacity=".65"/>
    <path d="M188 450 H480" stroke="#345879" stroke-width="18" opacity=".42"/>
    <path d="M1120 450 H1412" stroke="#345879" stroke-width="18" opacity=".42"/>
  </g>

  <g fill="#183148" stroke="#46708c" stroke-width="3">
    <circle cx="174" cy="245" r="34"/>
    <circle cx="142" cy="450" r="46"/>
    <circle cx="174" cy="654" r="34"/>
    <circle cx="1426" cy="245" r="34"/>
    <circle cx="1458" cy="450" r="46"/>
    <circle cx="1426" cy="654" r="34"/>
  </g>
  <g fill="#75e5d7" opacity=".78">
    <circle cx="174" cy="245" r="8"/>
    <circle cx="142" cy="450" r="10"/>
    <circle cx="174" cy="654" r="8"/>
    <circle cx="1426" cy="245" r="8"/>
    <circle cx="1458" cy="450" r="10"/>
    <circle cx="1426" cy="654" r="8"/>
  </g>

  <g transform="translate(800 450)">
    <circle r="326" fill="#091522" stroke="#28445b" stroke-width="3"/>
    <circle r="286" fill="none" stroke="#385b74" stroke-width="22" opacity=".65"/>
    <circle r="242" fill="none" stroke="url(#gate)" stroke-width="9" stroke-dasharray="165 28 58 24" opacity=".85"/>
    <circle r="202" fill="#0c1c2c" stroke="#6fe2d5" stroke-width="4" opacity=".98"/>

    <g fill="none" stroke="#7ae9dc" stroke-linecap="round">
      <path d="M-278 -70 A286 286 0 0 1 -214 -190" stroke-width="16" opacity=".72"/>
      <path d="M278 70 A286 286 0 0 1 214 190" stroke-width="16" opacity=".72"/>
      <path d="M-172 172 A242 242 0 0 1 -224 91" stroke-width="8" opacity=".78"/>
      <path d="M172 -172 A242 242 0 0 1 224 -91" stroke-width="8" opacity=".78"/>
    </g>

    <circle r="158" fill="url(#vault)" stroke="#89f3e3" stroke-width="5" filter="url(#glow)"/>
    <circle r="126" fill="#07111d" stroke="#355a73" stroke-width="3"/>
    <path d="M-43 -75 H43 Q72 -75 72 -46 V-21 H-72 V-46 Q-72 -75 -43 -75Z" fill="#17324a" stroke="#75ded2" stroke-width="5"/>
    <path d="M-90 -20 H90 V83 Q90 105 68 105 H-68 Q-90 105 -90 83Z" fill="#12283c" stroke="#75ded2" stroke-width="5"/>

    <g filter="url(#glow)">
      <g transform="translate(-50 30)">
        <rect x="-22" y="-28" width="44" height="62" rx="20" fill="url(#secretA)"/>
        <circle cy="-8" r="7" fill="#713e38" opacity=".72"/>
        <path d="M0 0 V17" stroke="#713e38" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g transform="translate(0 30)">
        <rect x="-22" y="-28" width="44" height="62" rx="20" fill="url(#secretB)"/>
        <circle cy="-8" r="7" fill="#1b5d67" opacity=".72"/>
        <path d="M0 0 V17" stroke="#1b5d67" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g transform="translate(50 30)">
        <rect x="-22" y="-28" width="44" height="62" rx="20" fill="url(#secretC)"/>
        <circle cy="-8" r="7" fill="#384e8a" opacity=".72"/>
        <path d="M0 0 V17" stroke="#384e8a" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g fill="none" stroke="#8ceee1" stroke-linecap="round" opacity=".75">
    <path d="M176 245 C365 245 420 310 510 336" stroke-width="6"/>
    <path d="M188 450 H472" stroke-width="7"/>
    <path d="M176 654 C365 654 420 590 510 564" stroke-width="6"/>
    <path d="M1424 245 C1235 245 1180 310 1090 336" stroke-width="6"/>
    <path d="M1412 450 H1128" stroke-width="7"/>
    <path d="M1424 654 C1235 654 1180 590 1090 564" stroke-width="6"/>
  </g>

  <g fill="#effffc" filter="url(#glow)">
    <circle cx="472" cy="450" r="7"/>
    <circle cx="1128" cy="450" r="7"/>
    <circle cx="510" cy="336" r="6"/>
    <circle cx="1090" cy="336" r="6"/>
    <circle cx="510" cy="564" r="6"/>
    <circle cx="1090" cy="564" r="6"/>
  </g>
</svg>
