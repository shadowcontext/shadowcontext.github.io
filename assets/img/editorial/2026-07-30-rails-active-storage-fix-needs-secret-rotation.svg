<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded image processing and isolated application secrets</title>
  <desc id="desc">Abstract image tiles move through a protected processing aperture while key-like forms are isolated within luminous concentric rings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081525"/>
      <stop offset="0.52" stop-color="#102d42"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#2be0c1" stop-opacity=".28"/>
      <stop offset=".52" stop-color="#168bb0" stop-opacity=".1"/>
      <stop offset="1" stop-color="#06111e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7af3d6" stop-opacity=".82"/>
      <stop offset=".55" stop-color="#35acd1" stop-opacity=".54"/>
      <stop offset="1" stop-color="#4761b8" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54efd2"/>
      <stop offset=".5" stop-color="#b5fff0"/>
      <stop offset="1" stop-color="#46a9cf"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd982"/>
      <stop offset="1" stop-color="#f29e56"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <clipPath id="aperture">
      <path d="M695 190 L850 142 L1000 222 L1042 384 L960 530 L805 576 L658 493 L618 333 Z"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <ellipse cx="820" cy="740" rx="620" ry="105" fill="#020914" opacity=".66" filter="url(#soft)"/>

  <g opacity=".2" fill="none" stroke="#68d9d1">
    <path d="M42 166 C310 66 475 107 640 230"/>
    <path d="M22 714 C258 790 462 737 626 616"/>
    <path d="M1070 176 C1240 92 1437 117 1580 224"/>
    <path d="M1068 652 C1275 755 1434 737 1588 623"/>
  </g>

  <g transform="translate(78 0)">
    <g transform="translate(0 232) rotate(-8 185 120)">
      <rect x="24" y="17" width="330" height="220" rx="28" fill="#071725" stroke="#6debd4" stroke-opacity=".42" stroke-width="3"/>
      <rect x="42" y="35" width="294" height="184" rx="18" fill="url(#tile)" opacity=".65"/>
      <circle cx="112" cy="92" r="28" fill="#d6fff4" opacity=".65"/>
      <path d="M43 185 L129 118 L194 164 L246 113 L336 192 L336 219 L42 219 Z" fill="#163c62" opacity=".88"/>
    </g>
    <g transform="translate(212 444) rotate(7 150 100)" opacity=".72">
      <rect x="10" y="12" width="292" height="194" rx="25" fill="#091b2b" stroke="#47bbcd" stroke-width="3"/>
      <rect x="27" y="29" width="258" height="160" rx="16" fill="url(#tile)" opacity=".48"/>
      <circle cx="215" cy="77" r="21" fill="#c8fff3" opacity=".48"/>
      <path d="M27 167 L102 104 L151 141 L202 98 L285 169 L285 189 L27 189 Z" fill="#173452" opacity=".92"/>
    </g>
    <g transform="translate(357 154) rotate(13 112 75)" opacity=".48">
      <rect x="8" y="8" width="224" height="148" rx="20" fill="#0c2132" stroke="#5ed9d2" stroke-width="3"/>
      <path d="M24 132 L79 78 L120 111 L158 68 L216 127 L216 140 L24 140 Z" fill="#3b8eac"/>
    </g>
  </g>

  <g>
    <path d="M695 190 L850 142 L1000 222 L1042 384 L960 530 L805 576 L658 493 L618 333 Z" fill="#06101d" stroke="#214962" stroke-width="46" stroke-linejoin="round"/>
    <path d="M695 190 L850 142 L1000 222 L1042 384 L960 530 L805 576 L658 493 L618 333 Z" fill="none" stroke="url(#gate)" stroke-width="9" stroke-linejoin="round" filter="url(#glow)"/>
    <g clip-path="url(#aperture)">
      <rect x="610" y="135" width="445" height="450" fill="#091b29"/>
      <path d="M610 248 C730 185 911 198 1054 280 L1054 410 C887 331 760 338 610 410 Z" fill="#29c9bd" opacity=".18"/>
      <path d="M647 446 C748 358 914 349 1024 420" fill="none" stroke="#82f5de" stroke-opacity=".38" stroke-width="28"/>
      <circle cx="839" cy="359" r="100" fill="#112e42" stroke="#78ead7" stroke-opacity=".65" stroke-width="4"/>
      <circle cx="839" cy="359" r="68" fill="#06121e" stroke="#4baac1" stroke-width="3"/>
      <path d="M794 360 L824 392 L888 319" fill="none" stroke="#a9ffed" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    </g>
    <g fill="#c4fff2">
      <circle cx="675" cy="228" r="7"/><circle cx="958" cy="251" r="7"/>
      <circle cx="985" cy="452" r="7"/><circle cx="724" cy="507" r="7"/>
    </g>
  </g>

  <g transform="translate(1168 430)">
    <circle cx="150" cy="126" r="205" fill="#e8a14b" opacity=".06" filter="url(#glow)"/>
    <circle cx="150" cy="126" r="184" fill="none" stroke="#4b7c93" stroke-width="3" stroke-dasharray="5 15"/>
    <circle cx="150" cy="126" r="145" fill="#071522" stroke="#efb65f" stroke-opacity=".58" stroke-width="4"/>
    <circle cx="150" cy="126" r="105" fill="#0c2331" stroke="#ffd77e" stroke-opacity=".72" stroke-width="5"/>
    <circle cx="108" cy="88" r="31" fill="none" stroke="url(#vault)" stroke-width="17" filter="url(#glow)"/>
    <path d="M130 111 L218 199 M185 166 L209 142 M207 188 L231 164" fill="none" stroke="url(#vault)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <g fill="#6fe4d5" opacity=".72">
      <circle cx="150" cy="-58" r="8"/><circle cx="332" cy="126" r="8"/>
      <circle cx="150" cy="310" r="8"/><circle cx="-32" cy="126" r="8"/>
    </g>
  </g>

  <path d="M1047 382 C1112 391 1148 421 1181 468" fill="none" stroke="#68e7d5" stroke-opacity=".48" stroke-width="5" stroke-dasharray="8 17"/>
  <g opacity=".72">
    <circle cx="1080" cy="397" r="7" fill="#92f9e5"/>
    <circle cx="1121" cy="417" r="6" fill="#6ed7d3"/>
    <circle cx="1155" cy="448" r="5" fill="#f2c36d"/>
  </g>
</svg>
