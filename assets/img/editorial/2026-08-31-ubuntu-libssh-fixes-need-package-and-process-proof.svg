<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Encrypted connection crossing package and process boundaries</title>
  <desc id="desc">An abstract encrypted connection moves through layered package seals into a luminous verified process boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="90" x2="1480" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131D"/>
      <stop offset="0.5" stop-color="#102B38"/>
      <stop offset="1" stop-color="#071A2A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1090 450) rotate(90) scale(360 510)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65F4C2" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#28B8C9" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#28B8C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="105" y1="450" x2="1485" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E91B0" stop-opacity="0.08"/>
      <stop offset="0.28" stop-color="#55C9D8"/>
      <stop offset="0.68" stop-color="#70F1C0"/>
      <stop offset="1" stop-color="#B4FFE0" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="seal" x1="585" y1="250" x2="874" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#88F8D1"/>
      <stop offset="1" stop-color="#258FAE"/>
    </linearGradient>
    <linearGradient id="boundary" x1="1006" y1="215" x2="1320" y2="696" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D2FFEE"/>
      <stop offset="0.45" stop-color="#65EEC0"/>
      <stop offset="1" stop-color="#2A9EB9"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grain" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="13" r="1" fill="#C9FFEC" opacity="0.06"/>
      <circle cx="39" cy="31" r="0.8" fill="#65DDE6" opacity="0.06"/>
      <circle cx="21" cy="48" r="0.7" fill="#C9FFEC" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="38" fill="url(#grain)"/>
  <ellipse cx="1090" cy="450" rx="510" ry="360" fill="url(#halo)"/>

