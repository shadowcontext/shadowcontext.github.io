<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified permission paths across a cloud workspace</title>
  <desc id="desc">An abstract cloud workspace of layered file panels passes through a luminous permission portal, with constrained paths and protective rings expressing verified sharing controls.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152F"/>
      <stop offset="0.52" stop-color="#102D52"/>
      <stop offset="1" stop-color="#071B28"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(887 430) rotate(90) scale(360 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3BE0D0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3BE0D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="360" y1="240" x2="1030" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CDCF5" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#2B79AD" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="gate" x1="1020" y1="254" x2="1260" y2="665" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BF4DC"/>
      <stop offset="1" stop-color="#25A9B3"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020A16" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="portalClip">
      <rect x="1041" y="286" width="174" height="316" rx="87"/>
    </clipPath>
  </defs>
