    <path d="M0 48v79l76 44V93z" fill="#c76757"/>
    <path d="M152 48v79l-76 44V93z" fill="#934757"/>
  </g>
  <path d="M1262 474 C1276 548 1230 597 1178 622" fill="none" stroke="#ffb86b" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 18"/>
  <path d="m1188 595-15 29 32 4" fill="none" stroke="#ffb86b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(800 178)">
    <path d="M0 0c74 38 132 40 132 40v104c0 91-53 144-132 184-79-40-132-93-132-184V40S-74 38 0 0z" fill="#0b2940" stroke="#73f3df" stroke-width="8"/>
    <path d="m-52 151 34 34 74-82" fill="none" stroke="#bafff4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="280" cy="254" r="8" fill="#59dccb" opacity="0.75"/>
  <circle cx="1328" cy="666" r="11" fill="#4b83ff" opacity="0.7"/>
  <circle cx="247" cy="670" r="5" fill="#ffbd6c" opacity="0.75"/>
