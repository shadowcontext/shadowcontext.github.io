  <path d="M800 169v171M800 558v175" stroke="#79F4DA" stroke-width="5" stroke-linecap="round" opacity=".82"/>
  <circle cx="800" cy="449" r="103" fill="#0A2132" stroke="#6DEBD3" stroke-width="5"/>
  <circle cx="800" cy="449" r="77" fill="#102F43" stroke="#75AFFF" stroke-opacity=".75" stroke-width="3"/>

  <g fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M744 434c18-35 42-54 75-54 36 0 65 27 65 62 0 28-17 48-42 58"/>
    <path d="M737 469c23 31 54 48 87 48 20 0 39-7 55-19"/>
    <path d="M773 388c-13 22-14 47-2 70 11 21 31 36 55 40"/>
    <path d="M828 386c15 17 23 38 21 62-1 17-8 32-20 45"/>
