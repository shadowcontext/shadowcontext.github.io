<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded AI access across layered software repositories</title>
  <desc id="desc">Abstract layered code repositories are separated by luminous access boundaries while an AI-shaped signal passes through a guarded central aperture.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1490" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08132B"/>
      <stop offset="0.48" stop-color="#102A45"/>
      <stop offset="1" stop-color="#071A24"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(820 434) rotate(90) scale(360 560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39E6C5" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#4D8CFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#4D8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planeLeft" x1="150" y1="235" x2="725" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4C72"/>
      <stop offset="1" stop-color="#0C243D"/>
    </linearGradient>
    <linearGradient id="planeRight" x1="1450" y1="235" x2="875" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#244D69"/>
      <stop offset="1" stop-color="#0A2735"/>
    </linearGradient>
    <linearGradient id="gate" x1="760" y1="170" x2="850" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70F2DA" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#72A8FF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#37D6B7" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="signal" x1="570" y1="310" x2="1035" y2="585" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66A6FF"/>
      <stop offset=".5" stop-color="#D6FFF5"/>
      <stop offset="1" stop-color="#49E5BE"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="11" r="1" fill="#BDEBFF" opacity=".09"/>
      <circle cx="51" cy="37" r=".8" fill="#BDEBFF" opacity=".07"/>
      <circle cx="26" cy="63" r=".7" fill="#71EFD0" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g opacity=".3" fill="none" stroke="#5C9AC3">
    <path d="M0 160C230 118 358 191 526 154S862 95 1051 146s346 47 549-2" stroke-width="2"/>
    <path d="M0 757c228-43 389 32 572-8s323-72 512-22 348 63 516 8" stroke-width="2"/>
  </g>

  <g>
    <path d="M120 294 603 179l151 124-483 126z" fill="url(#planeLeft)" stroke="#5B9CD1" stroke-opacity=".42" stroke-width="3"/>
    <path d="m155 405 483-121 116 96-483 127z" fill="#0D2944" stroke="#477EA8" stroke-opacity=".46" stroke-width="3"/>
