    <path d="M1407 522 935 401l-90 74 472 128z" fill="#092731" stroke="#438D88" stroke-opacity=".4" stroke-width="3"/>
    <path d="M1363 644 911 525l-67 56 452 126z" fill="#071F29" stroke="#3E7C78" stroke-opacity=".38" stroke-width="3"/>
  </g>

  <g fill="none" stroke-linecap="round">
