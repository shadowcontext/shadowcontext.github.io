    <circle cx="773" cy="388" r="9"/>
    <circle cx="828" cy="386" r="9"/>
    <circle cx="884" cy="442" r="9"/>
    <circle cx="879" cy="498" r="9"/>
    <circle cx="824" cy="517" r="9"/>
    <circle cx="737" cy="469" r="9"/>
    <circle cx="826" cy="498" r="8"/>
  </g>

  <g>
    <circle cx="635" cy="449" r="13" fill="#76ADFF"/>
    <circle cx="965" cy="449" r="13" fill="#58E4C4"/>
