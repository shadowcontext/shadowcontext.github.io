    <path d="M472 290C547 279 620 315 664 377" fill="none" stroke="#D9E7EF" stroke-opacity="0.72" stroke-width="58" stroke-linecap="round"/>
    <path d="M701 422L674 389M684 566L712 529" stroke="#FF806C" stroke-width="16" stroke-linecap="round"/>
    <rect x="364" y="382" width="235" height="154" rx="28" fill="#E8F4F8" fill-opacity="0.95"/>
