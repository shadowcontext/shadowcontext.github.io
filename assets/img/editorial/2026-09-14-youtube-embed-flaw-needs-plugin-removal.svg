<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Retiring a vulnerable video-gallery plugin</title>
  <desc id="desc">Abstract video tiles separate from a fractured plugin ring while a layered blue shield contains a red stream representing untrusted stored content.</desc>
  <defs>
    <linearGradient id="bg" x1="100" y1="80" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08182E"/>
      <stop offset="0.52" stop-color="#102E4D"/>
      <stop offset="1" stop-color="#071321"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1030 430) rotate(150) scale(620 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27C7E8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#27C7E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="850" y1="225" x2="1120" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DE7F4"/>
      <stop offset="0.46" stop-color="#22A7D6"/>
      <stop offset="1" stop-color="#1461A3"/>
    </linearGradient>
    <linearGradient id="danger" x1="365" y1="478" x2="890" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF806C" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#FF5A5F" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#FFB07C"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#020913" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <path d="M0 724C255 635 442 770 676 702C924 630 1117 481 1600 571V900H0Z" fill="#07101D" fill-opacity="0.72"/>
  <path d="M0 225C270 305 436 191 683 247C973 313 1156 198 1600 111" fill="none" stroke="#4FD9E9" stroke-opacity="0.08" stroke-width="2"/>

  <g opacity="0.55">
    <circle cx="175" cy="176" r="5" fill="#59D7EA"/>
    <circle cx="1425" cy="218" r="4" fill="#59D7EA"/>
    <circle cx="1338" cy="728" r="6" fill="#59D7EA"/>
    <circle cx="247" cy="716" r="3" fill="#59D7EA"/>
  </g>

