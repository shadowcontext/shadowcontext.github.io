  </g>

  <g transform="rotate(-8 690 266)" filter="url(#shadow)">
    <rect x="596" y="211" width="188" height="116" rx="22" fill="#B7D3DE" fill-opacity="0.9"/>
    <path d="M674 241L725 269L674 297Z" fill="#255D7A"/>
  </g>
  <g transform="rotate(10 636 692)" filter="url(#shadow)">
    <rect x="556" y="638" width="160" height="104" rx="20" fill="#9EB9C7" fill-opacity="0.75"/>
    <path d="M621 666L666 690L621 716Z" fill="#274E68"/>
  </g>

  <path d="M544 472C653 443 729 506 847 466" fill="none" stroke="#FF5A5F" stroke-opacity="0.25" stroke-width="48" filter="url(#glow)"/>
  <path d="M544 472C653 443 729 506 847 466" fill="none" stroke="url(#danger)" stroke-width="18" stroke-linecap="round" stroke-dasharray="30 22"/>
  <circle cx="686" cy="468" r="12" fill="#FFD0A8"/>
  <circle cx="773" cy="480" r="8" fill="#FF8C77"/>

  <g filter="url(#shadow)">
    <path d="M1004 204C1068 250 1135 264 1202 267V444C1202 578 1125 681 1004 736C883 681 806 578 806 444V267C873 264 940 250 1004 204Z" fill="#071D32" stroke="#8CE8F3" stroke-opacity="0.38" stroke-width="12"/>
