  <path d="M762 416L790 474L757 527" fill="none" stroke="#FF6B67" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <g opacity="0.7">
    <rect x="1268" y="337" width="144" height="90" rx="18" fill="#153D5A" stroke="#4AC7DE" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M1327 360L1366 382L1327 404Z" fill="#8CE8F3"/>
    <rect x="1251" y="456" width="190" height="18" rx="9" fill="#3284A4" fill-opacity="0.55"/>
    <rect x="1280" y="493" width="132" height="14" rx="7" fill="#3284A4" fill-opacity="0.35"/>
  </g>
</svg>
