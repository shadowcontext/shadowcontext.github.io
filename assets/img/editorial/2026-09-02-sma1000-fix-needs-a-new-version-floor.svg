    <path d="M458 352c186 0 268 98 434 98" stroke="#b58386" stroke-width="5" opacity="0.3"/>
    <path d="M458 548c186 0 268-98 434-98" stroke="#b58386" stroke-width="5" opacity="0.3"/>
  </g>
  <g>
