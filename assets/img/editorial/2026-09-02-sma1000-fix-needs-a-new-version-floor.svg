<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Remote-access gateway moving to a new protected firmware layer</title>
  <desc id="desc">Abstract editorial image of two fading gateway layers converging through a luminous aperture into a newly protected shield.</desc>
  <defs>
    <linearGradient id="background" x1="110" y1="70" x2="1490" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.48" stop-color="#142342"/>
      <stop offset="1" stop-color="#070d1b"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(1014 450) rotate(180) scale(650 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42d7c7" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#2775b8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oldLayer" x1="220" y1="210" x2="780" y2="670" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a06786" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d29a79" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="newLayer" x1="870" y1="210" x2="1370" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9affdf"/>
      <stop offset="0.48" stop-color="#3bd2c9"/>
      <stop offset="1" stop-color="#2d75c2"/>
    </linearGradient>
    <linearGradient id="stream" x1="260" y1="450" x2="1360" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c1848d" stop-opacity="0.12"/>
      <stop offset="0.57" stop-color="#e4b17f" stop-opacity="0.78"/>
      <stop offset="0.7" stop-color="#7aead2"/>
      <stop offset="1" stop-color="#b8ffe9" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
