<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected endpoint service boundary</title>
  <desc id="desc">Abstract editorial illustration of a Windows endpoint fleet surrounding a luminous privileged service core while a low-privilege access path is stopped at a protected boundary.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="40" x2="1510" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071424"/>
      <stop offset="0.5" stop-color="#102D46"/>
      <stop offset="1" stop-color="#151B34"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientTransform="translate(844 437) rotate(90) scale(400 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56E1CE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#56E1CE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="640" y1="235" x2="1055" y2="686" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78F1D6"/>
      <stop offset="0.52" stop-color="#28AFC4"/>
      <stop offset="1" stop-color="#526CD0"/>
    </linearGradient>
    <linearGradient id="core" x1="716" y1="304" x2="952" y2="577" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFFFF7"/>
      <stop offset="1" stop-color="#70DCD0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D536C"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020812" flood-opacity="0.58"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#coreGlow)"/>
  <ellipse cx="840" cy="754" rx="430" ry="62" fill="#020A13" opacity="0.46" filter="url(#blur)"/>
  <circle cx="192" cy="146" r="104" fill="#2C7890" opacity="0.11"/>
  <circle cx="1445" cy="720" r="180" fill="#5A54B2" opacity="0.1"/>

  <g fill="none" stroke-linecap="round">
