      <path d="M73 137H177M125 117V137" stroke="#66CDBF" stroke-width="9" stroke-linecap="round"/>
      <circle cx="191" cy="56" r="8" fill="#65E0CB"/>
    </g>
    <g transform="translate(1190 171)">
      <rect width="250" height="170" rx="28" fill="url(#tile)" stroke="#4E8CA2" stroke-width="3"/>
      <rect x="34" y="34" width="182" height="83" rx="12" fill="#081B2A"/>
      <path d="M73 137H177M125 117V137" stroke="#66CDBF" stroke-width="9" stroke-linecap="round"/>
      <circle cx="59" cy="56" r="8" fill="#65E0CB"/>
    </g>
    <g transform="translate(1215 558)">
      <rect width="250" height="170" rx="28" fill="url(#tile)" stroke="#4E8CA2" stroke-width="3"/>
      <rect x="34" y="34" width="182" height="83" rx="12" fill="#081B2A"/>
      <path d="M73 137H177M125 117V137" stroke="#66CDBF" stroke-width="9" stroke-linecap="round"/>
      <circle cx="59" cy="56" r="8" fill="#65E0CB"/>
