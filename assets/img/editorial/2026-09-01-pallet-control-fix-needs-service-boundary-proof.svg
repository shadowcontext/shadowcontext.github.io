    <path d="M832 305L951 352V441C951 521 906 582 832 619C758 582 713 521 713 441V352L832 305Z" fill="url(#core)"/>
    <circle cx="832" cy="430" r="48" fill="#10364A"/>
    <path d="M832 467V532" stroke="#10364A" stroke-width="34" stroke-linecap="round"/>
    <circle cx="832" cy="430" r="15" fill="#BFFFF2"/>
  </g>

  <g filter="url(#shadow)">
