    <path d="M326 646C490 646 531 572 632 526" stroke="#3B859C" stroke-width="5" stroke-dasharray="2 18"/>
    <path d="M1262 257C1128 257 1086 331 1030 370" stroke="#3B859C" stroke-width="5" stroke-dasharray="2 18"/>
    <path d="M1287 644C1142 644 1103 574 1027 526" stroke="#3B859C" stroke-width="5" stroke-dasharray="2 18"/>
  </g>

  <g filter="url(#shadow)">
