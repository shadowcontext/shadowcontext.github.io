<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Package stream protected by verified upstream trust</title>
  <desc id="desc">Abstract editorial artwork showing glowing software packages passing through a firewall gate beneath an intact certificate chain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#102a3b"/>
      <stop offset="1" stop-color="#07131e"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#35e6c1" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#198f9c" stop-opacity=".10"/>
      <stop offset="1" stop-color="#071827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78f7dd"/>
      <stop offset="1" stop-color="#24aebd"/>
    </linearGradient>
    <linearGradient id="parcel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8fff4"/>
      <stop offset="1" stop-color="#4bd5c0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8ac7d2" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="435" rx="620" ry="390" fill="url(#aura)"/>
  <path d="M40 690C280 610 430 620 610 665S990 760 1560 585" fill="none" stroke="#42d9c0" stroke-opacity=".10" stroke-width="90" filter="url(#soft)"/>

  <g opacity=".42" fill="none" stroke="#68bfc7" stroke-width="4">
    <path d="M80 420C285 420 310 500 500 500"/>
    <path d="M1100 420C1305 420 1325 360 1530 360"/>
    <circle cx="80" cy="420" r="8" fill="#68bfc7"/>
    <circle cx="1530" cy="360" r="8" fill="#68bfc7"/>
  </g>

  <g transform="translate(610 172)">
    <rect x="0" y="0" width="380" height="560" rx="54" fill="#0a202d" stroke="url(#gate)" stroke-width="9"/>
    <rect x="31" y="31" width="318" height="498" rx="34" fill="#0c2b38" stroke="#8af7df" stroke-opacity=".35" stroke-width="3"/>
    <path d="M48 235H332M48 325H332" stroke="#58d9c6" stroke-opacity=".18" stroke-width="16"/>
    <circle cx="190" cy="280" r="101" fill="#09212c" stroke="#72f2d9" stroke-width="7" filter="url(#glow)"/>
    <path d="M190 205c-39 0-70 31-70 70v52c0 20 11 39 29 49l41 23 41-23c18-10 29-29 29-49v-52c0-39-31-70-70-70Z" fill="#113c48" stroke="#b0fff0" stroke-width="6"/>
    <path d="m158 301 24 25 45-53" fill="none" stroke="#7ff6dd" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="url(#gate)" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
    <path d="M520 165c0-46 37-83 83-83s83 37 83 83-37 83-83 83h-52"/>
    <path d="M1080 165c0-46-37-83-83-83s-83 37-83 83 37 83 83 83h52"/>
    <path d="M682 165h232"/>
  </g>
  <g fill="#9cfae7">
    <circle cx="603" cy="82" r="12"/><circle cx="997" cy="82" r="12"/>
    <circle cx="800" cy="165" r="15"/>
  </g>

  <g transform="translate(120 515)">
    <g transform="translate(0 30) rotate(-7 95 75)">
      <path d="M15 42 95 0l80 42v92l-80 43-80-43Z" fill="#153846" stroke="#53bfb4" stroke-width="5"/>
      <path d="m15 42 80 44 80-44M95 86v91" fill="none" stroke="#6cd9ca" stroke-width="5"/>
      <path d="m60 23 80 43" stroke="#c2fff2" stroke-opacity=".6" stroke-width="8"/>
    </g>
    <g transform="translate(230 0) rotate(5 95 75)">
      <path d="M15 42 95 0l80 42v92l-80 43-80-43Z" fill="#17404b" stroke="#64d7c6" stroke-width="5"/>
      <path d="m15 42 80 44 80-44M95 86v91" fill="none" stroke="#78e9d5" stroke-width="5"/>
      <path d="m60 23 80 43" stroke="#d0fff6" stroke-opacity=".7" stroke-width="8"/>
    </g>
  </g>

  <g transform="translate(1110 510)" filter="url(#glow)">
    <g transform="rotate(-4 95 75)">
      <path d="M15 42 95 0l80 42v92l-80 43-80-43Z" fill="url(#parcel)" stroke="#d7fff7" stroke-width="5"/>
      <path d="m15 42 80 44 80-44M95 86v91" fill="none" stroke="#147c82" stroke-width="5"/>
      <path d="m60 23 80 43" stroke="#0d6670" stroke-width="8"/>
    </g>
    <g transform="translate(230 38) rotate(7 95 75)">
      <path d="M15 42 95 0l80 42v92l-80 43-80-43Z" fill="url(#parcel)" stroke="#d7fff7" stroke-width="5"/>
      <path d="m15 42 80 44 80-44M95 86v91" fill="none" stroke="#147c82" stroke-width="5"/>
      <path d="m60 23 80 43" stroke="#0d6670" stroke-width="8"/>
    </g>
  </g>

  <g opacity=".6" fill="#91f6e0">
    <circle cx="332" cy="305" r="5"/><circle cx="386" cy="352" r="9"/><circle cx="452" cy="278" r="4"/>
    <circle cx="1160" cy="300" r="7"/><circle cx="1238" cy="245" r="4"/><circle cx="1302" cy="329" r="9"/>
  </g>
</svg>
