<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Supervised cyber activity passing through a layered control gateway</title>
  <desc id="desc">An abstract field of luminous signals is constrained by nested dark-blue boundaries and a central amber authorization aperture, evoking oversight, scope, and stop controls.</desc>
