<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered security rings protecting an encrypted network tunnel</title>
  <desc id="desc">Abstract blue and amber gateway rings guide a luminous encrypted path while scattered signals are stopped at the perimeter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071427"/>
      <stop offset="0.55" stop-color="#102c49"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#42d9ff" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#167fb4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#071427" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e94bb" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#4be2ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffc465" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ringBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74e8ff"/>
      <stop offset="1" stop-color="#176a98"/>
    </linearGradient>
    <linearGradient id="ringAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe099"/>
      <stop offset="1" stop-color="#d27a24"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shine" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="portal"><ellipse cx="800" cy="450" rx="194" ry="292"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="620" ry="450" fill="url(#glow)"/>

  <g opacity="0.22" fill="none" stroke="#67cbe8" stroke-width="2">
    <path d="M70 210 C300 120 420 280 610 280"/>
    <path d="M35 685 C290 770 430 615 610 620"/>
    <path d="M990 230 C1190 230 1310 90 1555 195"/>
    <path d="M990 660 C1190 660 1320 790 1570 685"/>
  </g>

  <path d="M95 450 C330 325 515 335 800 450 C1085 565 1270 575 1505 450" fill="none" stroke="#2496c1" stroke-width="132" stroke-linecap="round" opacity="0.08"/>
  <path d="M95 450 C330 325 515 335 800 450 C1085 565 1270 575 1505 450" fill="none" stroke="url(#tunnel)" stroke-width="28" stroke-linecap="round" opacity="0.55"/>
  <path d="M95 450 C330 325 515 335 800 450 C1085 565 1270 575 1505 450" fill="none" stroke="#7bedff" stroke-width="4" stroke-linecap="round" filter="url(#shine)"/>

  <g fill="none" transform="rotate(-7 800 450)">
    <ellipse cx="800" cy="450" rx="310" ry="382" stroke="#174966" stroke-width="32" opacity="0.7"/>
    <ellipse cx="800" cy="450" rx="267" ry="348" stroke="url(#ringBlue)" stroke-width="18" opacity="0.88"/>
    <ellipse cx="800" cy="450" rx="225" ry="318" stroke="#296f96" stroke-width="10" opacity="0.78"/>
    <ellipse cx="800" cy="450" rx="194" ry="292" stroke="url(#ringAmber)" stroke-width="8"/>
  </g>

  <g clip-path="url(#portal)">
    <rect x="585" y="135" width="430" height="630" fill="#0b263d" opacity="0.62"/>
    <path d="M600 590 C705 520 732 342 800 342 C868 342 895 520 1000 590" fill="none" stroke="#45dcff" stroke-width="5" opacity="0.62"/>
    <path d="M600 624 C710 552 748 390 800 390 C852 390 890 552 1000 624" fill="none" stroke="#ffbd61" stroke-width="3" opacity="0.58"/>
  </g>

  <g fill="#8cecff" filter="url(#shine)">
    <circle cx="153" cy="425" r="9"/>
    <circle cx="338" cy="375" r="7"/>
    <circle cx="542" cy="394" r="10"/>
    <circle cx="800" cy="450" r="13"/>
    <circle cx="1061" cy="508" r="10"/>
    <circle cx="1265" cy="530" r="7"/>
    <circle cx="1447" cy="477" r="9"/>
  </g>

  <g fill="#ffbc58" opacity="0.9">
    <circle cx="377" cy="242" r="8"/>
    <circle cx="431" cy="680" r="6"/>
    <circle cx="1170" cy="244" r="7"/>
    <circle cx="1218" cy="690" r="9"/>
  </g>
  <g stroke="#ffcb75" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <path d="M377 242 l-24 -24 M377 242 l25 -18"/>
    <path d="M431 680 l-30 20 M431 680 l18 29"/>
    <path d="M1170 244 l-18 -28 M1170 244 l30 -15"/>
    <path d="M1218 690 l-26 25 M1218 690 l30 18"/>
  </g>

  <g opacity="0.42" filter="url(#soft)">
    <ellipse cx="800" cy="450" rx="180" ry="280" fill="none" stroke="#47ddff" stroke-width="28"/>
    <path d="M210 450 H565 M1035 450 H1390" stroke="#48dfff" stroke-width="20"/>
  </g>

  <path d="M800 310 L918 362 V458 C918 544 870 612 800 646 C730 612 682 544 682 458 V362 Z" fill="#0b304b" stroke="#8eeeff" stroke-width="5" opacity="0.94"/>
  <path d="M800 342 L884 379 V454 C884 514 853 562 800 593 C747 562 716 514 716 454 V379 Z" fill="#123f58" stroke="#e7b15e" stroke-width="3" opacity="0.95"/>
  <circle cx="800" cy="456" r="28" fill="#73e8ff" opacity="0.92"/>
  <path d="M800 479 V526" stroke="#73e8ff" stroke-width="18" stroke-linecap="round"/>
</svg>
