<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Router core secured by complete maintenance coverage</title>
  <desc id="desc">Abstract editorial artwork showing a router core protected by interlocking update tiles spanning several luminous network paths.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1530" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081328"/>
      <stop offset="0.52" stop-color="#102848"/>
      <stop offset="1" stop-color="#060B19"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(800 450) rotate(90) scale(430 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4CE7D0" stop-opacity="0.24"/>
      <stop offset="0.58" stop-color="#3389C8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071021" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="145" y1="212" x2="1450" y2="695" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D78A9" stop-opacity="0.2"/>
      <stop offset="0.48" stop-color="#78F6DE"/>
      <stop offset="1" stop-color="#3E73C6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="tile" x1="560" y1="170" x2="1025" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6FFF1"/>
      <stop offset="0.42" stop-color="#38CDBD"/>
      <stop offset="1" stop-color="#2871B1"/>
    </linearGradient>
    <linearGradient id="core" x1="650" y1="315" x2="950" y2="585" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183D61"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="670" ry="430" fill="url(#halo)"/>
  <circle cx="236" cy="168" r="118" fill="#2EC9C1" opacity="0.08" filter="url(#soft)"/>
  <circle cx="1388" cy="720" r="145" fill="#377BE0" opacity="0.1" filter="url(#soft)"/>

