<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Persistent-state controls for AI agent harnesses</title>
  <desc id="desc">Abstract editorial artwork showing luminous state capsules crossing session boundaries while a segmented security ring contains a delayed amber signal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.48" stop-color="#10233a"/>
      <stop offset="1" stop-color="#21183a"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55e6d0" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#4d8dff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64f1dc" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7d69ff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbd59" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffbd59"/>
      <stop offset="1" stop-color="#ff755c"/>
    </linearGradient>
    <pattern id="field" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#b8d7f2" fill-opacity="0.12"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#field)"/>
  <ellipse cx="900" cy="450" rx="620" ry="410" fill="url(#aura)" filter="url(#blur)"/>

  <g fill="none" stroke="#92b9d8" stroke-opacity="0.18" stroke-width="2">
    <path d="M110 170C300 170 330 274 505 274S745 190 900 240"/>
    <path d="M110 730C300 730 330 626 505 626S745 710 900 660"/>
    <path d="M80 450H1060"/>
  </g>

  <g>
    <rect x="180" y="238" width="260" height="132" rx="66" fill="#0c2032" stroke="#64f1dc" stroke-opacity="0.65" stroke-width="3"/>
    <rect x="310" y="384" width="282" height="132" rx="66" fill="#10233a" stroke="#5fc8ff" stroke-opacity="0.58" stroke-width="3"/>
    <rect x="180" y="530" width="260" height="132" rx="66" fill="#151f3b" stroke="#9c7cff" stroke-opacity="0.58" stroke-width="3"/>
    <g fill="url(#capsule)" opacity="0.9">
      <circle cx="250" cy="304" r="24"/><circle cx="310" cy="304" r="14"/><circle cx="366" cy="304" r="9"/>
      <circle cx="380" cy="450" r="24"/><circle cx="440" cy="450" r="14"/><circle cx="496" cy="450" r="9"/>
      <circle cx="250" cy="596" r="24"/><circle cx="310" cy="596" r="14"/><circle cx="366" cy="596" r="9"/>
    </g>
  </g>

  <g stroke-linecap="round">
    <path d="M436 304C580 304 610 415 760 415" fill="none" stroke="#64f1dc" stroke-opacity="0.58" stroke-width="6"/>
    <path d="M588 450H760" fill="none" stroke="#5fc8ff" stroke-opacity="0.58" stroke-width="6"/>
    <path d="M436 596C580 596 610 485 760 485" fill="none" stroke="#9c7cff" stroke-opacity="0.58" stroke-width="6"/>
    <path d="M285 304C420 320 466 410 606 450S765 480 866 450" fill="none" stroke="url(#signal)" stroke-width="10" filter="url(#glow)"/>
  </g>

  <g>
    <path d="M708 145V755" stroke="#b8d7f2" stroke-opacity="0.16" stroke-width="3" stroke-dasharray="10 16"/>
    <path d="M800 145V755" stroke="#b8d7f2" stroke-opacity="0.16" stroke-width="3" stroke-dasharray="10 16"/>
    <path d="M754 190v520" stroke="#55e6d0" stroke-opacity="0.42" stroke-width="7" stroke-linecap="round"/>
    <circle cx="754" cy="450" r="32" fill="#0b1d30" stroke="#55e6d0" stroke-width="5" filter="url(#glow)"/>
    <path d="M742 450l9 10 18-23" fill="none" stroke="#eafffb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1110 450)">
    <circle r="222" fill="#0b1b2d" fill-opacity="0.7" stroke="#8eb6d9" stroke-opacity="0.18" stroke-width="3"/>
    <circle r="170" fill="none" stroke="#55e6d0" stroke-opacity="0.22" stroke-width="36"/>
    <g fill="none" stroke-width="36" stroke-linecap="round">
      <path d="M-120-120A170 170 0 0 1 15-169" stroke="#55e6d0"/>
      <path d="M75-152A170 170 0 0 1 168-24" stroke="#5fc8ff"/>
      <path d="M160 57A170 170 0 0 1 55 161" stroke="#7d69ff"/>
      <path d="M-17 169A170 170 0 0 1-151 78" stroke="#a37cff"/>
      <path d="M-168 23A170 170 0 0 1-151-78" stroke="#55e6d0"/>
    </g>
    <circle r="88" fill="#10243a" stroke="#ffbd59" stroke-opacity="0.65" stroke-width="4"/>
    <path d="M-45 8C-16-38 22-38 50-3" fill="none" stroke="url(#signal)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="-45" cy="8" r="10" fill="#ffbd59"/>
    <circle cx="50" cy="-3" r="10" fill="#ff755c"/>
  </g>

  <g fill="#b8d7f2" fill-opacity="0.34">
    <circle cx="1388" cy="208" r="5"/><circle cx="1450" cy="260" r="8"/><circle cx="1410" cy="690" r="6"/>
    <circle cx="1030" cy="116" r="6"/><circle cx="906" cy="768" r="5"/><circle cx="562" cy="118" r="7"/>
  </g>
</svg>
