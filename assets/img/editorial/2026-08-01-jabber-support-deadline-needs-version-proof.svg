<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Communication clients crossing a protected upgrade boundary</title>
  <desc id="desc">Abstract blue communication tiles move from a dim amber legacy field through a luminous security boundary into a protected cyan environment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0a2641"/>
      <stop offset="1" stop-color="#071b31"/>
    </linearGradient>
    <radialGradient id="halo" cx="68%" cy="48%" r="46%">
      <stop offset="0" stop-color="#29d7e4" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#198eb5" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="legacy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b86928"/>
      <stop offset="1" stop-color="#643c31"/>
    </linearGradient>
    <linearGradient id="current" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38d8e3"/>
      <stop offset="1" stop-color="#176ea8"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76f1ea" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#9efff5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#35b8d4" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020811" flood-opacity="0.62"/>
    </filter>
    <pattern id="mesh" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M84 0H0V84" fill="none" stroke="#8ccfe0" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <path d="M0 730 C310 650 510 780 790 690 S1260 565 1600 660 V900 H0Z" fill="#04101f" opacity="0.82"/>
