<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded DNS resolution paths</title>
  <desc id="desc">Abstract teal DNS resolution paths multiply around an amber recursive core before meeting a bright bounded perimeter.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2a"/>
      <stop offset="0.55" stop-color="#0b3040"/>
      <stop offset="1" stop-color="#06151f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.42" stop-color="#f0a83c"/>
      <stop offset="1" stop-color="#a95420"/>
    </radialGradient>
    <linearGradient id="boundary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45e0d0" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#a6fff0"/>
      <stop offset="1" stop-color="#45e0d0" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="800" cy="455" rx="570" ry="330" fill="#0b8790" opacity="0.08" filter="url(#soft)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M115 215 C300 210 315 365 500 348 S680 195 795 356" stroke="#3bc4c7" stroke-width="18" opacity="0.32"/>
    <path d="M120 450 C305 450 340 300 515 390 S660 520 795 450" stroke="#76e5da" stroke-width="12" opacity="0.56"/>
    <path d="M130 695 C305 690 340 545 505 555 S685 700 800 540" stroke="#238eae" stroke-width="22" opacity="0.38"/>
    <path d="M805 356 C930 205 1065 245 1190 170 S1390 120 1505 195" stroke="#36bbca" stroke-width="16" opacity="0.34"/>
    <path d="M805 418 C980 340 1025 440 1160 380 S1350 300 1500 345" stroke="#65ddd4" stroke-width="10" opacity="0.52"/>
    <path d="M805 478 C955 545 1015 455 1175 535 S1375 585 1505 545" stroke="#43cbd0" stroke-width="17" opacity="0.42"/>
    <path d="M805 540 C940 710 1085 620 1210 715 S1395 770 1510 700" stroke="#247f9d" stroke-width="23" opacity="0.42"/>
  </g>
  <g fill="#74eee0" opacity="0.8">
    <circle cx="118" cy="215" r="16"/><circle cx="123" cy="450" r="12"/><circle cx="132" cy="695" r="18"/>
    <circle cx="1502" cy="195" r="14"/><circle cx="1500" cy="345" r="11"/><circle cx="1505" cy="545" r="16"/><circle cx="1508" cy="700" r="18"/>
  </g>
  <g opacity="0.7" fill="#0d4251" stroke="#78eee2" stroke-width="4">
    <circle cx="345" cy="294" r="25"/><circle cx="372" cy="601" r="22"/><circle cx="1205" cy="176" r="23"/>
    <circle cx="1180" cy="532" r="27"/><circle cx="1360" cy="731" r="21"/><circle cx="1350" cy="311" r="18"/>
  </g>
  <circle cx="800" cy="450" r="214" fill="none" stroke="#2d9eaa" stroke-width="66" opacity="0.13"/>
  <circle cx="800" cy="450" r="177" fill="none" stroke="url(#boundary)" stroke-width="16" filter="url(#glow)"/>
  <circle cx="800" cy="450" r="117" fill="#f0a83c" opacity="0.13" filter="url(#soft)"/>
  <circle cx="800" cy="450" r="86" fill="url(#core)" stroke="#ffe4a9" stroke-width="7" filter="url(#glow)"/>
  <g fill="none" stroke="#f8c56b" stroke-width="8" opacity="0.9">
    <path d="M800 364 C725 350 691 400 720 445 C741 478 775 469 770 517"/>
    <path d="M800 536 C875 550 909 500 880 455 C859 422 825 431 830 383"/>
  </g>
  <g fill="#fff1c9">
    <circle cx="800" cy="364" r="8"/><circle cx="770" cy="517" r="8"/><circle cx="800" cy="536" r="8"/><circle cx="830" cy="383" r="8"/>
  </g>
  <g fill="none" stroke="#91f6e8" stroke-width="5" opacity="0.66">
    <path d="M625 450 H552"/><path d="M975 450 H1048"/><path d="M676 326 L628 274"/><path d="M924 326 L972 274"/>
    <path d="M676 574 L628 626"/><path d="M924 574 L972 626"/>
  </g>
</svg>
