<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RDS monitoring transition and telemetry verification</title>
  <desc id="desc">An abstract cloud database is encircled by cyan telemetry arcs while an amber signal crosses a luminous boundary into a protected observation lens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162e"/>
      <stop offset="0.52" stop-color="#0b2742"/>
      <stop offset="1" stop-color="#061221"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#46dded" stop-opacity=".3"/>
      <stop offset=".55" stop-color="#1f8cb1" stop-opacity=".1"/>
      <stop offset="1" stop-color="#07162e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aaf7ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#31a6c3" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f29e38" stop-opacity=".15"/>
      <stop offset=".52" stop-color="#ffc765"/>
      <stop offset="1" stop-color="#61edf2"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <clipPath id="lensClip"><circle cx="1195" cy="450" r="176"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="782" cy="451" r="485" fill="url(#halo)"/>
  <g opacity=".3" fill="none" stroke="#4fc9dc">
    <path d="M102 211C311 89 488 138 630 249" stroke-width="2"/>
    <path d="M146 726C339 820 535 789 664 681" stroke-width="2"/>
    <path d="M1264 145C1391 208 1460 300 1490 407" stroke-width="2"/>
  </g>
  <g fill="#6fe9ef">
    <circle cx="102" cy="211" r="5"/><circle cx="630" cy="249" r="5"/>
    <circle cx="146" cy="726" r="5"/><circle cx="664" cy="681" r="5"/>
    <circle cx="1264" cy="145" r="5"/><circle cx="1490" cy="407" r="5"/>
  </g>
  <g transform="translate(540 252)">
    <ellipse cx="250" cy="68" rx="226" ry="68" fill="#102f4c" stroke="#80eff4" stroke-width="5"/>
    <path d="M24 68v280c0 37 101 68 226 68s226-31 226-68V68" fill="url(#glass)" stroke="#54cada" stroke-width="5"/>
    <path d="M24 164c0 37 101 68 226 68s226-31 226-68M24 257c0 37 101 68 226 68s226-31 226-68" fill="none" stroke="#42b5cb" stroke-width="4" opacity=".72"/>
    <ellipse cx="250" cy="68" rx="174" ry="43" fill="#0d2039" stroke="#72e8ef" stroke-width="3" opacity=".92"/>
    <ellipse cx="250" cy="68" rx="105" ry="24" fill="#43d9e7" opacity=".18" filter="url(#glow)"/>
    <g fill="#8bf5f5" opacity=".8">
      <circle cx="95" cy="187" r="7"/><circle cx="120" cy="280" r="7"/><circle cx="161" cy="367" r="7"/>
    </g>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M358 443c55-178 203-290 379-319" stroke="#2d91ad" stroke-width="9" opacity=".38"/>
    <path d="M396 567c76 149 216 230 377 245" stroke="#45ced9" stroke-width="9" opacity=".46"/>
    <path d="M467 365c42-89 123-156 220-181" stroke="#78eef0" stroke-width="4" stroke-dasharray="8 22"/>
    <path d="M482 626c62 79 150 124 250 134" stroke="#78eef0" stroke-width="4" stroke-dasharray="8 22"/>
  </g>
  <g filter="url(#glow)">
    <path d="M187 450H1018" fill="none" stroke="url(#signal)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="310" cy="450" r="13" fill="#ffbb58"/>
    <circle cx="502" cy="450" r="10" fill="#ffd17f"/>
    <circle cx="985" cy="450" r="12" fill="#7df4f3"/>
  </g>
  <rect x="1026" y="166" width="14" height="568" rx="7" fill="#8af4f2" opacity=".8" filter="url(#glow)"/>
  <circle cx="1195" cy="450" r="213" fill="#1b7e9b" opacity=".15" filter="url(#soft)"/>
  <circle cx="1195" cy="450" r="176" fill="#0b213a" stroke="#a0f7f5" stroke-width="8"/>
  <g clip-path="url(#lensClip)">
    <path d="M1008 544c71-23 101-130 162-126 67 5 71 111 139 108 41-2 63-44 91-81" fill="none" stroke="#58e3e9" stroke-width="8"/>
    <path d="M1000 604c85-6 105-66 166-66 72 0 84 75 157 71 36-2 61-22 88-48" fill="none" stroke="#286d91" stroke-width="5"/>
    <g fill="#b4ffff" filter="url(#glow)">
      <circle cx="1089" cy="485" r="10"/><circle cx="1170" cy="418" r="10"/><circle cx="1262" cy="502" r="10"/><circle cx="1355" cy="481" r="10"/>
    </g>
  </g>
  <path d="M1319 574l156 156" stroke="#8df5f3" stroke-width="28" stroke-linecap="round"/>
  <path d="M1324 579l150 150" stroke="#d0ffff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <g opacity=".7" fill="#ffc568">
    <path d="M189 433l18 17-18 17-18-17z"/>
    <path d="M259 433l18 17-18 17-18-17z" opacity=".55"/>
  </g>
</svg>
