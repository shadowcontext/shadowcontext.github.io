<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Segmented industrial communication paths protecting a resilient service core</title>
  <desc id="desc">An abstract editorial scene of luminous network paths crossing layered security gates toward a stable blue core, with four disrupted signal rings held outside the protected segment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="0.55" stop-color="#0b2540"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.22" stop-color="#55d8ef"/>
      <stop offset="0.62" stop-color="#1678b8"/>
      <stop offset="1" stop-color="#0a315f"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d6b87" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#7ee7e1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2d6b87" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 720 C310 610 390 810 710 690 S1200 520 1600 650 L1600 900 L0 900Z" fill="#0c3850" opacity="0.45"/>
  <path d="M0 150 C340 255 470 50 800 155 S1250 270 1600 120" fill="none" stroke="#1c5977" stroke-width="2" opacity="0.35"/>
  <g opacity="0.18" stroke="#71bed0" stroke-width="1">
    <path d="M140 0V900M320 0V900M500 0V900M680 0V900M860 0V900M1040 0V900M1220 0V900M1400 0V900"/>
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M90 240 C350 240 390 370 650 370 S940 300 1190 360" stroke="#48b8ce" stroke-width="8" opacity="0.65"/>
    <path d="M60 455 C315 455 420 455 675 455 S960 470 1190 445" stroke="#7ee7e1" stroke-width="10" opacity="0.9"/>
    <path d="M120 665 C350 610 450 545 680 555 S965 610 1190 535" stroke="#3687ba" stroke-width="8" opacity="0.7"/>
  </g>
  <g>
    <path d="M540 150 L670 210 L670 690 L540 750 L470 690 L470 210Z" fill="#102f49" stroke="url(#gate)" stroke-width="6"/>
    <path d="M760 105 L900 175 L900 725 L760 795 L690 725 L690 175Z" fill="#0d2942" stroke="url(#gate)" stroke-width="7"/>
    <rect x="521" y="332" width="99" height="236" rx="48" fill="#071827" stroke="#7ee7e1" stroke-width="5"/>
    <rect x="742" y="300" width="108" height="300" rx="52" fill="#071827" stroke="#7ee7e1" stroke-width="5"/>
    <circle cx="570" cy="450" r="16" fill="#bafaff" filter="url(#glow)"/>
    <circle cx="796" cy="450" r="18" fill="#bafaff" filter="url(#glow)"/>
  </g>
  <g transform="translate(1260 450)" filter="url(#glow)">
    <circle r="164" fill="#0b375e" opacity="0.55"/>
    <circle r="126" fill="none" stroke="#48c9df" stroke-width="7" opacity="0.7"/>
    <circle r="92" fill="url(#core)"/>
    <circle r="48" fill="#d9fbff" opacity="0.88"/>
  </g>
  <g fill="none" stroke="#ff9968" stroke-width="9" opacity="0.9">
    <path d="M204 190 A70 70 0 1 1 165 310"/>
    <path d="M280 365 A62 62 0 1 1 238 472"/>
    <path d="M170 545 A78 78 0 1 1 129 681"/>
    <path d="M388 590 A55 55 0 1 1 352 687"/>
  </g>
  <g fill="#ffbf8f" filter="url(#soft)">
    <circle cx="165" cy="310" r="12"/><circle cx="238" cy="472" r="12"/>
    <circle cx="129" cy="681" r="12"/><circle cx="352" cy="687" r="12"/>
  </g>
  <g fill="#9cf2ed">
    <circle cx="650" cy="370" r="11"/><circle cx="675" cy="455" r="12"/><circle cx="680" cy="555" r="11"/>
    <circle cx="1020" cy="335" r="10"/><circle cx="1040" cy="452" r="12"/><circle cx="1030" cy="575" r="10"/>
  </g>
