<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent action evidence joined with platform attestation</title>
  <desc id="desc">Abstract signed action fragments and concentric hardware measurement rings converge inside a luminous verification prism, while stale and contested traces fall away.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1480" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071527"/>
      <stop offset="0.5" stop-color="#0B2340"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(900 438) rotate(90) scale(375 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42D9D0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#42D9D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="446" y1="255" x2="1126" y2="649" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DE7E0"/>
      <stop offset="1" stop-color="#54A8FF"/>
    </linearGradient>
    <linearGradient id="amber" x1="205" y1="620" x2="1300" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7B34A" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#FFD782"/>
      <stop offset="1" stop-color="#F18465" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="prismClip">
      <path d="M742 205 1072 356 968 702 621 652 552 344Z"/>
    </clipPath>
  </defs>
