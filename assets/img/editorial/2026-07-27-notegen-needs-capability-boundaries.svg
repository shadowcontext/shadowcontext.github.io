<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI content separated from desktop command capabilities</title>
  <desc id="desc">An abstract desktop window sends flowing content toward a luminous shield that blocks layered operating-system command paths.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="40" x2="1490" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071629"/>
      <stop offset=".52" stop-color="#10233E"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(822 446) rotate(90) scale(330 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DE7D4" stop-opacity=".24"/>
      <stop offset="1" stop-color="#4DE7D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="230" y1="176" x2="715" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183755"/>
      <stop offset="1" stop-color="#0A1B32"/>
    </linearGradient>
    <linearGradient id="flow" x1="395" y1="320" x2="831" y2="517" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A8CFF"/>
      <stop offset=".5" stop-color="#4DBFE5"/>
      <stop offset="1" stop-color="#52E1C1"/>
    </linearGradient>
    <linearGradient id="shield" x1="758" y1="214" x2="902" y2="683" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7FFF1"/>
      <stop offset=".48" stop-color="#44E2C7"/>
      <stop offset="1" stop-color="#1597B4"/>
    </linearGradient>
    <linearGradient id="command" x1="1000" y1="270" x2="1370" y2="665" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E27592"/>
      <stop offset="1" stop-color="#69466F"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="221" y="170" width="520" height="560" rx="38"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="822" cy="446" rx="420" ry="330" fill="url(#halo)"/>
  <g opacity=".26" fill="none" stroke="#6EA6C7" stroke-width="2">
    <path d="M76 173C250 105 387 119 521 194"/>
    <path d="M1089 109C1286 78 1438 151 1537 270"/>
    <path d="M1052 793C1247 844 1418 792 1538 691"/>
  </g>
  <g clip-path="url(#screenClip)">
    <rect x="221" y="170" width="520" height="560" rx="38" fill="url(#window)"/>
    <rect x="221" y="170" width="520" height="74" fill="#244763"/>
    <circle cx="270" cy="207" r="9" fill="#6CE4D0"/>
    <circle cx="301" cy="207" r="9" fill="#7586EF"/>
    <circle cx="332" cy="207" r="9" fill="#E07B99"/>
    <g fill="none" stroke-linecap="round">
      <path d="M294 333C385 275 464 396 556 335C610 299 663 303 746 352" stroke="#7B8BFF" stroke-width="28" opacity=".22"/>
      <path d="M275 430C365 361 438 483 521 430C604 377 670 423 760 468" stroke="#4DBFE5" stroke-width="32" opacity=".2"/>
      <path d="M295 532C383 472 457 586 548 526C626 475 672 512 760 559" stroke="#52E1C1" stroke-width="30" opacity=".2"/>
      <path d="M294 333C385 275 464 396 556 335C610 299 663 303 782 382" stroke="url(#flow)" stroke-width="7"/>
      <path d="M275 430C365 361 438 483 521 430C604 377 670 423 790 492" stroke="url(#flow)" stroke-width="7"/>
      <path d="M295 532C383 472 457 586 548 526C626 475 672 512 786 584" stroke="url(#flow)" stroke-width="7"/>
    </g>
    <g fill="#AFC5DB" opacity=".42">
      <rect x="286" y="630" width="248" height="12" rx="6"/>
      <rect x="286" y="660" width="176" height="12" rx="6"/>
    </g>
  </g>
  <rect x="221" y="170" width="520" height="560" rx="38" fill="none" stroke="#78B2D4" stroke-width="3" opacity=".7"/>
  <g filter="url(#glow)" opacity=".52">
    <path d="M828 198L943 241V433C943 566 896 661 828 703C760 661 713 566 713 433V241L828 198Z" fill="#45E0C6"/>
  </g>
  <path d="M828 198L943 241V433C943 566 896 661 828 703C760 661 713 566 713 433V241L828 198Z" fill="#0C2940" stroke="url(#shield)" stroke-width="10"/>
  <path d="M828 259L888 282V432C888 519 864 581 828 614C792 581 768 519 768 432V282L828 259Z" fill="url(#shield)" opacity=".18"/>
  <path d="M798 440L820 463L865 407" fill="none" stroke="#BFFFF2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <g opacity=".88">
    <path d="M975 304C1080 249 1219 262 1338 322L1294 383C1182 337 1099 345 1003 394Z" fill="url(#command)"/>
    <path d="M982 433C1096 388 1234 408 1391 488L1349 549C1231 495 1118 480 1000 529Z" fill="url(#command)" opacity=".82"/>
    <path d="M976 565C1096 527 1207 558 1326 632L1280 690C1175 637 1084 625 1000 650Z" fill="url(#command)" opacity=".64"/>
    <g fill="none" stroke="#FFC2CF" stroke-width="5" stroke-linecap="round" opacity=".7">
      <path d="M1056 333L1105 354L1059 378"/>
      <path d="M1082 463L1131 484L1085 508"/>
      <path d="M1054 588L1103 609L1057 633"/>
    </g>
  </g>
  <g fill="#5AE4CE" filter="url(#soft)">
    <circle cx="756" cy="381" r="8"/>
    <circle cx="746" cy="492" r="8"/>
    <circle cx="751" cy="584" r="8"/>
  </g>
  <g fill="#E47D9A" opacity=".62">
    <circle cx="976" cy="394" r="7"/>
    <circle cx="980" cy="529" r="7"/>
    <circle cx="983" cy="650" r="7"/>
  </g>
  <path d="M160 782H1440" stroke="#5D8BAA" stroke-width="2" opacity=".22"/>
</svg>
