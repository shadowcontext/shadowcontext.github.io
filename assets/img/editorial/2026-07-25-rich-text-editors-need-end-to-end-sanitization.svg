<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rich-text content passing through a security filter</title>
  <desc id="desc">Layered content fragments flow through a luminous filtering boundary into a protected document, while unsafe fragments are diverted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.54" stop-color="#10213c"/>
      <stop offset="1" stop-color="#090d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#35e6d1" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#4d7cff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77f4df"/>
      <stop offset=".5" stop-color="#43bfd5"/>
      <stop offset="1" stop-color="#557cff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefbff"/>
      <stop offset="1" stop-color="#a9d7ec"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#778bb3" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#78d9dd" stop-opacity=".65"/>
      <stop offset="1" stop-color="#b7fff1" stop-opacity=".9"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000816" flood-opacity=".5"/>
    </filter>
    <filter id="gateGlow" x="-80%" y="-30%" width="260%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="docClip">
      <rect x="1010" y="218" width="370" height="464" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="760" cy="432" r="250" fill="#29d7c1" opacity=".07" filter="url(#soft)"/>
  <circle cx="1200" cy="455" r="260" fill="#4c78ff" opacity=".08" filter="url(#soft)"/>

  <g opacity=".18" fill="none" stroke="#6d8bb9" stroke-width="2">
    <path d="M58 156C270 104 416 155 590 108"/>
    <path d="M1060 760c180-62 316-29 493-74"/>
    <path d="M99 760c196 35 325 2 455 42"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(154 234) rotate(-8 185 108)">
      <rect width="370" height="216" rx="26" fill="#152c4b" stroke="#486890" stroke-width="2"/>
      <rect x="34" y="38" width="198" height="14" rx="7" fill="#b5d0e8" opacity=".75"/>
      <rect x="34" y="76" width="290" height="10" rx="5" fill="#6f91b3" opacity=".6"/>
      <rect x="34" y="104" width="248" height="10" rx="5" fill="#6f91b3" opacity=".45"/>
      <circle cx="302" cy="164" r="22" fill="#f270a8" opacity=".85"/>
      <path d="M293 155l18 18m0-18l-18 18" stroke="#ffe8f2" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(116 498) rotate(5 190 86)">
      <rect width="380" height="172" rx="26" fill="#122843" stroke="#3f638b" stroke-width="2"/>
      <rect x="34" y="36" width="110" height="14" rx="7" fill="#91e6dc" opacity=".72"/>
      <rect x="34" y="74" width="300" height="10" rx="5" fill="#7694b3" opacity=".52"/>
      <rect x="34" y="104" width="220" height="10" rx="5" fill="#7694b3" opacity=".4"/>
    </g>
  </g>

  <path d="M470 326C580 342 624 378 704 410" fill="none" stroke="url(#flow)" stroke-width="24" stroke-linecap="round"/>
  <path d="M481 570C590 552 642 512 708 476" fill="none" stroke="url(#flow)" stroke-width="18" stroke-linecap="round"/>
  <g fill="#9ff8eb">
    <circle cx="558" cy="362" r="7" opacity=".72"/>
    <circle cx="616" cy="386" r="5" opacity=".58"/>
    <circle cx="568" cy="548" r="6" opacity=".66"/>
    <circle cx="642" cy="510" r="4" opacity=".8"/>
  </g>

  <g filter="url(#gateGlow)">
    <path d="M780 154C852 195 915 205 964 220v228c0 150-79 244-184 298-105-54-184-148-184-298V220c49-15 112-25 184-66z" fill="#0b1d35" fill-opacity=".83" stroke="url(#gate)" stroke-width="8"/>
    <path d="M780 198c54 30 104 40 142 52v194c0 112-54 188-142 239-88-51-142-127-142-239V250c38-12 88-22 142-52z" fill="none" stroke="#95fff0" stroke-opacity=".28" stroke-width="3"/>
    <path d="M730 446l34 34 70-78" fill="none" stroke="#a8fff2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M859 446C930 446 960 444 1022 444" fill="none" stroke="#a4fff2" stroke-width="22" stroke-linecap="round" opacity=".82"/>
  <path d="M733 371C686 328 650 286 620 238" fill="none" stroke="#f26ca8" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  <g transform="translate(592 190) rotate(-18)">
    <path d="M0 28L28 0l28 28-28 28z" fill="#f26ca8"/>
    <path d="M18 18l20 20m0-20L18 38" stroke="#fff0f6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="218" width="370" height="464" rx="32" fill="url(#paper)"/>
    <g clip-path="url(#docClip)">
      <circle cx="1326" cy="255" r="116" fill="#67d6dd" opacity=".22"/>
      <circle cx="1052" cy="666" r="130" fill="#5c83e7" opacity=".13"/>
      <rect x="1060" y="286" width="204" height="20" rx="10" fill="#18395b" opacity=".78"/>
      <rect x="1060" y="336" width="266" height="12" rx="6" fill="#436b89" opacity=".53"/>
      <rect x="1060" y="368" width="230" height="12" rx="6" fill="#436b89" opacity=".42"/>
      <rect x="1060" y="420" width="272" height="86" rx="18" fill="#60bfc7" opacity=".18" stroke="#348ca3" stroke-width="2"/>
      <path d="M1090 464h93" stroke="#1f7086" stroke-width="12" stroke-linecap="round" opacity=".7"/>
      <circle cx="1289" cy="464" r="20" fill="#39aa9d" opacity=".75"/>
      <path d="M1280 464l7 7 14-17" fill="none" stroke="#eafffb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1060" y="548" width="245" height="12" rx="6" fill="#436b89" opacity=".5"/>
      <rect x="1060" y="580" width="188" height="12" rx="6" fill="#436b89" opacity=".38"/>
    </g>
    <rect x="1010" y="218" width="370" height="464" rx="32" fill="none" stroke="#c8f5f4" stroke-opacity=".55" stroke-width="3"/>
  </g>

  <g fill="#7df2df" opacity=".7">
    <circle cx="968" cy="384" r="5"/>
    <circle cx="988" cy="510" r="7"/>
    <circle cx="920" cy="550" r="4"/>
    <circle cx="999" cy="360" r="3"/>
  </g>
</svg>
