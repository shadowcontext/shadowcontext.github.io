<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Biometric verification at an official service boundary</title>
  <desc id="desc">An abstract fingerprint and identity document move toward a luminous official counter while dim deceptive side paths terminate at protective barriers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2c"/>
      <stop offset="0.55" stop-color="#12304a"/>
      <stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <radialGradient id="dawn" cx="52%" cy="42%" r="55%">
      <stop offset="0" stop-color="#f7c873" stop-opacity=".3"/>
      <stop offset=".46" stop-color="#5eead4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset=".38" stop-color="#f7c873"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".1"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="mesh" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#bae6fd" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <rect width="1600" height="900" fill="url(#dawn)"/>
  <ellipse cx="835" cy="790" rx="570" ry="70" fill="#020617" opacity=".48" filter="url(#soft)"/>

  <g opacity=".38" fill="#173a52">
    <path d="M0 694L130 620l90 42 120-126 108 99 98-55 86 114z"/>
    <path d="M1600 694l-122-106-93 57-112-141-112 124-102-57-92 123z"/>
  </g>

  <path d="M186 716C382 612 510 559 690 541" fill="none" stroke="#38bdf8" stroke-opacity=".28" stroke-width="34" stroke-linecap="round"/>
  <path d="M1414 716c-190-102-329-157-505-175" fill="none" stroke="#38bdf8" stroke-opacity=".28" stroke-width="34" stroke-linecap="round"/>
  <path d="M542 760C665 650 719 596 800 543" fill="none" stroke="#f7c873" stroke-opacity=".75" stroke-width="44" stroke-linecap="round" filter="url(#glow)"/>

  <g opacity=".52">
    <path d="M285 568l108-71 107 71v137H285z" fill="#0b2135" stroke="#64748b" stroke-width="4"/>
    <rect x="329" y="576" width="127" height="129" rx="14" fill="#071827"/>
    <path d="M1277 568l-108-71-107 71v137h215z" fill="#0b2135" stroke="#64748b" stroke-width="4"/>
    <rect x="1106" y="576" width="127" height="129" rx="14" fill="#071827"/>
  </g>

  <g fill="none" stroke="#fb7185" stroke-width="12" stroke-linecap="round" opacity=".78">
    <path d="M442 590l72 72M514 590l-72 72"/>
    <path d="M1086 590l72 72M1158 590l-72 72"/>
  </g>

  <g>
