    <path d="M584 682h432l66 74H518z" fill="#0c2639" stroke="#2dd4bf" stroke-width="5"/>
    <circle cx="800" cy="336" r="46" fill="#f7c873" opacity=".18" filter="url(#glow)"/>
    <path d="M800 303l31 14v24c0 24-13 41-31 51-18-10-31-27-31-51v-24z" fill="none" stroke="#fef3c7" stroke-width="7"/>
    <path d="M785 343l11 11 22-27" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(268 248) rotate(-7 150 115)">
