    <path d="M118 195c-58-14-91-59-88-111 3-61 54-101 111-95 65 7 104 62 94 127-8 49-41 86-86 99" stroke="#ccfbf1" stroke-width="10" opacity=".9"/>
    <path d="M117 163c-36-10-57-39-54-74 3-40 36-65 74-61 42 5 66 40 60 82-5 31-25 55-53 65" stroke="#5eead4" stroke-width="9" opacity=".9"/>
