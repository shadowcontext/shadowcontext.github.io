<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Documents crossing a verified application boundary</title>
  <desc id="desc">Abstract document sheets pass through a luminous verification aperture into a protected blue workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="80" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081426"/>
      <stop offset="0.5" stop-color="#122B4A"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(880 450) rotate(90) scale(390 560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58E5E2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#58E5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAF9FA"/>
      <stop offset="1" stop-color="#91B9CD"/>
    </linearGradient>
    <linearGradient id="safePaper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B7FFF4"/>
      <stop offset="1" stop-color="#4BC6D5"/>
    </linearGradient>
    <linearGradient id="gate" x1="645" y1="175" x2="1030" y2="735" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A4FFF3"/>
      <stop offset="0.48" stop-color="#45D9E3"/>
      <stop offset="1" stop-color="#477BEB"/>
    </linearGradient>
    <linearGradient id="amber" x1="300" y1="640" x2="700" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0775D"/>
      <stop offset="1" stop-color="#FFC66A"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020812" flood-opacity="0.5"/>
    </filter>
    <clipPath id="aperture">
      <rect x="756" y="166" width="240" height="568" rx="120"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <circle cx="180" cy="120" r="250" fill="#714EC9" opacity="0.08"/>
  <circle cx="1445" cy="770" r="300" fill="#19CFC4" opacity="0.07"/>

  <g opacity="0.22" fill="none" stroke="#7894B7" stroke-width="2">
    <path d="M90 724C360 563 550 610 760 450S1174 246 1510 105"/>
    <path d="M58 813C360 651 570 699 806 531S1214 342 1548 194"/>
    <path d="M188 73C396 247 560 257 731 213S1090 116 1418 311"/>
  </g>

  <rect x="718" y="128" width="316" height="644" rx="158" fill="#47E1E3" opacity="0.14" filter="url(#blur)"/>
  <rect x="736" y="146" width="280" height="608" rx="140" fill="#091B30" stroke="url(#gate)" stroke-width="10"/>
  <rect x="766" y="176" width="220" height="548" rx="110" fill="#174660" opacity="0.75"/>

  <g transform="translate(205 252) rotate(-10 205 250)" filter="url(#soft)">
    <path d="M28 0H326L410 84V500H28Z" fill="url(#paper)"/>
    <path d="M326 0V84H410" fill="#769DB4"/>
    <path d="M86 155H324M86 213H350M86 271H300M86 329H338" stroke="#466D88" stroke-width="18" stroke-linecap="round" opacity="0.65"/>
    <circle cx="90" cy="416" r="34" fill="url(#amber)"/>
    <path d="M77 416L88 427L106 401" fill="none" stroke="#FFF1CC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g clip-path="url(#aperture)">
    <path d="M665 318L920 260L1000 315L745 373Z" fill="#A7FFF3" opacity="0.9"/>
    <path d="M655 451L912 393L1002 455L744 513Z" fill="#6FE9E7" opacity="0.86"/>
    <path d="M666 588L917 529L999 584L748 644Z" fill="#4ACAD9" opacity="0.82"/>
  </g>

  <g transform="translate(1050 230) rotate(9 190 235)" filter="url(#soft)">
    <path d="M20 0H304L390 86V470H20Z" fill="url(#safePaper)"/>
    <path d="M304 0V86H390" fill="#2F9DB5"/>
    <path d="M78 150H298M78 207H330M78 264H282M78 321H315" stroke="#126D8C" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
    <circle cx="305" cy="388" r="53" fill="#0B3E61" stroke="#D0FFF7" stroke-width="7"/>
    <path d="M280 388L299 407L333 367" fill="none" stroke="#D0FFF7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#8FF9EF">
    <circle cx="690" cy="228" r="7" opacity="0.75"/>
    <circle cx="1050" cy="675" r="8" opacity="0.7"/>
    <circle cx="1120" cy="152" r="5" opacity="0.55"/>
    <circle cx="620" cy="740" r="5" opacity="0.5"/>
  </g>
</svg>
