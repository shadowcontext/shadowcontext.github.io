<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Industrial communications module inside a segmented recovery boundary</title>
  <desc id="desc">Abstract editorial image of a dark industrial communications module isolated within layered blue network arcs, with a controlled amber recovery path leading toward a protected control core.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071525"/>
      <stop offset="0.55" stop-color="#0B2940"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientTransform="translate(802 449) rotate(90) scale(330 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D6681" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#06111E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="module" x1="623" y1="270" x2="963" y2="654" gradientUnits="userSpaceOnUse">
      <stop stop-color="#234C5F"/>
      <stop offset="0.48" stop-color="#102C3D"/>
      <stop offset="1" stop-color="#081722"/>
    </linearGradient>
    <linearGradient id="amber" x1="311" y1="735" x2="765" y2="517" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D98C2B" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#F5B84C"/>
      <stop offset="1" stop-color="#FFD884"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#02070C" flood-opacity="0.72"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#73B6C8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="802" cy="449" rx="570" ry="365" fill="url(#coreGlow)"/>

  <g fill="none" stroke-linecap="round">
