<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Metadata passing through a web output security boundary</title>
  <desc id="desc">Abstract layered web pages sit in a dark editorial space while a magenta URL ribbon passes through a faceted teal boundary and emerges as ordered light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1c33"/>
      <stop offset="1" stop-color="#11102c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#36e6d0" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#3178ff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f4ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7094bd" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4ea7"/>
      <stop offset=".48" stop-color="#b93bff"/>
      <stop offset="1" stop-color="#6b5cff"/>
    </linearGradient>
    <linearGradient id="clean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e7d1"/>
      <stop offset="1" stop-color="#65a7ff"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf8df" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#22c7c1" stop-opacity=".66"/>
      <stop offset="1" stop-color="#2074e8" stop-opacity=".8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="1" fill="#b6d8ff" opacity=".08"/>
      <circle cx="51" cy="36" r="1.2" fill="#ffffff" opacity=".05"/>
      <circle cx="30" cy="65" r=".8" fill="#6ee9dc" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="900" cy="458" rx="530" ry="410" fill="url(#halo)"/>

  <g opacity=".42" fill="none" stroke="#83a8d5" stroke-width="2">
    <path d="M90 180 C310 90 420 126 580 224"/>
    <path d="M1030 735 C1230 842 1436 778 1538 634"/>
    <path d="M106 718 C282 814 422 794 548 704"/>
  </g>

  <g transform="translate(178 174) rotate(-8 330 270)">
    <rect x="32" y="48" width="600" height="446" rx="34" fill="#050b15" opacity=".5"/>
    <rect x="0" y="0" width="600" height="446" rx="34" fill="url(#paper)" stroke="#7598c4" stroke-opacity=".32" stroke-width="3"/>
    <circle cx="54" cy="52" r="8" fill="#ff5aa8" opacity=".7"/>
    <circle cx="82" cy="52" r="8" fill="#e9b758" opacity=".62"/>
    <circle cx="110" cy="52" r="8" fill="#59dec8" opacity=".68"/>
    <path d="M48 106 H520" stroke="#bcd7f4" stroke-opacity=".18" stroke-width="14" stroke-linecap="round"/>
    <path d="M48 164 H356 M48 205 H468 M48 246 H312" stroke="#91aed0" stroke-opacity=".22" stroke-width="12" stroke-linecap="round"/>
    <rect x="48" y="306" width="486" height="78" rx="21" fill="#07101c" fill-opacity=".62" stroke="#7696bc" stroke-opacity=".26" stroke-width="2"/>
  </g>

  <g transform="translate(302 256) rotate(4 300 220)">
    <rect x="0" y="0" width="576" height="414" rx="32" fill="#12243a" fill-opacity=".82" stroke="#9bc3ea" stroke-opacity=".32" stroke-width="3"/>
    <path d="M48 78 H466" stroke="#c8dff5" stroke-opacity=".18" stroke-width="15" stroke-linecap="round"/>
    <path d="M48 140 H332 M48 184 H456 M48 228 H284" stroke="#a9c3df" stroke-opacity=".2" stroke-width="12" stroke-linecap="round"/>
    <rect x="48" y="292" width="454" height="68" rx="19" fill="#08121f" stroke="#90afd1" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="82" cy="326" r="10" fill="#b941f0" opacity=".82"/>
    <path d="M112 326 H444" stroke="#e7f3ff" stroke-opacity=".2" stroke-width="9" stroke-linecap="round"/>
  </g>

  <path d="M120 602 C296 547 426 568 566 623 C682 668 754 641 833 546 C910 453 1000 407 1108 430" fill="none" stroke="#ff41a0" stroke-opacity=".18" stroke-width="54" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M120 602 C296 547 426 568 566 623 C682 668 754 641 833 546 C910 453 1000 407 1108 430" fill="none" stroke="url(#ribbon)" stroke-width="22" stroke-linecap="round"/>
  <g fill="#ffd0eb" opacity=".78">
    <circle cx="254" cy="574" r="6"/><circle cx="292" cy="572" r="6"/><circle cx="330" cy="576" r="6"/>
    <rect x="382" y="582" width="72" height="11" rx="5.5"/><rect x="476" y="599" width="48" height="11" rx="5.5"/>
    <circle cx="594" cy="628" r="6"/><circle cx="630" cy="638" r="6"/>
  </g>

  <g transform="translate(846 230)">
    <path d="M186 0 L338 88 L338 264 C338 374 276 458 186 500 C96 458 34 374 34 264 L34 88 Z" fill="#39dfcf" opacity=".18" filter="url(#glow)"/>
    <path d="M186 16 L324 96 L324 258 C324 356 269 432 186 474 C103 432 48 356 48 258 L48 96 Z" fill="url(#facet)" stroke="#a8fff0" stroke-opacity=".72" stroke-width="4"/>
    <path d="M186 16 L186 474 C103 432 48 356 48 258 L48 96 Z" fill="#0f7fc4" opacity=".42"/>
    <path d="M48 96 L186 188 L324 96 M186 188 L186 474 M48 258 L186 188 L324 258" fill="none" stroke="#d2fff7" stroke-opacity=".34" stroke-width="3"/>
    <ellipse cx="186" cy="238" rx="70" ry="92" fill="#061827" opacity=".68"/>
    <path d="M150 242 L174 266 L226 207" fill="none" stroke="#b9fff3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M1176 430 C1290 418 1374 386 1510 318" fill="none" stroke="#55e4d4" stroke-opacity=".2" stroke-width="48" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M1176 430 C1290 418 1374 386 1510 318" fill="none" stroke="url(#clean)" stroke-width="19" stroke-linecap="round"/>
  <g fill="#c8fff5">
    <circle cx="1240" cy="417" r="6"/><circle cx="1280" cy="407" r="6"/><circle cx="1320" cy="395" r="6"/>
    <rect x="1352" y="373" width="58" height="11" rx="5.5"/><rect x="1425" y="342" width="52" height="11" rx="5.5"/>
  </g>

  <g opacity=".68">
    <circle cx="1328" cy="162" r="6" fill="#65e8dc"/>
    <circle cx="1396" cy="222" r="4" fill="#8177ff"/>
    <circle cx="1254" cy="112" r="3" fill="#ffffff"/>
    <circle cx="732" cy="118" r="5" fill="#ff4ea7"/>
    <circle cx="1462" cy="628" r="5" fill="#58daca"/>
  </g>
</svg>
