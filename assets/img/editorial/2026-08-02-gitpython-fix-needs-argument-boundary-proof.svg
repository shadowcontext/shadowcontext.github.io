<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Command fragment stopped at a protected repository boundary</title>
  <desc id="desc">An abstract amber command fragment is stopped by a luminous cyan boundary before reaching a protected field of repository blocks.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="80" x2="1480" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071321"/>
      <stop offset="0.55" stop-color="#0B2031"/>
      <stop offset="1" stop-color="#12182B"/>
    </linearGradient>
    <radialGradient id="cyanHalo" cx="0" cy="0" r="1" gradientTransform="translate(965 448) rotate(180) scale(560 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrier" x1="760" y1="175" x2="875" y2="727" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="fragment" x1="170" y1="465" x2="760" y2="465" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="cyanGlow" x="-70%" y="-30%" width="240%" height="160%">
      <feGaussianBlur stdDeviation="17" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
