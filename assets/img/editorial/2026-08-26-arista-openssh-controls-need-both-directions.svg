<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bidirectional SSH paths protected at a network gateway</title>
  <desc id="desc">Abstract editorial artwork showing cool blue inbound paths and warm amber outbound paths meeting layered access-control shields around a network gateway.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#102a40"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#2c7fa5" stop-opacity="0.32"/>
      <stop offset="0.58" stop-color="#17415d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6edf1"/>
      <stop offset="0.45" stop-color="#7296a6"/>
      <stop offset="1" stop-color="#263c4b"/>
    </linearGradient>
    <linearGradient id="bluePath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39c6f2" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#55d8ff"/>
      <stop offset="1" stop-color="#a7edff"/>
    </linearGradient>
    <linearGradient id="amberPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe1a0"/>
      <stop offset="0.55" stop-color="#f5a83c"/>
      <stop offset="1" stop-color="#f26a36" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="9" r="1" fill="#d6f5ff" opacity="0.07"/>
      <circle cx="31" cy="37" r="1.3" fill="#ffdb9b" opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g opacity="0.16" fill="none" stroke="#86b5c9" stroke-width="2">
    <path d="M70 190 C300 86 455 140 622 288"/>
    <path d="M1530 710 C1315 820 1136 748 983 614"/>
    <path d="M135 742 C312 657 416 682 555 746"/>
    <path d="M1468 159 C1286 91 1162 131 1045 220"/>
  </g>

  <ellipse cx="800" cy="456" rx="370" ry="280" fill="#1a6684" opacity="0.14" filter="url(#softGlow)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M45 347 C268 347 397 384 570 430" stroke="#1d7699" stroke-width="62" opacity="0.18"/>
    <path d="M45 347 C268 347 397 384 570 430" stroke="url(#bluePath)" stroke-width="10"/>
    <path d="M1555 553 C1326 553 1207 516 1030 470" stroke="#a85f24" stroke-width="62" opacity="0.16"/>
    <path d="M1030 470 C1207 516 1326 553 1555 553" stroke="url(#amberPath)" stroke-width="10"/>
    <path d="M82 531 C279 531 407 505 565 470" stroke="#43b7db" stroke-width="5" opacity="0.48"/>
    <path d="M1035 430 C1194 394 1328 372 1512 372" stroke="#ef9f3a" stroke-width="5" opacity="0.48"/>
  </g>

  <g fill="#88e5ff">
    <circle cx="173" cy="347" r="9"/>
    <circle cx="302" cy="365" r="6" opacity="0.75"/>
    <circle cx="427" cy="395" r="12" opacity="0.9"/>
    <circle cx="223" cy="531" r="7" opacity="0.65"/>
  </g>
  <g fill="#ffc56b">
    <circle cx="1172" cy="507" r="9"/>
    <circle cx="1304" cy="540" r="13" opacity="0.9"/>
    <circle cx="1434" cy="553" r="6" opacity="0.72"/>
    <circle cx="1377" cy="374" r="8" opacity="0.68"/>
  </g>

  <g transform="translate(800 450)">
    <path d="M0-272 C112-230 197-196 244-158 V17 C244 166 145 258 0 307 C-145 258-244 166-244 17 V-158 C-197-196-112-230 0-272Z" fill="#102c3d" stroke="#78b8cc" stroke-width="4"/>
    <path d="M0-226 C90-194 157-167 194-138 V8 C194 123 123 196 0 243 C-123 196-194 123-194 8 V-138 C-157-167-90-194 0-226Z" fill="#0b1d2b" stroke="#305e72" stroke-width="3"/>
    <path d="M0-226 C90-194 157-167 194-138 V8 C194 123 123 196 0 243Z" fill="#173448" opacity="0.72"/>

    <g transform="translate(-119 -95)">
      <rect x="0" y="0" width="238" height="250" rx="28" fill="url(#gate)" stroke="#d9f5fb" stroke-width="3"/>
      <rect x="24" y="29" width="190" height="58" rx="13" fill="#0c2433"/>
      <circle cx="57" cy="58" r="9" fill="#63ddff"/>
      <circle cx="88" cy="58" r="9" fill="#4c91aa"/>
      <path d="M121 57 H188" stroke="#8cc0cf" stroke-width="7" stroke-linecap="round"/>
      <rect x="24" y="105" width="190" height="58" rx="13" fill="#0c2433"/>
      <circle cx="57" cy="134" r="9" fill="#ffc264"/>
      <circle cx="88" cy="134" r="9" fill="#7d5b36"/>
      <path d="M121 133 H188" stroke="#caa269" stroke-width="7" stroke-linecap="round"/>
      <path d="M48 205 H190" stroke="#183b4d" stroke-width="18" stroke-linecap="round"/>
      <path d="M48 205 H137" stroke="#88d8ed" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-278-15 H-180 L-147 0" stroke="#8ce8ff" stroke-width="10"/>
      <path d="M278 15 H180 L147 0" stroke="#ffc56a" stroke-width="10"/>
      <path d="M-289-15 L-260-32 M-289-15 L-260 2" stroke="#8ce8ff" stroke-width="10"/>
      <path d="M289 15 L260-2 M289 15 L260 32" stroke="#ffc56a" stroke-width="10"/>
    </g>
    <circle cx="-177" cy="-1" r="18" fill="#6be0ff" opacity="0.45" filter="url(#smallGlow)"/>
    <circle cx="177" cy="1" r="18" fill="#ffb74f" opacity="0.45" filter="url(#smallGlow)"/>
  </g>

  <g opacity="0.28" stroke="#8ac5d5" fill="none">
    <circle cx="800" cy="450" r="342" stroke-width="2" stroke-dasharray="4 18"/>
    <circle cx="800" cy="450" r="388" stroke-width="1.5" stroke-dasharray="2 24"/>
  </g>
</svg>
