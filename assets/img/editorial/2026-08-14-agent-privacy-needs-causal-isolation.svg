<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Causal isolation for an AI agent handling private data</title>
  <desc id="desc">Abstract editorial artwork showing untrusted signals, a protected private core, and external communication separated by luminous chambers and a narrow supervised passage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102744"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#51e6cf" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#376dff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fff3" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#5b95ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#bb67ff" stop-opacity="0.17"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52e5d0"/>
      <stop offset="0.5" stop-color="#d9fff8"/>
      <stop offset="1" stop-color="#7fa3ff"/>
    </linearGradient>
    <filter id="blur40" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="13" r="1" fill="#fff" opacity="0.08"/>
      <circle cx="55" cy="31" r="1.2" fill="#fff" opacity="0.05"/>
      <circle cx="29" cy="68" r="0.8" fill="#fff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <circle cx="210" cy="190" r="180" fill="#7f43ff" opacity="0.11" filter="url(#blur40)"/>
  <circle cx="1395" cy="705" r="210" fill="#00d5b7" opacity="0.10" filter="url(#blur40)"/>

  <g opacity="0.65">
    <path d="M0 320 C170 220 300 250 420 335" fill="none" stroke="#a66cff" stroke-width="3"/>
    <path d="M0 372 C150 285 292 304 405 375" fill="none" stroke="#647dff" stroke-width="2" opacity="0.65"/>
    <path d="M1600 520 C1460 450 1350 476 1245 555" fill="none" stroke="#41dfc6" stroke-width="3"/>
    <path d="M1600 574 C1455 515 1360 535 1260 602" fill="none" stroke="#80fff0" stroke-width="2" opacity="0.55"/>
  </g>

  <g fill="#c98cff" filter="url(#glow)">
    <circle cx="144" cy="292" r="7"/><circle cx="216" cy="275" r="4"/><circle cx="276" cy="315" r="6"/>
    <circle cx="187" cy="373" r="5"/><circle cx="320" cy="386" r="4"/>
  </g>
  <g fill="#68ecd5" filter="url(#glow)">
    <circle cx="1335" cy="529" r="6"/><circle cx="1412" cy="489" r="4"/><circle cx="1473" cy="553" r="7"/>
    <circle cx="1378" cy="624" r="5"/><circle cx="1511" cy="649" r="4"/>
  </g>

  <g transform="translate(385 135)">
    <path d="M150 35 L680 35 Q740 35 740 95 L740 535 Q740 595 680 595 L150 595 Q90 595 90 535 L90 95 Q90 35 150 35Z" fill="url(#glass)" stroke="#9bbcff" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M205 92 L625 92 Q680 92 680 147 L680 483 Q680 538 625 538 L205 538 Q150 538 150 483 L150 147 Q150 92 205 92Z" fill="#071a2b" fill-opacity="0.72" stroke="#72e8d4" stroke-opacity="0.38" stroke-width="2"/>

    <path d="M415 92 V538" stroke="#97baff" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M150 315 H680" stroke="#97baff" stroke-opacity="0.18" stroke-width="2"/>

    <g transform="translate(295 190)">
      <path d="M120 0 L220 58 V174 L120 232 L20 174 V58Z" fill="#0d3043" stroke="#77f4df" stroke-width="3"/>
      <path d="M120 34 L190 75 V157 L120 198 L50 157 V75Z" fill="#173d55" stroke="#a6fff1" stroke-opacity="0.72" stroke-width="2"/>
      <circle cx="120" cy="116" r="43" fill="#54e4ce" opacity="0.18" filter="url(#glow)"/>
      <circle cx="120" cy="116" r="20" fill="#c9fff6" opacity="0.92"/>
      <circle cx="120" cy="116" r="8" fill="#1a6d77"/>
    </g>

    <g stroke-linecap="round">
      <path d="M12 225 H150" stroke="#b781ff" stroke-width="18" opacity="0.16"/>
      <path d="M12 225 H150" stroke="#b781ff" stroke-width="3" opacity="0.85"/>
      <path d="M680 405 H818" stroke="#61e6d1" stroke-width="18" opacity="0.14"/>
      <path d="M680 405 H818" stroke="#61e6d1" stroke-width="3" opacity="0.85"/>
    </g>

    <g transform="translate(126 188)">
      <rect x="0" y="0" width="48" height="74" rx="12" fill="#111f38" stroke="#b98cff" stroke-width="2"/>
      <path d="M14 19 H34 M14 31 H29 M14 43 H36 M14 55 H26" stroke="#e4cbff" stroke-width="3" stroke-linecap="round" opacity="0.82"/>
    </g>
    <g transform="translate(656 362)">
      <rect x="0" y="0" width="48" height="86" rx="14" fill="#0d2835" stroke="url(#gate)" stroke-width="3"/>
      <circle cx="24" cy="27" r="8" fill="#d5fff8"/>
      <path d="M15 50 L22 57 L35 43" fill="none" stroke="#75e8d5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17 69 H31" stroke="#7fa3ff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke="#a9c6ff" stroke-width="2" opacity="0.48">
      <circle cx="225" cy="160" r="18"/><circle cx="605" cy="195" r="13"/><circle cx="226" cy="465" r="12"/>
      <path d="M225 178 V245 H285 M605 208 V286 H556 M226 453 V386 H286"/>
    </g>
  </g>

  <path d="M1165 540 C1260 540 1284 540 1355 540" fill="none" stroke="url(#gate)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M1355 540 l-22 -14 v28Z" fill="#82f4e3"/>

  <g opacity="0.5" fill="none" stroke="#6fa5d2">
    <ellipse cx="800" cy="765" rx="490" ry="62" stroke-width="2"/>
    <ellipse cx="800" cy="765" rx="330" ry="38" stroke-width="1.5"/>
  </g>
</svg>
