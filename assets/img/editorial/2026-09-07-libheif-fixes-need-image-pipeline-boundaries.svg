<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded image-processing boundary</title>
  <desc id="desc">Abstract layered image tiles pass through a luminous guarded boundary while stalled and fragmented tiles remain isolated outside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071725"/>
      <stop offset="0.52" stop-color="#102b3c"/>
      <stop offset="1" stop-color="#071017"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bf3dc" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#27b8c8" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ce8da"/>
      <stop offset="1" stop-color="#258bad"/>
    </linearGradient>
    <linearGradient id="blocked" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36a"/>
      <stop offset="1" stop-color="#df587a"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#50e0d0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#50e0d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1" fill="#fff" opacity="0.035"/>
      <circle cx="31" cy="24" r="1.2" fill="#fff" opacity="0.025"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="910" cy="445" rx="610" ry="470" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g opacity="0.24" stroke="#7fd7dc" fill="none">
    <path d="M90 180 C330 90 500 170 690 310"/>
    <path d="M60 710 C300 600 470 690 675 570"/>
    <path d="M1020 130 C1210 250 1330 215 1530 140"/>
    <path d="M1035 740 C1210 635 1395 710 1555 615"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M710 132 Q800 87 890 132 L890 713 Q800 790 710 713 Z" fill="#0b2432" stroke="url(#gate)" stroke-width="8"/>
    <path d="M750 190 Q800 166 850 190 V663 Q800 705 750 663 Z" fill="none" stroke="#8bf3dc" stroke-width="3" opacity="0.8"/>
    <circle cx="800" cy="450" r="22" fill="#8bf3dc" filter="url(#glow)"/>
    <path d="M800 472 V550" stroke="#8bf3dc" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g transform="translate(230 257)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="220" rx="28" fill="#122f41" stroke="#44788c" stroke-width="3"/>
    <rect x="42" y="38" width="96" height="64" rx="12" fill="url(#blocked)"/>
    <rect x="156" y="38" width="102" height="64" rx="12" fill="#315167"/>
    <rect x="42" y="120" width="216" height="60" rx="12" fill="#263f52"/>
    <path d="M92 70 C142 52 177 102 225 64" fill="none" stroke="#ffd0a2" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g stroke="#f18383" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M563 350 h78"/><path d="M563 400 h48"/><path d="M563 450 h67"/>
  </g>
  <g fill="#f18383">
    <circle cx="649" cy="350" r="7"/><circle cx="619" cy="400" r="7"/><circle cx="638" cy="450" r="7"/>
  </g>

  <g transform="translate(1020 265)" filter="url(#shadow)">
    <rect x="0" y="0" width="332" height="250" rx="32" fill="#102d3e" stroke="#5cd7d4" stroke-width="3"/>
    <rect x="38" y="38" width="116" height="77" rx="14" fill="url(#tile)"/>
    <rect x="174" y="38" width="120" height="77" rx="14" fill="#3db3bd"/>
    <rect x="38" y="135" width="116" height="77" rx="14" fill="#237b9c"/>
    <rect x="174" y="135" width="120" height="77" rx="14" fill="url(#tile)"/>
    <path d="M65 179 L112 150 L140 184" fill="none" stroke="#a8fff1" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="256" cy="76" r="16" fill="#b8fff2"/>
  </g>
  <g stroke="#71e7dc" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <path d="M927 348 h55"/><path d="M947 400 h63"/><path d="M924 452 h77"/>
  </g>
  <g fill="#71e7dc">
    <circle cx="919" cy="348" r="7"/><circle cx="939" cy="400" r="7"/><circle cx="916" cy="452" r="7"/>
  </g>

  <g opacity="0.7">
    <rect x="255" y="610" width="72" height="72" rx="15" fill="#d85f7d" transform="rotate(-12 291 646)"/>
    <rect x="355" y="643" width="50" height="50" rx="11" fill="#f2a66a" transform="rotate(17 380 668)"/>
    <rect x="460" y="590" width="88" height="88" rx="18" fill="#394f62" transform="rotate(8 504 634)"/>
    <path d="M258 716 C410 780 560 748 680 650" fill="none" stroke="#dc7588" stroke-width="3" stroke-dasharray="10 18"/>
  </g>
  <g opacity="0.72" fill="#4dc9c5">
    <circle cx="1165" cy="650" r="18"/><circle cx="1222" cy="682" r="10"/><circle cx="1282" cy="633" r="14"/>
  </g>
</svg>
