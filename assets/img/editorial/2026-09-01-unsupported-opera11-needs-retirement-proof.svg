<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Unsupported broadcast appliance crossing into retirement</title>
  <desc id="desc">Abstract editorial illustration of an unsupported broadcast appliance fading behind a segmented network boundary while a protected replacement carries the signal forward.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="40" x2="1490" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071525"/>
      <stop offset="0.52" stop-color="#102A3D"/>
      <stop offset="1" stop-color="#142238"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(1140 420) rotate(150) scale(670 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31D3B2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#31D3B2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oldUnit" x1="270" y1="290" x2="720" y2="670" gradientUnits="userSpaceOnUse">
