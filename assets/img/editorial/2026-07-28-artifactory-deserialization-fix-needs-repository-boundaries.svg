<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Repository boundaries containing serialized artifact data</title>
  <desc id="desc">Abstract software artifacts move through layered repository gates while a luminous boundary contains tangled serialized data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071528"/>
      <stop offset="0.52" stop-color="#102b42"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <radialGradient id="halo" cx="52%" cy="48%" r="55%">
      <stop offset="0" stop-color="#39d8c5" stop-opacity=".28"/>
      <stop offset=".58" stop-color="#168db8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07101d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df5dc"/>
      <stop offset="1" stop-color="#2489b8"/>
    </linearGradient>
    <linearGradient id="artifact" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3fff4"/>
      <stop offset=".46" stop-color="#52d9cf"/>
      <stop offset="1" stop-color="#15769f"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf70"/>
      <stop offset="1" stop-color="#ef6f66"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#91d9db" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="830" cy="770" rx="610" ry="80" fill="#020912" opacity=".5" filter="url(#soft)"/>

  <g opacity=".28">
    <path d="M70 204C286 146 360 239 509 208S743 92 924 159s286 25 600-77" fill="none" stroke="#52b9cb" stroke-width="2"/>
    <path d="M34 714c253 64 367-17 541 22s309 97 485 48 292-5 520 37" fill="none" stroke="#52b9cb" stroke-width="2"/>
  </g>

  <g transform="translate(174 311)">
    <path d="M0 166C126 105 223 103 359 153" fill="none" stroke="#6fe7d5" stroke-opacity=".28" stroke-width="16" stroke-linecap="round"/>
    <g transform="translate(22 104)">
      <path d="M0 38 54 7l54 31-54 31Z" fill="url(#artifact)" opacity=".83"/>
      <path d="m0 38 54 31v62L0 99Z" fill="#176c8d"/>
      <path d="m108 38-54 31v62l54-32Z" fill="#0e4b70"/>
      <path d="m54 7 54 31-54 31L0 38Z" fill="none" stroke="#d7fff7" stroke-opacity=".65" stroke-width="2"/>
    </g>
    <g transform="translate(154 62) scale(.82)">
      <path d="M0 38 54 7l54 31-54 31Z" fill="url(#artifact)" opacity=".73"/>
      <path d="m0 38 54 31v62L0 99Z" fill="#176c8d"/>
      <path d="m108 38-54 31v62l54-32Z" fill="#0e4b70"/>
    </g>
    <g transform="translate(261 127) scale(.68)">
      <path d="M0 38 54 7l54 31-54 31Z" fill="url(#artifact)" opacity=".65"/>
      <path d="m0 38 54 31v62L0 99Z" fill="#176c8d"/>
      <path d="m108 38-54 31v62l54-32Z" fill="#0e4b70"/>
    </g>
  </g>

  <g transform="translate(600 142)">
    <rect x="0" y="0" width="404" height="616" rx="78" fill="#081827" stroke="url(#gate)" stroke-width="8" filter="url(#glow)"/>
    <rect x="35" y="36" width="334" height="544" rx="54" fill="#0c2637" stroke="#83f6df" stroke-opacity=".35" stroke-width="3"/>
    <path d="M87 105h230M87 511h230" stroke="#66e3d3" stroke-opacity=".4" stroke-width="7" stroke-linecap="round"/>
    <circle cx="202" cy="72" r="12" fill="#9bffea" filter="url(#glow)"/>

    <g transform="translate(91 179)">
      <path d="M19 105C-6 61 34 22 75 53c9-47 77-49 88 0 44-28 84 18 57 56 32 31 5 80-40 70-16 44-78 45-97 3-44 20-82-31-55-66-3-3-6-7-9-11Z" fill="#07121f" stroke="url(#warning)" stroke-width="5"/>
      <path d="M57 99c21-35 46 40 69 1s44 38 72-6M48 133c26 25 41-28 69 2s50-27 87-1M75 71c28 19 47-20 76 6" fill="none" stroke="#ffb368" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <circle cx="57" cy="99" r="7" fill="#ffe1a3"/>
      <circle cx="126" cy="100" r="7" fill="#ffe1a3"/>
      <circle cx="198" cy="94" r="7" fill="#ffe1a3"/>
      <circle cx="117" cy="135" r="7" fill="#ffe1a3"/>
    </g>
  </g>

  <g transform="translate(1047 337)">
    <path d="M0 129C112 88 220 86 372 137" fill="none" stroke="#6fe7d5" stroke-opacity=".42" stroke-width="16" stroke-linecap="round"/>
    <g transform="translate(45 65)">
      <path d="M0 45 64 8l64 37-64 37Z" fill="url(#artifact)"/>
      <path d="m0 45 64 37v74L0 119Z" fill="#2285a0"/>
      <path d="m128 45-64 37v74l64-37Z" fill="#145777"/>
      <path d="m64 8 64 37-64 37L0 45Z" fill="none" stroke="#e2fff9" stroke-width="3"/>
      <path d="m39 54 25 15 26-15" fill="none" stroke="#eafffa" stroke-opacity=".72" stroke-width="3"/>
    </g>
    <g transform="translate(222 104) scale(.82)">
      <path d="M0 45 64 8l64 37-64 37Z" fill="url(#artifact)"/>
      <path d="m0 45 64 37v74L0 119Z" fill="#2285a0"/>
      <path d="m128 45-64 37v74l64-37Z" fill="#145777"/>
    </g>
  </g>

  <g opacity=".7" filter="url(#glow)">
    <circle cx="548" cy="447" r="5" fill="#81f7df"/>
    <circle cx="1050" cy="447" r="5" fill="#81f7df"/>
    <path d="M516 447h58M1028 447h58" stroke="#81f7df" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
