<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Security boundary around persistent AI coding memory</title>
  <desc id="desc">Polished abstract editorial scene of layered memory cards moving through a luminous security boundary beside a structured code workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1510" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102A43"/>
      <stop offset="1" stop-color="#081725"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(819 450) rotate(90) scale(390 515)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33D6C5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#33D6C5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="740" y1="170" x2="900" y2="730" gradientUnits="userSpaceOnUse">
