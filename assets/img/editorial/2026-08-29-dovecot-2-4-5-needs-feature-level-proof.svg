<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered security gates protecting a mail stream</title>
  <desc id="desc">An abstract encrypted mail stream passes through layered protocol gates toward a central shield, illustrating feature-aware verification for a mail server security update.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b3040"/>
      <stop offset="1" stop-color="#102237"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55e6c1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#55e6c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4eb7ff" stop-opacity=".15"/>
      <stop offset=".48" stop-color="#69e8cf"/>
      <stop offset="1" stop-color="#f5bf62"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8fff5"/>
      <stop offset="1" stop-color="#43cbb0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000b13" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1075" cy="445" r="360" fill="url(#glow)"/>
  <g opacity=".16" fill="none" stroke="#7adbc8" stroke-width="2">
    <path d="M80 160 C380 40 565 210 808 118 S1240 58 1520 170"/>
    <path d="M40 740 C340 600 600 790 820 688 S1260 600 1560 730"/>
    <path d="M170 70 L105 830 M1430 65 L1502 830"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M185 325 L445 325 L535 450 L445 575 L185 575 L275 450 Z" fill="#0b2638" stroke="#3c89b5" stroke-width="4"/>
    <path d="M455 280 L700 280 L795 450 L700 620 L455 620 L550 450 Z" fill="#0c2f3d" stroke="#44b9ae" stroke-width="4"/>
    <path d="M730 235 L965 235 L1060 450 L965 665 L730 665 L825 450 Z" fill="#0e3942" stroke="#61ddc0" stroke-width="4"/>
  </g>
  <g opacity=".55" stroke="#8ee9da" stroke-width="3" fill="none">
    <circle cx="350" cy="450" r="54"/>
    <circle cx="625" cy="450" r="54"/>
    <circle cx="900" cy="450" r="54"/>
    <path d="M350 396 V504 M296 450 H404 M625 396 V504 M571 450 H679 M900 396 V504 M846 450 H954"/>
  </g>
  <path d="M85 450 C260 405 350 495 520 450 S790 405 965 450 S1225 495 1515 450" fill="none" stroke="#49e2c3" stroke-opacity=".16" stroke-width="48" filter="url(#soft)"/>
  <path d="M85 450 C260 405 350 495 520 450 S790 405 965 450 S1225 495 1515 450" fill="none" stroke="url(#stream)" stroke-width="10" stroke-linecap="round"/>
  <g fill="#102c3a" stroke="#b7fff0" stroke-width="4" filter="url(#shadow)">
    <path d="M110 405 H230 V495 H110 Z"/>
    <path d="M110 405 L170 458 L230 405"/>
    <path d="M1380 405 H1500 V495 H1380 Z"/>
    <path d="M1380 405 L1440 458 L1500 405"/>
  </g>
  <g transform="translate(1035 250)" filter="url(#shadow)">
    <path d="M165 0 C235 47 292 54 330 60 V214 C330 318 259 390 165 436 C71 390 0 318 0 214 V60 C38 54 95 47 165 0 Z" fill="#0b2534" stroke="url(#shield)" stroke-width="12"/>
    <path d="M165 62 C207 88 242 97 270 102 V210 C270 279 226 327 165 361 C104 327 60 279 60 210 V102 C88 97 123 88 165 62 Z" fill="url(#shield)" opacity=".9"/>
    <path d="M111 211 L149 249 L225 165" fill="none" stroke="#082635" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#f6c66d">
    <circle cx="535" cy="450" r="11"/>
    <circle cx="795" cy="450" r="11"/>
    <circle cx="1060" cy="450" r="11"/>
  </g>
  <g opacity=".72" fill="#69e8cf">
    <circle cx="302" cy="242" r="7"/><circle cx="575" cy="190" r="7"/><circle cx="842" cy="152" r="7"/>
    <circle cx="298" cy="662" r="7"/><circle cx="580" cy="710" r="7"/><circle cx="848" cy="748" r="7"/>
  </g>
</svg>
