<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Familiar interfaces approaching a verification threshold</title>
  <desc id="desc">An abstract editorial illustration of luminous interface-like panels moving toward a guarded threshold, while one deceptive path bends away into a red shadow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152b"/>
      <stop offset="0.52" stop-color="#10284a"/>
      <stop offset="1" stop-color="#081425"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#51e1d0" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#3e7bd8" stop-opacity=".1"/>
      <stop offset="1" stop-color="#07152b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#6ca8e8" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96fff0"/>
      <stop offset="1" stop-color="#25aeb3"/>
    </linearGradient>
    <linearGradient id="falsePath" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb178"/>
      <stop offset=".55" stop-color="#e3566f"/>
      <stop offset="1" stop-color="#8b284e" stop-opacity=".2"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="floorClip">
      <path d="M130 760 800 430l670 330-670 100z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <circle cx="800" cy="438" r="260" fill="#45d5cf" opacity=".08" filter="url(#softGlow)"/>

  <g opacity=".25" stroke="#8cc9ee" stroke-width="2" clip-path="url(#floorClip)">
    <path d="M100 800 800 430l700 370"/>
    <path d="M260 840 800 430l540 410"/>
    <path d="M470 870 800 430l330 440"/>
    <path d="M690 890 800 430l110 460"/>
    <path d="M910 890 800 430 690 890"/>
    <path d="M1130 870 800 430 470 870"/>
    <path d="M1340 840 800 430 260 840"/>
    <path d="M190 730h1220M300 670h1000M420 610h760M555 545h490M670 490h260"/>
  </g>

  <g fill="url(#panel)" stroke="#b5eaff" stroke-opacity=".5" stroke-width="3">
    <g transform="translate(210 185) rotate(-7)">
      <rect width="275" height="172" rx="24"/>
      <circle cx="38" cy="36" r="8" fill="#8be6df" stroke="none"/>
      <path d="M67 37h150M34 76h207M34 108h145M34 140h180" fill="none" stroke="#b5eaff" stroke-opacity=".34" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="translate(1095 166) rotate(7)">
      <rect width="282" height="178" rx="24"/>
      <circle cx="40" cy="38" r="8" fill="#8be6df" stroke="none"/>
      <path d="M69 39h154M36 79h210M36 112h160M36 145h187" fill="none" stroke="#b5eaff" stroke-opacity=".34" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="translate(365 415) rotate(-3)">
      <rect width="250" height="156" rx="22"/>
      <path d="M34 45h180M34 79h126M34 113h162" fill="none" stroke="#c6f4ff" stroke-opacity=".38" stroke-width="11" stroke-linecap="round"/>
    </g>
    <g transform="translate(990 408) rotate(3)">
      <rect width="250" height="156" rx="22"/>
      <path d="M34 45h180M34 79h126M34 113h162" fill="none" stroke="#c6f4ff" stroke-opacity=".38" stroke-width="11" stroke-linecap="round"/>
    </g>
  </g>

  <g>
    <path d="M680 715c44-93 68-164 73-246h94c5 82 29 153 73 246z" fill="#0b2037" stroke="url(#gate)" stroke-width="7"/>
    <path d="M748 475v-58c0-41 23-73 52-73s52 32 52 73v58" fill="none" stroke="#80f4e8" stroke-width="18" stroke-linecap="round"/>
    <rect x="759" y="481" width="82" height="104" rx="39" fill="url(#gate)"/>
    <circle cx="800" cy="521" r="12" fill="#09233a"/>
    <path d="M800 531v22" stroke="#09233a" stroke-width="10" stroke-linecap="round"/>
    <path d="M685 718h230" stroke="#9bfff1" stroke-width="8" stroke-linecap="round" filter="url(#smallGlow)" opacity=".75"/>
  </g>

  <g>
    <path d="M1020 735c66-77 89-135 82-198 93 38 154 106 190 204-102-37-180-39-272-6z" fill="url(#falsePath)" opacity=".78"/>
    <path d="M1098 539c49 19 96 57 137 115" fill="none" stroke="#ff9c84" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <circle cx="1103" cy="538" r="15" fill="#ffc092" filter="url(#smallGlow)"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M445 345c112 49 192 93 270 143" stroke="#75cce3" stroke-width="5" opacity=".48"/>
    <path d="M1160 339c-115 53-194 96-272 148" stroke="#75cce3" stroke-width="5" opacity=".48"/>
    <path d="M610 548c41 9 73 17 111 34" stroke="#7ee1da" stroke-width="5" opacity=".55"/>
    <path d="M990 548c-40 9-72 17-110 34" stroke="#7ee1da" stroke-width="5" opacity=".55"/>
  </g>

  <g fill="#aef8ed">
    <circle cx="715" cy="488" r="6"/>
    <circle cx="888" cy="487" r="6"/>
    <circle cx="721" cy="582" r="6"/>
    <circle cx="880" cy="582" r="6"/>
  </g>
  <rect x="68" y="68" width="1464" height="764" rx="42" fill="none" stroke="#8fd3ee" stroke-opacity=".12" stroke-width="2"/>
</svg>
