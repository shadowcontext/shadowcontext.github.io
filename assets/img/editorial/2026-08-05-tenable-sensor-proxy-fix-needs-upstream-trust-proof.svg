    <circle cx="146" cy="265" r="52" opacity="0.35"/><circle cx="146" cy="450" r="52" opacity="0.35"/><circle cx="146" cy="635" r="52" opacity="0.35"/>
  </g>

  <path d="M575 720V392C575 266 676 165 802 165C928 165 1029 266 1029 392V720H907V396C907 337 861 291 802 291C743 291 697 337 697 396V720Z" fill="url(#arch)" opacity="0.94"/>
  <path d="M612 720V400C612 293 696 207 802 207C908 207 992 293 992 400V720" fill="none" stroke="#B5FFF0" stroke-width="5" opacity="0.7"/>
