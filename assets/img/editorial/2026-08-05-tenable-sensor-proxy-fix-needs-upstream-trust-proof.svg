<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified sensor traffic through a hardened proxy</title>
  <desc id="desc">Abstract teal sensor streams converge through a luminous fortified arch and continue toward a verified upstream endpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1480" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071728"/>
      <stop offset="0.52" stop-color="#0B2C3A"/>
      <stop offset="1" stop-color="#111E37"/>
    </linearGradient>
    <linearGradient id="arch" x1="590" y1="170" x2="1000" y2="755" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73F2D0"/>
      <stop offset="0.48" stop-color="#25B9C1"/>
      <stop offset="1" stop-color="#3565A8"/>
    </linearGradient>
    <linearGradient id="flow" x1="130" y1="450" x2="1460" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2796AE" stop-opacity="0.18"/>
      <stop offset="0.46" stop-color="#83FFE1"/>
      <stop offset="1" stop-color="#6D9EFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1260 450) rotate(90) scale(285)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#57D7EA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#57D7EA" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1260" cy="450" r="285" fill="url(#halo)"/>
  <path d="M0 180C260 92 427 120 622 248C823 380 1030 250 1600 102V0H0Z" fill="#19425D" opacity="0.28"/>
  <path d="M0 735C258 632 425 686 650 805C854 912 1108 763 1600 690V900H0Z" fill="#152C52" opacity="0.55"/>
  <ellipse cx="802" cy="772" rx="365" ry="58" fill="#02101D" opacity="0.52" filter="url(#soft)"/>

  <g fill="none" stroke="url(#flow)" stroke-linecap="round">
