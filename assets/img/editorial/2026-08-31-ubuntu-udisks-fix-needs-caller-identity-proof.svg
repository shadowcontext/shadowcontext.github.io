<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Storage identity boundary</title>
  <desc id="desc">An abstract storage disk passes through layered identity gates toward a protected luminous core, illustrating verified caller authority.</desc>
  <defs>
    <linearGradient id="bg" x1="140" y1="70" x2="1460" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A2D"/>
      <stop offset="0.48" stop-color="#10273A"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1135 444) rotate(180) scale(470 410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DE7BF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#3D9FBC" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#07131F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="680" y1="190" x2="1110" y2="728" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79F2D1"/>
      <stop offset="0.5" stop-color="#4EC7D8"/>
      <stop offset="1" stop-color="#497DD4"/>
    </linearGradient>
    <linearGradient id="disk" x1="310" y1="310" x2="680" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7FFF4"/>
      <stop offset="0.38" stop-color="#7CDCCB"/>
      <stop offset="1" stop-color="#287C9B"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020A11" flood-opacity="0.55"/>
    </filter>
    <pattern id="grain" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r="1.2" fill="#B9F9EB" opacity="0.11"/>
      <circle cx="39" cy="31" r="0.9" fill="#91B7D4" opacity="0.10"/>
      <circle cx="19" cy="47" r="0.7" fill="#FFFFFF" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

