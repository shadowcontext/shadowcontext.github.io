    <circle cx="1050" cy="450" r="62" fill="#123B46" stroke="#B7FFEC" stroke-width="3"/>
    <path d="M1050 414C1032 414 1017 429 1017 447V469H1083V447C1083 429 1068 414 1050 414Z" fill="#8CEAD2" fill-opacity="0.20" stroke="#B9FFEC" stroke-width="4"/>
    <circle cx="1050" cy="450" r="10" fill="#D7FFF4"/>
    <path d="M1050 458V477" stroke="#D7FFF4" stroke-width="7" stroke-linecap="round"/>
