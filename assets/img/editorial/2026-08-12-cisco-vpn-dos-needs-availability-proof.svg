<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Resilient VPN route around a stressed security gateway</title>
  <desc id="desc">Abstract teal VPN gateway surrounded by amber traffic waves, with a second protected route preserving a continuous blue connection.</desc>
  <defs>
    <linearGradient id="background" x1="112" y1="82" x2="1487" y2="836" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061729"/>
      <stop offset="0.52" stop-color="#0A2E45"/>
      <stop offset="1" stop-color="#081D34"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(800 442) rotate(90) scale(390 580)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27D5D0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#27D5D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="167" y1="615" x2="1435" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62E1EF"/>
      <stop offset="0.52" stop-color="#B5FAF4"/>
      <stop offset="1" stop-color="#56C9FF"/>
    </linearGradient>
    <linearGradient id="gate" x1="681" y1="300" x2="930" y2="615" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2ADBD1"/>
      <stop offset="1" stop-color="#157C94"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
