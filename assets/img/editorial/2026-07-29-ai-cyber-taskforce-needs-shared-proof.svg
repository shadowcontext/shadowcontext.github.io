  <ellipse cx="800" cy="438" rx="262" ry="244" fill="#47d7d0" opacity=".08" filter="url(#soft)"/>
  <path d="M800 225 C887 276 965 289 1035 307 V442 C1035 595 938 688 800 746 C662 688 565 595 565 442 V307 C635 289 713 276 800 225Z"
        fill="#0b2846" fill-opacity=".88" stroke="url(#shield)" stroke-width="8"/>
  <path d="M800 268 C871 309 930 319 987 334 V439 C987 558 916 632 800 686 C684 632 613 558 613 439 V334 C670 319 729 309 800 268Z"
        fill="none" stroke="#80f3e1" stroke-opacity=".24" stroke-width="3"/>

  <g filter="url(#glow)" fill="none" stroke="#8dffeb" stroke-linecap="round">
    <circle cx="800" cy="455" r="87" stroke-width="5" stroke-dasharray="17 18"/>
    <path d="M734 468 C750 406 785 380 800 380 C820 380 851 407 867 468" stroke-width="7"/>
