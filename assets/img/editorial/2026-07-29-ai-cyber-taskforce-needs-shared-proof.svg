  <g fill="none" stroke="#7feede" stroke-opacity=".23">
    <circle cx="800" cy="455" r="314" stroke-width="2" stroke-dasharray="2 16"/>
    <circle cx="800" cy="455" r="368" stroke-width="2" stroke-dasharray="3 22"/>
  </g>
</svg>
