<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Coordinated AI cyber defense for financial networks</title>
  <desc id="desc">Abstract financial network nodes form a protective ring around a luminous AI signal, expressing shared testing and resilience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="0.52" stop-color="#102a46"/>
      <stop offset="1" stop-color="#081c35"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#63f2dc" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#3e9bd8" stop-opacity=".13"/>
      <stop offset="1" stop-color="#071629" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8affea"/>
      <stop offset=".5" stop-color="#36bddd"/>
      <stop offset="1" stop-color="#375fae"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4bd9d0" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#7ef4df" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4c79cb" stop-opacity=".12"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="430" r="430" fill="url(#halo)"/>
  <path d="M0 760 C290 632 448 782 713 700 S1134 617 1600 724 L1600 900 L0 900Z" fill="#0b2440" opacity=".7"/>
  <path d="M0 818 C276 706 504 834 758 756 S1208 695 1600 792" fill="none" stroke="#4e86c0" stroke-opacity=".15" stroke-width="3"/>

  <g fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round">
    <path d="M330 454 C430 215 634 125 805 130"/>
    <path d="M805 130 C1040 138 1237 269 1292 468"/>
    <path d="M1292 468 C1242 676 1058 778 810 783"/>
    <path d="M810 783 C567 774 380 658 330 454"/>
  </g>

  <g stroke="#76e9dc" stroke-opacity=".34" stroke-width="2">
    <path d="M410 299 L655 380"/>
    <path d="M590 164 L707 332"/>
    <path d="M1014 193 L901 335"/>
    <path d="M1207 324 L946 397"/>
    <path d="M1264 577 L949 491"/>
    <path d="M1061 725 L893 538"/>
    <path d="M579 713 L704 541"/>
    <path d="M352 563 L648 478"/>
