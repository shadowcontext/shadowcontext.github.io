<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Runtime prompt data held outside an execution core</title>
  <desc id="desc">Abstract teal prompt streams approach a luminous security boundary that shields an amber execution core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071824"/>
      <stop offset="0.55" stop-color="#0b2631"/>
      <stop offset="1" stop-color="#101925"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.35" stop-color="#f39a3c"/>
      <stop offset="1" stop-color="#c44a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bafcf3" stop-opacity="0.25"/>
      <stop offset="0.48" stop-color="#67eadc"/>
      <stop offset="1" stop-color="#1d9eb0" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16889b" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#57e1d2" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#c5fff3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="11" r="1" fill="#d8fff8" opacity="0.08"/>
      <circle cx="34" cy="29" r="1.3" fill="#79d9d0" opacity="0.07"/>
      <circle cx="19" cy="42" r="0.8" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="1270" cy="450" rx="270" ry="270" fill="#ef7636" opacity="0.08" filter="url(#soft)"/>
  <ellipse cx="1235" cy="450" rx="170" ry="170" fill="url(#core)" opacity="0.95"/>
  <g opacity="0.28" fill="none" stroke="#f7b45e">
    <circle cx="1235" cy="450" r="115" stroke-width="2"/>
    <circle cx="1235" cy="450" r="155" stroke-width="1" stroke-dasharray="5 16"/>
    <path d="M1162 390L1235 347l73 43v120l-73 43-73-43z" stroke-width="2"/>
  </g>
  <g fill="none" stroke="url(#stream)" stroke-linecap="round">
    <path d="M-60 205C190 195 310 335 540 324S760 226 951 268" stroke-width="30"/>
    <path d="M-50 392C173 362 330 434 523 432S756 370 953 399" stroke-width="22"/>
    <path d="M-70 650C165 655 295 524 516 546S744 686 950 612" stroke-width="34"/>
    <path d="M92 103C251 151 349 234 506 253" stroke-width="9" opacity="0.6"/>
    <path d="M64 756C227 701 355 711 535 651" stroke-width="11" opacity="0.55"/>
  </g>
  <g fill="#bafff3" opacity="0.74">
    <circle cx="287" cy="304" r="8"/><circle cx="428" cy="327" r="5"/><circle cx="620" cy="296" r="9"/>
    <circle cx="188" cy="390" r="5"/><circle cx="493" cy="431" r="7"/><circle cx="731" cy="390" r="5"/>
    <circle cx="304" cy="604" r="7"/><circle cx="553" cy="558" r="5"/><circle cx="798" cy="643" r="8"/>
  </g>
  <path d="M995 110C940 235 940 332 972 450C940 568 940 665 995 790C1042 684 1051 571 1020 450C1051 329 1042 216 995 110Z" fill="url(#barrier)" opacity="0.36" filter="url(#glow)"/>
  <path d="M995 110C940 235 940 332 972 450C940 568 940 665 995 790" fill="none" stroke="#8ff7e8" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M995 110C1042 216 1051 329 1020 450C1051 571 1042 684 995 790" fill="none" stroke="#2bb7c5" stroke-width="3" opacity="0.85"/>
  <g fill="#d8fff8" filter="url(#glow)">
    <circle cx="970" cy="268" r="8"/><circle cx="966" cy="399" r="7"/><circle cx="966" cy="612" r="9"/>
  </g>
  <g opacity="0.25" stroke="#77e9de" fill="none">
    <path d="M77 82H420"/><path d="M77 818H420"/><path d="M1180 82H1523"/><path d="M1180 818H1523"/>
  </g>
</svg>
