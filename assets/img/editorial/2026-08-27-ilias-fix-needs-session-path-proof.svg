<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected session path through an identity gateway</title>
  <desc id="desc">Abstract session tiles move through a guarded cyan identity gateway into isolated violet application layers on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102441"/>
      <stop offset="1" stop-color="#1b1740"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#82f5e8"/>
      <stop offset="1" stop-color="#24a9c7"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7866dc"/>
      <stop offset="1" stop-color="#ab74e8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd57d"/>
      <stop offset="1" stop-color="#f28b66"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#36daca" stop-opacity=".32"/>
      <stop offset="1" stop-color="#36daca" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020813" flood-opacity=".55"/>
    </filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#dffcff" opacity=".07"/>
      <circle cx="24" cy="19" r="1" fill="#dffcff" opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="450" rx="470" ry="380" fill="url(#halo)" filter="url(#glow)"/>

  <path d="M80 690 C300 625 410 628 585 550" fill="none" stroke="#58d4dc" stroke-opacity=".24" stroke-width="7"/>
  <path d="M1015 350 C1210 265 1375 250 1530 185" fill="none" stroke="#a985ef" stroke-opacity=".2" stroke-width="7"/>

  <g filter="url(#shadow)">
    <g transform="translate(1030 230)">
      <path d="M0 70 L310 0 L430 80 L118 152 Z" fill="url(#layer)" opacity=".92"/>
      <path d="M118 152 L430 80 L430 137 L118 210 Z" fill="#4d3f9e"/>
      <path d="M0 70 L118 152 L118 210 L0 128 Z" fill="#352f7d"/>
      <path d="M58 78 L300 25" stroke="#e4dcff" stroke-opacity=".44" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g transform="translate(1090 415)" opacity=".82">
      <path d="M0 70 L310 0 L430 80 L118 152 Z" fill="url(#layer)"/>
      <path d="M118 152 L430 80 L430 137 L118 210 Z" fill="#443891"/>
      <path d="M0 70 L118 152 L118 210 L0 128 Z" fill="#302b71"/>
    </g>
  </g>

  <g transform="translate(565 145)" filter="url(#shadow)">
    <path d="M235 0 C318 47 392 64 470 72 V342 C470 488 376 588 235 652 C94 588 0 488 0 342 V72 C78 64 152 47 235 0 Z" fill="#0c263c" stroke="url(#gate)" stroke-width="18"/>
    <path d="M235 51 C294 84 350 98 410 106 V332 C410 438 345 516 235 571 C125 516 60 438 60 332 V106 C120 98 176 84 235 51 Z" fill="#102f47" stroke="#5de5dc" stroke-opacity=".38" stroke-width="3"/>
    <circle cx="235" cy="272" r="92" fill="url(#gate)" opacity=".95"/>
    <path d="M235 211 C274 211 305 242 305 281 C305 311 286 336 260 346 V409 H210 V346 C184 336 165 311 165 281 C165 242 196 211 235 211 Z" fill="#092037"/>
    <circle cx="235" cy="280" r="26" fill="#7cf0e5"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(125 225) rotate(-8 110 72)">
      <rect width="220" height="144" rx="28" fill="url(#tile)"/>
      <circle cx="62" cy="72" r="27" fill="#fff1cb" opacity=".9"/>
      <path d="M111 54 H180 M111 79 H165 M111 104 H148" stroke="#8c4c51" stroke-width="12" stroke-linecap="round" opacity=".62"/>
    </g>
    <g transform="translate(250 465) rotate(9 100 66)">
      <rect width="200" height="132" rx="26" fill="url(#tile)"/>
      <circle cx="58" cy="66" r="24" fill="#fff1cb" opacity=".9"/>
      <path d="M100 50 H163 M100 75 H150 M100 99 H137" stroke="#8c4c51" stroke-width="11" stroke-linecap="round" opacity=".62"/>
    </g>
    <g transform="translate(400 315) rotate(-2 82 55)" opacity=".82">
      <rect width="164" height="110" rx="24" fill="url(#tile)"/>
      <circle cx="49" cy="55" r="19" fill="#fff1cb" opacity=".9"/>
      <path d="M84 42 H132 M84 65 H125 M84 86 H114" stroke="#8c4c51" stroke-width="9" stroke-linecap="round" opacity=".62"/>
    </g>
  </g>

  <g fill="none" stroke="#74eee5" stroke-width="5" stroke-linecap="round" opacity=".56">
    <path d="M345 297 C430 285 485 300 551 331"/>
    <path d="M447 523 C500 505 532 481 570 447"/>
    <path d="M1040 404 C1008 398 982 391 957 377"/>
  </g>
  <g fill="#b9fff8">
    <circle cx="469" cy="300" r="8"/>
    <circle cx="520" cy="492" r="8"/>
    <circle cx="1005" cy="396" r="8"/>
  </g>
</svg>
