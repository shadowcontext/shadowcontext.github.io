<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Server systems crossing into a supported update channel</title>
  <desc id="desc">An abstract editorial scene of amber server tiles leaving a dim unsupported zone and entering a luminous teal channel protected by layered arcs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091626"/>
      <stop offset="0.55" stop-color="#10283a"/>
      <stop offset="1" stop-color="#071118"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3943b" stop-opacity="0.08"/>
      <stop offset="0.48" stop-color="#5fc7c1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#63e0cf" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1bd65"/>
      <stop offset="1" stop-color="#a85f29"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75ead7"/>
      <stop offset="1" stop-color="#187f86"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#68dfce" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#68dfce" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000812" flood-opacity="0.58"/>
    </filter>
  </defs>
