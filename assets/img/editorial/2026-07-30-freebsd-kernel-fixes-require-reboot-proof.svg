<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected FreeBSD kernel with two contained memory faults</title>
  <desc id="desc">An abstract layered kernel core sits inside a luminous shield while two fractured memory paths are redirected into a verified outer ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.52" stop-color="#102947"/>
      <stop offset="1" stop-color="#0b1828"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#5ce1e6" stop-opacity="0.28"/>
      <stop offset="0.56" stop-color="#2878a9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07101d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#9bf8ed"/>
      <stop offset="0.45" stop-color="#38c7db"/>
      <stop offset="1" stop-color="#176595"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243e65"/>
      <stop offset="1" stop-color="#101d35"/>
    </linearGradient>
    <linearGradient id="fault" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7f6f"/>
      <stop offset="1" stop-color="#ffca78"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="edgeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1.1" fill="#b8eff4" opacity="0.11"/>
      <circle cx="31" cy="25" r="0.9" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="shieldClip">
      <path d="M800 144C952 223 1071 232 1166 252v224c0 145-91 254-366 339-275-85-366-194-366-339V252c95-20 214-29 366-108Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="438" rx="620" ry="390" fill="url(#halo)"/>

  <g opacity="0.48" fill="none" stroke="#66d7e2">
    <path d="M78 288C238 249 322 306 430 337" stroke-width="2"/>
    <path d="M1522 288c-160-39-244 18-352 49" stroke-width="2"/>
    <path d="M46 662c164 17 279-25 396-82" stroke-width="1.5"/>
    <path d="M1554 662c-164 17-279-25-396-82" stroke-width="1.5"/>
  </g>
  <g fill="#89eaf0">
    <circle cx="78" cy="288" r="5" opacity="0.55"/>
    <circle cx="430" cy="337" r="4" opacity="0.72"/>
    <circle cx="1522" cy="288" r="5" opacity="0.55"/>
    <circle cx="1170" cy="337" r="4" opacity="0.72"/>
    <circle cx="46" cy="662" r="4" opacity="0.4"/>
    <circle cx="1554" cy="662" r="4" opacity="0.4"/>
  </g>

  <path d="M800 144C952 223 1071 232 1166 252v224c0 145-91 254-366 339-275-85-366-194-366-339V252c95-20 214-29 366-108Z"
        fill="#18365a" opacity="0.55" stroke="url(#shield)" stroke-width="8" filter="url(#edgeGlow)"/>
  <path d="M800 176c132 66 234 79 330 99v193c0 121-78 211-330 291-252-80-330-170-330-291V275c96-20 198-33 330-99Z"
        fill="none" stroke="#85e9eb" stroke-width="2" opacity="0.38"/>

  <g clip-path="url(#shieldClip)">
    <ellipse cx="800" cy="490" rx="310" ry="238" fill="#3fe0e6" opacity="0.12" filter="url(#softGlow)"/>
    <g transform="translate(800 483)">
      <path d="M0-170 174-84v168L0 170-174 84V-84Z" fill="url(#core)" stroke="#77e6ea" stroke-width="4"/>
      <path d="M0-126 127-63v126L0 126-127 63V-63Z" fill="#162945" stroke="#4fb9d4" stroke-width="3"/>
      <path d="M0-81 81-40v80L0 81-81 40v-80Z" fill="#0d1729" stroke="#9cf6ed" stroke-width="4" filter="url(#edgeGlow)"/>
      <circle cx="0" cy="0" r="25" fill="#a4fff2" opacity="0.96"/>
      <circle cx="0" cy="0" r="53" fill="none" stroke="#55d8e3" stroke-width="3" opacity="0.64"/>
      <g fill="#50bcd1">
        <circle cx="-107" cy="-53" r="9"/>
        <circle cx="107" cy="-53" r="9"/>
        <circle cx="-107" cy="53" r="9"/>
        <circle cx="107" cy="53" r="9"/>
      </g>
    </g>

    <g fill="none" stroke="url(#fault)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#edgeGlow)">
      <path d="M330 395h158l42 34-48 40 74 39"/>
      <path d="M1270 576h-154l-46-35 50-42-75-37"/>
    </g>
    <g fill="#ffb879">
      <circle cx="332" cy="395" r="13"/>
      <circle cx="1268" cy="576" r="13"/>
    </g>
    <g fill="#9cf8ed" opacity="0.92">
      <path d="m568 506 18 18-18 18-18-18Z"/>
      <path d="m1032 444 18 18-18 18-18-18Z"/>
    </g>
  </g>

  <g fill="none" stroke="#92f1ed" opacity="0.67">
    <ellipse cx="800" cy="482" rx="420" ry="301" stroke-width="3" stroke-dasharray="5 18"/>
    <ellipse cx="800" cy="482" rx="484" ry="350" stroke-width="1.5" stroke-dasharray="2 24"/>
  </g>
  <g fill="#a5f8f0" filter="url(#edgeGlow)">
    <circle cx="420" cy="354" r="7"/>
    <circle cx="1180" cy="610" r="7"/>
    <circle cx="1067" cy="226" r="6"/>
    <circle cx="533" cy="738" r="6"/>
  </g>

  <path d="M741 754c18 8 38 15 59 22 21-7 41-14 59-22" fill="none" stroke="#c2fff5" stroke-width="7" stroke-linecap="round" filter="url(#edgeGlow)"/>
</svg>
