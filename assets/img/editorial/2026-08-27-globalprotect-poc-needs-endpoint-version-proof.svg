<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Endpoint version proof for a privileged network client</title>
  <desc id="desc">An abstract endpoint shield at the center of three converging software paths, surrounded by layered verification rings and restrained security signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102c46"/>
      <stop offset="1" stop-color="#081a2c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#38d6c5" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#1c8db7" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#b9fff2"/>
      <stop offset="0.45" stop-color="#45ddc8"/>
      <stop offset="1" stop-color="#1b83ab"/>
    </linearGradient>
    <linearGradient id="pathA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c7ea0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#5faed0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7ef3db"/>
    </linearGradient>
    <linearGradient id="pathB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ef3db"/>
      <stop offset="0.55" stop-color="#5faed0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5c7ea0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#9ad9ea" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="445" rx="650" ry="420" fill="url(#halo)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M90 220C335 210 455 295 622 390" stroke="url(#pathA)" stroke-width="18"/>
    <path d="M82 450C330 450 455 450 610 450" stroke="url(#pathA)" stroke-width="18"/>
    <path d="M90 680C335 690 455 605 622 510" stroke="url(#pathA)" stroke-width="18"/>
    <path d="M1510 220C1265 210 1145 295 978 390" stroke="url(#pathB)" stroke-width="18"/>
    <path d="M1518 450C1270 450 1145 450 990 450" stroke="url(#pathB)" stroke-width="18"/>
    <path d="M1510 680C1265 690 1145 605 978 510" stroke="url(#pathB)" stroke-width="18"/>
  </g>

  <g fill="#8debdc" opacity="0.9">
    <circle cx="202" cy="222" r="10"/><circle cx="340" cy="254" r="7"/><circle cx="472" cy="316" r="9"/>
    <circle cx="190" cy="450" r="9"/><circle cx="355" cy="450" r="7"/><circle cx="493" cy="450" r="10"/>
    <circle cx="202" cy="678" r="10"/><circle cx="340" cy="646" r="7"/><circle cx="472" cy="584" r="9"/>
    <circle cx="1398" cy="678" r="10"/><circle cx="1260" cy="646" r="7"/><circle cx="1128" cy="584" r="9"/>
    <circle cx="1410" cy="450" r="9"/><circle cx="1245" cy="450" r="7"/><circle cx="1107" cy="450" r="10"/>
    <circle cx="1398" cy="222" r="10"/><circle cx="1260" cy="254" r="7"/><circle cx="1128" cy="316" r="9"/>
  </g>

  <g fill="none" transform="translate(800 450)">
    <circle r="265" stroke="#75d7d2" stroke-opacity="0.15" stroke-width="2"/>
    <circle r="220" stroke="#75d7d2" stroke-opacity="0.28" stroke-width="3" stroke-dasharray="4 18"/>
    <circle r="178" stroke="#56e1cf" stroke-opacity="0.58" stroke-width="6" stroke-dasharray="70 18 14 18" transform="rotate(-22)"/>
    <circle r="148" stroke="#a3fff1" stroke-opacity="0.22" stroke-width="20"/>
  </g>

  <g filter="url(#glow)">
    <path d="M800 304L936 350V454C936 548 878 616 800 646C722 616 664 548 664 454V350Z" fill="url(#shield)"/>
    <path d="M800 343L894 376V456C894 520 856 570 800 596C744 570 706 520 706 456V376Z" fill="#0c2940" fill-opacity="0.93"/>
    <path d="M755 455L789 489L858 414" fill="none" stroke="#b9fff2" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#b9fff2">
