    <circle cx="974" cy="386" r="7"/><circle cx="995" cy="450" r="7"/><circle cx="974" cy="514" r="7"/>
  </g>
  <path d="M520 745C675 790 925 790 1080 745" fill="none" stroke="#4db8c7" stroke-opacity="0.25" stroke-width="3"/>
</svg>
