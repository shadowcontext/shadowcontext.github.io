<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified security update crossing a mobile video-processing boundary</title>
  <desc id="desc">An abstract smartphone contains layered video-processing tiles that pass through a luminous update boundary toward a shield-shaped verification core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102b4b"/>
      <stop offset="1" stop-color="#071c28"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#71f1d0" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#36a7d8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#36a7d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a60"/>
      <stop offset="1" stop-color="#0a2038"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#62cfe2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#79f0c4" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9affd9"/>
      <stop offset="1" stop-color="#28b8b0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="314" y="136" width="650" height="628" rx="54"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1110" cy="450" r="430" fill="url(#halo)"/>
  <circle cx="350" cy="120" r="250" fill="#4265d6" opacity="0.08"/>
  <path d="M0 742 C290 650 472 797 751 713 C1040 626 1266 692 1600 574 V900 H0Z" fill="#08121f" opacity="0.58"/>

  <g opacity="0.18" stroke="#70b8de" fill="none">
    <path d="M94 235 C270 168 424 172 575 228"/>
    <path d="M1030 156 C1260 118 1403 203 1536 304"/>
    <path d="M1035 738 C1264 793 1421 721 1549 621"/>
  </g>

  <rect x="278" y="96" width="722" height="708" rx="76" fill="#020812" opacity="0.65"/>
  <rect x="292" y="108" width="698" height="684" rx="68" fill="url(#phone)" stroke="#4b7da7" stroke-width="3"/>
  <rect x="314" y="136" width="650" height="628" rx="54" fill="#091b31"/>
  <rect x="558" y="119" width="166" height="14" rx="7" fill="#6b91ad" opacity="0.48"/>

  <g clip-path="url(#screenClip)">
    <circle cx="699" cy="430" r="284" fill="#2778b2" opacity="0.09"/>
    <path d="M236 631 C422 518 610 558 789 464 C877 418 945 348 1040 246" fill="none" stroke="url(#flow)" stroke-width="78" opacity="0.16"/>
    <path d="M258 631 C438 536 616 564 796 469 C890 420 954 350 1023 273" fill="none" stroke="url(#flow)" stroke-width="5"/>

    <g transform="translate(390 224)">
      <rect x="0" y="0" width="190" height="126" rx="22" fill="#294f83" stroke="#5c82bd" stroke-width="2"/>
      <rect x="30" y="28" width="130" height="70" rx="12" fill="#7c6fff" opacity="0.34"/>
      <circle cx="68" cy="62" r="20" fill="#b4a7ff" opacity="0.7"/>
      <path d="M96 87 L125 50 L158 87Z" fill="#5cc9dc" opacity="0.76"/>
    </g>
    <g transform="translate(445 390)">
      <rect x="0" y="0" width="210" height="140" rx="24" fill="#1e5574" stroke="#5fb9cd" stroke-width="2"/>
      <rect x="32" y="30" width="146" height="80" rx="12" fill="#3b91ab" opacity="0.35"/>
      <circle cx="81" cy="70" r="25" fill="#63d1d7" opacity="0.62"/>
      <path d="M108 100 L137 58 L173 100Z" fill="#8ae7ce" opacity="0.72"/>
    </g>
    <g transform="translate(535 572)">
      <rect x="0" y="0" width="228" height="142" rx="25" fill="#176068" stroke="#5ed8c1" stroke-width="2"/>
      <rect x="34" y="30" width="160" height="82" rx="12" fill="#49b99e" opacity="0.34"/>
      <circle cx="88" cy="70" r="25" fill="#86f0cd" opacity="0.63"/>
      <path d="M118 101 L148 57 L190 101Z" fill="#9affd9" opacity="0.75"/>
    </g>

    <path d="M717 136 V764" stroke="#80f3d2" stroke-width="2" opacity="0.32"/>
    <path d="M737 136 V764" stroke="#77e8cd" stroke-width="10" opacity="0.12" filter="url(#soft)"/>
    <g fill="#9affdf">
      <circle cx="727" cy="251" r="6"/>
      <circle cx="727" cy="427" r="6"/>
      <circle cx="727" cy="621" r="6"/>
    </g>
  </g>

  <g transform="translate(1028 245)">
    <circle cx="208" cy="205" r="188" fill="#49d8bf" opacity="0.12" filter="url(#glow)"/>
    <circle cx="208" cy="205" r="172" fill="#0d2940" stroke="#5fc9c5" stroke-width="3"/>
    <circle cx="208" cy="205" r="142" fill="#12364a" stroke="#86ead2" stroke-width="2" stroke-dasharray="4 16"/>
    <path d="M208 92 C252 125 298 130 326 139 V215 C326 293 272 345 208 374 C144 345 90 293 90 215 V139 C118 130 164 125 208 92Z" fill="url(#shield)" opacity="0.94"/>
    <path d="M151 226 L191 267 L271 175" fill="none" stroke="#082b3a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M151 226 L191 267 L271 175" fill="none" stroke="#e2fff4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#78e7d0" opacity="0.7">
    <circle cx="1016" cy="450" r="7"/>
    <circle cx="984" cy="450" r="4"/>
    <circle cx="952" cy="450" r="3"/>
  </g>
</svg>
