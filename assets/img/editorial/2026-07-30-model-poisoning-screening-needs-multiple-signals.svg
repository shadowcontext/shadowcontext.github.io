<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered screening of an abstract AI model lattice</title>
  <desc id="desc">A translucent model lattice passes through a curved cyan screening plane, with an amber anomaly isolated inside a dark editorial landscape.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="70" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071522"/>
      <stop offset="0.48" stop-color="#0A2030"/>
      <stop offset="1" stop-color="#071119"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(810 446) rotate(90) scale(420 690)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1DD6D0" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#0B7D91" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#06101A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="725" y1="175" x2="905" y2="738" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FFF4" stop-opacity="0.1"/>
      <stop offset="0.46" stop-color="#43EEE1" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1594AB" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glass" x1="454" y1="289" x2="1125" y2="655" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7E7E8" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#3C7583" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#B8F8F0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="edge" x1="460" y1="260" x2="1138" y2="678" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79D9D5" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#C7FFFA" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#237B91" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="anomaly" cx="0" cy="0" r="1" gradientTransform="translate(669 487) rotate(90) scale(92)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4B0"/>
      <stop offset="0.34" stop-color="#FFB83E"/>
      <stop offset="1" stop-color="#F2683A" stop-opacity="0.08"/>
    </radialGradient>
    <filter id="blur60" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="modelClip">
      <path d="M462 330L783 238L1133 335L1125 619L787 704L454 614Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <ellipse cx="802" cy="746" rx="548" ry="84" fill="#020A10" opacity="0.72" filter="url(#blur60)"/>

  <g opacity="0.44">
