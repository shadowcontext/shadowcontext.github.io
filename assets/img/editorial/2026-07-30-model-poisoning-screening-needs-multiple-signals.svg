      <path d="M550 560L669 476L787 558L907 475L1017 559"/>
      <path d="M551 476L668 390L787 475L907 390L1018 475"/>
    </g>

    <circle cx="669" cy="476" r="96" fill="url(#anomaly)" opacity="0.25" filter="url(#blur60)"/>
    <circle cx="669" cy="476" r="21" fill="#FFB53D" filter="url(#glow)"/>
    <circle cx="669" cy="476" r="7" fill="#FFF6C4"/>
    <path d="M636 450C650 430 682 426 702 449C720 469 714 501 690 515C662 531 628 511 627 482" fill="none" stroke="#FFCA66" stroke-opacity="0.64" stroke-width="4"/>
