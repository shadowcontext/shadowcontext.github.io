<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Persistent guard rings across a process boundary</title>
  <desc id="desc">Abstract nested blue rings pass through a luminous amber boundary while a continuous cyan guard arc remains intact.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102840"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="52%">
      <stop offset="0" stop-color="#35d8df" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#2388b5" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boundary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb348" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffc66b" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffb348" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65eff2"/>
      <stop offset="0.48" stop-color="#24aec7"/>
      <stop offset="1" stop-color="#3569b5"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="lineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leftHalf"><rect x="0" y="0" width="795" height="900"/></clipPath>
    <clipPath id="rightHalf"><rect x="805" y="0" width="795" height="900"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="800" cy="455" rx="620" ry="390" fill="url(#halo)"/>
  <path d="M205 160 C420 70 596 98 750 205" fill="none" stroke="#3ca8c3" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M850 695 C1050 823 1275 817 1442 702" fill="none" stroke="#3ca8c3" stroke-opacity="0.14" stroke-width="2"/>
  <g opacity="0.24" fill="#8cecf0">
    <circle cx="246" cy="646" r="4"/><circle cx="337" cy="224" r="3"/><circle cx="1288" cy="269" r="4"/><circle cx="1362" cy="602" r="3"/>
    <circle cx="468" cy="742" r="2"/><circle cx="1135" cy="154" r="2"/>
  </g>
  <rect x="763" y="105" width="74" height="690" rx="37" fill="#ffb348" opacity="0.1" filter="url(#softGlow)"/>
  <rect x="791" y="88" width="18" height="724" rx="9" fill="url(#boundary)"/>
  <path d="M800 118 L824 165 L800 212 L776 165 Z" fill="#ffd18a" opacity="0.72"/>
  <path d="M800 688 L824 735 L800 782 L776 735 Z" fill="#ffd18a" opacity="0.72"/>
  <g fill="none" stroke-linecap="round">
    <g clip-path="url(#leftHalf)">
      <ellipse cx="800" cy="450" rx="465" ry="292" stroke="#285f8d" stroke-width="42" opacity="0.4"/>
      <ellipse cx="800" cy="450" rx="354" ry="220" stroke="#2786a6" stroke-width="34" opacity="0.62"/>
      <ellipse cx="800" cy="450" rx="245" ry="150" stroke="#43cbd1" stroke-width="27" opacity="0.82"/>
    </g>
    <g clip-path="url(#rightHalf)">
      <ellipse cx="800" cy="450" rx="465" ry="292" stroke="#2b5687" stroke-width="42" opacity="0.4"/>
      <ellipse cx="800" cy="450" rx="354" ry="220" stroke="#287ba0" stroke-width="34" opacity="0.62"/>
      <ellipse cx="800" cy="450" rx="245" ry="150" stroke="#38b9c8" stroke-width="27" opacity="0.82"/>
    </g>
    <path d="M407 290 C514 166 697 124 800 158 C903 124 1086 166 1193 290" stroke="url(#ring)" stroke-width="18" filter="url(#lineGlow)"/>
    <path d="M407 610 C514 734 697 776 800 742 C903 776 1086 734 1193 610" stroke="url(#ring)" stroke-width="18" filter="url(#lineGlow)"/>
  </g>
  <ellipse cx="800" cy="450" rx="126" ry="76" fill="#0a1c2e" stroke="#70f0ed" stroke-width="5"/>
  <ellipse cx="800" cy="450" rx="80" ry="43" fill="#15374a" stroke="#36a9bf" stroke-width="3"/>
  <circle cx="800" cy="450" r="17" fill="#ffd18a"/>
  <circle cx="800" cy="450" r="34" fill="none" stroke="#ffd18a" stroke-opacity="0.24" stroke-width="12"/>
</svg>
