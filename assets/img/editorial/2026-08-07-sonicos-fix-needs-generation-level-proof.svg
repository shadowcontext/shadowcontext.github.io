    <circle cx="1090" cy="602" r="5"/><circle cx="1398" cy="526" r="4"/>
  </g>
  <g transform="translate(258 264) scale(.73)" filter="url(#shadow)" opacity=".58">
    <path d="M260 8 C339 61 413 77 492 92 V262 C492 406 400 511 260 568 C120 511 28 406 28 262 V92 C107 77 181 61 260 8Z" fill="url(#shield)" stroke="#63c8cf" stroke-width="4"/>
