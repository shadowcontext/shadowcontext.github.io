<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered firewall generations following separate remediation paths</title>
  <desc id="desc">An abstract editorial scene of three translucent firewall shields on separate luminous tracks. The foremost shield is sealed by a bright protective band, while the two older layers remain behind temporary amber barriers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#10283b"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#44e7d1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#44e7d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bafdf3" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#39c9c1" stop-opacity=".24"/>
      <stop offset="1" stop-color="#167a96" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd8c3"/>
      <stop offset=".55" stop-color="#b5fff1"/>
      <stop offset="1" stop-color="#42a9ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#f47e4d"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#02070d" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="900" cy="410" rx="630" ry="430" fill="url(#glow)"/>
  <path d="M-80 770 C330 610 600 755 890 650 C1160 552 1340 618 1690 420" fill="none" stroke="#173d55" stroke-width="115" opacity=".42"/>
  <path d="M-80 770 C330 610 600 755 890 650 C1160 552 1340 618 1690 420" fill="none" stroke="#55d8d0" stroke-width="2" opacity=".55"/>
  <path d="M-80 820 C310 670 590 820 910 710 C1200 610 1390 685 1690 510" fill="none" stroke="#15364d" stroke-width="74" opacity=".48"/>
  <path d="M-80 820 C310 670 590 820 910 710 C1200 610 1390 685 1690 510" fill="none" stroke="#f2a35e" stroke-width="2" opacity=".38"/>
