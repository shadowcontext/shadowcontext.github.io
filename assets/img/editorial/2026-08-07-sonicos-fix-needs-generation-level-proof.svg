    <path d="M259 46 C322 86 384 104 451 116 V260 C451 376 379 462 259 518 C139 462 67 376 67 260 V116 C134 104 196 86 259 46Z" fill="none" stroke="#52dccc" stroke-width="2" opacity=".55"/>
