    <circle cx="1260" cy="380" r="312"/><circle cx="1260" cy="380" r="346" stroke-dasharray="6 24"/>
  </g>
  <path d="M117 152 C334 72 492 98 642 178" fill="none" stroke="#65d8d5" stroke-width="2" opacity=".18"/>
  <path d="M118 166 C336 86 492 112 642 192" fill="none" stroke="#65d8d5" stroke-width="1" opacity=".1"/>
</svg>
