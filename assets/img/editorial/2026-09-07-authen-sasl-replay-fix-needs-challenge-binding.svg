<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Authentication challenge binding and replay rejection</title>
  <desc id="desc">Abstract amber authentication tokens approach a luminous cyan verification boundary; a repeated token is diverted while a fresh token reaches a protected gateway.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071524"/>
      <stop offset="0.55" stop-color="#10263a"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#43e6e1" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#43e6e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff5ef"/>
      <stop offset="1" stop-color="#159fae"/>
    </linearGradient>
    <linearGradient id="token" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#e77a2e"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020812" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="850" cy="450" r="410" fill="url(#glow)"/>
  <g opacity="0.16" fill="none" stroke="#83d8db" stroke-width="2">
    <path d="M80 190C330 95 470 160 650 300S1010 550 1520 340"/>
    <path d="M40 705C310 560 515 610 720 720S1160 815 1550 655"/>
    <circle cx="235" cy="235" r="95"/>
    <circle cx="1390" cy="690" r="130"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M744 125L856 125L905 206L905 694L856 775L744 775L695 694L695 206Z" fill="#0a1a2a" stroke="url(#gate)" stroke-width="10"/>
    <path d="M770 196H830V704H770Z" rx="30" fill="url(#gate)" opacity="0.9"/>
    <circle cx="800" cy="450" r="94" fill="#0a1a2a" stroke="#b8fffa" stroke-width="8"/>
    <path d="M774 452l19 20 39-50" fill="none" stroke="#b8fffa" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(260 264)">
      <circle cx="0" cy="0" r="72" fill="url(#token)"/>
      <circle cx="0" cy="0" r="39" fill="#102236" stroke="#ffe29a" stroke-width="7"/>
      <path d="M70 0H350" stroke="#ffc65a" stroke-width="16" stroke-linecap="round" opacity="0.8"/>
      <circle cx="350" cy="0" r="15" fill="#ffe29a"/>
    </g>
    <g transform="translate(270 602)" opacity="0.72">
      <circle cx="0" cy="0" r="72" fill="url(#token)"/>
      <circle cx="0" cy="0" r="39" fill="#102236" stroke="#ffe29a" stroke-width="7"/>
      <path d="M70 0H305" stroke="#f3a13f" stroke-width="16" stroke-linecap="round"/>
      <path d="M305 0c90 0 116-66 136-122" fill="none" stroke="#f05d5e" stroke-width="16" stroke-linecap="round"/>
      <path d="M422-102l22-27 8 34" fill="#f05d5e"/>
    </g>
  </g>
  <g filter="url(#shadow)">
    <path d="M1038 292L1265 220L1452 330V637L1265 750L1038 676Z" fill="#0b2032" stroke="#2ac6c9" stroke-width="7"/>
    <path d="M1110 352L1260 304L1380 374V586L1260 658L1110 611Z" fill="#102f43" stroke="#73eee9" stroke-width="5"/>
    <circle cx="1260" cy="482" r="78" fill="#071522" stroke="#86f5ef" stroke-width="7"/>
    <path d="M1227 475h66v78h-66z" fill="#2ac6c9"/>
    <path d="M1241 475v-28c0-28 38-28 38 0v28" fill="none" stroke="#b8fffa" stroke-width="12" stroke-linecap="round"/>
  </g>
  <path d="M905 450H1115" stroke="#77f1ec" stroke-width="18" stroke-linecap="round"/>
  <circle cx="1008" cy="450" r="27" fill="#d7fffb"/>
  <g opacity="0.55" fill="#4bd8d4">
    <circle cx="610" cy="145" r="9"/><circle cx="640" cy="175" r="5"/><circle cx="604" cy="760" r="7"/>
    <circle cx="968" cy="170" r="6"/><circle cx="980" cy="730" r="10"/><circle cx="1490" cy="180" r="7"/>
  </g>
</svg>
