<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity domains protected by consistent authorization boundaries</title>
  <desc id="desc">Abstract teal identity domains are separated by luminous boundaries while an amber request is stopped between mismatched authorization gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a24"/>
      <stop offset="0.52" stop-color="#0b2e38"/>
      <stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#42e8d5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#42e8d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf7e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1b7580" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd472"/>
      <stop offset="1" stop-color="#f28d3c"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="1.2" fill="#b9fff4" opacity="0.13"/>
      <circle cx="64" cy="42" r="1" fill="#b9fff4" opacity="0.09"/>
      <circle cx="39" cy="76" r="0.8" fill="#b9fff4" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="470" cy="450" rx="420" ry="360" fill="url(#halo)"/>
  <ellipse cx="1130" cy="450" rx="420" ry="360" fill="url(#halo)"/>

  <g opacity="0.38" fill="none" stroke="#40b7b3" stroke-width="2">
    <path d="M90 190 C330 50 565 60 724 220"/>
    <path d="M875 215 C1050 50 1310 70 1515 205"/>
    <path d="M105 710 C330 840 560 835 720 686"/>
    <path d="M880 690 C1060 842 1315 820 1500 690"/>
  </g>

  <g>
    <path d="M166 266 Q166 196 236 196 H620 Q690 196 690 266 V634 Q690 704 620 704 H236 Q166 704 166 634 Z" fill="url(#glass)" stroke="#52d7ca" stroke-width="3"/>
    <path d="M910 266 Q910 196 980 196 H1364 Q1434 196 1434 266 V634 Q1434 704 1364 704 H980 Q910 704 910 634 Z" fill="url(#glass)" stroke="#52d7ca" stroke-width="3"/>
    <path d="M205 299 Q205 239 265 239 H590 Q650 239 650 299 V601 Q650 661 590 661 H265 Q205 661 205 601 Z" fill="none" stroke="#80f0df" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M950 299 Q950 239 1010 239 H1335 Q1395 239 1395 299 V601 Q1395 661 1335 661 H1010 Q950 661 950 601 Z" fill="none" stroke="#80f0df" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <g fill="#a5fff0" stroke="#0c4b55" stroke-width="8">
    <circle cx="330" cy="372" r="52"/><circle cx="526" cy="372" r="52"/>
    <circle cx="330" cy="540" r="52"/><circle cx="526" cy="540" r="52"/>
    <circle cx="1074" cy="372" r="52"/><circle cx="1270" cy="372" r="52"/>
    <circle cx="1074" cy="540" r="52"/><circle cx="1270" cy="540" r="52"/>
  </g>
  <g fill="#0c4b55">
    <circle cx="330" cy="360" r="14"/><path d="M299 400 Q330 373 361 400 V410 H299Z"/>
    <circle cx="526" cy="360" r="14"/><path d="M495 400 Q526 373 557 400 V410 H495Z"/>
    <circle cx="330" cy="528" r="14"/><path d="M299 568 Q330 541 361 568 V578 H299Z"/>
    <circle cx="526" cy="528" r="14"/><path d="M495 568 Q526 541 557 568 V578 H495Z"/>
    <circle cx="1074" cy="360" r="14"/><path d="M1043 400 Q1074 373 1105 400 V410 H1043Z"/>
    <circle cx="1270" cy="360" r="14"/><path d="M1239 400 Q1270 373 1301 400 V410 H1239Z"/>
    <circle cx="1074" cy="528" r="14"/><path d="M1043 568 Q1074 541 1105 568 V578 H1043Z"/>
    <circle cx="1270" cy="528" r="14"/><path d="M1239 568 Q1270 541 1301 568 V578 H1239Z"/>
  </g>

  <rect x="778" y="130" width="44" height="640" rx="22" fill="#4ce4d1" opacity="0.18" filter="url(#soft)"/>
  <rect x="784" y="132" width="32" height="636" rx="16" fill="#63f0da" opacity="0.88"/>
  <rect x="746" y="294" width="108" height="128" rx="28" fill="#0a2732" stroke="#9cfff0" stroke-width="5" filter="url(#glow)"/>
  <rect x="746" y="478" width="108" height="128" rx="28" fill="#0a2732" stroke="#9cfff0" stroke-width="5" filter="url(#glow)"/>
  <circle cx="800" cy="358" r="18" fill="#78f4df"/>
  <path d="M800 534 v28 M786 548 h28" stroke="#78f4df" stroke-width="10" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <path d="M604 450 C665 450 697 450 735 450" fill="none" stroke="url(#amber)" stroke-width="12" stroke-linecap="round"/>
    <path d="M682 420 L735 450 L682 480 Z" fill="url(#amber)"/>
    <circle cx="635" cy="450" r="24" fill="#ffc761"/>
  </g>
  <g opacity="0.78" fill="none" stroke="#ffb454" stroke-width="4">
    <path d="M725 395 l-36 -38"/><path d="M725 505 l-36 38"/>
    <circle cx="675" cy="343" r="7" fill="#ffb454"/><circle cx="675" cy="557" r="7" fill="#ffb454"/>
  </g>

  <g opacity="0.55" stroke="#74e8d8" stroke-width="3" fill="none">
    <path d="M330 424 V488 M382 372 H474 M382 540 H474 M526 424 V488"/>
    <path d="M1074 424 V488 M1126 372 H1218 M1126 540 H1218 M1270 424 V488"/>
  </g>
</svg>
