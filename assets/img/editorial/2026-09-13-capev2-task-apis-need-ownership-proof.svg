<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ownership gate separating malware-analysis tasks</title>
  <desc id="desc">Abstract blue malware-analysis capsules occupy two workspaces while a luminous central authorization gate blocks an amber capsule from crossing between owners.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1520" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071628"/>
      <stop offset="0.5" stop-color="#0B2940"/>
      <stop offset="1" stop-color="#06111F"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(800 444) rotate(90) scale(370 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21D4D1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#21D4D1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftField" x1="160" y1="180" x2="720" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123D5D" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#0B2137" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="rightField" x1="1440" y1="180" x2="880" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123D5D" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#0B2137" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="gate" x1="740" y1="150" x2="860" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AF7E8"/>
      <stop offset="0.48" stop-color="#26D7D0"/>
      <stop offset="1" stop-color="#1488A5"/>
    </linearGradient>
    <linearGradient id="capsuleBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7FE8FF"/>
      <stop offset="1" stop-color="#2778C4"/>
    </linearGradient>
    <linearGradient id="capsuleAmber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#E87531"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="1.2" fill="#B8F5FF" opacity="0.12"/>
      <circle cx="54" cy="36" r="0.9" fill="#B8F5FF" opacity="0.1"/>
      <circle cx="28" cy="68" r="1" fill="#B8F5FF" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="444" rx="520" ry="370" fill="url(#aura)"/>

  <path d="M115 228C115 168 164 119 224 119H650C698 119 737 158 737 206V694C737 742 698 781 650 781H224C164 781 115 732 115 672Z" fill="url(#leftField)" stroke="#3B7896" stroke-opacity="0.38" stroke-width="2"/>
  <path d="M1485 228C1485 168 1436 119 1376 119H950C902 119 863 158 863 206V694C863 742 902 781 950 781H1376C1436 781 1485 732 1485 672Z" fill="url(#rightField)" stroke="#3B7896" stroke-opacity="0.38" stroke-width="2"/>

  <g opacity="0.5" fill="none" stroke="#5AA8C5" stroke-width="2">
    <path d="M203 277H574"/>
    <path d="M203 623H574"/>
    <path d="M1026 277H1397"/>
    <path d="M1026 623H1397"/>
  </g>
  <g fill="#76CAE0" opacity="0.55">
    <circle cx="203" cy="277" r="6"/><circle cx="574" cy="277" r="6"/><circle cx="203" cy="623" r="6"/><circle cx="574" cy="623" r="6"/>
    <circle cx="1026" cy="277" r="6"/><circle cx="1397" cy="277" r="6"/><circle cx="1026" cy="623" r="6"/><circle cx="1397" cy="623" r="6"/>
  </g>

  <rect x="774" y="120" width="52" height="660" rx="26" fill="#21D4D1" opacity="0.25" filter="url(#shadow)"/>
  <path d="M800 128L851 176V426C851 590 800 692 800 692C800 692 749 590 749 426V176Z" fill="#0A2235" stroke="url(#gate)" stroke-width="8"/>
  <path d="M800 205V612" stroke="url(#gate)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="800" cy="433" r="43" fill="#0A2235" stroke="#8FF3E6" stroke-width="7"/>
  <circle cx="800" cy="433" r="13" fill="#8FF3E6"/>
  <path d="M800 446V479" stroke="#8FF3E6" stroke-width="10" stroke-linecap="round"/>

  <g transform="translate(255 332) rotate(-8)">
    <rect width="230" height="118" rx="59" fill="#0A1C30" stroke="url(#capsuleBlue)" stroke-width="5"/>
    <path d="M115 8V110" stroke="#5CC9E9" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="60" cy="59" r="18" fill="#61D3EC" opacity="0.85"/>
    <path d="M148 42H190M148 59H181M148 76H198" stroke="#65B9DD" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  </g>
  <g transform="translate(354 510) rotate(6)" opacity="0.88">
    <rect width="190" height="96" rx="48" fill="#0A1C30" stroke="url(#capsuleBlue)" stroke-width="4"/>
    <circle cx="49" cy="48" r="14" fill="#61D3EC"/>
    <path d="M87 39H151M87 57H139" stroke="#65B9DD" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(1113 319) rotate(8)">
    <rect width="230" height="118" rx="59" fill="#0A1C30" stroke="url(#capsuleBlue)" stroke-width="5"/>
    <path d="M115 8V110" stroke="#5CC9E9" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="170" cy="59" r="18" fill="#61D3EC" opacity="0.85"/>
    <path d="M39 42H82M48 59H82M32 76H82" stroke="#65B9DD" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  </g>
  <g transform="translate(1056 526) rotate(-5)" opacity="0.88">
    <rect width="190" height="96" rx="48" fill="#0A1C30" stroke="url(#capsuleBlue)" stroke-width="4"/>
    <circle cx="141" cy="48" r="14" fill="#61D3EC"/>
    <path d="M39 39H103M51 57H103" stroke="#65B9DD" stroke-width="5" stroke-linecap="round"/>
  </g>

  <path d="M570 447C629 447 667 447 724 447" stroke="#FFAD55" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 18"/>
  <path d="M876 447C933 447 971 447 1030 447" stroke="#326E8E" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 18" opacity="0.55"/>
  <g transform="translate(608 392)">
    <rect width="112" height="110" rx="55" fill="#10243A" stroke="url(#capsuleAmber)" stroke-width="6"/>
    <circle cx="56" cy="55" r="22" fill="#F39A43" opacity="0.95"/>
    <path d="M43 55H69M56 42V68" stroke="#10243A" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="742" cy="447" r="20" fill="#FFAA4D" opacity="0.35" filter="url(#soft)"/>
  <path d="M729 428L758 447L729 466Z" fill="#FFB45E"/>

  <path d="M175 745C355 821 582 827 737 777M1425 745C1245 821 1018 827 863 777" fill="none" stroke="#1E6B86" stroke-width="3" opacity="0.45"/>
</svg>
