<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">File references protected by an object-authorization boundary</title>
  <desc id="desc">Abstract editorial artwork showing layered file cards and attachment nodes crossing a luminous ownership gate into a protected blue content vault.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="70" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071629"/>
      <stop offset="0.52" stop-color="#102C4B"/>
      <stop offset="1" stop-color="#091B34"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(850 438) rotate(90) scale(420 610)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27D7D1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#27D7D1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="725" y1="174" x2="918" y2="722" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EFFF1"/>
      <stop offset="0.48" stop-color="#21D6D0"/>
      <stop offset="1" stop-color="#1783C6"/>
    </linearGradient>
    <linearGradient id="card" x1="182" y1="233" x2="678" y2="686" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29496D"/>
      <stop offset="1" stop-color="#132D4C"/>
    </linearGradient>
    <linearGradient id="vault" x1="974" y1="218" x2="1408" y2="686" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D5674"/>
      <stop offset="1" stop-color="#102C55"/>
    </linearGradient>
    <linearGradient id="amber" x1="396" y1="588" x2="801" y2="481" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB65B"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020A16" flood-opacity="0.52"/>
    </filter>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="1" fill="#BDEEFF" opacity="0.09"/>
      <circle cx="31" cy="26" r="1.3" fill="#BDEEFF" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="38" fill="url(#halo)"/>
  <rect x="38" y="38" width="1524" height="824" rx="30" fill="url(#grain)" stroke="#65DDE0" stroke-opacity="0.12" stroke-width="2"/>

