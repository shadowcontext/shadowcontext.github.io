<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Revoked SSH host certificate stopped at a verified trust boundary</title>
  <desc id="desc">Polished abstract editorial scene of a luminous network path crossing layered certificate gates, with one revoked amber certificate diverted into a sealed chamber.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071824"/>
      <stop offset="0.52" stop-color="#0a2633"/>
      <stop offset="1" stop-color="#07121d"/>
    </linearGradient>
    <radialGradient id="aura" cx="48%" cy="49%" r="58%">
      <stop offset="0" stop-color="#1ed6ca" stop-opacity="0.2"/>
      <stop offset="0.65" stop-color="#0a7c87" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071824" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24677a" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#51efe0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3c92ac" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ffcf1"/>
      <stop offset="0.48" stop-color="#22c9c1"/>
      <stop offset="1" stop-color="#0d6174"/>
    </linearGradient>
    <linearGradient id="certificate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27b"/>
      <stop offset="0.5" stop-color="#f29a38"/>
      <stop offset="1" stop-color="#a84b2a"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="mesh" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#72c9cf" stroke-opacity="0.055"/>
      <circle cx="0" cy="0" r="2" fill="#71dcd6" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>

