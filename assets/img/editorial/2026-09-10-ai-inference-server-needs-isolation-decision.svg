  <path d="M639 317l25 25" stroke="#ffcf77" stroke-width="7" stroke-linecap="round"/>
  <circle cx="810" cy="445" r="136" fill="url(#core)" filter="url(#glow)"/>
  <path d="M746 396l64-37 64 37v74l-64 37-64-37z" fill="#0a3049" fill-opacity="0.72" stroke="#c5fffa" stroke-width="4"/>
  <circle cx="810" cy="433" r="34" fill="#b9fff8" opacity="0.94"/>
  <path d="M810 359v-42M874 396l37-22M874 470l37 22M810 507v42M746 470l-37 22M746 396l-37-22" stroke="#89ede9" stroke-width="8" stroke-linecap="round"/>
