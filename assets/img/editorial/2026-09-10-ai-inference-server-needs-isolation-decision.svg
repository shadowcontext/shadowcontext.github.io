<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Isolated industrial AI inference core</title>
  <desc id="desc">An abstract industrial AI processing core is enclosed by layered blue isolation rings while an amber data stream is diverted through a guarded boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2942"/>
      <stop offset="1" stop-color="#071b2f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#9ff8f0"/>
      <stop offset="0.45" stop-color="#28bed0"/>
      <stop offset="1" stop-color="#126785"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a632" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffc45c"/>
      <stop offset="1" stop-color="#e57d20"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#78dbe5" stroke-opacity="0.055" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="810" cy="445" r="360" fill="#0a3450" opacity="0.42"/>
