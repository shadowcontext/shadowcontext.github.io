  <circle cx="810" cy="445" r="246" fill="none" stroke="#74e3e8" stroke-opacity="0.42" stroke-width="18"/>
  <circle cx="810" cy="445" r="210" fill="#09253b" stroke="#50d2df" stroke-width="3"/>
  <path d="M102 308C260 308 314 356 432 356H545C612 356 647 389 668 421" fill="none" stroke="url(#amber)" stroke-width="20" stroke-linecap="round"/>
  <path d="M101 515C260 515 322 487 449 487H585" fill="none" stroke="#f6a33a" stroke-opacity="0.42" stroke-width="6" stroke-linecap="round"/>
  <path d="M584 487c38 0 58 17 78 40" fill="none" stroke="#f6a33a" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>
