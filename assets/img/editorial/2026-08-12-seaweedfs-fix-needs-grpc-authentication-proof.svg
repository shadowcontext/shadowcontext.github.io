<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Distributed storage protected by an authentication gate</title>
  <desc id="desc">Abstract teal storage nodes converge through a luminous identity gate inside layered blue protective boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182b"/>
      <stop offset="0.58" stop-color="#0a2840"/>
      <stop offset="1" stop-color="#10354b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#53f3cf" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#53f3cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8affdf"/>
      <stop offset="1" stop-color="#2bc2ba"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c6880"/>
      <stop offset="1" stop-color="#153d59"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020914" flood-opacity="0.6"/>
    </filter>
  </defs>
