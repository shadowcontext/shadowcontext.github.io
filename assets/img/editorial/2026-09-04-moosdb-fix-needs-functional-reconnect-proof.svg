<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Middleware connection boundary with a stalled handshake</title>
  <desc id="desc">An abstract teal middleware hub sits behind concentric protective rings as several connections flow through; one amber connection stops at the outer boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2b"/>
      <stop offset="0.52" stop-color="#0b3140"/>
      <stop offset="1" stop-color="#10253b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#54e0ce" stop-opacity="0.26"/>
      <stop offset="0.58" stop-color="#1ba6a5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071b2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af4df"/>
      <stop offset="1" stop-color="#1b8799"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a84b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffc861"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="850" cy="430" rx="600" ry="430" fill="url(#halo)"/>
  <path d="M0 735 C270 620 390 810 660 702 S1120 570 1600 706 L1600 900 L0 900Z" fill="#07131f" opacity="0.72"/>
  <path d="M0 180 C310 90 492 210 700 150 S1165 50 1600 180" fill="none" stroke="#4fd2c2" stroke-opacity="0.08" stroke-width="2"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="850" cy="430" r="268" stroke="#70e4d1" stroke-opacity="0.16" stroke-width="34"/>
    <circle cx="850" cy="430" r="229" stroke="url(#ring)" stroke-width="5" stroke-dasharray="510 48 132 32"/>
    <circle cx="850" cy="430" r="176" stroke="#74e8d6" stroke-opacity="0.3" stroke-width="2"/>
  </g>
  <g stroke="#5bd8c6" fill="none" stroke-width="6" stroke-linecap="round" opacity="0.86">
    <path d="M150 236 C360 236 438 322 624 356"/>
    <path d="M118 505 C342 505 438 475 621 452"/>
    <path d="M258 720 C425 646 508 576 661 526"/>
    <path d="M1450 244 C1275 244 1190 320 1078 360"/>
    <path d="M1476 579 C1276 579 1187 512 1081 481"/>
  </g>
  <g fill="#6ce6d3" filter="url(#glow)">
    <circle cx="150" cy="236" r="10"/><circle cx="118" cy="505" r="10"/>
    <circle cx="258" cy="720" r="10"/><circle cx="1450" cy="244" r="10"/>
    <circle cx="1476" cy="579" r="10"/>
  </g>
  <path d="M112 382 C338 382 448 397 604 410" fill="none" stroke="url(#amber)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="606" cy="410" r="28" fill="#f3a847" opacity="0.18" filter="url(#soft)"/>
  <circle cx="606" cy="410" r="14" fill="#ffc861" filter="url(#glow)"/>
  <path d="M615 387 L637 410 L615 433" fill="none" stroke="#ffd98b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <g transform="translate(850 430)">
    <circle r="124" fill="#0a2735" stroke="#9af7e4" stroke-width="5"/>
    <circle r="94" fill="#0d3e49" stroke="#43c9ba" stroke-width="3"/>
    <circle r="49" fill="#72e7d3" opacity="0.18" filter="url(#glow)"/>
    <circle r="35" fill="#72e7d3"/>
    <g fill="#c5fff3">
      <circle cx="0" cy="-76" r="9"/><circle cx="66" cy="-38" r="9"/>
      <circle cx="66" cy="38" r="9"/><circle cx="0" cy="76" r="9"/>
      <circle cx="-66" cy="38" r="9"/><circle cx="-66" cy="-38" r="9"/>
    </g>
    <g stroke="#70e5d2" stroke-width="4" opacity="0.68">
      <path d="M0 -67 V-35"/><path d="M57 -33 L30 -17"/><path d="M57 33 L30 17"/>
      <path d="M0 67 V35"/><path d="M-57 33 L-30 17"/><path d="M-57 -33 L-30 -17"/>
    </g>
  </g>
  <g fill="#93f3e2" opacity="0.38">
    <circle cx="560" cy="170" r="4"/><circle cx="1255" cy="680" r="5"/>
    <circle cx="1324" cy="395" r="3"/><circle cx="416" cy="596" r="4"/>
    <circle cx="1068" cy="132" r="3"/><circle cx="721" cy="744" r="3"/>
  </g>
</svg>
