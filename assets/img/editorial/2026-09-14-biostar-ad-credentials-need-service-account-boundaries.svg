<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Service-account boundary protecting an access-control directory link</title>
  <desc id="desc">Abstract editorial illustration of a luminous access-control portal separating directory nodes from a sealed key vault, with restricted connection paths passing through layered security boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071428"/>
      <stop offset="0.52" stop-color="#0b2940"/>
      <stop offset="1" stop-color="#071b2b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="56%">
      <stop offset="0" stop-color="#37d5cb" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#1c86b8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#071428" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d7ca"/>
      <stop offset=".5" stop-color="#9cf4dc"/>
      <stop offset="1" stop-color="#3b8fd2"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4fff1"/>
      <stop offset="1" stop-color="#69d8ca"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7ac8d9" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="440" rx="650" ry="420" fill="url(#halo)"/>
  <ellipse cx="780" cy="790" rx="570" ry="38" fill="#020b15" opacity=".65" filter="url(#soft)"/>

  <g opacity=".88" fill="none" stroke-linecap="round">
    <path d="M156 252C330 252 372 329 508 329" stroke="#45b7cf" stroke-width="8"/>
    <path d="M125 449C306 449 351 449 508 449" stroke="#50cfd0" stroke-width="8"/>
    <path d="M176 650C336 650 382 567 508 567" stroke="#397fae" stroke-width="8"/>
    <path d="M1092 449C1230 449 1280 449 1450 449" stroke="#5fe0cf" stroke-width="8"/>
  </g>

  <g fill="#0e344c" stroke="#6ee3db" stroke-width="5">
    <circle cx="155" cy="252" r="34"/>
    <circle cx="124" cy="449" r="42"/>
    <circle cx="175" cy="650" r="30"/>
    <circle cx="301" cy="296" r="18" opacity=".82"/>
    <circle cx="309" cy="602" r="18" opacity=".82"/>
  </g>
  <g fill="#83eadf">
    <circle cx="155" cy="252" r="9"/>
    <circle cx="124" cy="449" r="11"/>
    <circle cx="175" cy="650" r="8"/>
    <circle cx="301" cy="296" r="5"/>
    <circle cx="309" cy="602" r="5"/>
  </g>

  <g>
    <rect x="495" y="136" width="610" height="626" rx="76" fill="#092237" stroke="#2f83aa" stroke-width="9"/>
    <rect x="535" y="176" width="530" height="546" rx="56" fill="#071a2b" stroke="url(#portal)" stroke-width="12"/>
    <rect x="576" y="218" width="448" height="462" rx="40" fill="#0b2d42" stroke="#73dfd4" stroke-opacity=".56" stroke-width="3"/>
    <path d="M800 222V676" stroke="#69d9d1" stroke-opacity=".16" stroke-width="2"/>
    <path d="M580 449H1020" stroke="#69d9d1" stroke-opacity=".16" stroke-width="2"/>
  </g>

  <g transform="translate(674 297)">
    <path d="M62 122V82c0-70 128-70 128 0v40" fill="none" stroke="#b9f9e8" stroke-width="24" stroke-linecap="round"/>
    <rect x="28" y="112" width="196" height="190" rx="38" fill="url(#vault)" stroke="#e6fff7" stroke-width="6"/>
    <circle cx="126" cy="198" r="31" fill="#0b3248"/>
    <path d="M126 220v43" stroke="#0b3248" stroke-width="20" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M1080 449h166" stroke="#7be8d9" stroke-width="10"/>
    <path d="M1246 449l-31-28m31 28-31 28" stroke="#7be8d9" stroke-width="10"/>
    <path d="M610 449h50" stroke="#ffbe63" stroke-width="8" stroke-dasharray="4 24" opacity=".9"/>
  </g>

  <g transform="translate(1282 321)">
    <path d="M84 0l84 35v72c0 77-50 125-84 140C50 232 0 184 0 107V35z" fill="#0d3d51" stroke="#70e4d8" stroke-width="7"/>
    <path d="M45 112l26 27 55-65" fill="none" stroke="#c8ffec" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity=".42" fill="#6edfd8">
    <circle cx="457" cy="329" r="6"/><circle cx="421" cy="449" r="6"/><circle cx="461" cy="567" r="6"/>
    <circle cx="1141" cy="449" r="6"/><circle cx="1180" cy="449" r="6"/>
  </g>
  <rect x="529" y="170" width="542" height="558" rx="62" fill="none" stroke="#69e0d5" stroke-width="3" opacity=".58" filter="url(#glow)"/>
</svg>
