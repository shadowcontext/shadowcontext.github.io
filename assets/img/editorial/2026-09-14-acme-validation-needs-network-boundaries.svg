<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ACME validation request stopped at an internal network boundary</title>
  <desc id="desc">Abstract editorial artwork showing a certificate-shaped shield filtering a redirected request path before it can reach protected internal nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102a46"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#48d7c4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#48d7c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fff7"/>
      <stop offset="0.42" stop-color="#6ee7d8"/>
      <stop offset="1" stop-color="#138c91"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#effffb"/>
      <stop offset="1" stop-color="#a9dcd8"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000b18" flood-opacity=".55"/>
    </filter>
  </defs>
