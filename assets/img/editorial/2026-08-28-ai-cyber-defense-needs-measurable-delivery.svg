<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Measurable AI-enabled cyber defense</title>
  <desc id="desc">Abstract blue and amber defensive layers convert fragmented incoming signals into a stable illuminated network surrounding a protected core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0a2840"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ee7f2" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#1b8fb5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#071827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af5ef" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#28a9ca" stop-opacity=".34"/>
      <stop offset="1" stop-color="#14658c" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ffc66b" stop-opacity=".92"/>
      <stop offset="1" stop-color="#fff0bd" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="1" fill="#b7f8ff" opacity=".12"/>
      <circle cx="37" cy="44" r="1.4" fill="#6fdce8" opacity=".09"/>
      <circle cx="57" cy="20" r=".8" fill="#ffffff" opacity=".09"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="925" cy="450" rx="590" ry="480" fill="url(#halo)"/>
  <ellipse cx="760" cy="780" rx="610" ry="90" fill="#02101b" opacity=".62" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g opacity=".5" fill="none" stroke="#2d7898" stroke-width="2">
    <path d="M102 181 C279 205 334 302 493 320"/>
    <path d="M72 721 C240 685 327 594 493 579"/>
    <path d="M1498 184 C1320 213 1273 305 1110 320"/>
    <path d="M1528 718 C1365 683 1276 590 1110 578"/>
  </g>

  <g opacity=".86">
    <path d="M88 248 L247 279 L301 251 L394 315 L325 349 L203 325 Z" fill="#d87535" opacity=".46"/>
    <path d="M47 438 L216 404 L318 452 L222 493 L86 475 Z" fill="#ff9f43" opacity=".34"/>
    <path d="M116 654 L263 597 L376 622 L301 686 L178 701 Z" fill="#ba5d36" opacity=".4"/>
    <path d="M180 143 L270 174 L243 222 L138 190 Z" fill="#ffbb62" opacity=".28"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M121 286 C294 310 368 374 493 397" stroke="url(#amber)" stroke-width="7"/>
    <path d="M86 450 C286 450 373 450 493 450" stroke="url(#amber)" stroke-width="7"/>
    <path d="M130 636 C295 603 371 534 493 503" stroke="url(#amber)" stroke-width="7"/>
  </g>

  <g transform="translate(800 450)">
    <path d="M0-354 C180-316 281-240 316-96 C353 58 286 231 167 316 C99 364 45 391 0 408 C-45 391-99 364-167 316 C-286 231-353 58-316-96 C-281-240-180-316 0-354Z" fill="#0a2638" stroke="#2d7898" stroke-width="3" opacity=".68"/>
    <path d="M0-296 C145-265 226-203 255-83 C284 43 232 183 136 251 C82 290 37 312 0 326 C-37 312-82 290-136 251 C-232 183-284 43-255-83 C-226-203-145-265 0-296Z" fill="url(#shield)" stroke="#62dce8" stroke-width="4" opacity=".72"/>
    <path d="M0-232 C108-209 170-159 191-67 C213 27 174 132 102 183 C61 212 28 229 0 240 C-28 229-61 212-102 183 C-174 132-213 27-191-67 C-170-159-108-209 0-232Z" fill="#092b40" stroke="#82eee9" stroke-width="2" opacity=".92"/>

    <g stroke="#73e9ed" stroke-width="3" fill="none" opacity=".72">
      <path d="M-153-70 L-74-118 L0-74 L78-121 L154-65"/>
      <path d="M-152 25 L-82-18 L0 28 L84-16 L153 27"/>
      <path d="M-118 113 L-48 72 L25 116 L104 76"/>
    </g>
    <g fill="#a4fff2" filter="url(#glow)">
      <circle cx="-153" cy="-70" r="7"/>
      <circle cx="-74" cy="-118" r="7"/>
      <circle cy="-74" r="8"/>
      <circle cx="78" cy="-121" r="7"/>
      <circle cx="154" cy="-65" r="7"/>
      <circle cx="-152" cy="25" r="7"/>
      <circle cx="-82" cy="-18" r="7"/>
      <circle cy="28" r="9"/>
      <circle cx="84" cy="-16" r="7"/>
      <circle cx="153" cy="27" r="7"/>
      <circle cx="-118" cy="113" r="7"/>
      <circle cx="-48" cy="72" r="7"/>
      <circle cx="25" cy="116" r="7"/>
      <circle cx="104" cy="76" r="7"/>
    </g>
    <circle r="46" fill="#0b3950" stroke="#d5fff4" stroke-width="4"/>
    <circle r="19" fill="#e9fff7" filter="url(#glow)"/>
  </g>

  <g fill="none" stroke="#67dbe7" stroke-width="3" opacity=".72">
    <path d="M1108 320 C1230 328 1291 275 1438 249"/>
    <path d="M1114 450 C1268 450 1331 450 1516 450"/>
    <path d="M1110 580 C1238 569 1306 632 1457 664"/>
  </g>
  <g fill="#7eeef0" filter="url(#glow)">
    <circle cx="1191" cy="310" r="7"/><circle cx="1288" cy="285" r="7"/><circle cx="1381" cy="259" r="7"/>
    <circle cx="1205" cy="450" r="7"/><circle cx="1322" cy="450" r="7"/><circle cx="1447" cy="450" r="7"/>
    <circle cx="1193" cy="592" r="7"/><circle cx="1294" cy="620" r="7"/><circle cx="1390" cy="648" r="7"/>
  </g>
  <g fill="#d8fff7" opacity=".86">
    <path d="M1438 239 l24 10 -24 10 -24-10Z"/>
    <path d="M1516 440 l24 10 -24 10 -24-10Z"/>
