      <circle cx="442" cy="260" r="13"/>
      <circle cx="406" cy="415" r="13"/>
      <circle cx="238" cy="481" r="13"/>
      <circle cx="70" cy="415" r="13"/>
    </g>
  </g>

  <g fill="#a9fdf0" opacity="0.4">
    <circle cx="189" cy="174" r="5"/>
    <circle cx="407" cy="718" r="7"/>
    <circle cx="1017" cy="112" r="6"/>
    <circle cx="1431" cy="710" r="8"/>
    <circle cx="1328" cy="807" r="5"/>
