  </g>

  <rect x="758" y="96" width="18" height="708" rx="9" fill="url(#barrier)"/>
  <rect x="735" y="148" width="64" height="604" rx="32" fill="#55ead9" opacity="0.12" filter="url(#glow)"/>
  <g fill="#89fff0">
    <circle cx="767" cy="211" r="7"/>
    <circle cx="767" cy="449" r="10"/>
    <circle cx="767" cy="681" r="6"/>
  </g>

  <g transform="translate(890 190)">
    <circle cx="238" cy="260" r="238" fill="#5b5ee8" fill-opacity="0.09" stroke="#666fea" stroke-opacity="0.42" stroke-width="5"/>
    <circle cx="238" cy="260" r="169" fill="#0b1630" stroke="#5cf0dd" stroke-width="7"/>
    <path d="M238 116L351 181V312L238 377L125 312V181Z" fill="#15294b" stroke="#7c72ff" stroke-width="8"/>
    <circle cx="238" cy="246" r="74" fill="#151d3d" stroke="#83f7e7" stroke-width="8"/>
    <path d="M210 226C210 205 227 188 248 188C269 188 286 205 286 226V241" fill="none" stroke="#ffbf79" stroke-width="13" stroke-linecap="round"/>
    <rect x="192" y="231" width="96" height="82" rx="20" fill="url(#capsule)"/>
    <circle cx="240" cy="267" r="12" fill="#201635"/>
    <path d="M240 278V294" stroke="#201635" stroke-width="10" stroke-linecap="round"/>

