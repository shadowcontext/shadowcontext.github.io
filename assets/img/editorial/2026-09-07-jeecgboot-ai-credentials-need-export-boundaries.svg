    <rect x="36" y="39" width="394" height="266" rx="24" fill="#132640" stroke="#526f99" stroke-width="5"/>
    <rect x="0" y="0" width="394" height="266" rx="24" fill="url(#sheet)" stroke="#7aa8ca" stroke-width="6"/>
    <path d="M52 62H340M52 116H340M52 170H340M52 224H340M132 36V238M235 36V238" fill="none" stroke="#6f91b3" stroke-opacity="0.48" stroke-width="4"/>
    <rect x="246" y="126" width="76" height="28" rx="8" fill="#ffad6d" opacity="0.72"/>
