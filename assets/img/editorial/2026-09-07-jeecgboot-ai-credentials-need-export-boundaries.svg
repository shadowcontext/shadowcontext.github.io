<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI credential export boundary</title>
  <desc id="desc">Abstract editorial artwork showing a protected AI core and sealed credential capsule while spreadsheet-like layers stop at a luminous access boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.52" stop-color="#111c38"/>
      <stop offset="1" stop-color="#050915"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#706dff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#35d8cf" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#050915" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8fff2" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#70f5df"/>
      <stop offset="0.82" stop-color="#786dff"/>
      <stop offset="1" stop-color="#786dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3554"/>
      <stop offset="1" stop-color="#0b172c"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffda8c"/>
      <stop offset="0.5" stop-color="#ff9f66"/>
      <stop offset="1" stop-color="#d55279"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8fb7da" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="815" cy="450" rx="660" ry="410" fill="url(#halo)"/>

  <g opacity="0.36" fill="none" stroke="#6c87b5" stroke-width="2">
    <path d="M0 170C292 116 458 238 707 180S1209 119 1600 199"/>
    <path d="M0 731C253 792 438 669 716 730S1245 799 1600 697"/>
  </g>

