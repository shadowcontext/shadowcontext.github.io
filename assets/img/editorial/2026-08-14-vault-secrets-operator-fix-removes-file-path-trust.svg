    <circle cx="252" cy="275" r="92" fill="#35dcb5" opacity="0.13" filter="url(#glow)"/>
    <path d="M205 264 v-34 c0-62 94-62 94 0v34" fill="none" stroke="#c9fff1" stroke-width="15" stroke-linecap="round"/>
    <rect x="184" y="258" width="136" height="108" rx="24" fill="#59e0bd" fill-opacity="0.22" stroke="#c9fff1" stroke-width="4"/>
    <circle cx="252" cy="307" r="16" fill="#d9fff6"/>
    <path d="M252 321 v21" stroke="#d9fff6" stroke-width="9" stroke-linecap="round"/>
  </g>

  <path d="M52 360 C235 360 326 360 492 430 C550 454 583 456 630 447" fill="none" stroke="#a77dff" stroke-opacity="0.22" stroke-width="24" stroke-linecap="round"/>
