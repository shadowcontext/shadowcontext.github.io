    <path d="M24 28 H72 M24 48 H61 M24 68 H70 M24 88 H54" stroke="#e5d8ff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <path d="M970 447 C1032 438 1072 422 1118 392 C1210 332 1312 334 1548 334" fill="none" stroke="#4de7c1" stroke-opacity="0.18" stroke-width="26" stroke-linecap="round"/>
  <path d="M970 447 C1032 438 1072 422 1118 392 C1210 332 1312 334 1548 334" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g transform="translate(1040 358)">
    <path d="M52 0 L104 30 V90 L52 120 L0 90 V30Z" fill="#0d2b3a" stroke="#68edcd" stroke-width="4"/>
    <path d="M28 58 L44 74 L78 40" fill="none" stroke="#d6fff5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
