<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded secret reference replacing controller file-path trust</title>
  <desc id="desc">Abstract editorial artwork of a Kubernetes-like control plane surrounding a sealed secret chamber, with a luminous route redirected through a guarded reference gate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.5" stop-color="#12243a"/>
      <stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#34e4bc" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#3a75ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64f3d0" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#5d8dff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#876cff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a27bff"/>
      <stop offset="0.48" stop-color="#edf9ff"/>
      <stop offset="1" stop-color="#4ee7c2"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="14" r="1" fill="#ffffff" opacity="0.06"/>
      <circle cx="48" cy="35" r="0.8" fill="#ffffff" opacity="0.05"/>
      <circle cx="25" cy="61" r="1.1" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <circle cx="210" cy="720" r="220" fill="#744dff" opacity="0.1" filter="url(#soft)"/>
  <circle cx="1390" cy="180" r="200" fill="#22d6aa" opacity="0.09" filter="url(#soft)"/>

  <g fill="none" stroke="#7396c8" stroke-opacity="0.28" stroke-width="2">
