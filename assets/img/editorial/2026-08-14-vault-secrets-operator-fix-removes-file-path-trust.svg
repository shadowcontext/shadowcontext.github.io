  <g fill="#152b46" stroke="#7aa4d9" stroke-opacity="0.48" stroke-width="2">
    <path d="M260 196 l70 -40 70 40v80l-70 40-70-40Z"/>
    <path d="M174 422 l54 -31 54 31v62l-54 31-54-31Z"/>
    <path d="M390 492 l58 -34 58 34v68l-58 34-58-34Z"/>
    <path d="M1200 196 l70 -40 70 40v80l-70 40-70-40Z"/>
    <path d="M1318 422 l54 -31 54 31v62l-54 31-54-31Z"/>
    <path d="M1094 492 l58 -34 58 34v68l-58 34-58-34Z"/>
  </g>

  <g transform="translate(548 154)">
