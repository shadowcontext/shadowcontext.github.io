<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected namespace boundaries in a shared routing plane</title>
  <desc id="desc">Abstract Kubernetes tenant spaces separated by luminous blue boundaries as converging route ribbons are stopped by an amber shield.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102849"/>
      <stop offset="1" stop-color="#07101e"/>
    </linearGradient>
    <linearGradient id="panelA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e8fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#15456f" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="panelB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5cff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22366c" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="routeA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d7ff" stop-opacity=".15"/>
      <stop offset=".7" stop-color="#55e3ff"/>
      <stop offset="1" stop-color="#eefcff"/>
    </linearGradient>
    <linearGradient id="routeB" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9a76ff" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#b696ff"/>
      <stop offset="1" stop-color="#f6f0ff"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd879"/>
      <stop offset=".5" stop-color="#ffab38"/>
      <stop offset="1" stop-color="#d97812"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#51cfff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#51cfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#7bc9ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="460" rx="540" ry="330" fill="url(#halo)" filter="url(#soft)"/>

  <g opacity=".95">
    <path d="M110 150 Q120 100 180 98 H654 Q710 100 716 158 L736 738 Q738 800 674 806 H178 Q116 802 112 744Z" fill="url(#panelA)" stroke="#3ebdff" stroke-opacity=".65" stroke-width="3"/>
    <path d="M1490 150 Q1480 100 1420 98 H946 Q890 100 884 158 L864 738 Q862 800 926 806 H1422 Q1484 802 1488 744Z" fill="url(#panelB)" stroke="#9a7dff" stroke-opacity=".62" stroke-width="3"/>
    <path d="M185 182 H645 L661 711 H194Z" fill="none" stroke="#6ed6ff" stroke-opacity=".24" stroke-width="2"/>
    <path d="M1415 182 H955 L939 711 H1406Z" fill="none" stroke="#bca8ff" stroke-opacity=".22" stroke-width="2"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M-80 290 C260 275 390 370 600 398 S724 426 785 445" stroke="url(#routeA)" stroke-width="28" opacity=".8"/>
    <path d="M-50 515 C235 510 406 476 585 492 S718 485 783 470" stroke="url(#routeA)" stroke-width="18" opacity=".72"/>
    <path d="M1680 315 C1350 298 1215 360 1005 405 S878 434 815 448" stroke="url(#routeB)" stroke-width="28" opacity=".78"/>
    <path d="M1650 565 C1370 550 1180 500 1010 510 S878 492 817 472" stroke="url(#routeB)" stroke-width="18" opacity=".68"/>
  </g>

  <g opacity=".75">
    <circle cx="323" cy="310" r="27" fill="#22cfff"/>
    <circle cx="423" cy="539" r="20" fill="#22cfff"/>
    <circle cx="1274" cy="330" r="27" fill="#9f82ff"/>
    <circle cx="1162" cy="552" r="20" fill="#9f82ff"/>
    <circle cx="323" cy="310" r="47" fill="none" stroke="#7be8ff" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="1274" cy="330" r="47" fill="none" stroke="#d2c3ff" stroke-opacity=".3" stroke-width="2"/>
  </g>

  <path d="M800 214 C866 263 925 277 981 287 V461 C981 591 907 688 800 741 C693 688 619 591 619 461 V287 C675 277 734 263 800 214Z" fill="#091c31" stroke="#ffbd4b" stroke-width="8" filter="url(#glow)"/>
  <path d="M800 258 C850 294 894 306 936 315 V455 C936 553 883 626 800 671 C717 626 664 553 664 455 V315 C706 306 750 294 800 258Z" fill="url(#shield)" opacity=".95"/>
  <path d="M800 315 V610" stroke="#fff3c6" stroke-opacity=".72" stroke-width="5"/>
  <path d="M735 450 H865" stroke="#fff3c6" stroke-opacity=".72" stroke-width="5" stroke-linecap="round"/>
  <circle cx="800" cy="450" r="72" fill="#102a45" stroke="#fff4cb" stroke-width="5"/>
  <path d="M765 450 L790 475 L840 420" fill="none" stroke="#ffd978" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#b8eaff" opacity=".5">
    <circle cx="90" cy="90" r="3"/><circle cx="1530" cy="120" r="4"/><circle cx="1450" cy="760" r="3"/>
    <circle cx="145" cy="805" r="4"/><circle cx="530" cy="96" r="3"/><circle cx="1080" cy="825" r="3"/>
  </g>
</svg>
