<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected network switch control plane</title>
  <desc id="desc">Abstract editorial illustration of layered switch fabric nodes behind a luminous shield, with isolated control paths and verified signals.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1460" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07172E"/>
      <stop offset="0.55" stop-color="#102A46"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(816 432) rotate(90) scale(420 610)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D7D0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#36D7D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="655" y1="242" x2="980" y2="683" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74F3DF" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#2ABBC8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1475A6" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="edge" x1="640" y1="210" x2="1010" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7FFF4"/>
      <stop offset="0.48" stop-color="#3FDDD3"/>
      <stop offset="1" stop-color="#3C8FD3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>
