<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contextual security guidance at a live decision point</title>
  <desc id="desc">An abstract browser pathway crosses an amber risk signal while a protective cyan arc guides it toward a secure violet chamber.</desc>
