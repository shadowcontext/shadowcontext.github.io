<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Link submissions stopped at a protected file boundary</title>
  <desc id="desc">Abstract blue link cards move through a layered frame toward a luminous amber file boundary, where a protective arc diverts them safely.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071528"/>
      <stop offset="0.52" stop-color="#102e4b"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#53d7ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#53d7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e0ff"/>
      <stop offset="1" stop-color="#3769c8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ef8b3b"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="760" cy="445" rx="650" ry="420" fill="url(#halo)"/>
  <circle cx="1270" cy="155" r="120" fill="#ffad4a" opacity="0.08" filter="url(#soft)"/>
  <circle cx="255" cy="740" r="170" fill="#36b8ff" opacity="0.1" filter="url(#soft)"/>

  <g opacity="0.25" fill="none" stroke="#79dfff" stroke-width="2">
    <path d="M92 214C350 38 548 76 730 178S1110 286 1515 101"/>
    <path d="M44 726C328 565 520 604 720 712S1170 819 1550 632"/>
    <path d="M318 82C420 290 374 536 198 815"/>
    <path d="M1378 54C1254 269 1285 579 1450 830"/>
  </g>

  <g transform="translate(266 178)">
    <rect x="0" y="0" width="1068" height="544" rx="66" fill="#091b30" fill-opacity="0.72" stroke="#58bde8" stroke-opacity="0.35" stroke-width="3"/>
    <rect x="34" y="34" width="1000" height="476" rx="47" fill="none" stroke="url(#frame)" stroke-opacity="0.42" stroke-width="3"/>
    <path d="M672 101H885c45 0 81 36 81 81v226H672z" fill="#102c46" stroke="#ffbf59" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M672 101h154l42 43h98" fill="none" stroke="url(#amber)" stroke-width="8" stroke-linecap="round"/>
    <path d="M672 101v307h294" fill="none" stroke="url(#amber)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

    <g transform="translate(108 126)">
      <g transform="rotate(-7 130 74)">
        <rect width="260" height="148" rx="30" fill="#174a70" stroke="#72ddff" stroke-width="3"/>
        <circle cx="79" cy="74" r="29" fill="none" stroke="#9ae8ff" stroke-width="12"/>
        <circle cx="181" cy="74" r="29" fill="none" stroke="#9ae8ff" stroke-width="12"/>
        <path d="M106 74h48" stroke="#9ae8ff" stroke-width="14" stroke-linecap="round"/>
      </g>
      <g transform="translate(130 184) rotate(6 130 74)" opacity="0.82">
        <rect width="260" height="148" rx="30" fill="#143b60" stroke="#55bce9" stroke-width="3"/>
        <circle cx="79" cy="74" r="29" fill="none" stroke="#78d4f5" stroke-width="12"/>
        <circle cx="181" cy="74" r="29" fill="none" stroke="#78d4f5" stroke-width="12"/>
        <path d="M106 74h48" stroke="#78d4f5" stroke-width="14" stroke-linecap="round"/>
      </g>
    </g>

    <path d="M482 278c89-97 171-104 266-35" fill="none" stroke="#73dcff" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 24"/>
    <path d="M565 409c98 42 185 13 223-64" fill="none" stroke="#3b7fba" stroke-width="7" stroke-linecap="round"/>

    <path d="M604 104c88 44 137 122 137 218 0 91-43 168-128 218" fill="none" stroke="url(#amber)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M619 146c57 43 87 101 87 176 0 70-28 128-83 169" fill="none" stroke="#ffe0a0" stroke-opacity="0.72" stroke-width="4" stroke-linecap="round"/>
    <circle cx="604" cy="104" r="13" fill="#ffe3a4"/>
    <circle cx="613" cy="540" r="13" fill="#f19a42"/>
  </g>

  <g fill="#9de8ff">
    <circle cx="172" cy="194" r="5" opacity="0.75"/>
    <circle cx="1454" cy="312" r="7" opacity="0.55"/>
    <circle cx="1401" cy="738" r="4" opacity="0.8"/>
    <circle cx="222" cy="650" r="7" opacity="0.45"/>
  </g>
</svg>
