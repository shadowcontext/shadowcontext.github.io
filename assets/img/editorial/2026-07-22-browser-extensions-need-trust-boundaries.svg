    <rect x="335" y="610" width="238" height="57" rx="22" fill="#193c5d"/>
    <rect x="369" y="634" width="140" height="9" rx="4.5" fill="#b7d1e3" fill-opacity="0.28"/>
  </g>

  <path d="M785 276C708 351 696 451 728 546c26 80 15 143-39 201" fill="none" stroke="#48cfde" stroke-opacity="0.18" stroke-width="54" filter="url(#softGlow)"/>
  <path d="M785 276C708 351 696 451 728 546c26 80 15 143-39 201" fill="none" stroke="url(#shield)" stroke-width="11" stroke-linecap="round"/>
  <path d="M807 295C742 368 735 450 762 532c25 76 18 139-24 194" fill="none" stroke="#d3fff4" stroke-opacity="0.52" stroke-width="2"/>

