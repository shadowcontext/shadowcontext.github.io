<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Browser extension separated from protected messaging content</title>
  <desc id="desc">An abstract editorial scene of layered browser surfaces, a floating extension module, and message shapes protected by a luminous curved trust boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08162d"/>
      <stop offset="0.52" stop-color="#10294a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4168" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0b213d" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42d6e8" stop-opacity="0.15"/>
      <stop offset="0.48" stop-color="#73f1d1" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#42d6e8" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5fe4dc" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5fe4dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020812" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#8db4d6" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1045" cy="470" rx="530" ry="420" fill="url(#glow)" filter="url(#softGlow)"/>

  <g opacity="0.32" fill="none" stroke="#6aa0ca">
    <path d="M90 180C330 70 525 90 690 185"/>
    <path d="M1160 90c174 44 292 144 350 306"/>
    <path d="M92 735c230 87 432 82 610-16"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="168" width="1000" height="592" rx="36" fill="#071527" stroke="#345d80" stroke-width="3"/>
    <rect x="243" y="202" width="934" height="525" rx="24" fill="url(#panel)"/>
    <circle cx="282" cy="238" r="8" fill="#ef8f82"/>
    <circle cx="310" cy="238" r="8" fill="#e7bf66"/>
    <circle cx="338" cy="238" r="8" fill="#70d5b7"/>
    <rect x="386" y="224" width="490" height="28" rx="14" fill="#8eb8d5" fill-opacity="0.14"/>
    <circle cx="1135" cy="238" r="13" fill="#85afd0" fill-opacity="0.3"/>
