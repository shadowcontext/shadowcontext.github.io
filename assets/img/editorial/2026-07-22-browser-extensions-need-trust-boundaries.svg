    <path d="M986 449v19" stroke="#102a48" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#e7b46c" stroke-linecap="round">
    <path d="M862 393c-52 0-74 5-101 29" stroke-width="4" stroke-dasharray="8 16" opacity="0.85"/>
    <path d="M864 454c-55 3-73 17-94 42" stroke-width="4" stroke-dasharray="8 16" opacity="0.6"/>
  </g>

  <g opacity="0.62">
    <rect x="1250" y="270" width="206" height="14" rx="7" fill="#47759a"/>
    <rect x="1250" y="306" width="130" height="10" rx="5" fill="#47759a"/>
    <rect x="1279" y="619" width="212" height="12" rx="6" fill="#47759a"/>
