    <path d="M354 406l-16 28 45-28" fill="#24527c"/>
    <rect x="357" y="350" width="202" height="10" rx="5" fill="#b7d1e3" fill-opacity="0.48"/>
    <rect x="357" y="374" width="138" height="9" rx="4.5" fill="#b7d1e3" fill-opacity="0.25"/>

    <rect x="408" y="472" width="300" height="82" rx="25" fill="#1b476e"/>
