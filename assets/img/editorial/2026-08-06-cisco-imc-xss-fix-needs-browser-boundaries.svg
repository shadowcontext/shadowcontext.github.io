<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Browser-level protection around a server management console</title>
  <desc id="desc">An abstract server management console sits behind layered blue and teal shields while amber web fragments are deflected outside the trusted boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.52" stop-color="#102d46"/>
      <stop offset="1" stop-color="#071b2b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.88"/>
      <stop offset="0.55" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f7ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7dd3fc" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="825" cy="430" rx="670" ry="440" fill="url(#halo)"/>
  <path d="M0 720C280 620 480 765 750 686s444-36 850 64v150H0Z" fill="#03111f" opacity="0.55"/>

  <g opacity="0.8">
    <circle cx="206" cy="190" r="6" fill="#f59e0b"/>
    <circle cx="282" cy="267" r="4" fill="#fbbf24"/>
    <circle cx="1380" cy="208" r="5" fill="#38bdf8"/>
    <path d="M210 190L328 310M282 267l72 72" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="8 14"/>
    <path d="M1380 208l-112 90" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="3" stroke-dasharray="7 15"/>
  </g>

  <g transform="translate(520 180)">
    <path d="M280 0C407 78 494 88 560 96v220c0 176-106 298-280 370C106 614 0 492 0 316V96C66 88 153 78 280 0Z" fill="#0b253b" stroke="url(#shield)" stroke-width="8"/>
    <path d="M280 43c104 61 179 77 232 85v186c0 142-82 244-232 312C130 558 48 456 48 314V128c53-8 128-24 232-85Z" fill="none" stroke="#67e8f9" stroke-opacity="0.24" stroke-width="3"/>
    <path d="M280 82c81 47 141 61 187 70v158c0 116-65 200-187 260-122-60-187-144-187-260V152c46-9 106-23 187-70Z" fill="#071827" opacity="0.82"/>

    <g transform="translate(132 190)">
      <rect x="0" y="0" width="296" height="226" rx="22" fill="url(#panel)" stroke="#7dd3fc" stroke-width="3"/>
      <path d="M0 50h296" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="3"/>
      <circle cx="30" cy="26" r="7" fill="#2dd4bf"/>
      <circle cx="55" cy="26" r="7" fill="#38bdf8" opacity="0.8"/>
      <circle cx="80" cy="26" r="7" fill="#f59e0b" opacity="0.7"/>
      <g transform="translate(42 82)">
        <rect width="212" height="38" rx="10" fill="#0c3148" stroke="#38bdf8" stroke-opacity="0.6"/>
        <circle cx="24" cy="19" r="7" fill="#2dd4bf"/>
        <path d="M45 19h132" stroke="#b9efff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
        <rect y="60" width="212" height="38" rx="10" fill="#0c3148" stroke="#38bdf8" stroke-opacity="0.38"/>
        <circle cx="24" cy="79" r="7" fill="#2dd4bf"/>
        <path d="M45 79h94" stroke="#b9efff" stroke-opacity="0.42" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M245 395C350 370 410 390 493 425" stroke="#f59e0b" stroke-width="8" stroke-dasharray="3 22" opacity="0.75"/>
    <path d="M1107 426c93-41 160-46 264-17" stroke="#fbbf24" stroke-width="8" stroke-dasharray="3 22" opacity="0.55"/>
    <path d="M454 408l31 18-32 15" stroke="#f59e0b" stroke-width="7"/>
    <path d="M1145 412l-30 19 33 14" stroke="#fbbf24" stroke-width="7"/>
  </g>

  <g opacity="0.75">
    <path d="M301 342l52-30 52 30v60l-52 30-52-30Z" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-width="3" transform="rotate(-12 353 372)"/>
    <path d="M1243 338l44-25 44 25v50l-44 25-44-25Z" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="3" transform="rotate(15 1287 363)"/>
    <circle cx="451" cy="446" r="19" fill="#2dd4bf" opacity="0.17" filter="url(#soft)"/>
    <circle cx="1148" cy="446" r="19" fill="#2dd4bf" opacity="0.17" filter="url(#soft)"/>
  </g>

  <path d="M800 196C907 262 974 269 1035 279" fill="none" stroke="#67e8f9" stroke-opacity="0.28" stroke-width="22" filter="url(#glow)"/>
  <ellipse cx="800" cy="781" rx="330" ry="34" fill="#38bdf8" opacity="0.11" filter="url(#soft)"/>
</svg>
