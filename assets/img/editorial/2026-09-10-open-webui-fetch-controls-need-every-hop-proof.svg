<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI retrieval path checked across redirect boundaries</title>
  <desc id="desc">Abstract editorial illustration of an AI retrieval core tracing an amber redirect path through layered teal gates before a protected internal network boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061b2a"/>
      <stop offset="0.55" stop-color="#0a3443"/>
      <stop offset="1" stop-color="#071824"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#45e0d0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#45e0d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8af3e7" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#1bb8b0" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#70d8d0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="790" cy="470" rx="680" ry="360" fill="url(#halo)" opacity="0.42"/>
  <circle cx="1350" cy="150" r="170" fill="#1ab9b0" opacity="0.08" filter="url(#soft)"/>
  <circle cx="230" cy="740" r="210" fill="#ffad45" opacity="0.06" filter="url(#soft)"/>

  <g opacity="0.5" fill="none" stroke="#77e8dd">
