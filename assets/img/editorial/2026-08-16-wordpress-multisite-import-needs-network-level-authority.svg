<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Network-level authority guarding a multisite import</title>
  <desc id="desc">An abstract editorial composition of layered website panels protected by a luminous gateway as an import stream approaches a shared network core.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.5" stop-color="#102A42"/>
      <stop offset="1" stop-color="#081B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 440) rotate(90) scale(390 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D2C3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#35D2C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="850" y1="220" x2="1120" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CF3D5"/>
      <stop offset="1" stop-color="#2A9FB8"/>
    </linearGradient>
    <linearGradient id="stream" x1="110" y1="450" x2="850" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B74FF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#718BFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7CF3D5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020817" flood-opacity="0.6"/>
    </filter>
    <clipPath id="portal"><rect x="908" y="270" width="180" height="360" rx="90"/></clipPath>
  </defs>
