  <path d="M1034 414 L1101 449 L1034 484" fill="none" stroke="#bffff2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <g opacity="0.96">
    <ellipse cx="1280" cy="326" rx="204" ry="80" fill="#1e6683" stroke="#8bf2de" stroke-width="5"/>
    <path d="M1076 326 V600 C1076 644 1167 680 1280 680 C1393 680 1484 644 1484 600 V326" fill="url(#database)" stroke="#69dfcf" stroke-width="5"/>
    <ellipse cx="1280" cy="326" rx="159" ry="49" fill="#0a2946" stroke="#b6fff0" stroke-width="4"/>
    <ellipse cx="1280" cy="465" rx="204" ry="80" fill="none" stroke="#54c9c1" stroke-width="4" stroke-opacity="0.54"/>
    <ellipse cx="1280" cy="600" rx="204" ry="80" fill="#0b2a47" stroke="#78e7d5" stroke-width="5"/>
    <ellipse cx="1280" cy="600" rx="148" ry="48" fill="none" stroke="#5bd3ca" stroke-width="3" stroke-dasharray="11 16" opacity="0.7"/>
    <circle cx="1280" cy="455" r="61" fill="#38cdb4" opacity="0.09" filter="url(#soft)"/>
    <path d="M1241 461 L1271 490 L1327 421" fill="none" stroke="#cffff4" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
