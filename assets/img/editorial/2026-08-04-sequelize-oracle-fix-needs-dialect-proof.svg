<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Query validation protecting a database boundary</title>
  <desc id="desc">Abstract editorial image of layered query ribbons passing through a luminous validation aperture before reaching a protected database form.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071322"/>
      <stop offset="0.52" stop-color="#13233c"/>
      <stop offset="1" stop-color="#071a2f"/>
    </linearGradient>
    <radialGradient id="halo" cx="73%" cy="48%" r="50%">
      <stop offset="0" stop-color="#4ce2c1" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#3976c6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#061321" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6d70"/>
      <stop offset="0.42" stop-color="#ffb55c"/>
      <stop offset="0.68" stop-color="#7de8cf"/>
      <stop offset="1" stop-color="#55d6e8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fff3"/>
      <stop offset="0.5" stop-color="#50ddbf"/>
      <stop offset="1" stop-color="#247bb1"/>
    </linearGradient>
    <linearGradient id="database" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#184e72"/>
      <stop offset="1" stop-color="#0a2748"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <path d="M0 709 C302 628 544 786 837 692 C1121 601 1374 654 1600 586 L1600 900 L0 900 Z" fill="#040c18" opacity="0.72"/>
  <path d="M0 191 C271 264 518 129 769 214 C1065 314 1312 168 1600 218" fill="none" stroke="#8debdc" stroke-width="2" stroke-opacity="0.08"/>

