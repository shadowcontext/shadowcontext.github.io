  <circle cx="748" cy="449" r="173" fill="#0a1e35" stroke="#4bdabb" stroke-width="4"/>
  <circle cx="748" cy="449" r="137" fill="#12334c" stroke="#b8fff0" stroke-width="3" stroke-opacity="0.56"/>
  <circle cx="748" cy="449" r="91" fill="none" stroke="#7fe9d1" stroke-width="18" stroke-opacity="0.18"/>
  <path d="M748 330 L803 361 L803 430 C803 491 776 535 748 552 C720 535 693 491 693 430 L693 361 Z" fill="url(#shield)" opacity="0.78" filter="url(#glow)"/>
