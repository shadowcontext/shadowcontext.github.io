      <rect x="153" y="440" width="152" height="7" rx="3.5"/>
      <rect x="153" y="455" width="99" height="7" rx="3.5"/>
      <rect x="216" y="588" width="116" height="7" rx="3.5"/>
      <rect x="216" y="603" width="80" height="7" rx="3.5"/>
    </g>
  </g>

  <path d="M337 301 C470 301 492 397 641 397" fill="none" stroke="#59cabd" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
  <path d="M354 449 C478 449 514 449 643 449" fill="none" stroke="#ff796e" stroke-width="17" stroke-linecap="round" filter="url(#glow)"/>
