    <rect x="68" y="412" width="286" height="74" rx="37" fill="#102b45" stroke="#7b5667" stroke-width="3"/>
    <rect x="131" y="560" width="242" height="74" rx="37" fill="#102b45" stroke="#526f87" stroke-width="3"/>
    <circle cx="158" cy="301" r="10" fill="#6edfd1"/>
    <circle cx="123" cy="449" r="10" fill="#ff7672"/>
    <circle cx="186" cy="597" r="10" fill="#6edfd1"/>
    <g fill="#708da4" opacity="0.8">
