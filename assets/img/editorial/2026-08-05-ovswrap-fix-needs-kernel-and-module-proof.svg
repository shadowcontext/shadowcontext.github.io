    <circle cx="132" cy="704" r="6"/><circle cx="322" cy="752" r="8"/><circle cx="480" cy="719" r="5"/>
    <circle cx="1378" cy="184" r="7"/><circle cx="1471" cy="696" r="8"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M-45 312 C212 278 357 320 493 400 C594 460 618 533 724 527" stroke="url(#pathA)" stroke-width="20"/>
    <path d="M-23 546 C234 584 360 568 503 493 C588 448 632 376 727 380" stroke="url(#pathA)" stroke-width="12" opacity="0.8"/>
    <path d="M1640 282 C1397 273 1244 327 1125 409 C1051 460 1014 515 941 518" stroke="url(#pathA)" stroke-width="16"/>
    <path d="M1645 608 C1411 620 1244 575 1122 499 C1047 452 1016 388 937 380" stroke="url(#pathA)" stroke-width="10" opacity="0.72"/>
  </g>
  <g opacity="0.7" fill="none" stroke="#59a9c3" stroke-width="4">
