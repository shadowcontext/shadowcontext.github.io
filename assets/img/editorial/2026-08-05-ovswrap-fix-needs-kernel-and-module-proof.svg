<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kernel network paths contained by a verified shield</title>
  <desc id="desc">An abstract editorial illustration of layered network paths curling toward a luminous protected kernel core, with a shield boundary stopping an oversized loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102b45"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#70f3d1" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#38a7c8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#06101e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b7fff0"/>
      <stop offset="0.45" stop-color="#49dfc1"/>
      <stop offset="1" stop-color="#1c7fa5"/>
    </linearGradient>
    <linearGradient id="pathA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52769c" stop-opacity="0.2"/>
      <stop offset="0.68" stop-color="#6acde0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d3fff7"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbf69"/>
      <stop offset="1" stop-color="#f06a6a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="835" cy="445" rx="650" ry="390" fill="url(#halo)"/>
  <g opacity="0.16" fill="none" stroke="#8eb5cf" stroke-width="2">
    <path d="M80 174 C340 88 524 152 666 280 S982 414 1518 194"/>
    <path d="M35 686 C282 788 513 739 675 614 S1050 464 1578 690"/>
    <path d="M205 56 C315 287 282 505 138 832"/>
