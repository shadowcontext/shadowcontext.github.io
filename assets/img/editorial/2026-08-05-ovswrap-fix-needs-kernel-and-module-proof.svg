  <path d="M802 267 C883 309 954 319 1014 327 L1014 447 C1014 560 946 632 802 692 C658 632 590 560 590 447 L590 327 C650 319 721 309 802 267Z" fill="#0c2940" stroke="#5de2c8" stroke-opacity="0.5" stroke-width="3"/>
  <g transform="translate(802 464)">
