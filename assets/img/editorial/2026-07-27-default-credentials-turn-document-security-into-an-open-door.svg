<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Document vault replacing repeated credentials</title>
  <desc id="desc">An abstract document vault sits beneath scanning arcs. A stream of identical red keys reaches a luminous lock that transforms them into distinct protected credential shapes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset=".5" stop-color="#102b43"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="focus" cx="58%" cy="49%" r="48%">
      <stop offset="0" stop-color="#41d7c6" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#2687b9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82e7df" stop-opacity=".52"/>
      <stop offset=".48" stop-color="#246b8d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0b2741" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#174861"/>
      <stop offset="1" stop-color="#081c32"/>
    </linearGradient>
    <linearGradient id="safeKey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52e0cb"/>
      <stop offset="1" stop-color="#79aaff"/>
    </linearGradient>
    <linearGradient id="riskKey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8b70"/>
      <stop offset="1" stop-color="#ff506b"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#91dce4" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020710" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="900" cy="448" rx="690" ry="420" fill="url(#focus)"/>
  <path d="M0 725C270 632 470 688 694 754C933 824 1213 808 1600 650V900H0Z" fill="#050d19" opacity=".68"/>

  <g fill="none" stroke="#68bed0" stroke-linecap="round">
    <path d="M117 279C271 119 493 62 702 97" stroke-width="3" stroke-opacity=".18"/>
    <path d="M160 325C300 190 484 143 655 165" stroke-width="2" stroke-opacity=".25"/>
    <path d="M206 367C318 271 453 237 589 250" stroke-width="2" stroke-opacity=".32"/>
    <circle cx="117" cy="279" r="7" fill="#57d4d0" fill-opacity=".55" stroke="none"/>
    <circle cx="160" cy="325" r="5" fill="#57d4d0" fill-opacity=".46" stroke="none"/>
    <circle cx="206" cy="367" r="4" fill="#57d4d0" fill-opacity=".4" stroke="none"/>
  </g>

  <g transform="translate(206 280)" opacity=".95">
    <g transform="translate(0 0)">
      <circle cx="42" cy="42" r="28" fill="none" stroke="url(#riskKey)" stroke-width="13"/>
      <path d="M70 42H196L218 64L242 40L269 67" fill="none" stroke="url(#riskKey)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(34 118)">
      <circle cx="42" cy="42" r="28" fill="none" stroke="url(#riskKey)" stroke-width="13"/>
      <path d="M70 42H196L218 64L242 40L269 67" fill="none" stroke="url(#riskKey)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0 236)">
      <circle cx="42" cy="42" r="28" fill="none" stroke="url(#riskKey)" stroke-width="13"/>
      <path d="M70 42H196L218 64L242 40L269 67" fill="none" stroke="url(#riskKey)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(545 142)" filter="url(#shadow)">
    <path d="M88 82L512 0L768 124L706 620L210 684L0 510Z" fill="url(#vault)" stroke="#8ee7df" stroke-opacity=".38" stroke-width="4"/>
    <path d="M88 82L298 206L768 124M298 206L210 684M298 206L706 620" fill="none" stroke="#a3eee6" stroke-opacity=".18" stroke-width="3"/>

    <g transform="translate(92 140)">
      <path d="M0 0H180L232 52V292H0Z" fill="#b9f3eb" fill-opacity=".68" stroke="#d6fff8" stroke-opacity=".52" stroke-width="3"/>
      <path d="M180 0V52H232" fill="#5ca6ba" fill-opacity=".44" stroke="#d6fff8" stroke-opacity=".42" stroke-width="3"/>
      <g fill="#143b53" opacity=".56">
        <rect x="38" y="88" width="144" height="11" rx="5.5"/>
        <rect x="38" y="126" width="162" height="9" rx="4.5"/>
        <rect x="38" y="160" width="129" height="9" rx="4.5"/>
        <rect x="38" y="194" width="151" height="9" rx="4.5"/>
        <rect x="38" y="228" width="112" height="9" rx="4.5"/>
      </g>
    </g>

    <g transform="translate(278 112)">
      <rect width="382" height="478" rx="52" fill="url(#door)" stroke="#75d9d3" stroke-width="7"/>
      <rect x="35" y="35" width="312" height="408" rx="36" fill="none" stroke="#8eeae0" stroke-opacity=".22" stroke-width="3"/>
      <circle cx="191" cy="239" r="112" fill="#071526" stroke="#4db7c1" stroke-width="11"/>
      <circle cx="191" cy="239" r="72" fill="#0e344b" stroke="#7be5dc" stroke-opacity=".7" stroke-width="5"/>
      <path d="M191 167V311M119 239H263M140 188L242 290M242 188L140 290" stroke="#54cfc7" stroke-opacity=".58" stroke-width="8" stroke-linecap="round"/>
      <circle cx="191" cy="239" r="26" fill="#88f3e6" filter="url(#glow)"/>
      <rect x="301" y="197" width="28" height="84" rx="14" fill="#7de3da" opacity=".72"/>
    </g>
  </g>

  <g transform="translate(1280 248)" fill="none" stroke="url(#safeKey)" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(8 70 70)">
      <path d="M20 72L70 22L120 72L70 122Z" stroke-width="13"/>
      <path d="M120 72H220L240 52L262 74" stroke-width="15"/>
    </g>
    <g transform="translate(-20 170) rotate(-5 70 70)" opacity=".75">
      <path d="M18 74C18 42 42 18 74 18S130 42 130 74S106 130 74 130S18 106 18 74Z" stroke-width="13"/>
      <path d="M130 74H224L242 98L267 70" stroke-width="15"/>
    </g>
    <g transform="translate(18 342) rotate(6 70 70)" opacity=".55">
      <path d="M74 16L132 116H16Z" stroke-width="13"/>
      <path d="M132 75H220L244 51L268 78" stroke-width="15"/>
    </g>
  </g>

  <path d="M793 765C989 820 1222 790 1474 681" fill="none" stroke="#53d6c8" stroke-opacity=".2" stroke-width="3"/>
  <g fill="#9cf5e8">
    <circle cx="1205" cy="192" r="5" opacity=".55"/>
    <circle cx="1407" cy="163" r="3" opacity=".42"/>
    <circle cx="1492" cy="504" r="5" opacity=".48"/>
    <circle cx="1113" cy="726" r="4" opacity=".38"/>
  </g>
</svg>
