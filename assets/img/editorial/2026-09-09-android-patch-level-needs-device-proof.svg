<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mobile devices crossing layered security boundaries</title>
  <desc id="desc">Abstract mobile devices move through blue and amber concentric protection layers toward a luminous secured patch core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2940"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8fbff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#4cd6e8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#16708f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ee8ee"/>
      <stop offset="0.45" stop-color="#3b95ae"/>
      <stop offset="1" stop-color="#153f5c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb23f" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffc762" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb23f" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#020b14" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 712 C250 628 432 784 690 700 S1130 568 1600 670 L1600 900 L0 900 Z" fill="#06111e" opacity="0.74"/>
  <circle cx="1125" cy="430" r="360" fill="url(#core)"/>
  <g fill="none" transform="rotate(-8 1125 430)">
    <ellipse cx="1125" cy="430" rx="420" ry="300" stroke="#3ac7db" stroke-width="4" opacity="0.2"/>
    <ellipse cx="1125" cy="430" rx="332" ry="238" stroke="#57dceb" stroke-width="7" opacity="0.36"/>
    <ellipse cx="1125" cy="430" rx="238" ry="170" stroke="url(#amber)" stroke-width="12"/>
    <ellipse cx="1125" cy="430" rx="150" ry="108" stroke="#b9f7f4" stroke-width="5" opacity="0.76"/>
  </g>
  <g opacity="0.35" stroke="#4dc9dd" stroke-width="2">
    <path d="M70 174 H520 L640 294"/>
    <path d="M20 255 H414 L552 393"/>
    <path d="M93 783 H475 L608 650"/>
    <circle cx="520" cy="174" r="7" fill="#4dc9dd"/>
    <circle cx="414" cy="255" r="7" fill="#4dc9dd"/>
    <circle cx="475" cy="783" r="7" fill="#4dc9dd"/>
  </g>
  <g filter="url(#shadow)" transform="translate(0 8)">
    <g transform="translate(235 240) rotate(-10 165 260)">
      <rect x="0" y="0" width="330" height="520" rx="48" fill="#0a1727" stroke="#2f718a" stroke-width="5"/>
      <rect x="20" y="58" width="290" height="396" rx="22" fill="#112d43"/>
      <path d="M64 372 C116 282 195 247 280 176" fill="none" stroke="#45bfd2" stroke-width="13" opacity="0.65"/>
      <circle cx="166" cy="485" r="12" fill="#6ccbd8" opacity="0.72"/>
      <rect x="121" y="24" width="88" height="9" rx="4.5" fill="#38667a"/>
    </g>
    <g transform="translate(560 185) rotate(5 180 280)">
      <rect x="0" y="0" width="360" height="560" rx="52" fill="#091827" stroke="url(#device)" stroke-width="7"/>
      <rect x="23" y="62" width="314" height="426" rx="25" fill="url(#device)" opacity="0.46"/>
      <path d="M70 386 C146 292 206 250 305 151" fill="none" stroke="#c4fbfa" stroke-width="18" opacity="0.62"/>
      <path d="M73 427 C160 340 220 317 306 238" fill="none" stroke="#ffc45d" stroke-width="8" opacity="0.85"/>
      <circle cx="180" cy="525" r="13" fill="#b7f5f3" opacity="0.88"/>
      <rect x="132" y="26" width="96" height="10" rx="5" fill="#6cb4c4"/>
    </g>
    <g transform="translate(963 225) rotate(11 145 235)">
      <rect x="0" y="0" width="290" height="470" rx="43" fill="#0a1726" stroke="#87e4e9" stroke-width="6"/>
      <rect x="19" y="54" width="252" height="350" rx="20" fill="#1d5d74" opacity="0.56"/>
      <circle cx="145" cy="231" r="84" fill="none" stroke="#d2fbf8" stroke-width="12" opacity="0.8"/>
      <path d="M104 231 L133 260 L190 198" fill="none" stroke="#ffc969" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <circle cx="145" cy="439" r="11" fill="#c3f7f3"/>
      <rect x="105" y="23" width="80" height="9" rx="4.5" fill="#7bcbd4"/>
    </g>
  </g>
  <g fill="#a9f1f2" opacity="0.7">
    <circle cx="1330" cy="175" r="5"/><circle cx="1420" cy="265" r="8"/><circle cx="1286" cy="680" r="6"/>
    <circle cx="1480" cy="528" r="4"/><circle cx="1090" cy="96" r="4"/><circle cx="855" cy="114" r="6"/>
  </g>
</svg>
