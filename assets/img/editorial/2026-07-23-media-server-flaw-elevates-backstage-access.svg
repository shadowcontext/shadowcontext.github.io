<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected privilege boundary around a professional media server</title>
  <desc id="desc">An abstract rack-mounted media server projects layered video frames while a luminous barrier blocks an ascending path toward its protected core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#172440"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <radialGradient id="halo" cx="61%" cy="45%" r="54%">
      <stop offset="0" stop-color="#6659ef" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#2c68a8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8c4d4"/>
      <stop offset="0.42" stop-color="#5c6f88"/>
      <stop offset="1" stop-color="#273449"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28d8cc"/>
      <stop offset="0.48" stop-color="#4278ed"/>
      <stop offset="1" stop-color="#ac57d9"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83fff0" stop-opacity="0.2"/>
      <stop offset="0.48" stop-color="#63f5e2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#438cf1" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#00050c" flood-opacity="0.72"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#a6c6ef" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g opacity="0.78" filter="url(#shadow)">
    <path d="M115 210L455 150L455 390L115 428Z" fill="#111d31" stroke="#3f73a8" stroke-width="4"/>
    <path d="M148 240L421 194L421 356L148 386Z" fill="url(#screen)" opacity="0.72"/>
    <circle cx="242" cy="300" r="58" fill="#f2b25e" opacity="0.58"/>
    <path d="M150 360L253 283L332 332L420 247V357Z" fill="#10294d" opacity="0.82"/>

    <path d="M182 484L483 449L483 661L182 675Z" fill="#111d31" stroke="#694eaa" stroke-width="4"/>
    <path d="M214 510L451 484L451 629L214 640Z" fill="url(#screen)" opacity="0.58"/>
    <path d="M214 614L290 546L349 582L451 505V629Z" fill="#282054" opacity="0.78"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="205" width="715" height="485" rx="38" fill="#1a2739" stroke="#6e819b" stroke-width="5"/>
    <rect x="735" y="246" width="625" height="397" rx="24" fill="url(#metal)"/>
    <rect x="790" y="291" width="401" height="178" rx="19" fill="#101c30" stroke="#90a3bb" stroke-width="3"/>
    <rect x="823" y="324" width="335" height="112" rx="10" fill="url(#screen)" opacity="0.9"/>
    <path d="M823 414L911 345L989 397L1060 348L1158 408V436H823Z" fill="#162b58" opacity="0.8"/>
    <circle cx="1287" cy="331" r="16" fill="#61f4df" filter="url(#glow)"/>
    <circle cx="1287" cy="331" r="5" fill="#eafffb"/>
    <g fill="#1b2a3c" stroke="#b7c4d2" stroke-width="3">
      <rect x="790" y="514" width="112" height="78" rx="10"/>
      <rect x="924" y="514" width="112" height="78" rx="10"/>
      <rect x="1058" y="514" width="112" height="78" rx="10"/>
      <rect x="1192" y="514" width="112" height="78" rx="10"/>
    </g>
    <g fill="#56e7d6">
      <circle cx="818" cy="551" r="8"/><circle cx="952" cy="551" r="8"/>
      <circle cx="1086" cy="551" r="8"/><circle cx="1220" cy="551" r="8"/>
    </g>
    <g stroke="#8194aa" stroke-width="7" stroke-linecap="round">
      <path d="M842 551h35"/><path d="M976 551h35"/><path d="M1110 551h35"/><path d="M1244 551h35"/>
    </g>
    <path d="M712 690h669l-42 46H752Z" fill="#29384d"/>
    <path d="M760 736h570" stroke="#71849b" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g filter="url(#glow)">
    <path d="M592 116L650 160V746L592 790L550 750V156Z" fill="url(#shield)" stroke="#77f9e7" stroke-width="3"/>
    <path d="M520 194V712" stroke="#4e9ce9" stroke-opacity="0.52" stroke-width="7"/>
    <path d="M679 194V712" stroke="#58e8da" stroke-opacity="0.45" stroke-width="7"/>
  </g>

  <g fill="none" stroke="#ef9d58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M207 786H319V720H408V650H493V579H548" stroke-width="13" opacity="0.8"/>
    <path d="M208 786H319V720H408V650H493V579" stroke-width="4"/>
  </g>
  <g fill="#ffc171" filter="url(#glow)">
    <circle cx="207" cy="786" r="11"/><circle cx="319" cy="720" r="9"/>
    <circle cx="408" cy="650" r="9"/><circle cx="493" cy="579" r="9"/>
  </g>

  <path d="M650 449H754" stroke="#88fff0" stroke-width="4" stroke-dasharray="7 15" opacity="0.52"/>
  <circle cx="704" cy="449" r="36" fill="#0e2436" stroke="#6df3df" stroke-width="4"/>
  <path d="M688 450L700 462L721 437" fill="none" stroke="#b5fff5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
