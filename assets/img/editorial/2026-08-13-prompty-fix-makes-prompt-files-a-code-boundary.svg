<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prompt file contained at a secure rendering boundary</title>
  <desc id="desc">An abstract prompt document enters a luminous rendering chamber while unsafe branching paths stop outside a cyan security boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071322"/>
      <stop offset="0.52" stop-color="#102842"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="aura" cx="61%" cy="48%" r="48%">
      <stop offset="0" stop-color="#46f0d0" stop-opacity="0.26"/>
      <stop offset="0.46" stop-color="#24a7cc" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071322" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f6ff"/>
      <stop offset="0.55" stop-color="#77cfe4"/>
      <stop offset="1" stop-color="#2b729d"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b7fa7"/>
      <stop offset="0.48" stop-color="#66f2da"/>
      <stop offset="1" stop-color="#2a92bd"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbf54"/>
      <stop offset="1" stop-color="#ef6a3d"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <pattern id="grain" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="12" r="1" fill="#b9e8ef" opacity="0.06"/>
      <circle cx="42" cy="38" r="1.2" fill="#b9e8ef" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="1005" cy="445" rx="410" ry="330" fill="#42ddcf" opacity="0.07" filter="url(#soft)"/>

  <g fill="none" stroke="#4da7c8" stroke-opacity="0.13" stroke-width="2">
    <path d="M86 167 C392 165 482 282 690 346"/>
    <path d="M52 742 C350 716 477 610 690 554"/>
    <path d="M965 88 C1082 214 1284 236 1530 224"/>
    <path d="M1000 812 C1146 674 1344 668 1555 703"/>
    <ellipse cx="1000" cy="450" rx="425" ry="326"/>
  </g>

  <g transform="translate(235 226) rotate(-7 230 220)">
    <path d="M25 0 H357 L455 98 V520 H25Z" fill="#0c2136" stroke="url(#paper)" stroke-width="7"/>
    <path d="M357 0 V98 H455" fill="#1e5d7c" stroke="#9ae9ed" stroke-width="5"/>
    <rect x="82" y="147" width="261" height="16" rx="8" fill="#8ee4ea" opacity="0.78"/>
    <rect x="82" y="196" width="302" height="12" rx="6" fill="#61a9c6" opacity="0.55"/>
    <rect x="82" y="236" width="236" height="12" rx="6" fill="#61a9c6" opacity="0.44"/>
    <rect x="82" y="300" width="272" height="14" rx="7" fill="#87d6df" opacity="0.6"/>
    <rect x="82" y="344" width="198" height="12" rx="6" fill="#61a9c6" opacity="0.44"/>
    <circle cx="364" cy="395" r="38" fill="#102c44" stroke="url(#warning)" stroke-width="6"/>
    <path d="M364 371 V399 M364 418 V420" stroke="#ffd27a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M666 450 C755 450 794 450 850 450" fill="none" stroke="#9df9e4" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M810 418 L850 450 L810 482" fill="none" stroke="#d8fff5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#glow)">
    <rect x="852" y="168" width="104" height="564" rx="52" fill="#0a2c40" stroke="url(#gate)" stroke-width="10"/>
    <rect x="877" y="212" width="54" height="476" rx="27" fill="#54e7d3" opacity="0.16"/>
  </g>

  <g transform="translate(1125 450)">
    <circle r="212" fill="#091b2d" stroke="#2d97b5" stroke-width="5"/>
    <circle r="164" fill="#0c3047" stroke="#62eadb" stroke-width="3" stroke-dasharray="8 15" opacity="0.9"/>
    <circle r="112" fill="#0a1d30" stroke="#8af4df" stroke-width="5"/>
    <path d="M-48 -55 H50 L82 -23 V67 H-48Z" fill="url(#paper)" opacity="0.92"/>
    <path d="M50 -55 V-23 H82" fill="none" stroke="#164d6c" stroke-width="5"/>
    <path d="M-18 -14 H48 M-18 14 H59 M-18 42 H35" stroke="#164b67" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="url(#warning)" stroke-width="8" stroke-linecap="round">
    <path d="M695 344 C756 309 796 296 835 299"/>
    <path d="M695 556 C756 591 796 604 835 601"/>
  </g>
  <g fill="#ffc565" filter="url(#glow)">
    <circle cx="835" cy="299" r="13"/>
    <circle cx="835" cy="601" r="13"/>
  </g>
  <g stroke="#fff0bd" stroke-width="7" stroke-linecap="round">
    <path d="M814 278 L852 320 M852 278 L814 320"/>
    <path d="M814 580 L852 622 M852 580 L814 622"/>
  </g>

  <g fill="#bffdf2" opacity="0.5">
    <circle cx="1010" cy="235" r="5"/><circle cx="1290" cy="305" r="4"/>
    <circle cx="1014" cy="668" r="4"/><circle cx="1324" cy="590" r="5"/>
  </g>
</svg>
