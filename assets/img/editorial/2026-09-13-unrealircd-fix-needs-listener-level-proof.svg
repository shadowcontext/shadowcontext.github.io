<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded gateway protecting an IRC server from request overload</title>
  <desc id="desc">Abstract editorial artwork showing a teal server core behind an amber bounded gateway as a dense violet wave of request fragments is diverted around it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#10233c"/>
      <stop offset="1" stop-color="#180f2c"/>
    </linearGradient>
    <radialGradient id="halo" cx="48%" cy="50%" r="54%">
      <stop offset="0" stop-color="#34d6ca" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#5865d8" stop-opacity=".1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7af1dc"/>
      <stop offset="1" stop-color="#168ba6"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e77736"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b55cff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c58aff" stop-opacity=".86"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="leftField">
      <path d="M0 0h1010v900H0z"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <g opacity=".24" fill="none" stroke="#9bded9">
    <path d="M118 178C386 72 724 94 950 242"/>
    <path d="M80 727c285 115 615 81 842-67"/>
