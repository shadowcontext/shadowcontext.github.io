<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Restricted path through a layered security management gateway</title>
  <desc id="desc">An abstract dark network landscape with three guarded control nodes and one narrow illuminated route passing through layered protective arches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071322"/>
      <stop offset="0.52" stop-color="#102b3e"/>
      <stop offset="1" stop-color="#09101d"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="1" x2="0.78" y2="0">
