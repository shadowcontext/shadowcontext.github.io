<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Terminal command stopped at a protected execution boundary</title>
  <desc id="desc">An abstract amber command ribbon approaches a dark workstation but is halted by a luminous cyan shield-like boundary, with calm telemetry arcs surrounding the protected device.</desc>
  <defs>
    <linearGradient id="bg" x1="180" y1="60" x2="1420" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b2030"/>
      <stop offset="1" stop-color="#08131d"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1030 430) rotate(90) scale(390 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27e1dc" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#27e1dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="924" y1="273" x2="1274" y2="672" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173a4a"/>
      <stop offset="1" stop-color="#0a1a29"/>
    </linearGradient>
    <linearGradient id="barrier" x1="791" y1="169" x2="894" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ffff4" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#32e3dc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#42b7ff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="170" y1="366" x2="805" y2="489" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb44b" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#ffb44b" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="938" y="283" width="328" height="350" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#cyanGlow)"/>

