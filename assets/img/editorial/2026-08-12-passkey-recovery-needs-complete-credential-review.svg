<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Passkey recovery and credential review</title>
  <desc id="desc">Abstract passkey credentials orbit a protected account vault while one amber credential is revealed beyond the trusted recovery path.</desc>
  <defs>
    <linearGradient id="bg" x1="130" y1="80" x2="1470" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102F4A"/>
      <stop offset="1" stop-color="#0B182D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(800 442) rotate(90) scale(390 590)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#48D6C7" stop-opacity="0.24"/>
      <stop offset="0.62" stop-color="#2471A3" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vault" x1="596" y1="276" x2="1002" y2="672" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDEFE7"/>
      <stop offset="0.45" stop-color="#54D7C9"/>
      <stop offset="1" stop-color="#1B8196"/>
    </linearGradient>
    <linearGradient id="vaultFace" x1="638" y1="320" x2="956" y2="628" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173E58"/>
      <stop offset="1" stop-color="#0A2038"/>
    </linearGradient>
    <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D8FFF5"/>
      <stop offset="1" stop-color="#4FCDBD"/>
    </linearGradient>
    <linearGradient id="amber" x1="1152" y1="246" x2="1362" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD68A"/>
      <stop offset="0.5" stop-color="#F4A53D"/>
      <stop offset="1" stop-color="#D56B2F"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#020913" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="1.2" fill="#BDEFE7" opacity="0.08"/>
      <circle cx="66" cy="30" r="0.8" fill="#BDEFE7" opacity="0.06"/>
      <circle cx="38" cy="74" r="1" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <path d="M203 463C322 204 586 103 851 157C1111 210 1300 429 1384 669" fill="none" stroke="#4FD7C5" stroke-opacity="0.17" stroke-width="2"/>
  <path d="M254 643C439 777 719 815 963 741C1192 671 1343 478 1364 278" fill="none" stroke="#9DEBE1" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M330 236C487 398 523 646 449 790" fill="none" stroke="#5B8FB0" stroke-opacity="0.18" stroke-width="18" stroke-linecap="round"/>

  <g opacity="0.75">
    <circle cx="250" cy="493" r="8" fill="#76E3D4"/>
    <circle cx="370" cy="268" r="6" fill="#76E3D4"/>
    <circle cx="1263" cy="659" r="7" fill="#76E3D4"/>
    <circle cx="1380" cy="506" r="4" fill="#76E3D4"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M800 205L1045 323V492C1045 655 951 749 800 806C649 749 555 655 555 492V323L800 205Z" fill="url(#vault)"/>
    <path d="M800 251L1000 347V490C1000 620 927 697 800 751C673 697 600 620 600 490V347L800 251Z" fill="url(#vaultFace)"/>
    <path d="M800 292L963 371V489C963 592 908 657 800 706C692 657 637 592 637 489V371L800 292Z" fill="#0D2941" stroke="#8DE7DB" stroke-opacity="0.38" stroke-width="3"/>
  </g>

  <g transform="translate(800 492)" filter="url(#glow)">
    <circle r="92" fill="#0A1D32" stroke="#6FE0D1" stroke-width="7"/>
    <circle r="63" fill="none" stroke="#C8FFF5" stroke-opacity="0.34" stroke-width="2"/>
    <path d="M0-43C22-43 40-25 40-3C40 13 31 27 17 34V66H-17V34C-31 27-40 13-40-3C-40-25-22-43 0-43Z" fill="url(#trusted)"/>
    <circle cy="-4" r="12" fill="#0D2941"/>
    <path d="M0 8V45" stroke="#0D2941" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#B4F3EA" stroke-opacity="0.44" stroke-width="4" stroke-linecap="round">
    <path d="M517 264C621 170 779 139 923 177"/>
    <path d="M1061 622C955 743 755 789 590 711"/>
    <path d="M1094 292C1170 349 1207 424 1210 510" stroke-dasharray="10 18"/>
  </g>

  <g transform="translate(410 275) rotate(-18)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="58" fill="#0C263C" stroke="#8DE7DB" stroke-width="7"/>
    <circle r="22" fill="none" stroke="url(#trusted)" stroke-width="11"/>
    <path d="M48 8H173L203 38L180 61L153 37L131 59L104 32H48Z" fill="url(#trusted)"/>
  </g>

  <g transform="translate(383 659) rotate(16)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="52" fill="#0C263C" stroke="#6FDCCC" stroke-width="6"/>
    <circle r="19" fill="none" stroke="url(#trusted)" stroke-width="10"/>
    <path d="M43 7H148L176 35L155 56L132 35L111 55L88 31H43Z" fill="url(#trusted)"/>
  </g>

  <g transform="translate(1190 640) rotate(153)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="50" fill="#0C263C" stroke="#6FDCCC" stroke-width="6"/>
    <circle r="18" fill="none" stroke="url(#trusted)" stroke-width="10"/>
    <path d="M41 7H145L174 36L152 57L128 35L108 54L86 31H41Z" fill="url(#trusted)"/>
  </g>

  <g transform="translate(1239 275) rotate(24)" filter="url(#shadow)">
    <circle r="67" fill="#2C2530" stroke="url(#amber)" stroke-width="8"/>
    <circle r="25" fill="none" stroke="url(#amber)" stroke-width="13"/>
    <path d="M56 9H191L225 43L199 69L171 43L147 66L119 39H56Z" fill="url(#amber)"/>
    <path d="M-35-55L-56-82M39-52L59-79M59 17L91 22" stroke="#FFD68A" stroke-width="5" stroke-linecap="round" opacity="0.82"/>
  </g>

  <path d="M1100 338C1137 316 1172 302 1204 294" fill="none" stroke="#F6B253" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 15" opacity="0.72"/>
  <circle cx="1087" cy="346" r="9" fill="#F6B253" opacity="0.78"/>

  <g transform="translate(1260 720)" opacity="0.5">
    <path d="M0 0H154" stroke="#92E8DD" stroke-width="4" stroke-linecap="round"/>
    <circle cx="16" cy="0" r="14" fill="#0E2940" stroke="#92E8DD" stroke-width="4"/>
    <circle cx="77" cy="0" r="14" fill="#0E2940" stroke="#92E8DD" stroke-width="4"/>
    <circle cx="138" cy="0" r="14" fill="#0E2940" stroke="#92E8DD" stroke-width="4"/>
    <path d="M9 0L14 5L23-7M70 0L75 5L84-7" fill="none" stroke="#BFF8F0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
