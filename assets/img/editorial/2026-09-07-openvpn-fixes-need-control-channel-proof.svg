<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected VPN control channel under timing pressure</title>
  <desc id="desc">An abstract encrypted tunnel carries ordered blue packets through a shielded control channel while amber timing waves bend away from its reinforced boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2940"/>
      <stop offset="1" stop-color="#071a2d"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c80aa" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#62e1e9" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#1c80aa" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a7fbff"/>
      <stop offset="0.45" stop-color="#3acbd8"/>
      <stop offset="1" stop-color="#167aa4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4ce6ef" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4ce6ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shieldClip">
      <path d="M800 170 C904 223 1005 236 1096 239 V430 C1096 582 1000 694 800 760 C600 694 504 582 504 430 V239 C595 236 696 223 800 170Z"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>
  <g opacity="0.22" fill="none" stroke="#56bfd2" stroke-width="2">
    <path d="M70 190 C320 98 502 126 690 244"/>
    <path d="M1530 710 C1280 802 1098 774 910 656"/>
    <path d="M-40 670 C200 542 350 566 506 634"/>
  </g>
  <g opacity="0.7" fill="none" stroke="#f2a340" stroke-linecap="round">
    <path d="M50 328 C212 328 279 268 418 268 S564 335 642 335" stroke-width="9"/>
    <path d="M50 398 C238 398 289 352 426 352 S548 397 629 397" stroke-width="5" opacity="0.68"/>
    <path d="M1550 555 C1388 555 1321 615 1182 615 S1036 548 958 548" stroke-width="9"/>
    <path d="M1550 485 C1362 485 1311 531 1174 531 S1052 486 971 486" stroke-width="5" opacity="0.68"/>
  </g>
  <g filter="url(#soft)" opacity="0.36">
    <ellipse cx="450" cy="330" rx="190" ry="100" fill="#e78f31"/>
    <ellipse cx="1150" cy="570" rx="190" ry="100" fill="#e78f31"/>
  </g>
  <path d="M170 450 H1430" stroke="#47dce6" stroke-width="136" stroke-opacity="0.08"/>
  <path d="M170 450 H1430" stroke="url(#tunnel)" stroke-width="74" stroke-linecap="round"/>
  <path d="M170 413 H1430 M170 487 H1430" stroke="#73ebef" stroke-opacity="0.32" stroke-width="3"/>
  <g fill="#62e4eb" filter="url(#smallGlow)">
    <rect x="235" y="432" width="60" height="36" rx="10"/>
    <rect x="345" y="432" width="60" height="36" rx="10" opacity="0.88"/>
    <rect x="455" y="432" width="60" height="36" rx="10" opacity="0.76"/>
    <rect x="1085" y="432" width="60" height="36" rx="10" opacity="0.76"/>
    <rect x="1195" y="432" width="60" height="36" rx="10" opacity="0.88"/>
    <rect x="1305" y="432" width="60" height="36" rx="10"/>
  </g>
  <path d="M800 170 C904 223 1005 236 1096 239 V430 C1096 582 1000 694 800 760 C600 694 504 582 504 430 V239 C595 236 696 223 800 170Z" fill="#0a2238" stroke="url(#shield)" stroke-width="13"/>
  <g clip-path="url(#shieldClip)">
    <path d="M460 450 H1140" stroke="#39d6df" stroke-width="86" stroke-opacity="0.22"/>
    <path d="M460 410 H1140 M460 490 H1140" stroke="#88f3f4" stroke-width="3" stroke-opacity="0.52"/>
    <g fill="#9af7f5" filter="url(#smallGlow)">
      <rect x="565" y="428" width="65" height="44" rx="12"/>
      <rect x="675" y="428" width="65" height="44" rx="12"/>
      <rect x="785" y="428" width="65" height="44" rx="12"/>
      <rect x="895" y="428" width="65" height="44" rx="12"/>
    </g>
    <path d="M800 170 V760" stroke="#d0ffff" stroke-width="2" stroke-opacity="0.18"/>
  </g>
  <g fill="none" stroke="#9cf5f2" stroke-linecap="round">
    <path d="M720 369 C720 316 756 285 800 285 C844 285 880 316 880 369" stroke-width="18"/>
    <rect x="685" y="359" width="230" height="178" rx="34" stroke-width="12" fill="#092b42"/>
    <circle cx="800" cy="432" r="22" fill="#9cf5f2" stroke="none"/>
    <path d="M800 452 V490" stroke-width="14"/>
  </g>
  <g fill="#f7b44d">
    <circle cx="447" cy="268" r="10"/>
    <circle cx="1153" cy="615" r="10"/>
  </g>
  <g opacity="0.38" stroke="#83e9ed" fill="none">
    <circle cx="800" cy="450" r="352" stroke-width="2" stroke-dasharray="5 18"/>
    <circle cx="800" cy="450" r="394" stroke-width="1" stroke-dasharray="2 24"/>
  </g>
</svg>
