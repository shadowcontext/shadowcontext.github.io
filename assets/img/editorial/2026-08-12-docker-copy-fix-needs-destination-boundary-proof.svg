<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded container file-transfer boundary</title>
  <desc id="desc">Abstract blue container blocks send luminous file fragments toward a protected destination, where a gold boundary redirects the path into a verified chamber.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182d"/>
      <stop offset="0.55" stop-color="#102f4d"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43c7e8"/>
      <stop offset="1" stop-color="#1766ad"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f59e42"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#57d9ef" stop-opacity=".32"/>
      <stop offset="1" stop-color="#57d9ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#8bc9df" stroke-opacity=".07" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="560" cy="450" rx="520" ry="390" fill="url(#glow)"/>
  <circle cx="1330" cy="150" r="180" fill="#285879" opacity=".14"/>
  <circle cx="1420" cy="720" r="260" fill="#142844" opacity=".45"/>

  <g opacity=".35" fill="none" stroke="#68cce4" stroke-width="3">
    <path d="M90 174C300 74 438 126 592 88"/>
    <path d="M1030 795c180-112 326-90 480-184"/>
  </g>

  <g transform="translate(155 278)">
    <ellipse cx="330" cy="422" rx="300" ry="46" fill="#020812" opacity=".55"/>
    <g transform="translate(0 105)">
      <path d="M0 70 118 0l118 70-118 70z" fill="#36aed3"/>
      <path d="m0 70 118 70v126L0 196z" fill="#17629d"/>
      <path d="m236 70-118 70v126l118-70z" fill="#0f477b"/>
      <path d="m34 80 84 50 84-50" fill="none" stroke="#9eeafa" stroke-opacity=".72" stroke-width="5"/>
    </g>
    <g transform="translate(175 0)">
      <path d="M0 70 118 0l118 70-118 70z" fill="#5ed4e9"/>
      <path d="m0 70 118 70v126L0 196z" fill="#1b72b2"/>
      <path d="m236 70-118 70v126l118-70z" fill="#125184"/>
      <path d="m34 80 84 50 84-50" fill="none" stroke="#c2f4ff" stroke-opacity=".78" stroke-width="5"/>
    </g>
    <g transform="translate(350 105)">
      <path d="M0 70 118 0l118 70-118 70z" fill="#36aed3"/>
      <path d="m0 70 118 70v126L0 196z" fill="#17629d"/>
      <path d="m236 70-118 70v126l118-70z" fill="#0f477b"/>
      <path d="m34 80 84 50 84-50" fill="none" stroke="#9eeafa" stroke-opacity=".72" stroke-width="5"/>
    </g>
  </g>

  <path d="M704 450C805 450 827 450 912 450" fill="none" stroke="#4fd0e7" stroke-opacity=".28" stroke-width="54" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M692 450h220" fill="none" stroke="url(#blue)" stroke-width="14" stroke-linecap="round" stroke-dasharray="22 22"/>

  <g fill="#bff7ff" stroke="#4bbbd6" stroke-width="4">
    <path d="M730 397h54l21 21v57h-75z"/>
