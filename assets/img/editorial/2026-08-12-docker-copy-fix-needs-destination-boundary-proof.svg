    <path d="M817 480h47l18 18v50h-65z" opacity=".78"/>
    <path d="M882 498h-18v-18" fill="none"/>
  </g>

  <g transform="translate(935 116)">
    <rect x="0" y="0" width="34" height="668" rx="17" fill="#f7bd58" opacity=".18" filter="url(#shadow)"/>
    <rect x="4" y="0" width="26" height="668" rx="13" fill="url(#gold)"/>
    <path d="M17 190 72 245 17 300" fill="#0d2338" stroke="#ffdb7c" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="17" cy="334" r="15" fill="#fff2bc"/>
