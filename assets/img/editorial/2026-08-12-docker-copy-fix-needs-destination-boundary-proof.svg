    <path d="M250 202v38h38" fill="none" stroke="#75d1e2" stroke-width="6"/>
    <circle cx="220" cy="281" r="24" fill="#f5b74c"/>
    <path d="m209 281 8 8 17-20" fill="none" stroke="#0d2942" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#9de6f3">
    <circle cx="104" cy="724" r="4"/>
    <circle cx="1447" cy="210" r="5"/>
    <circle cx="1500" cy="300" r="3"/>
    <circle cx="860" cy="160" r="4"/>
