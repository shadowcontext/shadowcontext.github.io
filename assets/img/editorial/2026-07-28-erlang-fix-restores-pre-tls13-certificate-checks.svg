<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Certificate validation protects an encrypted connection</title>
  <desc id="desc">Abstract encrypted connection passing through a luminous certificate shield while a fractured legacy path is contained below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#10274a"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="52%">
      <stop offset="0" stop-color="#4ce4ff" stop-opacity=".32"/>
      <stop offset=".48" stop-color="#2a7de1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34a7ff" stop-opacity=".08"/>
      <stop offset=".43" stop-color="#5be9ff"/>
      <stop offset=".57" stop-color="#b8fbff"/>
      <stop offset="1" stop-color="#42c9ff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ffff" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#4ee5ff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#2568d7" stop-opacity=".44"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcb68"/>
      <stop offset="1" stop-color="#ff6b52"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="shieldClip">
      <path d="M800 206C900 262 985 281 1052 291v181c0 132-92 226-252 292-160-66-252-160-252-292V291c67-10 152-29 252-85Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="425" rx="640" ry="410" fill="url(#halo)"/>
  <path d="M92 210C342 63 549 92 694 213" fill="none" stroke="#4bb9ff" stroke-opacity=".12" stroke-width="2"/>
  <path d="M1508 226C1271 83 1064 99 916 213" fill="none" stroke="#7cecff" stroke-opacity=".11" stroke-width="2"/>
  <path d="M86 688C354 832 578 796 704 694" fill="none" stroke="#355fa8" stroke-opacity=".22" stroke-width="2"/>
  <path d="M1518 682C1259 827 1039 799 905 696" fill="none" stroke="#355fa8" stroke-opacity=".22" stroke-width="2"/>

  <g opacity=".78">
    <path d="M0 415C201 415 271 349 432 349c116 0 170 67 267 67" fill="none" stroke="url(#stream)" stroke-width="10"/>
    <path d="M1600 415c-201 0-271-66-432-66-116 0-170 67-267 67" fill="none" stroke="url(#stream)" stroke-width="10"/>
    <path d="M0 439C207 439 294 502 451 502c108 0 161-57 253-57" fill="none" stroke="#2498df" stroke-opacity=".4" stroke-width="4"/>
    <path d="M1600 439c-207 0-294 63-451 63-108 0-161-57-253-57" fill="none" stroke="#2498df" stroke-opacity=".4" stroke-width="4"/>
  </g>

  <g opacity=".28" fill="#7defff">
    <circle cx="268" cy="349" r="8"/>
    <circle cx="388" cy="415" r="5"/>
    <circle cx="1196" cy="350" r="8"/>
    <circle cx="1312" cy="415" r="5"/>
    <circle cx="335" cy="501" r="6"/>
    <circle cx="1264" cy="500" r="6"/>
  </g>

  <path d="M800 206C900 262 985 281 1052 291v181c0 132-92 226-252 292-160-66-252-160-252-292V291c67-10 152-29 252-85Z"
        fill="#1ba9dc" fill-opacity=".12" stroke="url(#shield)" stroke-width="5" filter="url(#glow)"/>
  <g clip-path="url(#shieldClip)">
    <ellipse cx="750" cy="318" rx="247" ry="92" fill="#d9ffff" fill-opacity=".12" transform="rotate(-13 750 318)"/>
    <path d="M500 573 962 212l157 100-463 370Z" fill="#55dcff" fill-opacity=".08"/>
    <path d="M551 500h498" stroke="#b8fbff" stroke-opacity=".15" stroke-width="2"/>
  </g>

  <g filter="url(#glow)">
    <path d="M720 431c0-46 35-83 80-83s80 37 80 83v37h-31v-37c0-29-21-52-49-52s-49 23-49 52v37h-31Z"
          fill="none" stroke="#d6ffff" stroke-width="13" stroke-linecap="round"/>
    <rect x="687" y="452" width="226" height="158" rx="34" fill="#5fe9ff" fill-opacity=".18" stroke="#c7ffff" stroke-width="5"/>
    <circle cx="800" cy="518" r="18" fill="#d8ffff"/>
    <path d="M800 533v34" stroke="#d8ffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g opacity=".9">
    <path d="M301 646c126-79 244-103 358-62" fill="none" stroke="url(#amber)" stroke-opacity=".56" stroke-width="8" stroke-linecap="round"/>
    <path d="M941 584c112-39 228-17 356 61" fill="none" stroke="url(#amber)" stroke-opacity=".28" stroke-width="8" stroke-linecap="round"/>
    <path d="m622 565 27 37-42 17 20 39-61 19" fill="none" stroke="#ff9c5c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m978 568-29 35 43 18-22 38 58 20" fill="none" stroke="#ff9c5c" stroke-opacity=".5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity=".52">
    <path d="M622 236 664 196l43 34-18 55-56 1Z" fill="#8ceeff" fill-opacity=".14" stroke="#82eaff" stroke-width="2"/>
    <path d="m936 193 49 29-10 59-54 8-25-47Z" fill="#8ceeff" fill-opacity=".1" stroke="#82eaff" stroke-width="2"/>
    <path d="m1104 373 53-18 32 42-26 49-55-7Z" fill="#8ceeff" fill-opacity=".09" stroke="#82eaff" stroke-width="2"/>
    <path d="m446 372 51-16 31 42-27 47-54-8Z" fill="#8ceeff" fill-opacity=".09" stroke="#82eaff" stroke-width="2"/>
  </g>

  <ellipse cx="800" cy="760" rx="265" ry="32" fill="#34c9ff" fill-opacity=".12" filter="url(#soft)"/>
</svg>
