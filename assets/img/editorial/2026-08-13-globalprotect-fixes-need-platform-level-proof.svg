<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Platform-specific patch layers securing an endpoint tunnel</title>
  <desc id="desc">A polished abstract secured endpoint sits at the center of a flowing teal network tunnel. Staggered amber and blue platform layers converge on a bright verified patch boundary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061823"/>
      <stop offset="0.52" stop-color="#0b2d3d"/>
      <stop offset="1" stop-color="#10192d"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="49%" r="58%">
      <stop offset="0" stop-color="#38e6d1" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#168fa0" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#071522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5a73" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#4de8d4" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3674b8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4b5d"/>
      <stop offset="0.48" stop-color="#0b2937"/>
      <stop offset="1" stop-color="#071624"/>
    </linearGradient>
    <linearGradient id="proof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.45" stop-color="#55f0d8"/>
      <stop offset="1" stop-color="#42a7dc"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#020712" flood-opacity="0.72"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <path d="M72 0H0V72" fill="none" stroke="#8cebdc" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="448" rx="690" ry="415" fill="url(#aura)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M120 294C370 185 514 219 676 337C731 377 769 393 800 393C831 393 869 377 924 337C1086 219 1230 185 1480 294" stroke="url(#tunnel)" stroke-width="58"/>
    <path d="M120 606C370 715 514 681 676 563C731 523 769 507 800 507C831 507 869 523 924 563C1086 681 1230 715 1480 606" stroke="url(#tunnel)" stroke-width="58"/>
    <path d="M120 294C370 185 514 219 676 337" stroke="#2a8093" stroke-opacity="0.36" stroke-width="5"/>
    <path d="M924 337C1086 219 1230 185 1480 294" stroke="#4382bd" stroke-opacity="0.32" stroke-width="5"/>
    <path d="M120 606C370 715 514 681 676 563" stroke="#2a8093" stroke-opacity="0.3" stroke-width="5"/>
    <path d="M924 563C1086 681 1230 715 1480 606" stroke="#4382bd" stroke-opacity="0.26" stroke-width="5"/>
  </g>

  <g opacity="0.8" filter="url(#shadow)">
