    <circle cx="1119" cy="688" r="7"/><circle cx="1169" cy="688" r="7"/><circle cx="1219" cy="688" r="7"/>
    <circle cx="613" cy="688" r="7"/><circle cx="673" cy="688" r="7"/>
    <circle cx="927" cy="688" r="7"/><circle cx="987" cy="688" r="7"/>
  </g>

  <path d="M238 742H1362" stroke="#58dfcf" stroke-opacity="0.34" stroke-width="5"/>
  <path d="M306 790H1294" stroke="#58dfcf" stroke-opacity="0.16" stroke-width="3"/>
  <g fill="none" stroke="#4acfc4" stroke-width="4" opacity="0.54">
