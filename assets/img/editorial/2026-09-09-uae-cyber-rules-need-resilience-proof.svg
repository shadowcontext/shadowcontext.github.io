  <g fill="#8cf2de" opacity="0.86">
    <circle cx="278" cy="646" r="8"/><circle cx="1322" cy="646" r="8"/>
    <circle cx="372" cy="646" r="7"/><circle cx="1228" cy="646" r="7"/>
    <circle cx="472" cy="646" r="9"/><circle cx="1128" cy="646" r="9"/>
  </g>
</svg>
