<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Download streams crossing a guarded kernel boundary</title>
  <desc id="desc">Abstract editorial artwork showing luminous download streams passing through a verification ring before reaching a protected layered kernel core.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071422"/>
      <stop offset="0.5" stop-color="#10273a"/>
      <stop offset="1" stop-color="#251a35"/>
    </linearGradient>
    <radialGradient id="halo" cx="67%" cy="48%" r="52%">
      <stop offset="0" stop-color="#50e3c2" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#2c91b6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#071422" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ca4c7" stop-opacity="0.18"/>
      <stop offset="0.58" stop-color="#7de8db" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd27d"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7fff1"/>
      <stop offset="0.52" stop-color="#48d2c3"/>
      <stop offset="1" stop-color="#f2b95f"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5de0d1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#152b43" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grain" width="52" height="52" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1" fill="#d8fbff" opacity="0.08"/>
      <circle cx="39" cy="35" r="0.9" fill="#ffd997" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <ellipse cx="1090" cy="446" rx="430" ry="340" fill="#52d8cb" opacity="0.09" filter="url(#soft)"/>
  <g fill="none" stroke="url(#stream)" stroke-linecap="round">
    <path d="M70 246 C294 246 354 340 590 340 S794 304 906 342" stroke-width="18" opacity="0.55"/>
    <path d="M12 438 C250 438 386 420 586 438 S786 498 910 456" stroke-width="28" opacity="0.76"/>
    <path d="M86 650 C316 650 390 548 596 558 S790 600 910 548" stroke-width="14" opacity="0.48"/>
  </g>
  <g fill="#c9fbf3" opacity="0.8">
    <circle cx="244" cy="246" r="7"/><circle cx="410" cy="315" r="5"/><circle cx="310" cy="430" r="8"/>
    <circle cx="508" cy="434" r="6"/><circle cx="252" cy="641" r="5"/><circle cx="474" cy="578" r="7"/>
  </g>
  <g transform="translate(900 450)" filter="url(#glow)">
    <circle r="224" fill="#091827" fill-opacity="0.82" stroke="#1d5267" stroke-width="42" opacity="0.8"/>
    <circle r="198" fill="none" stroke="url(#guard)" stroke-width="13"/>
    <circle r="166" fill="none" stroke="#a9fff3" stroke-width="2" opacity="0.42" stroke-dasharray="5 16"/>
    <path d="M-34 -60 L0 -94 L34 -60 L34 -12 L72 -12 L72 32 L34 32 L34 76 L-34 76 L-34 32 L-72 32 L-72 -12 L-34 -12 Z" fill="#0d2032" stroke="#f2bf68" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-24 4 L-3 25 L38 -20" fill="none" stroke="#72eddd" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1160 205)">
    <path d="M0 80 L210 0 L372 112 L340 508 L156 620 L-30 496 Z" fill="#07131f" fill-opacity="0.76" stroke="#347b8b" stroke-width="4"/>
    <path d="M36 126 L207 62 L324 143 L297 463 L153 550 L8 453 Z" fill="url(#layer)" stroke="#6ce7da" stroke-width="4"/>
    <path d="M74 191 L203 143 L276 194 L257 412 L150 477 L43 405 Z" fill="#0c1d2b" stroke="#f0bd67" stroke-width="5"/>
    <path d="M109 254 L199 220 L230 242 L217 358 L148 400 L80 354 L70 274 Z" fill="#18354a" stroke="#88f4e6" stroke-width="3"/>
    <circle cx="150" cy="310" r="34" fill="#07131f" stroke="#62ddcf" stroke-width="7" filter="url(#glow)"/>
  </g>
  <path d="M1102 451 C1130 451 1140 451 1166 451" stroke="#ffd27d" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 18" filter="url(#glow)"/>
  <g fill="none" stroke="#4ccabd" opacity="0.25">
    <circle cx="900" cy="450" r="278" stroke-width="2"/>
    <circle cx="900" cy="450" r="326" stroke-width="1"/>
  </g>
  <path d="M0 790 C300 720 552 825 824 773 S1320 680 1600 735 L1600 900 L0 900 Z" fill="#040b13" opacity="0.6"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
</svg>
