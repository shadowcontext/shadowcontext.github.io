<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity gateway stopping a deceptive authorization code</title>
  <desc id="desc">Abstract authorization gateway with a deceptive amber code ribbon stopped by a layered blue identity-control barrier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#102b40"/>
      <stop offset="1" stop-color="#081421"/>
    </linearGradient>
    <radialGradient id="halo" cx="54%" cy="48%" r="55%">
      <stop offset="0" stop-color="#39c8d5" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#177c9c" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset=".28" stop-color="#54d8e4"/>
      <stop offset="1" stop-color="#197b9c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ce8ef" stop-opacity=".32"/>
      <stop offset="1" stop-color="#143951" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd88a"/>
      <stop offset=".55" stop-color="#f2a449"/>
      <stop offset="1" stop-color="#c9602f"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <ellipse cx="890" cy="470" rx="520" ry="285" fill="#2fc1cf" opacity=".08" filter="url(#blur)"/>

  <g fill="none" stroke="#63d7df" stroke-linecap="round">
    <path d="M90 238 C300 238 340 120 530 120" opacity=".11" stroke-width="3"/>
    <path d="M60 680 C292 680 342 782 550 782" opacity=".1" stroke-width="3"/>
    <path d="M1070 108 C1280 108 1325 245 1530 245" opacity=".1" stroke-width="3"/>
    <path d="M1070 792 C1285 792 1330 650 1540 650" opacity=".12" stroke-width="3"/>
  </g>
  <g fill="#70dce4" opacity=".5">
    <circle cx="90" cy="238" r="6"/><circle cx="60" cy="680" r="6"/>
    <circle cx="1530" cy="245" r="6"/><circle cx="1540" cy="650" r="6"/>
  </g>

  <g transform="translate(560 118)">
    <path d="M240 0 L474 92 V324 C474 490 382 596 240 658 C98 596 6 490 6 324 V92 Z"
          fill="#06131f" stroke="#4bd2df" stroke-opacity=".22" stroke-width="5"/>
    <path d="M240 34 L438 111 V318 C438 457 363 548 240 607 C117 548 42 457 42 318 V111 Z"
          fill="url(#glass)" stroke="url(#portal)" stroke-width="7"/>
    <path d="M240 77 L398 138 V310 C398 421 340 495 240 549 C140 495 82 421 82 310 V138 Z"
          fill="#081b2a" stroke="#79e5ea" stroke-opacity=".34" stroke-width="3"/>

    <g transform="translate(145 202)">
      <rect x="0" y="0" width="190" height="228" rx="30" fill="#0b2536" stroke="#92edf0" stroke-width="6"/>
      <circle cx="95" cy="77" r="36" fill="none" stroke="#8ee9ee" stroke-width="14"/>
      <path d="M45 158 Q95 117 145 158 V185 H45 Z" fill="#4bbfcf" opacity=".75"/>
      <circle cx="153" cy="39" r="12" fill="#d9fbff" filter="url(#glow)"/>
    </g>
  </g>

  <g transform="translate(85 334)">
    <path d="M0 94 C148 18 293 14 438 74 C500 100 544 122 596 122"
          fill="none" stroke="#2a1720" stroke-opacity=".65" stroke-width="76" stroke-linecap="round"/>
    <path d="M0 94 C148 18 293 14 438 74 C500 100 544 122 596 122"
          fill="none" stroke="url(#ribbon)" stroke-width="46" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#6d2e29" opacity=".72">
      <rect x="122" y="40" width="34" height="34" rx="8" transform="rotate(-8 139 57)"/>
      <rect x="195" y="28" width="34" height="34" rx="8" transform="rotate(2 212 45)"/>
      <rect x="270" y="34" width="34" height="34" rx="8" transform="rotate(8 287 51)"/>
      <rect x="345" y="52" width="34" height="34" rx="8" transform="rotate(14 362 69)"/>
    </g>
  </g>

  <g transform="translate(630 342)">
    <path d="M0 0 L58 20 V215 L0 235 Z" fill="#baf8f8" opacity=".78"/>
    <path d="M58 20 L102 7 V202 L58 215 Z" fill="#2ba9bf" opacity=".9"/>
    <path d="M102 7 L136 24 V185 L102 202 Z" fill="#176e91" opacity=".9"/>
    <line x1="58" y1="20" x2="58" y2="215" stroke="#e2ffff" stroke-width="5" filter="url(#glow)"/>
  </g>

  <g fill="none" stroke="#73dce4" opacity=".28">
    <ellipse cx="810" cy="448" rx="510" ry="338" stroke-width="3" stroke-dasharray="4 24"/>
    <ellipse cx="810" cy="448" rx="610" ry="400" stroke-width="2" stroke-dasharray="80 35"/>
  </g>
</svg>
