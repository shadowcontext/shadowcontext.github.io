<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Certificate status bound to the correct certificate</title>
  <desc id="desc">Abstract editorial artwork showing layered certificate forms connected to one verified status token through a luminous cryptographic binding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102d43"/>
      <stop offset="1" stop-color="#071d2e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67f5d2" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#36bdd5" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fbf4" stop-opacity="0.88"/>
      <stop offset="0.58" stop-color="#6bc6d4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#276180" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65f4cf"/>
      <stop offset="0.5" stop-color="#a8fff0"/>
      <stop offset="1" stop-color="#55c7ff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r="1" fill="#c8fff5" opacity="0.08"/>
      <circle cx="35" cy="31" r="1.3" fill="#74d7ee" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="840" cy="455" rx="620" ry="430" fill="url(#halo)"/>
  <path d="M0 675 C310 585 465 780 778 665 S1285 552 1600 660 V900 H0Z" fill="#07101e" opacity="0.52"/>
  <path d="M-80 182 C310 286 500 91 823 187 S1310 302 1680 160" fill="none" stroke="#54d8da" stroke-opacity="0.1" stroke-width="2"/>

  <g transform="translate(315 185) rotate(-8 310 265)" opacity="0.28">
    <rect x="0" y="0" width="520" height="590" rx="34" fill="#153d55" stroke="#67bfd0" stroke-width="3"/>
    <path d="M65 112 H354 M65 162 H418 M65 212 H320" stroke="#9cdeea" stroke-opacity="0.42" stroke-width="16" stroke-linecap="round"/>
    <circle cx="372" cy="430" r="74" fill="none" stroke="#73d9d5" stroke-width="14"/>
  </g>

  <g transform="translate(435 135)">
    <rect x="0" y="0" width="545" height="620" rx="38" fill="url(#paper)" stroke="#b7fff1" stroke-opacity="0.62" stroke-width="3"/>
    <path d="M70 112 H348" stroke="#e8fffb" stroke-opacity="0.82" stroke-width="18" stroke-linecap="round"/>
    <path d="M70 172 H438 M70 225 H392 M70 278 H460" stroke="#d1fbf7" stroke-opacity="0.48" stroke-width="13" stroke-linecap="round"/>
    <path d="M70 355 H278 M70 402 H330" stroke="#d1fbf7" stroke-opacity="0.32" stroke-width="10" stroke-linecap="round"/>
    <circle cx="399" cy="471" r="82" fill="#0c3044" fill-opacity="0.56" stroke="url(#edge)" stroke-width="13"/>
    <path d="M365 473 l22 23 48-59" fill="none" stroke="#b9fff0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372 539 l-18 64 46-24 42 28-17-68" fill="#49b7c8" fill-opacity="0.58"/>
  </g>

  <g filter="url(#glow)">
    <path d="M846 412 C1004 357 1074 388 1159 441" fill="none" stroke="#79f6d6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="849" cy="411" r="15" fill="#c5fff2"/>
    <circle cx="1160" cy="442" r="15" fill="#c5fff2"/>
  </g>

  <g transform="translate(1115 342)">
    <ellipse cx="130" cy="130" rx="156" ry="150" fill="#57ecd1" opacity="0.16" filter="url(#soft)"/>
    <circle cx="130" cy="130" r="118" fill="#0b273c" stroke="#73f2d6" stroke-width="7"/>
    <circle cx="130" cy="130" r="88" fill="none" stroke="#4f9fba" stroke-width="2" stroke-dasharray="10 13"/>
    <path d="M87 133 l29 31 61-75" fill="none" stroke="url(#edge)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="130" cy="130" r="134" fill="none" stroke="#b9fff0" stroke-opacity="0.2" stroke-width="2"/>
  </g>

  <g fill="#75e4d7">
    <circle cx="230" cy="270" r="4" opacity="0.38"/>
    <circle cx="1304" cy="234" r="5" opacity="0.28"/>
    <circle cx="1395" cy="670" r="3" opacity="0.45"/>
    <circle cx="1080" cy="713" r="4" opacity="0.32"/>
    <circle cx="272" cy="730" r="3" opacity="0.28"/>
  </g>
</svg>
