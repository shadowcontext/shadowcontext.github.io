<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Validated data paths protecting a privileged core</title>
  <desc id="desc">Abstract blue data paths converge on a segmented validation gate before a narrow approved path reaches a protected amber core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.52" stop-color="#0b2940"/>
      <stop offset="1" stop-color="#10213b"/>
    </linearGradient>
    <radialGradient id="aura" cx="72%" cy="50%" r="42%">
      <stop offset="0" stop-color="#ffbf69" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#47d7d0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c77a8" stop-opacity="0.35"/>
      <stop offset="0.68" stop-color="#5be0da" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e9fbf8"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94f4ed"/>
      <stop offset="1" stop-color="#248ea4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset="0.5" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#e56c32"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1600" height="900" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#aura)"/>
    <circle cx="1250" cy="450" r="250" fill="#f9a94b" opacity="0.06" filter="url(#soft)"/>
    <circle cx="680" cy="450" r="205" fill="#3de2da" opacity="0.05" filter="url(#soft)"/>

    <g fill="none" stroke-linecap="round">
      <path d="M-80 170 C250 170 345 300 690 320 C812 327 850 363 925 406" stroke="url(#flow)" stroke-width="28"/>
      <path d="M-100 310 C230 300 375 375 694 390 C820 396 853 417 925 434" stroke="url(#flow)" stroke-width="20" opacity="0.82"/>
      <path d="M-80 474 C260 470 414 458 700 456 C809 455 854 452 925 450" stroke="url(#flow)" stroke-width="34"/>
      <path d="M-100 625 C235 620 390 532 698 520 C817 515 855 486 925 466" stroke="url(#flow)" stroke-width="22" opacity="0.88"/>
      <path d="M-60 760 C276 744 374 614 690 580 C812 567 852 523 925 489" stroke="url(#flow)" stroke-width="26" opacity="0.72"/>
    </g>

    <g fill="#8df1eb" opacity="0.9">
      <circle cx="210" cy="202" r="9"/><circle cx="368" cy="292" r="7"/><circle cx="500" cy="372" r="11"/>
      <circle cx="142" cy="475" r="8"/><circle cx="343" cy="460" r="10"/><circle cx="587" cy="455" r="7"/>
      <circle cx="205" cy="648" r="10"/><circle cx="413" cy="570" r="7"/><circle cx="567" cy="544" r="9"/>
    </g>

    <g transform="translate(945 190)">
      <path d="M0 0 H82 L130 48 V145 L82 193 H0 L38 145 V48 Z" fill="url(#gate)" opacity="0.95"/>
      <path d="M0 263 H82 L130 311 V408 L82 456 H0 L38 408 V311 Z" fill="url(#gate)" opacity="0.95"/>
      <path d="M52 205 H130 V251 H52 L72 228 Z" fill="#d8fffb" opacity="0.92" filter="url(#glow)"/>
      <path d="M16 30 H64 L95 61 V132 L64 163 H16 L52 127 V66 Z" fill="#0d3a50" opacity="0.72"/>
      <path d="M16 293 H64 L95 324 V395 L64 426 H16 L52 390 V329 Z" fill="#0d3a50" opacity="0.72"/>
    </g>

    <path d="M1075 418 C1130 418 1166 424 1218 440 C1240 447 1261 450 1288 450" fill="none" stroke="#e6fffb" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
    <g transform="translate(1320 450)">
      <circle r="128" fill="#0c1b2c" stroke="#4bb5b8" stroke-width="3" opacity="0.92"/>
      <circle r="96" fill="none" stroke="#75ded8" stroke-width="2" stroke-dasharray="8 14" opacity="0.52"/>
      <path d="M0-69 L60-34 V34 L0 69 L-60 34 V-34 Z" fill="url(#core)" filter="url(#glow)"/>
      <path d="M0-43 L37-21 V21 L0 43 L-37 21 V-21 Z" fill="#fff1c8" opacity="0.34"/>
      <circle r="13" fill="#fff8dc"/>
    </g>

    <g fill="none" stroke="#63d7d2" opacity="0.22">
      <circle cx="1320" cy="450" r="170" stroke-width="2"/>
      <circle cx="1320" cy="450" r="207" stroke-width="1" stroke-dasharray="4 18"/>
      <path d="M1180 285 C1295 200 1465 240 1525 365" stroke-width="2"/>
      <path d="M1192 624 C1320 707 1472 650 1520 526" stroke-width="2"/>
    </g>
  </g>
</svg>
