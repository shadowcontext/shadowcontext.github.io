<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Distributed AI access signals converging at a protected model core</title>
  <desc id="desc">Abstract access nodes send patterned streams toward a luminous AI core, where a protective correlation ring separates ordinary blue signals from concentrated amber activity.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="60" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06162d"/>
      <stop offset="0.5" stop-color="#102b49"/>
      <stop offset="1" stop-color="#071b2b"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(800 450) rotate(90) scale(208)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6fff3"/>
      <stop offset="0.42" stop-color="#55d9c4"/>
      <stop offset="1" stop-color="#16738c"/>
    </radialGradient>
    <linearGradient id="shield" x1="594" y1="225" x2="1038" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9bf7df"/>
      <stop offset="0.55" stop-color="#38aeb5"/>
      <stop offset="1" stop-color="#17617d"/>
    </linearGradient>
    <linearGradient id="amberFlow" x1="185" y1="490" x2="653" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3a85f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f6c36e" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
