<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Recruitment claim passing through independent verification gates</title>
  <desc id="desc">An abstract recruitment document travels through two luminous verification gates while deceptive message fragments remain outside the trusted path.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="70" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07192E"/>
      <stop offset="0.52" stop-color="#123B55"/>
      <stop offset="1" stop-color="#071623"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(830 450) rotate(90) scale(420 700)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E4C3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#67E4C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="568" y1="195" x2="1015" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8FFF7"/>
      <stop offset="1" stop-color="#9EDACD"/>
    </linearGradient>
    <linearGradient id="gate" x1="485" y1="110" x2="1100" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FFFD9"/>
      <stop offset="1" stop-color="#35B8D1"/>
    </linearGradient>
    <linearGradient id="false" x1="100" y1="220" x2="1450" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9B78"/>
      <stop offset="1" stop-color="#D84C8A"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#02080F" flood-opacity="0.65"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="830" cy="450" rx="700" ry="420" fill="url(#halo)"/>
  <g opacity="0.22" fill="none" stroke="#8BC9D4" stroke-width="3">
    <path d="M0 166H260L338 244"/>
    <path d="M1600 142H1360L1272 230"/>
    <path d="M0 742H278L354 666"/>
    <path d="M1600 760H1345L1264 679"/>
