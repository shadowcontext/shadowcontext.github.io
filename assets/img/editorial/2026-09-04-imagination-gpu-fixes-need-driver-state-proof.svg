<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GPU memory isolation boundary</title>
  <desc id="desc">Abstract layered GPU processor behind a luminous boundary, with isolated memory blocks on either side.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071324"/>
      <stop offset="0.52" stop-color="#102743"/>
      <stop offset="1" stop-color="#09111d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".3"/>
      <stop offset=".55" stop-color="#38bdf8" stop-opacity=".1"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0fbff"/>
      <stop offset=".45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4262"/>
      <stop offset="1" stop-color="#0b1d32"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7dd3fc" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="430" rx="680" ry="420" fill="url(#halo)"/>

  <g opacity=".8">
    <path d="M118 241C310 241 313 360 476 360" fill="none" stroke="#60a5fa" stroke-opacity=".36" stroke-width="4"/>
    <path d="M1482 659C1290 659 1287 540 1124 540" fill="none" stroke="#2dd4bf" stroke-opacity=".34" stroke-width="4"/>
    <circle cx="118" cy="241" r="8" fill="#60a5fa"/>
    <circle cx="1482" cy="659" r="8" fill="#2dd4bf"/>
  </g>

  <g transform="translate(265 215)">
    <rect x="0" y="0" width="1070" height="470" rx="58" fill="#07111f" stroke="#7dd3fc" stroke-opacity=".22" stroke-width="3"/>
    <rect x="32" y="32" width="1006" height="406" rx="38" fill="url(#chip)" stroke="#93c5fd" stroke-opacity=".23" stroke-width="2"/>

    <g fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="5">
      <path d="M0 86H-62M0 174H-90M0 296H-90M0 384H-62"/>
      <path d="M1070 86h62M1070 174h90M1070 296h90M1070 384h62"/>
    </g>
    <g fill="#7dd3fc">
      <circle cx="-62" cy="86" r="7"/><circle cx="-90" cy="174" r="7"/><circle cx="-90" cy="296" r="7"/><circle cx="-62" cy="384" r="7"/>
      <circle cx="1132" cy="86" r="7"/><circle cx="1160" cy="174" r="7"/><circle cx="1160" cy="296" r="7"/><circle cx="1132" cy="384" r="7"/>
    </g>

    <g opacity=".92">
      <rect x="90" y="84" width="310" height="116" rx="23" fill="#173657" stroke="#60a5fa" stroke-opacity=".55" stroke-width="2"/>
      <rect x="90" y="270" width="310" height="116" rx="23" fill="#173657" stroke="#60a5fa" stroke-opacity=".55" stroke-width="2"/>
      <g fill="#60a5fa" fill-opacity=".55">
        <rect x="128" y="118" width="70" height="48" rx="10"/><rect x="218" y="118" width="70" height="48" rx="10"/><rect x="308" y="118" width="54" height="48" rx="10"/>
        <rect x="128" y="304" width="54" height="48" rx="10"/><rect x="202" y="304" width="70" height="48" rx="10"/><rect x="292" y="304" width="70" height="48" rx="10"/>
      </g>
    </g>

    <g opacity=".92">
      <rect x="670" y="84" width="310" height="116" rx="23" fill="#123c43" stroke="#2dd4bf" stroke-opacity=".6" stroke-width="2"/>
      <rect x="670" y="270" width="310" height="116" rx="23" fill="#123c43" stroke="#2dd4bf" stroke-opacity=".6" stroke-width="2"/>
      <g fill="#2dd4bf" fill-opacity=".52">
        <rect x="708" y="118" width="54" height="48" rx="10"/><rect x="782" y="118" width="70" height="48" rx="10"/><rect x="872" y="118" width="70" height="48" rx="10"/>
        <rect x="708" y="304" width="70" height="48" rx="10"/><rect x="798" y="304" width="70" height="48" rx="10"/><rect x="888" y="304" width="54" height="48" rx="10"/>
      </g>
    </g>

    <rect x="512" y="-34" width="46" height="538" rx="23" fill="#38bdf8" opacity=".18" filter="url(#soft)"/>
    <rect x="526" y="-34" width="18" height="538" rx="9" fill="url(#barrier)" filter="url(#glow)"/>
    <path d="M535 50C590 91 616 151 616 235s-26 144-81 185c-55-41-81-101-81-185S480 91 535 50Z" fill="#0a2035" stroke="url(#barrier)" stroke-width="7"/>
    <path d="M535 110c29 29 44 70 44 125s-15 96-44 125c-29-29-44-70-44-125s15-96 44-125Z" fill="url(#barrier)" fill-opacity=".2"/>
    <circle cx="535" cy="235" r="28" fill="#dffcff" stroke="#2dd4bf" stroke-width="6" filter="url(#glow)"/>

    <g fill="none" stroke="url(#gold)" stroke-linecap="round">
      <path d="M383 235h82" stroke-width="7" stroke-dasharray="5 16"/>
      <path d="M605 235h82" stroke-width="7" stroke-dasharray="5 16"/>
    </g>
  </g>

  <path d="M340 742C560 804 1040 804 1260 742" fill="none" stroke="#7dd3fc" stroke-opacity=".2" stroke-width="3"/>
  <path d="M440 770C620 812 980 812 1160 770" fill="none" stroke="#2dd4bf" stroke-opacity=".18" stroke-width="2"/>
</svg>
