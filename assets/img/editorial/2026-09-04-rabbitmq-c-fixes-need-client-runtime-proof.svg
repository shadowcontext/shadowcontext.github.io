<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AMQP client runtime protected by frame validation and credential boundaries</title>
  <desc id="desc">Abstract luminous message frames cross a validation gate toward a protected client runtime while a separate shield guards local credentials.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.52" stop-color="#102940"/>
      <stop offset="1" stop-color="#17122f"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55b7dc" stop-opacity="0.18"/>
      <stop offset="0.58" stop-color="#65e7e0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b09bff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74f4e7" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#74f4e7" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#8e9cff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8e9cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="runtimeHalo">
      <stop offset="0" stop-color="#8b8eff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#5de4df" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5de4df" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="1180" cy="450" rx="490" ry="420" fill="url(#runtimeHalo)"/>
