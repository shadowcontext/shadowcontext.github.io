    <circle cx="825" cy="159" r="7"/><circle cx="979" cy="171" r="7"/><circle cx="1119" cy="222" r="7"/>
    <circle cx="1262" cy="323" r="7"/><circle cx="1306" cy="447" r="7"/><circle cx="1263" cy="571" r="7"/>
    <circle cx="1155" cy="665" r="7"/><circle cx="1000" cy="727" r="7"/><circle cx="825" cy="747" r="7"/>
  </g>
  <g fill="#4bd7ca" opacity=".35" filter="url(#glow)">
    <circle cx="287" cy="210" r="25"/><circle cx="1390" cy="270" r="22"/><circle cx="1255" cy="742" r="27"/>
  </g>
  <g fill="#9cf8ec" opacity=".38">
    <circle cx="175" cy="598" r="4"/><circle cx="244" cy="677" r="3"/><circle cx="1435" cy="546" r="4"/>
    <circle cx="1332" cy="159" r="3"/><circle cx="555" cy="82" r="4"/><circle cx="1092" cy="92" r="3"/>
  </g>
</svg>
