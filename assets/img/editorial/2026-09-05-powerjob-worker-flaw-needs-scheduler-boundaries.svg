<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected scheduler boundary around distributed worker nodes</title>
  <desc id="desc">An abstract editorial scene of teal worker nodes arranged behind layered security boundaries while an exposed amber control path is stopped at a central shield.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B2A"/>
      <stop offset="0.55" stop-color="#0B3040"/>
      <stop offset="1" stop-color="#102536"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(800 430) rotate(90) scale(390 610)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D4C0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#35D4C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="678" y1="255" x2="936" y2="646" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6DF3DB"/>
      <stop offset="1" stop-color="#198E9B"/>
    </linearGradient>
    <linearGradient id="amber" x1="95" y1="452" x2="650" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB34A" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFB34A"/>
      <stop offset="1" stop-color="#FFCF72"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1" fill="#D7FFF7" opacity="0.08"/>
      <circle cx="31" cy="25" r="1.2" fill="#D7FFF7" opacity="0.05"/>
      <circle cx="16" cy="41" r="0.8" fill="#FFCB69" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <path d="M270 155C495 55 1100 42 1336 192C1510 302 1498 616 1309 735C1071 884 488 856 269 716C86 599 87 236 270 155Z" fill="none" stroke="#53DFC8" stroke-opacity="0.16" stroke-width="3"/>
