<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Remote packet stream checked at a validation boundary</title>
  <desc id="desc">Abstract cyan network packets meet a luminous validation gate before entering a protected remote-capture lens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.55" stop-color="#101b3d"/>
      <stop offset="1" stop-color="#071f2f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55e1d6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#55e1d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e85cc"/>
      <stop offset="0.7" stop-color="#5ce4dc"/>
      <stop offset="1" stop-color="#d2fff4"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a58aff"/>
      <stop offset="0.5" stop-color="#5ce4dc"/>
      <stop offset="1" stop-color="#3659b8"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#85b8d8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="accepted"><rect x="852" y="244" width="520" height="412" rx="206"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1025" cy="450" rx="520" ry="430" fill="url(#halo)"/>
  <path d="M0 724C240 620 434 750 681 662S1122 558 1600 660V900H0Z" fill="#050d1a" opacity="0.72"/>
  <g opacity="0.92">
