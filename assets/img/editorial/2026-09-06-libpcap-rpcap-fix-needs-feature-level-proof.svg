    <rect x="618" y="373" width="84" height="34" rx="8"/>
    <rect x="457" y="433" width="92" height="34" rx="8"/>
    <rect x="646" y="433" width="54" height="34" rx="8"/>
    <rect x="520" y="529" width="76" height="34" rx="8"/>
    <rect x="704" y="493" width="96" height="34" rx="8"/>
  </g>
  <g>
