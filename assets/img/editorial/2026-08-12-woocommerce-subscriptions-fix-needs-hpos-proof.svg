<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected ecommerce order storage</title>
  <desc id="desc">Abstract ecommerce order tiles move through layered verification arcs into a protected data vault, representing version and storage-mode checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102842"/>
      <stop offset="1" stop-color="#071b24"/>
    </linearGradient>
    <radialGradient id="aura" cx="72%" cy="46%" r="52%">
      <stop offset="0" stop-color="#3ee6c4" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#2aa6d9" stop-opacity=".09"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e83ff"/>
      <stop offset="1" stop-color="#42e8be"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183e59"/>
      <stop offset="1" stop-color="#0b2335"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#8fd9ef" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect x="70" y="70" width="1460" height="760" rx="46" fill="url(#grid)" stroke="#9edff0" stroke-opacity=".1"/>

  <g opacity=".92">
    <path d="M165 303C430 303 492 448 724 448" fill="none" stroke="#6379db" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    <path d="M165 448H724" fill="none" stroke="url(#flow)" stroke-width="10" stroke-linecap="round"/>
    <path d="M165 593C430 593 492 448 724 448" fill="none" stroke="#42c9bc" stroke-width="8" stroke-linecap="round" opacity=".5"/>
    <circle cx="342" cy="448" r="12" fill="#8b9cff"/>
    <circle cx="532" cy="448" r="15" fill="#44e6be" filter="url(#glow)"/>
  </g>

  <g transform="translate(128 244)">
    <g transform="rotate(-7 150 80)">
      <rect width="300" height="150" rx="24" fill="#152d4a" stroke="#718dff" stroke-width="3"/>
      <path d="M38 50h55l20 52h111l28-66H102" fill="none" stroke="#9cabff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="132" cy="122" r="9" fill="#41dfbd"/><circle cx="215" cy="122" r="9" fill="#41dfbd"/>
    </g>
    <g transform="translate(20 290) rotate(7 150 80)">
      <rect width="300" height="150" rx="24" fill="#123348" stroke="#47cdbb" stroke-width="3"/>
      <rect x="45" y="39" width="210" height="18" rx="9" fill="#50dac2" opacity=".8"/>
      <rect x="45" y="75" width="152" height="14" rx="7" fill="#8ddff0" opacity=".45"/>
      <rect x="45" y="105" width="181" height="14" rx="7" fill="#8ddff0" opacity=".28"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M785 236C671 310 637 504 761 650" stroke="#768bff" stroke-width="20" opacity=".42"/>
    <path d="M851 270C757 334 735 493 822 614" stroke="#49dfc0" stroke-width="14" opacity=".7"/>
    <path d="M907 311C840 363 828 478 882 570" stroke="#b2f3e6" stroke-width="7" opacity=".9"/>
  </g>

  <g transform="translate(904 190)">
    <path d="M250 28L448 104v226c0 174-105 287-198 333C157 617 52 504 52 330V104z" fill="#0a1d2d" stroke="#52e2c2" stroke-width="8" filter="url(#glow)"/>
    <path d="M250 69l154 59v196c0 137-79 231-154 274-75-43-154-137-154-274V128z" fill="url(#vault)" stroke="#8ae6d9" stroke-opacity=".5" stroke-width="3"/>
    <g transform="translate(146 215)">
      <rect width="208" height="238" rx="28" fill="#071a28" stroke="#77ead4" stroke-width="5"/>
      <rect x="32" y="40" width="144" height="25" rx="12" fill="#244f63"/>
      <rect x="32" y="88" width="144" height="25" rx="12" fill="#244f63"/>
      <rect x="32" y="136" width="144" height="25" rx="12" fill="#244f63"/>
      <circle cx="104" cy="196" r="18" fill="#43dfbd" filter="url(#glow)"/>
      <path d="M104 196v24" stroke="#d5fff6" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle cx="250" cy="28" r="8" fill="#baffef"/>
  </g>

  <g opacity=".55" fill="#84e6d7">
    <circle cx="697" cy="242" r="5"/><circle cx="738" cy="208" r="3"/><circle cx="745" cy="687" r="4"/>
    <circle cx="1428" cy="278" r="4"/><circle cx="1368" cy="701" r="6"/><circle cx="1470" cy="565" r="3"/>
  </g>
</svg>
