      <ellipse cx="1197" cy="453" rx="225" ry="245" fill="#52d5c1" opacity="0.15" filter="url(#softGlow)"/>
      <path d="M1012 611C1080 517 1126 533 1180 444C1238 348 1293 343 1381 254" fill="none" stroke="#7ee8d3" stroke-width="86" stroke-linecap="round" opacity="0.22"/>
      <path d="M1015 650C1104 544 1167 592 1223 492C1270 409 1327 421 1395 340" fill="none" stroke="#8e78ea" stroke-width="58" stroke-linecap="round" opacity="0.34"/>
      <circle cx="1248" cy="372" r="78" fill="#e5c97a" opacity="0.27"/>
      <g fill="none" stroke="#d0fff7" stroke-opacity="0.5" stroke-width="3">
        <path d="M1078 463C1078 390 1131 337 1204 337C1277 337 1330 390 1330 463C1330 536 1277 589 1204 589C1131 589 1078 536 1078 463Z"/>
        <path d="M1120 463C1120 414 1155 379 1204 379C1253 379 1288 414 1288 463C1288 512 1253 547 1204 547C1155 547 1120 512 1120 463Z"/>
      </g>
    </g>
    <circle cx="1195" cy="710" r="10" fill="#71e8d7"/>
    <circle cx="1228" cy="710" r="10" fill="#6c8fc1" opacity="0.75"/>
    <circle cx="1162" cy="710" r="10" fill="#6c8fc1" opacity="0.75"/>
  </g>

  <g transform="translate(806 449)">
    <path d="M0-88C45-71 76-70 108-70V-5C108 62 62 105 0 132C-62 105-108 62-108-5V-70C-76-70-45-71 0-88Z" fill="#0b1c34" stroke="#8bf5df" stroke-width="7"/>
    <path d="M0-55C29-44 49-43 69-43V-4C69 37 42 66 0 87C-42 66-69 37-69-4V-43C-49-43-29-44 0-55Z" fill="#153a57"/>
    <path d="M-27 0L-7 21L33-24" fill="none" stroke="#9bffe9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#75dddb" opacity="0.6">
    <circle cx="879" cy="278" r="4"/>
    <circle cx="897" cy="301" r="3"/>
    <circle cx="888" cy="626" r="4"/>
    <circle cx="917" cy="606" r="3"/>
