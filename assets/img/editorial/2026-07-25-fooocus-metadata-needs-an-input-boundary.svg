    <path d="M630 418C708 418 708 432 770 432" fill="none" stroke="#4ec4db" stroke-width="8" stroke-linecap="round"/>
    <path d="M622 510C700 510 711 494 770 494" fill="none" stroke="#5bdeaa" stroke-width="8" stroke-linecap="round"/>
    <path d="M593 575C686 575 696 554 770 554" fill="none" stroke="#f0b76f" stroke-width="8" stroke-linecap="round"/>
    <g fill="#10223e" stroke-width="3">
      <rect x="700" y="352" width="78" height="40" rx="14" stroke="#9f7de8"/>
      <rect x="713" y="412" width="65" height="40" rx="14" stroke="#4ec4db"/>
      <rect x="687" y="474" width="91" height="40" rx="14" stroke="#5bdeaa"/>
      <rect x="705" y="534" width="73" height="40" rx="14" stroke="#f0b76f"/>
    </g>
  </g>

  <rect x="798" y="115" width="22" height="670" rx="11" fill="#63e4dc" opacity="0.27" filter="url(#lineGlow)"/>
  <rect x="802" y="115" width="8" height="670" rx="4" fill="url(#boundary)"/>
  <g fill="#b8fff2">
