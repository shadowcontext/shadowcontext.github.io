    <circle cx="806" cy="418" r="12" opacity="0.92"/>
    <circle cx="806" cy="498" r="12" opacity="0.92"/>
    <circle cx="806" cy="558" r="12" opacity="0.92"/>
  </g>

  <g filter="url(#shadow)">
