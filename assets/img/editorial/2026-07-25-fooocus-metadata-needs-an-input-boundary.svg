<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Metadata stopped at an AI image workspace boundary</title>
  <desc id="desc">An abstract image tile carrying layered metadata shapes approaches a luminous security boundary protecting an isolated generative image workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.5" stop-color="#102443"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60e6d2" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#3977e8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#284a7a"/>
      <stop offset="1" stop-color="#142a4d"/>
    </linearGradient>
    <linearGradient id="imageField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7456d8"/>
      <stop offset="0.48" stop-color="#38a9c7"/>
      <stop offset="1" stop-color="#66d39d"/>
    </linearGradient>
    <linearGradient id="boundary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7fff1" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#79f3dc"/>
      <stop offset="0.82" stop-color="#62c9f5"/>
      <stop offset="1" stop-color="#b7fff1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="workspace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15365d" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0a1b32" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="lineGlow" x="-80%" y="-20%" width="260%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#020713" flood-opacity="0.68"/>
    </filter>
    <clipPath id="canvasClip">
      <rect x="994" y="219" width="402" height="462" rx="44"/>
    </clipPath>
    <pattern id="grain" width="96" height="96" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.2" fill="#b9d9ff" opacity="0.12"/>
      <circle cx="72" cy="37" r="1" fill="#b9d9ff" opacity="0.08"/>
      <circle cx="42" cy="81" r="1.4" fill="#b9d9ff" opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="850" cy="452" rx="625" ry="430" fill="url(#halo)"/>

  <g opacity="0.35" fill="none" stroke="#5075a7" stroke-width="2">
