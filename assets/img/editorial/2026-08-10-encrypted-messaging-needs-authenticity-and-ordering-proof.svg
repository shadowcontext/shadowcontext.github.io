<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Authenticity and ordering in encrypted messaging</title>
  <desc id="desc">Two abstract encrypted message streams cross a luminous identity gate while a protected chain of sequence markers preserves their order.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.52" stop-color="#132342"/>
      <stop offset="1" stop-color="#090e1d"/>
    </linearGradient>
    <radialGradient id="aura" cx="54%" cy="48%" r="58%">
      <stop offset="0" stop-color="#5f63ff" stop-opacity=".27"/>
      <stop offset=".48" stop-color="#22d6c9" stop-opacity=".1"/>
      <stop offset="1" stop-color="#081426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="messageA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263c73"/>
      <stop offset="1" stop-color="#17264b"/>
    </linearGradient>
    <linearGradient id="messageB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e61"/>
      <stop offset="1" stop-color="#15344d"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a69cff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#8e84ff"/>
      <stop offset="1" stop-color="#63f1df" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <path d="M0 720 C290 642 486 790 760 700 S1250 610 1600 714 V900 H0Z" fill="#0c1830" opacity=".75"/>
  <g opacity=".18" fill="none" stroke="#7590bd" stroke-width="2">
    <path d="M70 156 H430"/><path d="M112 190 H516"/><path d="M1150 164 H1518"/><path d="M1222 714 H1518"/>
    <circle cx="146" cy="710" r="54"/><circle cx="146" cy="710" r="82"/>
