    <circle cx="680" cy="650" r="13" fill="#777ff3"/>
    <circle cx="800" cy="690" r="15" fill="#73c8e3"/>
    <circle cx="916" cy="686" r="13" fill="#62dfd4"/>
    <circle cx="1018" cy="651" r="13" fill="#54e8d7"/>
