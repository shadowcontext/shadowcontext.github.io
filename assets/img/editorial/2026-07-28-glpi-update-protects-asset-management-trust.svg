<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected digital asset inventory</title>
  <desc id="desc">An abstract field of luminous blue inventory tiles is protected by layered teal and amber shields, representing security controls around an asset-management platform.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="60" x2="1490" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.5" stop-color="#0b2340"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(815 450) rotate(90) scale(420 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19c7c1" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#2188c9" stop-opacity=".09"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="590" y1="245" x2="1010" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53e3d5" stop-opacity=".92"/>
      <stop offset=".48" stop-color="#168f9d" stop-opacity=".78"/>
      <stop offset="1" stop-color="#0a4868" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="650" y1="295" x2="952" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123f63"/>
      <stop offset="1" stop-color="#081a30"/>
    </linearGradient>
    <linearGradient id="amber" x1="701" y1="355" x2="903" y2="574" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd37a"/>
      <stop offset="1" stop-color="#f2a83b"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4ecbe8" stop-opacity=".58"/>
      <stop offset="1" stop-color="#1d699c" stop-opacity=".18"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#7bdcef" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="465" rx="650" ry="420" fill="url(#aura)"/>
  <ellipse cx="800" cy="760" rx="510" ry="52" fill="#020811" opacity=".62" filter="url(#soft)"/>

  <g opacity=".72">
    <path d="M255 258C420 151 568 139 705 210" fill="none" stroke="#38b9d3" stroke-opacity=".26" stroke-width="3"/>
    <path d="M895 207C1044 140 1222 167 1352 281" fill="none" stroke="#38b9d3" stroke-opacity=".26" stroke-width="3"/>
    <path d="M269 645C434 735 568 745 687 694" fill="none" stroke="#38b9d3" stroke-opacity=".22" stroke-width="3"/>
    <path d="M916 694C1063 752 1217 718 1345 621" fill="none" stroke="#38b9d3" stroke-opacity=".22" stroke-width="3"/>
  </g>

  <g fill="url(#tile)" stroke="#72dff0" stroke-opacity=".42" stroke-width="2">
    <rect x="195" y="235" width="176" height="108" rx="20"/>
    <rect x="405" y="161" width="164" height="100" rx="20"/>
    <rect x="1032" y="161" width="164" height="100" rx="20"/>
    <rect x="1230" y="239" width="176" height="108" rx="20"/>
    <rect x="173" y="514" width="184" height="114" rx="20"/>
    <rect x="393" y="651" width="174" height="106" rx="20"/>
    <rect x="1033" y="651" width="174" height="106" rx="20"/>
    <rect x="1243" y="515" width="184" height="114" rx="20"/>
  </g>
  <g fill="#baf5fa" opacity=".58">
    <circle cx="231" cy="270" r="8"/><rect x="252" y="262" width="79" height="11" rx="5.5"/>
    <rect x="228" y="298" width="106" height="7" rx="3.5" opacity=".55"/>
    <circle cx="442" cy="196" r="8"/><rect x="463" y="188" width="67" height="11" rx="5.5"/>
    <circle cx="1069" cy="196" r="8"/><rect x="1090" y="188" width="67" height="11" rx="5.5"/>
    <circle cx="1267" cy="275" r="8"/><rect x="1288" y="267" width="79" height="11" rx="5.5"/>
    <circle cx="211" cy="551" r="8"/><rect x="232" y="543" width="81" height="11" rx="5.5"/>
    <circle cx="431" cy="687" r="8"/><rect x="452" y="679" width="74" height="11" rx="5.5"/>
    <circle cx="1071" cy="687" r="8"/><rect x="1092" y="679" width="74" height="11" rx="5.5"/>
    <circle cx="1281" cy="552" r="8"/><rect x="1302" y="544" width="81" height="11" rx="5.5"/>
  </g>

  <g fill="#55d9e8" filter="url(#glow)">
    <circle cx="371" cy="289" r="6"/><circle cx="569" cy="211" r="6"/>
    <circle cx="1032" cy="211" r="6"/><circle cx="1230" cy="293" r="6"/>
    <circle cx="357" cy="570" r="6"/><circle cx="567" cy="696" r="6"/>
    <circle cx="1033" cy="696" r="6"/><circle cx="1243" cy="571" r="6"/>
  </g>

  <path d="M800 180C909 244 1013 257 1058 267V444C1058 605 960 710 800 770C640 710 542 605 542 444V267C587 257 691 244 800 180Z" fill="url(#shield)" opacity=".88" filter="url(#glow)"/>
  <path d="M800 229C890 279 963 289 1004 299V442C1004 568 929 653 800 707C671 653 596 568 596 442V299C637 289 710 279 800 229Z" fill="url(#shieldInner)" stroke="#88f1e7" stroke-opacity=".65" stroke-width="4"/>

  <g transform="translate(704 344)">
    <rect x="0" y="72" width="192" height="154" rx="34" fill="#0a2137" stroke="url(#amber)" stroke-width="12"/>
    <path d="M49 78V55C49 -18 143-18 143 55V78" fill="none" stroke="url(#amber)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="96" cy="142" r="21" fill="#ffd27a" filter="url(#glow)"/>
    <path d="M96 158V188" stroke="#ffd27a" stroke-width="15" stroke-linecap="round"/>
  </g>

  <g fill="#efffff" opacity=".8">
    <circle cx="800" cy="128" r="5"/>
    <circle cx="1452" cy="413" r="4"/>
    <circle cx="127" cy="421" r="4"/>
    <circle cx="1126" cy="99" r="3"/>
    <circle cx="482" cy="802" r="3"/>
    <circle cx="1175" cy="804" r="3"/>
  </g>
</svg>
