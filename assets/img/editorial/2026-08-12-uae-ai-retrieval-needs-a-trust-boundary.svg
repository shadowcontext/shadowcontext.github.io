<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shielded AI retrieval boundary</title>
  <desc id="desc">Abstract document fragments pass through a luminous retrieval field toward an AI core protected by a layered shield, illustrating that retrieved content must remain untrusted.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.52" stop-color="#102d38"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <radialGradient id="aura" cx="66%" cy="48%" r="48%">
      <stop offset="0" stop-color="#55e6c1" stop-opacity=".30"/>
      <stop offset="0.52" stop-color="#21a9b8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#071521" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6b86b"/>
      <stop offset="0.48" stop-color="#62d9c2"/>
      <stop offset="1" stop-color="#8ae5ff"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4fff0" stop-opacity=".80"/>
      <stop offset="0.5" stop-color="#42cfc0" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4d7fd6" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d7a4"/>
      <stop offset="1" stop-color="#b98257"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>

  <g opacity=".16" fill="none" stroke="#83dccc">
    <path d="M70 172 C390 72 650 90 898 206 S1330 315 1550 202"/>
    <path d="M40 726 C324 634 572 654 824 735 S1292 802 1570 690"/>
