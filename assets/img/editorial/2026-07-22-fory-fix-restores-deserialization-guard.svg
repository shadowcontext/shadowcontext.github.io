    <path d="M640 481 C727 473 774 467 833 478 C906 492 950 475 1008 450" fill="none" stroke="#4fbfd1" stroke-width="22" stroke-linecap="round"/>
    <path d="M640 538 C716 542 778 532 837 520 C906 506 958 511 1010 532" fill="none" stroke="#358dac" stroke-width="15" stroke-linecap="round"/>
  </g>
  <g fill="url(#gate)">
