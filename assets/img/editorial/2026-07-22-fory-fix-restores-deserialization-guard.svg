    <rect x="632" y="500" width="50" height="190" rx="24"/>
    <rect x="918" y="210" width="50" height="190" rx="24"/>
    <rect x="918" y="500" width="50" height="190" rx="24"/>
  </g>
  <g opacity=".5" fill="#b8f4eb">
