<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Deserialization stream passing through a security guard</title>
  <desc id="desc">Abstract blue data ribbons cross a segmented security gate while an amber fragment is diverted away from the trusted path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.56" stop-color="#0b2540"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#2aa9c9" stop-opacity=".3"/>
      <stop offset=".55" stop-color="#16749b" stop-opacity=".1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#163b61"/>
      <stop offset=".45" stop-color="#2ec4d6"/>
      <stop offset="1" stop-color="#78e0dc"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe5e0"/>
      <stop offset=".5" stop-color="#2d9ebc"/>
      <stop offset="1" stop-color="#154a70"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd06a"/>
      <stop offset="1" stop-color="#e77732"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="window">
      <rect x="674" y="268" width="252" height="364" rx="72"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="440" rx="650" ry="410" fill="url(#halo)"/>
  <g opacity=".2" fill="none" stroke="#75cbd6" stroke-width="2">
    <path d="M80 165 C330 96 497 206 642 136"/>
    <path d="M1010 730 C1190 646 1375 768 1550 675"/>
    <path d="M165 754 C342 680 445 781 580 720"/>
