  <path d="M937 526 C1071 525 1156 550 1254 576 C1360 603 1481 579 1640 529" fill="none" stroke="#3589aa" stroke-width="15" stroke-linecap="round"/>
  <path d="M730 478 C680 506 666 556 702 590 C746 631 814 644 839 705" fill="none" stroke="#ffae4d" stroke-opacity=".3" stroke-width="48" filter="url(#glow)"/>
  <path d="M730 478 C681 507 671 553 706 585 C750 625 813 641 841 705" fill="none" stroke="url(#amber)" stroke-width="17" stroke-linecap="round"/>
  <g transform="translate(842 712) rotate(18)">
