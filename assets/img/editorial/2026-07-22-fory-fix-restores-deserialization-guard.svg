    <circle cx="1101" cy="700" r="5"/><circle cx="1305" cy="711" r="4"/><circle cx="1492" cy="690" r="6"/>
  </g>
  <path d="M-90 354 C142 282 294 312 464 394 C575 448 643 452 730 428" fill="none" stroke="#2bb7cc" stroke-opacity=".15" stroke-width="92" filter="url(#soft)"/>
  <path d="M-60 352 C156 286 300 319 462 397 C573 451 651 453 738 426" fill="none" stroke="url(#ribbon)" stroke-width="34" stroke-linecap="round"/>
  <path d="M-38 465 C164 407 292 422 454 478 C564 516 645 513 738 478" fill="none" stroke="url(#ribbon)" stroke-opacity=".82" stroke-width="22" stroke-linecap="round"/>
  <path d="M-20 559 C164 520 323 532 466 568 C574 595 654 577 738 529" fill="none" stroke="url(#ribbon)" stroke-opacity=".62" stroke-width="15" stroke-linecap="round"/>
  <rect x="650" y="196" width="300" height="508" rx="104" fill="#113955" stroke="#3ca9bf" stroke-opacity=".55" stroke-width="3"/>
  <rect x="674" y="268" width="252" height="364" rx="72" fill="#071b2f"/>
  <g clip-path="url(#window)">
