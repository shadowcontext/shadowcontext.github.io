<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Publish-time package inspection gate</title>
  <desc id="desc">Abstract software packages pass through a luminous cyan inspection gate, while one amber dual-use package follows a separately verified path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.52" stop-color="#102a3a"/>
      <stop offset="1" stop-color="#08131d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="52%">
      <stop offset="0" stop-color="#5ee7e8" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#1b7890" stop-opacity=".09"/>
      <stop offset="1" stop-color="#07131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32a9ba"/>
      <stop offset=".48" stop-color="#b8ffff"/>
      <stop offset="1" stop-color="#267b98"/>
    </linearGradient>
    <linearGradient id="packageBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8f4f0"/>
      <stop offset=".35" stop-color="#45bdca"/>
      <stop offset="1" stop-color="#16617e"/>
    </linearGradient>
    <linearGradient id="packageAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd99a"/>
      <stop offset=".42" stop-color="#eea84e"/>
      <stop offset="1" stop-color="#9d562c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55dce1" stop-opacity=".2"/>
      <stop offset="1" stop-color="#55dce1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="9" r="1" fill="#d5ffff" opacity=".08"/>
      <circle cx="37" cy="31" r=".8" fill="#d5ffff" opacity=".05"/>
      <circle cx="18" cy="48" r=".7" fill="#d5ffff" opacity=".06"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#02070c" flood-opacity=".65"/>
    </filter>
    <clipPath id="aperture">
      <rect x="685" y="206" width="230" height="450" rx="115"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <path d="M70 735 C330 610 480 632 663 549" fill="none" stroke="#55dce1" stroke-opacity=".12" stroke-width="3"/>
  <path d="M1530 740 C1265 626 1112 639 934 548" fill="none" stroke="#55dce1" stroke-opacity=".12" stroke-width="3"/>
  <path d="M163 773 C414 679 543 686 689 595" fill="none" stroke="#3d9db2" stroke-opacity=".08" stroke-width="22"/>
  <path d="M1438 772 C1192 682 1067 680 912 595" fill="none" stroke="#3d9db2" stroke-opacity=".08" stroke-width="22"/>

  <ellipse cx="800" cy="722" rx="482" ry="93" fill="url(#floor)"/>
  <ellipse cx="800" cy="730" rx="314" ry="45" fill="#5ee7e8" opacity=".08" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <path d="M800 119 C927 119 1029 222 1029 349 V584 C1029 655 972 712 901 712 H699 C628 712 571 655 571 584 V349 C571 222 673 119 800 119Z"
          fill="#0b2030" stroke="#2c7186" stroke-width="3"/>
    <path d="M800 161 C899 161 979 241 979 340 V582 C979 628 942 665 896 665 H704 C658 665 621 628 621 582 V340 C621 241 701 161 800 161Z"
          fill="#07121d" stroke="#1f4a5f" stroke-width="2"/>
    <rect x="674" y="194" width="252" height="474" rx="126" fill="url(#gate)" opacity=".3" filter="url(#glow)"/>
    <rect x="690" y="210" width="220" height="442" rx="110" fill="#06131d" stroke="#98ffff" stroke-width="5"/>
  </g>

  <g clip-path="url(#aperture)">
    <path d="M716 281 H884 M704 337 H896 M699 393 H901 M699 449 H901 M704 505 H896 M716 561 H884"
          stroke="#77f3ee" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <path d="M740 236 V626 M800 220 V642 M860 236 V626"
          stroke="#45cbd0" stroke-width="2" stroke-dasharray="4 16" opacity=".42"/>
    <ellipse cx="800" cy="432" rx="104" ry="53" fill="#8efff9" opacity=".12" filter="url(#glow)"/>
  </g>

  <g opacity=".46">
    <circle cx="635" cy="269" r="5" fill="#7ff6f0"/>
    <circle cx="960" cy="326" r="4" fill="#7ff6f0"/>
    <circle cx="624" cy="522" r="4" fill="#7ff6f0"/>
    <circle cx="981" cy="535" r="5" fill="#7ff6f0"/>
    <path d="M635 269 H684 M916 326 H960 M624 522 H684 M916 535 H981" stroke="#62dfe1" stroke-width="2"/>
  </g>

  <g transform="translate(218 530) rotate(-8)" filter="url(#shadow)">
    <path d="M0 48 94 0l104 45-95 51Z" fill="#9ef2ef"/>
    <path d="M0 48v114l103 55V96Z" fill="#297f94"/>
    <path d="M103 96v121l95-58V45Z" fill="url(#packageBlue)"/>
    <path d="M68 35l101 47" stroke="#e0ffff" stroke-width="6" opacity=".6"/>
  </g>
  <g transform="translate(440 402) rotate(7) scale(.72)" filter="url(#shadow)" opacity=".82">
    <path d="M0 48 94 0l104 45-95 51Z" fill="#8de6e4"/>
    <path d="M0 48v114l103 55V96Z" fill="#256f85"/>
    <path d="M103 96v121l95-58V45Z" fill="url(#packageBlue)"/>
  </g>
  <g transform="translate(1127 530) rotate(8)" filter="url(#shadow)">
    <path d="M0 45 90 0l99 43-91 49Z" fill="#b6f7f1"/>
    <path d="M0 45v109l98 52V92Z" fill="#348da0"/>
    <path d="M98 92v114l91-55V43Z" fill="url(#packageBlue)"/>
    <path d="M31 68l68 35 61-36" fill="none" stroke="#d7ffff" stroke-width="5" opacity=".55"/>
  </g>

  <path d="M361 620 C495 593 574 533 681 467" fill="none" stroke="#8ffcf5" stroke-width="6" stroke-linecap="round" opacity=".52" filter="url(#glow)"/>
  <path d="M917 467 C1023 536 1105 597 1239 620" fill="none" stroke="#8ffcf5" stroke-width="6" stroke-linecap="round" opacity=".52" filter="url(#glow)"/>

  <g transform="translate(1105 244) rotate(10)" filter="url(#shadow)">
    <path d="M0 44 86 0l94 41-87 47Z" fill="#ffe1a9"/>
    <path d="M0 44v102l93 50V88Z" fill="#a96331"/>
    <path d="M93 88v108l87-53V41Z" fill="url(#packageAmber)"/>
    <path d="M34 29l94 44" stroke="#fff0cc" stroke-width="5" opacity=".72"/>
  </g>
  <path d="M1185 443 C1110 454 1030 441 916 402" fill="none" stroke="#f2b45f" stroke-width="5" stroke-linecap="round" opacity=".72" filter="url(#glow)"/>
  <circle cx="1059" cy="438" r="10" fill="#ffc36c" opacity=".8"/>
  <circle cx="1059" cy="438" r="22" fill="none" stroke="#ffc36c" stroke-width="2" opacity=".4"/>

  <g transform="translate(800 431)" filter="url(#glow)">
    <circle r="62" fill="#0b2632" stroke="#a8fffa" stroke-width="4"/>
    <path d="M-27 1 -8 22 32-25" fill="none" stroke="#c8fffb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M523 188 C626 86 974 86 1077 188" fill="none" stroke="#55dce1" stroke-width="2" stroke-dasharray="2 18" stroke-linecap="round" opacity=".35"/>
  <path d="M474 232 C607 69 993 69 1126 232" fill="none" stroke="#55dce1" stroke-width="2" stroke-dasharray="2 22" stroke-linecap="round" opacity=".18"/>
</svg>
