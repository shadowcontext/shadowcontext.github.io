<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cross-channel phishing meets a guarded transaction checkpoint</title>
  <desc id="desc">Abstract editorial artwork showing email, phone, text, and social-message paths converging on a shielded approval gate before reaching a payment token.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1500" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A2C"/>
      <stop offset="0.5" stop-color="#102B45"/>
      <stop offset="1" stop-color="#08131F"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(1030 450) rotate(90) scale(390 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D6C2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#36D6C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="280" y1="150" x2="1050" y2="475" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB869" stop-opacity=".8"/>
      <stop offset=".68" stop-color="#C789FF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#52E6D2"/>
    </linearGradient>
    <linearGradient id="shield" x1="918" y1="286" x2="1136" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CFFF0"/>
      <stop offset=".52" stop-color="#28CBB8"/>
      <stop offset="1" stop-color="#087F82"/>
    </linearGradient>
    <linearGradient id="coin" x1="1270" y1="374" x2="1435" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE092"/>
      <stop offset="1" stop-color="#F39C52"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000A12" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="16" r="1" fill="#CBE8FF" opacity=".07"/>
      <circle cx="45" cy="7" r="1.2" fill="#CBE8FF" opacity=".05"/>
      <circle cx="31" cy="48" r=".8" fill="#CBE8FF" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grain)"/>
  <ellipse cx="1030" cy="450" rx="460" ry="390" fill="url(#aura)"/>

  <g opacity=".2" fill="none" stroke="#8EDDD6">
