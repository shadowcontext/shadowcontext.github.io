    <path d="M1031 297L1134 338V429C1134 508 1095 567 1031 606C967 567 928 508 928 429V338L1031 297Z" fill="url(#shield)" opacity=".18"/>
    <path d="M974 447L1012 485L1092 392" fill="none" stroke="#DFFFF9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1031" cy="450" r="183" fill="none" stroke="#65EAD7" stroke-width="3" stroke-dasharray="8 20" opacity=".42"/>
