    <circle cx="1000" cy="286" r="8"/>
    <circle cx="624" cy="650" r="8"/>
    <circle cx="988" cy="650" r="8"/>
  </g>

  <path d="M800 182C939 182 1052 295 1052 434v72c0 151-101 282-252 342-151-60-252-191-252-342v-72c0-139 113-252 252-252Z" fill="#092936" stroke="#49e2da" stroke-width="8" stroke-opacity="0.7"/>
  <path d="M800 232C910 232 999 321 999 431v65c0 118-77 221-199 275-122-54-199-157-199-275v-65c0-110 89-199 199-199Z" fill="none" stroke="#22bdb9" stroke-width="5" stroke-dasharray="20 16" opacity="0.65"/>

