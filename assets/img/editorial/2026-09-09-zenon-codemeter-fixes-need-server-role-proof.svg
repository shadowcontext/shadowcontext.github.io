  <path d="M800 482v36" stroke="#0a3440" stroke-width="12" stroke-linecap="round"/>

  <path d="M76 470H462c44 0 70 12 103 42l54 49" fill="none" stroke="url(#amber)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="112" cy="470" r="20" fill="#ffad52" opacity="0.78"/>
  <circle cx="202" cy="470" r="11" fill="#ffbd66" opacity="0.62"/>
  <path d="M600 520l70-70" stroke="#ffbf68" stroke-width="10" stroke-linecap="round" opacity="0.78"/>

  <g transform="translate(622 398)">
