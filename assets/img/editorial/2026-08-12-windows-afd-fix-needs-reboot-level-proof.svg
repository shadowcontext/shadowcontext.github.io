<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified repair across an endpoint network</title>
  <desc id="desc">Abstract blue endpoint grid crossing a repaired amber network seam, with concentric verification rings confirming protected systems.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="70" x2="1470" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182D"/>
      <stop offset="0.54" stop-color="#0B3151"/>
      <stop offset="1" stop-color="#10233C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(810 454) rotate(90) scale(382 590)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42D8E7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#42D8E7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seam" x1="412" y1="721" x2="1168" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F19B36"/>
      <stop offset="0.47" stop-color="#FFD47A"/>
      <stop offset="1" stop-color="#F19B36"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="mesh" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#70CFE0" stroke-opacity="0.08" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#7CE8F1" fill-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <rect x="44" y="44" width="1512" height="812" rx="28" fill="url(#mesh)"/>
  <ellipse cx="810" cy="454" rx="590" ry="382" fill="url(#halo)"/>

  <g fill="none" stroke="#85E6EF" stroke-linecap="round">
    <path d="M180 218C378 190 501 291 645 348C790 405 920 363 1074 269C1204 190 1328 206 1442 244" stroke-opacity="0.2" stroke-width="3"/>
