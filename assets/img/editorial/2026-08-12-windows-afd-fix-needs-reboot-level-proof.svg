    <circle cx="163" cy="650" r="9"/><circle cx="341" cy="678" r="11"/><circle cx="518" cy="610" r="8"/>
    <circle cx="1092" cy="630" r="8"/><circle cx="1260" cy="684" r="11"/><circle cx="1451" cy="646" r="9"/>
