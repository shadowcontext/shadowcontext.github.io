    <circle cx="0" cy="0" r="37" fill="#0a202b" stroke="#76e8dc" stroke-width="7"/>
    <path d="M-16 0H16" stroke="#f4ae5e" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M514 682C660 782 922 806 1091 683" fill="none" stroke="#4ab9c3" stroke-width="4" stroke-dasharray="13 18" opacity="0.58"/>
</svg>
