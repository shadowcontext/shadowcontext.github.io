  <path d="M1175 395C1285 350 1358 312 1522 312" fill="none" stroke="url(#cyanLine)" stroke-width="10" stroke-linecap="round"/>
  <g fill="#8af6e5" filter="url(#glow)">
    <circle cx="82" cy="330" r="12"/><circle cx="1522" cy="312" r="12"/>
  </g>
  <g fill="#0b2733" stroke="#59c8cf" stroke-width="6">
    <circle cx="82" cy="330" r="28"/><circle cx="1522" cy="312" r="28"/>
  </g>
  <g fill="#9affea">
    <circle cx="82" cy="330" r="8"/><circle cx="1522" cy="312" r="8"/>
  </g>
  <path d="M1508 662C1361 650 1269 605 1172 536" fill="none" stroke="#f3a75a" stroke-width="11" stroke-linecap="round"/>
