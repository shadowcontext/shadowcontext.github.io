<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cookie tokens contained by public-suffix boundaries</title>
  <desc id="desc">Polished abstract editorial artwork with luminous cookie-like tokens, layered domain arcs, and a protective boundary in teal and amber.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071822"/>
      <stop offset="0.52" stop-color="#0b2630"/>
      <stop offset="1" stop-color="#102b32"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="56%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".24"/>
      <stop offset=".62" stop-color="#0ea5a0" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071822" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".18"/>
      <stop offset=".46" stop-color="#5eead4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity=".3"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#02090d" flood-opacity=".65"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8be8dc" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="450" rx="650" ry="390" fill="url(#glow)"/>
  <circle cx="1238" cy="160" r="120" fill="#f59e0b" opacity=".06" filter="url(#blur)"/>
  <circle cx="280" cy="730" r="150" fill="#14b8a6" opacity=".09" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M178 617C382 226 690 118 997 214c191 60 343 194 434 372" stroke="#5eead4" stroke-opacity=".12" stroke-width="2"/>
    <path d="M246 650C431 332 687 230 942 290c185 44 326 159 409 309" stroke="url(#arc)" stroke-width="8"/>
    <path d="M340 681C493 432 690 357 887 391c146 25 257 107 329 216" stroke="#8be8dc" stroke-opacity=".38" stroke-width="3"/>
    <path d="M437 704C555 529 699 479 842 496c99 12 186 57 252 124" stroke="#5eead4" stroke-opacity=".17" stroke-width="2"/>
  </g>

  <g opacity=".65">
    <circle cx="246" cy="650" r="7" fill="#5eead4"/>
    <circle cx="1351" cy="599" r="7" fill="#fbbf24"/>
    <circle cx="942" cy="290" r="5" fill="#ccfbf1"/>
    <circle cx="437" cy="704" r="5" fill="#5eead4"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M800 244c105 74 211 92 292 98v151c0 151-102 254-292 326-190-72-292-175-292-326V342c81-6 187-24 292-98Z" fill="#082d34" stroke="url(#shield)" stroke-width="7"/>
    <path d="M800 287c83 54 165 73 244 82v120c0 120-76 209-244 276-168-67-244-156-244-276V369c79-9 161-28 244-82Z" fill="#0d3a40" fill-opacity=".76" stroke="#5eead4" stroke-opacity=".2" stroke-width="2"/>
  </g>

  <g transform="translate(800 505)" filter="url(#shadow)">
    <circle r="122" fill="#f6b941"/>
    <circle r="106" fill="#eaa52e"/>
    <path d="M72-84a45 45 0 0 0 50 48A122 122 0 0 1 85 76 53 53 0 0 0 40 116 122 122 0 0 1-102 66 51 51 0 0 0-92-11 122 122 0 0 1-48-105 49 49 0 0 0 18-99 122 122 0 0 1 72-84Z" fill="#f7c45d" opacity=".55"/>
    <g fill="#7c4a22" opacity=".9">
      <circle cx="-43" cy="-44" r="13"/><circle cx="35" cy="-59" r="10"/>
      <circle cx="-61" cy="27" r="9"/><circle cx="15" cy="18" r="14"/>
      <circle cx="56" cy="58" r="8"/><circle cx="-19" cy="70" r="7"/>
    </g>
  </g>

  <g fill="#d8fffa">
    <circle cx="386" cy="392" r="13" opacity=".75"/>
    <circle cx="1219" cy="409" r="11" opacity=".5"/>
    <circle cx="310" cy="520" r="7" opacity=".35"/>
    <circle cx="1300" cy="520" r="8" opacity=".35"/>
  </g>
  <g stroke="#8be8dc" stroke-opacity=".2" stroke-width="2">
    <path d="M386 392l132 45"/><path d="M1082 441l137-32"/>
    <path d="M310 520l178 7"/><path d="M1114 529l186-9"/>
  </g>
  <path d="M1180 708c78-54 145-67 221-58" fill="none" stroke="#fbbf24" stroke-opacity=".2" stroke-width="14" stroke-linecap="round" filter="url(#soft)"/>
</svg>
