<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">URL normalization protecting an outbound network boundary</title>
  <desc id="desc">Abstract editorial image of a distorted URL path being normalized through a luminous gateway before reaching a protected network sphere.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081224"/>
      <stop offset="0.55" stop-color="#102849"/>
      <stop offset="1" stop-color="#081a31"/>
    </linearGradient>
    <radialGradient id="aura" cx="79%" cy="48%" r="46%">
      <stop offset="0" stop-color="#58e6d6" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#2585b4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#081224" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f61"/>
      <stop offset="0.46" stop-color="#ffc85c"/>
      <stop offset="0.68" stop-color="#91f0d7"/>
      <stop offset="1" stop-color="#49cfe0"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9fff7"/>
      <stop offset="0.5" stop-color="#56dfd2"/>
      <stop offset="1" stop-color="#1a7fa8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="sphereClip"><circle cx="1270" cy="450" r="214"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <path d="M0 745 C310 645 590 785 880 664 S1330 555 1600 620 L1600 900 L0 900 Z" fill="#050d1b" opacity="0.7"/>
  <path d="M0 183 C310 275 503 126 760 205 S1234 306 1600 171" fill="none" stroke="#82dfdf" stroke-width="2" stroke-opacity="0.08"/>

  <g opacity="0.8">
    <circle cx="164" cy="315" r="68" fill="#132c49" stroke="#805461" stroke-width="2"/>
    <circle cx="318" cy="601" r="48" fill="#132b47" stroke="#6d7085" stroke-width="2"/>
    <circle cx="390" cy="237" r="38" fill="#122a45" stroke="#6684a0" stroke-width="2"/>
    <path d="M204 369 L281 519 M225 309 L351 251 M356 565 L447 504" fill="none" stroke="#678198" stroke-width="3" stroke-dasharray="8 14"/>
    <g fill="#ff7867">
      <circle cx="164" cy="315" r="11"/><circle cx="318" cy="601" r="8"/><circle cx="390" cy="237" r="7"/>
    </g>
  </g>

  <path d="M87 471 C220 332 313 618 450 452 S650 322 766 451" fill="none" stroke="#f36f64" stroke-width="76" stroke-linecap="round" opacity="0.1" filter="url(#soft)"/>
  <path d="M87 471 C220 332 313 618 450 452 S650 322 766 451" fill="none" stroke="url(#path)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#08162a" stroke="#ff9a69" stroke-width="3">
    <path d="M152 408 l33-22 35 20-2 41-35 20-33-20z"/>
    <path d="M312 483 l31-19 32 18-1 38-32 19-31-18z"/>
    <path d="M467 394 l30-18 31 18v36l-31 18-30-18z"/>
