    <path d="M755 211 L862 268 L862 632 L755 689 L722 649 L722 251 Z" fill="url(#gate)" opacity="0.18"/>
    <path d="M755 211 L862 268 L862 632 L755 689" fill="none" stroke="#9affeb" stroke-width="7" filter="url(#glow)"/>
    <circle cx="783" cy="450" r="31" fill="#d9fff7" opacity="0.16"/>
    <circle cx="783" cy="450" r="10" fill="#dcfff8" filter="url(#glow)"/>
  </g>

  <path d="M820 450 C954 450 1004 450 1070 450" fill="none" stroke="#6ee4d9" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M1008 419 L1072 450 L1008 481" fill="none" stroke="#baffef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="1270" cy="450" r="247" fill="#2fc2c6" opacity="0.09" filter="url(#soft)"/>
  <circle cx="1270" cy="450" r="214" fill="#0a2744" stroke="#77ebdf" stroke-width="5"/>
