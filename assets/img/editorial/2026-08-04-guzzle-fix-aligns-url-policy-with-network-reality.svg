    <ellipse cx="1270" cy="450" rx="91" ry="183" fill="none" stroke="#a3fff0" stroke-width="3" stroke-opacity="0.48"/>
    <ellipse cx="1270" cy="450" rx="176" ry="78" fill="none" stroke="#a3fff0" stroke-width="3" stroke-opacity="0.43"/>
    <path d="M1088 450 H1452 M1270 265 V635" stroke="#a3fff0" stroke-width="3" stroke-opacity="0.38"/>
  </g>
  <circle cx="1270" cy="450" r="150" fill="none" stroke="#ddfff8" stroke-width="3" stroke-dasharray="9 15" opacity="0.65"/>
  <path d="M1194 454 L1247 506 L1351 384" fill="none" stroke="#dffff7" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <g fill="#8cece1" opacity="0.38">
