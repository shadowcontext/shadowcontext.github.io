<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Email streams protected at a layered security gateway</title>
  <desc id="desc">Abstract email streams pass through a layered blue gateway while an amber shield contains a distorted message fragment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.55" stop-color="#0b2941"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28a9d8" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#67d8f3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1676a4" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f08a36"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ee8ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#1786b3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="gatewayClip">
      <path d="M665 130 C780 92 925 106 1010 174 L985 735 C890 790 746 790 650 734 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="840" cy="448" r="360" fill="url(#core)" filter="url(#glow)"/>
  <path d="M0 700 C280 620 420 770 650 704 S1080 552 1600 692 V900 H0Z" fill="#0c2135" opacity="0.86"/>
  <path d="M0 238 C300 170 430 260 628 314" fill="none" stroke="#164a68" stroke-width="2"/>
  <path d="M1017 252 C1210 166 1390 192 1600 126" fill="none" stroke="#164a68" stroke-width="2"/>

