<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nearby radio traffic meeting a protected parser boundary</title>
  <desc id="desc">Abstract teal radio waves and data fragments approach a luminous guarded boundary surrounding a protected endpoint, illustrating Bluetooth input containment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071621"/>
      <stop offset="0.55" stop-color="#0b2730"/>
      <stop offset="1" stop-color="#10283d"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="48%" r="42%">
      <stop offset="0" stop-color="#38e0c1" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#2ba9b6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071621" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66f0d1"/>
      <stop offset="1" stop-color="#279ab5"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efb85b"/>
      <stop offset="1" stop-color="#ed765f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020a0f" flood-opacity=".7"/>
    </filter>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#b8fff1" opacity=".06"/>
      <circle cx="28" cy="32" r="1" fill="#b8fff1" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g fill="none" stroke="#3ccbb9" stroke-linecap="round">
    <path d="M160 620 C330 425 500 425 670 620" stroke-width="10" opacity=".16"/>
    <path d="M225 620 C360 480 470 480 605 620" stroke-width="12" opacity=".27"/>
    <path d="M300 620 C385 535 445 535 530 620" stroke-width="15" opacity=".5"/>
  </g>
  <circle cx="415" cy="635" r="22" fill="#62e5ca"/>
  <circle cx="415" cy="635" r="62" fill="#43d5bd" opacity=".12" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <path d="M923 154 C1035 210 1154 225 1285 232 L1285 478 C1285 652 1165 748 1027 797 C889 748 769 652 769 478 L769 232 C900 225 1019 210 1131 154 Z" fill="#0b2632" stroke="url(#shield)" stroke-width="9"/>
    <path d="M944 225 C1029 258 1115 270 1212 278 L1212 472 C1212 590 1136 662 1027 708 C918 662 842 590 842 472 L842 278 C939 270 1025 258 1110 225" fill="none" stroke="#6cebd4" stroke-width="4" opacity=".4"/>
    <rect x="924" y="362" width="206" height="226" rx="32" fill="#102e3a" stroke="#5be2c9" stroke-width="5"/>
    <path d="M970 362 V324 C970 248 1084 248 1084 324 V362" fill="none" stroke="#5be2c9" stroke-width="22" stroke-linecap="round"/>
    <circle cx="1027" cy="458" r="25" fill="#67efd2"/>
    <path d="M1027 481 V529" stroke="#67efd2" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g fill="url(#packet)">
    <rect x="524" y="336" width="58" height="20" rx="10" transform="rotate(8 553 346)"/>
    <rect x="600" y="391" width="80" height="22" rx="11" transform="rotate(-7 640 402)" opacity=".9"/>
    <rect x="548" y="478" width="48" height="18" rx="9" transform="rotate(13 572 487)" opacity=".72"/>
    <rect x="640" y="544" width="70" height="20" rx="10" transform="rotate(-4 675 554)" opacity=".84"/>
  </g>
  <g fill="#f2c66f" opacity=".82">
    <circle cx="694" cy="350" r="8"/>
    <circle cx="718" cy="434" r="12"/>
    <circle cx="691" cy="503" r="7"/>
    <circle cx="741" cy="581" r="9"/>
  </g>
  <path d="M728 286 C700 390 704 498 748 612" fill="none" stroke="#69efd3" stroke-width="7" stroke-linecap="round" opacity=".76"/>
  <path d="M748 286 C720 390 724 498 768 612" fill="none" stroke="#123c48" stroke-width="22" stroke-linecap="round" opacity=".88"/>
  <path d="M749 286 C721 390 725 498 769 612" fill="none" stroke="#5ce4ce" stroke-width="5" stroke-linecap="round" opacity=".9"/>

  <g opacity=".25" fill="none" stroke="#77e8d2" stroke-width="3">
    <circle cx="1380" cy="202" r="72"/>
    <circle cx="1380" cy="202" r="105"/>
    <path d="M1348 202 H1412 M1380 170 V234"/>
  </g>
  <ellipse cx="1028" cy="812" rx="330" ry="36" fill="#020a0f" opacity=".5" filter="url(#soft)"/>
</svg>
