<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected DNS control plane</title>
  <desc id="desc">Abstract editorial artwork of luminous routing paths held inside layered authorization rings, with a verified baseline anchoring the DNS control plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset=".52" stop-color="#112b3a"/>
      <stop offset="1" stop-color="#07101a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#58e4cf" stop-opacity=".28"/>
      <stop offset=".56" stop-color="#237d99" stop-opacity=".12"/>
      <stop offset="1" stop-color="#07131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fff6"/>
      <stop offset=".42" stop-color="#64e7d0"/>
      <stop offset="1" stop-color="#2382a0"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ce5d2"/>
      <stop offset=".55" stop-color="#d8fff5"/>
      <stop offset="1" stop-color="#f5bd72"/>
    </linearGradient>
    <linearGradient id="anchor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a0"/>
      <stop offset="1" stop-color="#e97862"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <pattern id="stars" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="22" r="1" fill="#d8fff5" opacity=".09"/>
      <circle cx="62" cy="47" r=".9" fill="#d8fff5" opacity=".08"/>
      <circle cx="35" cy="70" r="1.2" fill="#d8fff5" opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#stars)"/>
  <ellipse cx="800" cy="438" rx="650" ry="430" fill="url(#halo)"/>
  <ellipse cx="800" cy="782" rx="520" ry="60" fill="#02070c" opacity=".7" filter="url(#soft)"/>

  <g fill="none" stroke="#294c5d" stroke-width="3" opacity=".72">
    <path d="M104 214 C284 86 454 108 574 240"/>
    <path d="M1496 214 C1316 86 1146 108 1026 240"/>
    <path d="M104 674 C284 802 454 780 574 648"/>
    <path d="M1496 674 C1316 802 1146 780 1026 648"/>
  </g>

  <g fill="#183648" stroke="#3d6878" stroke-width="3">
    <circle cx="222" cy="228" r="42"/>
    <circle cx="150" cy="444" r="54"/>
    <circle cx="244" cy="670" r="38"/>
    <circle cx="1378" cy="228" r="42"/>
    <circle cx="1450" cy="444" r="54"/>
    <circle cx="1356" cy="670" r="38"/>
  </g>
  <g fill="#70dfce" opacity=".72">
    <circle cx="222" cy="228" r="9"/>
    <circle cx="150" cy="444" r="11"/>
    <circle cx="244" cy="670" r="8"/>
    <circle cx="1378" cy="228" r="9"/>
    <circle cx="1450" cy="444" r="11"/>
    <circle cx="1356" cy="670" r="8"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M264 228 C416 228 430 350 555 350" stroke="#07121b" stroke-width="28"/>
    <path d="M264 228 C416 228 430 350 555 350" stroke="url(#route)" stroke-width="8" opacity=".84"/>
    <path d="M204 444 H532" stroke="#07121b" stroke-width="28"/>
    <path d="M204 444 H532" stroke="url(#route)" stroke-width="8" opacity=".88"/>
    <path d="M282 670 C420 670 437 538 555 538" stroke="#07121b" stroke-width="28"/>
    <path d="M282 670 C420 670 437 538 555 538" stroke="url(#route)" stroke-width="8" opacity=".84"/>
    <path d="M1336 228 C1184 228 1170 350 1045 350" stroke="#07121b" stroke-width="28"/>
    <path d="M1336 228 C1184 228 1170 350 1045 350" stroke="url(#route)" stroke-width="8" opacity=".84"/>
    <path d="M1396 444 H1068" stroke="#07121b" stroke-width="28"/>
    <path d="M1396 444 H1068" stroke="url(#route)" stroke-width="8" opacity=".88"/>
    <path d="M1318 670 C1180 670 1163 538 1045 538" stroke="#07121b" stroke-width="28"/>
    <path d="M1318 670 C1180 670 1163 538 1045 538" stroke="url(#route)" stroke-width="8" opacity=".84"/>
  </g>

  <g transform="translate(800 444)">
    <circle r="294" fill="#0a1c28" stroke="#34596b" stroke-width="4"/>
    <circle r="246" fill="none" stroke="url(#ring)" stroke-width="14" opacity=".9" filter="url(#glow)"/>
    <circle r="208" fill="none" stroke="#75e6d3" stroke-width="3" stroke-dasharray="5 17" opacity=".58"/>
    <circle r="158" fill="#102d3d" stroke="#487184" stroke-width="4"/>

    <g fill="none" stroke="#cffff4" stroke-width="10" stroke-linecap="round" opacity=".9">
      <path d="M-102 -58 C-48 -112 42 -112 100 -58"/>
      <path d="M-116 0 C-52 -48 50 -48 116 0"/>
      <path d="M-102 58 C-44 10 44 10 102 58"/>
    </g>
    <g fill="#effffb" filter="url(#glow)">
      <circle cx="-102" cy="-58" r="10"/>
      <circle cx="100" cy="-58" r="10"/>
      <circle cx="-116" cy="0" r="10"/>
      <circle cx="116" cy="0" r="10"/>
      <circle cx="-102" cy="58" r="10"/>
      <circle cx="102" cy="58" r="10"/>
      <circle cx="0" cy="-86" r="12"/>
      <circle cx="0" cy="86" r="12"/>
    </g>

    <g transform="translate(0 270)">
      <path d="M-58 -26 H58 L78 0 L58 26 H-58 L-78 0 Z" fill="url(#anchor)" filter="url(#glow)"/>
      <path d="M-24 0 L-7 17 L28 -19" fill="none" stroke="#fff8dc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g fill="#f4c77b" opacity=".8">
    <circle cx="800" cy="150" r="6"/>
    <circle cx="554" cy="444" r="6"/>
    <circle cx="1046" cy="444" r="6"/>
  </g>
</svg>
