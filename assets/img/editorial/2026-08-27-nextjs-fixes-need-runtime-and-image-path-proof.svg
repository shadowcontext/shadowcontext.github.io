<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected web runtime and image-processing paths</title>
  <desc id="desc">An abstract editorial scene with two luminous shields guarding a web-service window, an image-processing channel, and layered server blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07172D"/>
      <stop offset="0.52" stop-color="#10284A"/>
      <stop offset="1" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="panel" x1="366" y1="193" x2="1238" y2="732" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183B63" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0B203D" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cyan" x1="544" y1="285" x2="906" y2="665" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74F4E8"/>
      <stop offset="1" stop-color="#25A8E0"/>
    </linearGradient>
    <linearGradient id="amber" x1="980" y1="302" x2="1170" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD88A"/>
      <stop offset="1" stop-color="#F28A56"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(812 458) rotate(90) scale(410 660)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#258ED4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#258ED4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020712" flood-opacity="0.55"/>
    </filter>
  </defs>
