<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Database replication protected by layered network trust</title>
  <desc id="desc">An abstract teal database cluster sits within layered blue network rings while an amber connection stops at the outer boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2940"/>
      <stop offset="1" stop-color="#10203a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#38d9c5" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#2a8ca7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#245878"/>
      <stop offset="0.5" stop-color="#4dd8d0"/>
      <stop offset="1" stop-color="#27627f"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8af1df"/>
      <stop offset="0.3" stop-color="#35cbbb"/>
      <stop offset="1" stop-color="#137690"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d4d" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffb052"/>
      <stop offset="1" stop-color="#ffd487"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <circle cx="800" cy="450" r="355" fill="none" stroke="#18435f" stroke-width="2" stroke-dasharray="5 18" opacity="0.7"/>
  <circle cx="800" cy="450" r="285" fill="#0a1f34" fill-opacity="0.5" stroke="url(#ring)" stroke-width="8" opacity="0.9"/>
  <circle cx="800" cy="450" r="218" fill="#0b2639" stroke="#3bc7c0" stroke-width="3" stroke-opacity="0.7"/>
  <path d="M515 450 C590 330 668 285 800 285 C932 285 1010 330 1085 450 C1010 570 932 615 800 615 C668 615 590 570 515 450Z" fill="none" stroke="#337b93" stroke-width="2" opacity="0.45"/>
  <g opacity="0.8" stroke="#48d6ca" stroke-width="5" stroke-linecap="round">
    <path d="M690 420 L800 350 L910 420"/>
    <path d="M690 420 L800 545 L910 420"/>
    <path d="M800 350 L800 545" opacity="0.5"/>
  </g>
  <g transform="translate(800 330)">
    <ellipse rx="72" ry="27" fill="#b4fff0"/>
    <path d="M-72 0 V78 C-72 93 -40 105 0 105 C40 105 72 93 72 78 V0" fill="url(#db)"/>
    <ellipse cy="78" rx="72" ry="27" fill="#218fa0"/>
    <ellipse rx="72" ry="27" fill="none" stroke="#d5fff7" stroke-width="3"/>
    <path d="M-72 38 C-72 53 -40 65 0 65 C40 65 72 53 72 38" fill="none" stroke="#b2f4e8" stroke-width="3" opacity="0.7"/>
  </g>
  <g transform="translate(650 472) scale(.72)">
    <ellipse rx="72" ry="27" fill="#87eadc"/>
    <path d="M-72 0 V78 C-72 93 -40 105 0 105 C40 105 72 93 72 78 V0" fill="url(#db)"/>
    <ellipse cy="78" rx="72" ry="27" fill="#166f89"/>
    <ellipse rx="72" ry="27" fill="none" stroke="#c9fff4" stroke-width="3"/>
  </g>
  <g transform="translate(950 472) scale(.72)">
    <ellipse rx="72" ry="27" fill="#87eadc"/>
    <path d="M-72 0 V78 C-72 93 -40 105 0 105 C40 105 72 93 72 78 V0" fill="url(#db)"/>
    <ellipse cy="78" rx="72" ry="27" fill="#166f89"/>
    <ellipse rx="72" ry="27" fill="none" stroke="#c9fff4" stroke-width="3"/>
  </g>
  <circle cx="385" cy="450" r="40" fill="#ffad55" opacity="0.16" filter="url(#soft)"/>
  <path d="M165 450 H505" stroke="url(#amber)" stroke-width="10" stroke-linecap="round"/>
  <path d="M455 422 L505 450 L455 478" fill="none" stroke="#ffc673" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="515" cy="450" r="24" fill="#0b2940" stroke="#71e8db" stroke-width="8" filter="url(#glow)"/>
  <path d="M508 450 L515 457 L529 440" fill="none" stroke="#d4fff7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#67ded4">
    <circle cx="800" cy="165" r="7"/><circle cx="800" cy="735" r="7"/>
    <circle cx="1085" cy="450" r="7"/><circle cx="598" cy="248" r="6"/>
    <circle cx="1002" cy="652" r="6"/>
  </g>
  <path d="M1110 250 C1250 330 1320 450 1290 610" fill="none" stroke="#23607b" stroke-width="3" stroke-dasharray="14 18" opacity="0.55"/>
  <path d="M490 680 C360 610 300 500 320 365" fill="none" stroke="#23607b" stroke-width="3" stroke-dasharray="14 18" opacity="0.55"/>
</svg>
