<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded application paths</title>
  <desc id="desc">Four luminous data streams pass through controlled gateways into separate application chambers, symbolizing feature-level exposure checks, request limits, and concurrency isolation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071528"/>
      <stop offset="0.52" stop-color="#102743"/>
      <stop offset="1" stop-color="#09101f"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#45d7d0" stop-opacity=".25"/>
      <stop offset="1" stop-color="#45d7d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streamA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6f9f" stop-opacity=".1"/>
      <stop offset=".48" stop-color="#65e3d9"/>
      <stop offset="1" stop-color="#b7fff2" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="streamB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7047a8" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#a98cf2"/>
      <stop offset="1" stop-color="#e3d8ff" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92fff1" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#2f8c9e" stop-opacity=".35"/>
      <stop offset="1" stop-color="#183651" stop-opacity=".2"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1" fill="#d5f6ff" opacity=".06"/>
      <circle cx="39" cy="30" r="1.3" fill="#d5f6ff" opacity=".04"/>
      <circle cx="57" cy="53" r=".8" fill="#d5f6ff" opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="820" cy="450" rx="590" ry="390" fill="url(#aura)"/>
  <path d="M0 735 C320 620 420 760 730 688 S1230 560 1600 680 V900 H0Z" fill="#07101d" opacity=".75"/>
  <path d="M0 170 C290 245 470 90 720 180 S1200 305 1600 175" fill="none" stroke="#75a9c8" stroke-width="2" opacity=".08"/>

  <g opacity=".42" fill="none" stroke="#77b5cc">
    <ellipse cx="1080" cy="450" rx="365" ry="300" stroke-width="2"/>
    <ellipse cx="1080" cy="450" rx="300" ry="238" stroke-width="1.5" opacity=".65"/>
    <ellipse cx="1080" cy="450" rx="238" ry="178" stroke-width="1" opacity=".45"/>
  </g>

  <g>
    <path d="M70 250 C300 250 390 294 600 294 C715 294 775 322 860 342" fill="none" stroke="url(#streamA)" stroke-width="22" stroke-linecap="round" opacity=".72"/>
    <path d="M35 385 C260 385 395 395 602 395 C730 395 788 405 867 415" fill="none" stroke="url(#streamB)" stroke-width="18" stroke-linecap="round" opacity=".7"/>
    <path d="M40 520 C260 520 390 504 602 504 C726 504 793 493 867 486" fill="none" stroke="url(#streamA)" stroke-width="20" stroke-linecap="round" opacity=".68"/>
    <path d="M85 658 C290 658 404 608 600 608 C710 608 783 580 860 556" fill="none" stroke="url(#streamB)" stroke-width="16" stroke-linecap="round" opacity=".68"/>
    <g fill="#d8fff9" opacity=".9">
      <circle cx="275" cy="256" r="6"/><circle cx="470" cy="292" r="4"/>
      <circle cx="206" cy="385" r="5"/><circle cx="510" cy="395" r="6"/>
      <circle cx="322" cy="516" r="5"/><circle cx="557" cy="505" r="4"/>
      <circle cx="250" cy="650" r="5"/><circle cx="472" cy="617" r="6"/>
    </g>
  </g>

  <g>
    <rect x="584" y="185" width="92" height="530" rx="46" fill="#1c3851" opacity=".82"/>
    <rect x="602" y="205" width="56" height="490" rx="28" fill="url(#gate)" opacity=".8"/>
    <g fill="#061727" stroke="#9dfcef" stroke-width="4">
      <circle cx="630" cy="294" r="31"/>
      <circle cx="630" cy="395" r="31"/>
      <circle cx="630" cy="504" r="31"/>
      <circle cx="630" cy="608" r="31"/>
    </g>
    <g fill="#bafff4">
      <circle cx="630" cy="294" r="8"/><circle cx="630" cy="395" r="8"/>
      <circle cx="630" cy="504" r="8"/><circle cx="630" cy="608" r="8"/>
    </g>
  </g>

  <g transform="translate(875 217)">
    <g filter="url(#softGlow)" opacity=".45">
      <rect x="0" y="0" width="205" height="175" rx="45" fill="#55e5d2"/>
      <rect x="240" y="0" width="205" height="175" rx="45" fill="#9d7dea"/>
      <rect x="0" y="225" width="205" height="175" rx="45" fill="#55e5d2"/>
      <rect x="240" y="225" width="205" height="175" rx="45" fill="#9d7dea"/>
    </g>
    <g stroke-width="4">
      <rect x="0" y="0" width="205" height="175" rx="45" fill="#102f42" stroke="#64e5d8"/>
      <rect x="240" y="0" width="205" height="175" rx="45" fill="#1d2748" stroke="#a78fea"/>
      <rect x="0" y="225" width="205" height="175" rx="45" fill="#102f42" stroke="#64e5d8"/>
      <rect x="240" y="225" width="205" height="175" rx="45" fill="#1d2748" stroke="#a78fea"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <path d="M43 88 C80 42 125 135 165 72" stroke="#9ffff2" stroke-width="10"/>
      <path d="M283 88 C320 42 365 135 405 72" stroke="#d2c3ff" stroke-width="10"/>
      <path d="M43 313 C80 267 125 360 165 297" stroke="#9ffff2" stroke-width="10"/>
      <path d="M283 313 C320 267 365 360 405 297" stroke="#d2c3ff" stroke-width="10"/>
    </g>
    <g fill="#efffff" filter="url(#smallGlow)">
      <circle cx="103" cy="87" r="7"/><circle cx="343" cy="87" r="7"/>
      <circle cx="103" cy="312" r="7"/><circle cx="343" cy="312" r="7"/>
    </g>
  </g>

  <path d="M828 170 Q1080 72 1330 170" fill="none" stroke="#72e7db" stroke-width="5" stroke-linecap="round" opacity=".42"/>
  <path d="M828 730 Q1080 828 1330 730" fill="none" stroke="#9b82e0" stroke-width="5" stroke-linecap="round" opacity=".4"/>
  <circle cx="1080" cy="450" r="320" fill="none" stroke="#d7ffff" stroke-width="1" stroke-dasharray="4 18" opacity=".18"/>
</svg>
