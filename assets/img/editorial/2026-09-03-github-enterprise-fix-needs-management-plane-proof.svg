    <circle cx="31" cy="34" r="14" fill="#F4B34F"/>
    <path d="M31 48V79" stroke="#F4B34F" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g opacity="0.5" fill="#3EA9C3">
    <rect x="332" y="320" width="72" height="12" rx="6"/><rect x="294" y="350" width="110" height="12" rx="6"/>
    <rect x="1194" y="594" width="116" height="12" rx="6"/><rect x="1194" y="624" width="72" height="12" rx="6"/>
  </g>
  <path d="M344 492C405 492 424 452 482 452" fill="none" stroke="#58CDE0" stroke-width="5" stroke-dasharray="8 16" opacity="0.56"/>
  <circle cx="344" cy="492" r="11" fill="#5BD7E3" opacity="0.7"/>
</svg>
