<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected management plane stopping an outbound request path</title>
  <desc id="desc">An abstract dark server core is enclosed by layered blue shield forms while a segmented amber path is stopped at the outer management boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0B2540"/>
      <stop offset="1" stop-color="#102C3D"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#43C7E8" stop-opacity="0.28"/>
      <stop offset="0.56" stop-color="#167AA8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6FE5F1"/>
      <stop offset="0.5" stop-color="#238DBB"/>
      <stop offset="1" stop-color="#14527F"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203B59"/>
      <stop offset="1" stop-color="#0A1728"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD36A"/>
      <stop offset="1" stop-color="#F28B38"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="786" cy="442" rx="610" ry="390" fill="url(#halo)"/>
  <g opacity="0.24" fill="none" stroke="#72D7E8" stroke-width="2">
    <path d="M170 198C360 62 560 92 670 210"/>
    <path d="M220 720C402 820 564 806 688 700"/>
    <path d="M946 156C1110 66 1322 119 1438 270"/>
    <path d="M1000 742C1194 826 1350 754 1458 614"/>
  </g>
  <g fill="#69D9E8">
    <circle cx="170" cy="198" r="6" opacity="0.6"/><circle cx="315" cy="120" r="4" opacity="0.42"/>
    <circle cx="220" cy="720" r="6" opacity="0.5"/><circle cx="410" cy="790" r="4" opacity="0.4"/>
    <circle cx="1438" cy="270" r="6" opacity="0.55"/><circle cx="1458" cy="614" r="6" opacity="0.48"/>
  </g>
  <path d="M800 112L1118 236V438C1118 633 998 744 800 806C602 744 482 633 482 438V236Z" fill="#0A1A2C" stroke="#2D789D" stroke-width="3" opacity="0.92"/>
  <path d="M800 156L1072 262V437C1072 598 972 695 800 752C628 695 528 598 528 437V262Z" fill="none" stroke="url(#shield)" stroke-width="22" stroke-linejoin="round" opacity="0.84"/>
  <path d="M800 205L1024 292V431C1024 565 942 642 800 694C658 642 576 565 576 431V292Z" fill="none" stroke="#52C8DE" stroke-width="4" opacity="0.45"/>
  <g filter="url(#soft)" opacity="0.36">
    <ellipse cx="795" cy="471" rx="192" ry="140" fill="#2FB9D6"/>
  </g>
  <g>
    <path d="M680 342L800 290L920 342V548L800 610L680 548Z" fill="url(#core)" stroke="#78E4ED" stroke-width="4"/>
    <path d="M680 342L800 398L920 342M800 398V610" fill="none" stroke="#4DB3CC" stroke-width="4" opacity="0.72"/>
    <path d="M715 382L768 406V453L715 428ZM885 382L832 406V453L885 428Z" fill="#183E5D" stroke="#5BC5D9" stroke-width="3"/>
    <circle cx="800" cy="500" r="46" fill="#0A1929" stroke="#73E1E9" stroke-width="5"/>
    <path d="M781 501L796 516L824 481" fill="none" stroke="#8AF0E6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="url(#amber)" stroke-width="18" stroke-linecap="round" filter="url(#glow)">
    <path d="M1420 446H1264"/>
    <path d="M1224 446H1138"/>
  </g>
  <g fill="url(#amber)">
    <path d="M1392 416L1442 446L1392 476Z"/>
    <circle cx="1264" cy="446" r="15"/><circle cx="1224" cy="446" r="15"/>
  </g>
  <g transform="translate(1094 390)">
