<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified Java runtime restart</title>
  <desc id="desc">Abstract editorial artwork showing layered runtime streams passing through a guarded restart gate and emerging as a verified green service state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071427"/>
      <stop offset="0.58" stop-color="#102545"/>
      <stop offset="1" stop-color="#071b22"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6f91"/>
      <stop offset="0.48" stop-color="#58a6c7"/>
      <stop offset="1" stop-color="#5de2ad"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f8ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#62c9db" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#59e0ac" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#59e0ac" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020711" flood-opacity="0.62"/>
    </filter>
  </defs>
