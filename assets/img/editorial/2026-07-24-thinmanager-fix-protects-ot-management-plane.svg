<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected industrial management plane</title>
  <desc id="desc">An abstract industrial management hub enclosed by layered blue boundaries while a diverted file path is stopped outside the protected core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.52" stop-color="#0b2636"/>
      <stop offset="1" stop-color="#12374a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#4bd8d0" stop-opacity=".26"/>
      <stop offset=".52" stop-color="#2489a5" stop-opacity=".11"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63e2d7"/>
      <stop offset="1" stop-color="#2d7fa4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c5066"/>
      <stop offset="1" stop-color="#0c2939"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b86d"/>
      <stop offset="1" stop-color="#e96c67"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020912" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#7bc8cf" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="810" cy="430" rx="620" ry="420" fill="url(#glow)"/>
  <circle cx="200" cy="160" r="95" fill="#2e8fac" opacity=".08" filter="url(#soft)"/>
  <circle cx="1400" cy="730" r="130" fill="#52d6c7" opacity=".08" filter="url(#soft)"/>

  <g opacity=".46" stroke="#5ebac3" stroke-width="3" fill="none">
    <path d="M170 258H355L438 336"/>
    <path d="M1430 250H1247L1163 330"/>
    <path d="M185 662H353L448 575"/>
    <path d="M1415 665H1244L1152 580"/>
  </g>
  <g fill="#66d4cf">
    <circle cx="170" cy="258" r="7"/>
    <circle cx="1430" cy="250" r="7"/>
    <circle cx="185" cy="662" r="7"/>
    <circle cx="1415" cy="665" r="7"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M800 120L1190 268V490C1190 674 1044 782 800 830C556 782 410 674 410 490V268Z"
          fill="#0b2231" stroke="#3e94ad" stroke-width="4"/>
    <path d="M800 166L1139 294V487C1139 638 1018 730 800 777C582 730 461 638 461 487V294Z"
          fill="none" stroke="#4cb5c4" stroke-opacity=".7" stroke-width="8"/>
    <path d="M800 214L1088 323V483C1088 606 989 682 800 725C611 682 512 606 512 483V323Z"
          fill="#0b2d3d" stroke="#62d6cf" stroke-opacity=".82" stroke-width="3"/>
  </g>

  <g transform="translate(620 300)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="288" rx="34" fill="url(#panel)" stroke="#6fe0d6" stroke-width="3"/>
    <rect x="35" y="39" width="290" height="78" rx="16" fill="#071b29" stroke="#397f96" stroke-width="2"/>
    <circle cx="74" cy="78" r="15" fill="#65e0d5"/>
    <rect x="111" y="65" width="166" height="12" rx="6" fill="#6ec9ce" opacity=".72"/>
    <rect x="111" y="87" width="112" height="9" rx="4.5" fill="#4b8da1" opacity=".75"/>
    <rect x="35" y="145" width="86" height="96" rx="15" fill="#0a2332" stroke="#3b7c91" stroke-width="2"/>
    <rect x="137" y="145" width="86" height="96" rx="15" fill="#0a2332" stroke="#3b7c91" stroke-width="2"/>
    <rect x="239" y="145" width="86" height="96" rx="15" fill="#0a2332" stroke="#3b7c91" stroke-width="2"/>
    <path d="M61 206L78 188L95 206" fill="none" stroke="#61dcd2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M163 206L180 188L197 206" fill="none" stroke="#61dcd2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M265 206L282 188L299 206" fill="none" stroke="#61dcd2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 418H315C355 418 373 437 373 474V525C373 559 394 577 430 577H525"
          stroke="url(#path)" stroke-width="18"/>
    <path d="M510 556L542 577L510 598" stroke="#f1a168" stroke-width="18"/>
  </g>
  <g transform="translate(485 505)" filter="url(#shadow)">
    <path d="M75 0L142 25V81C142 130 113 160 75 179C37 160 8 130 8 81V25Z"
          fill="url(#shield)" stroke="#a4fff1" stroke-width="3"/>
    <path d="M46 89L67 110L107 66" fill="none" stroke="#082536" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity=".72">
    <rect x="125" y="355" width="120" height="72" rx="12" fill="#142c39" stroke="#dc8b68" stroke-width="2"/>
    <path d="M150 379H218M150 399H196" stroke="#f0b477" stroke-width="6" stroke-linecap="round"/>
    <rect x="1310" y="340" width="120" height="92" rx="14" fill="#102d3c" stroke="#438da3" stroke-width="2"/>
    <circle cx="1342" cy="376" r="11" fill="#63d7cf"/>
    <path d="M1366 371H1406M1330 405H1408" stroke="#68b5bf" stroke-width="6" stroke-linecap="round"/>
    <rect x="1290" y="525" width="145" height="100" rx="14" fill="#102d3c" stroke="#438da3" stroke-width="2"/>
    <path d="M1318 554H1407M1318 579H1374M1318 604H1393" stroke="#68b5bf" stroke-width="7" stroke-linecap="round"/>
  </g>

  <path d="M800 104V55M1210 485H1280M390 485H330M800 846V875"
        stroke="#75d7d1" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <g fill="#8ce8df" opacity=".8">
    <circle cx="800" cy="51" r="8"/>
    <circle cx="1285" cy="485" r="8"/>
    <circle cx="325" cy="485" r="8"/>
    <circle cx="800" cy="878" r="8"/>
  </g>
</svg>
