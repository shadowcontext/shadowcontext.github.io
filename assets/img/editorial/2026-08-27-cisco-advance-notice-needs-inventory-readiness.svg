<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Network inventory approaching a maintenance readiness window</title>
  <desc id="desc">Abstract network equipment forms converge through a luminous amber window toward a protected blue maintenance horizon.</desc>
  <defs>
