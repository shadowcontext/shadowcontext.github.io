<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Migration streams protected from a privileged hosting core</title>
  <desc id="desc">Abstract editorial artwork showing two data streams entering a segmented hosting server through security gates before reaching a protected central core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2b3a"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#4ee8c4" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#1a88a8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#071827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streamA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42a5d9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#62e4d0" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="streamB" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#866fd6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#62e4d0" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77f1d7"/>
      <stop offset="1" stop-color="#2c7e9f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd47a"/>
      <stop offset="1" stop-color="#e28a3d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="mesh" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8fded6" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <ellipse cx="800" cy="445" rx="650" ry="390" fill="url(#halo)"/>

  <g opacity=".22" fill="none" stroke="#8adbd3" stroke-width="2">
    <path d="M80 192C292 192 328 318 482 318"/>
    <path d="M1520 708C1302 708 1268 580 1118 580"/>
    <circle cx="80" cy="192" r="8" fill="#67dccb"/>
    <circle cx="1520" cy="708" r="8" fill="#67dccb"/>
  </g>

  <path d="M80 338C245 338 325 360 470 402L610 443" fill="none" stroke="url(#streamA)" stroke-width="54" stroke-linecap="round"/>
  <path d="M1520 562C1355 562 1275 540 1130 498L990 457" fill="none" stroke="url(#streamB)" stroke-width="54" stroke-linecap="round"/>
  <g fill="#b9fff2" opacity=".85">
    <circle cx="180" cy="338" r="7"/><circle cx="276" cy="348" r="4"/><circle cx="370" cy="371" r="6"/>
    <circle cx="1420" cy="562" r="7"/><circle cx="1324" cy="552" r="4"/><circle cx="1230" cy="529" r="6"/>
  </g>

  <g transform="translate(470 310)">
    <rect width="96" height="280" rx="26" fill="#0c2637" stroke="#57d7c4" stroke-width="4"/>
    <rect x="25" y="42" width="46" height="196" rx="20" fill="#123f4b"/>
    <circle cx="48" cy="92" r="10" fill="#72f0d6" filter="url(#glow)"/>
    <circle cx="48" cy="140" r="10" fill="#72f0d6"/>
    <circle cx="48" cy="188" r="10" fill="#72f0d6"/>
  </g>
  <g transform="translate(1034 310)">
    <rect width="96" height="280" rx="26" fill="#0c2637" stroke="#57d7c4" stroke-width="4"/>
    <rect x="25" y="42" width="46" height="196" rx="20" fill="#123f4b"/>
    <circle cx="48" cy="92" r="10" fill="#72f0d6"/>
    <circle cx="48" cy="140" r="10" fill="#72f0d6"/>
    <circle cx="48" cy="188" r="10" fill="#72f0d6" filter="url(#glow)"/>
  </g>

  <g transform="translate(602 180)">
    <rect x="0" y="0" width="396" height="540" rx="62" fill="#071a28" stroke="url(#frame)" stroke-width="7"/>
    <rect x="34" y="40" width="328" height="460" rx="42" fill="#0d3040" stroke="#63cbbb" stroke-opacity=".45" stroke-width="3"/>
    <path d="M64 150H332M64 390H332" stroke="#75dccc" stroke-opacity=".26" stroke-width="3"/>
    <g fill="#17495a" stroke="#69d8c7" stroke-opacity=".48" stroke-width="2">
      <rect x="70" y="78" width="256" height="48" rx="16"/>
      <rect x="70" y="414" width="256" height="48" rx="16"/>
    </g>
    <circle cx="198" cy="270" r="112" fill="#0a2433" stroke="#62dfc9" stroke-width="5"/>
    <circle cx="198" cy="270" r="82" fill="#12394a" stroke="#8ff3df" stroke-opacity=".7" stroke-width="3"/>
    <path d="M198 207L253 231V276C253 320 228 346 198 360C168 346 143 320 143 276V231Z" fill="url(#core)" filter="url(#glow)"/>
    <path d="M198 232L230 246V277C230 302 217 319 198 330C179 319 166 302 166 277V246Z" fill="#102a39" opacity=".86"/>
    <circle cx="198" cy="274" r="13" fill="#ffd986"/>
    <path d="M198 286V307" stroke="#ffd986" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g opacity=".35" filter="url(#soft)">
    <ellipse cx="800" cy="752" rx="320" ry="26" fill="#43d5bf"/>
  </g>
  <g fill="#77ead8">
    <circle cx="548" cy="687" r="5"/><circle cx="1052" cy="213" r="5"/>
    <circle cx="1184" cy="670" r="4"/><circle cx="410" cy="230" r="4"/>
  </g>
</svg>
