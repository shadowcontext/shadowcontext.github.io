<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified network provisioning path</title>
  <desc id="desc">Abstract editorial scene of a secure provisioning gateway sending image blocks through a segmented network path, with a checkpoint indicating that service health must be validated after patching.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="0.55" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#102f48"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#44d6c5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#44d6c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163e5d"/>
      <stop offset="1" stop-color="#0b2038"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46d8c8"/>
      <stop offset="0.7" stop-color="#70b9ff"/>
      <stop offset="1" stop-color="#f2b35f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020711" flood-opacity="0.6"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8fc8e8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="790" cy="470" rx="650" ry="390" fill="url(#glow)" filter="url(#soft)"/>

  <g opacity="0.55" fill="none" stroke="#78b4d5" stroke-width="2">
    <path d="M40 180C270 180 250 340 450 340"/>
    <path d="M1560 700C1350 700 1380 570 1190 570"/>
    <path d="M180 760C330 760 320 650 470 650"/>
