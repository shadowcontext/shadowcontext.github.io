    <path d="M794 421L834 461L914 366" fill="none" stroke="#f6cf86" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="850" cy="427" r="132" fill="none" stroke="#f3b45f" stroke-opacity="0.18" stroke-width="24"/>
