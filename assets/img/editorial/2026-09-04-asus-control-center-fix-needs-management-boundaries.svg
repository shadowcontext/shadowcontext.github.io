<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected endpoint management boundary</title>
  <desc id="desc">An abstract central management console enclosed by layered blue shields, with segmented device groups and an amber connection stopped outside the protected boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.52" stop-color="#0b2940"/>
      <stop offset="1" stop-color="#10213a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="48%">
      <stop offset="0" stop-color="#43d6d1" stop-opacity="0.24"/>
      <stop offset="0.58" stop-color="#2799c5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66e2dc"/>
      <stop offset="0.52" stop-color="#28a6d2"/>
      <stop offset="1" stop-color="#3867bf"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153b56"/>
      <stop offset="1" stop-color="#0b2438"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb34f" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#ffb34f"/>
      <stop offset="1" stop-color="#ff754f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#87d7e8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="440" rx="680" ry="410" fill="url(#halo)"/>
  <circle cx="820" cy="445" r="320" fill="none" stroke="#50cfd8" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="820" cy="445" r="270" fill="none" stroke="#50cfd8" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="5 18"/>

  <g opacity="0.82" stroke="#54cbd7" stroke-width="3" fill="none">
    <path d="M596 334C489 302 403 278 300 250"/>
    <path d="M563 452C438 452 344 470 245 516"/>
    <path d="M618 585C495 634 423 674 326 722"/>
    <path d="M1028 337C1148 300 1238 268 1341 237"/>
    <path d="M1061 451C1182 451 1277 477 1371 518"/>
    <path d="M1010 584C1126 633 1221 681 1312 730"/>
  </g>

  <g fill="url(#panel)" stroke="#55ccd7" stroke-width="3">
    <rect x="205" y="185" width="178" height="118" rx="24"/>
    <rect x="158" y="454" width="178" height="118" rx="24"/>
    <rect x="238" y="672" width="178" height="118" rx="24"/>
    <rect x="1250" y="175" width="178" height="118" rx="24"/>
    <rect x="1280" y="458" width="178" height="118" rx="24"/>
    <rect x="1225" y="676" width="178" height="118" rx="24"/>
  </g>
  <g fill="#53d3d5">
    <circle cx="248" cy="227" r="10"/><rect x="271" y="217" width="74" height="10" rx="5" opacity="0.65"/><rect x="237" y="253" width="108" height="8" rx="4" opacity="0.32"/>
    <circle cx="201" cy="496" r="10"/><rect x="224" y="486" width="74" height="10" rx="5" opacity="0.65"/><rect x="190" y="522" width="108" height="8" rx="4" opacity="0.32"/>
    <circle cx="281" cy="714" r="10"/><rect x="304" y="704" width="74" height="10" rx="5" opacity="0.65"/><rect x="270" y="740" width="108" height="8" rx="4" opacity="0.32"/>
    <circle cx="1293" cy="217" r="10"/><rect x="1316" y="207" width="74" height="10" rx="5" opacity="0.65"/><rect x="1282" y="243" width="108" height="8" rx="4" opacity="0.32"/>
    <circle cx="1323" cy="500" r="10"/><rect x="1346" y="490" width="74" height="10" rx="5" opacity="0.65"/><rect x="1312" y="526" width="108" height="8" rx="4" opacity="0.32"/>
    <circle cx="1268" cy="718" r="10"/><rect x="1291" y="708" width="74" height="10" rx="5" opacity="0.65"/><rect x="1257" y="744" width="108" height="8" rx="4" opacity="0.32"/>
  </g>

  <path d="M820 176C925 227 1030 242 1030 242v205c0 151-91 253-210 309-119-56-210-158-210-309V242s105-15 210-66Z" fill="#071827" fill-opacity="0.92" stroke="url(#shield)" stroke-width="16"/>
  <path d="M820 218C907 258 982 271 982 271v170c0 119-68 205-162 255-94-50-162-136-162-255V271s75-13 162-53Z" fill="#0d3047" stroke="#61dcd7" stroke-opacity="0.52" stroke-width="3"/>

  <g filter="url(#glow)">
    <rect x="708" y="337" width="224" height="170" rx="27" fill="url(#panel)" stroke="#6be4dd" stroke-width="4"/>
    <rect x="742" y="371" width="156" height="93" rx="14" fill="#071827" stroke="#2f9fc5" stroke-width="3"/>
    <circle cx="772" cy="402" r="10" fill="#62ded9"/>
    <rect x="798" y="393" width="70" height="10" rx="5" fill="#62ded9" opacity="0.65"/>
    <path d="M772 435h96" stroke="#437b9d" stroke-width="8" stroke-linecap="round"/>
    <path d="M780 507v34m80-34v34m-112 0h144" stroke="#6be4dd" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="#7ee6df" filter="url(#glow)">
