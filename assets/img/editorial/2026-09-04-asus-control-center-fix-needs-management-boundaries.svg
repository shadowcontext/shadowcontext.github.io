    <circle cx="1028" cy="337" r="8"/><circle cx="1061" cy="451" r="8"/><circle cx="1010" cy="584" r="8"/>
  </g>

  <path d="M0 392H472" stroke="url(#amber)" stroke-width="12" stroke-linecap="round"/>
