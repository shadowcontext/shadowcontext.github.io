    <circle cx="111" cy="802" r="6" fill="#2fa7ce"/><circle cx="1501" cy="812" r="4" fill="#2fa7ce"/>
    <path d="M105 154h108M1395 146h99M96 767h84M1422 773h91" stroke="#63d5db" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
