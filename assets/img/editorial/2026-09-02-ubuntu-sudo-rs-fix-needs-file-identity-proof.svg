<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected file identity across mutable paths</title>
  <desc id="desc">Abstract editorial artwork showing a luminous file tile held inside a layered security boundary while multiple paths converge and separate around it.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="30" x2="1500" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07172E"/>
      <stop offset="0.52" stop-color="#0A3150"/>
      <stop offset="1" stop-color="#10233D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(820 444) rotate(90) scale(386 566)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D4C5" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#36D4C5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="560" y1="224" x2="1052" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#49E5D1" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2187C7" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="file" x1="685" y1="325" x2="924" y2="584" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1AE"/>
      <stop offset="1" stop-color="#F3A84B"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
