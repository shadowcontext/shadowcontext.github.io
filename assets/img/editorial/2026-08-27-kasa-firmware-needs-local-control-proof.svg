    <path d="M78 199H136" stroke="#55E3CE" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(711 96)">
    <path d="M89 0C37 0 0 39 0 88C0 121 18 143 39 164C50 175 54 187 54 202H124C124 187 128 175 139 164C160 143 178 121 178 88C178 39 141 0 89 0Z" fill="url(#device)"/>
    <path d="M57 220H121M64 239H114" stroke="#55E3CE" stroke-width="12" stroke-linecap="round"/>
    <path d="M53 89C75 66 103 63 128 87" fill="none" stroke="#12394A" stroke-width="9" stroke-linecap="round"/>
  </g>

