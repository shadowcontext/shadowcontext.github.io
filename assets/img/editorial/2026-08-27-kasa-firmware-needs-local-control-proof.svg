    <rect x="42" y="42" width="130" height="128" rx="34" fill="url(#device)" opacity="0.94"/>
    <rect x="83" y="75" width="14" height="40" rx="7" fill="#16394B"/>
    <rect x="117" y="75" width="14" height="40" rx="7" fill="#16394B"/>
    <path d="M83 139H131" stroke="#16394B" stroke-width="10" stroke-linecap="round"/>
    <circle cx="107" cy="198" r="9" fill="#55E3CE"/>
  </g>

  <g transform="translate(1136 335)">
