    <path d="M-18 0H48M28 0V20M48 0V13" fill="none" stroke="#ffd99b" stroke-width="10" stroke-linecap="round"/>
    <rect x="-106" y="-61" width="212" height="122" rx="61" fill="none" stroke="#ffbd76" stroke-opacity="0.2" stroke-width="16" filter="url(#glow-budibase)"/>
  </g>

