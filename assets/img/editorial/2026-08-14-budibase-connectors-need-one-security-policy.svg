    <path d="M345 315C470 315 510 370 640 418" fill="none" stroke="#5bcfd0" stroke-width="5" stroke-linecap="round"/>
    <path d="M345 585C470 585 510 525 640 482" fill="none" stroke="#5bcfd0" stroke-width="5" stroke-linecap="round"/>
    <path d="M955 420C1070 370 1110 305 1255 305" fill="none" stroke="#77dfe1" stroke-width="5" stroke-linecap="round"/>
    <path d="M955 480C1070 525 1120 595 1255 595" fill="none" stroke="#77dfe1" stroke-width="5" stroke-linecap="round"/>
