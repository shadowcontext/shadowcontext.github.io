    <circle cx="1295" cy="595" r="42" fill="#112e42" stroke="#62c9e4" stroke-width="4"/>
    <circle cx="305" cy="315" r="10" fill="#7df2dc"/>
    <circle cx="305" cy="585" r="10" fill="#7df2dc"/>
    <circle cx="1295" cy="305" r="10" fill="#83dff3"/>
    <circle cx="1295" cy="595" r="10" fill="#83dff3"/>
  </g>

