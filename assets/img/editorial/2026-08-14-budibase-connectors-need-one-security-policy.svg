<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Low-code connector security boundary</title>
  <desc id="desc">Abstract editorial artwork showing a low-code connector hub, a sealed credential capsule, and a network path constrained by a luminous security boundary.</desc>
  <defs>
    <linearGradient id="bg-budibase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#10283b"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="boundary-budibase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40d7c7"/>
      <stop offset="0.5" stop-color="#9af3da"/>
      <stop offset="1" stop-color="#48aef0"/>
    </linearGradient>
    <linearGradient id="capsule-budibase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc96b"/>
      <stop offset="1" stop-color="#e56b7f"/>
    </linearGradient>
    <radialGradient id="hub-budibase" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#d9fff7"/>
      <stop offset="0.38" stop-color="#62dec9"/>
      <stop offset="1" stop-color="#167d92"/>
    </radialGradient>
    <filter id="glow-budibase" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-budibase" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <pattern id="mesh-budibase" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#bcebf1" stroke-opacity="0.045" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#bcebf1" fill-opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-budibase)"/>
  <circle cx="250" cy="160" r="300" fill="#1c7997" opacity="0.14" filter="url(#soft-budibase)"/>
  <circle cx="1370" cy="730" r="330" fill="#8c426e" opacity="0.12" filter="url(#soft-budibase)"/>
  <rect width="1600" height="900" fill="url(#mesh-budibase)"/>

  <path d="M140 450C140 250 290 135 490 135H1110C1310 135 1460 250 1460 450S1310 765 1110 765H490C290 765 140 650 140 450Z" fill="#0d2030" fill-opacity="0.58" stroke="#5ce0d3" stroke-opacity="0.14" stroke-width="3"/>
  <path d="M205 450C205 286 330 205 500 205H1100C1270 205 1395 286 1395 450S1270 695 1100 695H500C330 695 205 614 205 450Z" fill="none" stroke="url(#boundary-budibase)" stroke-width="8" filter="url(#glow-budibase)"/>
  <path d="M237 450C237 311 348 237 510 237" fill="none" stroke="#ddfff7" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>

