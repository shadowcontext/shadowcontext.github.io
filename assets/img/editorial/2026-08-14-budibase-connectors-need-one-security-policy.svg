    <circle cx="0" cy="7" r="92" fill="none" stroke="#4dd9ca" stroke-opacity="0.16" stroke-width="18" filter="url(#glow-budibase)"/>
  </g>

  <path d="M1320 450C1370 450 1395 420 1395 373" fill="none" stroke="#ec8a9f" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 15"/>
  <circle cx="1395" cy="356" r="12" fill="#ed8ca1" opacity="0.9"/>
