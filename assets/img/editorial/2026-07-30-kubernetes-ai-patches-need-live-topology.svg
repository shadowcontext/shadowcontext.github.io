  <path d="M800 143c205 43 358 90 422 151v195c0 124-81 203-187 251-78 36-158 55-235 70-77-15-157-34-235-70-106-48-187-127-187-251V294c64-61 217-108 422-151Z" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-width="2"/>
