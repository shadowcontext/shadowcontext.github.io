      <path d="M0-48 41-24v48L0 48l-41-24v-48Z" fill="#0d2740" fill-opacity=".88" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
      <circle r="11" fill="#ecfeff"/>
