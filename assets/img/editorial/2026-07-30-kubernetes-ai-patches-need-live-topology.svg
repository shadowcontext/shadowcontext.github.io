<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes workloads protected by live topology context</title>
  <desc id="desc">Abstract cloud workloads connected by luminous service paths within a layered protective boundary, representing topology-aware security patching.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.52" stop-color="#0d2b46"/>
      <stop offset="1" stop-color="#06111e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#38bdf8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1=".1" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset=".45" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="lineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="field">
      <path d="M800 102C1035 151 1210 206 1283 278v222c0 145-96 240-219 296-90 41-183 63-264 78-81-15-174-37-264-78-123-56-219-151-219-296V278c73-72 248-127 483-176Z"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity=".24" fill="none" stroke="#7dd3fc">
    <path d="M0 706C240 620 355 724 568 661s318-189 541-137 308 18 491-61"/>
    <path d="M0 754C239 670 377 784 590 713s323-151 534-106 294 11 476-50" opacity=".42"/>
