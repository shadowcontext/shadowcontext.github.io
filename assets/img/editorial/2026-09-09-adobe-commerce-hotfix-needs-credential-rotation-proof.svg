<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Commerce patch and credential rotation</title>
  <desc id="desc">Abstract commerce panels sit behind a luminous patch barrier while concentric credential rings transition from exposed amber segments to protected teal arcs.</desc>
  <defs>
    <linearGradient id="background" x1="96" y1="54" x2="1504" y2="846" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071326"/>
      <stop offset="0.5" stop-color="#10294A"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(891 450) rotate(90) scale(410 555)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31D8CF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#31D8CF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="238" y1="180" x2="746" y2="724" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B78A9"/>
      <stop offset="1" stop-color="#0C2948"/>
    </linearGradient>
    <linearGradient id="barrier" x1="746" y1="128" x2="912" y2="778" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7FFF8"/>
      <stop offset="0.45" stop-color="#35DDD1"/>
      <stop offset="1" stop-color="#167FA7"/>
    </linearGradient>
    <linearGradient id="safeArc" x1="920" y1="210" x2="1410" y2="696" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CFFF2"/>
      <stop offset="1" stop-color="#21AFC5"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="895" cy="450" rx="555" ry="410" fill="url(#aura)"/>
  <circle cx="238" cy="166" r="118" fill="#246FA0" opacity="0.16" filter="url(#haze)"/>
  <circle cx="1400" cy="734" r="145" fill="#2BCEC4" opacity="0.12" filter="url(#haze)"/>

  <g opacity="0.25" fill="none" stroke="#7EBAD1" stroke-width="2">
    <path d="M70 744C242 677 358 738 505 681"/>
    <path d="M1068 154C1235 93 1370 155 1535 95"/>
    <path d="M82 284C231 223 353 245 468 172"/>
  </g>

  <g transform="translate(186 176)">
    <rect x="0" y="54" width="520" height="486" rx="44" fill="#091C34" stroke="#2B648D" stroke-width="4"/>
    <rect x="38" y="18" width="520" height="486" rx="44" fill="url(#panel)" stroke="#6BC9DE" stroke-opacity="0.6" stroke-width="5"/>
    <path d="M38 150H558" stroke="#A5EDF0" stroke-opacity="0.48" stroke-width="5"/>
    <path d="M130 150V504M292 150V504M455 150V504" stroke="#78C8D9" stroke-opacity="0.26" stroke-width="4"/>
    <path d="M38 327H558" stroke="#78C8D9" stroke-opacity="0.26" stroke-width="4"/>
    <path d="M112 113C119 66 153 40 196 40C241 40 273 67 279 113" fill="none" stroke="#C2FFF7" stroke-opacity="0.78" stroke-width="15" stroke-linecap="round"/>
    <path d="M320 113C327 66 361 40 404 40C449 40 481 67 487 113" fill="none" stroke="#C2FFF7" stroke-opacity="0.52" stroke-width="15" stroke-linecap="round"/>
    <circle cx="130" cy="239" r="32" fill="#79E6E4" fill-opacity="0.76"/>
    <circle cx="372" cy="414" r="44" fill="#68C5E0" fill-opacity="0.58"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M779 126L880 169V403C880 580 835 704 779 779C723 704 678 580 678 403V169L779 126Z" fill="#0A3048" fill-opacity="0.9" stroke="url(#barrier)" stroke-width="11"/>
    <path d="M731 444L765 479L833 393" fill="none" stroke="#D7FFF9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1128 449)">
    <circle r="244" fill="#0A2039" fill-opacity="0.76" stroke="#28698F" stroke-width="4"/>
    <circle r="194" fill="none" stroke="#EF9C45" stroke-opacity="0.78" stroke-width="34" stroke-dasharray="184 68" stroke-linecap="round" transform="rotate(146)"/>
    <circle r="148" fill="none" stroke="url(#safeArc)" stroke-width="32" stroke-dasharray="288 48" stroke-linecap="round" transform="rotate(-44)" filter="url(#softGlow)"/>
    <circle r="96" fill="#0D3550" stroke="#83F2E8" stroke-width="7"/>
    <path d="M-24 -8A29 29 0 1 1 25 11L60 46L38 68L22 52L8 66L-14 44L1 29A29 29 0 0 1-24-8Z" fill="none" stroke="#D5FFF8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-4" cy="-15" r="7" fill="#D5FFF8"/>
  </g>

  <g fill="#F0A14A" opacity="0.9">
    <path d="M895 246L929 264L899 288L868 270Z"/>
    <path d="M928 606L963 627L930 650L899 628Z"/>
  </g>
  <g fill="#9AF7EE">
    <circle cx="135" cy="690" r="5"/><circle cx="176" cy="724" r="3"/><circle cx="1418" cy="165" r="5"/><circle cx="1470" cy="213" r="3"/>
  </g>
  <rect x="42" y="42" width="1516" height="816" rx="34" fill="none" stroke="#80C9DA" stroke-opacity="0.16" stroke-width="2"/>
</svg>
