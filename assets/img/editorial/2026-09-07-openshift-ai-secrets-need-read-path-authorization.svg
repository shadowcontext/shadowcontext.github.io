<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered authorization protects AI service credentials</title>
  <desc id="desc">An abstract AI workspace surrounds two amber credential capsules while layered cyan gates separate them from incoming access paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#0b2638"/>
      <stop offset="1" stop-color="#091a2d"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#1a7890" stop-opacity="0.52"/>
      <stop offset="0.58" stop-color="#0b4059" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92eff2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#24a9c5" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91fbf1"/>
      <stop offset="1" stop-color="#20a6cf"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd47a"/>
      <stop offset="0.55" stop-color="#f5a735"/>
      <stop offset="1" stop-color="#d96d28"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#6bd9e8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="440" rx="650" ry="430" fill="url(#aura)"/>
  <circle cx="1280" cy="155" r="155" fill="#1db7cb" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="250" cy="730" r="190" fill="#e58a31" opacity="0.07" filter="url(#softGlow)"/>

  <g opacity="0.72" fill="none" stroke-linecap="round">
    <path d="M70 236 C260 236 286 330 440 330" stroke="#54d5df" stroke-width="8"/>
    <path d="M70 450 C250 450 286 450 410 450" stroke="#54d5df" stroke-width="8"/>
    <path d="M70 664 C260 664 286 570 440 570" stroke="#54d5df" stroke-width="8"/>
    <circle cx="72" cy="236" r="13" fill="#8bf7ee" stroke="none"/>
    <circle cx="72" cy="450" r="13" fill="#8bf7ee" stroke="none"/>
    <circle cx="72" cy="664" r="13" fill="#8bf7ee" stroke="none"/>
  </g>

  <g transform="translate(395 115)">
    <rect x="0" y="0" width="850" height="670" rx="74" fill="url(#glass)" stroke="#79e7e7" stroke-opacity="0.38" stroke-width="3"/>
    <rect x="54" y="54" width="742" height="562" rx="58" fill="#071827" fill-opacity="0.7" stroke="#49bed1" stroke-opacity="0.56" stroke-width="3"/>

    <g opacity="0.88">
      <path d="M145 0V670" stroke="#8df4ec" stroke-width="16" stroke-opacity="0.22"/>
      <path d="M195 0V670" stroke="#4bc9d9" stroke-width="5" stroke-opacity="0.72"/>
      <circle cx="195" cy="146" r="18" fill="#091b2c" stroke="url(#cyan)" stroke-width="6"/>
      <circle cx="195" cy="335" r="18" fill="#091b2c" stroke="url(#cyan)" stroke-width="6"/>
      <circle cx="195" cy="524" r="18" fill="#091b2c" stroke="url(#cyan)" stroke-width="6"/>
    </g>

    <g transform="translate(285 123)">
      <path d="M140 0 L272 76 L272 230 L140 307 L8 230 L8 76 Z" fill="#0d3346" stroke="url(#cyan)" stroke-width="5"/>
      <path d="M140 52 L226 101 L226 201 L140 251 L54 201 L54 101 Z" fill="#0a2234" stroke="#64dce1" stroke-opacity="0.55" stroke-width="3"/>
      <circle cx="140" cy="151" r="54" fill="#163f52" stroke="#83eee8" stroke-width="4"/>
      <circle cx="140" cy="151" r="26" fill="url(#cyan)" opacity="0.9"/>
      <g fill="#7eeae6">
        <circle cx="140" cy="31" r="8"/><circle cx="244" cy="91" r="8"/><circle cx="244" cy="212" r="8"/>
        <circle cx="140" cy="272" r="8"/><circle cx="36" cy="212" r="8"/><circle cx="36" cy="91" r="8"/>
      </g>
      <g stroke="#61d7df" stroke-width="4" opacity="0.7">
        <path d="M140 39V96"/><path d="M237 95L187 123"/><path d="M237 208L187 179"/>
        <path d="M140 264V206"/><path d="M43 208L93 179"/><path d="M43 95L93 123"/>
      </g>
    </g>

    <g transform="translate(594 162)">
      <rect x="0" y="0" width="126" height="165" rx="55" fill="#f2a13a" opacity="0.25" filter="url(#smallGlow)"/>
      <rect x="8" y="8" width="110" height="149" rx="48" fill="url(#amber)"/>
      <rect x="25" y="25" width="76" height="115" rx="36" fill="#40291f" opacity="0.42"/>
      <circle cx="63" cy="69" r="18" fill="#ffe6a7"/>
      <path d="M63 85V113" stroke="#ffe6a7" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g transform="translate(594 355)">
      <rect x="0" y="0" width="126" height="165" rx="55" fill="#f2a13a" opacity="0.25" filter="url(#smallGlow)"/>
      <rect x="8" y="8" width="110" height="149" rx="48" fill="url(#amber)"/>
      <rect x="25" y="25" width="76" height="115" rx="36" fill="#40291f" opacity="0.42"/>
      <circle cx="63" cy="69" r="18" fill="#ffe6a7"/>
      <path d="M63 85V113" stroke="#ffe6a7" stroke-width="12" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke="url(#cyan)" stroke-linecap="round">
      <path d="M540 99V570" stroke-width="8"/>
      <path d="M563 126V543" stroke-width="3" opacity="0.6"/>
      <path d="M520 172H558" stroke-width="8"/>
      <path d="M520 254H558" stroke-width="8"/>
      <path d="M520 390H558" stroke-width="8"/>
      <path d="M520 472H558" stroke-width="8"/>
    </g>
  </g>

  <g opacity="0.65" fill="none" stroke-linecap="round">
    <path d="M1245 290 C1390 290 1422 220 1540 220" stroke="#3bbbd0" stroke-width="7"/>
    <path d="M1245 450 H1540" stroke="#3bbbd0" stroke-width="7"/>
    <path d="M1245 610 C1390 610 1422 680 1540 680" stroke="#3bbbd0" stroke-width="7"/>
    <circle cx="1537" cy="220" r="12" fill="#75e9e6" stroke="none"/>
    <circle cx="1537" cy="450" r="12" fill="#75e9e6" stroke="none"/>
    <circle cx="1537" cy="680" r="12" fill="#75e9e6" stroke="none"/>
  </g>

  <path d="M324 330 L367 355 L367 405 C367 452 337 485 324 492 C311 485 281 452 281 405 V355 Z" fill="#0b3447" stroke="url(#cyan)" stroke-width="5"/>
  <path d="M309 408 L321 420 L344 389" fill="none" stroke="#92faf0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
