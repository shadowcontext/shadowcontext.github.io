    <rect x="604" y="269" width="392" height="392" rx="58" fill="url(#chip)" stroke="#55d6dc" stroke-opacity="0.65" stroke-width="3"/>
    <path d="M656 332h288v266H656z" fill="#071829" stroke="#287b97" stroke-width="2"/>
    <path d="M705 378h190v174H705z" fill="url(#core)" opacity="0.92" filter="url(#glow)"/>
    <path d="M734 406h132v118H734z" fill="#0a263c" stroke="#b7ffff" stroke-opacity="0.75" stroke-width="3"/>
    <circle cx="800" cy="465" r="28" fill="none" stroke="#ffd37a" stroke-width="8" filter="url(#glow)"/>
    <path d="M800 437v28l18 13" fill="none" stroke="#fff2bf" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#49c8d5" stroke-width="7" stroke-linecap="round">
      <path d="M625 308h-43M625 364h-43M625 420h-43M625 476h-43M625 532h-43M625 588h-43"/>
      <path d="M975 308h43M975 364h43M975 420h43M975 476h43M975 532h43M975 588h43"/>
