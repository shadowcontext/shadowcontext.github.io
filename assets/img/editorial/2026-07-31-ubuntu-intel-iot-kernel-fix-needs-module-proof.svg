    <circle cx="253" cy="446" r="12"/>
    <circle cx="325" cy="589" r="12"/>
    <circle cx="1312" cy="306" r="12"/>
    <circle cx="1347" cy="446" r="12"/>
    <circle cx="1275" cy="589" r="12"/>
  </g>
  <g fill="#66d9df" opacity="0.55">
