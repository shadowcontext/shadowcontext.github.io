<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified kernel transition for an industrial edge processor</title>
  <desc id="desc">An abstract blue industrial edge processor is encircled by a luminous reboot arc while amber and cyan module tiles reconnect around it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0a2940"/>
      <stop offset="1" stop-color="#06121f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#28c7d8" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#1688b7" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163f5d"/>
      <stop offset="0.48" stop-color="#0d2239"/>
      <stop offset="1" stop-color="#102d45"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52e0df"/>
      <stop offset="1" stop-color="#168ab8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd37a"/>
      <stop offset="1" stop-color="#ed8d32"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#5ac2d0" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="445" rx="590" ry="420" fill="url(#halo)"/>
  <path d="M118 730C326 605 402 716 595 618S918 527 1102 596s270 19 380-60" fill="none" stroke="#66d9df" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M102 766C329 651 431 777 609 676s308-98 494-21 291-5 401-68" fill="none" stroke="#ec9b47" stroke-opacity="0.09" stroke-width="2"/>

  <g fill="none" stroke-linecap="round">
    <path d="M443 644A410 410 0 0 1 1190 326" stroke="#163d57" stroke-width="22"/>
    <path d="M443 644A410 410 0 0 1 1171 298" stroke="url(#core)" stroke-width="8" filter="url(#glow)"/>
    <path d="M1160 263l43 47-63 12" stroke="#54dfe0" stroke-width="11" stroke-linejoin="round"/>
    <path d="M1157 271l36 39" stroke="#d4ffff" stroke-opacity="0.8" stroke-width="3"/>
  </g>

  <g stroke="#59c9d7" stroke-opacity="0.5" stroke-width="3" fill="none">
