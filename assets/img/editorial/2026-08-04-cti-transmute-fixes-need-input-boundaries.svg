<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Threat-intelligence inputs crossing protected validation boundaries</title>
  <desc id="desc">Polished abstract editorial artwork showing fragmented intelligence objects moving through layered amber and cyan gates toward a protected blue analysis core.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2340"/>
      <stop offset="1" stop-color="#123654"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="50%" r="48%">
      <stop offset="0" stop-color="#38d5df" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#177ca2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb84c"/>
      <stop offset="0.55" stop-color="#f6d66c"/>
      <stop offset="1" stop-color="#58e1dc"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7ef0e8"/>
      <stop offset="0.42" stop-color="#2db4cf"/>
      <stop offset="1" stop-color="#16658f"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="coreClip">
      <path d="M1164 270 L1377 393 L1377 639 L1164 762 L951 639 L951 393 Z"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
