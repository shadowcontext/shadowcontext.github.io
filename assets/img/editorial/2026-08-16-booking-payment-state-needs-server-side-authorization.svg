<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Booking payment state protected by an authorization boundary</title>
  <desc id="desc">Abstract booking tiles and a luminous payment token are separated from an incoming data stream by a layered authorization barrier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162b"/>
      <stop offset="0.55" stop-color="#102b43"/>
      <stop offset="1" stop-color="#081b2d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#54e5c2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#54e5c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff3d5"/>
      <stop offset="0.48" stop-color="#2fc4ba"/>
      <stop offset="1" stop-color="#16849e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183c59"/>
      <stop offset="1" stop-color="#0d283f"/>
    </linearGradient>
    <linearGradient id="token" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd477"/>
      <stop offset="1" stop-color="#f09146"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020a13" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#92bdd0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="810" cy="450" rx="620" ry="390" fill="url(#halo)" filter="url(#soft)"/>

  <g opacity="0.4" fill="none" stroke="#5b9fba" stroke-width="3">
    <path d="M80 234C238 234 263 310 406 310"/>
    <path d="M30 450C220 450 278 450 406 450"/>
    <path d="M96 680C254 680 284 588 406 588"/>
  </g>
  <g fill="#76d7d0">
    <circle cx="106" cy="234" r="8" opacity="0.58"/>
    <circle cx="54" cy="450" r="8" opacity="0.72"/>
    <circle cx="122" cy="680" r="8" opacity="0.48"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="164" width="438" height="572" rx="52" fill="#0a2339" stroke="#376b82" stroke-width="3"/>
    <g transform="translate(432 222)">
      <rect width="334" height="128" rx="24" fill="url(#card)" stroke="#4e8196" stroke-width="2"/>
      <circle cx="56" cy="52" r="17" fill="#56d9c2"/>
      <rect x="92" y="35" width="172" height="14" rx="7" fill="#a4d5dd" opacity="0.7"/>
      <rect x="92" y="65" width="116" height="11" rx="5.5" fill="#5f9eb2" opacity="0.72"/>
      <path d="M38 101H296" stroke="#37647a" stroke-width="2"/>
    </g>
    <g transform="translate(432 386)">
      <rect width="334" height="128" rx="24" fill="url(#card)" stroke="#4e8196" stroke-width="2"/>
      <circle cx="56" cy="52" r="17" fill="#69b8d4"/>
      <rect x="92" y="35" width="145" height="14" rx="7" fill="#a4d5dd" opacity="0.7"/>
      <rect x="92" y="65" width="190" height="11" rx="5.5" fill="#5f9eb2" opacity="0.72"/>
      <path d="M38 101H296" stroke="#37647a" stroke-width="2"/>
    </g>
    <g transform="translate(432 550)">
      <rect width="334" height="128" rx="24" fill="url(#card)" stroke="#4e8196" stroke-width="2"/>
      <circle cx="56" cy="52" r="17" fill="#4da7c0"/>
      <rect x="92" y="35" width="183" height="14" rx="7" fill="#a4d5dd" opacity="0.7"/>
      <rect x="92" y="65" width="132" height="11" rx="5.5" fill="#5f9eb2" opacity="0.72"/>
      <path d="M38 101H296" stroke="#37647a" stroke-width="2"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="806" y="116" width="64" height="668" rx="32" fill="#071b2c" stroke="#73efd4" stroke-width="3"/>
    <rect x="824" y="144" width="28" height="612" rx="14" fill="url(#gate)"/>
    <circle cx="838" cy="450" r="92" fill="#52dfc5" opacity="0.16" filter="url(#soft)"/>
    <circle cx="838" cy="450" r="46" fill="#09273b" stroke="#8ff5db" stroke-width="7"/>
    <path d="M821 449l12 13 25-29" fill="none" stroke="#d8fff5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M1030 232h336a56 56 0 0 1 56 56v324a56 56 0 0 1-56 56h-336a56 56 0 0 1-56-56V288a56 56 0 0 1 56-56Z" fill="#102f47" stroke="#4f8499" stroke-width="3"/>
    <path d="M1032 232h332a58 58 0 0 1 58 58v56H974v-56a58 58 0 0 1 58-58Z" fill="#17415b"/>
    <g fill="#8fbfcd" opacity="0.55">
      <circle cx="1036" cy="290" r="8"/>
      <circle cx="1070" cy="290" r="8"/>
      <circle cx="1104" cy="290" r="8"/>
    </g>
    <circle cx="1198" cy="492" r="112" fill="#071c2f" stroke="#396a80" stroke-width="3"/>
    <circle cx="1198" cy="492" r="76" fill="url(#token)"/>
    <circle cx="1198" cy="492" r="52" fill="none" stroke="#fff2c4" stroke-opacity="0.72" stroke-width="5"/>
    <path d="M1168 492h60M1198 462v60" stroke="#76492e" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
    <path d="M1052 615h292" stroke="#4c7a8d" stroke-width="12" stroke-linecap="round" opacity="0.42"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M870 386c54-50 72-60 112-72" stroke="#63d7ca" stroke-width="5" opacity="0.65"/>
    <path d="M870 514c62 46 84 54 124 64" stroke="#63d7ca" stroke-width="5" opacity="0.5"/>
  </g>
</svg>
