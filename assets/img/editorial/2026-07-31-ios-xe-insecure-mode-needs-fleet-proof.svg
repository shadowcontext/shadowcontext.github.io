<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Network hardening gates isolate a legacy configuration path</title>
  <desc id="desc">Abstract network nodes move through layered blue security gates while a single amber legacy path remains visibly separated for review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2e45"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#56d6d0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#56d6d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54d5d0"/>
      <stop offset="0.52" stop-color="#2387ae"/>
      <stop offset="1" stop-color="#155477"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd175"/>
      <stop offset="1" stop-color="#e5793d"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020a10" flood-opacity="0.55"/>
    </filter>
    <pattern id="mesh" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 45H90M45 0V90" stroke="#7fb5c9" stroke-opacity="0.055" stroke-width="1"/>
      <circle cx="45" cy="45" r="2.5" fill="#8fe3df" fill-opacity="0.1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="70" y="70" width="1460" height="760" rx="46"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="70" y="70" width="1460" height="760" rx="46" fill="#0a2234" stroke="#72cfd0" stroke-opacity="0.17" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect x="70" y="70" width="1460" height="760" fill="url(#mesh)"/>
    <ellipse cx="860" cy="430" rx="610" ry="430" fill="url(#glow)"/>
    <circle cx="265" cy="192" r="120" fill="#1fa8b0" opacity="0.12" filter="url(#soft)"/>
    <circle cx="1340" cy="710" r="165" fill="#2c77b8" opacity="0.15" filter="url(#soft)"/>

    <g opacity="0.34" fill="none" stroke="#77d7d2" stroke-width="3">
      <path d="M125 298C300 298 326 214 470 214"/>
      <path d="M125 450C300 450 326 450 470 450"/>
      <path d="M125 602C300 602 326 686 470 686"/>
      <path d="M1130 214C1274 214 1300 298 1475 298"/>
      <path d="M1130 450C1274 450 1300 450 1475 450"/>
      <path d="M1130 686C1274 686 1300 602 1475 602"/>
    </g>

    <g filter="url(#shadow)">
      <path d="M500 164L610 122L720 164V736L610 778L500 736Z" fill="#0b3651" stroke="#4bbdc4" stroke-opacity="0.58" stroke-width="4"/>
      <path d="M700 132L810 90L920 132V768L810 810L700 768Z" fill="#0b405b" stroke="#67dad3" stroke-opacity="0.72" stroke-width="4"/>
      <path d="M900 164L1010 122L1120 164V736L1010 778L900 736Z" fill="#0b3651" stroke="#4bbdc4" stroke-opacity="0.58" stroke-width="4"/>
    </g>

    <g fill="url(#gate)" opacity="0.92">
      <rect x="552" y="248" width="116" height="404" rx="58"/>
      <rect x="752" y="202" width="116" height="496" rx="58"/>
      <rect x="952" y="248" width="116" height="404" rx="58"/>
    </g>
    <g fill="#092539">
      <rect x="574" y="270" width="72" height="360" rx="36"/>
      <rect x="774" y="224" width="72" height="452" rx="36"/>
      <rect x="974" y="270" width="72" height="360" rx="36"/>
    </g>

    <g stroke="#99f0e7" stroke-width="4" fill="#123f57" filter="url(#shadow)">
      <circle cx="180" cy="298" r="24"/>
      <circle cx="260" cy="450" r="24"/>
      <circle cx="180" cy="602" r="24"/>
      <circle cx="1420" cy="298" r="24"/>
      <circle cx="1340" cy="450" r="24"/>
      <circle cx="1420" cy="602" r="24"/>
    </g>

    <g fill="#a5fff0">
      <circle cx="180" cy="298" r="7"/>
      <circle cx="260" cy="450" r="7"/>
      <circle cx="180" cy="602" r="7"/>
      <circle cx="1420" cy="298" r="7"/>
      <circle cx="1340" cy="450" r="7"/>
      <circle cx="1420" cy="602" r="7"/>
    </g>

    <path d="M130 690C335 690 396 744 520 744C650 744 685 724 800 724C915 724 950 744 1080 744C1204 744 1265 690 1470 690" fill="none" stroke="#e59b53" stroke-opacity="0.32" stroke-width="26"/>
    <path d="M130 690C335 690 396 744 520 744C650 744 685 724 800 724C915 724 950 744 1080 744C1204 744 1265 690 1470 690" fill="none" stroke="url(#amber)" stroke-width="6" stroke-dasharray="18 20"/>

    <g transform="translate(800 450)" filter="url(#shadow)">
      <path d="M0-112C68-86 112-62 112 6C112 92 62 142 0 174C-62 142-112 92-112 6C-112-62-68-86 0-112Z" fill="#0a2639" stroke="#8ceddf" stroke-width="7"/>
      <path d="M-45 12L-10 47L56-28" fill="none" stroke="#8ceddf" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(1180 690)" filter="url(#shadow)">
      <circle r="54" fill="#39271f" stroke="#f0a65d" stroke-width="5"/>
      <path d="M0-24V10M0 28V30" stroke="#ffd181" stroke-width="11" stroke-linecap="round"/>
    </g>
  </g>
</svg>
