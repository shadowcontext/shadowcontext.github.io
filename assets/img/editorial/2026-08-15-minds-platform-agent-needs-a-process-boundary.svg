<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI agent contained by layered process boundaries</title>
  <desc id="desc">An abstract luminous AI core sits inside layered blue containment shields while red network signals stop at the outer boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071428"/>
      <stop offset="0.52" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#06111e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#54e6ff" stop-opacity="0.42"/>
      <stop offset="0.44" stop-color="#1a8ad1" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#071428" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cf5ff" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#2d9fe8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3154a3" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbfcff"/>
      <stop offset="0.42" stop-color="#64e9ff"/>
      <stop offset="1" stop-color="#327be5"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6d72" stop-opacity="0.2"/>
      <stop offset="0.72" stop-color="#ff6d72"/>
      <stop offset="1" stop-color="#ffb079"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7bc9f4" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="815" cy="440" rx="610" ry="420" fill="url(#halo)"/>
  <path d="M800 93C1000 163 1155 183 1294 210v214c0 214-162 330-494 401C468 754 306 638 306 424V210c139-27 294-47 494-117Z" fill="#0d3355" fill-opacity="0.24" stroke="#4bbce9" stroke-opacity="0.24" stroke-width="3"/>
  <path d="M800 145c159 56 288 73 402 96v174c0 174-128 271-402 332-274-61-402-158-402-332V241c114-23 243-40 402-96Z" fill="url(#shield)" fill-opacity="0.16" stroke="#70d9f5" stroke-opacity="0.48" stroke-width="4"/>
  <path d="M800 211c112 40 205 53 289 71v129c0 128-89 203-289 254-200-51-289-126-289-254V282c84-18 177-31 289-71Z" fill="#123e67" fill-opacity="0.42" stroke="#70e4ff" stroke-opacity="0.72" stroke-width="5"/>
  <g opacity="0.9">
    <path d="M70 286h230l88 70" fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round"/>
    <path d="M26 449h278l78-18" fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round"/>
    <path d="M96 640h210l91-79" fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="70" cy="286" r="9" fill="#ff7478"/><circle cx="26" cy="449" r="9" fill="#ff7478"/><circle cx="96" cy="640" r="9" fill="#ff7478"/>
    <circle cx="388" cy="356" r="15" fill="#ff9a77" filter="url(#glow)"/>
    <circle cx="382" cy="431" r="15" fill="#ff9a77" filter="url(#glow)"/>
    <circle cx="397" cy="561" r="15" fill="#ff9a77" filter="url(#glow)"/>
  </g>
  <g opacity="0.45">
    <path d="M1525 236h-222l-96 78" fill="none" stroke="#508fbd" stroke-width="4"/>
    <path d="M1570 520h-275l-91-42" fill="none" stroke="#508fbd" stroke-width="4"/>
    <path d="M1498 704h-197l-108-91" fill="none" stroke="#508fbd" stroke-width="4"/>
    <circle cx="1525" cy="236" r="7" fill="#78c9ef"/><circle cx="1570" cy="520" r="7" fill="#78c9ef"/><circle cx="1498" cy="704" r="7" fill="#78c9ef"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="800" cy="430" r="118" fill="#2a9ee4" fill-opacity="0.16" stroke="#91efff" stroke-width="4"/>
    <path d="M800 326l91 52v104l-91 52-91-52V378Z" fill="url(#core)" fill-opacity="0.92"/>
  </g>
  <g fill="#092039" stroke="#c7faff" stroke-width="5">
    <circle cx="800" cy="384" r="15"/>
    <circle cx="757" cy="455" r="15"/>
    <circle cx="843" cy="455" r="15"/>
    <path d="M800 399v27m-31 21 22-14m40 14-22-14" fill="none" stroke-linecap="round"/>
  </g>
  <ellipse cx="800" cy="767" rx="255" ry="26" fill="#4bc9ff" fill-opacity="0.13" filter="url(#soft)"/>
  <g fill="none" stroke="#8ee9ff" stroke-linecap="round">
    <path d="M594 700c-62-35-111-81-145-137" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M1006 700c62-35 111-81 145-137" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M553 245c66-48 145-79 247-100" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
