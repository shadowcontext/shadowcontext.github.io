<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified mobile browser security update</title>
  <desc id="desc">An abstract mobile browser panel is protected by layered blue shields as update tiles converge along two managed device paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162d"/>
      <stop offset="0.52" stop-color="#102b4c"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#3bd4d7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3bd4d7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f7ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#5a87b5" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6ff7e8"/>
      <stop offset="0.52" stop-color="#25b8dc"/>
      <stop offset="1" stop-color="#3974ef"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ef8ef" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4488ff" stop-opacity=".68"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020915" flood-opacity=".65"/>
    </filter>
  </defs>
