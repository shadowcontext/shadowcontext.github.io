<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Identity binding across secure building-automation channels</title>
  <desc id="desc">Abstract building-automation nodes joined by teal secure channels while a luminous binding ring blocks an amber identity path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071523"/>
      <stop offset="0.55" stop-color="#0b2633"/>
      <stop offset="1" stop-color="#102238"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#42e8da" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#2aa5b6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#071523" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bafcf4" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#3bcfc8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3b7db4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="channel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36a9c6" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#72f5dc" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#318cb7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8f4a" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#ffad5b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd28a"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8be8e1" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="440" rx="620" ry="400" fill="url(#halo)"/>
  <g opacity="0.28" filter="url(#blur)">
    <circle cx="355" cy="235" r="85" fill="#2ab8cc"/>
    <circle cx="1285" cy="650" r="95" fill="#2877b2"/>
  </g>

  <g fill="url(#glass)" stroke="#93f5e9" stroke-opacity="0.28" stroke-width="2">
    <path d="M145 650V405l165-96 165 96v245z"/>
    <path d="M1125 630V340l165-96 165 96v290z"/>
    <rect x="514" y="214" width="184" height="160" rx="25" transform="rotate(-7 606 294)"/>
    <rect x="886" y="571" width="184" height="160" rx="25" transform="rotate(8 978 651)"/>
  </g>
  <g fill="#7cf3e3" fill-opacity="0.18">
    <rect x="196" y="426" width="56" height="70" rx="8"/><rect x="286" y="426" width="56" height="70" rx="8"/><rect x="376" y="426" width="56" height="70" rx="8"/>
    <rect x="196" y="530" width="56" height="70" rx="8"/><rect x="286" y="530" width="56" height="70" rx="8"/><rect x="376" y="530" width="56" height="70" rx="8"/>
    <rect x="1170" y="371" width="48" height="58" rx="8"/><rect x="1243" y="371" width="48" height="58" rx="8"/><rect x="1316" y="371" width="48" height="58" rx="8"/><rect x="1389" y="371" width="28" height="58" rx="8"/>
    <rect x="1170" y="458" width="48" height="58" rx="8"/><rect x="1243" y="458" width="48" height="58" rx="8"/><rect x="1316" y="458" width="48" height="58" rx="8"/><rect x="1389" y="458" width="28" height="58" rx="8"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M435 472C585 350 673 345 790 438S1017 557 1166 464" stroke="#17657a" stroke-width="48" stroke-opacity="0.18"/>
    <path d="M435 472C585 350 673 345 790 438S1017 557 1166 464" stroke="url(#channel)" stroke-width="12"/>
    <path d="M598 303C698 327 734 372 790 438" stroke="url(#channel)" stroke-width="8"/>
    <path d="M981 650C948 573 894 501 790 438" stroke="url(#channel)" stroke-width="8"/>
    <path d="M65 186C282 174 413 237 538 339S685 411 735 426" stroke="url(#amber)" stroke-width="11"/>
  </g>

  <g transform="translate(790 438)">
    <circle r="150" fill="#092736" fill-opacity="0.83" stroke="#4de1d3" stroke-opacity="0.22" stroke-width="26"/>
    <circle r="112" fill="none" stroke="#7ff8e8" stroke-width="9" filter="url(#glow)"/>
    <circle r="74" fill="#153c4b" stroke="#b5fff3" stroke-opacity="0.72" stroke-width="3"/>
    <path d="M-33-10v-22c0-42 66-42 66 0v22" fill="none" stroke="#b8fff2" stroke-width="13" stroke-linecap="round"/>
    <rect x="-50" y="-10" width="100" height="76" rx="20" fill="#50ddce" fill-opacity="0.18" stroke="#b8fff2" stroke-width="4"/>
    <circle cy="23" r="10" fill="#d2fff8"/>
    <path d="M0 33v15" stroke="#d2fff8" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g fill="#c8fff7" filter="url(#glow)">
    <circle cx="435" cy="472" r="13"/><circle cx="598" cy="303" r="11"/><circle cx="981" cy="650" r="11"/><circle cx="1166" cy="464" r="13"/>
  </g>
  <g fill="#ffbc70">
    <circle cx="554" cy="351" r="8"/><circle cx="653" cy="401" r="7"/><circle cx="713" cy="422" r="6"/>
  </g>
  <path d="M708 381l48 29-17 67-56-14-7-51z" fill="#ff9f53" fill-opacity="0.13" stroke="#ffbb73" stroke-width="3" stroke-opacity="0.8"/>
  <g fill="none" stroke="#76eadf" stroke-opacity="0.14" stroke-width="2">
    <circle cx="310" cy="482" r="232"/><circle cx="1290" cy="468" r="236"/>
  </g>
</svg>
