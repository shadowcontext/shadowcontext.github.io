<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Computer-use control surface contained by a network boundary</title>
  <desc id="desc">Abstract violet computer-control panels sit inside a luminous cyan loopback boundary, while amber external paths terminate at a protected perimeter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d24"/>
      <stop offset="0.52" stop-color="#17143d"/>
      <stop offset="1" stop-color="#071b2b"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#6547d9" stop-opacity=".38"/>
      <stop offset=".62" stop-color="#16d6d1" stop-opacity=".10"/>
      <stop offset="1" stop-color="#16d6d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="270" y1="190" x2="1270" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55f2e7"/>
      <stop offset=".52" stop-color="#42bfe8"/>
      <stop offset="1" stop-color="#8068ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7058d7" stop-opacity=".72"/>
      <stop offset="1" stop-color="#251f63" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff9e43" stop-opacity="0"/>
      <stop offset=".75" stop-color="#ffb14f"/>
      <stop offset="1" stop-color="#ffd18c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#91a2de" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="445" rx="610" ry="395" fill="url(#aura)"/>
  <ellipse cx="800" cy="450" rx="500" ry="320" fill="none" stroke="#26dcd6" stroke-opacity=".18" stroke-width="50" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M0 278H205c67 0 72 91 137 91h61" stroke="url(#amber)" stroke-width="10"/>
    <path d="M0 633h214c59 0 76-78 132-78h62" stroke="url(#amber)" stroke-width="7"/>
    <path d="M1600 243h-201c-73 0-74 101-145 101h-58" stroke="url(#amber)" stroke-width="8" transform="rotate(180 800 443.5)"/>
    <path d="M1600 670h-227c-50 0-68-72-122-72h-55" stroke="url(#amber)" stroke-width="11" transform="rotate(180 800 443.5)"/>
  </g>

  <g fill="#ffc36d" filter="url(#glow)">
    <circle cx="403" cy="369" r="9"/>
    <circle cx="408" cy="555" r="8"/>
    <circle cx="1196" cy="543" r="9"/>
    <circle cx="1196" cy="289" r="8"/>
  </g>

  <rect x="385" y="125" width="830" height="650" rx="280" fill="#0a1730" fill-opacity=".54" stroke="url(#ring)" stroke-width="8"/>
  <rect x="410" y="150" width="780" height="600" rx="255" fill="none" stroke="#88fff6" stroke-opacity=".18" stroke-width="2"/>

  <g transform="translate(535 250)">
    <rect width="530" height="392" rx="46" fill="url(#panel)" stroke="#9a8aff" stroke-opacity=".5" stroke-width="3"/>
    <rect x="30" y="28" width="470" height="270" rx="25" fill="#0c1430" stroke="#54ddd7" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="64" cy="61" r="7" fill="#55f2e7"/>
    <circle cx="89" cy="61" r="7" fill="#8371ff"/>
    <circle cx="114" cy="61" r="7" fill="#ffba62"/>
    <path d="M72 123h151M72 165h286M72 207h215M72 249h334" stroke="#a9b7ee" stroke-opacity=".38" stroke-width="12" stroke-linecap="round"/>
    <path d="M72 123h82M72 165h142M72 207h103M72 249h190" stroke="#52e7df" stroke-opacity=".9" stroke-width="12" stroke-linecap="round"/>
    <rect x="191" y="326" width="148" height="26" rx="13" fill="#111b3c" stroke="#5cece3" stroke-opacity=".55"/>
  </g>

  <g fill="none" stroke="url(#ring)" stroke-width="5" filter="url(#glow)">
    <path d="M800 197v-42"/>
    <path d="M800 745v-42"/>
    <path d="M352 450h43"/>
    <path d="M1205 450h43"/>
  </g>
  <g fill="#60eee6">
    <circle cx="800" cy="155" r="8"/>
    <circle cx="800" cy="745" r="8"/>
    <circle cx="352" cy="450" r="8"/>
    <circle cx="1248" cy="450" r="8"/>
  </g>
  <path d="M1095 700c79-34 139-92 174-168" fill="none" stroke="#8a78ff" stroke-opacity=".34" stroke-width="3"/>
  <path d="M505 199c-73 35-128 90-164 165" fill="none" stroke="#54e4dc" stroke-opacity=".3" stroke-width="3"/>
</svg>
