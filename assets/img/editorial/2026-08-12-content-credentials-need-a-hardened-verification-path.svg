<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hardened content credential verification</title>
  <desc id="desc">An abstract media tile moves through a luminous provenance verifier as malformed fragments are deflected into a dark boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102d46"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55efd1" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#36aee8" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#36aee8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fff8"/>
      <stop offset="0.45" stop-color="#63d9e8"/>
      <stop offset="1" stop-color="#3471c6"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38a8d8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#b8fff0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#38a8d8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="verified" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19487d"/>
      <stop offset="1" stop-color="#78f4d8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="226" y="258" width="430" height="330" rx="38"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="810" cy="455" rx="500" ry="390" fill="url(#aura)"/>
  <path d="M0 695 C330 600 510 740 820 680 S1300 580 1600 675 V900 H0Z" fill="#06101c" opacity="0.7"/>
  <g opacity="0.14" fill="none" stroke="#8fe9e0" stroke-width="2">
    <path d="M82 172 C320 86 493 139 638 255"/>
    <path d="M1015 173 C1225 100 1400 170 1540 320"/>
    <path d="M1054 731 C1232 801 1413 773 1554 657"/>
  </g>

  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="780" cy="730" rx="340" ry="54" fill="#2bbcae"/>
  </g>

  <g transform="rotate(-7 441 423)">
    <rect x="226" y="258" width="430" height="330" rx="38" fill="url(#tile)" opacity="0.97"/>
    <g clip-path="url(#tileClip)">
      <circle cx="337" cy="349" r="52" fill="#f2fff6" opacity="0.9"/>
      <path d="M185 574 L363 394 L462 493 L545 418 L704 589Z" fill="#175b87" opacity="0.78"/>
      <path d="M203 595 L393 466 L503 545 L611 447 L719 611Z" fill="#0d345d" opacity="0.63"/>
      <g opacity="0.55" stroke="#ffffff" stroke-width="5" fill="none">
        <path d="M267 302 H425"/>
        <path d="M267 323 H380"/>
      </g>
    </g>
    <rect x="226" y="258" width="430" height="330" rx="38" fill="none" stroke="#d7fff5" stroke-width="4" opacity="0.65"/>
    <g fill="#dffdf7">
      <circle cx="625" cy="292" r="7"/>
      <circle cx="603" cy="292" r="7" opacity="0.65"/>
      <circle cx="581" cy="292" r="7" opacity="0.4"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <path d="M755 168 C842 207 897 301 897 442 C897 598 839 696 755 735 C671 696 613 598 613 442 C613 301 668 207 755 168Z" fill="#143853" stroke="url(#gate)" stroke-width="14"/>
    <path d="M755 266 C800 295 826 354 826 445 C826 539 799 602 755 630 C711 602 684 539 684 445 C684 354 710 295 755 266Z" fill="#061522" stroke="#8ff9df" stroke-width="8"/>
    <path d="M755 336 C782 357 797 394 797 445 C797 498 781 535 755 554 C729 535 713 498 713 445 C713 394 728 357 755 336Z" fill="#a5ffea" opacity="0.72"/>
  </g>

  <g opacity="0.9">
    <path d="M620 346 l-54 -30 l13 61 l-46 35 l66 5Z" fill="#f4a562"/>
    <path d="M612 493 l-74 18 l52 42 l-23 59 l69 -31Z" fill="#d76577"/>
    <path d="M658 626 l-45 39 l57 11 l12 55 l36 -52Z" fill="#efb65d"/>
    <path d="M558 386 C506 360 472 345 427 336" fill="none" stroke="#e98f75" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 15"/>
    <path d="M548 527 C495 549 458 573 423 607" fill="none" stroke="#e98f75" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 15"/>
  </g>

  <g transform="rotate(6 1115 442)">
    <rect x="924" y="282" width="382" height="320" rx="38" fill="url(#verified)" opacity="0.94"/>
    <rect x="944" y="302" width="342" height="280" rx="26" fill="#0b2942" opacity="0.7"/>
    <circle cx="1116" cy="436" r="91" fill="none" stroke="#9ffff0" stroke-width="8" opacity="0.9"/>
    <path d="M1069 438 l31 31 l67 -75" fill="none" stroke="#b9fff1" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#8be8dc" opacity="0.7">
      <rect x="986" y="533" width="112" height="9" rx="4.5"/>
      <rect x="1112" y="533" width="92" height="9" rx="4.5"/>
      <rect x="1218" y="533" width="35" height="9" rx="4.5"/>
    </g>
    <rect x="924" y="282" width="382" height="320" rx="38" fill="none" stroke="#9ffff0" stroke-width="4" opacity="0.6"/>
  </g>

  <g fill="#aef9eb" opacity="0.38">
    <circle cx="1366" cy="236" r="5"/>
    <circle cx="1406" cy="270" r="3"/>
    <circle cx="1341" cy="674" r="4"/>
    <circle cx="1275" cy="716" r="6"/>
    <circle cx="188" cy="669" r="4"/>
  </g>
</svg>
