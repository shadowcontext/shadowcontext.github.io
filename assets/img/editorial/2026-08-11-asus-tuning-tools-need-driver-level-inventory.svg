    <rect x="941" y="355" width="38" height="50" rx="11" transform="rotate(44 960 380)"/>
    <rect x="621" y="535" width="38" height="50" rx="11" transform="rotate(44 640 560)"/>
    <rect x="941" y="535" width="38" height="50" rx="11" transform="rotate(-44 960 560)"/>
  </g>

  <g opacity="0.72" fill="#74D9DE">
    <circle cx="120" cy="455" r="5"/><circle cx="1480" cy="455" r="5"/>
    <circle cx="535" cy="130" r="4"/><circle cx="1065" cy="130" r="4"/>
    <circle cx="535" cy="786" r="4"/><circle cx="1065" cy="786" r="4"/>
  </g>
</svg>
