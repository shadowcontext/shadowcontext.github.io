<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected shared connection boundary</title>
  <desc id="desc">Abstract cyan and violet request streams curve around a dark shared connection pool while an amber shield blocks a magenta stream from crossing between them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="0.48" stop-color="#101a39"/>
      <stop offset="1" stop-color="#050a18"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#3158a9" stop-opacity=".34"/>
      <stop offset=".58" stop-color="#162c62" stop-opacity=".16"/>
      <stop offset="1" stop-color="#071226" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".08"/>
      <stop offset=".42" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".1"/>
      <stop offset=".48" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".52" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="poison" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".15"/>
      <stop offset=".52" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#c026d3" stop-opacity=".05"/>
    </linearGradient>
    <filter id="glowCyan" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1" fill="#dbeafe" opacity=".09"/>
      <circle cx="27" cy="25" r=".8" fill="#a5b4fc" opacity=".07"/>
    </pattern>
    <clipPath id="poolClip">
      <ellipse cx="800" cy="450" rx="300" ry="205"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <ellipse cx="800" cy="735" rx="410" ry="68" fill="#020617" opacity=".55" filter="url(#soft)"/>
  <ellipse cx="800" cy="450" rx="326" ry="230" fill="#16264b" opacity=".36"/>
  <ellipse cx="800" cy="450" rx="303" ry="208" fill="#030712" stroke="#334b78" stroke-width="3"/>
  <ellipse cx="800" cy="450" rx="269" ry="176" fill="#0b1730" stroke="#1e3a5f" stroke-width="2"/>

  <g clip-path="url(#poolClip)" opacity=".78">
    <path d="M455 338 C600 302 673 370 800 354 C934 337 1000 279 1158 328" fill="none" stroke="url(#cyan)" stroke-width="46"/>
    <path d="M447 535 C591 578 686 506 800 532 C924 560 1033 621 1168 553" fill="none" stroke="url(#violet)" stroke-width="50"/>
    <path d="M481 424 C615 405 674 461 788 447 C905 433 1011 390 1125 419" fill="none" stroke="#1d4ed8" stroke-opacity=".34" stroke-width="17"/>
    <g fill="#dbeafe">
      <circle cx="612" cy="341" r="8" opacity=".8"/>
      <circle cx="711" cy="360" r="5" opacity=".58"/>
      <circle cx="912" cy="335" r="7" opacity=".72"/>
      <circle cx="635" cy="545" r="7" opacity=".68"/>
      <circle cx="748" cy="521" r="5" opacity=".5"/>
      <circle cx="976" cy="570" r="8" opacity=".76"/>
    </g>
  </g>

  <path d="M80 286 C246 284 350 318 502 349" fill="none" stroke="url(#cyan)" stroke-width="24" stroke-linecap="round" filter="url(#glowCyan)"/>
  <path d="M82 610 C257 610 368 575 508 536" fill="none" stroke="url(#violet)" stroke-width="25" stroke-linecap="round"/>
  <path d="M1098 344 C1242 312 1348 286 1524 286" fill="none" stroke="url(#cyan)" stroke-width="24" stroke-linecap="round"/>
  <path d="M1094 550 C1244 591 1351 614 1522 610" fill="none" stroke="url(#violet)" stroke-width="25" stroke-linecap="round"/>

  <g opacity=".85">
    <circle cx="150" cy="286" r="13" fill="#67e8f9"/>
    <circle cx="274" cy="299" r="8" fill="#bae6fd"/>
    <circle cx="1430" cy="291" r="11" fill="#38bdf8"/>
    <circle cx="151" cy="609" r="12" fill="#c4b5fd"/>
    <circle cx="306" cy="593" r="7" fill="#a78bfa"/>
    <circle cx="1445" cy="610" r="12" fill="#a78bfa"/>
  </g>

  <path d="M190 427 C375 421 512 417 687 444 C774 457 858 494 952 524 C1054 556 1162 559 1404 514"
        fill="none" stroke="url(#poison)" stroke-width="28" stroke-linecap="round" filter="url(#glowCyan)"/>
  <path d="M195 427 C396 424 541 417 699 446" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(800 452)" filter="url(#glowAmber)">
    <path d="M0-142 C58-116 110-108 142-103 V-5 C142 94 80 153 0 188 C-80 153-142 94-142-5 V-103 C-110-108-58-116 0-142Z"
          fill="#111827" fill-opacity=".88" stroke="url(#amber)" stroke-width="12"/>
    <path d="M0-108 C42-89 81-83 106-79 V-8 C106 65 62 108 0 139 C-62 108-106 65-106-8 V-79 C-81-83-42-89 0-108Z"
          fill="url(#amber)" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".5" stroke-width="3"/>
    <path d="M-50 3 L-13 40 L60-42" fill="none" stroke="#fef3c7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M682 445 C719 449 746 457 769 468" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <path d="M835 502 C946 552 1074 569 1403 514" fill="none" stroke="#c026d3" stroke-opacity=".16" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 18"/>

  <g fill="none" stroke="#93c5fd" stroke-opacity=".18">
    <ellipse cx="800" cy="450" rx="365" ry="258" stroke-width="2"/>
    <ellipse cx="800" cy="450" rx="418" ry="299" stroke-width="1"/>
  </g>
</svg>
