<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified retrieval trail connecting search to cited evidence</title>
  <desc id="desc">An abstract blue search trail passes through a luminous verification aperture before connecting to a gold evidence node, while an unverified magenta path is diverted away.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172e"/>
      <stop offset="0.55" stop-color="#102d4a"/>
      <stop offset="1" stop-color="#071220"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#61e6ff" stop-opacity="0.45"/>
      <stop offset="0.48" stop-color="#2a9fc6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b2037" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e7fae"/>
      <stop offset="0.62" stop-color="#65eaff"/>
      <stop offset="1" stop-color="#f8d77a"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset="0.45" stop-color="#52d7ef"/>
      <stop offset="1" stop-color="#16729d"/>
    </linearGradient>
    <linearGradient id="falseTrail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4cc5" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ea5b9d" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="11" r="1.2" fill="#b9efff" opacity="0.12"/>
      <circle cx="35" cy="29" r="0.9" fill="#ffffff" opacity="0.08"/>
      <circle cx="20" cy="43" r="0.7" fill="#72b6d4" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="875" cy="448" rx="500" ry="430" fill="url(#halo)"/>
  <path d="M0 760 C300 630 400 820 720 712 C1010 614 1200 660 1600 520 L1600 900 L0 900Z" fill="#081729" opacity="0.85"/>
  <path d="M0 180 C320 300 520 80 830 196 C1110 300 1350 140 1600 238" fill="none" stroke="#28789c" stroke-width="2" opacity="0.28"/>

  <g opacity="0.55">
    <circle cx="182" cy="456" r="112" fill="#0f3151" stroke="#297ea3" stroke-width="3"/>
    <circle cx="182" cy="456" r="77" fill="none" stroke="#3f9dc0" stroke-width="2" stroke-dasharray="7 15"/>
    <circle cx="182" cy="456" r="28" fill="#52cde4" opacity="0.8"/>
    <circle cx="118" cy="392" r="10" fill="#77ddf0"/>
    <circle cx="250" cy="414" r="8" fill="#77ddf0"/>
    <circle cx="238" cy="516" r="12" fill="#77ddf0"/>
  </g>

  <path d="M278 456 C430 456 492 398 620 420 C700 434 742 450 822 450 C938 450 1010 450 1124 450" fill="none" stroke="#1a6086" stroke-width="40" stroke-linecap="round" opacity="0.5" filter="url(#soft)"/>
  <path d="M278 456 C430 456 492 398 620 420 C700 434 742 450 822 450 C938 450 1010 450 1124 450" fill="none" stroke="url(#trail)" stroke-width="13" stroke-linecap="round"/>
  <g fill="#baf5ff" opacity="0.9">
    <circle cx="402" cy="443" r="7"/><circle cx="512" cy="410" r="7"/><circle cx="626" cy="421" r="7"/><circle cx="728" cy="444" r="7"/>
  </g>

  <g transform="translate(812 450)" filter="url(#glow)">
    <ellipse rx="76" ry="166" fill="#0a2840" stroke="url(#gate)" stroke-width="13"/>
    <ellipse rx="39" ry="126" fill="#071c31" stroke="#aaf6ff" stroke-width="3" opacity="0.95"/>
    <path d="M-17 3 L-3 18 L24 -22" fill="none" stroke="#dfffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1260 450)">
    <circle r="154" fill="#0a1f35" stroke="#756334" stroke-width="3"/>
    <circle r="118" fill="#132d42" stroke="#f2ce70" stroke-width="8"/>
    <circle r="75" fill="#f1c75f" opacity="0.12"/>
    <path d="M-44 -25 H48 M-44 0 H31 M-44 25 H55" stroke="#ffe6a3" stroke-width="12" stroke-linecap="round"/>
    <circle r="132" fill="none" stroke="#f7d77d" stroke-width="2" stroke-dasharray="5 18" opacity="0.7"/>
  </g>

  <path d="M340 620 C540 602 636 625 720 684 C786 731 884 754 982 730" fill="none" stroke="url(#falseTrail)" stroke-width="14" stroke-linecap="round"/>
  <path d="M962 698 L1002 730 L960 762" fill="none" stroke="#d85a99" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <g opacity="0.42">
    <circle cx="454" cy="612" r="7" fill="#b796ff"/>
    <circle cx="575" cy="616" r="7" fill="#b796ff"/>
    <circle cx="684" cy="660" r="7" fill="#b796ff"/>
  </g>

  <g fill="none" stroke="#57bdd8" opacity="0.2">
    <rect x="1040" y="144" width="300" height="86" rx="43" stroke-width="3"/>
    <rect x="1090" y="678" width="286" height="82" rx="41" stroke-width="3"/>
    <path d="M1130 186 H1285 M1175 719 H1320" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
