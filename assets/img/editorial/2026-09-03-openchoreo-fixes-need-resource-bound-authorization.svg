<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Authorization boundary around a layered cloud control plane</title>
  <desc id="desc">Abstract editorial artwork showing an external amber path stopped at a luminous cyan boundary protecting layered violet and blue platform components.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.48" stop-color="#11193a"/>
      <stop offset="1" stop-color="#081a2b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#37d7e8" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#6b5cff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#07101f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78f3ee"/>
      <stop offset="0.55" stop-color="#2fc8e2"/>
      <stop offset="1" stop-color="#6382ff"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a77ff"/>
      <stop offset="1" stop-color="#4054bc"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb65c"/>
      <stop offset="1" stop-color="#ffdf8b"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#83b8d8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="890" cy="445" rx="590" ry="390" fill="url(#halo)"/>
  <circle cx="1320" cy="180" r="150" fill="#4e4bdf" opacity="0.12" filter="url(#soft)"/>
  <circle cx="270" cy="720" r="190" fill="#16bfd0" opacity="0.09" filter="url(#soft)"/>

  <g opacity="0.8">
    <path d="M102 243C245 243 286 309 391 309" fill="none" stroke="url(#edge)" stroke-width="16" stroke-linecap="round"/>
    <path d="M102 243C245 243 286 309 391 309" fill="none" stroke="#ffd58a" stroke-opacity="0.2" stroke-width="42" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="104" cy="243" r="25" fill="#ffbf64"/>
    <circle cx="104" cy="243" r="46" fill="none" stroke="#ffbf64" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M152 225l20 18-20 18" fill="none" stroke="#fff0ba" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M225 225l20 18-20 18" fill="none" stroke="#fff0ba" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(398 104)">
    <path d="M442 25C593 102 731 116 846 142v233c0 205-150 333-404 410C188 708 38 580 38 375V142C153 116 291 102 442 25Z" fill="#0a1730" fill-opacity="0.94" stroke="url(#shield)" stroke-width="12"/>
    <path d="M442 66c132 64 251 78 352 101v202c0 171-125 280-352 352C215 649 90 540 90 369V167c101-23 220-37 352-101Z" fill="none" stroke="#69e6ea" stroke-opacity="0.32" stroke-width="3"/>
    <path d="M442 25C593 102 731 116 846 142" fill="none" stroke="#b7ffff" stroke-opacity="0.65" stroke-width="9" filter="url(#glow)"/>

    <g transform="translate(177 190)">
      <path d="M265 0l265 116-265 116L0 116 265 0Z" fill="url(#plane)" opacity="0.94"/>
      <path d="M0 116v76l265 116 265-116v-76L265 232 0 116Z" fill="#26377e"/>
      <path d="M35 205l230 101 230-101v69L265 375 35 274v-69Z" fill="#172856" stroke="#6e79d9" stroke-opacity="0.7" stroke-width="3"/>
      <path d="M70 287l195 86 195-86v69l-195 87-195-87v-69Z" fill="#10203e" stroke="#48bfd6" stroke-opacity="0.75" stroke-width="3"/>

      <g fill="#121c43" stroke="#d2c6ff" stroke-opacity="0.75" stroke-width="3">
        <path d="M90 98l90-39 90 39-90 40-90-40Z"/>
        <path d="M273 98l90-39 90 39-90 40-90-40Z"/>
        <path d="M182 154l83-37 83 37-83 37-83-37Z"/>
      </g>
      <g fill="#8d7dff">
        <circle cx="180" cy="98" r="13"/>
        <circle cx="363" cy="98" r="13"/>
        <circle cx="265" cy="154" r="13"/>
      </g>
      <g fill="none" stroke="#6de8eb" stroke-width="5" stroke-linecap="round">
        <path d="M180 112v37l85 37"/>
        <path d="M363 112v37l-98 37"/>
      </g>
    </g>

    <g transform="translate(134 344)" filter="url(#glow)">
      <circle cx="0" cy="0" r="42" fill="#09172a" stroke="#7af3ef" stroke-width="9"/>
      <path d="M-15 1l11 12 23-28" fill="none" stroke="#c6fffa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g opacity="0.55" fill="none" stroke="#65dfe8" stroke-width="3">
    <path d="M1312 288h152v106"/>
    <circle cx="1464" cy="416" r="20"/>
    <path d="M1270 658h184v-92"/>
    <circle cx="1454" cy="544" r="20"/>
  </g>
  <g fill="#6de9e9">
    <circle cx="1312" cy="288" r="7"/>
    <circle cx="1270" cy="658" r="7"/>
  </g>
</svg>
