<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Service paths restored by a protected update</title>
  <desc id="desc">Abstract blue service corridors reconnect through a protected amber update ring around a modular system grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071225"/>
      <stop offset="0.52" stop-color="#102a4a"/>
      <stop offset="1" stop-color="#06111d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7bb55" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#f09b38" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f09b38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4477db" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#7cd8ff"/>
      <stop offset="1" stop-color="#75f3dc" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.48" stop-color="#f5ad43"/>
      <stop offset="1" stop-color="#c9682b"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#91bde5" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="450" rx="430" ry="390" fill="url(#halo)"/>

  <g fill="none" stroke="url(#path)" stroke-linecap="round">
    <path d="M90 220H355C452 220 470 340 575 340H662" stroke-width="18"/>
    <path d="M55 450H655" stroke-width="24"/>
    <path d="M90 680H355C452 680 470 560 575 560H662" stroke-width="18"/>
    <path d="M945 340H1030C1134 340 1152 220 1248 220H1510" stroke-width="18"/>
    <path d="M945 450H1545" stroke-width="24"/>
    <path d="M945 560H1030C1134 560 1152 680 1248 680H1510" stroke-width="18"/>
  </g>

  <g fill="#81d9ff" filter="url(#glow)">
    <circle cx="110" cy="220" r="10"/><circle cx="75" cy="450" r="12"/><circle cx="110" cy="680" r="10"/>
    <circle cx="1490" cy="220" r="10"/><circle cx="1525" cy="450" r="12"/><circle cx="1490" cy="680" r="10"/>
  </g>
  <g fill="#a5e9ff" opacity="0.75">
    <rect x="245" y="202" width="44" height="36" rx="10"/><rect x="355" y="432" width="48" height="36" rx="10"/><rect x="245" y="662" width="44" height="36" rx="10"/>
    <rect x="1310" y="202" width="44" height="36" rx="10"/><rect x="1198" y="432" width="48" height="36" rx="10"/><rect x="1310" y="662" width="44" height="36" rx="10"/>
  </g>

  <circle cx="800" cy="450" r="206" fill="#0b1d32" stroke="url(#ring)" stroke-width="24" filter="url(#glow)"/>
  <circle cx="800" cy="450" r="164" fill="#112e4b" stroke="#ffd78a" stroke-opacity="0.45" stroke-width="3"/>
  <g transform="translate(692 342)">
    <rect width="216" height="216" rx="42" fill="#0a1c31" stroke="#89dff4" stroke-width="5"/>
    <g fill="#52b6d7">
      <circle cx="52" cy="52" r="21"/><circle cx="108" cy="52" r="21"/><circle cx="164" cy="52" r="21"/>
      <circle cx="52" cy="108" r="21"/><circle cx="108" cy="108" r="21" fill="#f5ad43"/><circle cx="164" cy="108" r="21"/>
      <circle cx="52" cy="164" r="21"/><circle cx="108" cy="164" r="21"/><circle cx="164" cy="164" r="21"/>
    </g>
    <g fill="none" stroke="#8ce8ef" stroke-width="4" opacity="0.7">
      <path d="M52 52H164M52 108H164M52 164H164M52 52V164M108 52V164M164 52V164"/>
    </g>
  </g>

  <g fill="none" stroke="#ffd181" stroke-width="7" stroke-linecap="round">
    <path d="M682 258L721 221L758 258"/><path d="M842 642L879 679L918 642"/>
  </g>
  <g opacity="0.28" fill="none" stroke="#74d8f2" stroke-width="2">
    <circle cx="800" cy="450" r="278" stroke-dasharray="9 18"/>
    <circle cx="800" cy="450" r="330" stroke-dasharray="2 24"/>
  </g>
</svg>
