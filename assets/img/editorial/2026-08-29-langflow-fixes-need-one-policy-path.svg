<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Five workflow paths protected by one policy boundary</title>
  <desc id="desc">Abstract editorial image of a faceted AI workflow core, five distinct data paths, and a luminous unified boundary that permits controlled routes while containing untrusted branches.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.52" stop-color="#121a35"/>
      <stop offset="1" stop-color="#102b3b"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a6df2" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#26d7cc" stop-opacity=".12"/>
      <stop offset="1" stop-color="#26d7cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b78ff"/>
      <stop offset=".5" stop-color="#3e77d8"/>
      <stop offset="1" stop-color="#20cfc7"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b70f0" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#9afcf0"/>
      <stop offset="1" stop-color="#27d6cc" stop-opacity=".4"/>
    </linearGradient>
    <pattern id="mesh" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#b5e9ee" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <ellipse cx="800" cy="450" rx="590" ry="400" fill="url(#aura)"/>
  <ellipse cx="800" cy="450" rx="270" ry="255" fill="#675ce8" opacity=".12" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
