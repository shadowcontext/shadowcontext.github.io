  <path d="M1134 452 L1173 491 1248 406" fill="none" stroke="#7effe8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#4fe3cf">
    <circle cx="896" cy="390" r="8"/><circle cx="932" cy="450" r="6"/><circle cx="892" cy="520" r="10"/>
  </g>
  <g fill="#79a6c4" opacity=".35">
    <circle cx="1470" cy="252" r="5"/><circle cx="1510" cy="280" r="9"/><circle cx="1430" cy="650" r="7"/><circle cx="1380" cy="704" r="5"/>
