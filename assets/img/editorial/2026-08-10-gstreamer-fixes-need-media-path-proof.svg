<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected media-processing paths</title>
  <desc id="desc">Abstract audio waveforms and layered media frames pass through a luminous inspection boundary toward a protected processing core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#10213a"/>
      <stop offset="1" stop-color="#07101e"/>
    </linearGradient>
    <radialGradient id="halo" cx="70%" cy="48%" r="46%">
      <stop offset="0" stop-color="#35e0c1" stop-opacity=".3"/>
      <stop offset=".48" stop-color="#26a9d1" stop-opacity=".13"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9fff0" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#55f2d5" stop-opacity=".95"/>
      <stop offset="1" stop-color="#4db7ee" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d72a8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#182d4d" stop-opacity=".35"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="coreClip"><circle cx="1190" cy="450" r="190"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <path d="M0 690 C270 630 390 760 650 694 S1080 580 1600 690 L1600 900 L0 900Z" fill="#0c1b31" opacity=".75"/>
  <g opacity=".24" fill="none" stroke="#6b91bc" stroke-width="2">
    <path d="M70 154 H520"/><path d="M108 184 H444"/><path d="M78 748 H520"/><path d="M1130 164 H1510"/><path d="M1320 734 H1532"/>
  </g>
  <g transform="translate(110 242) rotate(-5 245 174)">
