    <rect x="26" y="26" width="438" height="296" rx="20" fill="url(#frame)"/>
    <circle cx="68" cy="68" r="12" fill="#75a8cf" opacity=".55"/>
    <circle cx="104" cy="68" r="12" fill="#75a8cf" opacity=".35"/>
    <path d="M52 195 L78 195 94 148 119 245 146 108 176 263 203 164 228 214 258 130 286 241 314 176 342 207 367 150 395 228 438 228" fill="none" stroke="#71d7e8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 274 H438" stroke="#9bc2da" stroke-width="4" opacity=".3"/>
  </g>
  <g transform="translate(300 174) rotate(7 210 142)" opacity=".72">
