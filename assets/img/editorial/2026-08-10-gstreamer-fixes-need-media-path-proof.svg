    <path d="M48 176 C88 112 132 228 177 158 S267 93 306 171 360 218 388 140" fill="none" stroke="#69b5dc" stroke-width="8" stroke-linecap="round"/>
    <circle cx="64" cy="58" r="10" fill="#71b4d7"/>
    <path d="M94 58 H216" stroke="#618aae" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g filter="url(#soft)" opacity=".34"><rect x="746" y="102" width="54" height="696" rx="27" fill="#4ff2d5"/></g>
  <rect x="762" y="92" width="20" height="716" rx="10" fill="url(#gate)" filter="url(#glow)"/>
  <g fill="#78ffe7" opacity=".9">
    <circle cx="772" cy="190" r="9"/><circle cx="772" cy="292" r="6"/><circle cx="772" cy="450" r="11"/><circle cx="772" cy="602" r="7"/><circle cx="772" cy="716" r="9"/>
  </g>
  <g opacity=".55" stroke="#5de7d3" fill="none" stroke-width="4">
    <path d="M620 260 C682 260 696 292 762 292"/>
    <path d="M590 444 C670 444 693 450 762 450"/>
    <path d="M568 607 C654 607 690 602 762 602"/>
  </g>
  <circle cx="1190" cy="450" r="232" fill="#071322" stroke="#234661" stroke-width="3"/>
  <circle cx="1190" cy="450" r="190" fill="#0d2740" stroke="#52d7c4" stroke-width="5"/>
