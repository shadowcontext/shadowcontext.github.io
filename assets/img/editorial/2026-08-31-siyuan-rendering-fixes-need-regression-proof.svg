      <rect x="38" y="43" width="145" height="23" rx="11.5" fill="#2389A7" fill-opacity="0.56"/>
      <rect x="38" y="91" width="216" height="14" rx="7" fill="#1F6685" fill-opacity="0.35"/>
      <rect x="38" y="124" width="184" height="14" rx="7" fill="#1F6685" fill-opacity="0.28"/>
      <path d="M74 179L103 207L163 149" fill="none" stroke="#0EA98D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <path d="M660 654L618 693L650 738L698 708Z" fill="#FFB453" fill-opacity="0.72"/>
    <path d="M712 682L688 735L741 754L766 701Z" fill="#FF7B59" fill-opacity="0.64"/>
