  </g>
  <path d="M638 472C614 495 601 523 607 555" fill="none" stroke="#FFB05E" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 17" opacity="0.75"/>

  <rect x="74" y="67" width="1452" height="766" rx="56" fill="none" stroke="#8DD9E2" stroke-opacity="0.13" stroke-width="2"/>
</svg>
