<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Interface-aware protection for firewall XML processing</title>
  <desc id="desc">Abstract hardware and virtual firewall forms sit behind layered teal interfaces while an amber XML-like stream is redirected through a guarded update boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="80" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071C2D"/>
      <stop offset="0.55" stop-color="#0B3344"/>
      <stop offset="1" stop-color="#06151F"/>
    </linearGradient>
    <linearGradient id="shield" x1="610" y1="180" x2="1050" y2="755" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="amber" x1="90" y1="415" x2="770" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(802 452) rotate(90) scale(390 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#A7F3D0" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="802" cy="452" rx="560" ry="402" fill="url(#glow)"/>
  <path d="M0 716C285 620 440 760 724 690C1015 618 1220 723 1600 598V900H0Z" fill="#020B12" fill-opacity="0.48"/>

  <!-- Incoming structured data stream -->
  <path d="M54 427C184 427 245 363 359 363C478 363 523 446 657 446" fill="none" stroke="url(#amber)" stroke-width="14" stroke-linecap="round"/>
  <path d="M55 493C201 493 267 553 384 553C503 553 542 477 657 477" fill="none" stroke="url(#amber)" stroke-width="6" stroke-linecap="round" opacity="0.68"/>
  <g fill="none" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 406l-27 22 27 22"/>
    <path d="M287 406l27 22-27 22"/>
    <path d="M365 474l-20 17 20 17" opacity="0.7"/>
    <path d="M397 474l20 17-20 17" opacity="0.7"/>
  </g>
  <circle cx="574" cy="444" r="9" fill="#FBBF24" filter="url(#smallGlow)"/>
  <circle cx="609" cy="475" r="6" fill="#FDBA74"/>

  <!-- Layered interface boundary -->
  <path d="M763 143L1018 251V472C1018 631 916 742 763 794C610 742 508 631 508 472V251L763 143Z" fill="#061D29" stroke="#5EEAD4" stroke-opacity="0.2" stroke-width="3"/>
  <path d="M763 177L982 270V470C982 607 898 703 763 753C628 703 544 607 544 470V270L763 177Z" fill="url(#shield)" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="4"/>
  <path d="M763 219L936 293V466C936 575 872 656 763 702C654 656 590 575 590 466V293L763 219Z" fill="#0C3B48" fill-opacity="0.78" stroke="#99F6E4" stroke-opacity="0.72" stroke-width="2"/>
  <path d="M532 365H608M522 447H601M533 529H612" stroke="#67E8F9" stroke-width="4" stroke-linecap="round"/>
  <circle cx="532" cy="365" r="7" fill="#22D3EE"/>
  <circle cx="522" cy="447" r="7" fill="#FBBF24"/>
  <circle cx="533" cy="529" r="7" fill="#22D3EE"/>

  <!-- Filtered flow turns upward at the protected boundary -->
  <path d="M657 446H704C730 446 744 428 744 405V344" fill="none" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
  <path d="M744 344l-16 25h32Z" fill="#FBBF24" transform="rotate(180 744 356)"/>
  <circle cx="744" cy="445" r="28" fill="#F59E0B" fill-opacity="0.13" stroke="#FCD34D" stroke-width="3"/>
  <path d="M732 445l9 10 17-22" fill="none" stroke="#FEF3C7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hardware appliance and virtual instance -->
  <g transform="translate(650 476)">
    <rect width="220" height="92" rx="18" fill="#092532" stroke="#A7F3D0" stroke-width="3"/>
    <rect x="22" y="24" width="68" height="44" rx="8" fill="#123E4B"/>
    <circle cx="115" cy="46" r="8" fill="#5EEAD4"/>
    <circle cx="143" cy="46" r="8" fill="#22D3EE"/>
    <circle cx="171" cy="46" r="8" fill="#164E63" stroke="#67E8F9" stroke-width="2"/>
    <path d="M40 39h32M40 52h22" stroke="#99F6E4" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g transform="translate(686 587)">
    <path d="M77 0l92 43v92l-92 43-77-43V43Z" fill="#0A2A38" stroke="#67E8F9" stroke-width="3"/>
    <path d="M0 43l77 42 92-42M77 85v93" fill="none" stroke="#67E8F9" stroke-opacity="0.65" stroke-width="3"/>
    <path d="M39 48l38-19 48 22-48 22Z" fill="#2DD4BF" fill-opacity="0.28"/>
  </g>

  <!-- Fixed-build signal crossing to protected side -->
  <path d="M936 390C1088 390 1129 306 1274 306C1370 306 1423 347 1544 347" fill="none" stroke="#5EEAD4" stroke-width="9" stroke-linecap="round" opacity="0.78"/>
  <path d="M936 519C1075 519 1136 605 1278 605C1380 605 1439 558 1547 558" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" opacity="0.58"/>
  <g fill="#A7F3D0">
    <circle cx="1087" cy="390" r="8"/>
    <circle cx="1174" cy="338" r="6"/>
    <circle cx="1280" cy="306" r="9"/>
    <circle cx="1088" cy="544" r="6"/>
    <circle cx="1210" cy="596" r="8"/>
    <circle cx="1340" cy="593" r="6"/>
  </g>
  <g opacity="0.28" filter="url(#soft)">
    <ellipse cx="1178" cy="447" rx="210" ry="115" fill="#2DD4BF"/>
    <ellipse cx="458" cy="461" rx="155" ry="88" fill="#F59E0B"/>
  </g>
</svg>
