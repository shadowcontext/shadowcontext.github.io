<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected recursive DNS pathways</title>
  <desc id="desc">Abstract blue and teal network pathways converge on a luminous protective filter while malformed amber and magenta signals are diverted away.</desc>
  <defs>
    <linearGradient id="bg" x1="110" y1="70" x2="1490" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.5" stop-color="#0A2540"/>
      <stop offset="1" stop-color="#071D2B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(846 446) rotate(90) scale(390 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38E8D4" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#168BB8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="676" y1="233" x2="961" y2="682" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73F6E6"/>
      <stop offset="0.5" stop-color="#25C7D9"/>
      <stop offset="1" stop-color="#1980B6"/>
    </linearGradient>
    <linearGradient id="flow" x1="132" y1="450" x2="1425" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2376AF" stop-opacity="0.18"/>
      <stop offset="0.44" stop-color="#4EDCD8"/>
      <stop offset="0.62" stop-color="#72F4D7"/>
      <stop offset="1" stop-color="#2A8DBB" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="warning" x1="426" y1="210" x2="723" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB34A"/>
      <stop offset="1" stop-color="#E44C87"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="grain" width="88" height="88" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="15" r="1.1" fill="#B9E9F1" opacity="0.12"/>
      <circle cx="51" cy="39" r="0.8" fill="#B9E9F1" opacity="0.1"/>
      <circle cx="76" cy="72" r="1" fill="#B9E9F1" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

