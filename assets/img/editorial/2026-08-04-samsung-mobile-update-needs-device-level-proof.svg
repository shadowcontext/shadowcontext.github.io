<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mobile update verification</title>
  <desc id="desc">An abstract mobile device moves through layered blue update rings toward a protected amber verification core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#0a2940"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#36d6ff" stop-opacity=".34"/>
      <stop offset=".58" stop-color="#1379ad" stop-opacity=".12"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c9f1"/>
      <stop offset=".48" stop-color="#1679a4"/>
      <stop offset="1" stop-color="#0b3b5a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102f48"/>
      <stop offset="1" stop-color="#071927"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".45" stop-color="#ffb72e"/>
      <stop offset="1" stop-color="#e96b1b"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#66d4ef" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="450" rx="610" ry="430" fill="url(#halo)"/>
  <path d="M164 672C393 529 492 264 793 236c266-25 387 174 647 60" fill="none" stroke="#52d8f5" stroke-opacity=".11" stroke-width="2"/>
  <path d="M112 720c286-110 430-42 615 29 238 91 459 30 756-156" fill="none" stroke="#60e0f8" stroke-opacity=".08" stroke-width="2"/>

  <g fill="none" transform="translate(800 450) rotate(-8)">
    <ellipse rx="535" ry="315" stroke="#24b9e4" stroke-opacity=".16" stroke-width="4"/>
    <ellipse rx="430" ry="255" stroke="#30c9ef" stroke-opacity=".24" stroke-width="5" stroke-dasharray="42 19"/>
    <ellipse rx="330" ry="198" stroke="#56ddf6" stroke-opacity=".36" stroke-width="6" stroke-dasharray="8 22"/>
  </g>

  <g opacity=".75">
    <circle cx="335" cy="360" r="8" fill="#4ed9f4"/>
    <circle cx="1261" cy="575" r="7" fill="#ffbd3d"/>
    <circle cx="1208" cy="287" r="5" fill="#4ed9f4"/>
    <path d="M335 360l144 38M1208 287l-118 78M1261 575l-142-61" stroke="#7adff3" stroke-opacity=".42" stroke-width="3"/>
  </g>

  <g transform="translate(612 115) rotate(7 188 335)">
    <rect x="0" y="0" width="376" height="670" rx="64" fill="#20a8d0" opacity=".25" filter="url(#blur)"/>
    <rect x="8" y="8" width="360" height="654" rx="58" fill="url(#device)"/>
    <rect x="23" y="23" width="330" height="624" rx="45" fill="url(#screen)" stroke="#81e8fa" stroke-opacity=".48" stroke-width="3"/>
    <path d="M136 44h96" stroke="#7be8f8" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"/>
    <circle cx="184" cy="614" r="10" fill="#55cce8" opacity=".65"/>
    <g transform="translate(188 324)" filter="url(#glow)">
      <path d="M0-111c61 35 104 42 104 42v92c0 69-46 118-104 151C-58 141-104 92-104 23v-92s43-7 104-42Z" fill="url(#amber)"/>
      <path d="m-43 26 29 30 62-70" fill="none" stroke="#fff5cf" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g fill="#55d8f1" opacity=".48">
      <rect x="68" y="119" width="158" height="8" rx="4"/>
      <rect x="68" y="143" width="225" height="8" rx="4"/>
      <rect x="68" y="518" width="230" height="8" rx="4"/>
      <rect x="68" y="542" width="181" height="8" rx="4"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M396 246a498 498 0 0 1 227-157" stroke="#4bd7f2" stroke-opacity=".68" stroke-width="10"/>
    <path d="M1204 655a498 498 0 0 1-228 157" stroke="#ffba35" stroke-opacity=".7" stroke-width="10"/>
    <path d="m603 77 33 5-20 27" stroke="#6ce3f8" stroke-width="8"/>
    <path d="m997 822-33-5 20-27" stroke="#ffcb5d" stroke-width="8"/>
  </g>

  <g opacity=".35" fill="url(#amber)">
    <path d="M1326 170h54v54h-54z" transform="rotate(18 1353 197)"/>
    <path d="M220 631h36v36h-36z" transform="rotate(31 238 649)"/>
  </g>
</svg>
