<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted signals stopped outside an isolated industrial controller</title>
  <desc id="desc">Polished abstract editorial artwork showing a central industrial controller protected by layered blue network boundaries while amber algorithmic signals remain outside the protected operational zone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162d"/>
      <stop offset="0.55" stop-color="#0b2850"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#2a8fbd" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#123b68" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07162d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9e7f2"/>
      <stop offset="0.18" stop-color="#4d9aba"/>
      <stop offset="0.62" stop-color="#174f78"/>
      <stop offset="1" stop-color="#0a2948"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77d6e8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#14739b" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb23f" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffc55c"/>
      <stop offset="1" stop-color="#ff8b2c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#010916" flood-opacity="0.72"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#72bbd3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
