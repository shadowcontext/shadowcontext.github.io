  <path d="M800 210c88 46 178 52 237 62v164c0 137-85 225-237 283-152-58-237-146-237-283V272c59-10 149-16 237-62Z" fill="#0a2035" fill-opacity="0.84" stroke="#38c9d0" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="800" cy="456" r="151" fill="#1cd1c5" fill-opacity="0.07" stroke="#52e8de" stroke-opacity="0.36" stroke-width="2"/>
