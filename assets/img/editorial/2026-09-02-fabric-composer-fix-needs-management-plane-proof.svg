<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected network management plane</title>
  <desc id="desc">An abstract luminous network control core sits inside layered blue shields while fragmented red access paths stop outside the protected boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="140" y1="80" x2="1450" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0a2741"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(805 445) rotate(90) scale(390 540)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33d6d2" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#168bc4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#168bc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="540" y1="180" x2="1040" y2="735" gradientUnits="userSpaceOnUse">
      <stop stop-color="#47e0dc"/>
      <stop offset="0.5" stop-color="#238fca"/>
      <stop offset="1" stop-color="#255aa9"/>
    </linearGradient>
    <linearGradient id="core" x1="670" y1="300" x2="935" y2="615" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ffaf1"/>
      <stop offset="0.45" stop-color="#35d3d3"/>
      <stop offset="1" stop-color="#1675b8"/>
    </linearGradient>
    <linearGradient id="threat" x1="95" y1="130" x2="510" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff785f"/>
      <stop offset="1" stop-color="#c72d55"/>
    </linearGradient>
    <filter id="blur40" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#8ddbdc" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="805" cy="445" rx="575" ry="410" fill="url(#halo)"/>
