<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Untrusted authority signal crossing an agentic software pipeline</title>
  <desc id="desc">Abstract five-stage software pipeline with a red untrusted signal crossing luminous verification gates toward a protected deployment core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="0.52" stop-color="#102447"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#47d7ff" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#2f7dff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#071326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de3ff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#76e8ff"/>
      <stop offset="1" stop-color="#7b8cff" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3f71"/>
      <stop offset=".48" stop-color="#ff6b57"/>
      <stop offset="1" stop-color="#ffcf6a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af4ff"/>
      <stop offset="1" stop-color="#5272ff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1" fill="#b8d8ff" opacity=".07"/>
      <circle cx="33" cy="19" r="1.2" fill="#b8d8ff" opacity=".05"/>
      <circle cx="18" cy="39" r=".8" fill="#b8d8ff" opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="825" cy="455" rx="700" ry="390" fill="url(#halo)"/>
  <circle cx="1380" cy="105" r="180" fill="#653bff" opacity=".1" filter="url(#soft)"/>
  <circle cx="205" cy="760" r="230" fill="#00c4d7" opacity=".09" filter="url(#soft)"/>

  <path d="M170 454 C370 365 495 542 680 451 S1015 351 1200 450 S1395 512 1500 445" fill="none" stroke="#16375f" stroke-width="58" stroke-linecap="round" opacity=".48"/>
  <path d="M170 454 C370 365 495 542 680 451 S1015 351 1200 450 S1395 512 1500 445" fill="none" stroke="url(#path)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <g fill="#0b1a32" stroke="url(#shield)" stroke-width="5" filter="url(#glow)">
    <path d="M332 286 Q390 253 448 286 L437 402 Q426 468 390 490 Q354 468 343 402 Z"/>
    <path d="M565 380 Q623 347 681 380 L670 496 Q659 562 623 584 Q587 562 576 496 Z"/>
    <path d="M800 283 Q858 250 916 283 L905 399 Q894 465 858 487 Q822 465 811 399 Z"/>
    <path d="M1032 352 Q1090 319 1148 352 L1137 468 Q1126 534 1090 556 Q1054 534 1043 468 Z"/>
  </g>

  <g fill="none" stroke="#78eaff" stroke-width="4" opacity=".75">
    <circle cx="390" cy="369" r="27"/>
    <path d="M374 369 l12 12 23-27"/>
    <circle cx="623" cy="463" r="27"/>
    <path d="M607 463 l12 12 23-27"/>
    <circle cx="858" cy="366" r="27"/>
    <path d="M842 366 l12 12 23-27"/>
    <circle cx="1090" cy="435" r="27"/>
    <path d="M1074 435 l12 12 23-27"/>
  </g>

  <path d="M86 236 C294 227 442 321 584 382 C738 448 894 427 1047 417 C1198 407 1304 426 1430 501" fill="none" stroke="#ff315f" stroke-width="34" stroke-linecap="round" opacity=".2" filter="url(#soft)"/>
  <path d="M86 236 C294 227 442 321 584 382 C738 448 894 427 1047 417 C1198 407 1304 426 1430 501" fill="none" stroke="url(#signal)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="url(#signal)" filter="url(#glow)">
    <circle cx="86" cy="236" r="18"/>
    <path d="M1436 500 l-48-29 11 47-27 34z"/>
  </g>

  <g transform="translate(1365 420)">
    <circle cx="0" cy="0" r="116" fill="#0a1830" stroke="#5278d8" stroke-width="4"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#6fe7ff" stroke-width="2" stroke-dasharray="7 14" opacity=".65"/>
    <path d="M0-58 Q49-39 61-22 V19 Q54 66 0 84 Q-54 66-61 19 V-22 Q-49-39 0-58Z" fill="url(#shield)" opacity=".94" filter="url(#glow)"/>
    <path d="M-28 8 l21 22 41-49" fill="none" stroke="#071326" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#93eaff">
    <circle cx="187" cy="454" r="9" filter="url(#glow)"/>
    <circle cx="705" cy="440" r="8" filter="url(#glow)"/>
    <circle cx="1218" cy="458" r="8" filter="url(#glow)"/>
  </g>
  <g fill="#ffcf6a">
    <circle cx="584" cy="382" r="8" filter="url(#glow)"/>
    <circle cx="1047" cy="417" r="8" filter="url(#glow)"/>
  </g>
</svg>
