<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Management-plane credential isolated behind a closing patch boundary</title>
  <desc id="desc">A polished abstract editorial scene of layered dark firewall shields surrounding a luminous management core, with an isolated credential token and a bright arc sealing the outer boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10213a"/>
      <stop offset="1" stop-color="#061723"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#8ff7df" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#28c8b4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b3040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d5b7a"/>
      <stop offset="1" stop-color="#142c47"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45e0c3"/>
      <stop offset="0.55" stop-color="#b9ffcf"/>
      <stop offset="1" stop-color="#ffd36a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="16" r="1.2" fill="#b4d9ea" opacity="0.14"/>
      <circle cx="58" cy="31" r="0.9" fill="#b4d9ea" opacity="0.1"/>
      <circle cx="34" cy="69" r="1.1" fill="#b4d9ea" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="560" ry="340" fill="#1b4960" opacity="0.22" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g opacity="0.34" fill="none" stroke="#63a1b8" stroke-width="2">
    <path d="M120 222 C330 85 470 150 604 246"/>
    <path d="M996 246 C1130 150 1270 85 1480 222"/>
    <path d="M108 702 C292 790 448 762 586 680"/>
    <path d="M1014 680 C1152 762 1308 790 1492 702"/>
  </g>

  <g transform="translate(800 455)">
    <path d="M0-330 C220-300 388-219 438-94 V119 C438 282 252 376 0 416 C-252 376-438 282-438 119 V-94 C-388-219-220-300 0-330Z"
          fill="#0b1729" stroke="#315c79" stroke-width="7"/>
    <path d="M0-267 C174-245 307-183 347-82 V90 C347 218 201 292 0 326 C-201 292-347 218-347 90 V-82 C-307-183-174-245 0-267Z"
          fill="url(#shield)" opacity="0.82" stroke="#4d8198" stroke-width="4"/>
    <path d="M0-202 C125-188 226-137 256-57 V61 C256 157 148 214 0 240 C-148 214-256 157-256 61 V-57 C-226-137-125-188 0-202Z"
          fill="#0b2235" stroke="#56b6b1" stroke-width="4"/>
    <ellipse cx="0" cy="16" rx="226" ry="193" fill="url(#core)"/>

    <g opacity="0.8" stroke="#7bbed0" stroke-width="3" fill="none">
      <path d="M-190-38 H-100 L-55 6"/>
      <path d="M190-38 H100 L55 6"/>
      <path d="M-170 118 H-91 L-52 79"/>
      <path d="M170 118 H91 L52 79"/>
    </g>
    <g fill="#7ce5d1">
      <circle cx="-190" cy="-38" r="8"/>
      <circle cx="190" cy="-38" r="8"/>
      <circle cx="-170" cy="118" r="8"/>
      <circle cx="170" cy="118" r="8"/>
    </g>

    <g transform="translate(0 26)" filter="url(#glow)">
      <rect x="-72" y="-82" width="144" height="164" rx="34" fill="#102a3a" stroke="#b6ffe8" stroke-width="7"/>
      <circle cx="0" cy="-22" r="27" fill="#ffd36a"/>
      <path d="M0 5 V52 M0 35 H28" fill="none" stroke="#ffd36a" stroke-width="17" stroke-linecap="round"/>
      <rect x="-91" y="-101" width="182" height="202" rx="48" fill="none" stroke="#45e0c3" stroke-width="3" opacity="0.7"/>
    </g>
  </g>

  <path d="M349 229 C521 65 810 25 1070 113 C1217 163 1335 260 1392 383"
        fill="none" stroke="#183a51" stroke-width="34" stroke-linecap="round"/>
  <path d="M349 229 C521 65 810 25 1070 113 C1217 163 1335 260 1392 383"
        fill="none" stroke="url(#seal)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <g transform="translate(1392 383) rotate(66)">
    <path d="M-26-29 L30 0 L-26 29Z" fill="#ffd36a" filter="url(#glow)"/>
  </g>

  <g opacity="0.55">
    <circle cx="280" cy="610" r="10" fill="#45e0c3"/>
    <circle cx="1320" cy="610" r="10" fill="#45e0c3"/>
    <path d="M280 610 C420 704 552 745 668 757" fill="none" stroke="#45e0c3" stroke-width="3"/>
    <path d="M1320 610 C1180 704 1048 745 932 757" fill="none" stroke="#45e0c3" stroke-width="3"/>
  </g>
</svg>
