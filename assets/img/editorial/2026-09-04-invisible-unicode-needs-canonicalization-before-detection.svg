<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Invisible Unicode revealed before email delivery</title>
  <desc id="desc">Abstract layered email forms move through a luminous teal normalization boundary, where hidden amber character fragments become visible before reaching a protected inbox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2a3a"/>
      <stop offset="1" stop-color="#12353d"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f2ef" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#8fcac4" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76f5dd" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#55e6d2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1aa69d" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#65f2dc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#65f2dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8edbd1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="835" cy="450" rx="420" ry="390" fill="url(#halo)" filter="url(#blur)"/>

  <g opacity="0.45" fill="none" stroke="#7acbc4" stroke-width="2">
    <path d="M90 170C260 80 410 90 555 196"/>
    <path d="M80 720C280 815 445 800 580 686"/>
    <path d="M1040 112C1255 58 1440 150 1535 278"/>
    <path d="M1050 770C1250 840 1420 740 1540 630"/>
  </g>

  <g transform="translate(120 245) rotate(-8 260 190)">
    <rect x="30" y="38" width="520" height="330" rx="28" fill="#06131f" opacity="0.5"/>
    <rect width="520" height="330" rx="28" fill="url(#sheet)" stroke="#b9e8e2" stroke-width="3"/>
    <path d="M1 45L260 212L519 45" fill="none" stroke="#174c57" stroke-width="12" stroke-linejoin="round" opacity="0.85"/>
    <path d="M18 310L186 177M502 310L334 177" fill="none" stroke="#24717a" stroke-width="8" opacity="0.62"/>
    <g fill="#f6b85b">
      <circle cx="165" cy="112" r="7"/><rect x="195" y="105" width="13" height="13" rx="3"/>
      <circle cx="310" cy="116" r="6"/><rect x="365" y="108" width="12" height="12" rx="3"/>
      <circle cx="244" cy="269" r="6"/><rect x="283" y="262" width="13" height="13" rx="3"/>
    </g>
  </g>

  <g transform="translate(605 90)">
    <rect x="0" y="0" width="165" height="720" rx="82" fill="url(#gate)" stroke="#7ef4df" stroke-width="3"/>
    <rect x="39" y="34" width="87" height="652" rx="43" fill="#071d28" opacity="0.7"/>
    <g fill="#ffc267" filter="url(#soft)" opacity="0.45">
      <circle cx="82" cy="180" r="15"/><circle cx="82" cy="332" r="13"/><circle cx="82" cy="510" r="15"/>
    </g>
    <g fill="#ffd07a">
      <path d="M74 164h16v33H74zM66 172h33v16H66z"/>
      <rect x="69" y="320" width="27" height="27" rx="5" transform="rotate(45 82.5 333.5)"/>
      <circle cx="82" cy="510" r="13"/><circle cx="82" cy="510" r="5" fill="#0a2632"/>
    </g>
  </g>

  <g stroke="#7cf2de" stroke-width="4" fill="none" opacity="0.75">
    <path d="M770 270C855 270 875 315 940 315"/>
    <path d="M770 450C858 450 878 450 955 450"/>
    <path d="M770 630C855 630 875 585 940 585"/>
  </g>
  <g fill="#8ff8e5">
    <circle cx="845" cy="280" r="6"/><circle cx="882" cy="306" r="5"/>
    <circle cx="842" cy="450" r="6"/><circle cx="900" cy="450" r="5"/>
    <circle cx="845" cy="620" r="6"/><circle cx="884" cy="592" r="5"/>
  </g>

  <g transform="translate(945 210)">
    <path d="M0 105L250 0L500 105V355C500 505 393 609 250 660C107 609 0 505 0 355Z" fill="#0b2633" stroke="#6be9d5" stroke-width="8"/>
    <path d="M70 145L250 70L430 145V345C430 447 361 524 250 570C139 524 70 447 70 345Z" fill="#123b45" stroke="#3dbbad" stroke-width="3"/>
    <g transform="translate(135 220)">
      <rect x="0" y="0" width="230" height="155" rx="18" fill="#b8e7df"/>
      <path d="M3 24L115 98L227 24" fill="none" stroke="#17515a" stroke-width="9" stroke-linejoin="round"/>
      <path d="M14 140L82 85M216 140L148 85" fill="none" stroke="#287680" stroke-width="6"/>
    </g>
    <path d="M205 437L236 468L303 395" fill="none" stroke="#ffd070" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#efb45c" opacity="0.82">
    <circle cx="505" cy="177" r="5"/><circle cx="536" cy="197" r="4"/><circle cx="560" cy="152" r="6"/>
    <rect x="520" y="694" width="10" height="10" rx="2" transform="rotate(28 525 699)"/>
    <rect x="558" y="722" width="8" height="8" rx="2" transform="rotate(28 562 726)"/>
  </g>
</svg>
