    <rect x="28" y="58" width="364" height="600" rx="40" fill="#071620" stroke="#256677" stroke-width="4"/>
    <rect x="160" y="24" width="100" height="9" rx="5" fill="#66d9d0" opacity="0.62"/>
    <circle cx="210" cy="684" r="13" fill="#0a1b25" stroke="#50b9bb" stroke-width="4"/>

    <circle cx="210" cy="355" r="188" fill="#20ceb9" fill-opacity="0.11" filter="url(#glow)"/>
    <path d="M210 168L344 245V465L210 542L76 465V245Z" fill="#092631" stroke="#278f9f" stroke-width="8"/>
    <path d="M210 213L305 268V442L210 497L115 442V268Z" fill="#0b1b26" stroke="url(#core)" stroke-width="12"/>
    <rect x="155" y="300" width="110" height="110" rx="18" fill="url(#core)"/>
    <rect x="176" y="321" width="68" height="68" rx="10" fill="#08202b" stroke="#c0fff3" stroke-width="5"/>
    <path d="M194 355L207 369L230 341" fill="none" stroke="#8effe9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g stroke="#5fdace" stroke-width="7" stroke-linecap="round">
      <path d="M155 283V252M210 283V243M265 283V252"/>
      <path d="M155 427V458M210 427V467M265 427V458"/>
      <path d="M138 310H107M138 355H98M138 400H107"/>
      <path d="M282 310H313M282 355H322M282 400H313"/>
    </g>
  </g>

  <g transform="translate(1080 240)" fill="none" stroke-linecap="round">
    <path d="M0 210H102" stroke="#53d7cf" stroke-width="10" opacity="0.8"/>
    <circle cx="44" cy="210" r="7" fill="#8ff4e5" stroke="none"/>
    <path d="M139 210C139 161 178 122 227 122" stroke="#ffbd61" stroke-width="12"/>
    <path d="M139 210C139 113 218 34 315 34" stroke="#ee9254" stroke-width="11" opacity="0.85"/>
    <path d="M139 210C139 259 178 298 227 298" stroke="#ffbd61" stroke-width="12"/>
    <path d="M139 210C139 307 218 386 315 386" stroke="#ee9254" stroke-width="11" opacity="0.85"/>
    <circle cx="139" cy="210" r="22" fill="url(#amber)" stroke="#ffe2a0" stroke-width="5" filter="url(#smallGlow)"/>
  </g>

  <g fill="#70ddd4" opacity="0.38">
    <circle cx="238" cy="178" r="6"/>
    <circle cx="421" cy="702" r="5"/>
    <circle cx="1175" cy="142" r="7"/>
    <circle cx="1406" cy="700" r="6"/>
    <circle cx="1290" cy="786" r="4"/>
  </g>
</svg>
