<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Firmware assurance across video and radio components</title>
  <desc id="desc">Abstract editorial artwork of a mobile device protecting a layered processor core, with floating video frames on one side and radio waves on the other.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.5" stop-color="#10283a"/>
      <stop offset="1" stop-color="#060b15"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#30e1c2" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#1386a4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#08121d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a4658"/>
      <stop offset="0.5" stop-color="#0b2433"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8fff0"/>
      <stop offset="0.45" stop-color="#35d6c2"/>
      <stop offset="1" stop-color="#176f8c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe19a"/>
      <stop offset="0.5" stop-color="#ffb657"/>
      <stop offset="1" stop-color="#d86b43"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#78d8d3" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="454" rx="610" ry="430" fill="url(#aura)"/>

  <g fill="none" stroke="#34889a" stroke-width="2" opacity="0.3">
    <path d="M0 181C285 127 421 242 678 183S1198 144 1600 212"/>
    <path d="M0 732C235 786 473 677 712 728S1234 786 1600 680"/>
  </g>

  <g transform="translate(128 275)">
    <rect x="0" y="0" width="292" height="188" rx="18" fill="#0b2634" stroke="#3aa9ae" stroke-width="5"/>
    <rect x="27" y="24" width="238" height="140" rx="10" fill="#102f3c" stroke="#78ded4" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M116 61L192 94L116 127Z" fill="url(#amber)"/>
    <path d="M292 94H446" stroke="#f6b45d" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="342" cy="94" r="7" fill="#ffdc8d"/>
    <circle cx="405" cy="94" r="5" fill="#f3a552"/>
  </g>

  <g transform="translate(590 92)">
