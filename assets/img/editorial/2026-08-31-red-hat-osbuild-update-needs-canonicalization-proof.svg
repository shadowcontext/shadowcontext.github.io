<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Canonicalization gate protecting a virtual-machine image build</title>
  <desc id="desc">Polished abstract editorial artwork showing two irregular path and hostname streams becoming aligned through a guarded luminous ring before entering a faceted virtual-machine image.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141f"/>
      <stop offset="0.52" stop-color="#10283a"/>
      <stop offset="1" stop-color="#08121b"/>
    </linearGradient>
    <radialGradient id="aura" cx="54%" cy="51%" r="55%">
      <stop offset="0" stop-color="#69e0c1" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#2e8fb2" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#07141f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tealFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6e91" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#3ccdb4"/>
      <stop offset="1" stop-color="#c3ffe0"/>
    </linearGradient>
    <linearGradient id="amberFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#704c46" stop-opacity="0.1"/>
      <stop offset="0.58" stop-color="#f2a960"/>
      <stop offset="1" stop-color="#ffe3a7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ffe9"/>
      <stop offset="0.42" stop-color="#52d7bd"/>
      <stop offset="1" stop-color="#257c9d"/>
    </linearGradient>
    <linearGradient id="goldFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1bd"/>
      <stop offset="0.5" stop-color="#e9b35b"/>
      <stop offset="1" stop-color="#b56a3e"/>
    </linearGradient>
    <linearGradient id="blueFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8de2d2"/>
      <stop offset="1" stop-color="#277b9d"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#9ac9d7" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="850" cy="460" rx="410" ry="315" fill="#45ceb5" opacity="0.075" filter="url(#soft)"/>
  <ellipse cx="1310" cy="450" rx="260" ry="250" fill="#e6a351" opacity="0.055" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-70 250 C110 180 230 322 360 248 S565 174 688 314" stroke="#172c3b" stroke-width="66" opacity="0.9"/>
    <path d="M-70 650 C130 720 205 562 350 646 S560 738 688 586" stroke="#172c3b" stroke-width="66" opacity="0.9"/>
    <path d="M-70 250 C110 180 230 322 360 248 S565 174 688 314" stroke="url(#tealFlow)" stroke-width="9"/>
    <path d="M-70 650 C130 720 205 562 350 646 S560 738 688 586" stroke="url(#amberFlow)" stroke-width="9"/>
  </g>

  <g opacity="0.8">
    <path d="M178 208 l18 18 -26 22 30 25" fill="none" stroke="#75e0ca" stroke-width="5"/>
    <path d="M303 621 q22-35 45 0 t45 0" fill="none" stroke="#f2b268" stroke-width="5"/>
    <circle cx="472" cy="218" r="9" fill="#bdf9dc" filter="url(#glow)"/>
    <circle cx="481" cy="689" r="9" fill="#ffd794" filter="url(#glow)"/>
  </g>

  <g transform="translate(800 450)">
    <circle r="174" fill="#081a25" stroke="#21495c" stroke-width="30"/>
    <circle r="152" fill="none" stroke="url(#ring)" stroke-width="15" filter="url(#glow)"/>
    <circle r="112" fill="#0d2b3b" stroke="#72dfc8" stroke-opacity="0.42" stroke-width="2"/>
    <path d="M-63 0 L-18 44 L71-53" fill="none" stroke="#d6ffea" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <g fill="#9debd6">
      <circle cx="0" cy="-152" r="6"/><circle cx="152" cy="0" r="6"/>
      <circle cx="0" cy="152" r="6"/><circle cx="-152" cy="0" r="6"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M972 416 C1040 416 1054 416 1119 416" stroke="#1b3442" stroke-width="56"/>
    <path d="M972 484 C1040 484 1054 484 1119 484" stroke="#1b3442" stroke-width="56"/>
    <path d="M972 416 C1040 416 1054 416 1119 416" stroke="url(#tealFlow)" stroke-width="8"/>
    <path d="M972 484 C1040 484 1054 484 1119 484" stroke="url(#amberFlow)" stroke-width="8"/>
  </g>

  <g transform="translate(1290 450)" filter="url(#glow)">
    <path d="M0-202 L194-91 L194 102 L0 214 L-194 102 L-194-91Z" fill="#0b202c" stroke="#70d8c4" stroke-width="4"/>
    <path d="M0-202 L194-91 L0 20 L-194-91Z" fill="url(#goldFacet)" opacity="0.96"/>
    <path d="M-194-91 L0 20 L0 214 L-194 102Z" fill="url(#blueFacet)" opacity="0.84"/>
    <path d="M194-91 L0 20 L0 214 L194 102Z" fill="#d8934d" opacity="0.79"/>
    <path d="M0-202V20 M-194-91L0 20 194-91 M0 20V214" fill="none" stroke="#efffe9" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M-70-68 H70 V18 H-70Z" fill="#0a2634" stroke="#d6ffea" stroke-opacity="0.72" stroke-width="3"/>
    <path d="M-42-40 H42 M-42-13 H20" stroke="#7edecb" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#81cfc1" stroke-width="2" opacity="0.28">
    <path d="M114 112 C310 76 470 106 592 170"/>
    <path d="M110 788 C310 824 470 794 592 730"/>
    <circle cx="111" cy="112" r="11"/><circle cx="107" cy="788" r="11"/>
  </g>
</svg>
