<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Segmented protection around an industrial relay controller</title>
  <desc id="desc">An abstract DIN-rail controller with four power channels sits behind a luminous layered network barrier, emphasizing isolation between web access and physical control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.52" stop-color="#10283b"/>
      <stop offset="1" stop-color="#061019"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="47%" r="55%">
      <stop offset="0" stop-color="#29d6d0" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#1686a7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e3e6"/>
      <stop offset="0.5" stop-color="#91a8ae"/>
      <stop offset="1" stop-color="#435c66"/>
    </linearGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34e5cf" stop-opacity="0.16"/>
      <stop offset="0.48" stop-color="#65f2df" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#2aaac1" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#f28742"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000810" flood-opacity="0.7"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8fd4db" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g opacity="0.55">
    <path d="M75 244 C250 244 275 345 420 345" fill="none" stroke="#f39a4e" stroke-width="5"/>
    <path d="M75 328 C255 328 275 392 420 392" fill="none" stroke="#f39a4e" stroke-width="3"/>
    <path d="M75 412 C245 412 285 439 420 439" fill="none" stroke="#f39a4e" stroke-width="4"/>
    <path d="M75 496 C250 496 280 486 420 486" fill="none" stroke="#f39a4e" stroke-width="3"/>
    <circle cx="75" cy="244" r="9" fill="#ffbb59"/>
    <circle cx="75" cy="328" r="7" fill="#ffbb59"/>
    <circle cx="75" cy="412" r="8" fill="#ffbb59"/>
    <circle cx="75" cy="496" r="7" fill="#ffbb59"/>
  </g>

  <g filter="url(#glow)">
    <path d="M432 120 L498 168 L498 732 L432 780 L402 746 L402 154 Z" fill="url(#barrier)" stroke="#71f5e3" stroke-width="2"/>
    <path d="M510 166 L548 194 L548 706 L510 734" fill="none" stroke="#40d9d4" stroke-opacity="0.52" stroke-width="8"/>
    <path d="M370 184 L398 206 L398 694 L370 716" fill="none" stroke="#2fa6bd" stroke-opacity="0.42" stroke-width="5"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="214" width="610" height="474" rx="42" fill="#1a313d" stroke="#78949c" stroke-width="5"/>
    <rect x="662" y="248" width="526" height="406" rx="26" fill="url(#case)"/>
    <rect x="706" y="286" width="438" height="138" rx="18" fill="#122632"/>
    <rect x="738" y="316" width="255" height="14" rx="7" fill="#43646d"/>
    <rect x="738" y="350" width="180" height="12" rx="6" fill="#35555f"/>
    <circle cx="1086" cy="346" r="20" fill="#22c9b2" filter="url(#glow)"/>
    <circle cx="1086" cy="346" r="7" fill="#b8fff4"/>

    <g>
      <rect x="710" y="470" width="92" height="128" rx="12" fill="#263f49" stroke="#b9c9cc" stroke-width="3"/>
      <rect x="822" y="470" width="92" height="128" rx="12" fill="#263f49" stroke="#b9c9cc" stroke-width="3"/>
      <rect x="934" y="470" width="92" height="128" rx="12" fill="#263f49" stroke="#b9c9cc" stroke-width="3"/>
      <rect x="1046" y="470" width="92" height="128" rx="12" fill="#263f49" stroke="#b9c9cc" stroke-width="3"/>
      <circle cx="756" cy="512" r="15" fill="url(#amber)"/>
      <circle cx="868" cy="512" r="15" fill="#35d6c2"/>
      <circle cx="980" cy="512" r="15" fill="#35d6c2"/>
      <circle cx="1092" cy="512" r="15" fill="url(#amber)"/>
      <path d="M735 559h42" stroke="#9db5ba" stroke-width="8" stroke-linecap="round"/>
      <path d="M847 559h42" stroke="#9db5ba" stroke-width="8" stroke-linecap="round"/>
      <path d="M959 559h42" stroke="#9db5ba" stroke-width="8" stroke-linecap="round"/>
      <path d="M1071 559h42" stroke="#9db5ba" stroke-width="8" stroke-linecap="round"/>
    </g>
    <path d="M642 688h566l-32 45H674z" fill="#314d57"/>
    <path d="M674 733h502" stroke="#85a5ac" stroke-width="11" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M756 600v104c0 38 28 58 70 58h510" stroke="#f3a354" stroke-width="5"/>
    <path d="M868 600v72c0 35 25 52 65 52h403" stroke="#45dac9" stroke-width="5"/>
    <path d="M980 600v38c0 31 22 48 58 48h298" stroke="#45dac9" stroke-width="5"/>
    <path d="M1092 600v14c0 24 18 34 50 34h194" stroke="#f3a354" stroke-width="5"/>
  </g>
  <g fill="#d9fff8" filter="url(#glow)">
    <circle cx="1336" cy="762" r="8"/>
    <circle cx="1336" cy="724" r="8"/>
    <circle cx="1336" cy="686" r="8"/>
    <circle cx="1336" cy="648" r="8"/>
  </g>

  <path d="M520 450h80" stroke="#8ffff0" stroke-width="4" stroke-dasharray="8 16" opacity="0.55"/>
  <circle cx="560" cy="450" r="38" fill="#0b2934" stroke="#63eadb" stroke-width="4"/>
  <path d="M543 451l12 12 24-29" fill="none" stroke="#a8fff3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
