<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered framework analysis protecting an application core</title>
  <desc id="desc">Abstract streams of code-like light pass through layered analysis lenses and converge on a protected application core, representing framework-aware static analysis.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".48" stop-color="#10233a"/>
      <stop offset="1" stop-color="#080e1b"/>
    </linearGradient>
    <radialGradient id="aura" cx="67%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4ce4d0" stop-opacity=".24"/>
      <stop offset=".48" stop-color="#268caa" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streamA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3681af" stop-opacity=".12"/>
      <stop offset=".52" stop-color="#5ad7dc" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b8fff4"/>
    </linearGradient>
    <linearGradient id="streamB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7250ae" stop-opacity=".1"/>
      <stop offset=".58" stop-color="#ad83ed" stop-opacity=".75"/>
      <stop offset="1" stop-color="#dfc8ff"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8affec" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#38aaba" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9475df" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5fff7"/>
      <stop offset=".38" stop-color="#55dbc9"/>
      <stop offset="1" stop-color="#247a9d"/>
    </linearGradient>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1" fill="#d8ffff" opacity=".055"/>
      <circle cx="43" cy="34" r=".8" fill="#d8ffff" opacity=".045"/>
      <circle cx="24" cy="57" r=".7" fill="#d8ffff" opacity=".04"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020710" flood-opacity=".65"/>
    </filter>
    <clipPath id="innerLens">
      <ellipse cx="943" cy="450" rx="83" ry="270"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g opacity=".16">
    <path d="M90 170 H345 M112 205 H273 M70 240 H314 M130 275 H375" stroke="#70bad4" stroke-width="8" stroke-linecap="round"/>
    <path d="M96 625 H330 M73 660 H386 M116 695 H286 M87 730 H352" stroke="#8d71cc" stroke-width="8" stroke-linecap="round"/>
    <circle cx="400" cy="222" r="7" fill="#82eced"/>
    <circle cx="416" cy="680" r="7" fill="#bba0f4"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M75 205 C315 205 394 305 588 342 C733 369 797 370 871 402" stroke="url(#streamA)" stroke-width="16"/>
    <path d="M58 336 C307 323 413 379 587 405 C716 425 790 428 866 439" stroke="url(#streamA)" stroke-width="9" opacity=".72"/>
    <path d="M55 488 C286 478 413 470 596 468 C725 466 791 460 864 454" stroke="url(#streamA)" stroke-width="12" opacity=".86"/>
    <path d="M68 625 C300 628 399 566 589 525 C726 495 796 484 870 470" stroke="url(#streamB)" stroke-width="15"/>
    <path d="M91 733 C332 710 421 611 604 559 C731 523 803 499 878 479" stroke="url(#streamB)" stroke-width="9" opacity=".7"/>
  </g>

  <g opacity=".7">
    <circle cx="327" cy="250" r="6" fill="#88f5ed"/>
    <circle cx="460" cy="374" r="5" fill="#75dfe2"/>
    <circle cx="296" cy="485" r="5" fill="#72d9df"/>
    <circle cx="429" cy="586" r="6" fill="#c0a3f4"/>
    <circle cx="348" cy="684" r="5" fill="#ad8be8"/>
  </g>

  <g filter="url(#softShadow)">
    <ellipse cx="943" cy="450" rx="118" ry="332" fill="#0a1928" stroke="#3b8ca5" stroke-width="3"/>
    <ellipse cx="943" cy="450" rx="92" ry="286" fill="url(#lens)" stroke="#a4fff3" stroke-opacity=".75" stroke-width="4"/>
    <ellipse cx="943" cy="450" rx="70" ry="245" fill="#081722" fill-opacity=".78" stroke="#6eddd8" stroke-opacity=".46" stroke-width="2"/>
  </g>

  <g clip-path="url(#innerLens)" opacity=".72">
    <path d="M850 310 C930 350 970 354 1043 329 M848 382 C925 414 977 410 1045 387 M845 457 C925 475 977 472 1048 450 M849 530 C924 526 978 528 1044 518 M859 603 C927 575 978 579 1035 588"
          fill="none" stroke="#c9fff6" stroke-width="4" stroke-linecap="round"/>
    <path d="M885 180 C924 275 925 625 889 720 M1000 181 C962 281 962 620 1000 719"
          fill="none" stroke="#72d9dd" stroke-width="3" stroke-dasharray="6 18"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M1031 415 C1116 414 1162 419 1228 438" stroke="#c0fff5" stroke-width="14" filter="url(#glow)"/>
    <path d="M1030 459 C1112 460 1168 459 1229 452" stroke="#b9a0f1" stroke-width="10" opacity=".72"/>
    <path d="M1026 493 C1112 497 1168 487 1232 466" stroke="#5ad7d2" stroke-width="7" opacity=".7"/>
  </g>

  <g transform="translate(1293 450)" filter="url(#softShadow)">
    <path d="M0-156 C92-126 137-102 137-102 V15 C137 105 79 154 0 187 C-79 154-137 105-137 15 V-102 C-137-102-92-126 0-156Z"
          fill="#0b2534" stroke="#68e6d6" stroke-width="5"/>
    <path d="M0-116 C66-95 98-79 98-79 V10 C98 72 59 108 0 137 C-59 108-98 72-98 10 V-79 C-98-79-66-95 0-116Z"
          fill="url(#core)" opacity=".92"/>
    <path d="M-45-3 C-24-27-10-16 0-38 C12-10 27-26 48-2 C31 4 25 20 25 37 C8 27-8 27-25 37 C-25 19-31 4-45-3Z"
          fill="#e8fffb" opacity=".88"/>
    <circle cx="0" cy="2" r="88" fill="none" stroke="#e1fff9" stroke-opacity=".28" stroke-width="2"/>
  </g>

  <ellipse cx="1115" cy="759" rx="402" ry="50" fill="#4fd5d0" opacity=".07"/>
  <path d="M735 782 C934 736 1213 735 1478 785" fill="none" stroke="#6ce2dc" stroke-opacity=".09" stroke-width="3"/>
  <path d="M776 810 C1006 770 1249 774 1430 808" fill="none" stroke="#a58ae5" stroke-opacity=".07" stroke-width="2"/>
</svg>
