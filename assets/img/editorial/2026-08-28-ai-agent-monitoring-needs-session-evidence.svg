    <circle cx="798" cy="458" r="410" fill="url(#aura)"/>
    <ellipse cx="320" cy="228" rx="250" ry="170" fill="#2563eb" opacity=".08" filter="url(#blur40)"/>
    <ellipse cx="1340" cy="700" rx="260" ry="170" fill="#a855f7" opacity=".08" filter="url(#blur40)"/>

    <g fill="none" stroke="#b7d9ef" stroke-opacity=".08">
