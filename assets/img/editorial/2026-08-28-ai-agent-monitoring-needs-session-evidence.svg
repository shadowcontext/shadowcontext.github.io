<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Full-session evidence for AI agent monitoring</title>
  <desc id="desc">Abstract editorial artwork showing a luminous agent session crossing layered security checkpoints between separate identity orbs while disconnected events fade beyond the trusted path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="0.52" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#10152b"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#62f5dd" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#38bdf8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset=".46" stop-color="#5eead4"/>
      <stop offset=".72" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8fbff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".03"/>
    </linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1600" height="900" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
