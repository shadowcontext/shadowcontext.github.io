    <circle cx="1034" cy="478" r="99" fill="#0b1830" stroke="#6af1d8" stroke-width="8"/>
    <circle cx="1034" cy="478" r="62" fill="#42cfca" opacity="0.2"/>
    <path d="M992 482 L1021 511 L1081 443" fill="none" stroke="#83f5df" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#6be5d5" stroke-linecap="round">
