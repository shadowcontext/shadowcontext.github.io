<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A protected software release pipeline with a three-stage cooldown</title>
  <desc id="desc">Abstract blue release capsules move through three amber buffer gates toward a protected pipeline while a fractured red capsule is diverted away.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1500" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07182d"/>
      <stop offset="0.52" stop-color="#0d2a43"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(1085 450) rotate(180) scale(620 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1bd6d1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1bd6d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="176" y1="450" x2="1430" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3178a7" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#46c9d0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#76f0df" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#82e9ff"/>
      <stop offset=".55" stop-color="#258cb8"/>
      <stop offset="1" stop-color="#123e68"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffd878"/>
      <stop offset=".5" stop-color="#d8912f"/>
      <stop offset="1" stop-color="#7d431d"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff856f"/>
      <stop offset=".55" stop-color="#be3e50"/>
      <stop offset="1" stop-color="#651f3b"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020811" flood-opacity=".65"/>
    </filter>
    <clipPath id="window">
      <rect x="172" y="365" width="1256" height="170" rx="85"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <path d="M0 690C280 598 435 756 707 679c293-82 502-19 893 84v137H0Z" fill="#06111d" opacity=".72"/>
  <path d="M0 172C291 73 514 201 774 135c287-73 552-43 826 55V0H0Z" fill="#11324c" opacity=".28"/>

  <g opacity=".42">
    <circle cx="164" cy="171" r="3" fill="#92e9f4"/>
    <circle cx="279" cy="716" r="4" fill="#92e9f4"/>
    <circle cx="491" cy="118" r="3" fill="#ffd878"/>
    <circle cx="1321" cy="161" r="4" fill="#92e9f4"/>
    <circle cx="1441" cy="668" r="3" fill="#ffd878"/>
    <path d="M104 258h214M1273 271h207M1168 694h245" stroke="#6bcbd7" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 18"/>
  </g>

  <rect x="172" y="365" width="1256" height="170" rx="85" fill="#07131f" stroke="#5dd2dc" stroke-opacity=".2" stroke-width="3" filter="url(#shadow)"/>
  <rect x="195" y="389" width="1210" height="122" rx="61" fill="none" stroke="url(#rail)" stroke-width="5"/>

  <g clip-path="url(#window)">
    <path d="M138 450H1460" stroke="#45c8d2" stroke-opacity=".13" stroke-width="70"/>
    <path d="M138 450H1460" stroke="#79e6e7" stroke-opacity=".18" stroke-width="3" stroke-dasharray="12 24"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(266 408)">
      <rect width="166" height="84" rx="42" fill="url(#capsule)"/>
      <path d="M83 0v84" stroke="#b7f5ff" stroke-opacity=".46" stroke-width="3"/>
      <ellipse cx="48" cy="24" rx="25" ry="9" fill="#d5fbff" opacity=".28"/>
    </g>
    <g transform="translate(507 408)">
      <rect width="166" height="84" rx="42" fill="url(#capsule)"/>
      <path d="M83 0v84" stroke="#b7f5ff" stroke-opacity=".46" stroke-width="3"/>
      <ellipse cx="48" cy="24" rx="25" ry="9" fill="#d5fbff" opacity=".28"/>
    </g>
    <g transform="translate(1127 408)">
      <rect width="166" height="84" rx="42" fill="url(#capsule)"/>
      <path d="M83 0v84" stroke="#b7f5ff" stroke-opacity=".46" stroke-width="3"/>
      <ellipse cx="48" cy="24" rx="25" ry="9" fill="#d5fbff" opacity=".28"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(730 279)">
      <path d="M0 0h52l18 25v292l-18 25H0l-18-25V25Z" fill="url(#amber)" opacity=".92"/>
      <path d="M0 22h34l10 14v270l-10 14H0Z" fill="#ffd983" opacity=".22"/>
      <circle cx="17" cy="171" r="10" fill="#fff2bd"/>
    </g>
    <g transform="translate(830 279)">
      <path d="M0 0h52l18 25v292l-18 25H0l-18-25V25Z" fill="url(#amber)" opacity=".92"/>
      <path d="M0 22h34l10 14v270l-10 14H0Z" fill="#ffd983" opacity=".22"/>
      <circle cx="17" cy="171" r="10" fill="#fff2bd"/>
    </g>
    <g transform="translate(930 279)">
      <path d="M0 0h52l18 25v292l-18 25H0l-18-25V25Z" fill="url(#amber)" opacity=".92"/>
      <path d="M0 22h34l10 14v270l-10 14H0Z" fill="#ffd983" opacity=".22"/>
      <circle cx="17" cy="171" r="10" fill="#fff2bd"/>
    </g>
  </g>

  <g transform="translate(796 695)" filter="url(#shadow)">
    <path d="M-134 0c60-34 207-34 268 0" fill="none" stroke="#f0b651" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-100" cy="-9" r="11" fill="#f6c765"/>
    <circle cy="-25" r="11" fill="#f6c765"/>
    <circle cx="100" cy="-9" r="11" fill="#f6c765"/>
  </g>

  <g transform="translate(594 617) rotate(-18)" filter="url(#shadow)">
    <path d="M0 0h134a42 42 0 0 1 0 84H0A42 42 0 0 1 0 0Z" fill="url(#danger)"/>
    <path d="M68 0 52 23l22 16-21 18 18 27" fill="none" stroke="#ffd1bd" stroke-width="7" stroke-linejoin="round"/>
    <path d="M32 17c20-9 35-8 44-3" fill="none" stroke="#ffd5ca" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M728 602c-31 29-62 42-101 51" fill="none" stroke="#e85f62" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 15"/>

  <g transform="translate(1372 450)" filter="url(#shadow)">
    <circle r="92" fill="#0a2940" stroke="#75eadf" stroke-width="5"/>
    <circle r="70" fill="#0c3a50" stroke="#74e8df" stroke-opacity=".34" stroke-width="3"/>
    <path d="M-34 1-9 27 39-28" fill="none" stroke="#a6fff0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <ellipse cx="855" cy="450" rx="195" ry="235" fill="#ffbd4b" opacity=".08" filter="url(#softGlow)"/>
  <ellipse cx="1372" cy="450" rx="134" ry="134" fill="#4fe6d8" opacity=".1" filter="url(#softGlow)"/>
</svg>
