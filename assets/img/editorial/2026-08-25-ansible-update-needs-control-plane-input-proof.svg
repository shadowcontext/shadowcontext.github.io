<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected automation control plane</title>
  <desc id="desc">An abstract automation hub glows inside a layered shield while archive, webhook, and repository paths meet segmented security gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.52" stop-color="#102948"/>
      <stop offset="1" stop-color="#07101e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#38bdf8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset=".45" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#7dd3fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="435" rx="600" ry="410" fill="url(#halo)"/>
  <ellipse cx="800" cy="780" rx="430" ry="52" fill="#020617" opacity=".48" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M90 238 C300 238 370 340 535 377" stroke="#38bdf8" stroke-opacity=".35" stroke-width="10"/>
    <path d="M85 450 C290 450 370 450 516 450" stroke="#5eead4" stroke-opacity=".42" stroke-width="10"/>
    <path d="M95 674 C290 674 390 566 535 523" stroke="#818cf8" stroke-opacity=".35" stroke-width="10"/>
    <path d="M1510 238 C1300 238 1230 340 1065 377" stroke="#38bdf8" stroke-opacity=".35" stroke-width="10"/>
    <path d="M1515 450 C1310 450 1230 450 1084 450" stroke="#5eead4" stroke-opacity=".42" stroke-width="10"/>
    <path d="M1505 674 C1310 674 1210 566 1065 523" stroke="#818cf8" stroke-opacity=".35" stroke-width="10"/>
  </g>

  <g opacity=".95">
    <g transform="translate(210 171)">
      <rect width="142" height="112" rx="22" fill="#0f2741" stroke="#38bdf8" stroke-opacity=".7" stroke-width="3"/>
      <path d="M38 33h40l12 13h17v38H38z" fill="#38bdf8" opacity=".28"/>
      <path d="M38 46h69" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(178 394)">
      <rect width="166" height="112" rx="56" fill="#0f2741" stroke="#5eead4" stroke-opacity=".72" stroke-width="3"/>
      <circle cx="50" cy="56" r="15" fill="#5eead4"/>
      <circle cx="116" cy="56" r="15" fill="#5eead4" opacity=".65"/>
      <path d="M65 56h36" stroke="#ccfbf1" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(218 615)">
      <rect width="142" height="112" rx="22" fill="#0f2741" stroke="#818cf8" stroke-opacity=".72" stroke-width="3"/>
      <path d="M38 35h66v16H38zm0 27h66v16H38z" fill="#a5b4fc" opacity=".72"/>
      <circle cx="48" cy="89" r="5" fill="#c7d2fe"/>
      <circle cx="65" cy="89" r="5" fill="#c7d2fe" opacity=".6"/>
    </g>
  </g>

  <g fill="#0b1f36" stroke-width="3">
    <rect x="470" y="316" width="48" height="122" rx="18" stroke="#38bdf8"/>
    <rect x="451" y="420" width="67" height="60" rx="18" stroke="#5eead4"/>
    <rect x="470" y="462" width="48" height="122" rx="18" stroke="#818cf8"/>
    <rect x="1082" y="316" width="48" height="122" rx="18" stroke="#38bdf8"/>
    <rect x="1082" y="420" width="67" height="60" rx="18" stroke="#5eead4"/>
    <rect x="1082" y="462" width="48" height="122" rx="18" stroke="#818cf8"/>
  </g>
  <g fill="#e0f2fe" opacity=".9">
    <circle cx="494" cy="348" r="6"/><circle cx="494" cy="377" r="6"/><circle cx="494" cy="406" r="6"/>
    <circle cx="1106" cy="348" r="6"/><circle cx="1106" cy="377" r="6"/><circle cx="1106" cy="406" r="6"/>
    <circle cx="494" cy="494" r="6"/><circle cx="494" cy="523" r="6"/><circle cx="494" cy="552" r="6"/>
    <circle cx="1106" cy="494" r="6"/><circle cx="1106" cy="523" r="6"/><circle cx="1106" cy="552" r="6"/>
  </g>

  <path d="M800 120 C920 190 1032 207 1080 224 V431 C1080 604 974 718 800 782 C626 718 520 604 520 431 V224 C568 207 680 190 800 120Z" fill="url(#shield)" stroke="#99f6e4" stroke-opacity=".72" stroke-width="4"/>
  <path d="M800 178 C894 230 971 240 1014 256 V425 C1014 559 935 650 800 708 C665 650 586 559 586 425 V256 C629 240 706 230 800 178Z" fill="#071827" fill-opacity=".72" stroke="#67e8f9" stroke-opacity=".42" stroke-width="2"/>

  <g transform="translate(800 440)" filter="url(#glow)">
    <circle r="116" fill="#082f49" stroke="#67e8f9" stroke-width="4"/>
    <circle r="78" fill="#0f4560" stroke="#99f6e4" stroke-opacity=".8" stroke-width="3"/>
    <circle r="31" fill="url(#core)"/>
    <g stroke="#a7f3d0" stroke-width="12" stroke-linecap="round">
      <path d="M0-98V-64"/><path d="M0 64V98"/><path d="M-98 0h34"/><path d="M64 0h34"/>
      <path d="M-69-69l24 24"/><path d="M45 45l24 24"/><path d="M69-69L45-45"/><path d="M-45 45l-24 24"/>
    </g>
  </g>

  <g opacity=".7" fill="#dbeafe">
    <circle cx="1270" cy="176" r="5"/><circle cx="1331" cy="212" r="3"/><circle cx="1390" cy="165" r="4"/>
    <circle cx="310" cy="754" r="4"/><circle cx="374" cy="790" r="3"/><circle cx="253" cy="814" r="5"/>
  </g>
</svg>
