<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected layers of audit data</title>
  <desc id="desc">Abstract violet audit layers held inside a cyan protective boundary while amber data fragments are filtered at the edge.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1480" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091634"/>
      <stop offset="0.52" stop-color="#152554"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="violet" x1="430" y1="280" x2="1120" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5138A8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="310" y1="210" x2="1260" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DEBFF"/>
      <stop offset="0.55" stop-color="#22C7E8"/>
      <stop offset="1" stop-color="#167EA8"/>
    </linearGradient>
    <linearGradient id="amber" x1="1200" y1="250" x2="1360" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD487"/>
      <stop offset="1" stop-color="#F08A4B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(805 458) rotate(90) scale(430 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5367E8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5367E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="805" cy="458" rx="620" ry="430" fill="url(#halo)"/>
  <path d="M255 190C467 104 641 136 802 194C1002 266 1171 205 1373 126" fill="none" stroke="#8194FF" stroke-opacity=".13" stroke-width="2"/>
  <path d="M193 731C422 621 619 696 807 752C1018 815 1196 743 1419 626" fill="none" stroke="#70E5F8" stroke-opacity=".12" stroke-width="2"/>

  <g opacity=".34" fill="#94A5FF">
    <circle cx="278" cy="279" r="5"/><circle cx="324" cy="331" r="3"/><circle cx="1318" cy="191" r="4"/>
    <circle cx="1381" cy="692" r="5"/><circle cx="1249" cy="755" r="3"/><circle cx="224" cy="638" r="4"/>
  </g>

  <path d="M462 301L789 176L1140 319L1127 653L792 766L458 628Z" fill="#0B1732" stroke="url(#cyan)" stroke-width="9"/>
  <path d="M462 301L789 176L1140 319L1127 653L792 766L458 628Z" fill="none" stroke="#4CE4F4" stroke-opacity=".42" stroke-width="28" filter="url(#glow)"/>

  <g transform="translate(506 283)">
    <path d="M31 132L286 34L557 144L299 247Z" fill="url(#violet)" opacity=".62"/>
    <path d="M31 132L286 34L557 144L299 247Z" fill="none" stroke="#C4B5FD" stroke-opacity=".72" stroke-width="3"/>
    <path d="M28 222L296 119L563 229L298 333Z" fill="#624CC7" opacity=".74"/>
    <path d="M28 222L296 119L563 229L298 333Z" fill="none" stroke="#B9A8FF" stroke-opacity=".62" stroke-width="3"/>
    <path d="M26 315L297 211L566 322L298 430Z" fill="#362778" opacity=".92"/>
    <path d="M26 315L297 211L566 322L298 430Z" fill="none" stroke="#8FEFFF" stroke-opacity=".72" stroke-width="3"/>
    <path d="M297 211V430" stroke="#1ED3EF" stroke-opacity=".5" stroke-width="3"/>
    <path d="M26 315V343L298 454L566 347V322" fill="none" stroke="#53DBEE" stroke-opacity=".45" stroke-width="3"/>
  </g>

  <g filter="url(#soft)" opacity=".5">
    <ellipse cx="797" cy="483" rx="97" ry="42" fill="#62E8FF"/>
  </g>
  <path d="M711 465L797 432L887 469L798 505Z" fill="#B8F6FF" opacity=".9"/>
  <path d="M742 469L797 448L855 472L798 494Z" fill="#F2FDFF"/>

  <g fill="url(#amber)">
    <path d="M1204 301L1265 277L1317 300L1256 325Z" opacity=".95"/>
