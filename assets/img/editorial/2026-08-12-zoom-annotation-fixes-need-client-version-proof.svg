    <rect x="595" y="92" width="410" height="190" rx="40"/>
  </g>
  <g fill="#77b8d6" fill-opacity="0.2" stroke="#a8e2ee" stroke-opacity="0.22">
    <circle cx="320" cy="246" r="42"/>
    <path d="M238 330c13-49 45-74 82-74s69 25 82 74"/>
    <circle cx="1280" cy="246" r="42"/>
    <path d="M1198 330c13-49 45-74 82-74s69 25 82 74"/>
