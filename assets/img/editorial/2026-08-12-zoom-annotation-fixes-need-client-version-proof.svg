<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Meeting annotation traffic contained at a protected client boundary</title>
  <desc id="desc">Abstract meeting tiles surround a luminous annotation stroke that meets a layered shield before reaching protected client cores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.55" stop-color="#10263b"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#35d9c8" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#4c86ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#071525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8d8ef" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5691b9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8d72"/>
      <stop offset="0.45" stop-color="#ffd17a"/>
      <stop offset="0.72" stop-color="#7ce9d9"/>
      <stop offset="1" stop-color="#41a8ff"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7fff2" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#168fb2" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="440" rx="660" ry="390" fill="url(#halo)"/>
  <g fill="none" stroke="#9ccbe5" stroke-opacity="0.12">
    <ellipse cx="800" cy="450" rx="590" ry="300" stroke-width="2"/>
    <ellipse cx="800" cy="450" rx="450" ry="225"/>
  </g>
  <g fill="url(#glass)" stroke="#a9d5ed" stroke-opacity="0.3" stroke-width="2">
