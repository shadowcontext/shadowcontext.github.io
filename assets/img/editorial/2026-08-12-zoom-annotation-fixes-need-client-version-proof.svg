  <circle cx="800" cy="454" r="180" fill="#2ac8bb" fill-opacity="0.09" filter="url(#soft)"/>
  <g filter="url(#glow)">
    <path d="M222 492c91-58 162-74 225-35 68 42 101 5 150-35 51-42 90-44 139-8" fill="none" stroke="url(#stroke)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="222" cy="492" r="12" fill="#ff8d72"/>
  </g>
  <g transform="translate(800 455)">
