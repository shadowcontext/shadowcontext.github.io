<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded lifecycle for self-evolving agent skills</title>
  <desc id="desc">Abstract memory streams pass through a luminous security checkpoint into a layered archive of durable skills while a corrupted strand is isolated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.5" stop-color="#10243b"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#4ee0c1" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#287ca5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a1425" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63f4cf"/>
      <stop offset="0.5" stop-color="#7dd8ff"/>
      <stop offset="1" stop-color="#a48cff"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a7193" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#72e8d2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9bdfff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="archive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e9ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7256b8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9b70"/>
      <stop offset="1" stop-color="#ff547d"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="9" r="1" fill="#ffffff" opacity="0.035"/>
      <circle cx="29" cy="32" r="1.2" fill="#8ddfff" opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="820" cy="430" rx="620" ry="400" fill="url(#halo)"/>

  <g opacity="0.5" fill="none" stroke="#5795b2" stroke-width="2">
    <path d="M0 190 C190 110 340 250 520 190 S830 85 1030 190 S1380 260 1600 150"/>
    <path d="M0 700 C210 620 370 770 560 690 S860 590 1080 700 S1400 760 1600 640"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M90 330 C250 330 360 415 535 415" stroke="url(#stream)" stroke-width="18" opacity="0.8"/>
    <path d="M70 450 C245 450 365 450 535 450" stroke="url(#stream)" stroke-width="11" opacity="0.7"/>
    <path d="M120 565 C270 565 365 485 535 485" stroke="url(#stream)" stroke-width="15" opacity="0.75"/>
    <path d="M110 395 C275 395 360 530 535 530" stroke="url(#risk)" stroke-width="8" opacity="0.92" filter="url(#smallGlow)"/>
  </g>
  <g fill="#b9f4ff" opacity="0.75">
    <circle cx="164" cy="331" r="8"/><circle cx="256" cy="370" r="5"/><circle cx="335" cy="451" r="7"/>
    <circle cx="184" cy="565" r="6"/><circle cx="418" cy="490" r="5"/><circle cx="454" cy="420" r="7"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M620 215 L790 295 L790 535 C790 640 704 700 620 735 C536 700 450 640 450 535 L450 295 Z" fill="#0d2d42" fill-opacity="0.72" stroke="url(#gate)" stroke-width="7"/>
    <path d="M620 315 L700 354 L700 485 C700 545 657 585 620 605 C583 585 540 545 540 485 L540 354 Z" fill="none" stroke="#9cf6df" stroke-width="5" opacity="0.8"/>
    <circle cx="620" cy="441" r="34" fill="#83efd4" opacity="0.9"/>
    <path d="M620 468 L620 528" stroke="#83efd4" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M526 542 C495 585 446 610 386 621" fill="none" stroke="url(#risk)" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="334" cy="638" rx="76" ry="45" fill="#3d1729" stroke="#ff6d89" stroke-width="3"/>
    <path d="M305 638 L327 660 L367 613" fill="none" stroke="#ffb08c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <g transform="translate(840 238)">
    <path d="M0 104 C90 104 105 155 192 155" fill="none" stroke="url(#gate)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
    <g transform="translate(170 0)">
      <rect x="0" y="0" width="390" height="390" rx="44" fill="url(#archive)" stroke="#91dff4" stroke-width="3" opacity="0.95"/>
      <rect x="32" y="38" width="326" height="82" rx="25" fill="#153b53" stroke="#79e7d0" stroke-width="2"/>
      <rect x="32" y="154" width="326" height="82" rx="25" fill="#172f52" stroke="#83bdf5" stroke-width="2"/>
      <rect x="32" y="270" width="326" height="82" rx="25" fill="#202c52" stroke="#a696f1" stroke-width="2"/>
      <g fill="none" stroke-linecap="round" stroke-width="7">
        <path d="M72 79 H199" stroke="#74e8d0"/><path d="M231 79 H316" stroke="#74e8d0" opacity="0.45"/>
        <path d="M72 195 H160" stroke="#83bdf5"/><path d="M193 195 H316" stroke="#83bdf5" opacity="0.45"/>
        <path d="M72 311 H226" stroke="#a696f1"/><path d="M257 311 H316" stroke="#a696f1" opacity="0.45"/>
      </g>
      <circle cx="336" cy="24" r="18" fill="#70e6ce" filter="url(#smallGlow)"/>
    </g>
  </g>

  <g opacity="0.65" fill="#b9efff">
    <circle cx="1350" cy="160" r="3"/><circle cx="1450" cy="260" r="5"/><circle cx="1245" cy="720" r="4"/>
    <circle cx="980" cy="740" r="3"/><circle cx="260" cy="180" r="4"/><circle cx="82" cy="670" r="3"/>
  </g>
</svg>
