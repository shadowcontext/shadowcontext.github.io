<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI content passing through a provenance control</title>
  <desc id="desc">Abstract synthetic media layers pass through a luminous provenance seal into a protected field of verified content.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="0.55" stop-color="#10243a"/>
      <stop offset="1" stop-color="#07101b"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#56e4da" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#2e9fc4" stop-opacity=".10"/>
      <stop offset="1" stop-color="#2e9fc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcd72"/>
      <stop offset="1" stop-color="#f07b58"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72f2dc"/>
      <stop offset="1" stop-color="#39a9d6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1" fill="#fff" opacity=".05"/>
      <circle cx="38" cy="27" r="1.2" fill="#fff" opacity=".035"/>
      <circle cx="19" cy="49" r=".8" fill="#fff" opacity=".04"/>
    </pattern>
    <clipPath id="portal"><circle cx="835" cy="450" r="174"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="835" cy="450" rx="470" ry="390" fill="url(#aura)"/>

  <g opacity=".28" fill="none" stroke="#86a9ba" stroke-width="2">
