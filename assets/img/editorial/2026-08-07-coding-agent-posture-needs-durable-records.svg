<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Durable authority boundaries around a coding agent</title>
  <desc id="desc">An abstract agent core sits inside layered authority rings while capability paths converge through a luminous verification boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="60" x2="1450" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071527"/>
      <stop offset="0.5" stop-color="#102642"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(820 445) rotate(90) scale(390 560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38D7DC" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#2B78C5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#07111E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="952" y1="160" x2="1115" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EF9E8" stop-opacity="0.4"/>
      <stop offset="0.48" stop-color="#58E4E3"/>
      <stop offset="1" stop-color="#3889D2" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="core" x1="620" y1="285" x2="902" y2="623" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B0FFF2"/>
      <stop offset="0.42" stop-color="#43D8DD"/>
      <stop offset="1" stop-color="#286FB7"/>
    </linearGradient>
    <linearGradient id="amber" x1="250" y1="180" x2="650" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC978"/>
      <stop offset="1" stop-color="#E68749"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#aura)"/>
  <path d="M0 722C250 659 419 781 643 721C883 657 1055 734 1244 676C1379 635 1488 649 1600 687V900H0Z" fill="#07101C" fill-opacity="0.72"/>

