    <ellipse cx="760" cy="450" rx="344" ry="238" stroke="#5BBED1" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="3 18"/>
    <ellipse cx="760" cy="450" rx="271" ry="184" stroke="#68E1DE" stroke-opacity="0.38" stroke-width="2"/>
  </g>

  <g opacity="0.96">
    <path d="M228 218C386 235 442 314 555 370" fill="none" stroke="url(#amber)" stroke-width="5"/>
    <path d="M177 450C341 450 425 444 532 446" fill="none" stroke="url(#amber)" stroke-width="5"/>
