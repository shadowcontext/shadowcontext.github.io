    <circle cx="333" cy="114" r="10" fill="#74DCE1"/>
    <circle cx="330" cy="782" r="10" fill="#74DCE1"/>
  </g>

  <circle cx="760" cy="450" r="170" fill="#1A789A" fill-opacity="0.22" filter="url(#soft)"/>
  <path d="M760 294L894 371V529L760 606L626 529V371Z" fill="#0A1D31" stroke="url(#core)" stroke-width="7"/>
  <path d="M760 345L850 397V503L760 555L670 503V397Z" fill="url(#core)" fill-opacity="0.15" stroke="#8BF5EA" stroke-opacity="0.62" stroke-width="3"/>
  <circle cx="760" cy="450" r="54" fill="url(#core)" filter="url(#glow)"/>
  <path d="M735 433L711 450L735 467M785 433L809 450L785 467" fill="none" stroke="#071527" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="760" cy="450" r="92" fill="none" stroke="#B8FFF3" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="2 14"/>

