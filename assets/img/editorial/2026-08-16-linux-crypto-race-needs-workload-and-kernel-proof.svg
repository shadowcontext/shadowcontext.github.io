<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Synchronized cryptographic streams</title>
  <desc id="desc">Abstract cyan cryptographic streams pass through a synchronized circular gate while an amber state pulse remains isolated outside the protected path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10233b"/>
      <stop offset="1" stop-color="#081623"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#31d9dd" stop-opacity=".24"/>
      <stop offset="0.52" stop-color="#2589b8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b5a78" stop-opacity=".1"/>
      <stop offset="0.48" stop-color="#45d9df"/>
      <stop offset="1" stop-color="#b6fff4" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5fff5"/>
      <stop offset="0.45" stop-color="#3be0d9"/>
      <stop offset="1" stop-color="#1976a1"/>
    </linearGradient>
    <radialGradient id="amber">
      <stop offset="0" stop-color="#fff4c7"/>
      <stop offset="0.25" stop-color="#ffca68"/>
      <stop offset="0.65" stop-color="#f18a45" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f18a45" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grain" width="58" height="58" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="14" r="1" fill="#c8fff7" opacity=".07"/>
      <circle cx="42" cy="31" r="1.2" fill="#79dcea" opacity=".05"/>
      <circle cx="25" cy="51" r=".8" fill="#ffbd6c" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="746" rx="520" ry="72" fill="#020710" opacity=".55" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M72 298 C300 298 385 350 548 350 C660 350 686 322 752 322" stroke="url(#stream)" stroke-width="19"/>
    <path d="M72 450 C315 450 410 450 752 450" stroke="url(#stream)" stroke-width="19"/>
    <path d="M72 602 C300 602 385 550 548 550 C660 550 686 578 752 578" stroke="url(#stream)" stroke-width="19"/>
    <path d="M848 322 C1010 322 1075 298 1528 298" stroke="url(#stream)" stroke-width="19" opacity=".9"/>
    <path d="M848 450 C1125 450 1260 450 1528 450" stroke="url(#stream)" stroke-width="19" opacity=".9"/>
    <path d="M848 578 C1010 578 1075 602 1528 602" stroke="url(#stream)" stroke-width="19" opacity=".9"/>
  </g>

  <g fill="#a7fff3" filter="url(#glow)">
    <circle cx="544" cy="350" r="8"/><circle cx="604" cy="344" r="6"/><circle cx="666" cy="332" r="7"/>
    <circle cx="516" cy="450" r="7"/><circle cx="586" cy="450" r="9"/><circle cx="664" cy="450" r="6"/>
    <circle cx="544" cy="550" r="8"/><circle cx="604" cy="556" r="6"/><circle cx="666" cy="568" r="7"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="800" cy="450" r="228" fill="#092235" stroke="url(#ring)" stroke-width="18"/>
    <circle cx="800" cy="450" r="176" fill="none" stroke="#54e6df" stroke-opacity=".24" stroke-width="3"/>
    <path d="M800 252 A198 198 0 0 1 997 435" fill="none" stroke="#c8fff5" stroke-width="10" stroke-linecap="round"/>
    <path d="M800 648 A198 198 0 0 1 603 465" fill="none" stroke="#248fb3" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#8ffff0" stroke-width="14" stroke-linecap="round">
    <path d="M752 322 L848 322"/>
    <path d="M752 450 L848 450"/>
    <path d="M752 578 L848 578"/>
  </g>
  <g fill="#d7fff8">
    <circle cx="800" cy="322" r="13"/>
    <circle cx="800" cy="450" r="13"/>
    <circle cx="800" cy="578" r="13"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="558" cy="210" r="74" fill="url(#amber)"/>
    <circle cx="558" cy="210" r="20" fill="#ffd27a"/>
    <path d="M594 246 C644 292 662 325 670 372" fill="none" stroke="#f5a555" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 21"/>
  </g>
  <path d="M654 283 C704 233 750 210 800 210 C850 210 896 233 946 283" fill="none" stroke="#7ceee5" stroke-opacity=".2" stroke-width="4"/>
  <path d="M654 617 C704 667 750 690 800 690 C850 690 896 667 946 617" fill="none" stroke="#7ceee5" stroke-opacity=".2" stroke-width="4"/>

  <g opacity=".18" fill="none" stroke="#6cdce4" stroke-width="2">
    <circle cx="800" cy="450" r="286"/>
    <circle cx="800" cy="450" r="334" stroke-dasharray="5 20"/>
  </g>
</svg>
