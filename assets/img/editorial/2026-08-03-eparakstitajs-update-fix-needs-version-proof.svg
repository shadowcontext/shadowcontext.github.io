<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected software update approaching a secure digital document</title>
  <desc id="desc">Abstract editorial artwork showing a luminous update package passing through a layered verification gateway toward a protected document, while an unsafe fragment is diverted away.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071528"/>
      <stop offset="0.55" stop-color="#0b2540"/>
      <stop offset="1" stop-color="#102b35"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#53e0cf" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#2e82ba" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#071528" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6a8c" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#72f1dc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2a6a8c" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="package" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effffb"/>
      <stop offset="0.42" stop-color="#75e8d6"/>
      <stop offset="1" stop-color="#237aa3"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fbf7"/>
      <stop offset="1" stop-color="#7eb9c8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8de5da" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="820" cy="440" rx="650" ry="390" fill="url(#aura)"/>

