<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded virtual machine boot boundary</title>
  <desc id="desc">Abstract layered virtual disks move through a luminous guarded boot boundary while fragmented input remains contained below a protected host layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081527"/>
      <stop offset="0.52" stop-color="#102b45"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#63e6c5" stop-opacity=".32"/>
      <stop offset=".5" stop-color="#3e8ab8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43d6c2"/>
      <stop offset=".5" stop-color="#c6fff3"/>
      <stop offset="1" stop-color="#38a4cf"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9f8ed" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#55b9cd" stop-opacity=".62"/>
      <stop offset="1" stop-color="#173c61" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17314a"/>
      <stop offset=".5" stop-color="#255878"/>
      <stop offset="1" stop-color="#142c45"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="lowerClip">
      <rect x="0" y="462" width="1600" height="438"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="430" rx="660" ry="440" fill="url(#halo)"/>

  <g opacity=".22" fill="none" stroke="#80d7e8">
    <path d="M90 195C280 90 405 128 554 219S865 319 1032 210s315-107 478-14" stroke-width="2"/>
    <path d="M66 698c200 91 349 61 494-17s308-93 470 9 310 83 510-13" stroke-width="2"/>
    <circle cx="196" cy="219" r="5" fill="#80d7e8"/>
    <circle cx="1402" cy="688" r="5" fill="#80d7e8"/>
  </g>

  <g clip-path="url(#lowerClip)" opacity=".78">
    <path d="M334 690l54-38 49 21 28 67-76 30z" fill="#ef846c"/>
    <path d="M481 760l62-67 61 34-5 77-84 20z" fill="#d8657d"/>
    <path d="M1067 683l67-35 53 47-31 74-82-12z" fill="#ef846c"/>
    <path d="M1204 748l41-71 75 18 13 69-66 44z" fill="#b75e8f"/>
    <path d="M403 655l-58-56m187 94l-6-83m607 40l47-69m22 110l92-42" stroke="#f39a80" stroke-width="8" stroke-linecap="round"/>
    <g fill="#73a7be" opacity=".5">
      <circle cx="279" cy="742" r="10"/><circle cx="653" cy="782" r="7"/>
      <circle cx="985" cy="750" r="9"/><circle cx="1371" cy="731" r="7"/>
    </g>
  </g>

  <g transform="translate(800 586)">
    <ellipse rx="332" ry="86" fill="#06101d" opacity=".6" filter="url(#soft)"/>
    <path d="M-300-34c0-49 134-88 300-88s300 39 300 88v82c0 49-134 88-300 88s-300-39-300-88z" fill="url(#disk)" stroke="#89e4df" stroke-width="3"/>
    <ellipse cy="-34" rx="300" ry="88" fill="#4c9dbb" stroke="#b9fff3" stroke-width="4"/>
    <ellipse cy="-34" rx="190" ry="52" fill="#173855" stroke="#77d9d4" stroke-width="3"/>
    <ellipse cy="-34" rx="61" ry="18" fill="#081827" stroke="#b9fff3" stroke-width="3"/>
    <path d="M-299 1c0 49 134 88 299 88S299 50 299 1" fill="none" stroke="#b9fff3" stroke-opacity=".45" stroke-width="3"/>
  </g>

  <g filter="url(#glow)">
    <path d="M378 430H666l38-58h192l38 58h288" fill="none" stroke="#17354c" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M378 430H666l38-58h192l38 58h288" fill="none" stroke="url(#gate)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M731 430v-71c0-38 31-69 69-69s69 31 69 69v71" fill="none" stroke="#c7fff4" stroke-width="18" stroke-linecap="round"/>
  <path d="M756 430v-68c0-24 20-44 44-44s44 20 44 44v68" fill="none" stroke="#4db8cb" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(800 255)">
    <path d="M-358 26c0-52 160-94 358-94s358 42 358 94v67c0 52-160 94-358 94S-358 145-358 93z" fill="url(#host)" stroke="#75d9d3" stroke-width="3"/>
    <ellipse cy="26" rx="358" ry="94" fill="#255572" stroke="#bffff4" stroke-width="4"/>
    <ellipse cy="26" rx="248" ry="60" fill="#173850" stroke="#65c5cc" stroke-width="3"/>
    <ellipse cy="26" rx="88" ry="25" fill="#0a1c2d" stroke="#9ceee7" stroke-width="3"/>
    <path d="M-357 65c0 52 159 94 357 94s357-42 357-94" fill="none" stroke="#99ece4" stroke-opacity=".52" stroke-width="3"/>
  </g>

  <g fill="#ccfff5" opacity=".9">
    <circle cx="664" cy="430" r="6"/><circle cx="936" cy="430" r="6"/>
    <circle cx="800" cy="372" r="7"/>
  </g>
  <path d="M800 492v-44" stroke="#c9fff5" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 15"/>
  <path d="M800 222v-42" stroke="#c9fff5" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 15"/>

  <rect x="34" y="34" width="1532" height="832" rx="32" fill="none" stroke="#a6eee7" stroke-opacity=".12" stroke-width="2"/>
</svg>
