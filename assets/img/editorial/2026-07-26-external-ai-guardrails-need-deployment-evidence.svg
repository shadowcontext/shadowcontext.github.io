  <path d="M800 225C986 225 1098 323 1098 452C1098 581 986 679 800 679C614 679 502 581 502 452C502 323 614 225 800 225Z"
        fill="none" stroke="#8AF2DD" stroke-opacity="0.18" stroke-width="2"/>

  <g filter="url(#softGlow)">
