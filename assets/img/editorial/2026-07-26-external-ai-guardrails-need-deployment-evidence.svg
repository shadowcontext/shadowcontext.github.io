<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">External guardrail around an artificial intelligence core</title>
  <desc id="desc">Abstract layered AI core encircled by a separate translucent guardrail that sorts incoming signal ribbons by confidence.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="70" x2="1460" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182B"/>
      <stop offset="0.52" stop-color="#0B2941"/>
      <stop offset="1" stop-color="#091521"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientTransform="translate(810 452) rotate(90) scale(340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60E6D2" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#2489B7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#07182B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="580" y1="225" x2="1038" y2="676" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9FFF0" stop-opacity="0.88"/>
      <stop offset="0.46" stop-color="#41C9C3" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#3180B3" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="safeRibbon" x1="40" y1="230" x2="690" y2="395" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B7FA8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#46BFD0" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#8CF5DD"/>
    </linearGradient>
    <linearGradient id="reviewRibbon" x1="80" y1="710" x2="650" y2="556" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D19A46" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#E9B85C" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#FFD58A"/>
    </linearGradient>
    <linearGradient id="blockedRibbon" x1="1540" y1="210" x2="1110" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DE6A74" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E9827E" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#FFB193"/>
    </linearGradient>
    <filter id="blur40" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="coreClip">
      <path d="M800 278L953 365V538L800 625L647 538V365L800 278Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="810" cy="452" rx="430" ry="350" fill="url(#coreGlow)" filter="url(#blur40)"/>

  <g opacity="0.34" fill="none" stroke="#77DCCA">
    <path d="M209 159C420 60 608 88 754 174" stroke-width="2"/>
    <path d="M1385 710C1169 821 980 815 845 742" stroke-width="2"/>
    <path d="M127 535C293 618 426 632 536 590" stroke-width="1.5"/>
  </g>

  <g fill="none" stroke-linecap="round">
