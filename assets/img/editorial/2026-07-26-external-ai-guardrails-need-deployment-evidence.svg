    <circle cx="511" cy="532" r="11" fill="#F1C36D"/>
    <circle cx="1082" cy="367" r="11" fill="#F18B83"/>
  </g>

  <g clip-path="url(#coreClip)">
    <rect x="620" y="260" width="360" height="390" fill="#0C2A3E"/>
    <path d="M620 318L800 416L980 318V255H620V318Z" fill="#2D809F" fill-opacity="0.72"/>
    <path d="M620 584L800 486L980 584V660H620V584Z" fill="#145A78" fill-opacity="0.8"/>
    <path d="M620 318L800 416V486L620 584V318Z" fill="#1B6C84" fill-opacity="0.9"/>
    <path d="M980 318L800 416V486L980 584V318Z" fill="#123D5A" fill-opacity="0.92"/>
    <path d="M800 330L902 390V511L800 572L698 511V390L800 330Z" fill="#41C7BD" fill-opacity="0.28" stroke="#A8FFEC" stroke-opacity="0.74" stroke-width="3"/>
    <circle cx="800" cy="451" r="60" fill="#75EADB" fill-opacity="0.18"/>
    <circle cx="800" cy="451" r="26" fill="#BFFFF0" fill-opacity="0.9" filter="url(#softGlow)"/>
  </g>
  <path d="M800 278L953 365V538L800 625L647 538V365L800 278Z" fill="none" stroke="#70DCCC" stroke-opacity="0.62" stroke-width="4"/>

  <g fill="#C5FFF1">
    <circle cx="723" cy="406" r="5"/>
    <circle cx="759" cy="369" r="4" opacity="0.8"/>
    <circle cx="875" cy="405" r="5" opacity="0.86"/>
    <circle cx="871" cy="502" r="4" opacity="0.72"/>
