    <path d="M982 642c122-48 329-46 476 0v62H982z" fill="#173b4a" opacity="0.7"/>
  </g>

  <g fill="none" stroke="#72d8dc" stroke-width="4" opacity="0.42">
    <path d="M80 760c176-80 346-43 493 5s324 61 458-8 286-74 489-10"/>
    <path d="M95 796c166-58 335-27 475 18s330 48 468-12 280-60 470-20" opacity="0.45"/>
