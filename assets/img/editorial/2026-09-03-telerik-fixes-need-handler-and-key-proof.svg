    <rect x="392" y="342" width="164" height="16" rx="8" fill="#72d8dc" opacity="0.28"/>
    <rect x="392" y="376" width="188" height="16" rx="8" fill="#72d8dc" opacity="0.2"/>
    <rect x="170" y="486" width="430" height="164" rx="22" fill="#0a2130"/>
    <path d="M208 528h136l20 22h198v62H208z" fill="#225a6b" stroke="#6bd9d3" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M231 567h122M388 567h143" stroke="#a2e6e3" stroke-opacity="0.46" stroke-width="12" stroke-linecap="round"/>
  </g>

  <path d="M636 414C758 414 782 414 900 414" fill="none" stroke="#ff9a6c" stroke-opacity="0.24" stroke-width="84" stroke-linecap="round"/>
  <path d="M642 414H892" fill="none" stroke="url(#warm)" stroke-width="8" stroke-linecap="round" stroke-dasharray="22 18"/>
  <path d="M858 387l48 27-48 27" fill="none" stroke="#ffae70" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#glow)">
    <path d="M800 250l132 48v118c0 123-58 207-132 243-74-36-132-120-132-243V298z" fill="#0b2935" stroke="url(#shield)" stroke-width="16"/>
    <path d="M800 287l93 34v95c0 88-39 151-93 184-54-33-93-96-93-184v-95z" fill="url(#shield)" opacity="0.23"/>
    <path d="M760 432l27 28 58-71" fill="none" stroke="#9bffe7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
