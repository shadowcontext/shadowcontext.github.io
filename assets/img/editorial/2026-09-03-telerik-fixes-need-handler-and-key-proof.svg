<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shielded web editor file boundary</title>
  <desc id="desc">Abstract web editor panels sit behind a luminous shield and controlled file corridor, while a sealed key boundary protects layered folders from incoming requests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.58" stop-color="#102b3c"/>
      <stop offset="1" stop-color="#07121e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f55"/>
      <stop offset="1" stop-color="#0d2534"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#69f0d0"/>
      <stop offset="1" stop-color="#1d8fa5"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbf69"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8dd8df" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1260" cy="180" r="310" fill="#176477" opacity="0.13"/>
  <circle cx="300" cy="790" r="360" fill="#ee8262" opacity="0.07"/>

  <g opacity="0.95">
    <rect x="130" y="172" width="510" height="520" rx="34" fill="url(#panel)" stroke="#75cbd4" stroke-opacity="0.32" stroke-width="3"/>
    <rect x="170" y="215" width="430" height="54" rx="16" fill="#071c29"/>
    <circle cx="205" cy="242" r="8" fill="#ff7b72"/>
    <circle cx="231" cy="242" r="8" fill="#ffcf67"/>
    <circle cx="257" cy="242" r="8" fill="#64d8b4"/>
    <rect x="170" y="302" width="198" height="150" rx="20" fill="#1a4c61"/>
    <path d="M199 418l48-48 35 31 42-51 22 68z" fill="#6ee7d5" opacity="0.75"/>
    <circle cx="325" cy="337" r="17" fill="#ffbf69"/>
