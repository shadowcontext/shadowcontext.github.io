<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected decision core encircled by specialised AI facets</title>
  <desc id="desc">An abstract editorial composition of 32 blue and amber facets around a luminous protected core, with selected data paths crossing layered security boundaries.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061526"/>
      <stop offset="0.52" stop-color="#0b2940"/>
      <stop offset="1" stop-color="#112136"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#39c7d8" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#247f9b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071a2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6f8f4"/>
      <stop offset="0.5" stop-color="#4cd3d6"/>
      <stop offset="1" stop-color="#167b9e"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6d48d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d48a36" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c7ba0" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#70d8dd" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#f3c86f" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#f3c86f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="facet-blue">
      <path d="M782 104 L800 71 L818 104 L810 129 L790 129 Z" fill="#68d9de" fill-opacity="0.76" stroke="#b9f6ef" stroke-opacity="0.65" stroke-width="2"/>
      <path d="M800 71 L810 129 L790 129 Z" fill="#247f9b" fill-opacity="0.66"/>
    </g>
    <g id="facet-gold">
      <path d="M782 104 L800 71 L818 104 L810 129 L790 129 Z" fill="#efbd62" fill-opacity="0.8" stroke="#ffe4a9" stroke-opacity="0.64" stroke-width="2"/>
      <path d="M800 71 L810 129 L790 129 Z" fill="#b66a2f" fill-opacity="0.56"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="800" cy="438" r="430" fill="url(#aura)"/>
  <path d="M-80 294 C240 252 384 345 570 391 S880 476 1115 384 S1435 244 1680 325" fill="none" stroke="url(#stream)" stroke-width="9" opacity="0.5"/>
  <path d="M-70 598 C225 660 392 548 574 508 S910 390 1124 500 S1434 672 1680 584" fill="none" stroke="url(#stream)" stroke-width="5" opacity="0.42"/>
  <g fill="none" transform="translate(0 -12)">
    <circle cx="800" cy="450" r="337" stroke="#7adddc" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="800" cy="450" r="292" stroke="#e8b75e" stroke-opacity="0.32" stroke-width="3" stroke-dasharray="8 15"/>
    <circle cx="800" cy="450" r="238" stroke="#90eeea" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="800" cy="450" r="201" stroke="#0d405b" stroke-width="30" opacity="0.72"/>
  </g>
  <g transform="translate(0 -12)">
    <use href="#facet-gold" transform="rotate(0 800 450)"/><use href="#facet-blue" transform="rotate(11.25 800 450)"/>
    <use href="#facet-blue" transform="rotate(22.5 800 450)"/><use href="#facet-blue" transform="rotate(33.75 800 450)"/>
    <use href="#facet-gold" transform="rotate(45 800 450)"/><use href="#facet-blue" transform="rotate(56.25 800 450)"/>
    <use href="#facet-blue" transform="rotate(67.5 800 450)"/><use href="#facet-blue" transform="rotate(78.75 800 450)"/>
    <use href="#facet-gold" transform="rotate(90 800 450)"/><use href="#facet-blue" transform="rotate(101.25 800 450)"/>
    <use href="#facet-blue" transform="rotate(112.5 800 450)"/><use href="#facet-blue" transform="rotate(123.75 800 450)"/>
    <use href="#facet-gold" transform="rotate(135 800 450)"/><use href="#facet-blue" transform="rotate(146.25 800 450)"/>
    <use href="#facet-blue" transform="rotate(157.5 800 450)"/><use href="#facet-blue" transform="rotate(168.75 800 450)"/>
    <use href="#facet-gold" transform="rotate(180 800 450)"/><use href="#facet-blue" transform="rotate(191.25 800 450)"/>
    <use href="#facet-blue" transform="rotate(202.5 800 450)"/><use href="#facet-blue" transform="rotate(213.75 800 450)"/>
    <use href="#facet-gold" transform="rotate(225 800 450)"/><use href="#facet-blue" transform="rotate(236.25 800 450)"/>
    <use href="#facet-blue" transform="rotate(247.5 800 450)"/><use href="#facet-blue" transform="rotate(258.75 800 450)"/>
    <use href="#facet-gold" transform="rotate(270 800 450)"/><use href="#facet-blue" transform="rotate(281.25 800 450)"/>
    <use href="#facet-blue" transform="rotate(292.5 800 450)"/><use href="#facet-blue" transform="rotate(303.75 800 450)"/>
    <use href="#facet-gold" transform="rotate(315 800 450)"/><use href="#facet-blue" transform="rotate(326.25 800 450)"/>
    <use href="#facet-blue" transform="rotate(337.5 800 450)"/><use href="#facet-blue" transform="rotate(348.75 800 450)"/>
  </g>
  <g transform="translate(800 438)">
    <circle r="170" fill="#123d55" opacity="0.5" filter="url(#soft)"/>
    <path d="M0 -151 L117 -82 L135 47 L53 144 L-72 131 L-142 25 L-102 -101 Z" fill="url(#core)" opacity="0.96" filter="url(#glow)"/>
    <path d="M0 -151 L17 -29 L117 -82 Z M17 -29 L135 47 L53 144 Z M17 -29 L53 144 L-72 131 Z M17 -29 L-72 131 L-142 25 Z M17 -29 L-142 25 L-102 -101 Z M17 -29 L-102 -101 L0 -151 Z" fill="#103f5d" fill-opacity="0.42" stroke="#d3fbf5" stroke-opacity="0.26" stroke-width="2"/>
    <path d="M0 -102 C53 -76 89 -70 89 -70 V2 C89 67 49 109 0 130 C-49 109 -89 67 -89 2 V-70 C-89 -70 -53 -76 0 -102 Z" fill="url(#shield)" fill-opacity="0.34" stroke="#ffe3a2" stroke-opacity="0.8" stroke-width="4"/>
    <circle r="30" fill="#e9c26e" opacity="0.95"/>
    <circle r="13" fill="#08273b"/>
  </g>
  <g fill="#b7eff0" opacity="0.7">
    <circle cx="316" cy="240" r="5"/><circle cx="1280" cy="218" r="4"/><circle cx="1370" cy="560" r="6"/><circle cx="236" cy="618" r="4"/>
  </g>
  <g fill="#efc878" opacity="0.62">
    <circle cx="412" cy="735" r="6"/><circle cx="1198" cy="706" r="5"/><circle cx="1450" cy="382" r="4"/><circle cx="168" cy="400" r="5"/>
  </g>
  <path d="M266 451 C395 451 442 438 503 438" stroke="#81e1df" stroke-width="3" opacity="0.45"/>
  <path d="M1097 438 C1161 438 1218 451 1334 451" stroke="#e8bd6b" stroke-width="3" opacity="0.45"/>
  <circle cx="503" cy="438" r="9" fill="#8be5df" opacity="0.8"/>
  <circle cx="1097" cy="438" r="9" fill="#efc570" opacity="0.8"/>
</svg>
