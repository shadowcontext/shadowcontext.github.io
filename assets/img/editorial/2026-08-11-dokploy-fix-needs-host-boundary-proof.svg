<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Deployment control plane protected at the host boundary</title>
  <desc id="desc">Abstract editorial illustration of a luminous deployment control plane inside layered shields, with sharp command fragments becoming orderly bounded tokens before reaching protected infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102b43"/>
      <stop offset="1" stop-color="#071722"/>
    </linearGradient>
    <radialGradient id="aura" cx="59%" cy="48%" r="52%">
      <stop offset="0" stop-color="#4ddac8" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#247da0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff4df"/>
      <stop offset="0.5" stop-color="#2ba9b7"/>
      <stop offset="1" stop-color="#176188"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7fff1"/>
      <stop offset="0.42" stop-color="#48cbbb"/>
      <stop offset="1" stop-color="#14718d"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff765c"/>
      <stop offset="1" stop-color="#ffc269"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <pattern id="grain" width="52" height="52" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="10" r="1" fill="#d5fff5" opacity="0.07"/>
      <circle cx="37" cy="32" r="1.3" fill="#8ee8dc" opacity="0.05"/>
      <circle cx="20" cy="46" r="0.8" fill="#ffc269" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="920" cy="438" rx="660" ry="430" fill="url(#aura)"/>
  <ellipse cx="260" cy="250" rx="260" ry="170" fill="#ff765c" opacity="0.07" filter="url(#soft)"/>
  <ellipse cx="1370" cy="720" rx="300" ry="190" fill="#46d8c5" opacity="0.07" filter="url(#soft)"/>

  <g fill="none" stroke="url(#warning)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 245 L220 245 L254 196 L310 312 L365 218 L425 281 L505 281" stroke-width="13" opacity="0.84"/>
    <path d="M128 395 L246 395 L282 353 L330 443 L386 367 L458 416 L526 416" stroke-width="9" opacity="0.62"/>
    <path d="M98 546 L208 546 L245 512 L294 583 L350 526 L418 564 L522 564" stroke-width="6" opacity="0.42"/>
  </g>
  <g fill="#ffad68">
    <circle cx="84" cy="245" r="10"/><circle cx="128" cy="395" r="8"/><circle cx="98" cy="546" r="6"/>
