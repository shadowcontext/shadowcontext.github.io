  <path d="M835 164 C1082 164 1225 300 1207 487 C1191 642 1052 722 835 768 C618 722 479 642 463 487 C445 300 588 164 835 164 Z" fill="#0d3347" fill-opacity="0.58" stroke="url(#shield)" stroke-width="10"/>
