    <rect x="520" y="366" width="108" height="48" rx="24" fill="#132f42" stroke="#7de8d9" stroke-width="4"/>
    <rect x="520" y="462" width="76" height="48" rx="24" fill="#132f42" stroke="#7de8d9" stroke-width="4"/>
    <rect x="520" y="558" width="126" height="48" rx="24" fill="#132f42" stroke="#7de8d9" stroke-width="4"/>
    <path d="M606 294 H682 M628 390 H682 M596 486 H682 M646 582 H682" stroke="#79e4d6" stroke-width="5" stroke-linecap="round"/>
