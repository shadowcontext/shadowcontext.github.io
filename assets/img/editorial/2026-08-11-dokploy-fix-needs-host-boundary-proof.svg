  </g>
  <rect x="724" y="338" width="224" height="164" rx="35" fill="#0a2940" opacity="0.82"/>
  <g fill="#a8f8e9">
    <circle cx="771" cy="382" r="15"/><circle cx="836" cy="382" r="15"/><circle cx="901" cy="382" r="15"/>
    <rect x="755" y="430" width="162" height="18" rx="9" opacity="0.85"/>
    <rect x="782" y="466" width="108" height="14" rx="7" opacity="0.55"/>
  </g>
  <path d="M771 546 H901" stroke="#e1fff8" stroke-width="12" stroke-linecap="round" opacity="0.84"/>

  <g stroke="#68dece" stroke-width="5" fill="#102e42">
    <path d="M994 350 H1092"/>
    <path d="M994 438 H1142"/>
    <path d="M994 526 H1088"/>
    <rect x="1088" y="322" width="122" height="58" rx="20"/>
    <rect x="1138" y="409" width="128" height="58" rx="20"/>
    <rect x="1084" y="497" width="136" height="58" rx="20"/>
