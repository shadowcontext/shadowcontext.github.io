<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified platform layers sealing three security faults</title>
  <desc id="desc">An abstract cloud platform of layered blue tiles is crossed by three amber fault lines, all sealed inside a luminous verification ring.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="0.52" stop-color="#102e4b"/>
      <stop offset="1" stop-color="#08101d"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#31c8e7" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#1477a6" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#071326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fc8e5"/>
      <stop offset="0.5" stop-color="#1478ac"/>
      <stop offset="1" stop-color="#0a3e69"/>
    </linearGradient>
    <linearGradient id="tileDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174d73"/>
      <stop offset="1" stop-color="#0a2542"/>
    </linearGradient>
    <linearGradient id="fault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#f06d3b"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020914" flood-opacity="0.7"/>
    </filter>
    <clipPath id="panel"><rect x="56" y="56" width="1488" height="788" rx="42"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <g clip-path="url(#panel)">
    <circle cx="800" cy="438" r="575" fill="url(#aura)"/>
    <g fill="none" stroke="#7de7f5" opacity="0.09">
      <ellipse cx="800" cy="445" rx="610" ry="355" stroke-width="2"/>
      <ellipse cx="800" cy="445" rx="500" ry="286" stroke-width="2"/>
      <path d="M104 640 C390 500 505 251 800 173 C1095 251 1210 500 1496 640" stroke-width="3"/>
    </g>

    <g filter="url(#shadow)">
      <path d="M425 342 L800 190 L1175 342 L800 505 Z" fill="url(#tileDark)" stroke="#70ddec" stroke-width="3" opacity="0.9"/>
      <path d="M425 451 L800 299 L1175 451 L800 614 Z" fill="url(#tileDark)" stroke="#67d7e9" stroke-width="3" opacity="0.94"/>
      <path d="M425 562 L800 410 L1175 562 L800 725 Z" fill="url(#tile)" stroke="#9af2fa" stroke-width="4"/>
    </g>

    <g fill="none" stroke="url(#fault)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <path d="M584 276 L629 314 L605 357 L657 399 L636 447"/>
      <path d="M800 232 L777 288 L818 334 L786 389 L825 445"/>
      <path d="M1016 278 L973 318 L997 360 L945 403 L967 450"/>
    </g>

    <g fill="#ffe09a" filter="url(#softGlow)">
      <circle cx="636" cy="447" r="9"/>
      <circle cx="825" cy="445" r="9"/>
      <circle cx="967" cy="450" r="9"/>
    </g>

    <ellipse cx="800" cy="466" rx="458" ry="295" fill="none" stroke="#85eff7" stroke-width="9" stroke-opacity="0.9" filter="url(#softGlow)"/>
    <ellipse cx="800" cy="466" rx="431" ry="271" fill="none" stroke="#55cfe4" stroke-width="2" stroke-opacity="0.45"/>

    <g transform="translate(800 694)" filter="url(#softGlow)">
      <circle r="59" fill="#092841" stroke="#a5f6fb" stroke-width="6"/>
      <path d="M-27 0 L-7 21 L30 -24" fill="none" stroke="#dcffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g fill="#9aebf4" opacity="0.65">
      <circle cx="310" cy="226" r="6"/>
      <circle cx="1292" cy="237" r="6"/>
      <circle cx="239" cy="614" r="8"/>
      <circle cx="1364" cy="631" r="8"/>
      <circle cx="800" cy="113" r="7"/>
    </g>
  </g>
  <rect x="56" y="56" width="1488" height="788" rx="42" fill="none" stroke="#96edf5" stroke-width="2" stroke-opacity="0.18"/>
</svg>
