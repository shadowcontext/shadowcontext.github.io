<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified server update crossing a security checkpoint</title>
  <desc id="desc">Abstract editorial scene of layered server workflows moving through a luminous shield-like checkpoint from an amber pending state into a verified green state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2432"/>
      <stop offset="1" stop-color="#08211f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55f1c2" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#28bfa6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#28bfa6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a95d" stop-opacity="0.72"/>
