<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guarded component registration around a central message service</title>
  <desc id="desc">Abstract blue and amber editorial artwork showing verified application components converging through a guarded ring while an untrusted component remains outside.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162d"/>
      <stop offset="0.55" stop-color="#12355a"/>
      <stop offset="1" stop-color="#081b31"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#55d8e8"/>
      <stop offset="0.55" stop-color="#1685a4"/>
      <stop offset="1" stop-color="#0a3e63"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd071"/>
      <stop offset="1" stop-color="#e87936"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
