<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monitoring core protected by service-account boundaries</title>
  <desc id="desc">An abstract blue monitoring core sits inside layered teal identity boundaries while an amber authentication path is diverted away from the protected center.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0b2940"/>
      <stop offset="1" stop-color="#123b47"/>
    </linearGradient>
    <radialGradient id="core" cx="48%" cy="42%" r="65%">
      <stop offset="0" stop-color="#dffcff"/>
      <stop offset="0.3" stop-color="#65d9df"/>
      <stop offset="1" stop-color="#19718c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ce8df" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2d92b3" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd17a"/>
      <stop offset="1" stop-color="#e87945"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="350" fill="#3fe0d0" opacity="0.06" filter="url(#soft)"/>
  <path d="M0 700 C280 605 385 760 650 682 C910 606 1100 710 1600 545 L1600 900 L0 900Z" fill="#07111f" opacity="0.62"/>
  <path d="M0 195 C255 285 420 112 690 184 C980 260 1200 110 1600 225" fill="none" stroke="#4ec9d1" stroke-opacity="0.08" stroke-width="42"/>

  <g transform="translate(800 450)">
    <ellipse rx="410" ry="305" fill="none" stroke="#54d9d1" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="3 18"/>
    <ellipse rx="325" ry="245" fill="none" stroke="url(#ring)" stroke-width="34" opacity="0.34"/>
    <path d="M-285 -107 A305 230 0 0 1 208 -167" fill="none" stroke="#89f2e7" stroke-width="10" stroke-linecap="round" opacity="0.78"/>
    <path d="M286 107 A305 230 0 0 1 -202 170" fill="none" stroke="#2e96b6" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
    <ellipse rx="224" ry="168" fill="#061b2a" stroke="#53cbd3" stroke-width="3"/>
    <ellipse rx="154" ry="116" fill="url(#core)" opacity="0.22" filter="url(#glow)"/>
    <circle r="104" fill="url(#core)"/>
    <circle r="68" fill="#0b3147"/>
    <circle r="30" fill="#c9fbf4"/>
    <circle r="13" fill="#153e57"/>
    <g fill="#93f1e6">
      <circle cx="-326" cy="-85" r="11"/>
      <circle cx="292" cy="-133" r="9"/>
      <circle cx="326" cy="85" r="11"/>
      <circle cx="-270" cy="145" r="9"/>
    </g>
    <g stroke="#60d4d5" stroke-width="3" opacity="0.55">
      <path d="M-315 -82 L-210 -58"/>
      <path d="M282 -128 L196 -76"/>
      <path d="M315 82 L210 58"/>
      <path d="M-261 140 L-186 91"/>
    </g>
  </g>

  <g>
    <path d="M1410 348 C1260 338 1180 360 1100 402 C1034 437 982 438 948 418" fill="none" stroke="#ed9553" stroke-opacity="0.18" stroke-width="40" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M1410 348 C1260 338 1180 360 1100 402 C1034 437 982 438 948 418" fill="none" stroke="url(#amber)" stroke-width="12" stroke-linecap="round"/>
    <path d="M955 389 L916 415 L962 440" fill="#f2a45a"/>
    <circle cx="1412" cy="348" r="31" fill="#18293a" stroke="#f3aa60" stroke-width="5"/>
    <circle cx="1412" cy="348" r="11" fill="#ffd688"/>
  </g>

  <g fill="#89e8df" opacity="0.7">
    <circle cx="242" cy="260" r="5"/>
    <circle cx="326" cy="656" r="7"/>
    <circle cx="1280" cy="690" r="6"/>
    <circle cx="1208" cy="204" r="4"/>
  </g>
</svg>
