  <g transform="translate(800 452)">
    <path d="M0 -156 C90 -139 151 -98 166 -34 C181 32 151 112 83 154 C47 176 17 188 0 193 C-17 188 -47 176 -83 154 C-151 112 -181 32 -166 -34 C-151 -98 -90 -139 0 -156Z" fill="#092b4a" stroke="#89eaff" stroke-width="8"/>
    <path d="M0 -118 C63 -105 105 -74 115 -26 C126 23 103 82 57 111 C32 126 12 135 0 139 C-12 135 -32 126 -57 111 C-103 82 -126 23 -115 -26 C-105 -74 -63 -105 0 -118Z" fill="url(#core)" opacity="0.96"/>
    <circle cx="0" cy="0" r="53" fill="#071f39" stroke="#b6f5ff" stroke-width="5"/>
    <circle cx="0" cy="0" r="18" fill="#b8f5ff"/>
