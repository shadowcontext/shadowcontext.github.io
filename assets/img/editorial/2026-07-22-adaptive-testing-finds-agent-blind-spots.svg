      <path d="M0 53V75"/><path d="M-46 27L-63 38"/><path d="M-46 -27L-63 -36"/>
    </g>
  </g>

  <g fill="#ff8a5f" opacity="0.9">
    <path d="M527 340 l24 2 -14 20Z"/>
    <path d="M1071 297 l23 7 -18 16Z"/>
    <path d="M1093 595 l22 8 -19 15Z"/>
    <path d="M523 594 l23 3 -16 18Z"/>
