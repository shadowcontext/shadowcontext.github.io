<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Filtered input-device properties protect a Linux system core</title>
  <desc id="desc">An abstract blue input signal passes through a luminous security filter while a sharp amber property stream is diverted away from a protected central core.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="60" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0B2239"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(930 450) rotate(90) scale(360 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D7D1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#32D7D1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="170" y1="450" x2="1340" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2988FF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#45A6FF"/>
      <stop offset="0.75" stop-color="#56E1D5"/>
      <stop offset="1" stop-color="#A6FFF0" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="filter" x1="720" y1="185" x2="865" y2="735" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DFFF3" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#2BD4CF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1F7DA8" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="amber" x1="425" y1="620" x2="880" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB454" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#FFAD42"/>
      <stop offset="1" stop-color="#F05A46" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grain" width="68" height="68" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1.3" fill="#B8E6FF" opacity="0.12"/>
      <circle cx="49" cy="30" r="1" fill="#78B7D5" opacity="0.09"/>
      <circle cx="24" cy="59" r="0.8" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <rect width="1600" height="900" rx="36" fill="url(#grain)"/>
  <ellipse cx="930" cy="450" rx="470" ry="360" fill="url(#halo)"/>

  <g opacity="0.3" stroke="#3B83A8" stroke-width="2">
    <path d="M96 215C300 175 432 186 600 256"/>
    <path d="M107 690C310 744 470 723 626 655"/>
    <path d="M1040 178C1205 115 1392 145 1510 226"/>
    <path d="M1055 718C1245 792 1390 752 1515 662"/>
  </g>

  <g transform="translate(170 325)">
    <rect x="0" y="0" width="238" height="250" rx="54" fill="#0B2B4A" stroke="#277CB3" stroke-width="4"/>
    <rect x="42" y="42" width="154" height="90" rx="30" fill="#10243D" stroke="#45A6FF" stroke-width="4"/>
    <circle cx="83" cy="87" r="12" fill="#50D9DA"/>
    <circle cx="119" cy="87" r="12" fill="#328EDB"/>
    <circle cx="155" cy="87" r="12" fill="#235F9F"/>
    <path d="M68 174H170M68 204H144" stroke="#72BDF0" stroke-width="12" stroke-linecap="round" opacity="0.72"/>
    <path d="M238 125H292" stroke="#4EBAD7" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="url(#signal)" stroke-linecap="round">
    <path d="M462 450H650L698 382L753 521L811 340L864 450H1130" stroke-width="18" opacity="0.2" filter="url(#lineGlow)"/>
    <path d="M462 450H650L698 382L753 521L811 340L864 450H1130" stroke-width="7"/>
    <path d="M466 412H605" stroke-width="3" opacity="0.6"/>
    <path d="M466 488H628" stroke-width="3" opacity="0.45"/>
  </g>

  <g>
    <path d="M710 190L845 232V575C845 660 790 724 710 754C630 724 575 660 575 575V232L710 190Z" fill="#0A2036" fill-opacity="0.78" stroke="url(#filter)" stroke-width="7"/>
    <path d="M710 238L801 266V568C801 632 765 679 710 706C655 679 619 632 619 568V266L710 238Z" fill="#123D52" fill-opacity="0.36" stroke="#57DDD6" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="710" cy="450" r="72" fill="#28D2C7" opacity="0.12" filter="url(#softGlow)"/>
    <path d="M677 451L701 475L749 418" fill="none" stroke="#A1FFF3" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <path d="M420 640C535 615 615 632 674 681C710 711 755 733 823 738" fill="none" stroke="url(#amber)" stroke-width="38" stroke-linecap="round" opacity="0.22" filter="url(#lineGlow)"/>
    <path d="M420 640C535 615 615 632 674 681C710 711 755 733 823 738" fill="none" stroke="url(#amber)" stroke-width="10" stroke-linecap="round"/>
    <path d="M553 617L581 648L549 674" fill="none" stroke="#FFC16A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M792 712L843 741L790 768" fill="none" stroke="#F2734C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <circle cx="592" cy="650" r="9" fill="#FFD079"/>
    <circle cx="634" cy="666" r="6" fill="#FF9E45"/>
  </g>

  <g transform="translate(1118 285)">
    <circle cx="174" cy="165" r="162" fill="#0A2037" stroke="#285E7F" stroke-width="4"/>
    <circle cx="174" cy="165" r="121" fill="#0B2D46" stroke="#41C9C3" stroke-width="5" stroke-dasharray="9 17"/>
    <circle cx="174" cy="165" r="78" fill="#123E54" stroke="#80E9DE" stroke-width="4"/>
    <circle cx="174" cy="165" r="36" fill="#8EFFF1" opacity="0.18" filter="url(#softGlow)"/>
    <circle cx="174" cy="165" r="24" fill="#B4FFF4"/>
    <g fill="#48BFC0">
      <circle cx="174" cy="57" r="9"/>
      <circle cx="267" cy="111" r="9"/>
      <circle cx="267" cy="219" r="9"/>
      <circle cx="174" cy="273" r="9"/>
      <circle cx="81" cy="219" r="9"/>
      <circle cx="81" cy="111" r="9"/>
    </g>
  </g>

  <g fill="#6DDDD8">
    <circle cx="926" cy="450" r="7"/>
    <circle cx="980" cy="450" r="5" opacity="0.75"/>
    <circle cx="1030" cy="450" r="4" opacity="0.5"/>
  </g>
  <path d="M926 450H1118" stroke="#65DAD4" stroke-width="4" stroke-dasharray="2 18" stroke-linecap="round" opacity="0.55"/>

  <rect x="48" y="48" width="1504" height="804" rx="28" fill="none" stroke="#6CCBE2" stroke-opacity="0.12" stroke-width="2"/>
</svg>
