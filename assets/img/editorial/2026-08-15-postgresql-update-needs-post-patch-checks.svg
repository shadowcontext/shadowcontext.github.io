<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Database maintenance passing three verification checkpoints</title>
  <desc id="desc">Abstract blue database layers pass through a luminous amber maintenance ring while three small checkpoints protect a calm data horizon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.52" stop-color="#0b2c46"/>
      <stop offset="1" stop-color="#123e55"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3aa6c9"/>
      <stop offset="0.48" stop-color="#8ad7db"/>
      <stop offset="1" stop-color="#397fa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd47a" stop-opacity=".78"/>
      <stop offset="1" stop-color="#f0a43b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe09a"/>
      <stop offset="0.5" stop-color="#f2ad4b"/>
      <stop offset="1" stop-color="#d77b2e"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020b14" flood-opacity=".58"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 675 C270 600 465 714 735 654 C1010 593 1265 629 1600 553 L1600 900 L0 900Z" fill="#06111d" opacity=".55"/>
  <path d="M0 714 C283 639 494 748 785 685 C1068 624 1322 664 1600 602" fill="none" stroke="#45a9be" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="830" cy="440" r="335" fill="url(#glow)" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <ellipse cx="635" cy="318" rx="285" ry="91" fill="#174966" stroke="#8ad7db" stroke-width="7"/>
    <path d="M350 318 V540 C350 591 478 632 635 632 C792 632 920 591 920 540 V318" fill="#0d304a" stroke="#4b9fba" stroke-width="7"/>
    <ellipse cx="635" cy="318" rx="263" ry="68" fill="url(#data)" opacity=".9"/>
    <ellipse cx="635" cy="318" rx="191" ry="43" fill="#0a2a42" opacity=".7"/>
    <path d="M358 408 C400 456 505 478 635 478 C765 478 870 456 912 408" fill="none" stroke="#65c1ce" stroke-width="6" stroke-opacity=".7"/>
    <path d="M358 502 C400 550 505 572 635 572 C765 572 870 550 912 502" fill="none" stroke="#65c1ce" stroke-width="6" stroke-opacity=".52"/>
  </g>

  <g transform="translate(860 180)">
    <circle cx="205" cy="270" r="214" fill="none" stroke="#102b3b" stroke-width="74" opacity=".9"/>
    <path d="M205 56 A214 214 0 1 1 53 119" fill="none" stroke="url(#ring)" stroke-width="48" stroke-linecap="round"/>
    <path d="M59 116 L65 45 L126 79" fill="none" stroke="#ffe09a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="205" cy="270" r="117" fill="#0b2639" stroke="#6cc6cf" stroke-width="5"/>
    <path d="M145 273 L187 315 L273 222" fill="none" stroke="#f8c563" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#f7c65f" stroke="#ffe4a3" stroke-width="4">
    <circle cx="1040" cy="732" r="18"/>
    <circle cx="1160" cy="695" r="18"/>
    <circle cx="1280" cy="647" r="18"/>
  </g>
  <path d="M924 757 C1024 752 1076 719 1160 695 C1215 679 1244 656 1280 647" fill="none" stroke="#76cbd2" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <g fill="#a7e3df" opacity=".42">
    <circle cx="196" cy="174" r="5"/><circle cx="251" cy="214" r="3"/><circle cx="1376" cy="176" r="4"/>
    <circle cx="1450" cy="244" r="6"/><circle cx="1319" cy="120" r="3"/><circle cx="184" cy="721" r="4"/>
  </g>
</svg>
