<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protected mail layers crossing a security aperture</title>
  <desc id="desc">Abstract layered mail forms move through a luminous blue protective aperture as red threat fragments are deflected into darkness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="0.55" stop-color="#102a44"/>
      <stop offset="1" stop-color="#05101d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7de9ff" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#2c9fd1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2c9fd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8f4ff"/>
      <stop offset="0.45" stop-color="#37bddf"/>
      <stop offset="1" stop-color="#1767a4"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#77c8df"/>
    </linearGradient>
    <linearGradient id="mailDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a8eae"/>
      <stop offset="1" stop-color="#163e61"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="aperture"><ellipse cx="840" cy="454" rx="250" ry="316"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 706 C280 598 440 730 680 650 S1120 560 1600 694 V900 H0Z" fill="#061724" opacity="0.72"/>
  <circle cx="835" cy="450" r="410" fill="url(#halo)" filter="url(#blur)"/>

  <g opacity="0.26" fill="none" stroke="#58b6d2" stroke-width="2">
    <path d="M62 176 C310 110 434 164 585 284"/>
    <path d="M88 754 C326 806 486 736 615 621"/>
    <path d="M1010 177 C1216 95 1424 132 1548 242"/>
    <path d="M1042 700 C1278 790 1430 748 1560 638"/>
  </g>

  <g transform="translate(0 8)">
    <ellipse cx="840" cy="446" rx="292" ry="354" fill="#061525" stroke="#163f63" stroke-width="28"/>
    <ellipse cx="840" cy="446" rx="258" ry="322" fill="none" stroke="url(#gate)" stroke-width="18" filter="url(#glow)"/>
    <path d="M780 113 Q840 72 900 113 L883 164 Q840 142 797 164Z" fill="#57cde8" opacity="0.84"/>
    <path d="M780 779 Q840 820 900 779 L883 728 Q840 750 797 728Z" fill="#1c78aa" opacity="0.9"/>
  </g>

  <g clip-path="url(#aperture)" opacity="0.9">
    <path d="M524 236 L1118 92 L1242 660 L650 792Z" fill="#113853"/>
    <path d="M575 274 L1094 148 L1180 548 L662 674Z" fill="#174d69" opacity="0.72"/>
    <path d="M620 332 L1044 230 L1107 520 L684 622Z" fill="#79d7e8" opacity="0.12"/>
  </g>

  <g transform="rotate(-13 690 455)">
    <g opacity="0.42" transform="translate(-150 28)">
      <rect x="350" y="325" width="420" height="250" rx="28" fill="url(#mailDark)"/>
      <path d="M370 347 L560 479 L750 347" fill="none" stroke="#74c9de" stroke-width="13"/>
    </g>
    <g opacity="0.7" transform="translate(-72 12)">
      <rect x="350" y="325" width="420" height="250" rx="28" fill="url(#mailDark)" stroke="#4aa9c9" stroke-width="4"/>
      <path d="M370 347 L560 479 L750 347" fill="none" stroke="#91dcef" stroke-width="13"/>
      <path d="M372 554 L500 447 M748 554 L620 447" stroke="#3b88a8" stroke-width="10"/>
    </g>
    <g transform="translate(12 0)" filter="url(#glow)">
      <rect x="350" y="325" width="420" height="250" rx="28" fill="url(#mail)"/>
      <path d="M370 347 L560 479 L750 347" fill="none" stroke="#1b749a" stroke-width="14"/>
      <path d="M372 554 L500 447 M748 554 L620 447" stroke="#43a7c5" stroke-width="11"/>
    </g>
  </g>

  <g fill="#ff5b63" opacity="0.9">
    <path d="M1250 244 l58 -21 38 53 -42 48 -67 -20Z"/>
    <path d="M1308 406 l42 -15 26 39 -32 35 -48 -17Z"/>
    <path d="M1246 588 l69 14 5 65 -70 17 -34 -48Z"/>
    <path d="M1380 528 l35 -9 23 31 -22 32 -39 -10Z" opacity="0.7"/>
  </g>
  <g fill="none" stroke="#ff8187" stroke-linecap="round" opacity="0.42">
    <path d="M1202 257 Q1128 286 1097 354" stroke-width="6"/>
    <path d="M1246 618 Q1142 602 1097 548" stroke-width="6"/>
    <path d="M1268 427 Q1166 430 1102 458" stroke-width="5"/>
  </g>

  <g fill="#8eeeff">
    <circle cx="606" cy="186" r="7"/>
    <circle cx="520" cy="700" r="5" opacity="0.7"/>
    <circle cx="1032" cy="132" r="6" opacity="0.75"/>
    <circle cx="1112" cy="740" r="8" opacity="0.55"/>
  </g>
</svg>
