    <path d="M599 322v138" stroke="#9ef1ed" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g opacity="0.62" fill="#75d9df">
    <circle cx="1290" cy="246" r="8"/><circle cx="1344" cy="300" r="5"/><circle cx="1270" cy="652" r="6"/>
    <circle cx="344" cy="218" r="5"/><circle cx="405" cy="708" r="8"/>
  </g>
  <path d="M1180 706c80-16 137-67 178-151" fill="none" stroke="#2d8eaa" stroke-width="3" opacity="0.35"/>
  <path d="M424 163c-73 17-128 63-167 134" fill="none" stroke="#2d8eaa" stroke-width="3" opacity="0.35"/>
</svg>
