    </g>
    <path d="M318 54l24 20-17 22 30 27-21 30" fill="none" stroke="#ffb063" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>
  <g opacity="0.68" filter="url(#soft)">
    <circle cx="690" cy="350" r="7" fill="#efb067"/>
    <circle cx="730" cy="405" r="5" fill="#87def2"/>
    <circle cx="675" cy="482" r="9" fill="#8f7cff"/>
    <circle cx="744" cy="546" r="6" fill="#efb067"/>
    <circle cx="700" cy="610" r="5" fill="#87def2"/>
  </g>
  <rect x="794" y="105" width="34" height="690" rx="17" fill="url(#barrier)" filter="url(#glow)" opacity="0.76"/>
  <rect x="804" y="105" width="8" height="690" rx="4" fill="url(#barrier)"/>
  <g fill="none" stroke="#a4f4ff" stroke-width="3" opacity="0.75">
    <path d="M760 288l48 28 48-28"/>
    <path d="M760 450l48 28 48-28"/>
    <path d="M760 612l48 28 48-28"/>
  </g>
  <g>
    <rect x="930" y="205" width="475" height="490" rx="34" fill="#0b1d32" stroke="#91eaf7" stroke-width="3"/>
    <g clip-path="url(#newPanel)">
      <rect x="930" y="205" width="475" height="490" fill="url(#glass)"/>
      <circle cx="1315" cy="270" r="170" fill="#745cff" opacity="0.1"/>
