      <g fill="#80a6bd" opacity="0.65">
        <rect x="982" y="610" width="100" height="11" rx="5.5"/>
        <rect x="1102" y="610" width="68" height="11" rx="5.5"/>
        <rect x="1190" y="610" width="168" height="11" rx="5.5"/>
      </g>
    </g>
  </g>
  <g transform="translate(810 450)">
    <path d="M0-87C58-76 92-54 92-54v69c0 62-39 105-92 132-53-27-92-70-92-132v-69S-58-76 0-87z" fill="#0b2538" stroke="#a4f6ff" stroke-width="5"/>
    <path d="M-35 16l24 24 50-60" fill="none" stroke="#b6fbff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#c9f8ff">
