<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Observability interface protected by a verified security boundary</title>
  <desc id="desc">Abstract telemetry streams pass from layered dashboard panels through a luminous filtering boundary into a clean isolated interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071322"/>
      <stop offset="0.55" stop-color="#102640"/>
      <stop offset="1" stop-color="#160f2e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ae9ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8275ff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef5ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#8ef5ff" stop-opacity="0.9"/>
      <stop offset="0.68" stop-color="#b794ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b794ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#65e8ff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#776bff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#776bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="newPanel">
      <rect x="930" y="205" width="475" height="490" rx="34"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="975" cy="445" rx="530" ry="470" fill="url(#halo)"/>
  <g opacity="0.24" fill="none" stroke="#7fcce5" stroke-width="2">
    <path d="M70 170C300 105 410 155 585 285S835 395 1025 310 1335 215 1535 310"/>
    <path d="M35 710C245 630 350 675 525 760S860 785 1040 650 1340 575 1570 670"/>
  </g>
  <g transform="translate(125 225) rotate(-5 300 230)">
    <rect width="540" height="460" rx="34" fill="#081727" stroke="#36516d" stroke-width="3"/>
    <rect x="32" y="34" width="476" height="392" rx="22" fill="url(#glass)" stroke="#50708d" stroke-opacity="0.58"/>
    <g fill="none" stroke-linecap="round">
      <path d="M76 130C135 70 190 208 248 146S365 103 452 176" stroke="#55c8e4" stroke-width="12" opacity="0.62"/>
      <path d="M76 270C160 220 198 330 278 258S390 207 462 238" stroke="#8978f4" stroke-width="11" opacity="0.52"/>
      <path d="M76 351H210M240 351H332M362 351H456" stroke="#5e809c" stroke-width="10"/>
