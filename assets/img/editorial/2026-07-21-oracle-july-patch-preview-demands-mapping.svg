<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise systems converging into a prioritized patch path</title>
  <desc id="desc">Abstract layers of enterprise systems converge through a luminous prioritization shield and emerge as a controlled stream of verified patches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.5" stop-color="#142a3d"/>
      <stop offset="1" stop-color="#090d1b"/>
    </linearGradient>
    <radialGradient id="halo" cx="54%" cy="49%" r="54%">
      <stop offset="0" stop-color="#e8894d" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#34c9c3" stop-opacity=".13"/>
      <stop offset="1" stop-color="#071522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f82"/>
      <stop offset="1" stop-color="#172d4a"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd49a"/>
      <stop offset=".45" stop-color="#f08b4b"/>
      <stop offset="1" stop-color="#b64b59"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45d8cf"/>
      <stop offset="1" stop-color="#c3fff1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#02060d" flood-opacity=".72"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="840" cy="450" rx="730" ry="410" fill="url(#halo)"/>
  <g fill="none" stroke="#9ae9e3" stroke-opacity=".07" stroke-width="2">
    <path d="M0 148 C310 46 494 181 778 104 S1287 70 1600 162"/>
    <path d="M0 758 C293 660 527 788 803 716 S1310 656 1600 766"/>
    <circle cx="1410" cy="170" r="53"/><circle cx="1410" cy="170" r="90"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(92 155)">
      <path d="M0 54 L256 0 L455 64 L197 123 Z" fill="url(#stack)" stroke="#6fc1ce" stroke-opacity=".55" stroke-width="3"/>
      <g fill="#94e1e2" fill-opacity=".62">
        <circle cx="78" cy="60" r="9"/><circle cx="132" cy="48" r="9"/><circle cx="186" cy="37" r="9"/>
      </g>
      <path d="M250 60 L371 86" stroke="#b2eff0" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="translate(62 345)">
      <path d="M0 65 L298 0 L520 76 L220 145 Z" fill="url(#stack)" stroke="#79cbd1" stroke-opacity=".66" stroke-width="3"/>
      <g fill="#9ee7e4" fill-opacity=".68">
        <circle cx="84" cy="73" r="10"/><circle cx="148" cy="59" r="10"/><circle cx="212" cy="45" r="10"/>
      </g>
      <path d="M290 70 L430 106" stroke="#bcf2ef" stroke-opacity=".55" stroke-width="11" stroke-linecap="round"/>
    </g>
    <g transform="translate(116 578)">
      <path d="M0 62 L270 0 L474 69 L202 132 Z" fill="url(#stack)" stroke="#65b7c5" stroke-opacity=".56" stroke-width="3"/>
      <g fill="#89d7dc" fill-opacity=".62">
        <circle cx="79" cy="68" r="9"/><circle cx="137" cy="55" r="9"/><circle cx="195" cy="42" r="9"/>
      </g>
      <path d="M266 65 L386 95" stroke="#a9e9e9" stroke-opacity=".48" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M495 238 C620 269 650 350 710 397" stroke="#de744d" stroke-opacity=".25" stroke-width="40"/>
    <path d="M558 430 C623 433 665 438 716 442" stroke="#f0a05f" stroke-opacity=".27" stroke-width="42"/>
    <path d="M518 655 C628 618 654 531 711 487" stroke="#de744d" stroke-opacity=".24" stroke-width="40"/>
    <path d="M495 238 C620 269 650 350 710 397" stroke="url(#hot)" stroke-width="9" stroke-dasharray="4 25"/>
    <path d="M558 430 C623 433 665 438 716 442" stroke="url(#hot)" stroke-width="10" stroke-dasharray="4 24"/>
    <path d="M518 655 C628 618 654 531 711 487" stroke="url(#hot)" stroke-width="9" stroke-dasharray="4 25"/>
  </g>

  <g filter="url(#glow)">
    <path d="M835 238 C917 291 972 300 1023 316 V458 C1023 568 949 646 835 693 C721 646 647 568 647 458 V316 C698 300 753 291 835 238 Z" fill="#10283a" stroke="url(#safe)" stroke-width="14"/>
    <path d="M835 300 C891 335 930 340 963 351 V454 C963 526 915 579 835 619 C755 579 707 526 707 454 V351 C740 340 779 335 835 300 Z" fill="#0a1827" stroke="#9df4e8" stroke-opacity=".42" stroke-width="4"/>
    <path d="M765 450 L816 501 L916 392" fill="none" stroke="#e4fff8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M1016 447 C1088 447 1110 447 1174 447" stroke="#42d6ce" stroke-opacity=".22" stroke-width="46"/>
    <path d="M1016 447 C1088 447 1110 447 1174 447" stroke="url(#safe)" stroke-width="12"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(1162 286)">
      <rect width="340" height="78" rx="24" fill="#123b48" stroke="#58dcd2" stroke-opacity=".65" stroke-width="3"/>
      <circle cx="48" cy="39" r="16" fill="#69e3d8"/>
      <path d="M88 39 H280" stroke="#b6fff0" stroke-opacity=".62" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g transform="translate(1125 405)">
      <rect width="385" height="86" rx="26" fill="#154653" stroke="#78eee0" stroke-width="4"/>
      <circle cx="53" cy="43" r="18" fill="#a7f8e9"/>
      <path d="M99 43 H318" stroke="url(#safe)" stroke-width="14" stroke-linecap="round"/>
    </g>
    <g transform="translate(1175 534)">
      <rect width="327" height="74" rx="23" fill="#123843" stroke="#4bcfc8" stroke-opacity=".62" stroke-width="3"/>
      <circle cx="46" cy="37" r="15" fill="#62dbd2"/>
      <path d="M84 37 H268" stroke="#adf9eb" stroke-opacity=".56" stroke-width="11" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="#d7fff6" opacity=".48">
    <circle cx="1425" cy="714" r="5"/><circle cx="1493" cy="668" r="3"/><circle cx="1360" cy="754" r="4"/>
  </g>
</svg>
