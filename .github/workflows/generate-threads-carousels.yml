name: Generate Threads Carousels

# Paused on 2026-07-29. Restore the push trigger and remove the job guard to resume.
on:
  workflow_dispatch:
    inputs:
      post_url:
        description: Canonical URL, slug, filename, or repository post path
        required: true
        type: string
      dry_run:
        description: Generate artifacts without committing public images
        required: true
        type: boolean
        default: true

concurrency:
  group: shadowcontext-threads-carousel-mutations
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:threads-carousel:check

      - name: Lint automation
        run: npm run lint:threads-carousel

      - name: Run unit tests
        run: npm run test:threads-carousel

      - name: Find newly added posts
        id: posts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          SELECTED_POST: ${{ inputs.post_url }}
        run: |
          mkdir -p .artifacts/threads-carousel
          post_list=".artifacts/threads-carousel/selected-posts.txt"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$SELECTED_POST" > "$post_list"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only --diff-filter=A -r "$AFTER_SHA" -- '_posts/*.md' > "$post_list"
          else
            git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '_posts/*.md' > "$post_list"
          fi
          sed -i '/^[[:space:]]*$/d' "$post_list"
          count="$(wc -l < "$post_list" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count newly added post(s)."

      - name: Validate Gemini credentials
        if: steps.posts.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::Required GitHub Actions secret GEMINI_API_KEY is unavailable."
            exit 1
          fi

      - name: Generate carousels
        id: generate
        if: steps.posts.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            dry_run=false
          else
            dry_run="$MANUAL_DRY_RUN"
          fi
          failures=0
          while IFS= read -r post; do
            artifact_name="$(printf '%s' "$post" | tr -cs 'A-Za-z0-9._-' '-')"
            artifact_root=".artifacts/threads-carousel/generation/$artifact_name"
            if ! GITHUB_OUTPUT= node automation/threads-carousel/cli.mjs prepare \
              --dry-run "$dry_run" \
              --post "$post" \
              --max-posts 1 \
              --artifact-root "$artifact_root" \
              --manifest "$artifact_root/manifest.json"; then
              failures=$((failures + 1))
            fi
          done < .artifacts/threads-carousel/selected-posts.txt
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Commit generated public media and queue manifests
        id: commit_media
        if: steps.generate.outputs.dry_run == 'false'
        run: |
          echo "committed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/social/threads/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate Threads carousel media [skip threads]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Publish ready carousels immediately
        if: steps.commit_media.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-threads-carousels.yml \
            --ref main \
            --field dry_run=false

      - name: Upload sanitized generation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-carousel-generation-${{ github.run_id }}
          path: .artifacts/threads-carousel/
          if-no-files-found: warn
          retention-days: 14

      - name: Report generation failures
        if: steps.generate.outputs.failures != '0'
        env:
          FAILURES: ${{ steps.generate.outputs.failures }}
        run: |
          echo "::error::$FAILURES carousel generation(s) failed. Inspect the sanitized artifacts."
          exit 1
