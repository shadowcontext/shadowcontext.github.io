name: Test Threads Text Post

on:
  push:
    branches:
      - main
    paths:
      - ".github/threads-text-live-test"

concurrency:
  group: shadowcontext-threads-text-live-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Threads client
        run: node --test automation/threads/threads-api.test.mjs

      - name: Validate Threads credentials
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          for name in THREADS_USER_ID THREADS_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is unavailable."
              exit 1
            fi
          done

      - name: Publish test message
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from "node:fs/promises";
          import { publishThreadsText } from "./automation/threads/threads-api.mjs";

          const message = "ShadowContext Threads API test — 2026-07-27.";
          const postId = await publishThreadsText(message);
          const result = {
            status: "published",
            message,
            threads_post_id: postId,
            published_at: new Date().toISOString(),
          };
          await mkdir(".artifacts/threads-text-test", { recursive: true });
          await writeFile(
            ".artifacts/threads-text-test/result.json",
            `${JSON.stringify(result, null, 2)}\n`,
            "utf8",
          );
          console.log(
            JSON.stringify({ status: result.status, postId: result.threads_post_id }),
          );
          NODE

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-text-test-${{ github.run_id }}
          path: .artifacts/threads-text-test/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit sanitized result
        run: |
          cp .artifacts/threads-text-test/result.json .github/threads-text-test-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/threads-text-test-result.json
          git commit -m "test: record Threads text publication"
          git pull --rebase origin main
          git push origin HEAD:main
