name: One-Time Threads Hello World Test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/threads-hello-world-test.yml'

permissions:
  contents: read

concurrency:
  group: threads-rss-publishing
  cancel-in-progress: false

jobs:
  post-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Post Hello World to Threads
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { publishThreadsText } from './automation/threads/threads-api.mjs';

          const postId = await publishThreadsText('Hello World!');
          console.log(`Threads test post published successfully (post ID: ${postId})`);
          NODE
