name: Post New Feed Items to X

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore last posted item
        uses: actions/cache/restore@v4
        with:
          path: .x-post-state
          key: x-post-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            x-post-state-${{ runner.os }}-

      - name: Read latest feed item
        id: feed
        env:
          FEED_URL: https://shadowcontext.com/feed.xml
        run: |
          mkdir -p .x-post-state
          curl --fail --silent --show-error --location --retry 3 \
            "$FEED_URL" --output /tmp/shadowcontext-feed.xml

          python3 <<'PY'
          import html
          import os
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/shadowcontext-feed.xml').getroot()
          if root.tag.endswith('feed'):
              namespace = {'atom': 'http://www.w3.org/2005/Atom'}
              entry = root.find('atom:entry', namespace)
              if entry is None:
                  raise SystemExit('The Atom feed contains no entries')
              title = entry.findtext('atom:title', default='', namespaces=namespace).strip()
              item_id = entry.findtext('atom:id', default='', namespaces=namespace).strip()
              summary_node = entry.find('atom:summary', namespace)
              if summary_node is None:
                  summary_node = entry.find('atom:content', namespace)
              summary = ''.join(summary_node.itertext()) if summary_node is not None else ''
              links = entry.findall('atom:link', namespace)
              link = next((node.get('href', '') for node in links if node.get('rel', 'alternate') == 'alternate'), '')
          else:
              item = root.find('./channel/item')
              if item is None:
                  raise SystemExit('The RSS feed contains no items')
              title = (item.findtext('title') or '').strip()
              link = (item.findtext('link') or '').strip()
              item_id = (item.findtext('guid') or link).strip()
              summary = item.findtext('description') or ''

          title = html.unescape(title)
          if not title or not link or not item_id:
              raise SystemExit('The latest feed item is missing a title, URL, or ID')

          state_path = pathlib.Path('.x-post-state/current')
          previous_id = state_path.read_text().strip() if state_path.exists() else ''
          has_new = item_id != previous_id
          blocked = bool(re.search(r'\bbreach(?:ed|es|ing)?\b|\bdata\s+leak', f'{title} {summary}', re.IGNORECASE))
          should_post = has_new and not blocked

          max_title_length = max(1, 280 - len(link) - 2)
          if len(title) > max_title_length:
              title = title[:max_title_length - 1].rstrip() + '…'
          message = f'{title}\n\n{link}'

          if has_new:
              pathlib.Path('.x-post-state/pending').write_text(item_id)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'has_new={str(has_new).lower()}\n')
              output.write(f'should_post={str(should_post).lower()}\n')
              output.write('message<<X_POST_MESSAGE\n')
              output.write(message + '\n')
              output.write('X_POST_MESSAGE\n')
          PY

      - name: Post latest item to X
        if: steps.feed.outputs.should_post == 'true'
        uses: captradeoff/x-post-action@3538d7eeb4e7d50013ed06127f352967967da8c9 # v1.2
        with:
          appKey: ${{ secrets.X_CONSUMER_KEY }}
          appSecret: ${{ secrets.X_CONSUMER_SECRET }}
          accessToken: ${{ secrets.X_ACCESS_TOKEN }}
          accessSecret: ${{ secrets.X_ACCESS_SECRET }}
          message: ${{ steps.feed.outputs.message }}

      - name: Record processed item
        if: steps.feed.outputs.has_new == 'true'
        run: mv .x-post-state/pending .x-post-state/current

      - name: Save last posted item
        if: steps.feed.outputs.has_new == 'true'
        uses: actions/cache/save@v4
        with:
          path: .x-post-state
          key: x-post-state-${{ runner.os }}-${{ github.run_id }}
