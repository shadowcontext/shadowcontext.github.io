name: Test Instagram Carousel

on:
  push:
    branches:
      - main
    paths:
      - ".github/instagram-carousel-test"

concurrency:
  group: shadowcontext-instagram-carousel-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Instagram client
        run: node --test automation/instagram/*.test.mjs

      - name: Publish latest carousel to Instagram
        id: publish
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_GRAPH_API_VERSION: ${{ vars.INSTAGRAM_GRAPH_API_VERSION }}
        run: node automation/instagram/publish-latest-carousel.mjs

      - name: Commit successful Instagram publication state
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- automation/instagram/state.json
          git commit -m "chore: record Instagram carousel publication"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-carousel-test-${{ github.run_id }}
          path: .artifacts/instagram/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce publication result
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::Instagram carousel publication failed. Inspect the sanitized artifact."
          exit 1
