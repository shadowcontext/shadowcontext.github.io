name: Test Instagram Picture

on:
  push:
    branches:
      - main
    paths:
      - ".github/instagram-picture-test"

concurrency:
  group: shadowcontext-instagram-picture-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Instagram client
        run: node --test automation/instagram/*.test.mjs

      - name: Publish one picture to Instagram
        id: publish
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_API_VERSION: ${{ vars.INSTAGRAM_GRAPH_API_VERSION }}
        run: node automation/instagram/publish-picture-test.mjs

      - name: Commit sanitized test result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- automation/instagram/last-picture-test.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record Instagram picture result"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-picture-test-${{ github.run_id }}
          path: automation/instagram/last-picture-test.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce publication result
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::Instagram picture publication failed. See the sanitized result committed by the prior step."
          exit 1
