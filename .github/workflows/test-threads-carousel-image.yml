name: Test One Threads Carousel Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/threads-carousel-image-test"

concurrency:
  group: shadowcontext-threads-carousel-image-test
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Gemini credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::Required GitHub Actions secret GEMINI_API_KEY is unavailable."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:threads-carousel:check

      - name: Lint automation
        run: npm run lint:threads-carousel

      - name: Run unit tests
        run: npm run test:threads-carousel

      - name: Generate one repository-hosted carousel
        id: prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          selected_post="$(tr -d '\r\n' < .github/threads-carousel-image-test)"
          node automation/threads-carousel/cli.mjs prepare \
            --dry-run false \
            --post "$selected_post" \
            --max-posts 1

      - name: Commit generated images
        if: steps.prepare.outputs.has_posts == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/social/threads/
          git commit -m "test: save revised carousel images [skip threads]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload sanitized test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-carousel-image-test-${{ github.run_id }}
          path: .artifacts/threads-carousel/
          if-no-files-found: warn
          retention-days: 14

      - name: Report failures
        if: always() && hashFiles('.artifacts/threads-carousel/manifest.json') != ''
        run: node automation/threads-carousel/cli.mjs assert-result
