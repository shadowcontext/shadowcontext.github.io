name: Publish Ready Threads Carousels

# Paused on 2026-07-29. Restore the schedules and remove the job guards to resume.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List ready carousels without calling Threads
        required: true
        type: boolean
        default: true

concurrency:
  group: shadowcontext-threads-carousel-mutations
  cancel-in-progress: false

jobs:
  dry-run:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:threads-carousel:check

      - name: Lint automation
        run: npm run lint:threads-carousel

      - name: Run unit tests
        run: npm run test:threads-carousel

      - name: Preview ready carousel queue
        env:
          MAX_POSTS: ${{ vars.THREADS_MAX_POSTS_PER_RUN }}
        run: |
          node automation/threads-carousel/cli.mjs queue \
            --dry-run true \
            --max-posts "${MAX_POSTS:-10}"

      - name: Upload sanitized queue manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-carousel-publish-preview-${{ github.run_id }}
          path: .artifacts/threads-carousel/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate live-publishing controls
        env:
          PUBLISHING_ENABLED: ${{ vars.THREADS_PUBLISHING_ENABLED }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          if [[ "$PUBLISHING_ENABLED" != "true" ]]; then
            echo "::error::Live Threads publishing is disabled. Set THREADS_PUBLISHING_ENABLED=true."
            exit 1
          fi
          for name in THREADS_ACCESS_TOKEN THREADS_USER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is unavailable."
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:threads-carousel:check

      - name: Lint automation
        run: npm run lint:threads-carousel

      - name: Run unit tests
        run: npm run test:threads-carousel

      - name: Build ready carousel queue
        id: queue
        env:
          MAX_POSTS: ${{ vars.THREADS_MAX_POSTS_PER_RUN }}
        run: |
          node automation/threads-carousel/cli.mjs queue \
            --dry-run false \
            --max-posts "${MAX_POSTS:-10}"

      - name: Publish carousels to Threads
        id: publish_carousels
        if: steps.queue.outputs.has_posts == 'true'
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_GRAPH_API_VERSION: ${{ vars.THREADS_GRAPH_API_VERSION }}
          THREADS_PUBLISHING_ENABLED: ${{ vars.THREADS_PUBLISHING_ENABLED }}
        run: node automation/threads-carousel/cli.mjs publish

      - name: Commit publication state
        if: always() && steps.queue.outputs.has_posts == 'true'
        run: |
          git add -- automation/threads-carousel/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record Threads carousel publication [skip threads]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload sanitized run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-carousel-publish-${{ github.run_id }}
          path: .artifacts/threads-carousel/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce publisher process result
        if: always() && steps.publish_carousels.outcome == 'failure'
        run: |
          echo "::error::The Threads publisher failed. Inspect the sanitized run manifest."
          exit 1
