name: Hourly security briefing

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-security-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}

    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-content.txt

      - name: Install content dependencies
        run: pip install --requirement requirements-content.txt

      - name: Check publishing credentials
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing required Actions secret: OPENAI_API_KEY" >&2
            exit 1
          fi

      - name: Generate a source-grounded briefing
        run: python automation/generate_content.py

      - name: Detect content changes
        id: changes
        run: |
          if git diff --quiet -- _posts _data/content_automation.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.changes.outputs.changed == 'true'
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate the Jekyll build
        if: steps.changes.outputs.changed == 'true'
        run: bundle exec jekyll build

      - name: Commit and publish
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "shadowcontext-signal-bot"
          git config user.email "shadowcontext-signal-bot@users.noreply.github.com"
          git add _posts _data/content_automation.json
          git commit -m "Publish hourly security briefing"
          git pull --rebase origin main
          git push origin HEAD:main
