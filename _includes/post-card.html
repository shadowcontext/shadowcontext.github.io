{% assign post = include.post %}
<article class="story-card">
  <a class="card-image" href="{{ post.url | relative_url }}"><img src="{{ post.image | default: '/assets/img/editorial/home-hero.png' | relative_url }}" alt="{{ post.image_alt | default: post.title }}" loading="lazy"></a>
  <div class="card-content">
    <div class="story-meta"><span class="topic">{{ post.category | replace: '-', ' ' }}</span><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d %b %Y' }}</time></div>
    <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    <p>{{ post.description }}</p>
    <div class="story-footer"><span>{{ post.read_time | default: '6 min' }} read</span><a href="{{ post.url | relative_url }}" aria-label="Read {{ post.title }}">Read <b>↗</b></a></div>
  </div>
</article>
