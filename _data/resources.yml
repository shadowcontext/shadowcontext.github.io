categories:
  - key: grc
    label: GRC
    index: "01"
    description: Risk, control, assessment, and compliance-as-code resources for building defensible governance programs.
  - key: benchmarking
    label: Benchmarking
    index: "02"
    description: Public baselines and open tooling for measuring system configuration against security expectations.
  - key: standards
    label: Standards
    index: "03"
    description: Freely accessible standards and verification models for incident response, architecture, and secure delivery.
  - key: dfir
    label: Digital forensics
    index: "04"
    description: Open-source acquisition, memory, disk, event, and timeline analysis tools for DFIR workflows.
  - key: osint
    label: OSINT
    index: "05"
    description: Open-source discovery and enrichment utilities for lawful research using publicly available information.
  - key: tools
    label: Security tools
    index: "06"
    description: Open-source detection, network analysis, threat sharing, reverse engineering, and security testing utilities.

resources:
  - name: NIST Cybersecurity Framework 2.0
    category: grc
    type: Framework
    access: Public guidance
    url: https://www.nist.gov/cyberframework
    description: Outcome-based guidance for governing, identifying, protecting, detecting, responding to, and recovering from cyber risk.
    audience: GRC · Security leaders
    tags: nist csf governance risk maturity profiles controls
  - name: NIST Risk Management Framework
    category: grc
    type: Framework
    access: Public guidance
    url: https://csrc.nist.gov/projects/risk-management/about-rmf
    description: A seven-step lifecycle for categorizing systems, selecting controls, assessing implementation, and monitoring risk.
    audience: GRC · System owners
    tags: nist rmf authorization assessment monitoring controls
  - name: NIST OSCAL
    category: grc
    type: Data model
    access: Open source
    url: https://pages.nist.gov/OSCAL/
    description: Machine-readable XML, JSON, and YAML models for control catalogs, profiles, implementations, and assessments.
    audience: GRC · Security engineers
    tags: oscal compliance automation json yaml xml controls
  - name: CISA Cybersecurity Performance Goals
    category: grc
